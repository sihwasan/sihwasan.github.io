<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대시보드 - 시화산노회</title>
<link rel="stylesheet" href="css/style.css?v=20260831f">
</head>
<body>

<div class="page-head">
  <div class="container">
    <h1>대시보드</h1>
    <div class="crumb">홈 &gt; 대시보드</div>
  </div>
</div>

<main class="page-body container" id="main">
  <div id="db-area"><p style="color:var(--gray-5)">불러오는 중...</p></div>
</main>

<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-auth.js"></script>
<script src="js/main.js?v=20260830d"></script>
<script src="js/dashboard.js"></script>
<script src="js/board.js?v=20260830p"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  /* 신임 노회장으로 지명받은 분에게는 취임 서약 카드를 맨 위에 띄운다 */
  function checkHandover(user) {
    if (!user || !user.cloud || !window.SHSCloud || !SHSCloud.enabled()) return;
    SHSCloud.init().then(function (c) {
      return c.from('handovers').select('*').eq('to_user', user.id).eq('status', '요청').limit(1);
    }).then(function (r) {
      var hd = r && r.data && r.data[0];
      if (!hd) return;
      var e = SHS.esc;
      var div = document.createElement('div');
      div.className = 'admin-card';
      div.style.cssText = 'max-width:820px;margin:0 auto 22px;border-left:4px solid var(--navy)';
      div.innerHTML = '<h3 style="margin:0 0 8px">노회장 취임 서약</h3>' +
        '<p style="margin:0 0 12px;line-height:1.7">' + e(hd.from_name || '전임 노회장') +
        ' 노회장께서 회원님을 <strong>신임 노회장</strong>으로 지명하시고 권한 위임을 요청하셨습니다. ' +
        '아래 서약에 동의하시면 수락과 동시에 노회장 권한이 부여됩니다.</p>' +
        '<label style="display:flex;gap:8px;margin:0 0 8px;font-size:0.92rem;cursor:pointer">' +
        '<input type="checkbox" id="ho-oath1" style="margin-top:3px">' +
        '<span>노회장의 직무를 노회규칙에 따라 성실히 수행하겠습니다.</span></label>' +
        '<label style="display:flex;gap:8px;margin:0 0 14px;font-size:0.92rem;cursor:pointer">' +
        '<input type="checkbox" id="ho-oath2" style="margin-top:3px">' +
        '<span>직무상 알게 되는 회원 개인정보와 노회 기밀을 보호하며, 퇴임 후에도 비밀을 유지하겠습니다.</span></label>' +
        '<button class="btn" id="ho-accept">서약하고 수락</button> ' +
        '<button class="btn ghost" id="ho-decline">사양</button>' +
        '<div class="form-msg" id="ho-msg"></div>';
      var area = document.getElementById('db-area');
      area.parentNode.insertBefore(div, area);

      div.querySelector('#ho-accept').addEventListener('click', function () {
        var m = div.querySelector('#ho-msg');
        if (!div.querySelector('#ho-oath1').checked || !div.querySelector('#ho-oath2').checked) {
          m.className = 'form-msg err';
          m.textContent = '두 서약 모두에 동의하셔야 수락할 수 있습니다.';
          return;
        }
        if (!confirm('노회장 권한 위임을 수락하시겠습니까?')) return;
        SHSCloud.init().then(function (c) {
          return c.rpc('accept_handover', { p_id: hd.id, p_oaths: [
            { k: 'duty', t: '직무 성실 수행 서약', agreed: true },
            { k: 'privacy', t: '개인정보 보호·비밀 유지 서약', agreed: true }
          ] });
        }).then(function (res) {
          if (res.error) { m.className = 'form-msg err'; m.textContent = res.error.message; return; }
          div.innerHTML = '<h3 style="margin:0 0 8px">취임을 축하드립니다</h3>' +
            '<p style="margin:0;line-height:1.75">' + e(user.name || '') +
            ' 신임 노회장님, 취임을 진심으로 축하드립니다. ' +
            '노회장 권한(서류 발급 승인, 임원방 관리)이 부여되었습니다.<br>' +
            e(hd.from_name || '전임 노회장') + ' 전임 노회장님께는 감사 인사가 전해졌고, ' +
            '증경노회장단에 모셨습니다.<br>' +
            '<a href="mypage.html" style="text-decoration:underline">내 정보</a>에서 ' +
            '노회장 도장을 등록해 주시기 바랍니다. 화면을 새로 고치면 새 권한이 적용됩니다.</p>';
        });
      });
      div.querySelector('#ho-decline').addEventListener('click', function () {
        var why = prompt('사양 사유를 남기시겠습니까? (선택)', '');
        if (why === null) return;
        SHSCloud.init().then(function (c) {
          return c.rpc('cancel_handover', { p_id: hd.id, p_note: why.trim() || null });
        }).then(function (res) {
          if (res.error) { alert(res.error.message); return; }
          div.remove();
        });
      });
    }).catch(function () {});
  }

  SHS.getUser().then(function (user) {
    /* 정회원에게는 종합 대시보드를, 그 밖에는 상비부 대시보드만 보여 준다.
     * (상비부 대시보드가 스스로 안내문을 띄운다) */
    if (SHSBoard.can(user)) SHSBoard.mount(document.getElementById('db-area'), user, { full: true });
    else SHSDash.mount(document.getElementById('db-area'), user);
    checkHandover(user);
  });
});
</script>
</body>
</html>
