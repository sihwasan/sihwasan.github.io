<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대시보드 - 시화산노회</title>
<link rel="stylesheet" href="css/style.css?v=20260829j">
</head>
<body>

<div class="page-head">
  <div class="container">
    <h1>대시보드</h1>
    <div class="crumb">홈 &gt; 대시보드</div>
  </div>
</div>

<main class="page-body container" id="main">
  <div id="db-area"><p style="color:var(--gray-5)">불러오는 중...</p></div>
</main>

<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-auth.js"></script>
<script src="js/main.js?v=20260829i"></script>
<script src="js/dashboard.js"></script>
<script src="js/board.js?v=20260829g"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  SHS.getUser().then(function (user) {
    /* 정회원에게는 종합 대시보드를, 그 밖에는 상비부 대시보드만 보여 준다.
     * (상비부 대시보드가 스스로 안내문을 띄운다) */
    if (SHSBoard.can(user)) SHSBoard.mount(document.getElementById('db-area'), user, { full: true });
    else SHSDash.mount(document.getElementById('db-area'), user);
  });
});
</script>
</body>
</html>
