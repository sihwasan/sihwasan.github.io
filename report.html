<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교회상황 보고서 - 시화산노회</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/style.css?v=20260902a">
<style>
/* ---------- 작성 화면 ---------- */
.rf-sec { margin: 0 0 18px; }
.rf-sec h3 { margin: 0 0 4px; color: var(--navy); font-size: 1.02rem; }
.rf-sec .rf-hint { font-size: 0.8rem; color: var(--gray-5); margin: 0 0 10px; }
.rf-tbl { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
.rf-tbl th, .rf-tbl td { border: 1px solid var(--gray-3, #d8dbe2); padding: 4px 6px; text-align: center; }
.rf-tbl th { background: var(--gray-1, #f4f5f8); font-weight: 600; color: var(--gray-7); }
.rf-tbl input { width: 100%; min-width: 0; border: none; background: transparent; text-align: center; font: inherit; padding: 4px 2px; }
.rf-tbl input:focus { outline: 2px solid var(--navy); border-radius: 3px; }
.rf-tbl .sum { background: var(--gray-1, #f4f5f8); font-weight: 700; }
.rf-tbl .rowh { background: var(--gray-1, #f4f5f8); font-weight: 600; }
.rf-scroll { overflow-x: auto; }
.rf-bar { position: sticky; bottom: 0; background: var(--white, #fff); border-top: 1px solid var(--gray-3, #d8dbe2);
  padding: 12px 20px; margin-top: 18px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; z-index: 5;
  border-radius: 0 0 12px 12px; }
.rf-seal-tip { font-size: 0.82rem; color: var(--gray-6); }
.rf-seal-tip img { height: 34px; vertical-align: middle; margin-left: 6px; }

/* ---------- 종이 문서 (미리보기·인쇄) ---------- */
#sheet-wrap { display: none; }
#sheet-wrap.show { display: block; }
.sheet { background: #fff; color: #111; max-width: 800px; margin: 0 auto; padding: 46px 50px;
  border: 1px solid var(--gray-3, #ddd); box-shadow: 0 2px 12px rgba(0,0,0,.08);
  font-family: "Batang", "바탕", "Noto Serif KR", serif; font-size: 12px; line-height: 1.5; }
.sheet h1 { text-align: center; font-size: 26px; letter-spacing: 14px; margin: 0 0 20px; font-weight: 700; }
.sheet .s-tbl { width: 100%; border-collapse: collapse; margin: 4px 0 12px; }
.sheet .s-tbl th, .sheet .s-tbl td { border: 1px solid #333; padding: 3px 5px; text-align: center; font-weight: 400; font-size: 11.5px; }
.sheet .s-tbl th { background: #f2f2f2; }
.sheet .s-h { font-weight: 700; font-size: 13px; margin: 14px 0 2px; }
.sheet .s-head-line { display: flex; justify-content: space-between; align-items: flex-end; margin: 10px 0 4px; }
.sheet .s-close { text-align: center; margin-top: 26px; }
.sheet .s-stamp-line { text-align: center; font-size: 15px; font-weight: 700; margin-top: 18px; }
.sheet .s-seal-spot { position: relative; display: inline-block; }
/* 직인: (직인) 글자 위에 겹쳐 찍는다. transform은 PDF 변환과 충돌해 여백 방식으로 잡고,
 * 미리보기에서는 끌어서 위치를 옮길 수 있다. */
.sheet .s-seal-spot img.stamp { position: absolute; left: 50%; top: 50%;
  height: 64px; width: auto; max-width: none; opacity: 0.92; cursor: move; touch-action: none; }
.sheet .s-note { font-size: 10.5px; color: #333; }
/* 인쇄할 때 표 머리칸 음영이 사라지지 않게 배경색을 그대로 찍는다 */
.sheet, .sheet * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
/* 여러 보고서 일괄 인쇄: 화면에서는 사이를 띄우고, 인쇄에서는 한 장씩 나눠 찍는다 */
#sheet-wrap .sheet + .sheet { margin-top: 24px; }
@media print {
  .sheet { page-break-after: always; }
  .sheet:last-child { page-break-after: auto; }
}
@media print {
  .sheet, .sheet * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  body > *:not(#sheet-wrap) { display: none !important; }
  #sheet-wrap { display: block !important; }
  /* 인쇄를 PDF 저장 결과와 같게 맞춘다:
   * PDF는 폭 800px(+여백 50px×2)의 서식을 A4에 8mm 여백으로 줄여 담는다.
   * 인쇄도 같은 폭·같은 축소 비율(194mm ÷ 902px ≈ 0.813)로 찍는다. */
  .sheet { border: none; box-shadow: none; margin: 0; width: 800px; max-width: none;
    padding: 46px 50px; zoom: 0.813; }
  .sheet-tools { display: none !important; }
  @page { size: A4 portrait; margin: 8mm; }
}
.sheet-tools { max-width: 800px; margin: 0 auto 12px; display: flex; gap: 8px; }
</style>
</head>
<body>

<div class="page-head">
  <div class="container">
    <h1>교회상황 보고서</h1>
    <div class="crumb">홈 &gt; 자료실 &gt; 교회상황 보고서</div>
  </div>
</div>

<main class="page-body container" id="main">
  <div id="rp-area"><p style="color:var(--gray-5)">불러오는 중...</p></div>
</main>

<div id="sheet-wrap"></div>

<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-auth.js"></script>
<script src="js/main.js?v=20260902j"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
 SHS.getUser().then(function (user) {
  'use strict';
  var area = document.getElementById('rp-area');
  var e = SHS.esc;

  var gate = SHS.memberGate(user, '교회상황 보고서');
  if (gate) { area.innerHTML = gate; return; }
  /* 언권회원은 보고서를 작성할 수 없다. 양식 내려받기만 안내한다. */
  if (user.role === 'advisory') {
    area.innerHTML = SHS.fullMemberGate(user, '교회상황 보고서 작성') +
      '<div class="admin-card" style="max-width:640px"><h3 style="margin-top:0">교회상황보고서 양식</h3>' +
      '<p style="font-size:0.9rem">한글(HWPX) 양식은 내려받으실 수 있습니다. 작성과 제출은 ' +
      '담임목사(정회원)께 부탁해 주세요.</p>' +
      '<p style="margin:0"><a class="btn" href="data/church-report-form.hwpx" ' +
      'download="교회상황보고서 양식.hwpx" ' +
      'style="background:#b03a3a;border-color:#b03a3a;color:#fff">&#11015;&#65039; 한글 양식 내려받기 (.hwpx)</a></p></div>';
    return;
  }
  if (!user.cloud || !window.SHSCloud || !SHSCloud.enabled()) {
    area.innerHTML = '<div class="notice-banner">서버 로그인(구글 또는 이메일) 후 이용할 수 있습니다.</div>';
    return;
  }

  function db() { return SHSCloud.init(); }

  function qs(k) {
    var m = location.search.match(new RegExp('[?&]' + k + '=([^&]*)'));
    return m ? decodeURIComponent(m[1]).replace(/\+/g, ' ') : '';
  }
  function num(v) { var n = parseInt(String(v == null ? '' : v).replace(/[^\d-]/g, ''), 10); return isNaN(n) ? 0 : n; }
  function comma(n) { return n ? Number(n).toLocaleString('ko-KR') : ''; }
  function today() { return new Date().toISOString().slice(0, 10); }
  function chKey(s) { return String(s || '').replace(/\s|교회$/g, ''); }

  /* ---------- 무엇을 할지 정한다 ---------- */
  var VIEW_ID = num(qs('id')) || null;                 /* 저장된 보고서 열람 */
  /* 시찰 화면에서 여러 보고서를 골라 한 번에 인쇄 (?ids=1,2,3&print=1) */
  var VIEW_IDS = qs('ids').split(',').map(num).filter(Boolean);
  var CHURCH = qs('church') || user.church || '';      /* 작성 대상 교회 */
  var YEAR = num(qs('year')) || new Date().getFullYear();

  /* ---------- 양식 구성표 ---------- */
  var CLERGY = [
    ['damim', '담임'], ['wonro', '원로'], ['bumok', '부목사(파트 포함)'], ['hyup', '협동'],
    ['gita', '기타'], ['gangdosa', '강도사'], ['jd_m', '전도사 남'], ['jd_f', '전도사 여']
  ];
  var JEJIK = [
    ['jr_simu', '장로 시무'], ['jr_wonro', '장로 원로'], ['jr_euntoe', '장로 은퇴'],
    ['jr_hyup', '장로 협동'], ['jr_gita', '장로 기타'],
    ['as_simu', '안수집사 시무'], ['as_gita', '안수집사 기타'],
    ['ks_simu', '권사 시무'], ['ks_gita', '권사 기타'],
    ['ss_m', '서리집사 남'], ['ss_f', '서리집사 여']
  ];
  var DEPTS = ['유아부', '유치부', '유년부', '초등부', '중등부', '고등부', '대학부', '청년부', '장년부', '노년부'];
  var MCOLS = [['tm', '전체 남'], ['tf', '전체 여'], ['cm', '교사 남'], ['cf', '교사 여'],
    ['bm', '유아세례 남'], ['bf', '유아세례 여'], ['hm', '학습 남'], ['hf', '학습 여'],
    ['sm', '세례 남'], ['sf', '세례 여']];
  var FIN_IN = [['carry', '전년이월'], ['offer', '헌금 (십일조·주일·감사·절기 등)'],
    ['special', '특별헌금 (건축 등)'], ['mission', '선교·구제헌금'], ['etc', '기타수입']];
  var FIN_OUT = [['oper', '교회운영비 (행정비·예배비)'], ['labor', '인건비 (사례비 등)'],
    ['mission', '선 교 비'], ['edu', '교 육 비'], ['reserve', '예 비 비'], ['carry', '차년도이월금']];
  var ASSET_ROWS = [
    { cat: '부동산', n: 4 }, { cat: '임대보증금', n: 1 }, { cat: '차량', n: 3 }
  ];

  var record = null;       /* 서버에 저장된 줄 */
  var mySeal = null;       /* 내 직인 (data URL) */
  var sealOn = true;       /* 직인을 찍을지 (선택) */
  var sealPos = { dx: 0, dy: 0 };   /* 미리보기에서 끌어 옮긴 직인 위치 */
  var meRow = null;        /* 명단에서 찾은 나 */
  var pastorRow = null;    /* 이 교회의 담임목사 (명단) */
  var prevRecord = null;   /* 지난해 보고서 — 새 해에는 이 내용을 미리 채워 준다 */
  var SICHAL = '';

  /* ---------- 불러오기 ---------- */
  function load() {
    db().then(function (c) {
      var jobs = [
        c.rpc('my_member').then(null, function () { return { data: null }; }),
        c.from('member_seals').select('image').eq('user_id', user.id).eq('kind', 'church')
          .then(null, function () { return { data: null }; })
      ];
      if (VIEW_IDS.length) {
        jobs.push(c.from('church_reports').select('*').in('id', VIEW_IDS).order('church'));
      } else if (VIEW_ID) {
        jobs.push(c.from('church_reports').select('*').eq('id', VIEW_ID));
      } else {
        jobs.push(c.from('church_reports').select('*').eq('year', YEAR).eq('church', CHURCH));
        jobs.push(c.from('roster').select('name,church,position,category,sichal,address,postcode,phone,email')
          .eq('category', '목사').eq('active', true));
        /* 지난 해 보고서: 새 해에 그대로 이어받아 몇 가지만 고치면 되게 한다 */
        jobs.push(c.from('church_reports').select('*').eq('church', CHURCH).lt('year', YEAR)
          .order('year', { ascending: false }).limit(1)
          .then(null, function () { return { data: null }; }));
      }
      return Promise.all(jobs);
    }).then(function (rs) {
      meRow = rs[0].data && rs[0].data[0] || null;
      mySeal = rs[1].data && rs[1].data[0] ? rs[1].data[0].image : null;

      if (VIEW_IDS.length) {
        renderDocs((rs[2] && rs[2].data) || []);
        return;
      }

      if (VIEW_ID) {
        record = rs[2].data && rs[2].data[0];
        if (!record) {
          area.innerHTML = '<div class="notice-banner">보고서를 찾을 수 없거나 열람 권한이 없습니다.</div>';
          return;
        }
        renderDoc(record);
        return;
      }

      record = rs[2].data && rs[2].data[0] || null;
      prevRecord = rs[4] && rs[4].data && rs[4].data[0] || null;
      var pastors = rs[3] && rs[3].data || [];
      pastorRow = pastors.filter(function (m) { return chKey(m.church) === chKey(CHURCH); })[0] || null;
      SICHAL = (record && record.sichal) || (pastorRow && pastorRow.sichal) ||
               (meRow && meRow.out_church === CHURCH ? '' : '') || '';
      if (!SICHAL) {
        /* 시찰을 명단에서 못 찾으면 내 시찰이라도 쓴다 */
        SICHAL = qs('sichal') || '';
      }
      renderForm();
    }).catch(function (x) {
      area.innerHTML = '<div class="notice-banner">불러오지 못했습니다: ' + e((x && x.message) || String(x)) + '</div>';
    });
  }

  /* ================================================================
   *  작성 화면
   * ================================================================ */
  function numCell(id, val, w) {
    return '<td' + (w ? ' style="width:' + w + '"' : '') +
      '><input type="text" inputmode="numeric" id="' + id + '" value="' + (val || '') + '"></td>';
  }
  function txtCell(id, val) {
    return '<td><input type="text" id="' + id + '" value="' + e(val || '') + '"></td>';
  }
  function g(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
  function gn(id) { return num(g(id)); }

  function renderForm() {
    if (!CHURCH) {
      area.innerHTML = '<div class="notice-banner">소속 교회가 없습니다. <a href="mypage.html">내 정보</a>에서 소속 교회를 먼저 채워 주세요.</div>';
      return;
    }
    var d = (record && record.data) || {};
    /* 그 해 보고서가 아직 없으면 지난해 내용을 그대로 이어받는다.
     * 대부분 그대로 두고 바뀐 몇 가지만 고치면 된다. */
    var carried = false;
    if (!record && prevRecord && prevRecord.data) {
      d = JSON.parse(JSON.stringify(prevRecord.data));
      d.date = '';   /* 보고일은 새로 적는다 */
      carried = true;
    }
    /* 저장본에 담긴 직인 사용 여부·위치를 되살린다 */
    if (d._seal) {
      sealOn = d._seal.on !== false;
      sealPos = { dx: Number(d._seal.dx) || 0, dy: Number(d._seal.dy) || 0 };
    }
    var head = d.head || {};
    var addr = d.addr || {};
    var clergy = d.clergy || {};
    var jejik = d.jejik || {};
    var members = d.members || {};
    var family = d.family || { rows: [] };
    var fin = d.fin || { 'in': {}, out: {} };
    var assets = d.assets || [];
    var support = d.support || { rows: [], mis: [] };

    /* 처음 쓰는 보고서라면 명단에서 미리 채운다 */
    var preAddr = addr.ch || (pastorRow && pastorRow.address) || (meRow && meRow.out_address) || '';
    var prePastor = head.pastor || (pastorRow && pastorRow.name) ||
      (user.position && user.position.indexOf('목사') !== -1 ? user.name : '');
    var preTel = addr.tel || (pastorRow && pastorRow.phone) || '';
    var preMobile = addr.mobile || (meRow && meRow.out_phone) || '';
    var preEmail = addr.email || user.email || '';

    var h = '';
    h += '<div class="notice-banner"><strong>' + YEAR + '년 ' + e(CHURCH) + '</strong> 교회상황 보고서' +
      (record ? ' — 제출된 내용을 고치고 있습니다.'
        : carried ? ' — <strong>' + prevRecord.year + '년 보고서 내용을 그대로 가져왔습니다.</strong> ' +
          '바뀐 부분만 고친 뒤 저장·제출해 주세요.' : '') + '</div>';

    /* 한글 파일(HWPX)로 자동 입력 */
    h += '<div class="admin-card rf-sec"><h3>&#128196; 한글 파일(HWPX)로 자동 입력</h3>' +
      '<p class="rf-hint">아래에서 노회 서식(한글 파일)을 내려받아 작성하신 뒤 올리면 ' +
      '아래 항목들이 자동으로 채워집니다. 파일은 <strong>반드시 HWPX 형식</strong>으로 올려 주세요. ' +
      '한글에서 <strong>파일 → 다른 이름으로 저장 → 파일 형식: HWPX 문서(*.hwpx)</strong>를 고르시면 됩니다.</p>' +
      '<p style="margin:0 0 12px"><a class="btn sm" href="data/church-report-form.hwpx" ' +
      'download="교회상황보고서 양식.hwpx" ' +
      'style="background:#b03a3a;border-color:#b03a3a;color:#fff">' +
      '&#11015;&#65039; 한글 양식 내려받기 (.hwpx)</a></p>' +
      '<div class="field"><input type="file" id="rp-hwpx" accept=".hwpx"></div>' +
      '<p class="rf-hint">채워진 내용을 확인하고 고치신 뒤 맨 아래 <strong>저장하기</strong> 또는 ' +
      '<strong>시찰 서기에게 제출</strong>을 누르시면 기록됩니다.</p>' +
      '<div class="form-msg" id="rp-hwpx-msg"></div></div>';

    /* ① 기본 정보 */
    h += '<div class="admin-card rf-sec"><h3>① 기본 정보</h3>' +
      '<div class="inline-form">' +
      '<div class="field" style="flex:0 0 130px"><label>보고 연도</label><select id="rp-year">' +
      (function () {
        var out = '', now2 = new Date().getFullYear();
        for (var y2 = now2 + 1; y2 >= now2 - 4; y2--) {
          out += '<option value="' + y2 + '"' + (y2 === YEAR ? ' selected' : '') + '>' + y2 + '년</option>';
        }
        return out;
      })() + '</select></div>' +
      '<div class="field" style="flex:0 0 160px"><label>보고일</label><input type="date" id="f-date" value="' + e(d.date || today()) + '"></div>' +
      '<div class="field" style="flex:0 0 180px"><label>교회명</label><input type="text" value="' + e(CHURCH) + '" disabled></div>' +
      '<div class="field" style="flex:0 0 130px"><label>시찰</label><input type="text" id="f-sichal" value="' + e(SICHAL) + '"' + (SICHAL ? ' disabled' : ' placeholder="예: 남부시찰"') + '></div>' +
      '</div>' +
      '<div class="inline-form">' +
      '<div class="field" style="flex:0 0 160px"><label>담임교역자</label><input type="text" id="f-pastor" value="' + e(prePastor) + '"></div>' +
      '<div class="field" style="flex:0 0 140px"><label>구분</label><select id="f-ptype">' +
      (function () {
        var opts = ['위임', '시무', '강도사', '전도사'];
        if (head.ptype && opts.indexOf(head.ptype) < 0) opts.push(head.ptype);
        return opts.map(function (x) {
          return '<option' + ((head.ptype || '위임') === x ? ' selected' : '') + '>' + x + '</option>';
        }).join('');
      })() + '</select></div>' +
      '<div class="field" style="flex:0 0 200px"><label>주민등록번호 (선택)</label><input type="text" id="f-prrn" value="' + e(head.prrn || '') + '" placeholder="인쇄 후 자필 기입 가능"></div>' +
      '</div>' +
      '<div class="inline-form">' +
      '<div class="field" style="flex:0 0 140px"><label>당회 구성</label><select id="f-danghoi">' +
      ['조직', '미조직'].map(function (x) { return '<option' + ((head.danghoi || '조직') === x ? ' selected' : '') + '>' + x + '</option>'; }).join('') +
      '</select></div>' +
      '<div class="field" style="flex:0 0 140px"><label>재정</label><select id="f-finance">' +

  /* ----- PDF 저장: 종이 서식을 만들어 그대로 PDF로 뜬다 ----- */
  var pdfLoading = null;
  function loadPdfTool() {

      sc.onload = function () { resolve(window.html2pdf); };
      sc.onerror = function () { pdfLoading = null; reject(new Error('PDF 도구를 불러오지 못했습니다.')); };
      document.head.appendChild(sc);
    });
    return pdfLoading;
  }
  function savePdf() {

    function done() { btn.disabled = false; btn.textContent = 'PDF 저장'; }
    var wrap = document.getElementById('sheet-wrap');
    wrap.innerHTML = buildSheet(collect(), mySeal);
    wrap.classList.add('show');
    var target = wrap.querySelector('.sheet') || wrap;
    var keepY = window.scrollY;
    window.scrollTo(0, 0);
    loadPdfTool().then(function (html2pdf) {
      return html2pdf().set({
        margin: 8,

        html2canvas: { scale: 2, backgroundColor: '#ffffff', scrollX: 0, scrollY: 0 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      }).from(target).save();
    }).then(function () {
      done(); wrap.classList.remove('show'); wrap.innerHTML = '';
      window.scrollTo(0, keepY);
    }).catch(function (err) {
      done(); wrap.classList.remove('show'); wrap.innerHTML = '';
      window.scrollTo(0, keepY);
      msg.className = 'form-msg err'; msg.textContent = (err && err.message) || String(err);
    });

  /* ================================================================
   *  HWPX 자동 입력
   *  HWPX는 XML을 담은 압축(zip) 파일이다. 압축을 풀어
   *  Contents/section*.xml 안의 표를 (행,열)=글 그리드로 만들고,
   *  노회 서식의 표 배치에 맞춰 항목을 찾아 채운다.
   * ================================================================ */
  var zipLoading = null;
  function loadZipTool() {
    if (window.JSZip) return Promise.resolve(window.JSZip);
    if (zipLoading) return zipLoading;
    zipLoading = new Promise(function (resolve, reject) {
      var sc = document.createElement('script');
      sc.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
      sc.onload = function () { resolve(window.JSZip); };
      sc.onerror = function () { zipLoading = null; reject(new Error('압축 해제 도구를 불러오지 못했습니다.')); };
      document.head.appendChild(sc);
    });
    return zipLoading;
  }

  /* section XML의 표들을 { '행,열': 글 } 그리드 목록으로 만든다 */
  function hwpxGrids(xmlText) {
    var doc = new DOMParser().parseFromString(xmlText, 'text/xml');
    var all = doc.getElementsByTagName('*');
    var tbls = [], i;
    for (i = 0; i < all.length; i++) if (all[i].localName === 'tbl') tbls.push(all[i]);
    return tbls.map(function (tbl) {
      var grid = {};
      var els = tbl.getElementsByTagName('*');
      for (var j = 0; j < els.length; j++) {
        if (els[j].localName !== 'tc') continue;
        var tc = els[j], addr = null, txt = [];
        var kids = tc.getElementsByTagName('*');
        for (var k = 0; k < kids.length; k++) {
          if (kids[k].localName === 'cellAddr') addr = kids[k];
          else if (kids[k].localName === 't') txt.push(kids[k].textContent);
        }
        if (!addr) continue;
        grid[addr.getAttribute('rowAddr') + ',' + addr.getAttribute('colAddr')] =
          txt.join('').replace(/\s+/g, ' ').trim();
      }
      return grid;
    });
  }

  function importHwpx(file, after) {
    var msg = document.getElementById('rp-hwpx-msg');
    function say(t, err) { msg.className = 'form-msg' + (err ? ' err' : ' ok'); msg.textContent = t; }
    if (!/\.hwpx$/i.test(file.name)) {
      say('HWPX 파일이 아닙니다. 한글에서 다른 이름으로 저장 → HWPX 문서(*.hwpx)로 저장해 올려 주세요.', true);
      return;
    }
    msg.className = 'form-msg'; msg.textContent = '파일을 분석하는 중입니다...';
    loadZipTool().then(function (JSZip) {
      return JSZip.loadAsync(file);
    }).then(function (zip) {
      var names = Object.keys(zip.files).filter(function (n) {
        return /^Contents\/section\d+\.xml$/i.test(n);
      }).sort();
      if (!names.length) throw new Error('본문(section)을 찾을 수 없습니다. 올바른 HWPX 파일인지 확인해 주세요.');
      return Promise.all(names.map(function (n) { return zip.files[n].async('string'); }));
    }).then(function (xmls) {
      var grids = [];
      var fullText = '';
      xmls.forEach(function (x) {
        grids = grids.concat(hwpxGrids(x));
        fullText += x.replace(/<[^>]+>/g, ' ');
      });
      var n = fillFromHwpx(grids, fullText);
      if (after) after();
      if (!n) {
        say('노회 서식의 표를 찾지 못해 채우지 못했습니다. 노회 서식(hwpx)으로 작성한 파일인지 확인해 주세요.', true);
        return;
      }
      /* 파일 속 교회명이 지금 작성 중인 교회와 다르면 알려 준다 */
      var warn = '';
      var tAddr2 = grids.filter(function (g) { return gHas(g, /노회명/); })[0];
      if (tAddr2) {
        var fileCh = gRight(tAddr2, /^교회명$/);
        if (fileCh && chKey(fileCh) !== chKey(CHURCH)) {
          warn = ' (주의: 파일의 교회명은 "' + fileCh + '"입니다. 지금은 ' + CHURCH + ' 보고서를 작성 중입니다.)';
        }
      }
      say('파일에서 ' + n + '개 항목을 자동으로 채웠습니다. 내용을 확인하신 뒤 저장·제출해 주세요.' + warn, !!warn);
    }).catch(function (x) {
      say('분석하지 못했습니다: ' + ((x && x.message) || x) +
        ' — HWP 형식이라면 한글에서 HWPX로 다시 저장해 주세요.', true);
    });
  }

  /* ----- 그리드에서 자리 찾기 도우미 ----- */
  function gHas(g, re) {
    return Object.keys(g).some(function (k) { return re.test(g[k]); });
  }
  function gPos(g, re) {
    var best = null;
    Object.keys(g).forEach(function (k) {
      if (!re.test(g[k])) return;
      var p = k.split(',');
      var r = +p[0], c = +p[1];
      if (!best || r < best.r || (r === best.r && c < best.c)) best = { r: r, c: c };
    });
    return best;
  }
  /* 라벨 오른쪽의 첫 칸 값 */
  function gRight(g, re) {
    var p = gPos(g, re);
    if (!p) return null;
    for (var c = p.c + 1; c <= p.c + 5; c++) {
      var v = g[p.r + ',' + c];
      if (v !== undefined) return v;
    }
    return null;
  }
  /* 라벨 아래 칸 값 (같은 열) */
  function gBelow(g, re, dr) {
    var p = gPos(g, re);
    if (!p) return null;
    var v = g[(p.r + (dr || 1)) + ',' + p.c];
    return v === undefined ? null : v;
  }

  /* 서식의 표들을 화면 입력칸에 채운다. 채운 칸 수를 돌려 준다. */
  function fillFromHwpx(grids, fullText) {
    var filled = 0;
    function put(id, v) {
      var el = document.getElementById(id);
      if (!el || v == null) return;
      v = String(v).trim();
      if (!v) return;
      if (el.tagName === 'SELECT') {
        var hit = false;
        for (var i = 0; i < el.options.length; i++) {
          if (el.options[i].value === v || el.options[i].text === v) { hit = true; break; }
        }
        if (!hit) return;
      }
      el.value = v;
      filled++;
    }
    function putNum(id, v) {
      if (v == null) return;
      var d = String(v).replace(/[^\d]/g, '');
      put(id, d);
    }

    /* 표를 서식 이름표로 알아본다 */
    function pick(re) {
      return grids.filter(function (g) { return gHas(g, re); })[0] || null;
    }
    var tAddr = pick(/노회명/);
    var tStaff = pick(/담임구분/);
    var tMem = pick(/유아부/);
    var tFam = pick(/교역자\s*사례비|월지급액/);
    var tFin = pick(/전년이월/);
    var tAsset = pick(/수량\(면적\)|임대보증금/);
    var tSup = pick(/선교사명/);

    /* ① 기본 정보 · ② 주소 */
    if (tAddr) {
      put('f-pastor', gBelow(tAddr, /^담임교역자$/));
      put('f-ptype', gBelow(tAddr, /^구분\(위임/));
      put('f-prrn', gBelow(tAddr, /^주민등록번호$/));
      put('f-danghoi', gBelow(tAddr, /^당회구성$/));
      put('f-finance', gBelow(tAddr, /^재\s*정$|^재정$/));
      put('f-region', gBelow(tAddr, /^지\s*역$|^지역$/));
      put('f-achurch', gRight(tAddr, /^교회주소$/));
      put('f-amanse', gRight(tAddr, /^사택주소$/));
      /* 전화는 교회주소 줄과 사택주소 줄에 하나씩 있다 */
      var chRow = gPos(tAddr, /^교회주소$/), mnRow = gPos(tAddr, /^사택주소$/);
      Object.keys(tAddr).forEach(function (k) {
        var p = k.split(','), r = +p[0], c = +p[1], v = tAddr[k];
        function rightVal() {
          for (var c2 = c + 1; c2 <= c + 5; c2++) {
            if (tAddr[r + ',' + c2] !== undefined) return tAddr[r + ',' + c2];
          }
          return null;
        }
        /* 전화 칸은 교회주소 줄과 사택주소 줄에 하나씩 — 사택주소 줄 아래면 사택 전화다 */
        if (/^전\s*화$/.test(v)) {
          if (mnRow && r >= mnRow.r) put('f-amtel', rightVal());
          else if (chRow && r >= chRow.r) put('f-atel', rightVal());
        }
        if (/^팩\s*스$/.test(v)) put('f-afax', rightVal());
        if (/^홈페이지$/.test(v)) put('f-ahome', rightVal());
        if (/^핸드폰$/.test(v)) put('f-amobile', rightVal());
        if (/^E-?mail$/i.test(v)) put('f-aemail', rightVal());
      });
    }

    /* ③ 교역자 수 · 제직자 수 */
    if (tStaff) {
      /* 교역자: 머리칸 라벨의 열을 찾아 두 줄 아래 값을 읽는다 */
      var cl = gPos(tStaff, /^담임구분$/);
      if (cl) {
        var vRow = cl.r + 2;
        [[/^담임구분$/, 'damim'], [/^원로$/, 'wonro'], [/^부목사/, 'bumok'],
         [/^협동$/, 'hyup'], [/^기타$/, 'gita'], [/^강도사$/, 'gangdosa']]
          .forEach(function (mch) {
            /* 교역자 머리줄(cl.r)에 있는 라벨만 본다 */
            var pos = null;
            Object.keys(tStaff).forEach(function (k) {
              var p = k.split(',');
              if (+p[0] === cl.r && mch[0].test(tStaff[k]) &&
                  (!pos || +p[1] < pos.c)) pos = { r: +p[0], c: +p[1] };
            });
            if (pos) putNum('f-c-' + mch[1], tStaff[vRow + ',' + pos.c]);
          });
        /* 전도사 남·여: 전도사 라벨 아래 줄의 남·여 열 */
        var jd = gPos(tStaff, /^전도사/);
        if (jd) {
          var cols = [];
          Object.keys(tStaff).forEach(function (k) {
            var p = k.split(',');
            if (+p[0] === jd.r + 1 && /^[남여]$/.test(tStaff[k]) && +p[1] >= jd.c) {
              cols.push({ c: +p[1], v: tStaff[k] });
            }
          });
          cols.sort(function (a, b) { return a.c - b.c; });
          if (cols[0]) putNum('f-c-jd_m', tStaff[vRow + ',' + cols[0].c]);
          if (cols[1]) putNum('f-c-jd_f', tStaff[vRow + ',' + cols[1].c]);
        }
      }
      /* 제직: 장로 줄 아래 머리줄의 라벨을 순서대로 값과 짝지운다 */
      var jr = gPos(tStaff, /^장\s*로$/);
      if (jr) {
        var hRow = jr.r + 1, vRow2 = jr.r + 2;
        var heads = [];
        Object.keys(tStaff).forEach(function (k) {
          var p = k.split(',');
          if (+p[0] === hRow && tStaff[k]) heads.push({ c: +p[1], v: tStaff[k] });
        });
        heads.sort(function (a, b) { return a.c - b.c; });
        var JKEYS = ['jr_simu', 'jr_wonro', 'jr_euntoe', 'jr_hyup', 'jr_gita',
                     'as_simu', 'as_gita', 'ks_simu', 'ks_gita', 'ss_m', 'ss_f'];
        heads.slice(0, JKEYS.length).forEach(function (hd, i) {
          putNum('f-j-' + JKEYS[i], tStaff[vRow2 + ',' + hd.c]);
        });
      }
    }

    /* ④ 교인수: 부서 이름 줄을 찾아 1~10열을 그대로 읽는다 */
    if (tMem) {
      DEPTS.forEach(function (dp) {
        var p = gPos(tMem, new RegExp('^' + dp + '$'));
        if (!p) return;
        MCOLS.forEach(function (c, i) {
          putNum('f-m-' + dp + '-' + c[0], tMem[p.r + ',' + (i + 1)]);
        });
      });
    }

    /* ⑤ 교역자 가족 · 사례비 */
    if (tFam) {
      var hRel = gPos(tFam, /^관계$/), hName = gPos(tFam, /^성명$/),
          hSex = gPos(tFam, /^성별$/), hAge = gPos(tFam, /^연령$/),
          hJob = gPos(tFam, /직업/);
      var payRow = gPos(tFam, /사례비|월지급액/);
      if (hName) {
        var endR = payRow ? payRow.r : 99;
        var fi = 0;
        for (var r = hName.r + 1; r < endR && fi < 4; r++) {
          var nm = tFam[r + ',' + hName.c];
          var rel = hRel ? tFam[r + ',' + hRel.c] : '';
          if (!nm && !rel) continue;
          put('f-fam-rel-' + fi, rel);
          put('f-fam-name-' + fi, nm);
          if (hSex) put('f-fam-sex-' + fi, tFam[r + ',' + hSex.c]);
          if (hAge) putNum('f-fam-age-' + fi, tFam[r + ',' + hAge.c]);
          if (hJob) put('f-fam-job-' + fi, tFam[r + ',' + hJob.c]);
          fi++;
        }
      }
      putNum('f-pay-monthly', gRight(tFam, /^월지급액$/));
      putNum('f-pay-extra', gRight(tFam, /^기타지급액$/));
      /* 개월 칸: 월지급액 쪽이 먼저, 기타지급액 쪽이 다음 */
      if (payRow) {
        var mon = [];
        Object.keys(tFam).forEach(function (k) {
          var p2 = k.split(',');
          if (+p2[0] === payRow.r && /개월/.test(tFam[k])) mon.push({ c: +p2[1], v: tFam[k] });
        });
        mon.sort(function (a, b) { return a.c - b.c; });
        if (mon[0]) putNum('f-pay-mmon', mon[0].v);
        if (mon[1]) putNum('f-pay-emon', mon[1].v);
      }
    }

    /* ⑥ 교회 재정 */
    if (tFin) {
      [[/^전년이월$/, 'f-fi-carry'], [/^헌금/, 'f-fi-offer'], [/^특별헌금/, 'f-fi-special'],
       [/^선교[,·]\s*구제/, 'f-fi-mission'], [/^기타수입$/, 'f-fi-etc'],
       [/^교회운영비/, 'f-fo-oper'], [/^인건비/, 'f-fo-labor'], [/^선\s*교\s*비$/, 'f-fo-mission'],
       [/^교\s*육\s*비$/, 'f-fo-edu'], [/^예\s*비\s*비$/, 'f-fo-reserve'], [/^차년도이월/, 'f-fo-carry']]
        .forEach(function (mch) {
          var p = gPos(tFin, mch[0]);
          if (p) putNum(mch[1], tFin[p.r + ',' + (p.c + 1)]);
        });
    }

    /* ⑦ 교회 자산: 부동산 4줄 · 임대보증금 1줄 · 차량 3줄 순서 그대로 */
    if (tAsset) {
      var aStart = gPos(tAsset, /^부동산$/);
      if (aStart) {
        for (var ai = 0; ai < 8; ai++) {
          var r2 = aStart.r + ai;
          put('f-as-qty-' + ai, tAsset[r2 + ',1']);
          putNum('f-as-val-' + ai, tAsset[r2 + ',2']);
          put('f-as-use-' + ai, tAsset[r2 + ',3']);
          put('f-as-own-' + ai, tAsset[r2 + ',4']);
        }
      }
    }

    /* ⑧ 후원 · 선교사 */
    if (tSup) {
      var hNo = gPos(tSup, /^노회$/), hMi = gPos(tSup, /^선교사명$/);
      if (hNo) {
        for (var si = 0; si < 5; si++) {
          var r3 = hNo.r + 1 + si;
          put('f-su-nohoi-' + si, tSup[r3 + ',' + hNo.c]);
          put('f-su-church-' + si, tSup[r3 + ',' + (hNo.c + 1)]);
          put('f-su-pastor-' + si, tSup[r3 + ',' + (hNo.c + 2)]);
          putNum('f-su-amount-' + si, tSup[r3 + ',' + (hNo.c + 3)]);
          put('f-su-region-' + si, tSup[r3 + ',' + (hNo.c + 4)]);
          if (hMi) {
            put('f-mi-name-' + si, tSup[r3 + ',' + hMi.c]);
            put('f-mi-country-' + si, tSup[r3 + ',' + (hMi.c + 1)]);
            put('f-mi-org-' + si, tSup[r3 + ',' + (hMi.c + 2)]);
            putNum('f-mi-monthly-' + si, tSup[r3 + ',' + (hMi.c + 3)]);
            put('f-mi-date-' + si, tSup[r3 + ',' + (hMi.c + 4)]);
          }
        }
      }
    }

    /* 보고일: 본문 글에서 "주후 ○년 ○월 ○일"을 찾는다 */
    var dm = String(fullText || '').match(/주후\s*(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
    if (dm) {
      put('f-date', dm[1] + '-' + ('0' + dm[2]).slice(-2) + '-' + ('0' + dm[3]).slice(-2));
    }

    return filled;
  }

  /* 화면의 값을 하나의 자료로 모은다 */
  function collect() {
    var d = { v: 1, date: g('f-date') || today(), worship_avg: gn('f-wavg') || null, note: g('f-note') || null };
    d._seal = { on: sealOn, dx: sealPos.dx, dy: sealPos.dy };
    d.head = { pastor: g('f-pastor'), ptype: g('f-ptype'), prrn: g('f-prrn'),
      danghoi: g('f-danghoi'), finance: g('f-finance'), region: g('f-region') };
    d.addr = { ch: g('f-achurch'), tel: g('f-atel'), fax: g('f-afax'), home: g('f-ahome'),
      manse: g('f-amanse'), mtel: g('f-amtel'), mobile: g('f-amobile'), email: g('f-aemail') };
    d.clergy = {}; CLERGY.forEach(function (c) { d.clergy[c[0]] = gn('f-c-' + c[0]) || null; });
    d.jejik = {}; JEJIK.forEach(function (c) { d.jejik[c[0]] = gn('f-j-' + c[0]) || null; });
    d.members = {};
    DEPTS.forEach(function (dp) {
      var row = {}, any = false;
      MCOLS.forEach(function (c) {
        var v = gn('f-m-' + dp + '-' + c[0]);
        if (v) any = true;
        row[c[0]] = v || null;
      });
      if (any) d.members[dp] = row;
    });
    d.family = { rows: [], pay: { monthly: gn('f-pay-monthly') || null, mmon: gn('f-pay-mmon') || null,
      extra: gn('f-pay-extra') || null, emon: gn('f-pay-emon') || null } };
    [0, 1, 2, 3].forEach(function (i) {
      var r = { rel: g('f-fam-rel-' + i), name: g('f-fam-name-' + i), sex: g('f-fam-sex-' + i),
        age: g('f-fam-age-' + i), job: g('f-fam-job-' + i) };
      if (r.rel || r.name) d.family.rows.push(r);
    });
    d.fin = { 'in': {}, out: {} };
    FIN_IN.forEach(function (c) { d.fin['in'][c[0]] = gn('f-fi-' + c[0]) || null; });
    FIN_OUT.forEach(function (c) { d.fin.out[c[0]] = gn('f-fo-' + c[0]) || null; });
    d.assets = [];
    for (var i = 0; i < 8; i++) {
      d.assets.push({ qty: g('f-as-qty-' + i), value: gn('f-as-val-' + i) || null,
        use: g('f-as-use-' + i), owner: g('f-as-own-' + i) });
    }
    d.support = { rows: [], mis: [] };
    [0, 1, 2, 3, 4].forEach(function (i) {
      var r = { kind: g('f-su-kind-' + i), nohoi: g('f-su-nohoi-' + i), church: g('f-su-church-' + i),
        pastor: g('f-su-pastor-' + i), amount: gn('f-su-amount-' + i) || null, region: g('f-su-region-' + i) };
      if (r.church || r.pastor) d.support.rows.push(r);
      var m = { name: g('f-mi-name-' + i), country: g('f-mi-country-' + i), org: g('f-mi-org-' + i),
        monthly: gn('f-mi-monthly-' + i) || null, date: g('f-mi-date-' + i) };
      if (m.name) d.support.mis.push(m);
    });
    return d;
  }

  function sumOf(obj, keys) {
    var t = 0; keys.forEach(function (k) { t += num(obj[k]); }); return t;
  }

  /* ---------- 제출 ---------- */
  /* draft=true 면 제출이 아니라 중간 저장이다 (내용은 같은 곳에 저장된다) */
  function send(draft) {
    var msg = document.getElementById('rp-msg');
    var d = collect();
    if (!d.head.pastor) {
      msg.className = 'form-msg err'; msg.textContent = '담임교역자 성명을 적어 주세요.'; return;
    }
    var sichal = SICHAL || g('f-sichal');
    if (!sichal) {
      msg.className = 'form-msg err'; msg.textContent = '시찰을 적어 주세요. (예: 남부시찰)'; return;
    }
    var mem = d.members, mt = 0, mb = 0, sch = 0;
    DEPTS.forEach(function (dp) {
      var r = mem[dp] || {};
      mt += num(r.tm) + num(r.tf);
      mb += num(r.sm) + num(r.sf);
      if ('유아부유치부유년부초등부중등부고등부'.indexOf(dp) !== -1) sch += num(r.tm) + num(r.tf);
    });
    var row = {
      year: YEAR, sichal: sichal, church: CHURCH,
      pastor: d.head.pastor,
      members_total: mt || null,
      members_baptized: mb || null,
      staff_pastors: sumOf(d.clergy, ['damim', 'wonro', 'bumok', 'hyup', 'gita', 'gangdosa', 'jd_m', 'jd_f']) || null,
      staff_elders: sumOf(d.jejik, ['jr_simu', 'jr_wonro', 'jr_euntoe', 'jr_hyup', 'jr_gita']) || null,
      staff_deacons: sumOf(d.jejik, ['as_simu', 'as_gita']) || null,
      staff_kwonsa: sumOf(d.jejik, ['ks_simu', 'ks_gita']) || null,
      worship_avg: d.worship_avg,
      school_total: sch || null,
      offering_year: sumOf(d.fin['in'], ['carry', 'offer', 'special', 'mission', 'etc']) || null,
      note: d.note,
      data: d,
      /* 내 교회 보고서일 때만, 직인 사용을 켠 경우에 내 직인을 찍는다 */
      seal_image: !sealOn ? null
        : (chKey(user.church) === chKey(CHURCH) && mySeal) ? mySeal
        : (record && record.seal_image) || null,
      submitted_by: user.name,
      updated_at: new Date().toISOString()
    };
    if (!record) row.user_id = user.id;

    var btn = document.getElementById(draft ? 'rp-save' : 'rp-send');
    btn.disabled = true;
    msg.className = 'form-msg'; msg.textContent = draft ? '저장하는 중입니다...' : '제출하는 중입니다...';
    db().then(function (c) {
      return record
        ? c.from('church_reports').update(row).eq('id', record.id).select()
        : c.from('church_reports').insert(row).select();
    }).then(function (r) {
      btn.disabled = false;
      var w = SHS.wrote(r);
      if (!w.ok) {
        msg.className = 'form-msg err';
        msg.textContent = (r.error && r.error.code === '23505')
          ? '그 해의 보고서가 이미 있습니다. 화면을 새로 고친 뒤 다시 저장해 주세요.' : w.why;
        return;
      }
      record = r.data[0];
      SHSCloud.log(record && record.created_at !== record.updated_at ? 'update' : 'create',
        draft ? '교회상황 보고서 저장' : '교회상황 보고서 제출', YEAR + '년 ' + CHURCH);
      msg.className = 'form-msg ok';
      msg.textContent = draft
        ? '저장되었습니다. 이어서 작성하시다가 완성되면 시찰 서기에게 제출을 눌러 주세요.'
        : '제출되었습니다. 시찰 서기에게 알림이 전달되었습니다.';
    }).catch(function (x) {
      btn.disabled = false;
      msg.className = 'form-msg err';
      msg.textContent = (draft ? '저장' : '제출') + ' 실패: ' + ((x && x.message) || String(x));
    });
  }

  /* ================================================================
   *  종이 문서 (열람·인쇄)
   * ================================================================ */
  function renderDoc(rec) {
    var d = rec.data;
    var h = '<div class="notice-banner"><strong>' + rec.year + '년 ' + e(rec.church) + '</strong> 교회상황 보고서' +
      ' <span style="color:var(--gray-5)">(제출: ' + e(rec.submitted_by || '-') + ' · ' +
      e(String(rec.updated_at || rec.created_at || '').slice(0, 10)) + ')</span></div>' +
      '<div style="margin:12px 0 18px">' +
      '<button class="btn" id="doc-print">인쇄</button> ' +
      '<a class="btn ghost" href="report.html?church=' + encodeURIComponent(rec.church) + '&year=' + rec.year + '">수정하기</a> ' +
      '<a class="btn ghost" href="sichal.html?s=' + encodeURIComponent(rec.sichal || '') + '#report">시찰 페이지로</a>' +
      '</div>';
    if (!d) {
      h += '<div class="notice-banner">이 보고서는 예전 요약 방식으로 제출되어 정식 양식 내용이 없습니다. ' +
        '<a href="report.html?church=' + encodeURIComponent(rec.church) + '&year=' + rec.year +
        '" style="text-decoration:underline">정식 양식으로 다시 작성</a>하실 수 있습니다.</div>';
      area.innerHTML = h;
      return;
    }
    area.innerHTML = h;
    openSheet(d, rec.seal_image, rec);
    document.getElementById('doc-print').addEventListener('click', function () { window.print(); });
  }

  /* 여러 보고서를 한 화면에 이어 붙여 한 번의 인쇄로 모두 찍는다 (?ids=) */
  function renderDocs(list) {
    var tabs = document.getElementById('rp-tabs');
    if (tabs) tabs.style.display = 'none';
    if (!list.length) {
      area.innerHTML = '<div class="notice-banner">인쇄할 보고서를 찾을 수 없거나 열람 권한이 없습니다.</div>';
      return;
    }
    var printable = list.filter(function (r) { return r.data; });
    var olds = list.filter(function (r) { return !r.data; });
    var h = '<div class="notice-banner"><strong>교회상황 보고서 일괄 인쇄</strong> — ' +
      printable.map(function (r) { return e(r.church); }).join(', ') +
      ' <span style="color:var(--gray-5)">(' + printable.length + '건)</span></div>';
    if (olds.length) {
      h += '<div class="notice-banner">' + olds.map(function (r) { return e(r.church); }).join(', ') +
        ' — 예전 요약 방식으로 제출되어 인쇄할 서식이 없으므로 빼고 인쇄합니다.</div>';
    }
    if (printable.length) {
      h += '<div style="margin:12px 0 18px"><button class="btn" id="doc-print">' +
        printable.length + '건 모두 인쇄</button> ' +
        '<span style="font-size:0.82rem;color:var(--gray-5)">보고서 한 건이 한 장씩 이어서 인쇄됩니다.</span></div>';
    }
    area.innerHTML = h;
    if (!printable.length) return;
    var wrap = document.getElementById('sheet-wrap');
    wrap.innerHTML = printable.map(function (r) {
      /* 각 보고서에 저장된 직인 사용 여부·위치를 그대로 쓴다 */
      var s = (r.data && r.data._seal) || {};
      sealOn = s.on !== false;
      sealPos = { dx: Number(s.dx) || 0, dy: Number(s.dy) || 0 };
      return buildSheet(r.data, r.seal_image, r, true);
    }).join('');
    wrap.classList.add('show');
    document.getElementById('doc-print').addEventListener('click', function () { window.print(); });
    SHSCloud.log('view', '교회상황 보고서 일괄 인쇄', printable[0].year + '년 ' + printable.length + '건');
    if (qs('print')) setTimeout(function () { window.print(); }, 600);
  }

  function openSheet(d, seal, rec) {
    var wrap = document.getElementById('sheet-wrap');
    wrap.innerHTML = buildSheet(d, seal, rec);
    wrap.classList.add('show');
    /* 직인을 끌어서 원하는 자리에 찍는다 — 위치는 인쇄·PDF·제출본에 그대로 적용된다 */
    var stamp = wrap.querySelector('img.stamp');
    if (stamp && !rec) stamp.addEventListener('pointerdown', function (ev) {
      ev.preventDefault();
      var sx = ev.clientX, sy = ev.clientY;
      var base = { dx: sealPos.dx, dy: sealPos.dy };
      function onMove(e2) {
        sealPos.dx = base.dx + (e2.clientX - sx);
        sealPos.dy = base.dy + (e2.clientY - sy);
        stamp.style.marginLeft = (-32 + sealPos.dx) + 'px';
        stamp.style.marginTop = (-32 + sealPos.dy) + 'px';
      }
      function onUp() {
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
      }
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
    var pr = document.getElementById('sheet-print');
    if (pr) pr.addEventListener('click', function () { window.print(); });
    var cl = document.getElementById('sheet-close');
    if (cl) cl.addEventListener('click', function () {
      wrap.classList.remove('show');
      wrap.innerHTML = '';
    });
    wrap.scrollIntoView({ behavior: 'smooth' });
  }

  function sv(x) { return x == null || x === '' ? '&nbsp;' : e(String(x)); }
  function sn(x) { return x ? comma(num(x)) : '&nbsp;'; }

  function buildSheet(d, seal, rec, bare) {
    var church = (rec && rec.church) || CHURCH;
    var year = (rec && rec.year) || YEAR;
    var head = d.head || {}, addr = d.addr || {}, clergy = d.clergy || {}, jejik = d.jejik || {};
    var members = d.members || {}, family = d.family || { rows: [] }, fin = d.fin || { 'in': {}, out: {} };
    var assets = d.assets || [], support = d.support || { rows: [], mis: [] };
    var dt = (d.date || today()).split('-');

    /* bare: 일괄 인쇄처럼 종이만 여러 장 이어 붙일 때 — 도구 줄을 빼고 그린다 */
    var h = bare ? '' : '<div class="sheet-tools">' +
      '<button class="btn" id="sheet-print">인쇄</button>' +
      (VIEW_ID ? '' : '<button class="btn ghost" id="sheet-close">미리보기 닫기</button>') +
      '</div>';
    h += '<div class="sheet">';
    h += '<h1>교회 상황 보고서</h1>';
    h += '<div class="s-head-line"><span>주후 ' + dt[0] + '년 ' + num(dt[1]) + '월 ' + num(dt[2]) + '일</span>' +
      '<span><strong>' + e(church) + '</strong>&nbsp;&nbsp;당회장: <strong>' + sv(head.pastor) + '</strong> (인)</span></div>';
    h += '<p style="margin:8px 0 2px"><strong>시화산노회장 귀하</strong><br>지난 노회기간 본 교회의 상황을 아래와 같이 보고합니다.</p>';

    /* 1. 기본·주소 */
    h += '<div class="s-h">1. 주소</div>';
    h += '<table class="s-tbl"><tbody>' +
      '<tr><th style="width:12%">노회명</th><td style="width:18%">시화산노회</td>' +
      '<th style="width:12%">교회명</th><td style="width:18%">' + e(church) + '</td>' +
      '<th style="width:14%">담임교역자</th><td>' + sv(head.pastor) + ' (' + sv(head.ptype) + ')</td></tr>' +
      '<tr><th>시찰</th><td>' + sv((rec && rec.sichal) || SICHAL) + '</td>' +
      '<th>당회구성</th><td>' + sv(head.danghoi) + '</td>' +
      '<th>재정 / 지역</th><td>' + sv(head.finance) + ' / ' + sv(head.region) + '</td></tr>' +
      (head.prrn ? '<tr><th>주민등록번호</th><td colspan="5" style="text-align:left">' + sv(head.prrn) + '</td></tr>' : '') +
      '<tr><th>교회주소</th><td colspan="3" style="text-align:left">' + sv(addr.ch) + '</td>' +
      '<th>전화 / 팩스</th><td>' + sv(addr.tel) + (addr.fax ? ' / ' + e(addr.fax) : '') + '</td></tr>' +
      '<tr><th>사택주소</th><td colspan="3" style="text-align:left">' + sv(addr.manse) + '</td>' +
      '<th>핸드폰</th><td>' + sv(addr.mobile) + '</td></tr>' +
      '<tr><th>홈페이지</th><td colspan="3" style="text-align:left">' + sv(addr.home) + '</td>' +
      '<th>E-mail</th><td>' + sv(addr.email) + '</td></tr>' +
      '</tbody></table>';

    /* 2. 교역자·제직 */
    var ct = 0; CLERGY.forEach(function (c) { ct += num(clergy[c[0]]); });
    var jt = 0; JEJIK.forEach(function (c) { jt += num(jejik[c[0]]); });
    h += '<div class="s-h">2. 교역자 수 및 제직자 수</div>';
    h += '<table class="s-tbl"><tbody><tr>' +
      CLERGY.map(function (c) { return '<th>' + c[1].replace('(파트 포함)', '') + '</th>'; }).join('') + '<th>계</th></tr><tr>' +
      CLERGY.map(function (c) { return '<td>' + sv(clergy[c[0]]) + '</td>'; }).join('') + '<td><strong>' + (ct || '') + '</strong></td></tr></tbody></table>';
    h += '<table class="s-tbl"><tbody><tr>' +
      JEJIK.map(function (c) { return '<th>' + c[1] + '</th>'; }).join('') + '<th>계</th></tr><tr>' +
      JEJIK.map(function (c) { return '<td>' + sv(jejik[c[0]]) + '</td>'; }).join('') + '<td><strong>' + (jt || '') + '</strong></td></tr></tbody></table>';

    /* 3. 교인수 */
    h += '<div class="s-h">3. 교인수</div>';
    h += '<table class="s-tbl"><tbody>' +
      '<tr><th rowspan="2">구분</th><th colspan="2">전체인원</th><th colspan="2">교사수</th>' +
      '<th colspan="2">유아세례</th><th colspan="2">학습</th><th colspan="2">세례교인</th></tr>' +
      '<tr>' + '<th>남</th><th>여</th>'.repeat(5) + '</tr>' +
      DEPTS.map(function (dp) {
        var r = members[dp] || {};
        return '<tr><th>' + dp + '</th>' + MCOLS.map(function (c) {
          return '<td>' + sv(r[c[0]]) + '</td>';
        }).join('') + '</tr>';
      }).join('') +
      '<tr><th>합계</th>' + MCOLS.map(function (c) {
        var t = 0; DEPTS.forEach(function (dp) { t += num((members[dp] || {})[c[0]]); });
        return '<td><strong>' + (t || '&nbsp;') + '</strong></td>';
      }).join('') + '</tr></tbody></table>';

    /* 4. 교역자 가족 */
    if ((family.rows || []).length || (family.pay && (family.pay.monthly || family.pay.extra))) {
      h += '<div class="s-h">4. 교역자 가족 현황 <span class="s-note">(미자립교회 교역자 대상)</span></div>';
      h += '<table class="s-tbl"><tbody><tr><th>관계</th><th>성명</th><th>성별</th><th>연령</th><th>직업 / 학년</th></tr>' +
        (family.rows || []).map(function (r) {
          return '<tr><td>' + sv(r.rel) + '</td><td>' + sv(r.name) + '</td><td>' + sv(r.sex) +
            '</td><td>' + sv(r.age) + '</td><td>' + sv(r.job) + '</td></tr>';
        }).join('') +
        (family.pay && (family.pay.monthly || family.pay.extra)
          ? '<tr><th>교역자 사례비</th><td colspan="2">월지급액 ' + sn(family.pay.monthly) + '원 · ' + sv(family.pay.mmon) + '개월</td>' +
            '<td colspan="2">기타지급액 ' + sn(family.pay.extra) + '원 · ' + sv(family.pay.emon) + '개월</td></tr>'
          : '') +
        '</tbody></table>';
    }

    /* 5. 재정 */
    var fi = 0; FIN_IN.forEach(function (c) { fi += num((fin['in'] || {})[c[0]]); });
    var fo = 0; FIN_OUT.forEach(function (c) { fo += num((fin.out || {})[c[0]]); });
    h += '<div class="s-h">5. 교회재정 <span class="s-note">(연말 공동의회 재정보고 자료에 의거 작성)</span></div>';
    h += '<table class="s-tbl"><tbody><tr><th colspan="2">수입</th><th colspan="2">지출</th></tr>' +
      [0, 1, 2, 3, 4, 5].map(function (i) {
        var a = FIN_IN[i], b = FIN_OUT[i];
        return '<tr>' +
          (a ? '<th style="width:28%">' + a[1] + '</th><td style="width:22%">' + sn((fin['in'] || {})[a[0]]) + '</td>'
             : '<th>&nbsp;</th><td>&nbsp;</td>') +
          (b ? '<th style="width:28%">' + b[1] + '</th><td style="width:22%">' + sn((fin.out || {})[b[0]]) + '</td>'
             : '<th>&nbsp;</th><td>&nbsp;</td>') + '</tr>';
      }).join('') +
      '<tr><th>합계</th><td><strong>' + (fi ? comma(fi) : '&nbsp;') + '</strong></td>' +
      '<th>합계</th><td><strong>' + (fo ? comma(fo) : '&nbsp;') + '</strong></td></tr></tbody></table>';

    /* 6. 자산 */
    var anyAsset = (assets || []).some(function (r) { return r && (r.qty || r.value || r.use || r.owner); });
    if (anyAsset) {
      h += '<div class="s-h">6. 교회자산현황</div>';
      var idx = 0;
      h += '<table class="s-tbl"><tbody><tr><th>항목</th><th>수량(면적)</th><th>가액(원)</th><th>용도</th><th>소유명</th></tr>' +
        ASSET_ROWS.map(function (grp) {
          var out = '';
          for (var k = 0; k < grp.n; k++) {
            var r = assets[idx] || {};
            if (r.qty || r.value || r.use || r.owner || k === 0) {
              out += '<tr>' + (k === 0 ? '<th>' + grp.cat + '</th>' : '<th>&nbsp;</th>') +
                '<td>' + sv(r.qty) + '</td><td>' + sn(r.value) + '</td><td>' + sv(r.use) + '</td><td>' + sv(r.owner) + '</td></tr>';
            }
            idx++;
          }
          return out;
        }).join('') + '</tbody></table>';
    }

    /* 7. 후원 */
    if ((support.rows || []).length || (support.mis || []).length) {
      h += '<div class="s-h">7. 미자립교회 후원 및 피후원 현황</div>';
      if ((support.rows || []).length) {
        h += '<table class="s-tbl"><tbody><tr><th>구분</th><th>노회</th><th>교회</th><th>교역자</th><th>지원액(원)</th><th>지역</th></tr>' +
          support.rows.map(function (r) {
            return '<tr><td>' + sv(r.kind) + '</td><td>' + sv(r.nohoi) + '</td><td>' + sv(r.church) +
              '</td><td>' + sv(r.pastor) + '</td><td>' + sn(r.amount) + '</td><td>' + sv(r.region) + '</td></tr>';
          }).join('') + '</tbody></table>';
      }
      if ((support.mis || []).length) {
        h += '<table class="s-tbl"><tbody><tr><th>선교사명</th><th>선교국가</th><th>파송기관</th><th>월후원액(원)</th><th>파송일자</th></tr>' +
          support.mis.map(function (r) {
            return '<tr><td>' + sv(r.name) + '</td><td>' + sv(r.country) + '</td><td>' + sv(r.org) +
              '</td><td>' + sn(r.monthly) + '</td><td>' + sv(r.date) + '</td></tr>';
          }).join('') + '</tbody></table>';
      }
    }

    if (d.note) {
      h += '<div class="s-h">특기사항</div><p style="white-space:pre-wrap;font-size:11.5px">' + e(d.note) + '</p>';
    }

    /* 맺음 + 직인 */
    h += '<div class="s-close">상기와 같이 본 교회 통계현황을 보고합니다.<br><br>' +
      dt[0] + '년 ' + num(dt[1]) + '월 ' + num(dt[2]) + '일</div>';
    h += '<div class="s-stamp-line">대한예수교장로회 ' + e(church) + ' ' +
      '<span class="s-seal-spot">(직인)' +
      (seal && sealOn
        ? '<img class="stamp" src="' + seal + '" alt="교회 직인" title="끌어서 위치를 옮길 수 있습니다" ' +
          'style="margin-left:' + (-32 + sealPos.dx) + 'px;margin-top:' + (-32 + sealPos.dy) + 'px">'
        : '') +
      '</span></div>';
    h += '</div>';
    return h;
  }

  load();
 });
});
</script>
</body>
</html>
