<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>직인·도장 - 시화산노회</title>
<link rel="stylesheet" href="css/style.css?v=20260831zl">
</head>
<body>

<div class="page-head">
  <div class="container">
    <h1>직인·도장</h1>
    <div class="crumb">홈 &gt; 관리자 &gt; 직인·도장</div>
  </div>
</div>

<main class="page-body container" id="main">
  <div id="st-area"><p style="color:var(--gray-5)">권한을 확인하는 중...</p></div>
</main>

<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-auth.js"></script>
<script src="js/main.js?v=20260901b"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
 SHS.getUser().then(function (user) {
  var area = document.getElementById('st-area');
  var e = SHS.esc;

  if (!user || !SHSAuth.canManageMembers(user)) {
    area.innerHTML =
      '<div class="notice-banner">직인·도장 관리는 <strong>관리자 등급</strong>이 이용할 수 있습니다.' +
      (user ? ' 현재 등급(' + SHS.displayRole(user.role, user.title) + ')으로는 이용할 수 없습니다.'
            : ' <a class="btn sm" style="margin-left:10px" href="login.html">로그인</a>') +
      '</div>';
    return;
  }
  if (!user.cloud) {
    area.innerHTML =
      '<div class="notice-banner">직인·도장 관리는 서버 로그인(구글 또는 이메일) 후 이용할 수 있습니다. ' +
      '<a class="btn sm" style="margin-left:10px" href="login.html">로그인 화면으로</a></div>';
    return;
  }

  /* 예전에는 이 화면이 관리 메뉴를 모아 둔 허브였으나, 같은 메뉴가 상단
   * '관리자' 메뉴에도 있어 두 벌이 되었다. 이제 메뉴는 상단 한 곳에만 두고
   * 이 화면은 직인·도장만 맡는다. */
  area.innerHTML =
    '<div class="notice-banner"><strong>' + e(SHS.honorific(user)) + '</strong>, ' +
    '증명서에 찍을 직인과 도장, 감사필에 찍을 감사부 도장·사인을 ' +
    '여기서 등록·교체하실 수 있습니다. ' +
    '모든 변경은 감사 기록에 남습니다.<br>' +
    '<span style="font-size:0.85rem;color:var(--gray-5)">' +
    '예전에 이 화면에 있던 관리 메뉴는 상단 <strong>관리자</strong> 메뉴로 옮겼습니다.</span></div>' +
    '<div id="st-seal"><p style="color:var(--gray-5)">불러오는 중...</p></div>' +
    '<div id="st-fees" style="margin-top:26px"><p style="color:var(--gray-5)">불러오는 중...</p></div>';

  /* ---------- 서류 발급 요금·입금 계좌 ---------- */
  var FEE_DOCS = ['소속증명서', '재직증명서', '대표자증명서', '직인증명서', '은퇴목사확인서', '기타'];

  function loadFees() {
    var box = document.getElementById('st-fees');
    SHSCloud.init().then(function (c) {
      return c.from('site_settings').select('*').in('key', ['doc_fees', 'doc_pay']);
    }).then(function (r) {
      if (r.error) {
        box.innerHTML = '<p style="color:var(--gray-5)">요금 설정을 불러오지 못했습니다: ' + e(r.error.message) + '</p>';
        return;
      }
      var fees = {}, pay = { bank: 'NH농협', account: '3511015867663', holder: '시화산노회',
        staff_phone: '010-2498-8696' };
      (r.data || []).forEach(function (x) {
        if (x.key === 'doc_fees' && x.value) fees = x.value;
        if (x.key === 'doc_pay' && x.value) pay = x.value;
      });

      var h = '<h2>서류 발급 요금·입금 계좌</h2>' +
        '<div class="admin-card" style="max-width:560px">' +
        '<p style="font-size:0.85rem;color:var(--gray-6);margin-top:0">회원이 서류를 신청할 때 ' +
        '여기 정한 수수료와 계좌가 입금 안내 창에 나옵니다.</p>' +
        '<div class="inline-form" style="flex-wrap:wrap">' +
        FEE_DOCS.map(function (d) {
          var v = fees[d] != null ? fees[d] : 1000;
          return '<div class="field" style="flex:0 0 160px"><label>' + e(d) + ' (원)</label>' +
            '<input type="number" min="0" step="100" data-fee="' + e(d) + '" value="' + Number(v) + '"></div>';
        }).join('') + '</div>' +
        '<div class="inline-form">' +
        '<div class="field" style="flex:0 0 120px"><label>은행</label>' +
        '<input type="text" id="fee-bank" value="' + e(pay.bank || '') + '"></div>' +
        '<div class="field"><label>계좌번호</label>' +
        '<input type="text" id="fee-acct" value="' + e(pay.account || '') + '"></div>' +
        '<div class="field" style="flex:0 0 140px"><label>예금주</label>' +
        '<input type="text" id="fee-holder" value="' + e(pay.holder || '') + '"></div>' +
        '<div class="field" style="flex:0 0 170px"><label>간사 연락처</label>' +
        '<input type="text" id="fee-phone" value="' + e(pay.staff_phone || '') + '" placeholder="010-0000-0000"></div>' +
        '</div>' +
        '<p style="font-size:0.8rem;color:var(--gray-5);margin-top:-6px">간사 연락처는 입금 안내 창에 ' +
        '"빠른 확인이 필요하면 연락하세요"로 나옵니다.</p>' +
        '<button class="btn" id="fee-save">저장</button>' +
        '<div class="form-msg" id="fee-msg"></div></div>';
      box.innerHTML = h;

      document.getElementById('fee-save').addEventListener('click', function () {
        var msg = document.getElementById('fee-msg');
        var newFees = {};
        var bad = false;
        box.querySelectorAll('input[data-fee]').forEach(function (inp) {
          var v = parseInt(inp.value, 10);
          if (isNaN(v) || v < 0) bad = true;
          newFees[inp.dataset.fee] = v;
        });
        var newPay = {
          bank: document.getElementById('fee-bank').value.trim(),
          account: document.getElementById('fee-acct').value.trim().replace(/[^0-9-]/g, ''),
          holder: document.getElementById('fee-holder').value.trim(),
          staff_phone: document.getElementById('fee-phone').value.trim()
        };
        if (bad || !newPay.account) {
          msg.className = 'form-msg err';
          msg.textContent = '요금은 0 이상 숫자로, 계좌번호는 비우지 말고 적어 주세요.';
          return;
        }
        msg.className = 'form-msg';
        msg.textContent = '저장 중입니다...';
        SHSCloud.init().then(function (c) {
          return c.from('site_settings').upsert([
            { key: 'doc_fees', value: newFees, updated_at: new Date().toISOString() },
            { key: 'doc_pay', value: newPay, updated_at: new Date().toISOString() }
          ]);
        }).then(function (res) {
          if (res.error) { msg.className = 'form-msg err'; msg.textContent = res.error.message; return; }
          SHSCloud.log('update', '서류 발급 요금·계좌 설정',
            FEE_DOCS.map(function (d) { return d + ' ' + newFees[d] + '원'; }).join(', ') +
            ' / ' + newPay.bank + ' ' + newPay.account);
          msg.className = 'form-msg ok';
          msg.textContent = '저장되었습니다. 신청 화면에 바로 반영됩니다.';
        });
      });
    });
  }
  loadFees();

  /* ---------- 직인·도장 ---------- */
  var sealFiles = {};

  function loadSeals() {
    var box = document.getElementById('st-seal');
    SHSCloud.init().then(function (c) {
      return c.from('seals').select('*').order('sort');
    }).then(function (r) {
      if (r.error) {
        box.innerHTML = '<div class="notice-banner">직인 정보를 불러오지 못했습니다: ' + e(r.error.message) +
          ' (10 직인 관리 등록이 필요할 수 있습니다)</div>';
        return;
      }
      var rows = r.data || [];
      var html = '<h2>직인·도장 관리</h2>' +
        '<div class="notice-banner">직인 이미지는 <strong>비공개 저장소</strong>에 보관되며 관리자만 열람할 수 있습니다. ' +
        '등록·교체·열람 기록은 모두 감사 기록에 남습니다. ' +
        '배경이 없는 <strong>PNG 파일</strong>(투명 배경)로 올리시면 서류에 깔끔하게 찍힙니다.<br>' +
        '<span style="font-size:0.85rem;color:var(--gray-5)">' +
        '<strong>감사부장·감사부 서기</strong> 도장은 봄·가을 감사에서 회의록과 회계 장부에 ' +
        '감사필을 찍을 때 쓰입니다. 도장 대신 사인 그림을 올리셔도 됩니다.</span></div>';

      /* 항목별 이름란 안내
       * 임원은 회기마다 바뀌므로 사람 이름을 예시로 두지 않는다.
       * 노회 직인은 기관 직인이므로 명의가 노회 자체이다. */
      var HOLDER = {
        '노회직인':   { label: '직인 명의', value: '시화산노회', ph: '시화산노회' },
        '노회장':     { label: '도장 주인 이름', ph: '' },
        '서기':       { label: '도장 주인 이름', ph: '' },
        '회록서기':   { label: '도장 주인 이름', ph: '' },
        '감사부장':   { label: '감사부장 이름', ph: '' },
        '감사부서기': { label: '감사부 서기 이름', ph: '' }
      };

      html += '<div class="doc-list">';
      rows.forEach(function (s) {
        var h = HOLDER[s.key] || { label: '도장 주인 이름', ph: '' };
        var val = s.holder || h.value || '';
        html += '<div class="doc-item">' +
          '<div class="d-name">' + e(s.label) + '</div>' +
          '<div class="d-desc">' + (s.holder ? h.label + ': ' + e(s.holder) + '<br>' : '') +
          (s.file_path ? '등록됨 (' + e(String(s.updated_at || '').slice(0, 10)) + ')' : '아직 등록되지 않았습니다.') + '</div>' +
          '<div id="seal-prev-' + e(s.key) + '" style="min-height:70px;margin-bottom:10px"></div>' +
          '<div class="field"><label>' + e(h.label) + '</label>' +
          '<input type="text" data-sholder="' + e(s.key) + '" value="' + e(val) + '"' +
          (h.ph ? ' placeholder="' + e(h.ph) + '"' : '') + '></div>' +
          '<div class="field"><label>이미지 파일 (PNG 권장)</label>' +
          '<input type="file" accept="image/*" data-sfile="' + e(s.key) + '"></div>' +
          '<button class="btn sm" data-ssave="' + e(s.key) + '">저장</button> ' +
          (s.file_path ? '<button class="btn danger sm" data-sdel="' + e(s.key) + '">이미지 삭제</button>' : '') +
          '<div class="form-msg" data-smsg="' + e(s.key) + '"></div>' +
          '</div>';
      });
      html += '</div>';
      box.innerHTML = html;

      /* 등록된 도장 미리보기 */
      rows.forEach(function (s) {
        if (!s.file_path) return;
        SHSCloud.init().then(function (c) {
          return c.storage.from('seals').createSignedUrl(s.file_path, 300);
        }).then(function (r2) {
          if (r2.error) return;
          var el = document.getElementById('seal-prev-' + s.key);
          if (el) el.innerHTML = '<img src="' + r2.data.signedUrl + '" alt="' + e(s.label) + '" ' +
            'style="width:80px;height:80px;object-fit:contain;border:1px solid var(--gray-2);padding:4px">';
        });
      });

      box.querySelectorAll('input[data-sfile]').forEach(function (inp) {
        SHS.dropZone(inp, { what: '도장 이미지', accept: 'image' });
        inp.addEventListener('change', function () { sealFiles[inp.dataset.sfile] = this.files[0] || null; });
      });

      box.querySelectorAll('button[data-ssave]').forEach(function (b) {
        b.addEventListener('click', function () {
          var key = b.dataset.ssave;
          var msg = box.querySelector('[data-smsg="' + key + '"]');
          var holder = box.querySelector('input[data-sholder="' + key + '"]').value.trim();
          var file = sealFiles[key];
          msg.className = 'form-msg';
          msg.textContent = '저장 중입니다...';

          SHSCloud.init().then(function (c) {
            var pre = Promise.resolve(null);
            if (file) {
              /* 보관소 경로는 한글을 받지 않으므로 영문·숫자로 바꾼다 */
              var slug = encodeURIComponent(key).replace(/%/g, '').toLowerCase() || 'seal';
              var path = slug + '-' + Date.now() + '.png';
              pre = c.storage.from('seals').upload(path, file, { upsert: true }).then(function (r3) {
                if (r3.error) throw r3.error;
                return path;
              });
            }
            return pre.then(function (path) {
              var d = { holder: holder, updated_at: new Date().toISOString(), updated_by: user.name };
              if (path) d.file_path = path;
              return c.from('seals').update(d).eq('key', key);
            });
          }).then(function (res) {
            if (res.error) { msg.className = 'form-msg err'; msg.textContent = res.error.message; return; }
            SHSCloud.log('update', '직인 등록·수정', key + (file ? ' (이미지 교체)' : ' (정보 수정)'));
            sealFiles[key] = null;
            loadSeals();
          }).catch(function (err) {
            msg.className = 'form-msg err';
            msg.textContent = '저장 실패: ' + (err.message || err);
          });
        });
      });

      box.querySelectorAll('button[data-sdel]').forEach(function (b) {
        b.addEventListener('click', function () {
          var key = b.dataset.sdel;
          if (!confirm(key + ' 이미지를 삭제하시겠습니까?')) return;
          var s = rows.filter(function (x) { return x.key === key; })[0];
          SHSCloud.init().then(function (c) {
            return c.storage.from('seals').remove([s.file_path]).catch(function () {})
              .then(function () {
                return c.from('seals').update({ file_path: null, updated_at: new Date().toISOString(), updated_by: user.name }).eq('key', key);
              });
          }).then(function () {
            SHSCloud.log('delete', '직인 이미지 삭제', key);
            loadSeals();
          });
        });
      });
    });
  }
  loadSeals();
 });
});
</script>
</body>
</html>
