<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자료·회칙 관리 - 시화산노회</title>
<link rel="stylesheet" href="css/style.css?v=20260901a">
</head>
<body>

<div class="page-head">
  <div class="container">
    <h1>자료·회칙 관리</h1>
    <div class="crumb">홈 &gt; 관리자 &gt; 자료·회칙 관리</div>
  </div>
</div>

<main class="page-body container" id="main">
  <!-- 예전에는 '자료실 관리'와 '회칙 개정 반영'이 서로 다른 화면이었으나,
       하는 일이 이어져 있어 한 화면의 두 탭으로 모았다.
       주소 뒤에 #tab-rules 를 붙이면 회칙 탭이 바로 열린다. -->
  <div class="tabs" id="arc-tabs">
    <button class="active" data-tab="tab-archive">자료실 관리</button>
    <button data-tab="tab-rules">회칙 개정 반영</button>
  </div>
  <div class="tab-panel active" id="tab-archive">
    <div id="ae-area"><p style="color:var(--gray-5)">권한을 확인하는 중...</p></div>
  </div>
  <div class="tab-panel" id="tab-rules" style="max-width:960px">
    <div id="re-area"><p style="color:var(--gray-5)">권한을 확인하는 중...</p></div>
  </div>
</main>

<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-auth.js"></script>
<script src="js/rules.js"></script>
<script src="js/main.js?v=20260902a"></script>
<script>
/* 바깥 탭 (자료실 관리 / 회칙 개정 반영)
 * 안쪽에도 탭이 있으므로, 여기서는 이 두 칸만 여닫는다. */
(function () {
  var bar = document.getElementById('arc-tabs');
  var panels = ['tab-archive', 'tab-rules'];

  function show(id) {
    if (panels.indexOf(id) === -1) return false;
    bar.querySelectorAll('button').forEach(function (b) {
      b.classList.toggle('active', b.dataset.tab === id);
    });
    panels.forEach(function (p) {
      document.getElementById(p).classList.toggle('active', p === id);
    });
    return true;
  }

  bar.querySelectorAll('button').forEach(function (b) {
    b.addEventListener('click', function () {
      show(b.dataset.tab);
      history.replaceState(null, '', '#' + b.dataset.tab);
    });
  });

  /* 예전 회칙 개정 반영 주소로 들어오신 분을 회칙 탭으로 보낸다.
   * #tab-rules 와 #rules 둘 다 받는다. */
  function fromHash() {
    var h = (location.hash || '').replace(/^#/, '');
    if (h === 'rules') h = 'tab-rules';
    if (h) show(h);
  }
  window.addEventListener('hashchange', fromHash);
  fromHash();
})();
</script>

<!-- ===== 자료실 관리 ===== -->
<script>
document.addEventListener('DOMContentLoaded', function () {
 SHS.getUser().then(function (user) {
  var area = document.getElementById('ae-area');
  var e = SHS.esc;

  var SECTIONS = ['회의자료', '결의사항', '규칙', '내규', '서식', '고시',
                  '회의록', '임원회의록', '발송 공문', '접수 공문', '회계',
                  '증명서 발급대장', '대외비 문서'];

  /* 분류마다 보관소에서 쓰는 영문 이름 */
  var SLUG = {
    '회의자료': 'hoeui-jaryo', '결의사항': 'gyeorui', '규칙': 'gyuchik', '내규': 'naegyu',
    '서식': 'seosik', '고시': 'gosi', '회의록': 'hoeuirok',
    '임원회의록': 'imwon-hoeuirok', '발송 공문': 'gongmun', '접수 공문': 'gongmun-in',
    '회계': 'hoegye',
    '증명서 발급대장': 'jeungmyeongseo', '대외비 문서': 'daeoebi'
  };
  var STORE = 'https://sihwasan-docs.sihwasan.workers.dev';

  /* 로그인 증표 (보관소가 등급을 확인할 때 쓴다) */
  function token() {
    return SHSCloud.init().then(function (c) {
      return c.auth.getSession().then(function (r) {
        return (r && r.data && r.data.session && r.data.session.access_token) || null;
      });
    });
  }

  function keyFor(access, section, name) {
    var ext = (String(name).match(/\.[A-Za-z0-9]{1,8}$/) || ['.dat'])[0].toLowerCase();
    var stamp = new Date().toISOString().replace(/[-:T.]/g, '').slice(0, 14);
    return access + '/' + (SLUG[section] || 'gita') + '/' +
           stamp + '-' + Math.floor(Math.random() * 1e6) + ext;
  }

  /* 보관소에 자료를 올린다. 올린 주소를 돌려준다. */
  function putFile(file, access, section) {
    var key = keyFor(access, section, file.name);
    return token().then(function (t) {
      if (!t) throw new Error('로그인이 확인되지 않았습니다.');
      return fetch(STORE + '/f/' + key, {
        method: 'PUT',
        headers: { Authorization: 'Bearer ' + t, 'Content-Type': file.type || 'application/octet-stream' },
        body: file
      });
    }).then(function (r) {
      if (r.ok) return STORE + '/f/' + key;
      return r.json().catch(function () { return {}; }).then(function (j) {
        throw new Error(j.error || ('자료를 올리지 못했습니다. (' + r.status + ')'));
      });
    });
  }

  /* 보관소의 자료를 지운다. 우리 보관소 것이 아니면 아무 일도 하지 않는다. */
  function removeFile(fp) {
    if (!fp || String(fp).indexOf(STORE + '/f/') !== 0) return Promise.resolve(false);
    return token().then(function (t) {
      if (!t) return false;
      return fetch(fp, { method: 'DELETE', headers: { Authorization: 'Bearer ' + t } })
        .then(function (r) { return r.ok; });
    }).catch(function () { return false; });
  }

  /* 열람 등급이 바뀌면 보관소 안에서도 자리를 옮긴다 */
  function moveFile(fp, access, section) {
    if (!fp || String(fp).indexOf(STORE + '/f/') !== 0) return Promise.resolve(fp);
    var from = fp.slice((STORE + '/f/').length);
    var parts = from.split('/');
    var to = access + '/' + (SLUG[section] || parts[1]) + '/' + parts[2];
    if (to === from) return Promise.resolve(fp);
    return token().then(function (t) {
      if (!t) return fp;
      return fetch(STORE + '/move', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' },
        body: JSON.stringify({ from: from, to: to })
      }).then(function (r) { return r.ok ? STORE + '/f/' + to : fp; });
    }).catch(function () { return fp; });
  }
  var ACCESS = [
    { v: 'public',  t: '공개 (누구나)' },
    { v: 'member',  t: '정회원' },
    { v: 'officer', t: '임원' },
    { v: 'admin',   t: '관리자만' }
  ];

  if (!user || !SHSAuth.canManageMembers(user)) {
    area.innerHTML =
      '<div class="notice-banner">자료실 관리는 <strong>관리자 등급(노회장·서기·간사)</strong>이 이용할 수 있습니다.' +
      (user ? ' 현재 등급(' + SHS.displayRole(user.role, user.title) + ')으로는 이용할 수 없습니다.'
            : ' <a class="btn sm" style="margin-left:10px" href="login.html">로그인</a>') + '</div>';
    return;
  }
  if (!user.cloud) {
    area.innerHTML = '<div class="notice-banner">자료실 관리는 서버 로그인 후 이용할 수 있습니다. ' +
      '<a class="btn sm" style="margin-left:10px" href="login.html">로그인 화면으로</a></div>';
    return;
  }

  var tab = 'items';
  var items = [], reso = [];
  var newFile = null;
  function db() { return SHSCloud.init(); }

  function load() {
    db().then(function (c) {
      return Promise.all([
        c.from('archive_items').select('*').order('section').order('sort', { ascending: false }),
        c.from('resolutions').select('*').order('sort', { ascending: false }).order('id', { ascending: false })
      ]);
    }).then(function (rs) {
      if (rs[0].error) {
        area.innerHTML = '<div class="notice-banner">자료를 불러오지 못했습니다: ' + e(rs[0].error.message) +
          ' (17 자료실 정비 등록이 필요할 수 있습니다)</div>';
        return;
      }
      items = rs[0].data || [];
      reso = (rs[1] && rs[1].data) || [];
      draw();
    });
  }

  function draw() {
    var h = '<div class="notice-banner">여기서 고친 내용은 <strong>자료실</strong>에 바로 반영됩니다. ' +
      '모든 변경은 감사 기록에 남습니다. ' +
      '<a href="archive.html" target="_blank" style="color:var(--navy);text-decoration:underline">자료실 보기</a></div>' +
      '<div class="tabs" id="ae-tabs">' +
      '<button class="' + (tab === 'items' ? 'active' : '') + '" data-t="items">자료 목록</button>' +
      '<button class="' + (tab === 'reso' ? 'active' : '') + '" data-t="reso">노회 회의결의</button>' +
      '</div><div id="ae-body"></div>';
    area.innerHTML = h;
    area.querySelectorAll('#ae-tabs button').forEach(function (b) {
      b.addEventListener('click', function () { tab = b.dataset.t; draw(); });
    });
    if (tab === 'items') drawItems(); else drawReso();
  }

  function opts(list, v, keyv, keyt) {
    return list.map(function (x) {
      var val = keyv ? x[keyv] : x, txt = keyt ? x[keyt] : x;
      return '<option value="' + e(val) + '"' + (val === v ? ' selected' : '') + '>' + e(txt) + '</option>';
    }).join('');
  }

  /* ---------- 자료 목록 ---------- */
  function drawItems() {
    var box = document.getElementById('ae-body');
    var h = '<div class="admin-card" style="margin-bottom:18px"><h3 style="margin-top:0">자료 추가</h3>' +
      '<div class="inline-form" style="margin-bottom:6px">' +
      '<div class="field" style="flex:0 0 130px"><label>분류</label><select id="n-sec">' + opts(SECTIONS, '회의자료') + '</select></div>' +
      '<div class="field"><label>제목</label><input type="text" id="n-title"></div>' +
      '<div class="field" style="flex:0 0 160px"><label>등록일</label><input type="date" id="n-date" value="' +
      new Date().toISOString().slice(0, 10) + '"></div>' +
      '<div class="field" style="flex:0 0 150px"><label>열람 범위</label><select id="n-acc">' +
      opts(ACCESS, 'member', 'v', 't') + '</select></div>' +
      '</div>' +
      '<div class="field"><label>설명</label><input type="text" id="n-desc"></div>' +
      '<div class="field"><label>바로가기 주소 (선택)</label><input type="text" id="n-link" placeholder="rules-presbytery.html 처럼 홈페이지 안의 주소도 됩니다"></div>' +
      '<div class="field"><label>첨부파일 (선택)</label><input type="file" id="n-file"></div>' +
      '<button class="btn" id="n-add">추가</button><div class="form-msg" id="n-msg"></div></div>';

    SECTIONS.forEach(function (sec) {
      var list = items.filter(function (a) { return a.section === sec; });
      h += '<h3 style="margin-top:26px">' + e(sec) + ' (' + list.length + ')</h3>';
      if (!list.length) { h += '<p style="color:var(--gray-5)">등록된 자료가 없습니다.</p>'; return; }
      h += '<table class="tbl"><thead><tr><th>제목·설명</th><th style="width:120px">분류</th>' +
        '<th style="width:140px">열람 범위</th><th style="width:140px">등록일</th>' +
        '<th style="width:150px">관리</th></tr></thead><tbody>';
      list.forEach(function (a) {
        h += '<tr data-ai="' + a.id + '">' +
          '<td class="left"><input type="text" data-af="title" value="' + e(a.title) + '">' +
          '<input type="text" data-af="description" value="' + e(a.description || '') + '" style="margin-top:4px;font-size:0.85rem">' +
          '<input type="text" data-af="link_url" value="' + e(a.link_url || '') + '" placeholder="바로가기 주소" style="margin-top:4px;font-size:0.85rem">' +
          '<div class="ae-file">' +
          '<div class="ae-cur">' +
          (a.file_path
            ? '첨부: <strong>' + e(a.file_name || a.file_path) + '</strong>' +
              ' <button type="button" class="ae-x" data-afdrop="' + a.id + '">떼기</button>'
            : '<span class="ae-none">첨부 없음</span>') +
          '</div>' +
          '<input type="file" data-af="file">' +
          '</div>' +
          '</td>' +
          '<td><select data-af="section">' + opts(SECTIONS, a.section) + '</select></td>' +
          '<td><select data-af="access">' + opts(ACCESS, a.access, 'v', 't') + '</select></td>' +
          '<td><input type="date" data-af="doc_date" value="' + e(a.doc_date || '') + '"></td>' +
          '<td><button class="btn sm" data-asave="' + a.id + '">저장</button> ' +
          '<button class="btn danger sm" data-adel="' + a.id + '" data-at="' + e(a.title) + '">삭제</button></td>' +
          '</tr>';
      });
      h += '</tbody></table>';
    });
    h += '<div class="form-msg" id="ae-msg"></div>';
    box.innerHTML = h;

    SHS.dropZone(document.getElementById('n-file'), { what: '첨부파일' });
    document.getElementById('n-file').addEventListener('change', function () { newFile = this.files[0] || null; });

    document.getElementById('n-add').addEventListener('click', function () {
      var msg = document.getElementById('n-msg');
      var d = {
        section: document.getElementById('n-sec').value,
        title: document.getElementById('n-title').value.trim(),
        description: document.getElementById('n-desc').value.trim() || null,
        doc_date: document.getElementById('n-date').value || null,
        access: document.getElementById('n-acc').value,
        link_url: document.getElementById('n-link').value.trim() || null,
        sort: (items.length ? Math.max.apply(null, items.map(function (x) { return Number(x.sort || 0); })) : 0) + 10,
        updated_at: new Date().toISOString(), updated_by: user.name
      };
      if (!d.title) { msg.className = 'form-msg err'; msg.textContent = '제목을 입력해 주세요.'; return; }
      msg.className = 'form-msg'; msg.textContent = '저장 중입니다...';

      db().then(function (c) {
        var pre = Promise.resolve(null);
        if (newFile) {
          pre = putFile(newFile, d.access, d.section).then(function (url) {
            return { file_path: url, file_name: newFile.name };
          });
        }
        return pre.then(function (f) {
          if (f) { d.file_path = f.file_path; d.file_name = f.file_name; }
          return c.from('archive_items').insert(d);
        });
      }).then(function (res) {
        if (res.error) { msg.className = 'form-msg err'; msg.textContent = res.error.message; return; }
        SHSCloud.log('create', '자료실 자료 등록', '[' + d.section + '] ' + d.title);
        newFile = null;
        load();
      }).catch(function (err) {
        msg.className = 'form-msg err';
        msg.textContent = '저장 실패: ' + (err.message || err);
      });
    });

    /* 줄마다 첨부 칸을 끌어다 놓을 수 있는 상자로 만든다 */
    box.querySelectorAll('.ae-file input[type="file"]').forEach(function (inp) {
      SHS.dropZone(inp, { what: '첨부파일' });
      var dz = inp.closest('.dropzone');
      if (dz) dz.classList.add('sm');
      inp.addEventListener('change', function () {
        var tr = inp.closest('tr');
        if (inp.files && inp.files.length) markDrop(tr, false);
      });
    });

    /* 첨부 떼기 : 눌러 두면 저장할 때 첨부가 지워진다 */
    function markDrop(tr, on) {
      tr.dataset.dropfile = on ? '1' : '';
      tr.classList.toggle('ae-dropping', on);
      var btn = tr.querySelector('.ae-x');
      if (btn) btn.textContent = on ? '떼기 취소' : '떼기';
      if (on) {
        /* 떼기로 해 두면 고르던 파일은 물린다 */
        var inp = tr.querySelector('input[data-af="file"]');
        if (inp) { inp.value = ''; inp.dispatchEvent(new Event('change')); }
      }
    }
    box.querySelectorAll('.ae-x').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var tr = btn.closest('tr');
        markDrop(tr, tr.dataset.dropfile !== '1');
      });
    });

    box.querySelectorAll('button[data-asave]').forEach(function (b) {
      b.addEventListener('click', function () {
        var tr = b.closest('tr');
        var msg = document.getElementById('ae-msg');
        function v(f) { return tr.querySelector('[data-af="' + f + '"]').value.trim(); }
        var d = {
          title: v('title'), description: v('description') || null,
          link_url: v('link_url') || null, section: v('section'),
          access: v('access'), doc_date: v('doc_date') || null,
          updated_at: new Date().toISOString(), updated_by: user.name
        };
        if (!d.title) { msg.className = 'form-msg err'; msg.textContent = '제목은 비울 수 없습니다.'; return; }
        msg.className = 'form-msg'; msg.textContent = '저장 중입니다...';
        var cur = items.filter(function (x) { return String(x.id) === b.dataset.asave; })[0];
        var fileEl = tr.querySelector('input[data-af="file"]');
        var picked = fileEl && fileEl.files && fileEl.files[0];
        var dropping = tr.dataset.dropfile === '1';

        db().then(function (c) {
          var step;
          if (picked) {
            /* 새 파일로 바꾼다. 올린 뒤에 옛 파일을 지운다. */
            step = putFile(picked, d.access, d.section).then(function (url) {
              d.file_path = url;
              d.file_name = picked.name;
              return removeFile(cur && cur.file_path);
            });
          } else if (dropping) {
            /* 첨부만 떼어 낸다 */
            step = removeFile(cur && cur.file_path).then(function () {
              d.file_path = null;
              d.file_name = null;
            });
          } else {
            /* 등급·분류가 바뀌었으면 보관소 안에서 자리만 옮긴다 */
            step = moveFile(cur && cur.file_path, d.access, d.section).then(function (fp) {
              if (fp && cur && fp !== cur.file_path) d.file_path = fp;
            });
          }
          return step.then(function () {
            return c.from('archive_items').update(d).eq('id', b.dataset.asave);
          });
        }).then(function (res) {
          if (res.error) { msg.className = 'form-msg err'; msg.textContent = res.error.message; return; }
          SHSCloud.log('update', '자료실 자료 수정', '[' + d.section + '] ' + d.title);
          msg.className = 'form-msg ok';
          msg.textContent = '저장되었습니다. 자료실에 반영되었습니다.';
          load();
        });
      });
    });

    box.querySelectorAll('button[data-adel]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (!confirm('"' + b.dataset.at + '" 자료를 삭제하시겠습니까?')) return;
        var a = items.filter(function (x) { return String(x.id) === b.dataset.adel; })[0];
        db().then(function (c) {
          var fp = a && a.file_path;
          var pre = !fp ? Promise.resolve()
            : (String(fp).indexOf(STORE) === 0
                ? removeFile(fp)
                : c.storage.from('archive-files').remove([fp]).catch(function () {}));
          return pre.then(function () { return c.from('archive_items').delete().eq('id', b.dataset.adel); });
        }).then(function (res) {
          if (res.error) { alert(res.error.message); return; }
          SHSCloud.log('delete', '자료실 자료 삭제', b.dataset.at);
          load();
        });
      });
    });
  }

  /* ---------- 노회 회의결의 ---------- */
  function drawReso() {
    var box = document.getElementById('ae-body');
    var KINDS = ['정기노회', '임시노회', '임원회'];
    var h = '<div class="notice-banner">여기에 담긴 결의는 <strong>정회원만</strong> 열람할 수 있습니다. ' +
      '결의 내용은 <strong>한 줄에 한 항목</strong>씩 적어 주세요.</div>';

    h += '<div class="admin-card" style="margin-bottom:18px"><h3 style="margin-top:0">회기 추가</h3>' +
      '<div class="inline-form" style="margin-bottom:6px">' +
      '<div class="field" style="flex:0 0 90px"><label>회기</label><input type="number" id="r-seq" placeholder="19"></div>' +
      '<div class="field" style="flex:0 0 120px"><label>구분</label><select id="r-kind">' + opts(KINDS, '정기노회') + '</select></div>' +
      '<div class="field"><label>회기 이름</label><input type="text" id="r-session" placeholder="제19회 정기노회(봄)"></div>' +
      '<div class="field" style="flex:0 0 100px"><label>연도</label><input type="number" id="r-year" value="' +
      new Date().getFullYear() + '"></div>' +
      '</div>' +
      '<div class="inline-form" style="margin-bottom:6px">' +
      '<div class="field"><label>노회장</label><input type="text" id="r-pres"></div>' +
      '<div class="field"><label>장소</label><input type="text" id="r-place"></div>' +
      '<div class="field" style="flex:0 0 160px"><label>회집일</label><input type="date" id="r-held"></div>' +
      '</div>' +
      '<div class="field"><label>결의 내용 (한 줄에 한 항목)</label><textarea id="r-items" rows="5"></textarea></div>' +
      '<button class="btn" id="r-add">추가</button><div class="form-msg" id="r-msg"></div></div>';

    if (!reso.length) {
      h += '<p style="color:var(--gray-5)">등록된 회기가 없습니다.</p>';
    } else {
      reso.forEach(function (r) {
        h += '<div class="admin-card" style="margin-bottom:14px" data-ri="' + r.id + '">' +
          '<div class="inline-form" style="margin-bottom:6px">' +
          '<div class="field" style="flex:0 0 90px"><label>회기</label><input type="number" data-rf="seq" value="' + e(r.seq == null ? '' : r.seq) + '"></div>' +
          '<div class="field" style="flex:0 0 120px"><label>구분</label><select data-rf="kind">' + opts(KINDS, r.kind) + '</select></div>' +
          '<div class="field"><label>회기 이름</label><input type="text" data-rf="session" value="' + e(r.session) + '"></div>' +
          '<div class="field" style="flex:0 0 100px"><label>연도</label><input type="number" data-rf="year" value="' + e(r.year == null ? '' : r.year) + '"></div>' +
          '</div>' +
          '<div class="inline-form" style="margin-bottom:6px">' +
          '<div class="field"><label>노회장</label><input type="text" data-rf="president" value="' + e(r.president || '') + '"></div>' +
          '<div class="field"><label>장소</label><input type="text" data-rf="place" value="' + e(r.place || '') + '"></div>' +
          '<div class="field" style="flex:0 0 160px"><label>회집일</label><input type="date" data-rf="held_on" value="' + e(r.held_on || '') + '"></div>' +
          '</div>' +
          '<div class="field"><label>결의 내용 (한 줄에 한 항목)</label>' +
          '<textarea data-rf="items" rows="' + Math.min(16, Math.max(3, String(r.items || '').split('\n').length + 1)) + '">' +
          e(r.items || '') + '</textarea></div>' +
          '<button class="btn sm" data-rsave="' + r.id + '">저장</button> ' +
          '<button class="btn danger sm" data-rdel="' + r.id + '" data-rt="' + e(r.session) + '">삭제</button>' +
          '<div class="form-msg" data-rmsg="' + r.id + '"></div></div>';
      });
    }
    box.innerHTML = h;

    document.getElementById('r-add').addEventListener('click', function () {
      var msg = document.getElementById('r-msg');
      var d = {
        seq: Number(document.getElementById('r-seq').value) || null,
        kind: document.getElementById('r-kind').value,
        session: document.getElementById('r-session').value.trim(),
        year: Number(document.getElementById('r-year').value) || null,
        president: document.getElementById('r-pres').value.trim() || null,
        place: document.getElementById('r-place').value.trim() || null,
        held_on: document.getElementById('r-held').value || null,
        items: document.getElementById('r-items').value.trim(),
        sort: (reso.length ? Math.max.apply(null, reso.map(function (x) { return Number(x.sort || 0); })) : 0) + 10,
        updated_at: new Date().toISOString(), updated_by: user.name
      };
      if (!d.session) { msg.className = 'form-msg err'; msg.textContent = '회기 이름을 입력해 주세요.'; return; }
      msg.className = 'form-msg'; msg.textContent = '저장 중입니다...';
      db().then(function (c) { return c.from('resolutions').insert(d); }).then(function (res) {
        if (res.error) { msg.className = 'form-msg err'; msg.textContent = res.error.message; return; }
        SHSCloud.log('create', '노회 회의결의 등록', d.session);
        load();
      });
    });

    box.querySelectorAll('button[data-rsave]').forEach(function (b) {
      b.addEventListener('click', function () {
        var card = b.closest('[data-ri]');
        var msg = box.querySelector('[data-rmsg="' + b.dataset.rsave + '"]');
        function v(f) { return card.querySelector('[data-rf="' + f + '"]').value.trim(); }
        var d = {
          seq: Number(v('seq')) || null, kind: v('kind'), session: v('session'),
          year: Number(v('year')) || null, president: v('president') || null,
          place: v('place') || null, held_on: v('held_on') || null,
          items: card.querySelector('[data-rf="items"]').value.trim(),
          updated_at: new Date().toISOString(), updated_by: user.name
        };
        if (!d.session) { msg.className = 'form-msg err'; msg.textContent = '회기 이름은 비울 수 없습니다.'; return; }
        msg.className = 'form-msg'; msg.textContent = '저장 중입니다...';
        db().then(function (c) {
          return c.from('resolutions').update(d).eq('id', b.dataset.rsave);
        }).then(function (res) {
          if (res.error) { msg.className = 'form-msg err'; msg.textContent = res.error.message; return; }
          SHSCloud.log('update', '노회 회의결의 수정', d.session);
          msg.className = 'form-msg ok';
          msg.textContent = '저장되었습니다. 자료실에 반영되었습니다.';
        });
      });
    });

    box.querySelectorAll('button[data-rdel]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (!confirm('"' + b.dataset.rt + '" 결의를 삭제하시겠습니까? 되돌릴 수 없습니다.')) return;
        db().then(function (c) {
          return c.from('resolutions').delete().eq('id', b.dataset.rdel);
        }).then(function (res) {
          if (res.error) { alert(res.error.message); return; }
          SHSCloud.log('delete', '노회 회의결의 삭제', b.dataset.rt);
          load();
        });
      });
    });
  }

  load();
 });
});
</script>

<!-- ===== 회칙 개정 반영 ===== -->
<script>
document.addEventListener('DOMContentLoaded', function () {
 SHS.getUser().then(function (user) {
  var area = document.getElementById('re-area');
  var e = SHS.esc;
  var BOOK = 'presbytery';

  if (!user || !SHSAuth.canManageMembers(user)) {
    area.innerHTML =
      '<div class="notice-banner">회칙 개정 반영은 <strong>관리자 등급(노회장·서기·간사)</strong>이 할 수 있습니다.' +
      (user ? ' 현재 등급(' + SHS.displayRole(user.role, user.title) + ')으로는 이용할 수 없습니다.'
            : ' <a class="btn sm" style="margin-left:10px" href="login.html">로그인</a>') +
      '</div>';
    return;
  }
  if (!user.cloud) {
    area.innerHTML =
      '<div class="notice-banner">회칙 개정은 서버 로그인(구글 또는 이메일) 후 반영할 수 있습니다. ' +
      '<a class="btn sm" style="margin-left:10px" href="login.html">로그인 화면으로</a></div>';
    return;
  }

  var docs = [], arts = [], curDoc = null;

  function db() { return SHSCloud.init(); }

  function load() {
    area.innerHTML = '<p style="color:var(--gray-5)">회칙을 불러오는 중...</p>';
    db().then(function (c) {
      return Promise.all([
        c.from('rule_docs').select('*').eq('book', BOOK).order('sort'),
        c.from('rule_articles').select('*').eq('book', BOOK).order('sort')
      ]);
    }).then(function (rs) {
      if (rs[0].error || rs[1].error) {
        area.innerHTML = '<div class="notice-banner">회칙을 불러오지 못했습니다: ' +
          e((rs[0].error || rs[1].error).message) +
          ' (15 회칙 조문 관리 등록이 필요할 수 있습니다)</div>';
        return;
      }
      docs = rs[0].data || [];
      arts = rs[1].data || [];
      if (!docs.length) {
        area.innerHTML = '<div class="notice-banner">아직 회칙이 등록되지 않았습니다. ' +
          'supabase/15_rules.sql 을 먼저 실행해 주세요.</div>';
        return;
      }
      if (!curDoc || !docs.filter(function (d) { return d.key === curDoc; }).length) {
        curDoc = docs[0].key;
      }
      draw();
    });
  }

  function draw() {
    var doc = docs.filter(function (d) { return d.key === curDoc; })[0];
    var mine = arts.filter(function (a) { return a.doc_key === curDoc; });

    var h =
      '<div class="notice-banner">조문을 고치고 <strong>저장</strong>을 누르면 회칙 페이지에 바로 반영됩니다. ' +
      '모든 수정은 감사 기록에 남습니다. ' +
      '<a href="rules-presbytery.html" target="_blank" style="color:var(--navy);text-decoration:underline">회칙 페이지 보기</a></div>' +
      '<div class="tabs" id="re-tabs">' +
      docs.map(function (d) {
        return '<button class="' + (d.key === curDoc ? 'active' : '') + '" data-doc="' + e(d.key) + '">' +
          e(d.name) + '</button>';
      }).join('') + '</div>';

    /* 문서 정보 */
    h += '<div class="admin-card" style="margin-bottom:18px">' +
      '<h3 style="margin-top:0">문서 정보</h3>' +
      '<div class="field"><label>문서 이름 (탭에 표시됩니다)</label>' +
      '<input type="text" id="d-name" value="' + e(doc.name) + '"></div>' +
      '<div class="field"><label>머리말 (없으면 비워 두세요)</label>' +
      '<textarea id="d-intro" rows="2">' + e(doc.intro || '') + '</textarea></div>' +
      '<div class="field"><label>개정 연혁 (없으면 비워 두세요)</label>' +
      '<textarea id="d-rev" rows="2">' + e(doc.revisions || '') + '</textarea></div>' +
      '<button class="btn" id="d-save">문서 정보 저장</button>' +
      '<div class="form-msg" id="d-msg"></div></div>';

    /* 조문 목록 */
    h += '<h2>조문 (' + mine.length + '개)</h2>' +
      '<p style="font-size:0.86rem;color:var(--gray-7)">' +
      '· <strong>장</strong>은 새 장이 시작되는 조문에만 적으시면 됩니다. 같은 장이 이어지면 같은 장 이름을 그대로 두세요.<br>' +
      '· <strong>내용</strong>에서 <strong>줄을 바꾸면 1, 2, 3 항으로 나뉘어</strong> 표시됩니다.<br>' +
      '· 순서를 바꾸려면 <strong>위로 / 아래로</strong>를 누르세요.</p>';

    h += '<div id="re-list">';
    mine.forEach(function (a, i) {
      h += '<div class="admin-card" style="margin-bottom:14px" data-art="' + a.id + '">' +
        '<div class="inline-form" style="margin-bottom:6px">' +
        '<div class="field" style="flex:0 0 220px"><label>장</label>' +
        '<input type="text" data-f="chapter" value="' + e(a.chapter || '') + '" placeholder="예: 제 1 장 총칙"></div>' +
        '<div class="field"><label>조 제목</label>' +
        '<input type="text" data-f="title" value="' + e(a.title || '') + '" placeholder="예: 제1조 (명칭)"></div>' +
        '</div>' +
        '<div class="field"><label>내용 (줄을 바꾸면 항이 나뉩니다)</label>' +
        '<textarea data-f="body" rows="' + Math.min(12, Math.max(2, String(a.body || '').split('\n').length + 1)) + '">' +
        e(a.body || '') + '</textarea></div>' +
        '<button class="btn sm" data-save="' + a.id + '">저장</button> ' +
        '<button class="btn ghost sm" data-up="' + a.id + '"' + (i === 0 ? ' disabled' : '') + '>위로</button> ' +
        '<button class="btn ghost sm" data-down="' + a.id + '"' + (i === mine.length - 1 ? ' disabled' : '') + '>아래로</button> ' +
        '<button class="btn ghost sm" data-ins="' + a.id + '">아래에 새 조문</button> ' +
        '<button class="btn danger sm" data-del="' + a.id + '">삭제</button>' +
        '<div class="form-msg" data-msg="' + a.id + '"></div>' +
        '</div>';
    });
    h += '</div>';
    h += '<button class="btn" id="re-add">맨 끝에 새 조문 추가</button>';

    area.innerHTML = h;
    bind(mine);
  }

  function bind(mine) {
    area.querySelectorAll('#re-tabs button').forEach(function (b) {
      b.addEventListener('click', function () { curDoc = b.dataset.doc; draw(); });
    });

    /* 문서 정보 저장 */
    document.getElementById('d-save').addEventListener('click', function () {
      var msg = document.getElementById('d-msg');
      var d = {
        name: document.getElementById('d-name').value.trim(),
        intro: document.getElementById('d-intro').value.trim() || null,
        revisions: document.getElementById('d-rev').value.trim() || null,
        updated_at: new Date().toISOString(), updated_by: user.name
      };
      if (!d.name) { msg.className = 'form-msg err'; msg.textContent = '문서 이름을 입력해 주세요.'; return; }
      msg.className = 'form-msg'; msg.textContent = '저장 중입니다...';
      db().then(function (c) {
        return c.from('rule_docs').update(d).eq('book', BOOK).eq('key', curDoc);
      }).then(function (r) {
        if (r.error) { msg.className = 'form-msg err'; msg.textContent = r.error.message; return; }
        SHSCloud.log('update', '회칙 문서 정보 수정', d.name);
        load();
      });
    });

    function card(id) { return area.querySelector('[data-art="' + id + '"]'); }
    function val(id, f) { return card(id).querySelector('[data-f="' + f + '"]').value; }

    area.querySelectorAll('button[data-save]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.dataset.save;
        var msg = area.querySelector('[data-msg="' + id + '"]');
        var d = {
          chapter: val(id, 'chapter').trim() || null,
          title: val(id, 'title').trim() || null,
          body: val(id, 'body').trim(),
          updated_at: new Date().toISOString(), updated_by: user.name
        };
        if (!d.title && !d.body) {
          msg.className = 'form-msg err';
          msg.textContent = '조 제목이나 내용 중 하나는 있어야 합니다.';
          return;
        }
        msg.className = 'form-msg'; msg.textContent = '저장 중입니다...';
        db().then(function (c) {
          return c.from('rule_articles').update(d).eq('id', id);
        }).then(function (r) {
          if (r.error) { msg.className = 'form-msg err'; msg.textContent = r.error.message; return; }
          SHSCloud.log('update', '회칙 조문 수정', (d.title || '(제목 없음)'));
          msg.className = 'form-msg ok';
          msg.textContent = '저장되었습니다. 회칙 페이지에 반영되었습니다.';
        });
      });
    });

    /* 순서 바꾸기 : 이웃한 조문과 sort 값을 맞바꾼다 */
    function swap(id, dir) {
      var i = -1;
      mine.forEach(function (a, k) { if (String(a.id) === String(id)) i = k; });
      var j = i + dir;
      if (i < 0 || j < 0 || j >= mine.length) return;
      var A = mine[i], B = mine[j];
      db().then(function (c) {
        return Promise.all([
          c.from('rule_articles').update({ sort: B.sort }).eq('id', A.id),
          c.from('rule_articles').update({ sort: A.sort }).eq('id', B.id)
        ]);
      }).then(function () {
        SHSCloud.log('update', '회칙 조문 순서 변경', (A.title || '(제목 없음)'));
        load();
      });
    }
    area.querySelectorAll('button[data-up]').forEach(function (b) {
      b.addEventListener('click', function () { swap(b.dataset.up, -1); });
    });
    area.querySelectorAll('button[data-down]').forEach(function (b) {
      b.addEventListener('click', function () { swap(b.dataset.down, 1); });
    });

    /* 새 조문 : 기준 조문 바로 아래에 넣는다 */
    function addAfter(afterId) {
      var base = null, next = null;
      mine.forEach(function (a, k) {
        if (String(a.id) === String(afterId)) { base = a; next = mine[k + 1] || null; }
      });
      var sort;
      if (!base) sort = (mine.length ? mine[mine.length - 1].sort : 0) + 10;
      else if (next) sort = (base.sort + next.sort) / 2;
      else sort = base.sort + 10;

      db().then(function (c) {
        return c.from('rule_articles').insert({
          book: BOOK, doc_key: curDoc,
          chapter: base ? base.chapter : null,
          title: '', body: '', sort: sort,
          updated_at: new Date().toISOString(), updated_by: user.name
        });
      }).then(function (r) {
        if (r.error) { alert('추가하지 못했습니다: ' + r.error.message); return; }
        SHSCloud.log('create', '회칙 조문 추가', curDoc);
        load();
      });
    }
    area.querySelectorAll('button[data-ins]').forEach(function (b) {
      b.addEventListener('click', function () { addAfter(b.dataset.ins); });
    });
    document.getElementById('re-add').addEventListener('click', function () { addAfter(null); });

    area.querySelectorAll('button[data-del]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.dataset.del;
        var t = val(id, 'title') || '(제목 없음)';
        if (!confirm('"' + t + '" 조문을 삭제하시겠습니까? 되돌릴 수 없습니다.')) return;
        db().then(function (c) {
          return c.from('rule_articles').delete().eq('id', id);
        }).then(function (r) {
          if (r.error) { alert(r.error.message); return; }
          SHSCloud.log('delete', '회칙 조문 삭제', t);
          load();
        });
      });
    });
  }

  load();
 });
});
</script>
