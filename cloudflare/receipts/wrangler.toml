name = "sihwasan-receipts"
main = "src/index.js"
compatibility_date = "2026-08-01"
# 늘 시화산노회 계정(Sihwasan_presbytery@naver.com)에 올린다.
# 다른 계정으로 로그인한 채 deploy 하면 여기서 막혀 엉뚱한 곳에 올라가지 않는다.
account_id = "0c1cf1f4bfdcd3e33660b6d07e66378f"

# 영수증 자동 읽기 창구 (Claude API)
#
# 비밀 열쇠(ANTHROPIC_API_KEY)는 이 파일에 적지 않는다. 배포하는 컴퓨터에서
#   wrangler secret put ANTHROPIC_API_KEY
# 를 한 번 실행해 붙여 넣으면 Cloudflare 가 보관한다.
#
# 부르는 사람이 그 장부를 적을 수 있는 회계인지 확인할 때 쓰는 주소.
# anon 키는 홈페이지에 이미 공개되어 있는 값이므로 비밀이 아니다.
[vars]
SUPABASE_URL = "https://ltbhgwozkffenahqdzfj.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0Ymhnd296a2ZmZW5haHFkemZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNDk0MDYsImV4cCI6MjEwMTkyNTQwNn0.nSptHsi7nTCWTiyTe_Kl9xpxyHJ3pkhRGoZLI1BdsnI"
ANTHROPIC_MODEL = "claude-opus-5"

# Claude API 는 홍콩 등 지원하지 않는 지역에서 오는 요청을 "Request not allowed"(403)로 거절한다.
# 한국 접속은 Cloudflare 무료 요금제에서 대개 홍콩(HKG) 데이터센터로 들어가고,
# 스마트 배치(mode = "smart")는 이 워커를 옮기지 않았다(cf-placement: local-HKG, 2026-10-20 확인).
# 그래서 실행 위치를 도쿄(aws:ap-northeast-1)로 못 박는다 — 한국과 가깝고 Claude API 지원 지역이다.
[placement]
region = "aws:ap-northeast-1"

[observability]
enabled = true
