<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시찰회 - 시화산노회</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/style.css?v=20260830j">
</head>
<body>

<div class="page-head">
  <div class="container">
    <h1 id="si-title">시찰회</h1>
    <div class="crumb">홈 &gt; 시찰회 &gt; <span id="si-crumb">시찰</span></div>
  </div>
</div>

<main class="page-body container" id="main">
  <div id="si-area"><p style="color:var(--gray-5)">불러오는 중...</p></div>
</main>

<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-auth.js"></script>
<script src="js/main.js?v=20260830d"></script>
<script src="js/name-picker.js"></script>
<script src="js/audit-mark.js"></script>
<script src="js/minutes-box.js"></script>
<script src="js/ledger.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
 SHS.getUser().then(function (user) {
  var area = document.getElementById('si-area');
  var e = SHS.esc;

  /* 주소 뒤 ?s=북부시찰 로 어느 시찰인지 정한다 */
  var NAME = decodeURIComponent((location.search.match(/[?&]s=([^&]*)/) || [])[1] || '')
               .replace(/\+/g, ' ');
  var ACCESS = [
    { v: 'member',  t: '정회원 전체' },
    { v: 'sichal',  t: '이 시찰 소속' },
    { v: 'officer', t: '노회 임원' }
  ];
  function accessName(v) {
    var hit = ACCESS.filter(function (x) { return x.v === v; })[0];
    return hit ? hit.t : v;
  }

  var gate = SHS.memberGate(user, '시찰회 화면');
  if (gate) { area.innerHTML = gate; return; }
  if (!user.cloud) {
    area.innerHTML = '<div class="notice-banner">시찰회 화면은 서버 로그인(구글 또는 이메일) 후 이용할 수 있습니다. ' +
      '<a class="btn sm" style="margin-left:10px" href="login.html">로그인 화면으로</a></div>';
    return;
  }

  var sichals = [], sic = null, isOfficer = false, myDuty = '', isAuditor = false;
  var churches = [], pastors = [], docs = [], minutes = [], reports = [], submits = [];
  var churchStaff = [], bapAll = [], sicFin = [];
  var myChurch = user.church || '';
  var tab = (location.hash || '').replace(/^#/, '') || 'church';
  var year = new Date().getFullYear();

  function db() { return SHSCloud.init(); }
  function safeName(s) { return String(s || '').replace(/[^\w.\-가-힣]/g, '_'); }

  /* ---------- 불러오기 ---------- */
  function load() {
    db().then(function (c) {
      return c.from('sichals').select('*').order('sort');
    }).then(function (r) {
      if (r.error) {
        area.innerHTML = '<div class="notice-banner">시찰 정보를 불러오지 못했습니다: ' + e(r.error.message) +
          '<br><span style="font-size:0.85rem;color:var(--gray-5)">' +
          'Supabase에서 <strong>35_sichal.sql</strong>을 아직 실행하지 않으셨다면 먼저 실행해 주세요.</span></div>';
        return;
      }
      sichals = r.data || [];
      if (!sichals.length) {
        area.innerHTML = '<div class="notice-banner">등록된 시찰이 없습니다. ' +
          '관리자 → 회원 관리 → 시찰회 관리에서 시찰을 먼저 등록해 주세요.</div>';
        return;
      }
      if (!NAME) NAME = sichals[0].name;
      sic = sichals.filter(function (s) { return s.name === NAME; })[0];
      if (!sic) {
        area.innerHTML = '<div class="notice-banner">"' + e(NAME) + '" 시찰을 찾을 수 없습니다.' +
          '<div style="margin-top:10px">' + sichals.map(function (s) {
            return '<a class="btn sm" style="margin-right:6px" href="sichal.html?s=' +
              encodeURIComponent(s.name) + '">' + e(s.name) + '</a>';
          }).join('') + '</div></div>';
        return;
      }
      document.getElementById('si-title').textContent = NAME;
      document.getElementById('si-crumb').textContent = NAME;
      document.title = NAME + ' - 시화산노회';

      return db().then(function (c) {
        return Promise.all([
          c.rpc('my_sichals'),
          c.from('sichal_churches').select('*').eq('sichal', NAME).order('sort').order('id'),
          c.from('roster').select('id,name,church,position,category,note,birth_date,term_until,address,phone,postcode')
            .eq('sichal', NAME).order('category').order('sort'),
          c.from('church_staff').select('*').order('sort').order('id')
            .then(function (x) { return x; }, function () { return { data: [] }; }),
          c.from('sichal_docs').select('*').eq('sichal', NAME)
            .order('doc_date', { ascending: false }).order('id', { ascending: false }),
          c.from('sichal_minutes').select('*').eq('sichal', NAME)
            .order('met_on', { ascending: false }).order('id', { ascending: false }),
          c.from('church_reports').select('*').eq('sichal', NAME)
            .order('year', { ascending: false }).order('church'),
          /* 감사부 임원인지 보려고 함께 받아 둔다 */
          c.rpc('my_committees').then(function (x) { return x; }, function () { return { data: [] }; }),
          /* 노회 서기에게 낸 기록 (45 를 아직 실행하지 않았어도 그냥 넘어간다) */
          c.from('sichal_report_submissions').select('*').eq('sichal', NAME)
            .then(function (x) { return x; }, function () { return { data: [] }; }),
          /* 세례의무금 (47 을 아직 실행하지 않았어도 그냥 넘어간다) */
          c.from('bapdues').select('*').in('year', [year, year - 1])
            .then(function (x) { return x; }, function () { return { data: [] }; }),
          /* 시찰별 상회비·세례의무금 요약 (49 를 아직 실행하지 않았어도 넘어간다) */
          c.rpc('sichal_finance', { p_year: year })
            .then(function (x) { return x; }, function () { return { data: [] }; })
        ]);
      }).then(function (rs) {
        var mine = (rs[0] && rs[0].data) || [];
        mine.forEach(function (m) { if (m.sichal === NAME) { isOfficer = true; myDuty = m.duty_name; } });
        if (SHSAuth.canManageMembers(user)) { isOfficer = true; myDuty = myDuty || '노회 관리자'; }
        /* 감사부(감사헌의부) 임원이면 이 시찰의 회의록·회계를 감사할 수 있다 */
        isAuditor = SHSAuth.canManageMembers(user) ||
                    ((rs[7] && rs[7].data) || []).some(function (m) {
                      return m.committee === '감사헌의부' && m.is_officer;
                    });
        submits = (rs[8] && rs[8].data) || [];
        churches = (rs[1] && rs[1].data) || [];
        pastors  = (rs[2] && rs[2].data) || [];
        churchStaff = (rs[3] && rs[3].data) || [];
        /* 담임목사·주소·연락처는 회원 명단(노회 명단)이 원본이다.
         * 관내 교회 목록에는 명단 내용을 그대로 얹어서 보여 준다. */
        churches.forEach(function (ch) {
          var key = String(ch.name || '').replace(/\s|교회$/g, '');
          var pr = pastors.filter(function (m) {
            return m.category === '목사' &&
              String(m.church || '').replace(/\s|교회$/g, '') === key;
          })[0];
          if (pr) {
            ch.pastor  = pr.name;
            ch.pastorPos = pr.position || '목사';
            ch.address = pr.address || ch.address;
            ch.phone   = pr.phone   || ch.phone;
          }
        });
        bapAll   = (rs[9] && rs[9].data) || [];
        sicFin   = (rs[10] && rs[10].data) || [];
        docs     = (rs[4] && rs[4].data) || [];
        minutes  = (rs[5] && rs[5].data) || [];
        reports  = (rs[6] && rs[6].data) || [];
        draw();
      });
    }).catch(function (x) {
      area.innerHTML = '<div class="notice-banner">시찰회 화면을 불러오지 못했습니다: ' +
        e((x && x.message) || '') + '</div>';
    });
  }

  /* ---------- 화면 얼개 ---------- */
  function draw() {
    var h = '';

    h += '<div class="notice-banner">' +
      (isOfficer
        ? '<strong>' + e(SHS.honorific(user)) + '</strong>은 이 시찰의 <strong>' + e(myDuty) +
          '</strong>이시므로 관내 교회·자료·회의록을 등록하고 고치실 수 있습니다.'
        : '이 시찰의 관내 교회와 자료입니다. 등록·수정은 <strong>시찰장·서기</strong>가 합니다.') +
      '</div>';

    /* 다른 시찰로 건너가기 */
    h += '<div class="tabs" style="border-bottom:none;margin-bottom:14px">' +
      sichals.map(function (s) {
        return '<button class="' + (s.name === NAME ? 'active' : '') + '" ' +
          'data-go="' + e(s.name) + '">' + e(s.name) + '</button>';
      }).join('') + '</div>';

    /* 시찰 개요 */
    h += '<div class="cm-head"><div class="cm-officers">' +
      '<span><strong>시찰장</strong> ' + e(sic.head || '-') + '</span>' +
      '<span><strong>서기</strong> ' + e(sic.clerk || '-') + '</span>' +
      '<span><strong>회계</strong> ' + e(sic.treasurer || '-') + '</span>' +
      '</div>' +
      (sic.area ? '<p class="cm-duty">관할 지역 : ' + e(sic.area) + '</p>' : '') +
      '</div>';

    /* 상회비 · 세례의무금 진행률 — 노회 전체와 이 시찰 (49 sichal_finance) */
    (function () {
      if (!sicFin.length) return;
      var mo = new Date().getMonth() + 1;
      function wonf(n) { return Number(n || 0).toLocaleString('ko-KR'); }
      function bar(pct, color) {
        return '<div style="background:var(--gray-2,#e8eaef);border-radius:4px;height:10px;overflow:hidden">' +
          '<div style="height:100%;width:' + Math.min(100, pct) + '%;background:' + color + '"></div></div>';
      }
      function rowHtml(label, duesPlan, duesPaid, bapTarget, bapPaid, bapJoin, bapN) {
        var duesDue = Number(duesPlan || 0) / 12 * mo;
        var duesPct = duesDue ? Math.round(Number(duesPaid || 0) / duesDue * 100) : 0;
        var bapPct = Number(bapTarget || 0) ? Math.round(Number(bapPaid || 0) / Number(bapTarget) * 100) : 0;
        return '<div style="margin-bottom:12px">' +
          '<div style="font-size:0.88rem;font-weight:700;color:var(--navy);margin-bottom:4px">' + e(label) + '</div>' +
          '<div style="display:flex;gap:16px;flex-wrap:wrap">' +
          '<div style="flex:1 1 220px;min-width:200px">' +
          '<div style="display:flex;justify-content:space-between;font-size:0.78rem;color:var(--gray-6)">' +
          '<span>상회비</span><span><strong>' + duesPct + '%</strong> <span style="color:var(--gray-5)">(' +
          wonf(duesPaid) + '만원)</span></span></div>' + bar(duesPct, '#b03a3a') + '</div>' +
          '<div style="flex:1 1 220px;min-width:200px">' +
          '<div style="display:flex;justify-content:space-between;font-size:0.78rem;color:var(--gray-6)">' +
          '<span>세례의무금</span><span><strong>' + bapPct + '%</strong> <span style="color:var(--gray-5)">(' +
          wonf(bapPaid) + ' / ' + wonf(bapTarget) + '원 · ' + bapJoin + '/' + bapN + '곳)</span></span></div>' +
          bar(bapPct, '#d97b6c') + '</div>' +
          '</div></div>';
      }
      var tDP = 0, tDA = 0, tBT = 0, tBP = 0, tBJ = 0, tBN = 0;
      sicFin.forEach(function (x) {
        tDP += Number(x.out_dues_plan || 0); tDA += Number(x.out_dues_paid || 0);
        tBT += Number(x.out_bap_target || 0); tBP += Number(x.out_bap_paid || 0);
        tBJ += Number(x.out_bap_join || 0); tBN += Number(x.out_bap_churches || 0);
      });
      var mineFin = sicFin.filter(function (x) { return x.out_sichal === NAME; })[0];
      h += '<div class="side-box" style="max-width:860px;margin-bottom:16px"><div class="box-head">' +
        year + '년 상회비 · 세례의무금 진행률</div>' +
        '<div class="box-body">' +
        rowHtml('노회 전체', tDP, tDA, tBT, tBP, tBJ, tBN) +
        (mineFin
          ? rowHtml(NAME, mineFin.out_dues_plan, mineFin.out_dues_paid,
              mineFin.out_bap_target, mineFin.out_bap_paid,
              mineFin.out_bap_join, mineFin.out_bap_churches)
          : '') +
        '<p style="font-size:0.78rem;color:var(--gray-5);margin:0">상회비는 이번 달까지 부과된 금액 대비, ' +
        '세례의무금은 올해 목표금액 대비 납부율입니다. 교회별 자세한 내용은 임원방에서 보실 수 있습니다.</p>' +
        '</div></div>';
    })();

    h += '<div class="tabs" id="si-tabs">' +
      '<button class="' + (tab === 'church'  ? 'active' : '') + '" data-t="church">관내 교회 (' + churches.length + ')</button>' +
      '<button class="' + (tab === 'pastor'  ? 'active' : '') + '" data-t="pastor">목회자 명단 (' + pastors.length + ')</button>' +
      '<button class="' + (tab === 'doc'     ? 'active' : '') + '" data-t="doc">시찰 자료실 (' + docs.length + ')</button>' +
      '<button class="' + (tab === 'minutes' ? 'active' : '') + '" data-t="minutes">회의록 (' + minutes.length + ')</button>' +
      '<button class="' + (tab === 'ledger'  ? 'active' : '') + '" data-t="ledger">회계 관리</button>' +
      '<button class="' + (tab === 'report'  ? 'active' : '') + '" data-t="report">교회상황 보고서</button>' +
      '</div><div id="si-body"></div>';

    area.innerHTML = h;

    area.querySelectorAll('button[data-go]').forEach(function (b) {
      b.addEventListener('click', function () {
        location.href = 'sichal.html?s=' + encodeURIComponent(b.dataset.go);
      });
    });
    area.querySelectorAll('#si-tabs button').forEach(function (b) {
      b.addEventListener('click', function () {
        tab = b.dataset.t;
        history.replaceState(null, '', location.pathname + location.search + '#' + tab);
        draw();
      });
    });

    if (tab === 'pastor') drawPastors();
    else if (tab === 'doc') drawDocs();
    else if (tab === 'minutes') drawMinutes();
    else if (tab === 'ledger') drawLedger();
    else if (tab === 'report') drawReports();
    else drawChurches();
  }

  /* ================= 관내 교회 =================
   * 교회를 누르면 자세한 정보가 열린다.
   *   · 내 교회      → 담임목사·홈페이지·주소·연락처·비고를 고칠 수 있다
   *   · 남의 교회    → 보기만 한다
   *   · 시찰장·서기  → 관내 모든 교회를 고치고, 더하고 지운다
   * 교회 이름과 소속 시찰은 시찰장·서기만 바꾼다. (데이터베이스가 막는다) */
  var CH_FIELDS = [
    { k: 'pastor',  t: '담임목사' },
    { k: 'url',     t: '홈페이지' },
    { k: 'address', t: '주소' },
    { k: 'phone',   t: '연락처' },
    { k: 'note',    t: '비고' }
  ];
  var openCh = null;   /* 지금 열어 둔 교회 */
  /* 주소의 ?ch=교회명 — 대시보드 등에서 특정 교회를 바로 펼쳐 달라는 요청 */
  var WANT_CH = decodeURIComponent((location.search.match(/[?&]ch=([^&]*)/) || [])[1] || '')
                  .replace(/\+/g, ' ');

  /* 장로 한 분을 노회 명단과 대조한다.
   * 명단에 장로로 올라 있으면 <총대장로>, 없으면 그냥 <장로>다.
   * 총대는 남은 임기(총대 자격·정년)도 함께 알려 준다. */
  function elderOf(raw) {
    var n = window.SHSNames ? SHSNames.nameOf(raw) : String(raw || '').trim().split(/[\s(]/)[0];
    var r = pastors.filter(function (x) {
      return x.name === n && x.category === '장로';
    })[0];
    if (!r) return { name: n, title: '장로', term: '' };

    var today = new Date();
    var parts = [];
    if (r.term_until) {
      var left = Math.ceil((new Date(r.term_until + 'T00:00:00') - today) / 86400000);
      parts.push(left <= 0 ? '총대 자격 만료'
        : '총대 자격 ' + r.term_until + '까지 (' + left + '일 남음)');
    } else {
      parts.push('총대 자격 기간 미정');
    }
    var rd = SHS.retireDate(r.birth_date);
    if (rd) {
      parts.push(rd <= today ? '정년 경과'
        : '정년 ' + rd.getFullYear() + '. ' + (rd.getMonth() + 1) + '.');
    }
    return { name: n, title: '총대장로', term: parts.join(' · ') };
  }

  /* 교회에 적힌 장로들을 보기 좋게 늘어놓는다 */
  function elderList(raw) {
    var names = String(raw || '').split(',')
      .map(function (x) { return x.trim(); }).filter(function (x) { return x; });
    if (!names.length) return '<span style="color:var(--gray-5)">-</span>';
    return '<div class="eld-list">' + names.map(function (x) {
      var d = elderOf(x);
      return '<div class="eld-row"><span class="eld-n">' + e(d.name) + '</span>' +
        '<span class="eld-t' + (d.title === '총대장로' ? ' on' : '') + '">' + e(d.title) + '</span>' +
        (d.term ? '<span class="eld-d">' + e(d.term) + '</span>' : '') + '</div>';
    }).join('') + '</div>';
  }

  function isMyChurch(ch) { return !!myChurch && ch.name === myChurch; }
  function canEditCh(ch) { return isOfficer || isMyChurch(ch); }

  function homeUrl(ch) {
    var u = (ch.url || '').trim();
    if (!u) return '';
    return /^https?:\/\//i.test(u) ? u : 'https://' + u;
  }

  function drawChurches() {
    var box = document.getElementById('si-body');
    var h = '<p style="color:var(--gray-5);font-size:0.88rem">' +
      '교회를 누르시면 자세한 정보가 열립니다. ' +
      (myChurch
        ? '<strong>' + e(myChurch) + '</strong>의 정보는 직접 고치실 수 있습니다.'
        : '가입 정보에 소속 교회가 있어야 자기 교회 정보를 고치실 수 있습니다.') +
      '</p>';

    if (!churches.length) {
      h += '<p style="color:var(--gray-5)">등록된 교회가 없습니다.' +
        (isOfficer ? ' 아래에서 추가해 주세요.' : '') + '</p>';
    } else {
      h += '<div class="doc-list ch-list">' + churches.map(function (ch, i) {
        var link = homeUrl(ch);
        var mine = isMyChurch(ch);
        return '<div class="doc-item ch-card' + (mine ? ' mine' : '') +
          (openCh === ch.id ? ' open' : '') + '" data-chopen="' + i + '" tabindex="0" role="button">' +
          '<div class="d-name">' + e(ch.name) +
          (mine ? ' <span class="ch-mine">내 교회</span>' : '') + '</div>' +
          '<div class="d-desc">' +
          (ch.pastor ? '담임 ' + e(ch.pastor) + '<br>' : '') +
          (ch.address ? e(ch.address) + '<br>' : '') +
          (ch.phone ? '전화 ' + e(ch.phone) + '<br>' : '') +
          (link
            ? '<a class="btn ghost sm" href="' + e(link) + '" target="_blank" rel="noopener" ' +
              'data-chlink style="margin-top:2px">홈페이지로 이동 &#8599;</a>'
            : '<span style="color:var(--gray-5);font-size:0.8rem">홈페이지가 등록되지 않았습니다.</span>') +
          '</div>' +
          '<div class="ch-more">' + (canEditCh(ch) ? '누르면 고칠 수 있습니다' : '눌러서 자세히 보기') + '</div>' +
          '</div>';
      }).join('') + '</div>';
    }

    if (isOfficer) h += churchForm();
    box.innerHTML = h;
    SHSNames.attachAll(box);
    if (isOfficer) bindChurchForm();

    /* 홈페이지 이동 링크는 카드 열기와 겹치지 않게 한다 */
    box.querySelectorAll('a[data-chlink]').forEach(function (a) {
      a.addEventListener('click', function (ev) { ev.stopPropagation(); });
    });

    box.querySelectorAll('[data-chopen]').forEach(function (el) {
      function go() { showChurch(+el.dataset.chopen); }
      el.addEventListener('click', go);
      el.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); go(); }
      });
    });

    if (!openCh && WANT_CH) {
      var key0 = WANT_CH.replace(/\s|교회$/g, '');
      var wi = -1;
      churches.forEach(function (c, i) {
        if (wi === -1 && String(c.name || '').replace(/\s|교회$/g, '') === key0) wi = i;
      });
      WANT_CH = '';
      if (wi !== -1) { showChurch(wi); return; }
    }
    if (openCh) {
      var idx = churches.map(function (c) { return c.id; }).indexOf(openCh);
      if (idx !== -1) showChurch(idx, true);
    }
  }

  /* 교회 명부(교회 관리에서 입력)를 상세 표 줄로 만든다.
   * 시무장로 표시가 있으면 담임은 위임목사로 저절로 표기된다. */
  function staffRows(ch) {
    var key = String(ch.name || '').replace(/\s|교회$/g, '');
    var mine = churchStaff.filter(function (x) {
      return String(x.church || '').replace(/\s|교회$/g, '') === key;
    });
    if (!mine.length) {
      /* 명부가 없으면 예전 장로 칸(글자)으로 보여 준다 */
      return '<tr><th>장로</th><td class="left">' + elderList(ch.elders) + '</td></tr>';
    }
    function names(role) {
      return mine.filter(function (x) { return x.role === role; }).map(function (x) {
        var extra = [];
        if (x.is_chongdae) extra.push('총대장로');
        if (x.birth_date) extra.push('생년월일 ' + String(x.birth_date).slice(0, 10));
        if (x.ordained_on) extra.push('장립 ' + String(x.ordained_on).slice(0, 4) + '년');
        return e(x.name) + (extra.length
          ? ' <span style="color:var(--gray-5);font-size:0.85em">(' + extra.join(' · ') + ')</span>' : '');
      }).join(', ');
    }
    var out = '';
    [['원로목사', '원로목사'], ['부목사', '부목사'], ['시무장로', '시무장로'],
     ['원로장로', '원로장로'], ['은퇴장로', '은퇴장로'], ['협동장로', '협동장로']]
      .forEach(function (r) {
        var v = names(r[0]);
        if (v) out += '<tr><th>' + r[1] + '</th><td class="left">' + v + '</td></tr>';
      });
    if (!out) out = '<tr><th>장로</th><td class="left"><span style="color:var(--gray-5)">-</span></td></tr>';
    return out;
  }

  /* 정보 고치기 안의 장로 명부 (교회 명부 church_staff 기반) */
  function elderEditRows(ch) {
    var key = String(ch.name || '').replace(/\s|교회$/g, '');
    var elders = churchStaff.filter(function (x) {
      return x.role.indexOf('장로') !== -1 &&
        String(x.church || '').replace(/\s|교회$/g, '') === key;
    });
    if (!elders.length) {
      return '<p style="color:var(--gray-5);font-size:0.88rem">등록된 장로가 없습니다. 아래에서 추가해 주세요.</p>';
    }
    return '<table class="tbl" style="margin-bottom:12px"><tbody>' +
      elders.map(function (x) {
        return '<tr><td style="width:100px">' + e(x.role) + '</td>' +
          '<td class="left">' + e(x.name) +
          (x.is_chongdae ? ' <span style="color:var(--navy);font-size:0.82rem">(총대장로)</span>' : '') +
          (x.ordained_on ? ' <span style="color:var(--gray-5);font-size:0.82rem">장립 ' +
            e(String(x.ordained_on).slice(0, 10)) + '</span>' : '') + '</td>' +
          '<td style="width:160px">' +
          (SHSAuth.canManageMembers(user)
            ? '<button class="btn ghost sm" data-cechong="' + x.id + '" data-cev="' + (x.is_chongdae ? 1 : 0) +
              '" data-cen2="' + e(x.name) + '">' + (x.is_chongdae ? '총대 해제' : '총대 지정') + '</button> '
            : '') +
          '<button class="btn danger sm" data-cedel="' + x.id +
          '" data-cen="' + e(x.name) + '">삭제</button></td></tr>';
      }).join('') + '</tbody></table>';
  }

  function bindElderEditor(ch) {
    var add = document.getElementById('ce-add');
    if (!add) return;
    add.addEventListener('click', function () {
      var msg = document.getElementById('ce-msg');
      var name = document.getElementById('ce-name').value.trim();
      if (!name) { msg.className = 'form-msg err'; msg.textContent = '성명을 적어 주세요.'; return; }
      var d = {
        church: ch.name,
        role: document.getElementById('ce-role').value,
        name: name,
        birth_date: document.getElementById('ce-birth').value || null,
        ordained_on: document.getElementById('ce-ordained').value || null,
        is_chongdae: !!(document.getElementById('ce-chongdae') &&
                        document.getElementById('ce-chongdae').checked),
        updated_by: user.name
      };
      /* 노회 명단의 같은 이름 장로와 자동으로 짝을 맞춘다 */
      var ro = pastors.filter(function (m) { return m.category === '장로' && m.name === name; })[0];
      if (ro && ro.id) d.roster_id = ro.id;
      if (!d.birth_date && ro && ro.birth_date) d.birth_date = ro.birth_date;
      msg.className = 'form-msg'; msg.textContent = '추가 중입니다...';
      db().then(function (c) {
        return c.from('church_staff').insert(d).select();
      }).then(function (r) {
        var w = SHS.wrote(r);
        if (!w.ok) { msg.className = 'form-msg err'; msg.textContent = w.why; return; }
        SHSCloud.log('create', '교회 장로 추가', ch.name + ' ' + d.role + ' ' + name +
          (d.is_chongdae ? ' (총대장로)' : ''));
        load();
      });
    });
    document.querySelectorAll('button[data-cechong]').forEach(function (b) {
      b.addEventListener('click', function () {
        var on = b.dataset.cev === '1';
        if (!confirm(b.dataset.cen2 + ' 장로를 총대장로에서 ' + (on ? '해제' : '지정') + '하시겠습니까?')) return;
        db().then(function (c) {
          return c.from('church_staff').update({
            is_chongdae: !on, updated_at: new Date().toISOString(), updated_by: user.name
          }).eq('id', parseInt(b.dataset.cechong, 10)).select();
        }).then(function (r) {
          var w = SHS.wrote(r);
          if (!w.ok) { alert(w.why); return; }
          SHSCloud.log('update', '총대장로 ' + (on ? '해제' : '지정'), ch.name + ' ' + b.dataset.cen2);
          load();
        });
      });
    });
    document.querySelectorAll('button[data-cedel]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (!confirm(b.dataset.cen + ' 장로를 명부에서 지우시겠습니까?')) return;
        db().then(function (c) {
          return c.from('church_staff').delete().eq('id', parseInt(b.dataset.cedel, 10)).select();
        }).then(function (r) {
          if (r.error || !(r.data && r.data.length)) {
            alert((r.error && r.error.message) || '지우지 못했습니다. 권한을 확인해 주세요.');
            return;
          }
          SHSCloud.log('delete', '교회 장로 삭제', ch.name + ' ' + b.dataset.cen);
          load();
        });
      });
    });
  }

  /* 교회 하나를 펼쳐 보여 준다 */
  function showChurch(i, quiet) {
    var ch = churches[i];
    if (!ch) return;
    openCh = ch.id;

    /* 팝업으로 보여 준다 — 화면을 아래로 끌고 내려가지 않는다 */
    var oldMo = document.getElementById('ch-modal');
    if (oldMo) oldMo.remove();
    var ov = document.createElement('div');
    ov.id = 'ch-modal';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(15,25,45,.55);z-index:300;' +
      'display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;overflow:auto';
    ov.innerHTML = '<div style="background:#fff;border-radius:8px;max-width:820px;width:100%;' +
      'box-shadow:0 10px 40px rgba(0,0,0,.25);padding:8px 24px 24px;position:relative">' +
      '<button class="ch-modal-x" aria-label="닫기" style="position:absolute;top:10px;right:14px;' +
      'border:none;background:none;font-size:1.4rem;color:var(--gray-5);cursor:pointer">&times;</button>' +
      '<div id="ch-view"></div></div>';
    document.body.appendChild(ov);
    function closeChModal() {
      ov.remove();
      openCh = null;
      document.querySelectorAll('.ch-card').forEach(function (c) { c.classList.remove('open'); });
    }
    ov.addEventListener('click', function (ev2) { if (ev2.target === ov) closeChModal(); });
    ov.querySelector('.ch-modal-x').addEventListener('click', closeChModal);
    var v = ov.querySelector('#ch-view');

    document.querySelectorAll('.ch-card').forEach(function (c) {
      c.classList.toggle('open', +c.dataset.chopen === i);
    });

    var link = homeUrl(ch);
    var edit = canEditCh(ch);

    var h = '<div class="admin-card"><h3 style="margin-top:0">' + e(ch.name) +
      (isMyChurch(ch) ? ' <span class="ch-mine">내 교회</span>' : '') + '</h3>';

    if (link) {
      h += '<p><a class="btn sm" href="' + e(link) + '" target="_blank" rel="noopener">홈페이지 열기</a></p>';
    }

    /* 보기 */
    h += '<table class="tbl" style="margin-bottom:14px"><tbody>' +
      CH_FIELDS.map(function (f) {
        var val = ch[f.k];
        if (f.k === 'url' && val) {
          val = '<a href="' + e(link) + '" target="_blank" rel="noopener" ' +
                'style="color:var(--navy);text-decoration:underline">' + e(ch.url) + '</a>';
        } else if (f.k === 'pastor' && val) {
          val = e(val) + (ch.pastorPos && ch.pastorPos !== '목사'
            ? ' <span style="color:var(--gray-5)">(' + e(ch.pastorPos) + ')</span>' : '');
        } else {
          val = val ? e(val) : '<span style="color:var(--gray-5)">-</span>';
        }
        return '<tr><th style="width:120px">' + e(f.t) + '</th><td class="left">' + val + '</td></tr>';
      }).join('') +
      staffRows(ch) +
      '<tr><th>소속 시찰</th><td class="left">' + e(ch.sichal) + '</td></tr>' +
      '</tbody></table>';

    if (edit) {
      h += '<h4 class="mn-sub">정보 고치기</h4>' +
        '<p style="font-size:0.82rem;color:var(--gray-5)">' +
        '빈칸으로 두고 저장하면 그 항목은 지워집니다. ' +
        '교회 이름과 소속 시찰은 시찰장·서기가 정합니다.</p>' +
        '<p style="font-size:0.82rem;color:var(--gray-6)">담임목사·주소·연락처는 ' +
        '<strong>회원 명단</strong>에서 자동으로 가져옵니다. 틀렸다면 담임목사께서 ' +
        '<a href="mypage.html" style="color:var(--navy);text-decoration:underline">내 정보</a>에서 고치시거나 ' +
        '노회 서기가 명단 관리에서 고치시면 됩니다.</p>' +
        '<div class="field"><label>홈페이지 주소</label>' +
        '<input type="text" id="cv-url" value="' + e(ch.url || '') + '"></div>' +
        '<h4 class="mn-sub">장로 명부</h4>' +
        '<p style="font-size:0.82rem;color:var(--gray-5)">담임목사는 자기 교회의 장로 명단을 ' +
        '넣고 뺄 수 있습니다. 노회 회원이 아닌 장로도 등록할 수 있습니다. ' +
        '<strong>총대장로 표시는 관리자(노회 서기·간사)가 합니다.</strong></p>' +
        elderEditRows(ch) +
        '<div class="inline-form" style="margin-bottom:12px">' +
        '<div class="field" style="flex:0 0 120px"><label>구분</label><select id="ce-role">' +
        ['시무장로', '원로장로', '은퇴장로', '협동장로'].map(function (r2) {
          return '<option>' + r2 + '</option>';
        }).join('') + '</select></div>' +
        '<div class="field" style="flex:0 0 130px"><label>성명</label><input type="text" id="ce-name"></div>' +
        '<div class="field" style="flex:0 0 150px"><label>생년월일 (선택)</label><input type="date" id="ce-birth"></div>' +
        '<div class="field" style="flex:0 0 150px"><label>장립일 (선택)</label><input type="date" id="ce-ordained"></div>' +
        (SHSAuth.canManageMembers(user)
          ? '<div class="field" style="flex:0 0 90px"><label>총대장로</label>' +
            '<input type="checkbox" id="ce-chongdae" style="width:auto;margin-top:10px"></div>'
          : '') +
        '<button class="btn sm" id="ce-add" style="align-self:flex-end">장로 추가</button>' +
        '</div>' +
        '<div class="form-msg" id="ce-msg"></div>' +
        '<div class="field"><label>비고</label>' +
        '<input type="text" id="cv-note" value="' + e(ch.note || '') + '"></div>' +
        '<button class="btn" id="cv-save">저장</button> ' +
        (isOfficer
          ? '<button class="btn danger" id="cv-del">교회 지우기</button>' : '') +
        '<div class="form-msg" id="cv-msg"></div>';
    } else {
      h += '<p style="font-size:0.82rem;color:var(--gray-5)">' +
        '이 교회의 정보는 <strong>' + e(ch.name) + '</strong> 소속 회원과 ' +
        '시찰장·서기가 고칠 수 있습니다.</p>';
    }
    h += '</div>';
    v.innerHTML = h;
    SHSNames.attachAll(v);

    if (edit) {
      bindElderEditor(ch);
      document.getElementById('cv-save').addEventListener('click', function () {
        var msg = document.getElementById('cv-msg');
        var d = { updated_at: new Date().toISOString(), updated_by: user.name };
        ['url', 'note'].forEach(function (k) {
          d[k] = document.getElementById('cv-' + k).value.trim() || null;
        });
        msg.className = 'form-msg'; msg.textContent = '저장 중입니다...';
        db().then(function (c) {
          /* .select() 로 고친 줄을 되받아 정말 저장되었는지 확인한다.
           * 권한이 없으면 Supabase 는 오류 없이 0줄만 돌려주기 때문이다. */
          return c.from('sichal_churches').update(d).eq('id', ch.id).select();
        }).then(function (r) {
          var w = SHS.wrote(r);
          if (!w.ok) { msg.className = 'form-msg err'; msg.textContent = w.why; return; }
          SHSCloud.log('update', '관내 교회 정보 수정', NAME + ' / ' + ch.name);
          load();
        });
      });
      var del = document.getElementById('cv-del');
      if (del) del.addEventListener('click', function () {
        if (!confirm('"' + ch.name + '"을(를) 관내 교회 목록에서 지우시겠습니까?')) return;
        db().then(function (c) {
          return c.from('sichal_churches').delete().eq('id', ch.id);
        }).then(function (r) {
          if (r.error) { alert(r.error.message); return; }
          SHSCloud.log('delete', '관내 교회 삭제', NAME + ' / ' + ch.name);
          closeChModal();
          load();
        });
      });
    }

    SHS.logAction('view', '관내 교회 열람', NAME + ' / ' + ch.name);
  }

      ['id', 'name', 'url', 'note'].forEach(function (k) {
        document.getElementById('ch-' + k).value = '';
      });

    document.getElementById('ch-save').addEventListener('click', function () {

                  : c.from('sichal_churches').insert(d).select();

        SHSCloud.log(id ? 'update' : 'create', '관내 교회 ' + (id ? '수정' : '추가'), NAME + ' / ' + d.name);
        load();
      });
    });
  }

    var h = '<p style="color:var(--gray-5);font-size:0.88rem">' +
      '시찰 서류를 올려 두는 곳입니다. 자료마다 누가 볼 수 있는지 정할 수 있습니다.</p>';

    if (!docs.length) {
      h += '<p style="color:var(--gray-5)">등록된 자료가 없습니다.</p>';
    } else {
      h += '<table class="tbl"><thead><tr><th style="width:120px">날짜</th><th>제목</th>' +
        '<th style="width:120px">열람 범위</th><th style="width:170px">자료</th>' +
        (isOfficer ? '<th style="width:120px">관리</th>' : '') + '</tr></thead><tbody>';
      docs.forEach(function (d, i) {
        h += '<tr><td>' + e(d.doc_date || '-') + '</td>' +
          '<td class="left">' + e(d.title) +
          (d.description ? '<div style="font-size:0.82rem;color:var(--gray-5)">' + e(d.description) + '</div>' : '') +
          '</td>' +
          '<td><span class="role-badge">' + e(accessName(d.access)) + '</span></td>' +
          '<td>' +
          (d.file_path ? '<button class="btn sm" data-dcfile="' + i + '">내려받기</button> ' : '') +
          (d.link_url ? '<a class="btn ghost sm" href="' + e(d.link_url) + '" target="_blank" rel="noopener">링크</a>' : '') +
          (!d.file_path && !d.link_url ? '<span style="color:var(--gray-5)">-</span>' : '') +
          '</td>' +
          (isOfficer
            ? '<td><button class="btn ghost sm" data-dcedit="' + i + '">수정</button> ' +
              '<button class="btn danger sm" data-dcdel="' + i + '">삭제</button></td>'
            : '') +
          '</tr>';
      });
      h += '</tbody></table>';
    }

    if (isOfficer) h += docForm();
    box.innerHTML = h;
    if (isOfficer) bindDocForm();

    box.querySelectorAll('button[data-dcfile]').forEach(function (b) {
      b.addEventListener('click', function () {
        var d = docs[+b.dataset.dcfile];
        db().then(function (c) {
          return c.storage.from('sichal-files').createSignedUrl(d.file_path, 60);
        }).then(function (r) {
          if (r.error) { alert('내려받지 못했습니다: ' + r.error.message); return; }
          SHSCloud.log('view', '시찰 자료 내려받기', NAME + ' / ' + d.title);
          window.open(r.data.signedUrl, '_blank', 'noopener');
        });
      });
    });
    box.querySelectorAll('button[data-dcedit]').forEach(function (b) {
      b.addEventListener('click', function () {
        var d = docs[+b.dataset.dcedit];
        document.getElementById('dc-id').value = d.id;
        document.getElementById('dc-title').value = d.title;
        document.getElementById('dc-desc').value = d.description || '';
        document.getElementById('dc-date').value = d.doc_date || '';
        document.getElementById('dc-access').value = d.access;
        document.getElementById('dc-link').value = d.link_url || '';
        document.getElementById('dc-ftitle').textContent = '자료 수정';
        document.getElementById('dc-cancel').classList.remove('hidden');
        document.getElementById('dc-ftitle').scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    });
    box.querySelectorAll('button[data-dcdel]').forEach(function (b) {
      b.addEventListener('click', function () {
        var d = docs[+b.dataset.dcdel];
        if (!confirm('"' + d.title + '" 자료를 삭제하시겠습니까? 되돌릴 수 없습니다.')) return;
        db().then(function (c) {
          var pre = d.file_path
            ? c.storage.from('sichal-files').remove([d.file_path]).catch(function () {})
            : Promise.resolve();
          return pre.then(function () { return c.from('sichal_docs').delete().eq('id', d.id); });
        }).then(function (r) {
          if (r.error) { alert(r.error.message); return; }
          SHSCloud.log('delete', '시찰 자료 삭제', NAME + ' / ' + d.title);
          load();
        });
      });
    });
  }

  function docForm() {
    return '<div class="admin-card" style="margin-top:18px">' +
      '<h3 style="margin-top:0" id="dc-ftitle">자료 등록</h3>' +
      '<input type="hidden" id="dc-id" value="">' +
      '<div class="inline-form">' +
      '<div class="field"><label>제목</label><input type="text" id="dc-title"></div>' +
      '<div class="field" style="flex:0 0 160px"><label>날짜</label><input type="date" id="dc-date"></div>' +
      '<div class="field" style="flex:0 0 160px"><label>열람 범위</label><select id="dc-access">' +
      ACCESS.map(function (a) { return '<option value="' + a.v + '">' + a.t + '</option>'; }).join('') +
      '</select></div>' +
      '</div>' +
      '<div class="field"><label>설명 (선택)</label><input type="text" id="dc-desc"></div>' +
      '<div class="field"><label>링크 주소 (선택)</label><input type="text" id="dc-link" placeholder="https://..."></div>' +
      '<div class="field"><label>첨부파일 (선택 · 다시 올리면 예전 파일을 대신합니다)</label>' +
      '<input type="file" id="dc-file"></div>' +
      '<button class="btn" id="dc-save">저장</button> ' +
      '<button class="btn ghost hidden" id="dc-cancel">취소</button>' +
      '<div class="form-msg" id="dc-msg"></div></div>';
  }

  function bindDocForm() {
    SHS.dropZone(document.getElementById('dc-file'), { what: '첨부파일' });
    document.getElementById('dc-file').addEventListener('change', function () {
      docFile = this.files[0] || null;
    });
    document.getElementById('dc-cancel').addEventListener('click', function () {
      ['dc-id', 'dc-title', 'dc-desc', 'dc-date', 'dc-link'].forEach(function (id) {
        document.getElementById(id).value = '';
      });
      document.getElementById('dc-ftitle').textContent = '자료 등록';
      docFile = null;
      this.classList.add('hidden');
    });
    document.getElementById('dc-save').addEventListener('click', function () {
      var msg = document.getElementById('dc-msg');
      var id = document.getElementById('dc-id').value;
      var d = {
        sichal: NAME,
        title: document.getElementById('dc-title').value.trim(),
        description: document.getElementById('dc-desc').value.trim() || null,
        doc_date: document.getElementById('dc-date').value || null,
        access: document.getElementById('dc-access').value,
        link_url: document.getElementById('dc-link').value.trim() || null,
        updated_at: new Date().toISOString(),
        updated_by: user.name
      };
      if (!d.title) { msg.className = 'form-msg err'; msg.textContent = '제목을 입력해 주세요.'; return; }
      if (!id) d.created_by = user.name;
      msg.className = 'form-msg'; msg.textContent = '저장 중입니다...';

      db().then(function (c) {
        var pre = Promise.resolve(null);
        if (docFile) {
          var path = safeName(NAME) + '/doc-' + Date.now() + '-' + safeName(docFile.name);
          pre = c.storage.from('sichal-files').upload(path, docFile).then(function (r) {
            if (r.error) throw r.error;
            return { file_path: path, file_name: docFile.name };
          });
        }
        return pre.then(function (f) {
          if (f) { d.file_path = f.file_path; d.file_name = f.file_name; }
          return id ? c.from('sichal_docs').update(d).eq('id', id).select()
                    : c.from('sichal_docs').insert(d).select();
        });
      }).then(function (r) {
        var w = SHS.wrote(r);
        if (!w.ok) { msg.className = 'form-msg err'; msg.textContent = w.why; return; }
        SHSCloud.log(id ? 'update' : 'create', '시찰 자료 ' + (id ? '수정' : '등록'), NAME + ' / ' + d.title);
        docFile = null;
        load();
      }).catch(function (x) {
        msg.className = 'form-msg err';
        msg.textContent = '저장 실패: ' + ((x && x.message) || x);
      });
    });
  }

  /* ================= 회의록 =================
   * 상비부와 똑같은 모양이므로 공용 모듈이 그린다. (js/minutes-box.js)
   * 감사 칸도 그 안에서 함께 붙는다. */
  function drawMinutes() {
    SHSMinutesBox.mount(document.getElementById('si-body'), {
      kind: 'sichal', owner: NAME, user: user,
      canEdit: isOfficer, isAuditor: isAuditor
    });
  }

  /* ================= 회계 장부 ================= */
  /* ================= 회계 관리 =================
   * 회비 납부 현황(시찰회비)과 회계 장부를 탭으로 나눠 보여 준다.
   * 시찰회비는 1년에 두 차례(상반기·하반기), 1회분은 노회 상회비 한 달치다. */
  var accTab = 'fee';

  /* 시찰 회계인가 — 시찰 명부의 회계 이름과 내 이름이 같으면 */
  function isTreasurer() {
    var t = String((sic && sic.treasurer) || '').trim().split(' ')[0];
    return !!t && t === String(user.name || '').trim();
  }

  function drawLedger() {
    var body = document.getElementById('si-body');
    body.innerHTML =
      '<div class="tabs" id="acc-tabs" style="margin-bottom:14px">' +
      '<button class="' + (accTab === 'fee' ? 'active' : '') + '" data-a="fee">회비 납부 현황</button>' +
      '<button class="' + (accTab === 'ledger' ? 'active' : '') + '" data-a="ledger">회계 장부</button>' +
      '</div><div id="acc-body"><p style="color:var(--gray-5)">불러오는 중...</p></div>';
    body.querySelectorAll('#acc-tabs button').forEach(function (b) {
      b.addEventListener('click', function () {
        accTab = b.dataset.a;
        drawLedger();
      });
    });
    if (accTab === 'ledger') {
      SHSLedger.mount(document.getElementById('acc-body'), {
        kind: 'sichal', owner: NAME, user: user,
        canEdit: isOfficer, isAuditor: isAuditor
      });
    } else {
      drawFees();
    }
  }

  /* ---------- 회비 납부 현황 ----------
   * 입력·수정: 노회 관리자, 시찰장·서기, 시찰 회계 (서버 규칙과 같다) */
  function drawFees() {
    var box = document.getElementById('acc-body');
    var canFee = isOfficer || isTreasurer();
    db().then(function (c) {
      return Promise.all([
        c.rpc('sichal_finance_detail', { p_year: year, p_sichal: NAME })
          .then(function (x) { return x; }, function () { return { data: [] }; }),
        c.from('sichal_fees').select('*').eq('year', year).eq('sichal', NAME),
        /* 시찰회가 따로 정한 회비 (51 을 아직 실행하지 않았어도 넘어간다) */
        c.from('sichal_fee_rates').select('*').eq('year', year).eq('sichal', NAME)
          .then(function (x) { return x; }, function () { return { data: [] }; })
      ]);
    }).then(function (rs) {
      if (rs[1].error) throw rs[1].error;
      var monthly = {};
      ((rs[0] || {}).data || []).forEach(function (d) {
        monthly[String(d.out_church || '').replace(/\s|교회$/g, '')] = Number(d.out_monthly || 0);
      });
      /* 시찰회가 정한 금액이 있으면 그것이 기준액이다 */
      var custom = {};
      ((rs[2] || {}).data || []).forEach(function (d) {
        custom[String(d.church || '').replace(/\s|교회$/g, '')] = Number(d.amount || 0);
      });
      function baseOf(nm) {
        var k = String(nm).replace(/\s|교회$/g, '');
        return custom[k] != null ? custom[k] : (monthly[k] || 0);
      }
      function isCustom(nm) {
        return custom[String(nm).replace(/\s|교회$/g, '')] != null;
      }
      var fees = rs[1].data || [];
      function feeOf(church, half) {
        return fees.filter(function (f) {
          return f.church === church && Number(f.half) === half;
        })[0] || null;
      }

      var names = churches.map(function (ch) { return ch.name; });
      var sum1 = 0, sum2 = 0, n1 = 0, n2 = 0;
      names.forEach(function (nm) {
        var f1 = feeOf(nm, 1), f2 = feeOf(nm, 2);
        if (f1) { sum1 += Number(f1.amount || 0); n1++; }
        if (f2) { sum2 += Number(f2.amount || 0); n2++; }
      });

      var h = '<div class="notice-banner">시찰회비는 한 해에 <strong>상반기·하반기 두 차례</strong> 내며, ' +
        '따로 정하지 않으면 1회분은 <strong>노회 상회비 한 달치</strong>를 기준으로 합니다. ' +
        '금액은 <strong>시찰회가 정할 수 있습니다</strong>.' +
        (canFee ? ' 기준액의 수정 단추로 회비를 바꾸고, 납부를 누르면 기준액으로 기록됩니다.'
                : ' 입력·수정은 시찰장·서기·회계가 합니다.') +
        '</div>';
      h += '<div class="dues-stats" style="margin-bottom:14px">' +
        '<div class="ds"><div class="n">' + n1 + '/' + names.length + '곳</div><div class="l">상반기 납부 (' + sum1.toLocaleString('ko-KR') + '만원)</div></div>' +
        '<div class="ds"><div class="n">' + n2 + '/' + names.length + '곳</div><div class="l">하반기 납부 (' + sum2.toLocaleString('ko-KR') + '만원)</div></div>' +
        '</div>';

      h += '<div style="overflow-x:auto"><table class="tbl" style="max-width:760px"><thead><tr>' +
        '<th class="left">교회</th><th style="width:120px">기준액(만원)</th>' +
        '<th style="width:180px">상반기</th><th style="width:180px">하반기</th></tr></thead><tbody>';
      names.forEach(function (nm) {
        var base = baseOf(nm);
        function cell(half) {
          var f = feeOf(nm, half);
          if (f) {
            return '<span style="color:#2a7a2a;font-weight:700">납부</span>' +
              (canFee ? ' <button class="btn ghost sm" data-feedel="' + f.id + '" data-fc="' + e(nm) + '">취소</button>' : '');
          }
          return '<span style="color:#b0731f">미납</span>' +
            (canFee ? ' <button class="btn sm" data-feepay="' + e(nm) + '" data-fh="' + half + '" data-fa="' + base + '">납부</button>' : '');
        }
        h += '<tr><td class="left"><strong>' + e(nm) + '</strong></td>' +
          '<td style="text-align:right">' + (base ? base.toLocaleString('ko-KR') : '-') +
          (isCustom(nm) ? ' <span style="font-size:0.7rem;color:var(--gray-5)">(시찰 지정)</span>' : '') +
          (canFee ? ' <button class="btn ghost sm" data-feerate="' + e(nm) + '" data-fb="' + base + '">수정</button>' : '') +
          '</td>' +
          '<td>' + cell(1) + '</td><td>' + cell(2) + '</td></tr>';
      });
      h += '</tbody></table></div>';
      box.innerHTML = h;
      if (!canFee) return;

      /* 시찰회비 금액 수정 (시찰회가 정한다) */
      box.querySelectorAll('button[data-feerate]').forEach(function (b) {
        b.addEventListener('click', function () {
          var nm = b.dataset.feerate;
          var v = prompt(nm + '의 1회분 시찰회비(만원)를 입력해 주세요.\n' +
            '비우고 확인하면 노회 상회비 한 달치 기준으로 돌아갑니다.', b.dataset.fb || '');
          if (v === null) return;
          v = v.trim();
          db().then(function (c) {
            if (v === '') {
              return c.from('sichal_fee_rates').delete()
                .eq('year', year).eq('sichal', NAME).eq('church', nm);
            }
            return c.from('sichal_fee_rates').upsert({
              year: year, sichal: NAME, church: nm,
              amount: parseInt(v, 10) || 0,
              updated_by: user.name, updated_at: new Date().toISOString()
            }, { onConflict: 'year,sichal,church' });
          }).then(function (res) {
            if (res.error) { alert(res.error.message); return; }
            SHS.logAction('update', '시찰회비 금액 설정',
              year + '년 ' + NAME + ' ' + nm + ' ' + (v === '' ? '(기본으로)' : v + '만원'));
            drawFees();
          });
        });
      });

      box.querySelectorAll('button[data-feepay]').forEach(function (b) {
        b.addEventListener('click', function () {
          var amt = Number(b.dataset.fa) || 0;
          var v = prompt(b.dataset.feepay + ' — ' + (b.dataset.fh === '1' ? '상반기' : '하반기') +
            ' 시찰회비 납부액(만원)을 확인해 주세요.', amt || '');
          if (v === null) return;
          amt = parseInt(v, 10) || 0;
          db().then(function (c) {
            return c.from('sichal_fees').insert({
              year: year, sichal: NAME, church: b.dataset.feepay,
              half: Number(b.dataset.fh), amount: amt,
              paid_on: new Date().toISOString().slice(0, 10), entered_by: user.name
            });
          }).then(function (res) {
            if (res.error) { alert(res.error.message); return; }
            SHS.logAction('create', '시찰회비 납부 입력',
              year + '년 ' + NAME + ' ' + b.dataset.feepay + ' ' + (b.dataset.fh === '1' ? '상반기' : '하반기') + ' ' + amt + '만원');
            drawFees();
          });
        });
      });
      box.querySelectorAll('button[data-feedel]').forEach(function (b) {
        b.addEventListener('click', function () {
          if (!confirm(b.dataset.fc + '의 납부 기록을 취소할까요?')) return;
          db().then(function (c) {
            return c.from('sichal_fees').delete().eq('id', b.dataset.feedel);
          }).then(function (res) {
            if (res.error) { alert(res.error.message); return; }
            SHS.logAction('delete', '시찰회비 납부 취소', year + '년 ' + NAME + ' ' + b.dataset.fc);
            drawFees();
          });
        });
      });
    }).catch(function (x) {
      box.innerHTML = '<div class="notice-banner">회비 납부 현황을 불러오지 못했습니다: ' +
        e((x && x.message) || '') +
        '<br><span style="font-size:0.85rem;color:var(--gray-5)">Supabase에서 <strong>50_sichal_fees.sql</strong>을 ' +
        '아직 실행하지 않으셨다면 먼저 실행해 주세요.</span></div>';
    });
  }

  /* ================= 교회상황 보고서 ================= */

  /* 노회 서기에게 제출 — 시찰장·서기가 한 해치를 모아 올린다 */
  function submitOf(y) {
    return submits.filter(function (x) { return x.year === y; })[0] || null;
  }

  function submitBox() {
    var got = submitOf(year);
    var made = reports.filter(function (r) { return r.year === year; }).length;
    var all = churches.length;

    var h = '<div class="admin-card" id="rp-sub" style="margin-bottom:16px">' +
      '<h3 style="margin-top:0">노회 서기에게 제출</h3>';

    if (got) {
      h += '<div class="dash-ok"><strong>' + year + '년 보고서를 노회 서기에게 제출했습니다.</strong> ' +
        '<span class="dash-dim">(' + e(String(got.submitted_at).replace('T', ' ').slice(0, 16)) +
        ' · ' + e(got.submitted_by || '-') + ' · 교회 ' + got.churches + '곳)</span></div>';
      if (got.churches !== made) {
        h += '<p style="font-size:0.86rem;color:var(--red);margin-top:10px">' +
          '제출한 뒤 보고서가 바뀌었습니다. (지금 ' + made + '곳) 다시 제출해 주시기 바랍니다.</p>';
      }
    } else {
      h += '<p style="font-size:0.9rem;color:var(--gray-7);margin:0">' +
        '관내 <strong>' + all + '곳</strong> 가운데 <strong>' + made + '곳</strong>이 보고서를 냈습니다. ' +
        '아직 노회에 제출하지 않았습니다.</p>';
    }

    if (isOfficer) {
      h += '<div class="inline-form" style="margin-top:12px">' +
        '<div class="field"><label for="rp-note">함께 드릴 말씀 (없으면 비워 두셔도 됩니다)</label>' +
        '<input type="text" id="rp-note" value="' + e((got && got.note) || '') + '"></div>' +
        '<button class="btn" id="rp-submit">' + (got ? '다시 제출' : '노회 서기에게 제출') + '</button>' +
        (got ? ' <button class="btn ghost" id="rp-unsubmit">제출 취소</button>' : '') +
        '</div><div class="form-msg" id="rp-submsg"></div>';
    } else {
      h += '<p style="font-size:0.82rem;color:var(--gray-5);margin:10px 0 0">' +
        '노회 제출은 <strong>시찰장·서기</strong>가 합니다.</p>';
    }
    return h + '</div>';
  }

  function bindSubmit() {
    var go = document.getElementById('rp-submit');
    if (!go) return;
    var msg = document.getElementById('rp-submsg');

    function run(fn, args, done) {
      go.disabled = true;
      msg.className = 'form-msg'; msg.textContent = '처리 중입니다...';
      db().then(function (c) { return c.rpc(fn, args); }).then(function (r) {
        go.disabled = false;
        if (r && r.error) {
          msg.className = 'form-msg err';
          msg.textContent = r.error.message +
            ' (45 보고서 노회 제출 등록이 필요할 수 있습니다)';
          return;
        }
        done(r && r.data);
      }, function (x) {
        go.disabled = false;
        msg.className = 'form-msg err';
        msg.textContent = String(x);
      });
    }

    go.addEventListener('click', function () {
      var made = reports.filter(function (r) { return r.year === year; }).length;
      if (!made) {
        msg.className = 'form-msg err';
        msg.textContent = '제출할 보고서가 없습니다. 교회들이 먼저 보고서를 올려야 합니다.';
        return;
      }
      if (!confirm(year + '년 교회상황 보고서 ' + made + '곳을 노회 서기에게 제출합니다.\n\n' +
                   '보내시겠습니까?')) return;
      run('submit_sichal_reports',
          { p_year: year, p_sichal: NAME,
            p_note: document.getElementById('rp-note').value.trim() },
          function (n) {
            SHS.logAction('add', '교회상황 보고서 노회 제출', NAME + ' ' + year + '년 ' + n + '곳');
            load();
          });
    });

    var un = document.getElementById('rp-unsubmit');
    if (un) un.addEventListener('click', function () {
      if (!confirm(year + '년 제출을 취소하시겠습니까?')) return;
      run('unsubmit_sichal_reports', { p_year: year, p_sichal: NAME }, function () {
        SHS.logAction('delete', '교회상황 보고서 제출 취소', NAME + ' ' + year + '년');
        load();
      });
    });
  }

  function drawReports() {
    var box = document.getElementById('si-body');
    var years = {};
    reports.forEach(function (r) { years[r.year] = 1; });
    years[year] = 1;
    var yearList = Object.keys(years).map(Number).sort(function (a, b) { return b - a; });

    var mineOnly = !isOfficer;
    var canWriteFor = isOfficer
      ? churches.map(function (c) { return c.name; })
      : (myChurch ? [myChurch] : []);

    var h = '<p style="color:var(--gray-5);font-size:0.88rem">' +
      (isOfficer
        ? '관내 교회의 해마다의 상황 보고서입니다. 시찰장·서기는 교회를 골라 대신 올려 드릴 수 있습니다.'
        : '자기 교회의 상황 보고서를 올리는 곳입니다. 올린 보고서는 노회 임원방에서도 열람합니다.') +
      '</p>';

    h += '<div class="field" style="max-width:200px"><label>연도</label>' +
      '<select id="rp-year">' + yearList.map(function (y) {
        return '<option value="' + y + '"' + (y === year ? ' selected' : '') + '>' + y + '년</option>';
      }).join('') + '</select></div>';

    h += submitBox();

    var rows = reports.filter(function (r) {
      return r.year === year && (!mineOnly || r.church === myChurch);
    });

    if (isOfficer) {
      /* 관내 교회를 모두 늘어놓고, 낸 곳과 안 낸 곳을 함께 보여 준다 */
      h += '<table class="tbl"><thead><tr><th style="width:170px">교회</th><th style="width:110px">담임</th>' +
        '<th style="width:100px">전체 교인</th><th style="width:100px">세례교인</th>' +
        '<th style="width:110px">평균 출석</th><th style="width:110px">제출</th>' +
        '<th style="width:190px">관리</th></tr></thead><tbody>';
      churches.forEach(function (ch) {
        var r = rows.filter(function (x) { return x.church === ch.name; })[0];
        h += '<tr' + (r ? '' : ' style="opacity:.6"') + '>' +
          '<td>' + e(ch.name) + '</td><td>' + e(ch.pastor || '-') + '</td>' +
          '<td>' + (r && r.members_total != null ? r.members_total : '-') + '</td>' +
          '<td>' + (r && r.members_baptized != null ? r.members_baptized : '-') + '</td>' +
          '<td>' + (r && r.worship_avg != null ? r.worship_avg : '-') + '</td>' +
          '<td>' + (r ? '<span class="role-badge">제출</span>' : '<span style="color:var(--gray-5)">미제출</span>') + '</td>' +
          '<td>' +
          (r ? '<a class="btn sm" href="report.html?id=' + r.id + '">보기·인쇄</a> ' : '') +
          (r && r.file_path ? '<button class="btn ghost sm" data-rpfile="' + r.id + '">첨부</button> ' : '') +
          '<a class="btn ghost sm" href="report.html?church=' + encodeURIComponent(ch.name) +
          '&year=' + year + '">' + (r ? '수정' : '작성') + '</a>' +
          (r ? ' <button class="btn danger sm" data-rpdel="' + r.id + '">삭제</button>' : '') +
          '</td></tr>';
      });
      h += '</tbody></table>';
    } else if (!canWriteFor.length) {
      h += '<div class="notice-banner">가입 정보에 소속 교회가 없어 보고서를 올릴 수 없습니다. ' +
        '마이페이지에서 소속 교회를 먼저 채워 주세요.</div>';
    } else {
      var mine = rows[0];
      h += '<div class="notice-banner"><strong>' + e(myChurch) + '</strong>의 ' + year + '년 보고서 ' +
        (mine ? '— 제출하셨습니다. 아래에서 보거나 고치실 수 있습니다.' : '— 아직 제출하지 않으셨습니다.') +
        '</div>';
      h += '<div style="margin:14px 0">' +
        '<a class="btn" href="report.html?church=' + encodeURIComponent(myChurch) + '&year=' + year + '">' +
        (mine ? '보고서 수정하기' : '교회상황 보고서 작성하기') + '</a>' +
        (mine ? ' <a class="btn ghost" href="report.html?id=' + mine.id + '">보기·인쇄</a>' : '') +
        '</div>';
      if (mine) {
        h += '<div style="margin:10px 0">' +
          (mine.file_path ? '<button class="btn ghost sm" data-rpfile="' + mine.id + '">첨부 내려받기</button> ' : '') +
          '<button class="btn danger sm" data-rpdel="' + mine.id + '">삭제</button></div>';
      }
    }

    box.innerHTML = h;

    bindSubmit();

    document.getElementById('rp-year').addEventListener('change', function () {
      year = parseInt(this.value, 10);
      drawReports();
    });

    box.querySelectorAll('button[data-rpfile]').forEach(function (b) {
      b.addEventListener('click', function () {
        var r = reports.filter(function (x) { return String(x.id) === b.dataset.rpfile; })[0];
        if (!r) return;
        db().then(function (c) {
          return c.storage.from('church-reports').createSignedUrl(r.file_path, 60);
        }).then(function (rr) {
          if (rr.error) { alert('내려받지 못했습니다: ' + rr.error.message); return; }
          SHSCloud.log('view', '교회상황 보고서 첨부 내려받기', r.year + '년 ' + r.church);
          window.open(rr.data.signedUrl, '_blank', 'noopener');
        });
      });
    });
    box.querySelectorAll('button[data-rpdel]').forEach(function (b) {
      b.addEventListener('click', function () {
        var r = reports.filter(function (x) { return String(x.id) === b.dataset.rpdel; })[0];
        if (!r) return;
        if (!confirm(r.year + '년 ' + r.church + ' 보고서를 삭제하시겠습니까? 되돌릴 수 없습니다.')) return;
        db().then(function (c) {
          var pre = r.file_path
            ? c.storage.from('church-reports').remove([r.file_path]).catch(function () {})
            : Promise.resolve();
          return pre.then(function () { return c.from('church_reports').delete().eq('id', r.id); });
        }).then(function (res) {
          if (res.error) { alert(res.error.message); return; }
          SHSCloud.log('delete', '교회상황 보고서 삭제', r.year + '년 ' + r.church);
          load();
        });
      });
    });
  }

  load();
 });
});
</script>
</body>
</html>
