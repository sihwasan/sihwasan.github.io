<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>노회 일정관리 - 시화산노회</title>
<link rel="stylesheet" href="css/style.css?v=20260831zl">
<style>
/* 일정 달력 */
.sc-cal { width:100%; border-collapse:collapse; table-layout:fixed; background:#fff;
  border:1px solid var(--gray-3,#ddd); }
.sc-cal th { padding:8px 0; font-size:0.84rem; color:var(--gray-6);
  border-bottom:1px solid var(--gray-3,#ddd); background:var(--gray-1,#f7f5f0); font-weight:600; }
.sc-cal th.sun, .sc-cal td.sun .sc-day { color:#c0392b; }
.sc-cal td { vertical-align:top; height:96px; border:1px solid var(--gray-2,#eee);
  padding:4px 5px; cursor:pointer; transition:background .12s; }
.sc-cal td:hover { background:var(--gray-1,#f7f5f0); }
.sc-cal td.other { background:#fafafa; color:var(--gray-4); cursor:default; }
.sc-cal td.today { outline:2px solid var(--accent,#b08d3e); outline-offset:-2px; }
.sc-day { font-size:0.82rem; font-weight:600; }
.sc-ev { display:block; margin-top:3px; padding:2px 5px; border-radius:4px;
  font-size:0.72rem; line-height:1.35; background:var(--navy,#4b3f33); color:#fff;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sc-ev.k임직식 { background:#8e44ad; }
.sc-ev.k정기노회 { background:#b03a2e; }
.sc-ev.k총회 { background:#1f618d; }
.sc-ev.k임원회의 { background:#7d6608; }
.sc-ev.k상비부일정 { background:#1e8449; }
.sc-ev.k수양회 { background:#148f77; }
/* 여러 날 일정: 칸 사이 틈을 메워 한 줄 띠처럼 잇는다 */
.sc-ev.evs, .sc-ev.evm { margin-right:-6px; border-top-right-radius:0; border-bottom-right-radius:0; }
.sc-ev.evm, .sc-ev.eve { margin-left:-6px; border-top-left-radius:0; border-bottom-left-radius:0; }
.sc-head { display:flex; align-items:center; gap:12px; margin:0 0 10px; }
.sc-head h2 { margin:0; }
/* 대상자 검색 목록 */
.tg-list { position:absolute; left:0; right:0; top:100%; z-index:40; margin-top:4px;
  background:#fff; border:1px solid var(--gray-3,#ddd); border-radius:10px;
  box-shadow:0 10px 28px rgba(0,0,0,0.16); max-height:280px; overflow:auto; }
.tg-item { display:flex; align-items:center; gap:10px; padding:9px 14px; cursor:pointer; }
.tg-item + .tg-item { border-top:1px solid var(--gray-1,#f2efe9); }
.tg-item:hover, .tg-item.on { background:var(--gray-1,#f7f5f0); }
.tg-item .tg-nm { font-weight:700; }
.tg-item .tg-sub { font-size:0.78rem; color:var(--gray-5); }
.tg-item .tg-badge { margin-left:auto; font-size:0.72rem; color:var(--gray-5);
  border:1px solid var(--gray-3,#ddd); border-radius:10px; padding:1px 8px; white-space:nowrap; }
.tg-etc { color:var(--navy); font-weight:600; }
.tg-none { padding:12px 14px; color:var(--gray-5); font-size:0.85rem; }
</style>
</head>
<body>

<div class="page-head">
  <div class="container">
    <h1>노회 일정관리</h1>
    <div class="crumb">홈 &gt; 임원방 &gt; 노회 일정관리</div>
  </div>
</div>

<main class="page-body container" id="main">
  <div id="sc-area"><p style="color:var(--gray-5)">권한을 확인하는 중...</p></div>
</main>

<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-auth.js"></script>
<script src="js/main.js?v=20260901b"></script>
<script src="js/ops-panel.js?v=20260901a"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
 SHS.getUser().then(function (user) {
  var area = document.getElementById('sc-area');
  var e = SHS.esc;

  if (!user || !SHSAuth.canManageMembers(user)) {
    area.innerHTML =
      '<div class="notice-banner">노회 일정관리는 <strong>노회장·서기·간사</strong>가 이용할 수 있습니다.' +
      (user ? '' : ' <a class="btn sm" style="margin-left:10px" href="login.html">로그인</a>') + '</div>';
    return;
  }
  if (!user.cloud) {
    area.innerHTML =
      '<div class="notice-banner">일정이 서버에 저장되어 모든 회원에게 보이므로 서버 로그인이 필요합니다. ' +
      '<a class="btn sm" style="margin-left:10px" href="login.html">로그인 화면으로</a></div>';
    return;
  }

  var db = null;
  var events = [];      /* site_schedule 전체 */
  var roster = [];      /* 임직식 대상자 선택용 노회 명단 */
  var SESSIONS = null;  /* 회기 설정 {current, list} — 정기노회 회기 자동 입력용 */
  var now = new Date();
  var calY = now.getFullYear(), calM = now.getMonth();   /* 보고 있는 달 */

  /* 주소에 #d=2026-10-12 가 붙어 오면 그 달을 편다 (대시보드 달력에서 넘어옴) */
  var hm = location.hash.match(/d=(\d{4})-(\d{2})-(\d{2})/);
  if (hm) { calY = Number(hm[1]); calM = Number(hm[2]) - 1; }

  var KINDS = ['정기노회', '임원회의', '상비부 일정', '임직식', '총회', '수양회', '사모위로회', '기타'];

  function pad2(n) { return String(n).padStart(2, '0'); }
  function ymd(y, m, d) { return y + '-' + pad2(m + 1) + '-' + pad2(d); }
  function labelOf(s) {
    var p = String(s || '').split('-');
    return p.length === 3 ? (parseInt(p[1], 10) + '.' + parseInt(p[2], 10)) : '';
  }
  function sortOf(s) { return parseInt(String(s || '').replace(/-/g, ''), 10) || 0; }
  function dateOfRow(row) {
    if (row.event_date) return row.event_date;
    var m = String(row.date_label || '').match(/^(\d{1,2})\.(\d{1,2})$/);
    if (!m) return '';
    return new Date().getFullYear() + '-' + pad2(m[1]) + '-' + pad2(m[2]);
  }

  area.innerHTML =
    '<div class="notice-banner">여기서 등록한 일정은 <strong>메인 화면·대시보드의 노회 일정</strong>에 그대로 공지됩니다. ' +
    '달력에서 <strong>날짜를 누르면</strong> 일정을 넣거나 고칠 수 있습니다. ' +
    '<strong>임직식</strong>(목사 위임·장로 장립)은 회원 명단과 연동되어 위임일·장립일이 명단에 기록됩니다.</div>' +
    '<div class="sc-head">' +
    '<button class="btn ghost sm" id="sc-prev">&#8592; 이전 달</button>' +
    '<h2 id="sc-title" style="min-width:170px;text-align:center"></h2>' +
    '<button class="btn ghost sm" id="sc-next">다음 달 &#8594;</button>' +
    '<button class="btn ghost sm" id="sc-today" style="margin-left:auto">오늘</button></div>' +
    '<div style="overflow-x:auto"><div style="min-width:640px" id="sc-calbox"></div></div>' +
    '<h2 style="margin-top:30px">등록된 일정</h2>' +
    '<div id="sc-list"><p style="color:var(--gray-5)">불러오는 중...</p></div>' +
    '<div id="sc-ops" style="margin-top:34px"><p style="color:var(--gray-5)">불러오는 중...</p></div>';

  /* ---------- 팝업 ---------- */
  function modal(html) {
    var wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:1000;' +
      'display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto';
    var card = document.createElement('div');
    card.style.cssText = 'background:#fff;border-radius:10px;max-width:640px;width:100%;' +
      'padding:24px;box-shadow:0 12px 32px rgba(0,0,0,0.25)';
    card.innerHTML = html;
    wrap.appendChild(card);
    document.body.appendChild(wrap);
    wrap.addEventListener('click', function (ev) { if (ev.target === wrap) close(); });
    function close() { wrap.remove(); }
    return { close: close, el: card };
  }

  /* ---------- 달력 ---------- */
  function drawCal() {
    document.getElementById('sc-title').textContent = calY + '년 ' + (calM + 1) + '월';
    var first = new Date(calY, calM, 1);
    var start = first.getDay();
    var days = new Date(calY, calM + 1, 0).getDate();
    var todayS = ymd(now.getFullYear(), now.getMonth(), now.getDate());

    /* 여러 날 일정(수양회 등)은 시작~끝의 모든 날에 넣되,
     * 시작/중간/끝을 표시해 달력에서 한 줄 띠로 잇는다 */
    var byDate = {};
    events.forEach(function (x) {
      var d = dateOfRow(x);
      if (!d) return;
      if (!(x.end_date && x.end_date > d)) {
        (byDate[d] = byDate[d] || []).push({ ev: x, pos: '' });
        return;
      }
      (byDate[d] = byDate[d] || []).push({ ev: x, pos: 'evs' });
      var t = new Date(d + 'T00:00:00');
      for (var k = 0; k < 60; k++) {
        t.setDate(t.getDate() + 1);
        var ts = ymd(t.getFullYear(), t.getMonth(), t.getDate());
        if (ts > x.end_date) break;
        (byDate[ts] = byDate[ts] || []).push({ ev: x, pos: ts === x.end_date ? 'eve' : 'evm' });
      }
    });

    var h = '<table class="sc-cal"><thead><tr>' +
      ['일', '월', '화', '수', '목', '금', '토'].map(function (w, i) {
        return '<th' + (i === 0 ? ' class="sun"' : '') + '>' + w + '</th>';
      }).join('') + '</tr></thead><tbody><tr>';
    var cell = 0;
    for (var i = 0; i < start; i++) { h += '<td class="other"></td>'; cell++; }
    for (var d = 1; d <= days; d++) {
      var ds = ymd(calY, calM, d);
      var evs = byDate[ds] || [];
      h += '<td data-day="' + ds + '" class="' +
        (cell % 7 === 0 ? 'sun ' : '') + (ds === todayS ? 'today' : '') + '">' +
        '<span class="sc-day">' + d + '</span>' +
        evs.map(function (it) {
          var x = it.ev;
          /* 이어지는 날은 제목을 되풀이하지 않는다. 주가 바뀌는 일요일 칸에는 다시 보여 준다 */
          var showTitle = !it.pos || it.pos === 'evs' || cell % 7 === 0;
          return '<span class="sc-ev ' + it.pos + ' k' + e(String(x.kind || '').replace(/\s/g, '')) + '">' +
            (showTitle ? e(x.title) : '&nbsp;') + '</span>';
        }).join('') + '</td>';
      cell++;
      if (cell % 7 === 0 && d < days) h += '</tr><tr>';
    }
    while (cell % 7 !== 0) { h += '<td class="other"></td>'; cell++; }
    h += '</tr></tbody></table>';
    document.getElementById('sc-calbox').innerHTML = h;

    document.querySelectorAll('#sc-calbox td[data-day]').forEach(function (td) {
      td.addEventListener('click', function () { openDay(td.dataset.day); });
    });
  }

  /* ---------- 하루 보기: 그날 일정 + 추가 ---------- */
  function openDay(ds) {
    var evs = events.filter(function (x) {
      var d = dateOfRow(x);
      return d === ds || (d && x.end_date && d <= ds && ds <= x.end_date);
    });
    var mo = modal(
      '<h3 style="margin:0 0 14px;color:var(--navy)">' + e(ds) + ' 일정</h3>' +
      (evs.length
        ? evs.map(function (x) {
            return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;' +
              'border-bottom:1px solid var(--gray-2,#eee)">' +
              '<span style="flex:0 0 auto;font-size:0.78rem;padding:2px 8px;border-radius:10px;' +
              'background:var(--gray-1,#f2efe9)">' + e(x.kind || '일정') + '</span>' +
              '<span style="flex:1">' + e(x.title) +
              (x.end_date ? '<div style="font-size:0.76rem;color:var(--gray-5)">' +
                e(dateOfRow(x)) + ' ~ ' + e(x.end_date) + '</div>' : '') +
              (x.meta && x.meta.contact ? '<div style="font-size:0.76rem;color:var(--gray-5)">담당 ' +
                e(x.meta.contact) + '</div>' : '') +
              (x.meta && x.meta.info ? '<div style="font-size:0.78rem;color:var(--gray-6);white-space:pre-line">' +
                e(x.meta.info) + '</div>' : '') + '</span>' +
              '<button class="btn sm" data-dedit="' + x.id + '">수정</button>' +
              '<button class="btn danger sm" data-ddel="' + x.id + '">삭제</button></div>';
          }).join('')
        : '<p style="color:var(--gray-5)">등록된 일정이 없습니다.</p>') +
      '<p style="margin-top:16px"><button class="btn" id="day-add">이 날짜에 일정 추가</button></p>');

    mo.el.querySelector('#day-add').addEventListener('click', function () {
      mo.close(); openEdit(null, ds);
    });
    mo.el.querySelectorAll('[data-dedit]').forEach(function (b) {
      b.addEventListener('click', function () {
        var x = events.filter(function (v) { return String(v.id) === b.dataset.dedit; })[0];
        mo.close(); if (x) openEdit(x, dateOfRow(x));
      });
    });
    mo.el.querySelectorAll('[data-ddel]').forEach(function (b) {
      b.addEventListener('click', function () {
        var x = events.filter(function (v) { return String(v.id) === b.dataset.ddel; })[0];
        if (!x || !confirm('일정 "' + x.title + '" 을(를) 삭제하시겠습니까?')) return;
        db.from('site_schedule').delete().eq('id', x.id).then(function (r) {
          if (r.error) { alert(r.error.message); return; }
          SHSCloud.log('delete', '노회 일정 삭제', x.title);
          mo.close(); reload();
        });
      });
    });
  }

  /* ---------- 일정 입력·수정 ---------- */
  function openEdit(x, ds) {
    var isNew = !x;
    x = x || {};
    var meta = x.meta || {};
    var kindNow = x.kind || '정기노회';
    if (KINDS.indexOf(kindNow) === -1) kindNow = '기타';

    /* 임직식 대상자 목록: 위임은 목사 계열, 장립은 명단 전체에서 고른다 */
    function targets(sub) {
      var PASTOR = ['목사', '위임목사', '부목사', '강도사', '전도사', '원로목사', '은퇴목사', '무임목사'];
      return roster.filter(function (m) {
        if (m.active === false) return false;
        if (sub === '목사 위임') return PASTOR.indexOf(m.category) !== -1 || PASTOR.indexOf(m.position) !== -1;
        return true;
      });
    }

    var mo = modal(
      '<h3 style="margin:0 0 14px;color:var(--navy)">' + (isNew ? '일정 추가' : '일정 수정') + '</h3>' +
      '<div class="inline-form">' +
      '<div class="field" style="flex:0 0 160px"><label>시작 날짜</label>' +
      '<input type="date" id="ev-date" value="' + e(ds || '') + '"></div>' +
      '<div class="field" style="flex:0 0 160px"><label>끝 날짜 (선택)</label>' +
      '<input type="date" id="ev-date2" value="' + e(x.end_date || '') + '" title="하루 일정이면 비워 두세요"></div>' +
      '<div class="field"><label>행사</label><select id="ev-kind">' +
      KINDS.map(function (k) {
        return '<option' + (k === kindNow ? ' selected' : '') + '>' + k + '</option>';
      }).join('') + '</select></div></div>' +
      /* 정기노회: 회기·봄가을 선택 → 내용에 자동 반영 */
      '<div class="inline-form hidden" id="ev-seswrap">' +
      '<div class="field" style="flex:0 0 170px"><label>회기</label><select id="ev-ses"></select></div>' +
      '<div class="field" style="flex:0 0 130px"><label>봄·가을</label><select id="ev-season">' +
      '<option>봄</option><option>가을</option></select></div>' +
      '<div class="field" style="align-self:flex-end;font-size:0.78rem;color:var(--gray-5);margin-bottom:8px">' +
      '고르면 아래 내용에 자동으로 들어갑니다.</div></div>' +
      /* 수양회: 행사명·장소·대상·회비 */
      '<div id="ev-retwrap" class="hidden">' +
      '<div class="inline-form">' +
      '<div class="field"><label>행사명</label>' +
      '<input type="text" id="ev-rname" value="' + e(meta.rname || '') + '" placeholder="예: 목회자 수양회"></div>' +
      '<div class="field"><label>장소</label>' +
      '<input type="text" id="ev-rplace" value="' + e(meta.place || '') + '" placeholder="예: 반월수양관"></div></div>' +
      '<div class="inline-form">' +
      '<div class="field"><label>대상</label>' +
      '<input type="text" id="ev-rtarget" value="' + e(meta.target || '') + '" placeholder="예: 전 노회원"></div>' +
      '<div class="field"><label>회비</label>' +
      '<input type="text" id="ev-rfee" value="' + e(meta.fee || '') + '" placeholder="예: 10만원"></div></div>' +
      '<div class="inline-form">' +
      '<div class="field"><label>주관부서</label>' +
      '<input type="text" id="ev-rdept" value="' + e(meta.dept || '') + '" placeholder="예: 임원회 · 교육부"></div>' +
      '<div class="field"><label>담당자 연락처</label>' +
      '<input type="text" id="ev-rcontact" value="' + e(meta.contact || '') + '" placeholder="예: 김동석 목사 010-0000-0000"></div></div>' +
      '<div class="field"><label>안내문구 (선택)</label>' +
      '<textarea id="ev-rinfo" rows="3" placeholder="회원들에게 알릴 안내문을 적어 주세요.">' +
      e(meta.info || '') + '</textarea></div></div>' +
      /* 기타: 행사명 직접 입력 */
      '<div class="field hidden" id="ev-etcwrap"><label>행사명</label>' +
      '<input type="text" id="ev-etc" value="' + (kindNow === '기타' ? e(x.title || '') : '') + '" placeholder="행사명"></div>' +
      /* 임직식: 종류·대상자 */
      '<div id="ev-ordwrap" class="hidden">' +
      '<div class="inline-form">' +
      '<div class="field" style="flex:0 0 170px"><label>임직 종류</label><select id="ev-ordsub">' +
      ['목사 위임', '장로 장립', '기타'].map(function (s) {
        var subNow = ['목사 위임', '장로 장립'].indexOf(meta.sub) !== -1 ? meta.sub
          : (meta.sub ? '기타' : '목사 위임');
        return '<option' + (subNow === s ? ' selected' : '') + '>' + s + '</option>';
      }).join('') + '</select></div>' +
      '<div class="field hidden" style="flex:0 0 170px" id="ev-ordetcwrap"><label>임직 이름</label>' +
      '<input type="text" id="ev-ordetc" value="' +
      e(meta.sub && ['목사 위임', '장로 장립'].indexOf(meta.sub) === -1 ? meta.sub : '') +
      '" placeholder="예: 안수집사 임직"></div>' +
      '<div class="field" style="position:relative"><label>대상자</label>' +
      '<input type="text" id="ev-tq" autocomplete="off" placeholder="이름이나 교회로 검색" ' +
      'value="' + e(meta.person ? meta.person + (meta.church ? ' · ' + meta.church : '') : '') + '">' +
      '<div class="tg-list hidden" id="ev-tlist"></div></div></div>' +
      '<div class="inline-form hidden" id="ev-etcperson">' +
      '<div class="field"><label>성명</label><input type="text" id="ev-pname" value="' + e(meta.person || '') + '"></div>' +
      '<div class="field"><label>교회</label><input type="text" id="ev-pchurch" value="' + e(meta.church || '') + '"></div></div>' +
      '<p style="font-size:0.8rem;color:var(--gray-5);margin:2px 0 10px">저장하면 회원 명단에 ' +
      '<strong>목사 위임 → 위임일(직분 위임목사)</strong>, <strong>장로 장립 → 장립일</strong>이 함께 기록됩니다.</p></div>' +
      '<div class="inline-form">' +
      '<div class="field" style="flex:0 0 150px"><label>시간 (선택)</label>' +
      '<input type="time" id="ev-time" value="' + e(meta.time || '') + '"></div>' +
      '<div class="field" id="ev-locwrap"><label>장소 (선택)</label>' +
      '<input type="text" id="ev-loc" value="' + e(meta.loc || '') + '"></div></div>' +
      '<div class="field"><label>내용 (선택)</label>' +
      '<input type="text" id="ev-note" value="' +
      /* 임직식·수양회는 제목이 자동 조합되므로 덧붙인 메모만 보여 준다 */
      (kindNow === '기타' ? ''
        : (kindNow === '임직식' || kindNow === '수양회' || kindNow === '정기노회') ? e(meta.note || '')
        : e(x.title || '')) + '" ' +
      '></div>' +
      '<div style="margin-top:8px"><button class="btn" id="ev-save">저장</button></div>' +
      '<div class="form-msg" id="ev-msg"></div>');

    var kindSel = mo.el.querySelector('#ev-kind');
    var tq = mo.el.querySelector('#ev-tq');
    var tlist = mo.el.querySelector('#ev-tlist');
    /* 고른 대상: 명단 id 숫자, '__etc'(직접 입력), ''(아직 안 고름) */
    var tgtVal = meta.roster_id ? String(meta.roster_id) : (meta.person ? '__etc' : '');

    /* 정기노회를 고르면 내용에 회기가 자동으로 들어간다.
     * 정기노회가 열리면 다음 회기가 시작되므로 현재 회기 + 1 로 적고,
     * 날짜의 달로 봄·가을을 가른다. 자동으로 넣은 글만 바꾸므로
     * 직접 고친 내용은 그대로 둔다. */
    var noteEl = mo.el.querySelector('#ev-note');
    var sesSel = mo.el.querySelector('#ev-ses');
    var seasonSel = mo.el.querySelector('#ev-season');

    /* 회기 선택지: 사이트 관리 → 노회 운영의 회기 설정(site_settings.sessions)과 연동.
     * 등록된 회기 목록을 그대로 쓰고, 다음 회기(현재+1)가 아직 목록에 없으면 붙여 준다.
     * 기본값은 일정 날짜가 속한 회기, 없으면 다음 회기. */
    (function () {
      var cur = Number((SESSIONS && SESSIONS.current) || 20);
      var list = ((SESSIONS && SESSIONS.list) || []).slice()
        .sort(function (a, b) { return Number(a.no) - Number(b.no); });
      if (!list.some(function (s) { return Number(s.no) === cur + 1; })) {
        list.push({ no: cur + 1, from: '', to: '' });
      }
      var pick = cur + 1;
      var m2 = String(x.title || '').match(/제(\d+)회/);
      if (m2) {
        pick = Number(m2[1]);
      } else if (ds) {
        /* 일정 날짜가 어느 회기 기간에 드는지 회기 설정으로 찾는다 */
        var hit = list.filter(function (s) { return s.from && s.to && s.from <= ds && ds <= s.to; })[0];
        if (hit) pick = Number(hit.no);
      }
      if (!list.some(function (s) { return Number(s.no) === pick; })) {
        list.push({ no: pick, from: '', to: '' });
        list.sort(function (a, b) { return Number(a.no) - Number(b.no); });
      }
      sesSel.innerHTML = list.map(function (s) {
        var n = Number(s.no);
        return '<option value="' + n + '"' + (n === pick ? ' selected' : '') + '>제' + n + '회기' +
          (s.from ? ' (' + e(s.from) + '~' + e(s.to || '') + ')' : '') +
          (n === cur ? ' · 현재' : '') + '</option>';
      }).join('');
      if (/봄/.test(x.title || '')) seasonSel.value = '봄';
      else if (/가을/.test(x.title || '')) seasonSel.value = '가을';
    })();

    function sesText() {
      return '제' + sesSel.value + '회기 ' + seasonSel.value + ' 정기노회';
    }
    /* 내용 칸에는 아무것도 미리 넣지 않는다. 회기·봄가을 선택은
     * 저장할 때 제목("제N회기 봄 정기노회")으로만 조합된다. */
    function autoNote() {
      if (kindSel.value !== '정기노회') return;
      /* 날짜의 달로 봄·가을을 짐작해 준다 (직접 바꿀 수 있다) */
      var d = mo.el.querySelector('#ev-date').value;
      var mon = d ? Number(d.split('-')[1]) : 0;
      if (mon && !(x.title && /봄|가을/.test(x.title))) {
        seasonSel.value = (mon >= 8 || mon <= 1) ? '가을' : '봄';
      }
    }

    /* 끝 날짜 달력이 시작 날짜부터 열리도록: 최소값을 시작일로 묶고,
     * 비어 있는 채로 누르면 시작일을 미리 채워 그 달이 펼쳐지게 한다.
     * (시작일과 같으면 저장할 때 하루 일정으로 처리된다) */
    var dateEl = mo.el.querySelector('#ev-date');
    var date2El = mo.el.querySelector('#ev-date2');
    function syncDate2() {
      date2El.min = dateEl.value || '';
      if (date2El.value && dateEl.value && date2El.value < dateEl.value) date2El.value = dateEl.value;
    }
    dateEl.addEventListener('change', syncDate2);
    date2El.addEventListener('focus', function () {
      if (!date2El.value && dateEl.value) date2El.value = dateEl.value;
    });
    syncDate2();
    function refreshKind() {
      var k = kindSel.value;
      mo.el.querySelector('#ev-etcwrap').classList.toggle('hidden', k !== '기타');
      mo.el.querySelector('#ev-ordwrap').classList.toggle('hidden', k !== '임직식');
      mo.el.querySelector('#ev-retwrap').classList.toggle('hidden', k !== '수양회');
      mo.el.querySelector('#ev-seswrap').classList.toggle('hidden', k !== '정기노회');
      /* 수양회는 위쪽에 전용 장소 칸이 있으므로 공용 장소 칸은 감춘다 */
      mo.el.querySelector('#ev-locwrap').classList.toggle('hidden', k === '수양회');
      refreshEtcPerson();
      autoNote();
    }
    mo.el.querySelector('#ev-date').addEventListener('change', autoNote);
    function refreshEtcPerson() {
      mo.el.querySelector('#ev-etcperson').classList.toggle('hidden', tgtVal !== '__etc');
    }
    /* 이름·교회로 검색해 고르는 목록 */
    function drawTargetList() {
      var sub = mo.el.querySelector('#ev-ordsub').value;
      var q = tq.value.trim().replace(/\s*·.*$/, '');   /* '이름 · 교회' 표시는 이름만으로 찾는다 */
      var list = targets(sub).filter(function (m) {
        return !q || (m.name && m.name.indexOf(q) !== -1) ||
               (m.church && m.church.indexOf(q) !== -1);
      }).slice(0, 40);
      var h = list.map(function (m) {
        return '<div class="tg-item" data-tid="' + m.id + '">' +
          '<span class="tg-nm">' + e(m.name) + '</span>' +
          '<span class="tg-sub">' + e(m.church || '무임') + '</span>' +
          '<span class="tg-badge">' + e(m.position || m.category || '') + '</span></div>';
      }).join('');
      if (!list.length) h = '<div class="tg-none">"' + e(q) + '" 로 찾은 분이 없습니다.</div>';
      h += '<div class="tg-item tg-etc" data-tid="__etc">&#43; 명단에 없음 — 직접 입력</div>';
      tlist.innerHTML = h;
      tlist.classList.remove('hidden');
      tlist.querySelectorAll('.tg-item').forEach(function (it) {
        it.addEventListener('mousedown', function (ev) {
          ev.preventDefault();   /* 입력창 blur 전에 선택을 잡는다 */
          tgtVal = it.dataset.tid;
          if (tgtVal === '__etc') {
            tq.value = '직접 입력';
          } else {
            var m = roster.filter(function (v) { return String(v.id) === tgtVal; })[0];
            tq.value = m ? m.name + (m.church ? ' · ' + m.church : '') : '';
          }
          tlist.classList.add('hidden');
          refreshEtcPerson();
        });
      });
    }
    tq.addEventListener('focus', drawTargetList);
    tq.addEventListener('input', function () { tgtVal = ''; drawTargetList(); });
    tq.addEventListener('blur', function () {
      setTimeout(function () { tlist.classList.add('hidden'); }, 150);
    });
    kindSel.addEventListener('change', refreshKind);
    function refreshOrdEtc() {
      mo.el.querySelector('#ev-ordetcwrap').classList.toggle('hidden',
        mo.el.querySelector('#ev-ordsub').value !== '기타');
    }
    mo.el.querySelector('#ev-ordsub').addEventListener('change', function () {
      tgtVal = ''; tq.value = '';
      refreshEtcPerson();
      refreshOrdEtc();
    });
    refreshOrdEtc();
    refreshKind();

    mo.el.querySelector('#ev-save').addEventListener('click', function () {
      var msg = mo.el.querySelector('#ev-msg');
      function err(t) { msg.className = 'form-msg err'; msg.textContent = t; }
      var date = mo.el.querySelector('#ev-date').value;
      var date2 = mo.el.querySelector('#ev-date2').value || null;
      var kind = kindSel.value;
      var note = mo.el.querySelector('#ev-note').value.trim();
      if (!date) { err('시작 날짜를 골라 주세요.'); return; }
      if (date2 && date2 < date) { err('끝 날짜가 시작 날짜보다 앞설 수 없습니다.'); return; }
      if (date2 === date) date2 = null;

      var title = '';
      var newMeta = null;
      var sync = null;    /* 회원 명단 연동 작업 */

      if (kind === '기타') {
        title = mo.el.querySelector('#ev-etc').value.trim();
        if (!title) { err('행사명을 입력해 주세요.'); return; }
        if (note) title += ' — ' + note;
      } else if (kind === '임직식') {
        var sub = mo.el.querySelector('#ev-ordsub').value;
        if (sub === '기타') {
          sub = mo.el.querySelector('#ev-ordetc').value.trim();
          if (!sub) { err('임직 이름을 입력해 주세요. (예: 안수집사 임직)'); return; }
        }
        var person = '', church = '', rid = null;
        if (tgtVal === '__etc') {
          person = mo.el.querySelector('#ev-pname').value.trim();
          church = mo.el.querySelector('#ev-pchurch').value.trim();
          if (!person) { err('대상자 성명을 입력해 주세요.'); return; }
        } else if (tgtVal) {
          rid = Number(tgtVal);
          var m = roster.filter(function (v) { return v.id === rid; })[0];
          person = m ? m.name : ''; church = m ? (m.church || '') : '';
        } else { err('대상자를 골라 주세요.'); return; }
        /* 예전 저장분은 내용 칸에 제목 전체가 들어 있었다 — 자동 조합 문구는 버린다 */
        if (note.indexOf('임직식') !== -1) note = '';
        newMeta = { sub: sub, person: person, church: church, roster_id: rid, note: note };
        title = '임직식 — ' + person + ' ' + sub +
          (church ? ' (' + church + ')' : '') + (note ? ' · ' + note : '');

        /* 회원 명단(roster) 연동: 위임일·장립일 기록 */
        if (sub === '장로 장립') {
          if (rid) {
            sync = function (c) {
              return c.from('roster').update({ ordained_on: date }).eq('id', rid).then(function () {
                /* 교회 DB(church_staff)에도 같은 분이 있으면 장립일을 맞춰 준다 */
                return c.from('church_staff').update({ ordained_on: date })
                  .eq('name', person).eq('church', church);
              });
            };
          } else if (church) {
            /* 명단에 없는 새 장로: 교회 DB(원본)에 시무장로로 올린다 */
            sync = function (c) {
              return c.from('church_staff').insert({
                church: church, name: person, role: '시무장로', ordained_on: date, sort: 100000
              });
            };
          }
        } else if (sub === '목사 위임' && rid) {
          sync = function (c) {
            return c.from('roster').update({ position: '위임목사', served_from: date }).eq('id', rid);
          };
        }
      } else if (kind === '수양회') {
        function rv(id) { return mo.el.querySelector(id).value.trim(); }
        var rname = rv('#ev-rname');
        var place = rv('#ev-rplace');
        if (!rname) { err('수양회 행사명을 입력해 주세요.'); return; }
        if (!place) { err('수양회 장소를 입력해 주세요.'); return; }
        newMeta = {
          rname: rname, place: place, target: rv('#ev-rtarget'), fee: rv('#ev-rfee'),
          dept: rv('#ev-rdept'), contact: rv('#ev-rcontact'), info: rv('#ev-rinfo'), note: note
        };
        title = rname + ' (' + place + ')' +
          (newMeta.target ? ' · 대상 ' + newMeta.target : '') +
          (newMeta.fee ? ' · 회비 ' + newMeta.fee : '') +
          (newMeta.dept ? ' · 주관 ' + newMeta.dept : '') +
          (note ? ' · ' + note : '');
      } else if (kind === '정기노회') {
        /* 제목은 회기·봄가을 선택으로 조합하고, 내용은 뒤에 덧붙인다.
         * 예전 저장분처럼 내용에 정기노회 문구가 통째로 있으면 버린다. */
        if (note.indexOf('정기노회') !== -1) note = '';
        title = sesText() + (note ? ' (' + note + ')' : '');
        newMeta = { note: note };
      } else {
        title = note || kind;
      }

      /* 시간·장소는 모든 행사 공통으로 제목 뒤에 붙이고 meta에도 남긴다 */
      var evTime = mo.el.querySelector('#ev-time').value;
      var evLoc = kind === '수양회' ? '' : mo.el.querySelector('#ev-loc').value.trim();
      if (evLoc && title.indexOf(evLoc) === -1) title += ' (' + evLoc + ')';
      if (evTime) {
        var hh = Number(evTime.split(':')[0]);
        var mm2 = evTime.split(':')[1];
        var timeK = (hh < 12 ? '오전 ' : '오후 ') + ((hh % 12) || 12) + '시' +
          (mm2 !== '00' ? ' ' + Number(mm2) + '분' : '');
        if (title.indexOf(timeK) === -1) title += ' · ' + timeK;
      }
      newMeta = newMeta || {};
      newMeta.time = evTime || '';
      newMeta.loc = evLoc || '';

      var row = {
        title: title, kind: kind, meta: newMeta,
        event_date: date, end_date: date2,
        date_label: labelOf(date) + (date2 ? '~' + labelOf(date2) : ''),
        sort: sortOf(date)
      };
      msg.className = 'form-msg'; msg.textContent = '저장 중입니다...';
      SHSCloud.init().then(function (c) {
        var q = isNew ? c.from('site_schedule').insert(row)
                      : c.from('site_schedule').update(row).eq('id', x.id);
        return q.then(function (r) {
          if (r.error) throw r.error;
          return sync ? sync(c) : null;
        });
      }).then(function (r) {
        if (r && r.error) throw r.error;
        SHSCloud.log(isNew ? 'create' : 'update', '노회 일정 ' + (isNew ? '추가' : '수정'),
          labelOf(date) + ' ' + title +
          (newMeta ? ' [명단 연동 ' + newMeta.sub + ' ' + newMeta.person + ']' : ''));
        mo.close(); reload();
      }).catch(function (er) { err(er.message || String(er)); });
    });
  }

  /* ---------- 등록된 일정 목록 ---------- */
  function drawList() {
    var box = document.getElementById('sc-list');
    var rows = events.slice().sort(function (a, b) { return (a.sort || 0) - (b.sort || 0); });
    var h = '<table class="tbl" style="max-width:880px"><thead><tr>' +
      '<th style="width:120px">날짜</th><th style="width:120px">행사</th>' +
      '<th>내용</th><th style="width:130px">관리</th></tr></thead><tbody>';
    if (!rows.length) h += '<tr><td colspan="4" style="color:var(--gray-5)">등록된 일정이 없습니다.</td></tr>';
    rows.forEach(function (x) {
      h += '<tr><td>' + e(dateOfRow(x) || x.date_label || '-') +
        (x.end_date ? '<br>~ ' + e(x.end_date) : '') + '</td>' +
        '<td>' + e(x.kind || '-') + '</td>' +
        '<td class="left">' + e(x.title) + '</td>' +
        '<td><button class="btn sm" data-ledit="' + x.id + '">수정</button> ' +
        '<button class="btn danger sm" data-ldel="' + x.id + '">삭제</button></td></tr>';
    });
    h += '</tbody></table>';
    box.innerHTML = h;
    box.querySelectorAll('[data-ledit]').forEach(function (b) {
      b.addEventListener('click', function () {
        var x = events.filter(function (v) { return String(v.id) === b.dataset.ledit; })[0];
        if (x) openEdit(x, dateOfRow(x));
      });
    });
    box.querySelectorAll('[data-ldel]').forEach(function (b) {
      b.addEventListener('click', function () {
        var x = events.filter(function (v) { return String(v.id) === b.dataset.ldel; })[0];
        if (!x || !confirm('일정 "' + x.title + '" 을(를) 삭제하시겠습니까?')) return;
        db.from('site_schedule').delete().eq('id', x.id).then(function (r) {
          if (r.error) { alert(r.error.message); return; }
          SHSCloud.log('delete', '노회 일정 삭제', x.title);
          reload();
        });
      });
    });
  }

  function reload() {
    db.from('site_schedule').select('*').order('sort').then(function (r) {
      if (r.error) {
        document.getElementById('sc-list').innerHTML =
          '<div class="notice-banner">불러오지 못했습니다: ' + e(r.error.message) + '</div>';
        return;
      }
      events = r.data || [];
      drawCal(); drawList();
    });
  }

  document.getElementById('sc-prev').addEventListener('click', function () {
    calM--; if (calM < 0) { calM = 11; calY--; } drawCal();
  });
  document.getElementById('sc-next').addEventListener('click', function () {
    calM++; if (calM > 11) { calM = 0; calY++; } drawCal();
  });
  document.getElementById('sc-today').addEventListener('click', function () {
    calY = now.getFullYear(); calM = now.getMonth(); drawCal();
  });

  SHSCloud.init().then(function (c) {
    db = c;
    reload();
    c.from('roster').select('id,name,church,category,position,active').order('name')
      .then(function (r) { roster = (r && r.data) || []; });
    c.from('site_settings').select('value').eq('key', 'sessions')
      .then(function (r) {
        SESSIONS = (r && r.data && r.data[0] && r.data[0].value) || null;
      }, function () {});
    /* 정기노회 일정(40일 전 알림)·기준일 — 사이트 관리에서 옮겨 왔다 */
    SHSOps.mountSchedule(document.getElementById('sc-ops'), user);
  });
 });
});
</script>
</body>
</html>
