<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 서류 - 시화산노회</title>
<meta name="description" content="시화산노회 나의 서류 — 작성해 저장한 청원서와 시찰로 보낸 청원서를 한곳에서 봅니다.">
<link rel="canonical" href="https://sihwasan.org/mydocs.html">
<meta property="og:type" content="website">
<meta property="og:title" content="나의 서류 - 시화산노회">
<meta property="og:description" content="작성해 저장한 청원서와 시찰로 보낸 청원서를 한곳에서 봅니다.">
<meta property="og:url" content="https://sihwasan.org/mydocs.html">
<link rel="stylesheet" href="css/style.css?v=20260831zj">
</head>
<body>

<div class="page-head">
  <div class="container">
    <h1>나의 서류</h1>
    <div class="crumb">홈 &gt; 나의 서류</div>
  </div>
</div>

<main class="page-body container" id="main">
  <p>작성해 저장한 청원서와 시찰로 보낸 청원서를 한곳에서 봅니다.
    새 청원서는 <a href="petition.html" style="text-decoration:underline;color:var(--navy)"><strong>청원서 작성</strong></a>에서 만드세요.</p>
  <div id="md-area"><p style="color:var(--gray-5)">불러오는 중...</p></div>
</main>

<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-auth.js"></script>
<script src="js/main.js?v=20260830d"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
 SHS.getUser().then(function (user) {
  var area = document.getElementById('md-area');
  var e = SHS.esc;

  if (!(user && user.cloud && window.SHSCloud && SHSCloud.enabled())) {
    area.innerHTML = '<div class="notice-banner">나의 서류는 <strong>로그인</strong>하시면 보실 수 있습니다. ' +
      '<a class="btn sm" style="margin-left:10px" href="login.html">로그인</a></div>';
    return;
  }

  function load() {
    SHSCloud.init().then(function (c) {
      return Promise.all([
        c.from('petitions').select('*').order('updated_at', { ascending: false }),
        c.from('petition_submissions').select('*').eq('user_id', user.id)
          .order('created_at', { ascending: false })
      ]);
    }).then(function (rs) {
      if (rs[0].error) throw rs[0].error;
      var mine = rs[0].data || [];
      var sent = (rs[1].data) || [];
      var h = '';

      /* ----- 저장한 청원서 ----- */
      h += '<h2>저장한 청원서 (' + mine.length + ')</h2>';
      if (!mine.length) {
        h += '<p style="color:var(--gray-5)">저장한 청원서가 없습니다. ' +
          '청원서 작성에서 작성 후 <strong>저장하기</strong>를 눌러 보세요.</p>';
      } else {
        h += '<div style="overflow-x:auto"><table class="tbl" style="max-width:940px"><thead><tr>' +
          '<th>제목</th><th style="width:150px">서식</th><th style="width:160px">마지막 수정</th>' +
          '<th style="width:180px">관리</th></tr></thead><tbody>';
        mine.forEach(function (p) {
          h += '<tr><td class="left">' + e(p.title) + '</td>' +
            '<td>' + e(p.form_title) + '</td>' +
            '<td>' + e(String(p.updated_at).replace('T', ' ').slice(0, 16)) + '</td>' +
            '<td><a class="btn sm" href="petition.html?open=' + p.id + '">열기·수정</a> ' +
            '<button class="btn danger sm" data-mddel="' + p.id + '" data-mdn="' + e(p.title) + '">삭제</button></td></tr>';
        });
        h += '</tbody></table></div>';
      }

      /* ----- 시찰로 보낸 청원서 ----- */
      h += '<h2>시찰로 보낸 청원서 (' + sent.length + ')</h2>';
      if (!sent.length) {
        h += '<p style="color:var(--gray-5)">시찰로 보낸 청원서가 없습니다. ' +
          '청원서 작성에서 <strong>시찰 서기에게 전달하기</strong>를 누르면 여기에 쌓입니다.</p>';
      } else {
        h += '<div style="overflow-x:auto"><table class="tbl" style="max-width:940px"><thead><tr>' +
          '<th>제목</th><th style="width:110px">시찰</th><th style="width:150px">보낸 날</th>' +
          '<th style="width:110px">상태</th><th style="width:90px">관리</th></tr></thead><tbody>';
        sent.forEach(function (p) {
          var st = p.status === '접수' ? '<span class="pass">접수</span>'
            : p.status === '반려' ? '<span class="fail">반려</span>' : e(p.status);
          h += '<tr><td class="left">' + e(p.title) +
            (p.note ? '<br><small style="color:var(--gray-5)">' + e(p.note) + '</small>' : '') + '</td>' +
            '<td>' + e(p.sichal) + '</td>' +
            '<td>' + e(String(p.created_at).replace('T', ' ').slice(0, 16)) + '</td>' +
            '<td>' + st + '</td>' +
            '<td>' + (p.status === '제출됨'
              ? '<button class="btn danger sm" data-mdsdel="' + p.id + '">회수</button>' : '') + '</td></tr>';
        });
        h += '</tbody></table></div>';
        h += '<p style="font-size:0.82rem;color:var(--gray-5)">회수는 시찰에서 아직 처리하기 전(제출됨 상태)에만 할 수 있습니다.</p>';
      }

      area.innerHTML = h;

      area.querySelectorAll('[data-mddel]').forEach(function (b) {
        b.addEventListener('click', function () {
          if (!confirm('「' + b.dataset.mdn + '」을(를) 삭제할까요?')) return;
          SHSCloud.init().then(function (c) {
            return c.from('petitions').delete().eq('id', b.dataset.mddel);
          }).then(function (r) {
            if (r.error) { alert(r.error.message); return; }
            load();
          });
        });
      });
      area.querySelectorAll('[data-mdsdel]').forEach(function (b) {
        b.addEventListener('click', function () {
          if (!confirm('전달을 회수(삭제)할까요?')) return;
          SHSCloud.init().then(function (c) {
            return c.from('petition_submissions').delete().eq('id', b.dataset.mdsdel);
          }).then(function () { load(); });
        });
      });
    }).catch(function (err) {
      area.innerHTML = '<div class="notice-banner">불러오지 못했습니다: ' + e(err.message || err) + '</div>';
    });
  }
  load();
 });
});
</script>
</body>
</html>
