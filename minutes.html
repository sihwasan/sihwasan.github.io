<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>노회 회의록 - 시화산노회</title>
<meta name="description" content="시화산노회 정기노회 회의록입니다. 회기별 회의 내용과 결의사항을 볼 수 있습니다.">
<link rel="canonical" href="https://sihwasan.org/minutes.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="시화산노회">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="노회 회의록 - 시화산노회">
<meta property="og:description" content="시화산노회 정기노회 회의록입니다. 회기별 회의 내용과 결의사항을 볼 수 있습니다.">
<meta property="og:url" content="https://sihwasan.org/minutes.html">
<meta property="og:image" content="https://sihwasan.org/images/og-cover.png">
<link rel="stylesheet" href="css/style.css?v=20261021n">
</head>
<body>

<div class="page-head">
  <div class="container">
    <h1>노회 회의록</h1>
    <div class="crumb">홈 &gt; 임원방 &gt; 회의록</div>
  </div>
</div>

<main class="page-body container" style="max-width:900px" id="main">
  <div id="minutes-gate"></div>
  <div id="minutes-list" class="hidden"></div>
  <div id="minutes-view" class="hidden"></div>
</main>

<script src="js/auth.js?v=20260921j"></script>
<script src="js/data.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-auth.js?v=20261020za"></script>
<script src="js/main.js?v=20261021l"></script>
<script src="js/minutes-audio.js?v=20261019a"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
 SHS.getUser().then(function (user) {
  var gate = document.getElementById('minutes-gate');
  var listBox = document.getElementById('minutes-list');
  var viewBox = document.getElementById('minutes-view');
  var e = SHS.esc;

  if (!SHSAuth.isOfficer(user)) {
    if (!user) {
      gate.innerHTML =
        '<div class="notice-banner">노회 회의록은 <strong>노회 임원</strong>만 열람할 수 있습니다. ' +
        '임원 계정으로 로그인해 주시기 바랍니다. <a class="btn sm" style="margin-left:10px" href="login.html">로그인</a></div>';
    } else {
      gate.innerHTML =
        '<div class="notice-banner">노회 회의록은 <strong>노회 임원</strong>만 열람할 수 있는 자료입니다. ' +
        '현재 등급(' + SHS.displayRole(user.role, user.title) + ')으로는 열람할 수 없습니다. 회의록 열람이 필요한 회원께서는 노회 사무실(031-486-9993)로 문의해 주시기 바랍니다.</div>';
    }
    return;
  }

  var canEdit = SHSAuth.canManageMembers(user);
  var docs = [];   /* {id, title, meeting_date, html, body} */
  var audioCount = {};   /* 회의록 번호 → 내가 들을 수 있는 녹음 수 */

  gate.innerHTML =
    '<div class="notice-banner">본 회의록은 <strong>노회 임원만</strong> 열람할 수 있는 자료입니다. 외부 유출을 금합니다.</div>';

  /* ---------- 목록 ---------- */
  function renderList() {
    viewBox.classList.add('hidden');
    var html = '<h2>회의록 목록</h2>';

    if (canEdit) {
      html += '<div class="admin-card" style="margin-bottom:16px">' +
        '<h3 style="margin-top:0" id="mb-form-title">회의록 등록</h3>' +
        '<input type="hidden" id="mb-id">' +
        '<div class="inline-form" style="margin-bottom:8px">' +
        '<div class="field"><label>제목 (예: 제20회기 봄 정기노회 회의록)</label><input type="text" id="mb-title"></div>' +
        '<div class="field" style="flex:0 0 170px"><label>회의 날짜</label><input type="date" id="mb-date"></div>' +
        '</div>' +
        '<div class="field"><label>내용 (줄바꿈 그대로 표시됩니다)</label><textarea id="mb-body" rows="10"></textarea></div>' +
        '<button class="btn" id="mb-save">저장</button> ' +
        '<button class="btn ghost hidden" id="mb-cancel">새 글로 전환</button>' +
        '<div class="form-msg" id="mb-msg"></div>' +
        '<p style="font-size:0.8rem;color:var(--gray-5);margin-top:8px">모든 등록·수정·삭제는 감사 기록에 남습니다.</p></div>';
    }

    if (!docs.length) {
      html += '<p style="color:var(--gray-5)">등록된 회의록이 없습니다.</p>';
    } else {
      html += '<table class="tbl"><thead><tr><th style="width:70px">번호</th><th>제목</th><th style="width:120px">회의 날짜</th>' +
        (canEdit ? '<th style="width:130px">관리</th>' : '') + '</tr></thead><tbody>';
      docs.forEach(function (d, i) {
        html += '<tr><td>' + (docs.length - i) + '</td>' +
          '<td class="left"><a href="#" data-mbview="' + i + '" style="color:var(--navy);text-decoration:underline">' + e(d.title) + '</a>' +
          (audioCount[d.id] ? '<span class="ma-badge">녹음 ' + audioCount[d.id] + '</span>' : '') + '</td>' +
          '<td>' + e(d.meeting_date || '-') + '</td>';
        if (canEdit) {
          html += '<td>' +
            (d.body ? '<button class="btn ghost sm" data-mbedit="' + i + '">수정</button> ' : '') +
            '<button class="btn danger sm" data-mbdel="' + i + '">삭제</button></td>';
        }
        html += '</tr>';
      });
      html += '</tbody></table>';
    }
    listBox.innerHTML = html;
    listBox.classList.remove('hidden');
    bindList();
  }

  function renderView(d) {
    listBox.classList.add('hidden');
    var content = d.html
      ? d.html
      : String(d.body || '').split('\n').map(function (l) {
          return l.trim() ? '<p style="margin-bottom:8px">' + e(l) + '</p>' : '';
        }).join('');
    viewBox.innerHTML =
      '<p><button class="btn ghost sm" id="mb-back">목록으로</button></p>' +
      '<h2>' + e(d.title) + '</h2>' +
      (d.meeting_date ? '<p style="color:var(--gray-5);font-size:0.9rem">회의 날짜: ' + e(d.meeting_date) + '</p>' : '') +
      '<div id="mb-audio" style="margin-top:14px"></div>' +
      '<div style="margin-top:16px">' + content + '</div>' +
      '<p style="margin-top:24px"><button class="btn ghost sm" id="mb-back2">목록으로</button></p>';
    viewBox.classList.remove('hidden');
    /* 회의 녹음 — 서기·회록서기가 올리고, 서기·회록서기·노회장·간사가 듣는다 (113 sql) */
    if (window.SHSAudio) SHSAudio.mountMinutes(document.getElementById('mb-audio'), user, d);
    window.scrollTo({ top: 0 });
    ['mb-back', 'mb-back2'].forEach(function (id) {
      var b = document.getElementById(id);
      if (b) b.addEventListener('click', renderList);
    });
    SHS.logAction('view', '회의록 열람', d.title);
  }

  /* 본문에서 낱말을 찾아 표시하고 첫 자리로 옮겨 간다 */
  function highlight(root, q) {
    q = String(q || '').trim();
    if (!q || !root) return;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    var nodes = [], n;
    while ((n = walker.nextNode())) if (n.nodeValue.indexOf(q) !== -1) nodes.push(n);
    var first = null;
    nodes.slice(0, 60).forEach(function (t) {
      var parts = t.nodeValue.split(q);
      var frag = document.createDocumentFragment();
      parts.forEach(function (ptxt, i) {
        frag.appendChild(document.createTextNode(ptxt));
        if (i < parts.length - 1) { var m = document.createElement('mark'); m.className = 'ai-hl'; m.textContent = q; frag.appendChild(m); if (!first) first = m; }
      });
      t.parentNode.replaceChild(frag, t);
    });
    if (first) setTimeout(function () { first.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 80);
  }

  function bindList() {
    listBox.querySelectorAll('a[data-mbview]').forEach(function (a) {
      a.addEventListener('click', function (ev) {
        ev.preventDefault();
        renderView(docs[+a.dataset.mbview]);
      });
    });
    if (!canEdit) return;

    var save = document.getElementById('mb-save');
    if (save) save.addEventListener('click', function () {
      var msg = document.getElementById('mb-msg');
      var id = document.getElementById('mb-id').value;
      var d = {
        title: document.getElementById('mb-title').value.trim(),
        meeting_date: document.getElementById('mb-date').value || null,
        body: document.getElementById('mb-body').value.trim(),
        updated_at: new Date().toISOString()
      };
      if (!d.title || !d.body) {
        msg.className = 'form-msg err';
        msg.textContent = '제목과 내용을 입력해 주세요.';
        return;
      }
      if (!(user.cloud && SHSCloud.enabled())) {
        msg.className = 'form-msg err';
        msg.textContent = '회의록 등록은 서버 로그인(구글 또는 이메일) 후 사용할 수 있습니다.';
        return;
      }
      SHSCloud.init().then(function (c) {
        var op = id ? c.from('minutes_board').update(d).eq('id', id) : c.from('minutes_board').insert(d);
        return op;
      }).then(function (res) {
        if (res.error) { msg.className = 'form-msg err'; msg.textContent = res.error.message; return; }
        SHSCloud.log(id ? 'update' : 'create', '회의록 ' + (id ? '수정' : '등록'), d.title);
        load();
      });
    });
    var cancel = document.getElementById('mb-cancel');
    if (cancel) cancel.addEventListener('click', function () {
      document.getElementById('mb-id').value = '';
      document.getElementById('mb-title').value = '';
      document.getElementById('mb-date').value = '';
      document.getElementById('mb-body').value = '';
      document.getElementById('mb-form-title').textContent = '회의록 등록';
      cancel.classList.add('hidden');
    });
    listBox.querySelectorAll('button[data-mbedit]').forEach(function (b) {
      b.addEventListener('click', function () {
        var d = docs[+b.dataset.mbedit];
        document.getElementById('mb-id').value = d.id;
        document.getElementById('mb-title').value = d.title;
        document.getElementById('mb-date').value = d.meeting_date || '';
        document.getElementById('mb-body').value = d.body || '';
        document.getElementById('mb-form-title').textContent = '회의록 수정';
        document.getElementById('mb-cancel').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
    listBox.querySelectorAll('button[data-mbdel]').forEach(function (b) {
      b.addEventListener('click', function () {
        var d = docs[+b.dataset.mbdel];
        if (!confirm('"' + d.title + '" 을(를) 삭제하시겠습니까? 되돌릴 수 없습니다.')) return;
        SHSCloud.init().then(function (c) {
          return c.from('minutes_board').delete().eq('id', d.id);
        }).then(function (res) {
          if (res.error) { alert(res.error.message); return; }
          SHSCloud.log('delete', '회의록 삭제', d.title);
          load();
        });
      });
    });
  }

  /* ---------- 자료 불러오기 ---------- */
  function load() {
    if (user.cloud && window.SHSCloud && SHSCloud.enabled()) {
      SHSCloud.init().then(function (c) {
        return c.from('minutes_board').select('*')
          .order('meeting_date', { ascending: false }).order('id', { ascending: false });
      }).then(function (r) {
        if (r.error) {
          gate.insertAdjacentHTML('beforeend',
            '<div class="notice-banner">회의록을 불러오지 못했습니다: ' + e(r.error.message) +
            ' (07 회의록 게시판 등록이 필요할 수 있습니다)</div>');
          docs = [];
          renderList();
          return;
        }
        docs = r.data || [];
        /* 녹음이 붙은 회의록에 표시 (113 sql 을 실행하기 전이면 그냥 넘어간다) */
        return SHSCloud.init().then(function (c) {
          return c.from('minutes_audio').select('minutes_id');
        }).then(function (a) {
          audioCount = {};
          ((a && !a.error && a.data) || []).forEach(function (x) {
            audioCount[x.minutes_id] = (audioCount[x.minutes_id] || 0) + 1;
          });
        }, function () {}).then(function () {
          renderList();
          /* AI 검색 근거 링크(minutes.html?id=N&q=낱말): 그 회의록을 바로 열고 낱말을 표시한다 */
          var qs = new URLSearchParams(location.search);
          var pid = qs.get('id');
          var d0 = pid && docs.filter(function (x) { return String(x.id) === pid; })[0];
          if (d0) { renderView(d0); highlight(viewBox, qs.get('q')); }
        });
      });
      return;
    }
    /* 노회 내부 컴퓨터: 비공개 파일의 제19회기 회의록 표시 */
    fetch('private/minutes-content.html')
      .then(function (res) { if (!res.ok) throw new Error(); return res.text(); })
      .then(function (html) {
        docs = [{ id: 'local', title: '제19회기 봄 정기노회 회의록', meeting_date: '2026-04-13', html: html }];
        renderList();
      })
      .catch(function () {
        gate.insertAdjacentHTML('beforeend',
          '<div class="notice-banner">회의록은 서버에 보관되어 있습니다. ' +
          '지금은 <strong>이 컴퓨터 전용 계정</strong>으로 로그인되어 있어 열람할 수 없습니다. ' +
          '로그아웃 후 <strong>서버 계정(구글 또는 이메일)</strong>으로 다시 로그인해 주세요. ' +
          '<a class="btn sm" style="margin-left:8px" href="login.html">로그인 화면으로</a></div>');
      });
  }
  load();
 });
});
</script>
</body>
</html>
