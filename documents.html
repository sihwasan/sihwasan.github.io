<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서류 발급 - 시화산노회</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page-head">
  <div class="container">
    <h1>서류 발급</h1>
    <div class="crumb">홈 &gt; 서류발급 &gt; 증명서 직권 발급</div>
  </div>
</div>

<main class="page-body container" id="main">
  <div id="doc-area"></div>
  <div id="cert-print"></div>
</main>

<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-auth.js"></script>
<script src="js/main.js"></script>
<script src="js/certs-config.js"></script>
<script src="js/certificate.js"></script>
<script src="js/certs.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
 SHS.getUser().then(function (user) {
  var area = document.getElementById('doc-area');
  var e = SHS.esc;

  if (!user || !SHSAuth.canIssueDocuments(user)) {
    area.innerHTML =
      '<div class="notice-banner">서류 발급 권한은 <strong>서기</strong>에게 있습니다.' +
      (user ? ' 현재 등급(' + SHS.displayRole(user.role, user.title) + ')으로는 발급할 수 없습니다. 서류가 필요하신 회원께서는 노회 사무실(031-486-9993)로 신청해 주시기 바랍니다.'
            : ' <a class="btn sm" style="margin-left:10px" href="login.html">로그인</a>') +
      '</div>' +
      '<h2>발급 가능 서류 안내</h2>' +
      '<div class="doc-list">' +
      '<div class="doc-item"><div class="d-name">소속증명서</div><div class="d-desc">노회 소속 교역자임을 증명합니다. 연말정산, 기관 제출 등에 사용합니다.</div></div>' +
      '<div class="doc-item"><div class="d-name">재직증명서</div><div class="d-desc">해당 교회에 재직 중임을 증명합니다.</div></div>' +
      '<div class="doc-item"><div class="d-name">대표자증명서</div><div class="d-desc">해당 교회의 대표자임을 증명합니다. 은행 제출 등에 사용합니다.</div></div>' +
      '<div class="doc-item"><div class="d-name">직인증명서</div><div class="d-desc">교회 직인을 증명합니다. 은행 제출 등에 사용합니다.</div></div>' +
      '</div>';
    return;
  }

  /* 서류 발급 권한은 서기에게 있다.
   * 간사는 서기를 대행하여 실무를 처리하며, 발급 기록에 대행으로 남는다. */
  var isProxy = user.role !== 'clerk';
  var proxyNote = user.role === 'staff' ? ' (서기 대행)'
                : (user.role === 'president' ? ' (노회장 승인)' : '');

  var html = '';
  html += '<div class="notice-banner"><strong>' + e(user.name) + '</strong> 님, ' +
    (isProxy
      ? '서류 발급 권한은 <strong>서기</strong>에게 있습니다. 처리하신 발급 건은 발급 대장에 <strong>' +
        (user.role === 'staff' ? '서기 대행' : '노회장 승인') + '</strong>으로 기록됩니다.'
      : '서류 발급 권한이 확인되었습니다.') +
    ' 발급된 서류는 발급 대장에 자동 기록됩니다.</div>';
  html += '<h2>증명서 직권 발급</h2>';
  html += '<div class="admin-card" style="max-width:760px">' +
    '<p style="font-size:0.85rem;color:var(--gray-7);margin-bottom:14px">' +
    '회원의 <strong>신청이 없어도</strong> 아래 내용을 채워 바로 발급할 수 있습니다. ' +
    '대상자 성명을 노회 명단에서 고르면 직위·소속 교회가 자동으로 채워집니다. ' +
    '회원이 신청한 건은 <a href="#requests" style="color:var(--navy);text-decoration:underline">접수된 서류 신청</a>에서 발급해 주세요.</p>' +
    '<div class="inline-form">' +
    '<div class="field"><label>서류 종류</label><select id="d-type">' +
    '<option>소속증명서</option><option>재직증명서</option><option>대표자증명서</option><option>직인증명서</option><option>은퇴목사확인서</option>' +
    '</select></div>' +
    '<div class="field"><label>대상자 성명</label><input type="text" id="d-name" list="d-roster" autocomplete="off">' +
    '<datalist id="d-roster"></datalist></div>' +
    '<div class="field"><label>직위</label><select id="d-pos"><option>목사</option><option>부목사</option><option>장로</option><option>전도사</option></select></div>' +
    '<div class="field"><label>소속 교회</label><input type="text" id="d-church"></div>' +
    '<div class="field"><label>용도</label><select id="d-purpose">' +
    '<option>연말정산용</option><option>은행제출용</option><option>기관제출용</option><option>총회제출용</option><option>회사제출용</option><option>교회제출용</option><option>기타</option>' +
    '</select></div>' +
    '<div class="field" style="flex:0 0 90px"><label>회기</label><input type="number" id="d-session" value="19" min="1" max="99"></div>' +
    '<button class="btn" id="btn-issue">발급</button>' +
    '</div>' +
    '<input type="hidden" id="d-reqid" value="">' +
    '<div id="d-reqnote" class="hidden" style="font-size:0.85rem;color:var(--navy);margin-bottom:8px"></div>' +
    '<div><label style="font-size:0.85rem;font-weight:500;color:var(--gray-7)">날인할 도장</label>' +
    '<div class="seal-pick" id="seal-pick"><span style="color:var(--gray-5)">직인 정보를 불러오는 중...</span></div>' +
    '<p style="font-size:0.8rem;color:var(--gray-5)">등록된 도장은 <a href="settings.html" style="color:var(--navy);text-decoration:underline">관리자 → 직인·도장</a>에서 관리합니다.</p></div>' +
    '<div class="form-msg" id="d-msg"></div></div>';

  /* 접수된 신청 */
  html += '<h2 id="requests">접수된 서류 신청</h2><div id="req-list"><p style="color:var(--gray-5)">불러오는 중...</p></div>';

  /* 발급 대장 */
  html += '<h2>발급 대장</h2><div id="log-table"></div>';
  area.innerHTML = html;
  SHS.sectionize(area);

  /* ---------- 직인·도장 ---------- */
  var seals = {};        /* key → { label, holder, url, data } */

  /* 도장 그림을 증명서에 함께 담을 수 있는 형태(그림 자체)로 바꾼다.
   * 배경이 비치도록 PNG로 두고, 너무 크지 않게 200px로 줄인다. */
  function toDataUrl(url) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function () {
        try {
          var MAX = 200;
          var sc = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
          var cv = document.createElement('canvas');
          cv.width = Math.max(1, Math.round(img.naturalWidth * sc));
          cv.height = Math.max(1, Math.round(img.naturalHeight * sc));
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          resolve(cv.toDataURL('image/png'));
        } catch (x) { resolve(null); }
      };
      img.onerror = function () { resolve(null); };
      img.src = url;
    });
  }

  function loadSeals() {
    var pick = document.getElementById('seal-pick');
    if (!(user.cloud && window.SHSCloud && SHSCloud.enabled())) {
      pick.innerHTML = '<span style="color:var(--gray-5)">서버 로그인 시 등록된 도장을 날인할 수 있습니다.</span>';
      return;
    }
    SHSCloud.init().then(function (c) {
      return c.from('seals').select('*').order('sort');
    }).then(function (r) {
      if (r.error || !r.data) {
        pick.innerHTML = '<span style="color:var(--gray-5)">등록된 도장이 없습니다. ' +
          '홈페이지 설정에서 직인을 먼저 등록해 주세요.</span>';
        return;
      }
      var withFile = r.data.filter(function (s) { return s.file_path; });
      if (!withFile.length) {
        pick.innerHTML = '<span style="color:var(--gray-5)">아직 등록된 도장 이미지가 없습니다. ' +
          '홈페이지 설정 → 직인·도장에서 등록해 주세요.</span>';
        return;
      }
      pick.innerHTML = withFile.map(function (s) {
        var on = (s.key === '노회직인') ? ' checked' : '';
        return '<label><input type="checkbox" data-seal="' + e(s.key) + '"' + on + '>' + e(s.label) + '</label>';
      }).join('');

      /* 도장 그림을 미리 받아 둔다.
       * 직인은 관리자만 볼 수 있는 자료여서, 발급할 때 증명서 안에 그림째로
       * 박아 보관한다. 그래야 신청자도 자기 증명서를 열어 볼 수 있고,
       * 나중에 도장을 바꾸어도 이미 발급한 증명서는 그대로 남는다. */
      SHSCloud.init().then(function (c) {
        withFile.forEach(function (s) {
          c.storage.from('seals').createSignedUrl(s.file_path, 3600).then(function (r2) {
            if (r2.error) return;
            seals[s.key] = { label: s.label, holder: s.holder, url: r2.data.signedUrl };
            toDataUrl(r2.data.signedUrl).then(function (d) {
              if (d && seals[s.key]) seals[s.key].data = d;
            });
          });
        });
      });
      SHS.logAction('view', '직인 열람', '서류 발급 화면에서 도장 ' + withFile.length + '종 불러옴');
    });
  }
  loadSeals();

  /* ---------- 노회 명단으로 대상자 자동 채우기 (직권 발급 편의) ---------- */
  var rosterRows = [];
  function loadRoster() {
    if (!(user.cloud && window.SHSCloud && SHSCloud.enabled())) return;
    SHSCloud.init().then(function (c) {
      return c.from('roster').select('name,church,position').order('id');
    }).then(function (r) {
      if (r.error || !r.data) return;
      rosterRows = r.data;
      var dl = document.getElementById('d-roster');
      if (!dl) return;
      dl.innerHTML = rosterRows.map(function (m) {
        return '<option value="' + e(m.name) + '">' +
          e((m.position ? m.position + ' · ' : '') + (m.church || '')) + '</option>';
      }).join('');
    });
  }
  loadRoster();

  /* 명단의 직분(위임목사·시무목사 등)을 발급 양식의 직위 보기로 맞춘다 */
  function posToOption(p) {
    p = p || '';
    if (p.indexOf('부목사') !== -1) return '부목사';
    if (p.indexOf('목사') !== -1) return '목사';
    if (p.indexOf('장로') !== -1) return '장로';
    if (p.indexOf('전도사') !== -1) return '전도사';
    return '';
  }
  document.getElementById('d-name').addEventListener('change', function () {
    var v = this.value.trim();
    var hit = rosterRows.filter(function (m) { return m.name === v; });
    if (hit.length !== 1) return;   /* 동명이인이거나 명단에 없으면 손으로 채운다 */
    if (hit[0].church) document.getElementById('d-church').value = hit[0].church;
    var po = posToOption(hit[0].position);
    if (po) document.getElementById('d-pos').value = po;
  });

  function pickedSeals() {
    var out = [];
    document.querySelectorAll('#seal-pick input[data-seal]').forEach(function (i) {
      if (i.checked && seals[i.dataset.seal]) out.push({ key: i.dataset.seal, s: seals[i.dataset.seal] });
    });
    return out;
  }

  /* ---------- 접수된 신청 목록 ---------- */
  function loadRequests() {
    var box = document.getElementById('req-list');
    if (!(user.cloud && window.SHSCloud && SHSCloud.enabled())) {
      box.innerHTML = '<p style="color:var(--gray-5)">서버 로그인 시 회원의 서류 신청 내역을 확인할 수 있습니다.</p>';
      return;
    }
    SHSCloud.init().then(function (c) {
      return Promise.all([
        c.from('doc_requests').select('*').order('id', { ascending: false }).limit(100),
        c.from('doc_issues').select('id,request_id,doc_no,void_yn')
          .then(function (x) { return x; }, function (x) { return { error: x }; })
      ]);
    }).then(function (rs) {
      var r = rs[0];
      if (r.error) {
        box.innerHTML = '<p style="color:var(--gray-5)">신청 내역을 불러오지 못했습니다: ' + e(r.error.message) + '</p>';
        return;
      }
      /* 발급된 증명서를 신청번호로 묶어 둔다 */
      var issued = {}, issueErr = rs[1] && rs[1].error;
      ((rs[1] && rs[1].data) || []).forEach(function (x) {
        if (x.request_id && !x.void_yn && !issued[x.request_id]) issued[x.request_id] = x;
      });

      var rows = r.data || [];
      if (!rows.length) { box.innerHTML = '<p style="color:var(--gray-5)">접수된 신청이 없습니다.</p>'; return; }

      var warn = issueErr
        ? '<div class="notice-banner" style="border-left-color:var(--red)">증명서 보관표(doc_issues)를 읽지 못했습니다. ' +
          'Supabase에서 <strong>31_doc_issue.sql</strong>을 아직 실행하지 않으셨다면 먼저 실행해 주세요.<br>' +
          '<span style="font-size:0.82rem;color:var(--gray-5)">' + e(issueErr.message || '') + '</span></div>'
        : '';

      var html2 = warn +
        '<table class="tbl"><thead><tr><th>신청일</th><th>신청자</th><th>소속</th><th>서류</th><th>용도</th>' +
        '<th>부수</th><th>요청사항</th><th>상태</th><th style="width:210px">처리</th></tr></thead><tbody>';
      rows.forEach(function (q) {
        var iss = issued[q.id];
        var act;
        if (iss) {
          /* 이미 증명서가 만들어진 건 */
          act = '<a class="btn sm" href="certificate.html?id=' + iss.id + '" target="_blank" rel="noopener">증명서 열기</a>' +
            '<div style="font-size:0.72rem;color:var(--gray-5);margin-top:4px">' + e(iss.doc_no) + '</div>';
        } else if (q.status === '반려') {
          act = '<span style="color:var(--gray-5)">-</span>';
        } else {
          /* 아직 증명서가 없으면 상태와 상관없이 발급할 수 있어야 한다.
           * (예전에 '발급완료'로만 표시한 건도 여기서 다시 발급한다) */
          act = '<button class="btn sm" data-rqfill="' + q.id + '">증명서 발급</button> ' +
            (q.status === '신청'
              ? '<button class="btn danger sm" data-rqrej="' + q.id + '">반려</button>'
              : '') +
            (q.status === '발급완료'
              ? '<div style="font-size:0.72rem;color:var(--red);margin-top:4px">증명서 없음 · 발급 필요</div>'
              : '');
        }
        html2 += '<tr><td>' + e(String(q.created_at).slice(0, 10)) + '</td>' +
          '<td>' + e(q.name) + '<div style="font-size:0.75rem;color:var(--gray-5)">' + e(q.position || '') + '</div></td>' +
          '<td>' + e(q.church || '-') + '</td><td>' + e(q.doc_type) + '</td><td>' + e(q.purpose || '-') + '</td>' +
          '<td>' + e(q.copies) + '</td><td class="left" style="font-size:0.82rem">' + e(q.memo || '-') + '</td>' +
          '<td><span class="role-badge">' + e(q.status) + '</span>' +
          (q.handled_by ? '<div style="font-size:0.72rem;color:var(--gray-5)">' + e(q.handled_by) + '</div>' : '') + '</td>' +
          '<td>' + act + '</td></tr>';
      });
      html2 += '</tbody></table>';
      box.innerHTML = html2;

      function setStatus(id, status) {
        SHSCloud.init().then(function (c) {
          return c.from('doc_requests').update({
            status: status, handled_by: user.name + proxyNote, updated_at: new Date().toISOString()
          }).eq('id', id);
        }).then(function (res) {
          if (res.error) { alert(res.error.message); return; }
          SHSCloud.log('update', '서류 신청 ' + status, '신청번호 ' + id + proxyNote);
          loadRequests();
        });
      }
      box.querySelectorAll('button[data-rqfill]').forEach(function (b) {
        b.addEventListener('click', function () {
          var q = rows.filter(function (x) { return String(x.id) === b.dataset.rqfill; })[0];
          if (!q) return;
          document.getElementById('d-type').value = q.doc_type === '기타' ? '소속증명서' : q.doc_type;
          document.getElementById('d-name').value = q.name;
          document.getElementById('d-church').value = q.church || '';
          if (q.purpose) document.getElementById('d-purpose').value = q.purpose;
          if (q.position) {
            var ps = document.getElementById('d-pos');
            for (var i = 0; i < ps.options.length; i++) {
              if (ps.options[i].value === q.position) { ps.value = q.position; break; }
            }
          }
          /* 이 신청 건과 연결해서 발급한다 (발급하면 신청자에게 바로 전달된다) */
          document.getElementById('d-reqid').value = q.id;
          var note = document.getElementById('d-reqnote');
          note.textContent = '신청번호 ' + q.id + ' (' + q.name + ' / ' + (q.church || '') +
            ') 건으로 발급합니다. 발급하면 신청자에게 알림이 가고 신청자가 PDF로 내려받습니다.';
          note.classList.remove('hidden');
          /* 발급 양식은 다른 탭(증명서 발급)에 있으므로 그 탭으로 옮겨 준다.
           * 그러지 않으면 양식만 몰래 채워지고 화면에는 아무 변화가 없어 보인다. */
          var panel = document.getElementById('d-name').closest('.page-section');
          var tab = panel ? document.querySelector('.section-nav a[href="#' + panel.id + '"]') : null;
          if (tab) tab.click();
          document.getElementById('d-name').scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
      });
      box.querySelectorAll('button[data-rqrej]').forEach(function (b) {
        b.addEventListener('click', function () {
          if (!confirm('이 신청을 반려하시겠습니까?')) return;
          setStatus(b.dataset.rqrej, '반려');
        });
      });
    });
  }
  loadRequests();

  /* ---------- 발급 대장 (노회 서버에 보관) ---------- */
  function renderLog() {
    var t = document.getElementById('log-table');
    if (!(user.cloud && window.SHSCloud && SHSCloud.enabled())) {
      t.innerHTML = '<p style="color:var(--gray-5)">서버 로그인 시 발급 대장을 볼 수 있습니다.</p>';
      return;
    }
    SHSCloud.init().then(function (c) {
      return c.from('doc_issues').select('*').order('id', { ascending: false }).limit(200);
    }).then(function (r) {
      if (r.error) {
        t.innerHTML = '<p style="color:var(--gray-5)">발급 대장을 불러오지 못했습니다: ' + e(r.error.message) +
          ' (31 증명서 발급 등록이 필요할 수 있습니다)</p>';
        return;
      }
      var rows = r.data || [];
      if (!rows.length) {
        t.innerHTML = '<p style="color:var(--gray-5)">발급 기록이 없습니다.</p>';
        return;
      }
      t.innerHTML = '<table class="tbl"><thead><tr><th>발급번호</th><th>발급일</th><th>서류명</th>' +
        '<th>대상자</th><th>교회</th><th>용도</th><th>발급자</th><th>날인</th>' +
        '<th style="width:270px">증명서</th></tr></thead><tbody>' +
        rows.map(function (d) {
          var sealed = Object.keys(d.seals || {}).join(', ');
          /* 보관본이 있으면 발급 당시 그 파일을 그대로 내려받고,
           * 없으면 예전처럼 그때그때 새로 그려서 내려받는다. */
          var kept = window.SHSCerts && SHSCerts.stored(d) && !d.void_yn;
          return '<tr' + (d.void_yn ? ' style="opacity:.55"' : '') + '>' +
            '<td>' + e(d.doc_no) + (d.void_yn ? ' <span class="fail">(무효)</span>' : '') + '</td>' +
            '<td>' + e(d.issued_on) + '</td><td>' + e(d.doc_type) + '</td>' +
            '<td>' + e(d.name) + '</td><td>' + e(d.church) + '</td><td>' + e(d.purpose || '-') + '</td>' +
            '<td>' + e(d.issuer_name || '-') + '</td><td>' + e(sealed || '-') + '</td>' +
            '<td><button class="btn sm" data-pdf="' + d.id + '">PDF</button> ' +
            '<a class="btn ghost sm" href="certificate.html?id=' + d.id + '" target="_blank" rel="noopener">열기</a>' +
            (d.void_yn ? '' : ' <button class="btn danger sm" data-void="' + d.id + '">취소</button>') +
            ' <button class="btn danger sm" data-del="' + d.id + '">삭제</button>' +
            '<div style="font-size:0.72rem;color:var(--gray-5);margin-top:4px">' +
            (kept ? '보관본 있음' : '보관본 없음 · 내려받을 때 새로 만듭니다') + '</div>' +
            '</td></tr>';
        }).join('') + '</tbody></table>';

      /* 발급 대장에서 바로 PDF 내려받기 */
      t.querySelectorAll('button[data-pdf]').forEach(function (b) {
        b.addEventListener('click', function () {
          var d = rows.filter(function (x) { return String(x.id) === b.dataset.pdf; })[0];
          if (!d) return;
          b.disabled = true;
          b.textContent = '만드는 중...';
          SHSCerts.get(d).then(function () {
            b.disabled = false;
            b.textContent = 'PDF';
            SHS.logAction('view', '증명서 PDF 저장', d.doc_no + ' ' + d.doc_type);
          }, function (x) {
            b.disabled = false;
            b.textContent = 'PDF';
            alert((x && x.message) || 'PDF를 만들지 못했습니다. 잠시 후 다시 시도해 주세요.');
          });
        });
      });

      t.querySelectorAll('button[data-void]').forEach(function (b) {
        b.addEventListener('click', function () {
          var why = prompt('이 증명서를 무효 처리합니다. 사유를 적어 주세요.');
          if (why === null) return;
          SHSCloud.init().then(function (c) {
            return c.rpc('void_document', { p_id: parseInt(b.dataset.void, 10), p_reason: why });
          }).then(function (res) {
            if (res.error) { alert(res.error.message); return; }
            renderLog();
          });
        });
      });

      /* 잘못 발급한 기록을 발급 대장에서 완전히 지운다.
       * 무효 처리와 달리 기록이 남지 않으며, 신청자도 더 이상 내려받을 수 없다. */
      t.querySelectorAll('button[data-del]').forEach(function (b) {
        b.addEventListener('click', function () {
          var row = rows.filter(function (x) { return String(x.id) === b.dataset.del; })[0];
          var label = row ? row.doc_no + ' ' + row.doc_type + ' (' + row.name + ')' : '발급번호 ' + b.dataset.del;
          if (!confirm(label + '\n\n이 발급 기록을 완전히 삭제합니다.\n' +
            '무효 처리와 달리 발급 대장에서 사라지고 신청자도 더 이상 내려받을 수 없습니다.\n' +
            '삭제하시겠습니까?')) return;
          /* 발급 기록을 지우기 전에 보관소의 PDF부터 치운다.
           * (무효 처리와 달리 기록 자체가 사라지므로 파일도 남기지 않는다) */
          var gone = (window.SHSCerts && SHSCerts.enabled())
            ? SHSCerts.remove(b.dataset.del) : Promise.resolve(false);
          gone.then(function () {
            return SHSCloud.init();
          }).then(function (c) {
            return c.from('doc_issues').delete().eq('id', parseInt(b.dataset.del, 10));
          }).then(function (res) {
            if (res.error) { alert(res.error.message); return; }
            SHSCloud.log('delete', '증명서 발급 기록 삭제', label + proxyNote);
            renderLog();
            loadRequests();
          });
        });
      });
    });
  }
  renderLog();

  /* 발급 명의로 쓸 노회장 성명 */
  var presidentName = (function () {
    var o = (SHSData.officers || []).filter(function (x) { return x.role === '노회장'; })[0];
    return o ? o.name : '';
  })();
  if (window.SHSCloud && SHSCloud.enabled()) {
    SHSCloud.init().then(function (c) {
      return c.from('site_settings').select('*').eq('key', 'officers').single();
    }).then(function (r) {
      var list = (r.data && r.data.value) || [];
      var o = (list.officers || list || []).filter
        ? (list.officers || list).filter(function (x) { return x && x.role === '노회장'; })[0] : null;
      if (o && o.name) presidentName = o.name;
    }).catch(function () {});
  }

  document.getElementById('btn-issue').addEventListener('click', function () {
    var msg = document.getElementById('d-msg');
    var btn = document.getElementById('btn-issue');
    var doc = document.getElementById('d-type').value;
    var name = document.getElementById('d-name').value.trim();
    var pos = document.getElementById('d-pos').value;
    var church = document.getElementById('d-church').value.trim();
    var purpose = document.getElementById('d-purpose').value;
    var session = parseInt(document.getElementById('d-session').value, 10) || 19;
    var reqId = document.getElementById('d-reqid').value;
    if (!name || !church) {
      msg.className = 'form-msg err';
      msg.textContent = '대상자 성명과 소속 교회를 입력해 주세요.';
      return;
    }
    if (!(user.cloud && window.SHSCloud && SHSCloud.enabled())) {
      msg.className = 'form-msg err';
      msg.textContent = '증명서 발급은 서버 로그인(구글 또는 이메일) 후 이용할 수 있습니다.';
      return;
    }

    /* 발급 당시 도장 모습을 증명서에 함께 담는다 */
    var sealMap = {};
    pickedSeals().forEach(function (x) {
      sealMap[x.key] = { label: x.s.label, holder: x.s.holder || '', url: x.s.data || '' };
    });
    var missing = Object.keys(sealMap).filter(function (k) { return !sealMap[k].url; });
    if (missing.length) {
      msg.className = 'form-msg err';
      msg.textContent = '도장 그림을 아직 다 불러오지 못했습니다(' + missing.join(', ') + '). 잠시 후 다시 눌러 주세요.';
      return;
    }

    var body = SHSCert.bodyText({ doc_type: doc, church: church, position: pos });
    btn.disabled = true;
    msg.className = 'form-msg';
    msg.textContent = '발급 중입니다...';

    SHSCloud.init().then(function (c) {
      return c.rpc('issue_document', {
        p_request_id: reqId ? parseInt(reqId, 10) : null,
        p_doc_type: doc, p_name: name, p_position: pos, p_church: church,
        p_purpose: purpose, p_copies: 1, p_body_text: body,
        p_seals: sealMap, p_president: presidentName, p_session_no: session
      });
    }).then(function (res) {
      btn.disabled = false;
      if (res.error) {
        msg.className = 'form-msg err';
        msg.textContent = res.error.message;
        return;
      }
      var rec = Array.isArray(res.data) ? res.data[0] : res.data;
      msg.className = 'form-msg ok';
      msg.innerHTML = e(rec.doc_no) + ' ' + e(rec.doc_type) + '가 발급되었습니다.' +
        (rec.user_id ? ' 신청자에게 알림이 전달되어 홈페이지에서 PDF로 받으실 수 있습니다.' : '') +
        ' <a href="certificate.html?id=' + rec.id + '" target="_blank" rel="noopener" ' +
        'style="color:var(--navy);text-decoration:underline">증명서 새 창으로 열기</a>';
      document.getElementById('d-reqid').value = '';
      document.getElementById('d-reqnote').classList.add('hidden');
      renderLog();
      loadRequests();
      renderCert(rec);
      document.getElementById('cert-print').scrollIntoView({ behavior: 'smooth' });
      /* 방금 만든 증명서를 노회 보관소에 남긴다.
       * 올리지 못해도 발급은 그대로이고, 내려받기도 예전 방식으로 된다. */
      keepPdf(rec, msg);
    }).catch(function (x) {
      btn.disabled = false;
      msg.className = 'form-msg err';
      msg.textContent = (x && x.message) || '발급하지 못했습니다.';
    });
  });

  /* 발급된 증명서 PDF를 노회 보관소에 올린다.
   * 발급은 이미 끝난 뒤이므로, 여기서 실패해도 발급을 되돌리지 않는다.
   * 보관에 실패한 건은 내려받을 때 예전처럼 새로 그려 준다. */
  function keepPdf(rec, msg) {
    if (!(window.SHSCerts && SHSCerts.enabled())) return;
    var note = document.createElement('div');
    note.style.cssText = 'font-size:0.82rem;color:var(--gray-5);margin-top:6px';
    note.textContent = '증명서를 노회 보관소에 올리는 중입니다...';
    msg.appendChild(note);
    SHSCerts.keep(rec).then(function (out) {
      if (SHSCerts.stored(out)) {
        note.textContent = '증명서를 노회 보관소에 보관했습니다. ' +
          '신청자는 발급 당시 모습 그대로 내려받습니다.';
        renderLog();
      } else {
        note.style.color = 'var(--red)';
        note.textContent = '증명서는 발급되었습니다. 다만 보관소에 올리지는 못했습니다. ' +
          '내려받을 때 그때그때 새로 만들어 드리므로 이용에는 지장이 없습니다.';
      }
    });
  }

  function renderCert(rec) {
    var c = document.getElementById('cert-print');
    c.innerHTML =
      '<div class="cert-actions no-print">' +
      '<button class="btn" id="cert-download">PDF 다운로드</button>' +
      '<button class="btn ghost" id="cert-pdf">인쇄</button>' +
      '<a class="btn ghost" href="certificate.html?id=' + rec.id + '" target="_blank" rel="noopener">새 창으로 열기</a>' +
      '</div>' +
      SHSCert.sheet(rec) +
      (rec.seals && Object.keys(rec.seals).length ? ''
        : '<p style="text-align:center;font-size:0.8rem;color:var(--gray-5)" class="no-print">' +
          '날인할 도장을 선택하지 않았습니다. 노회 사무실에서 직접 날인해 주세요.</p>');
    var dl = document.getElementById('cert-download');
    if (dl) dl.addEventListener('click', function () {
      dl.disabled = true;
      dl.textContent = 'PDF 만드는 중...';
      SHSCerts.get(rec).then(function () {
        dl.disabled = false;
        dl.textContent = 'PDF 다운로드';
      }, function (x) {
        dl.disabled = false;
        dl.textContent = 'PDF 다운로드';
        alert((x && x.message) || 'PDF를 만들지 못했습니다. 잠시 후 다시 시도해 주세요.');
      });
    });
    var b = document.getElementById('cert-pdf');
    if (b) b.addEventListener('click', function () { SHSCert.print(rec); });
  }
 });
});
</script>
</body>
</html>
