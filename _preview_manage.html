window.SHS_SUPABASE = { url: 'https://fake.local', anonKey: 'x', ready: function () { return true; }, redirectTo: '' };
window.supabase = { createClient: function () { return client; } };
function thenable(data) { var p = Promise.resolve({ data: data, error: null, count: Array.isArray(data) ? data.length : 0 }); var q = { then: p.then.bind(p), catch: p.catch.bind(p) };
  ['select','eq','neq','in','order','limit','gte','lte','is','not','single','upsert','insert','update','delete'].forEach(function (m) { q[m] = function () { return q; }; }); return q; }
var PROFILE = { id: 'u1', email: 'test@example.com', name: '김동석', church: '운평장로교회', position: '위임목사', role: window.__FAKE_ROLE, title: window.__FAKE_ROLE === 'officer' ? '부서기' : null };
var TABLES = {
  site_notices: [{ id: 1, cat: '소식', title: '임직식 — 손병민 목사 위임 (노진교회)', date: '2026-10-20', schedule_id: 7 }, { id: 2, cat: '공지', title: '제20회 정기노회 안내', date: '2026-10-01' }],
  site_schedule: [{ id: 7, date_label: '11.9', title: '임직식 — 손병민 목사 위임 (노진교회)', event_date: '2026-11-09', kind: '임직식' }, { id: 8, date_label: '4.13', title: '제21회 봄 정기노회', event_date: '2027-04-12', kind: '정기노회' }],
  gallery_items: [], presbytery_reports: [{ id: 1, session: 20, kind: '정기노회', title: '제20회 정기노회 회의자료 (2026 가을)', meet_on: '2026-10-12', pdf_pages: 58, file_path: 'reports/r20.pdf', status: '완료', toc: [{ title: '집회순서', page: 8, level: 1 }, { title: '서기 사무보고', page: 22, level: 1 }, { title: '각 시찰 보고', page: 35, level: 1 }, { title: '북부시찰', page: 35, level: 2 }] }], presbytery_report_pages: [{ id: 1, report_id: 1, pdf_page: 6, page_no: 8, heading: '집회시간', text: '1. 기간 : 주후 2026년 10월 12일(월) 오전 10시~폐회시까지
2. 개회전 부서모임
1)고시규칙부 | 9월 28일(월) 오전 9:00 | 노회사무실' }, { id: 2, report_id: 1, pdf_page: 6, page_no: 9, heading: '개회예배', text: '1) 묵도 다같이
2) 찬송 425장' }], notifications: [], committees: [], committee_events: [], site_settings: [], profiles: [], doc_requests: [], church_reports: [], audit_logs: [], ai_logs: []
};
var client = {
  auth: { getUser: function () { return Promise.resolve({ data: { user: { id: 'u1', email: 'test@example.com' } } }); },
          getSession: function () { return Promise.resolve({ data: { session: { access_token: 'FAKE' } } }); },
          signOut: function () { return Promise.resolve(); } },
  from: function (t) { if (t === 'profiles') { var q = thenable(PROFILE); return q; } return thenable(TABLES[t] || []); },
  rpc: function (n) { return thenable(n === 'assembly_today' ? null : (n === 'my_committees' ? [] : null)); },
  storage: { from: function () { return { createSignedUrls: function () { return Promise.resolve({ data: [] }); } }; } }
};
/* AI 창구 흉내: /ask 는 SSE, /settings 는 JSON */
var realFetch = window.fetch;
window.fetch = function (url, init) {
  if (typeof url === 'string' && url.indexOf('workers.dev') !== -1) {
    if (url.indexOf('/settings') !== -1 || url.indexOf('/health') !== -1) {
      return Promise.resolve(new Response(JSON.stringify({ ok: true, model: 'claude-opus-5-5', effort: 'medium', daily_user: 30, daily_total: 300, roles: ['member','officer'], enabled: true, has_key: true, key_tail: 'AbCd', updated_at: '2026-10-20T01:00:00Z', updated_by: '김동석',
        models: [{ id: 'claude-opus-5-5', name: 'Claude Opus 5.5', input: 4, output: 20, note: '가장 정확함 · 기본값' }, { id: 'claude-sonnet-5-5', name: 'Claude Sonnet 5.5', input: 2, output: 10, note: '빠르고 정확함' }, { id: 'claude-haiku-5-5', name: 'Claude Haiku 5.5', input: 0.1, output: 0.5, note: '가장 저렴하고 빠름' }],
        usage: { date: '2026-10-20', total: 12, me: 3 }, index: { chunks: 2697, built: '2026-10-20' }, saved: true }), { status: 200, headers: { 'Content-Type': 'application/json' } }));
    }
    var evs = [
      ['status', { text: '총회 자료를 찾는 중' }],
      ['delta', { n: 0, text: '잠시만요' }], ['retract', { n: 0 }],
      ['status', { text: '답을 정리하는 중' }],
      ['delta', { n: 1, text: '**해벌**은 치리회가 시벌한 자를 회개가 확인되면 풀어 주는 절차입니다. ' }],
      ['delta', { n: 1, text: '권징조례 제35조는 당회가 정하는 책벌을 권계·견책·정직·면직·수찬 정지·제명·출교로 정합니다 [R2]{{권계(勸誡), 견책(譴責), 정직, 면직, 수찬 정지, 제명, 출교}}. \n\n' }],
      ['delta', { n: 1, text: '- 시벌과 해벌은 예배모범 제16·17장에 따라 처리합니다 [R1]\n- 면직을 해벌할 때 노회는 극히 근신하여 행합니다 [R3]\n\n자료에서 확인되는 범위는 여기까지입니다.' }],
      ['sources', { list: [
        { ref: 'R1', title: '권징조례 제31조', url: 'assembly-constitution.html#b5-s3-a31', kind: '총회 헌법 > 권징조례', snippet: '제31조 치리회가 시벌하거나 해벌하는 때에는 장로회 예배 모범 제 16, 17장의 규정한 바에 의하여 처리함이 옳다.', cited: true },
        { ref: 'R2', title: '권징조례 제35조', url: 'assembly-constitution.html#b5-s4-a35', kind: '총회 헌법 > 권징조례', snippet: '제35조 당회가 정하는 책벌은 권계(勸誡), 견책(譴責), 정직, 면직, 수찬 정지, 제명, 출교니…', cited: true, quotes: ['권계(勸誡), 견책(譴責), 정직, 면직, 수찬 정지, 제명, 출교'] },
        { ref: 'R3', title: '예배모범 제17장 해벌', url: 'assembly-constitution.html#b4-s16', kind: '총회 헌법 > 예배모범', snippet: '5. 정직한 목사를 복직하며 면직한 자를 임직할 때는 노회는 극히 근신하여 행할 것이나…', cited: true },
        { ref: 'R4', title: '제110회 총회(2025년) 「정치부 보고」', url: 'assembly-resolution.html#s110-i11', kind: '총회 회의결의', snippet: '…', cited: false } ] }],
      ['usage', { model: 'claude-opus-5-5', input_tokens: 18000, output_tokens: 300, ms: 4200 }], ['done', {}]
    ];
    var enc = new TextEncoder();
    var i = 0;
    var stream = new ReadableStream({ pull: function (ctl) { return new Promise(function (res) { setTimeout(function () {
      if (i >= evs.length) { ctl.close(); res(); return; }
      ctl.enqueue(enc.encode('event: ' + evs[i][0] + '\ndata: ' + JSON.stringify(evs[i][1]) + '\n\n')); i++; res(); }, 350); }); } });
    return Promise.resolve(new Response(stream, { status: 200, headers: { 'Content-Type': 'text/event-stream' } }));
  }
  return realFetch.apply(this, arguments);
};
</script>

<script>
document.addEventListener('DOMContentLoaded', function () {
 SHS.getUser().then(function (user) {
  var area = document.getElementById('mg-area');
  var e = SHS.esc;

  if (!user || !SHSAuth.canManageMembers(user)) {
    area.innerHTML =
      '<div class="notice-banner">사이트 관리는 <strong>관리자 등급</strong>이 이용할 수 있습니다.' +
      (user ? ' 현재 등급(' + SHS.displayRole(user.role, user.title) + ')으로는 이용할 수 없습니다.'
            : ' <a class="btn sm" style="margin-left:10px" href="login.html">로그인</a>') +
      '</div>';
    return;
  }
  if (!user.cloud) {
    area.innerHTML =
      '<div class="notice-banner"><strong>관리자 등급</strong>에게 수정 권한이 있습니다. ' +
      '수정 내용이 서버에 저장되어 모든 방문자에게 반영되므로 서버 로그인이 필요합니다. ' +
      '로그인 화면에서 구글 로그인 또는 이메일 로그인으로 다시 접속해 주세요. ' +
      '<a class="btn sm" style="margin-left:10px" href="login.html">로그인 화면으로</a></div>';
    return;
  }

  var db = null;

  function toast(el, ok, msg) {
    el.className = 'form-msg ' + (ok ? 'ok' : 'err');
    el.textContent = msg;
    if (ok) setTimeout(function () { el.textContent = ''; }, 4000);
  }

  /* ---------- 화면 구성 ---------- */
  area.innerHTML =
    '<div class="notice-banner">이 화면에서 수정하고 <strong>저장</strong>을 누르면 즉시 홈페이지에 반영됩니다. ' +
    '모든 수정 내역은 감사 기록에 남습니다.</div>' +
    '<div class="tabs">' +
    '<button class="active" data-tab="mg-notice">공지사항</button>' +
    '<button data-tab="mg-hero">메인 화면</button>' +
    '<button data-tab="mg-gallery">갤러리</button>' +
    '<button data-tab="mg-ops">노회 운영</button>' +
    '</div>' +
    '<div class="tab-panel active" id="mg-notice"><p style="color:var(--gray-5)">불러오는 중...</p></div>' +
    '<div class="tab-panel" id="mg-hero"></div>' +
    '<div class="tab-panel" id="mg-gallery"></div>' +
    /* 노회 운영: 시스템 운영(알림 설정·노회 일정·매뉴얼·권한 위임·감사)을 위에,
     * 회기 설정을 아래에 둔다 */
    '<div class="tab-panel" id="mg-ops">' +
    '<div id="mg-opsbody"><p style="color:var(--gray-5)">불러오는 중...</p></div>' +
    '<div id="mg-terms" style="margin-top:22px;max-width:760px"></div></div>';

  /* 탭 전환 (main.js의 탭 코드는 페이지 로드 시점에 실행되므로 여기서 직접 연결) */
  area.querySelectorAll('.tabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      area.querySelectorAll('.tabs button').forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active');
      area.querySelectorAll('.tab-panel').forEach(function (p) {
        p.classList.toggle('active', p.id === b.dataset.tab);
      });
    });
  });

  /* 주소에 #mg-ops 처럼 탭 이름이 붙어 오면 그 탭을 바로 편다 (시스템 알림 배너 링크) */
  (function () {
    var h = (location.hash || '').slice(1);
    var tb = h && area.querySelector('.tabs button[data-tab="' + h + '"]');
    /* ops-hand 처럼 노회 운영 안쪽 탭이면 노회 운영을 먼저 연다 (안쪽은 ops-panel 이 처리) */
    if (!tb && /^ops-/.test(h)) tb = area.querySelector('.tabs button[data-tab="mg-ops"]');
    if (tb) tb.click();
  })();

  SHSCloud.init().then(function (c) {
    db = c;
    loadNotices(); loadHero(); loadGallery();
    loadTerms();
    SHSOps.mount(document.getElementById('mg-opsbody'), user);
  });

  /* ---------- 공지사항 ---------- */
  /* ---------- 회기(會期) 설정 ----------
   * 노회는 정기회마다 회기가 바뀐다. 총대 자격처럼 회기로 정하는 일이
   * 많으므로, 회기 번호와 기간을 여기 한곳에서 정한다.
   * 목록은 읽기 전용으로 두고, 고치는 일은 팝업에서 한다. */
  function loadTerms() {
    var box = document.getElementById('mg-terms');
    if (!box) return;
    db.from('site_settings').select('value').eq('key', 'sessions').then(function (r) {
      var v = (r.data && r.data[0] && r.data[0].value) || { current: 19, list: [] };
      var list = (v.list || []).slice().sort(function (a, b) { return a.no - b.no; });

      var h = '<h2>회기 설정</h2>' +
        '<p>정기노회마다 바뀌는 회기입니다. 장로 총대 자격과 증명서 발급번호가 이 회기를 따릅니다. ' +
        '<strong>수정</strong>을 누르면 팝업에서 고칠 수 있습니다.</p>' +
        '<table class="tbl"><thead><tr><th style="width:110px">회기</th>' +
        '<th>기간</th><th style="width:110px">비고</th>' +
        '<th style="width:80px">관리</th></tr></thead><tbody>';
      if (!list.length) {
        h += '<tr><td colspan="4" style="color:var(--gray-5)">등록된 회기가 없습니다.</td></tr>';
      }
      list.forEach(function (x) {
        var isCur = Number(v.current) === Number(x.no);
        h += '<tr' + (isCur ? ' style="background:var(--gray-1,#f4f6fa)"' : '') + '>' +
          '<td><strong>제' + x.no + '회기</strong></td>' +
          '<td>' + e(x.from) + ' ~ ' + e(x.to) + '</td>' +
          '<td>' + (isCur
            ? '<span style="display:inline-block;padding:2px 9px;border:1px solid var(--navy);' +
              'border-radius:20px;font-size:0.76rem;color:var(--navy)">현재 회기</span>' : '-') + '</td>' +
          '<td><button class="btn sm" data-tmedit="' + x.no + '">수정</button></td></tr>';
      });
      h += '</tbody></table>' +
        '<p style="margin-top:10px"><button class="btn" id="tm-new">회기 추가</button></p>' +
        '<div class="form-msg" id="tm-msg"></div>';
      box.innerHTML = h;

      function save(nextList, nextCur, label) {
        nextList.sort(function (a, b) { return a.no - b.no; });
        db.from('site_settings').upsert({
          key: 'sessions',
          value: { current: Number(nextCur), list: nextList },
          updated_at: new Date().toISOString()
        }).then(function (res) {
          var msg = document.getElementById('tm-msg');
          if (res.error) { toast(msg, false, res.error.message); return; }
          SHSCloud.log('update', '회기 설정 변경', label);
          loadTerms();
        });
      }

      /* 회기 하나를 팝업에서 고치거나 새로 넣는다 */
      function openTermEdit(item) {
        var isNew = !item;
        var nextNo = list.length ? Number(list[list.length - 1].no) + 1 : 19;
        var mo = mgModal(
          '<h4 style="margin:0 0 14px">' +
          (isNew ? '회기 추가' : '제' + item.no + '회기 수정') + '</h4>' +
          '<div class="inline-form">' +
          '<div class="field" style="flex:0 0 110px"><label>회기 번호</label>' +
          '<input type="number" id="tp-no" min="1" max="99" value="' +
          (isNew ? nextNo : item.no) + '"' + (isNew ? '' : ' disabled') + '></div>' +
          '<div class="field" style="flex:0 0 170px"><label>시작</label>' +
          '<input type="date" id="tp-from" value="' + (isNew ? '' : e(item.from)) + '"></div>' +
          '<div class="field" style="flex:0 0 170px"><label>끝</label>' +
          '<input type="date" id="tp-to" value="' + (isNew ? '' : e(item.to)) + '"></div>' +
          '</div>' +
          '<label style="display:flex;align-items:center;gap:7px;margin:12px 0;font-size:0.9rem">' +
          '<input type="checkbox" id="tp-cur"' +
          (!isNew && Number(v.current) === Number(item.no) ? ' checked' : '') + '> 현재 회기로 지정</label>' +
          '<div style="display:flex;gap:8px;margin-top:14px">' +
          '<button class="btn" id="tp-save">저장</button>' +
          (isNew ? '' : '<button class="btn danger" id="tp-del">삭제</button>') +
          '</div><div class="form-msg" id="tp-msg"></div>', 520);

        mo.ov.querySelector('#tp-save').addEventListener('click', function () {
          var no = parseInt(mo.ov.querySelector('#tp-no').value, 10);
          var from = mo.ov.querySelector('#tp-from').value;
          var to = mo.ov.querySelector('#tp-to').value;
          var pmsg = mo.ov.querySelector('#tp-msg');
          if (!no || !from || !to) { toast(pmsg, false, '회기 번호와 기간을 모두 적어 주세요.'); return; }
          if (to <= from) { toast(pmsg, false, '끝 날짜가 시작보다 빠릅니다.'); return; }
          if (isNew && list.some(function (x) { return Number(x.no) === no; })) {
            toast(pmsg, false, '제' + no + '회기가 이미 있습니다. 목록의 수정을 눌러 고쳐 주세요.'); return;
          }
          var next = list.filter(function (x) { return Number(x.no) !== no; });
          next.push({ no: no, from: from, to: to });
          var cur = mo.ov.querySelector('#tp-cur').checked ? no : Number(v.current);
          mo.close();
          save(next, cur, '제' + no + '회기 ' + (isNew ? '추가' : '수정') +
            (cur === no && Number(v.current) !== no ? ' · 현재 회기로 지정' : ''));
        });
        var delBtn = mo.ov.querySelector('#tp-del');
        if (delBtn) delBtn.addEventListener('click', function () {
          if (!confirm('제' + item.no + '회기를 지우시겠습니까?')) return;
          var next = list.filter(function (x) { return Number(x.no) !== Number(item.no); });
          var cur = Number(v.current) === Number(item.no) && next.length
            ? next[next.length - 1].no : Number(v.current);
          mo.close();
          save(next, cur, '제' + item.no + '회기 삭제');
        });
      }

      box.querySelectorAll('button[data-tmedit]').forEach(function (b) {
        b.addEventListener('click', function () {
          openTermEdit(list.filter(function (x) { return String(x.no) === b.dataset.tmedit; })[0]);
        });
      });
      document.getElementById('tm-new').addEventListener('click', function () { openTermEdit(null); });
    });
  }

  /* 관리 화면 공용 수정 팝업 */
  function mgModal(inner, maxWidth) {
    var old = document.getElementById('mg-modal');
    if (old) old.remove();
    var ov = document.createElement('div');
    ov.id = 'mg-modal';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(15,25,45,.55);z-index:300;' +
      'display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto';
    ov.innerHTML = '<div style="background:#fff;border-radius:8px;max-width:' + (maxWidth || 560) +
      'px;width:100%;padding:24px 26px;box-shadow:0 10px 40px rgba(0,0,0,.25);position:relative">' +
      '<button class="mg-modal-x" aria-label="닫기" style="position:absolute;top:10px;right:14px;' +
      'border:none;background:none;font-size:1.4rem;color:var(--gray-5);cursor:pointer">&times;</button>' +
      inner + '</div>';
    document.body.appendChild(ov);
    function close() { ov.remove(); }
    ov.addEventListener('click', function (ev) { if (ev.target === ov) close(); });
    ov.querySelector('.mg-modal-x').addEventListener('click', close);
    return { ov: ov, close: close };
  }

  function loadNotices() {
    db.from('site_notices').select('*').order('date', { ascending: false }).order('id', { ascending: false })
      .then(function (r) {
        var box = document.getElementById('mg-notice');
        if (r.error) { box.innerHTML = '<div class="notice-banner">불러오기 실패: ' + e(r.error.message) + '</div>'; return; }
        var rows = r.data || [];
        var html = '<h2>공지사항 관리</h2>' +
          '<p>메인 화면과 게시판 공지사항에 표시됩니다. ' +
          '<strong>수정</strong>을 누르면 팝업에서 고칠 수 있습니다. ' +
          '<span style="color:var(--gray-5)">「일정에서 자동」 표시가 있는 공지는 <a href="schedule.html" style="text-decoration:underline">노회 일정</a>에서 고치면 함께 바뀝니다.</span></p>' +
          '<p><button class="btn" id="nt-new">새 공지 쓰기</button></p>';
        html += '<table class="tbl"><thead><tr><th style="width:70px">분류</th><th>제목</th>' +
          '<th style="width:110px">날짜</th><th style="width:80px">관리</th></tr></thead><tbody>';
        if (!rows.length) {
          html += '<tr><td colspan="4" style="color:var(--gray-5)">등록된 공지가 없습니다.</td></tr>';
        }
        rows.forEach(function (n) {
          html += '<tr><td>' + e(n.cat) + '</td><td class="left"><strong>' + e(n.title) + '</strong>' +
            (n.schedule_id ? ' <span class="role-badge" style="font-size:0.72rem;border:1px solid var(--accent);color:var(--accent);padding:0 6px;border-radius:4px">일정에서 자동</span>' : '') +
            (n.body ? '<div style="font-size:0.8rem;color:var(--gray-5);margin-top:2px">' +
              e(String(n.body).slice(0, 60)) + (String(n.body).length > 60 ? '…' : '') + '</div>' : '') +
            '</td><td>' + e(n.date) + '</td>' +
            '<td>' + (n.schedule_id
              ? '<a class="btn ghost sm" href="schedule.html">일정에서 고치기</a>'
              : '<button class="btn sm" data-ntedit="' + n.id + '">수정</button>') + '</td></tr>';
        });
        html += '</tbody></table>';
        box.innerHTML = html;

        function openNoticeEdit(n) {
          var isNew = !n;
          n = n || { cat: '공지', date: new Date().toISOString().slice(0, 10), title: '', body: '' };
          var mo = mgModal(
            '<h3 style="margin:0 0 14px;color:var(--navy)">' + (isNew ? '새 공지 쓰기' : '공지 수정') + '</h3>' +
            '<div class="inline-form">' +
            '<div class="field" style="flex:0 0 110px"><label>분류</label><select id="ntm-cat">' +
            ['공지', '안내', '소식'].map(function (c2) {
              return '<option' + (n.cat === c2 ? ' selected' : '') + '>' + c2 + '</option>';
            }).join('') + '</select></div>' +
            '<div class="field" style="flex:0 0 160px"><label>날짜</label>' +
            '<input type="date" id="ntm-date" value="' + e(n.date || '') + '"></div>' +
            '<div class="field"><label>제목</label>' +
            '<input type="text" id="ntm-title" value="' + e(n.title || '') + '"></div>' +
            '</div>' +
            '<div class="field"><label>내용</label>' +
            '<textarea id="ntm-body" rows="6">' + e(n.body || '') + '</textarea></div>' +
            '<div style="margin-top:6px"><button class="btn" id="ntm-save">저장</button> ' +
            (isNew ? '' : '<button class="btn danger" id="ntm-del" style="float:right">삭제</button>') +
            '</div><div class="form-msg" id="ntm-msg"></div>', 640);

          document.getElementById('ntm-save').addEventListener('click', function () {
            var msg = document.getElementById('ntm-msg');
            var d = {
              cat: document.getElementById('ntm-cat').value,
              date: document.getElementById('ntm-date').value,
              title: document.getElementById('ntm-title').value.trim(),
              body: document.getElementById('ntm-body').value.trim()
            };
            if (!d.title) { toast(msg, false, '제목을 입력해 주세요.'); return; }
            var op = isNew ? db.from('site_notices').insert(d)
                           : db.from('site_notices').update(d).eq('id', n.id);
            op.then(function (res) {
              if (res.error) { toast(msg, false, res.error.message); return; }
              SHSCloud.log(isNew ? 'create' : 'update', isNew ? '공지 등록' : '공지 수정', d.title);
              mo.close();
              loadNotices();
            });
          });
          var del = document.getElementById('ntm-del');
          if (del) del.addEventListener('click', function () {
            if (!confirm('공지 "' + n.title + '" 을(를) 삭제하시겠습니까?')) return;
            db.from('site_notices').delete().eq('id', n.id).then(function (res) {
              if (res.error) { alert(res.error.message); return; }
              SHSCloud.log('delete', '공지 삭제', n.title);
              mo.close();
              loadNotices();

        document.getElementById('nt-new').addEventListener('click', function () { openNoticeEdit(null); });

  /* ---------- 노회 일정 ----------
   * 날짜는 달력에서 고른다. 화면에 보이는 '10.12' 표시와 정렬 순서는 자동으로 만든다.
   * 서버에 event_date 칸이 없어도 동작하며, 있으면 실제 날짜까지 함께 담는다. */
  var schedHasDate = null;   /* null = 아직 모름 */

  function labelOf(ymd) {
    var p = String(ymd || '').split('-');
    return p.length === 3 ? (parseInt(p[1], 10) + '.' + parseInt(p[2], 10)) : '';
  }
  function sortOf(ymd) {
    return parseInt(String(ymd || '').replace(/-/g, ''), 10) || 0;
  }
  /* '3.25' 처럼 적혀 있던 예전 표시를 달력이 알아듣는 형태로 바꾼다 */
  function guessDate(row) {
    if (row.event_date) return row.event_date;
    var m = String(row.date_label || '').match(/^(\d{1,2})\.(\d{1,2})$/);
    if (!m) return '';
    var y = new Date().getFullYear();
    return y + '-' + String(m[1]).padStart(2, '0') + '-' + String(m[2]).padStart(2, '0');
  }

  /* event_date 칸이 없는 서버에서도 저장되도록 한 번 더 시도한다 */
  function saveSched(id, ymd, title) {
    var withDate = { date_label: labelOf(ymd), sort: sortOf(ymd), event_date: ymd || null };
    var plain = { date_label: labelOf(ymd), sort: sortOf(ymd) };
    if (title !== undefined) { withDate.title = title; plain.title = title; }

    function run(d) {
      return id ? db.from('site_schedule').update(d).eq('id', id)
                : db.from('site_schedule').insert(d);
    }
    if (schedHasDate === false) return run(plain);
    return run(withDate).then(function (res) {
      if (res.error && /event_date/.test(res.error.message || '')) {
        schedHasDate = false;
        return run(plain);
      }
      if (!res.error) schedHasDate = true;
      return res;
    });
  }

  function loadSchedule() {
    db.from('site_schedule').select('*').order('sort').then(function (r) {
      var box = document.getElementById('mg-schedlist');
      if (r.error) { box.innerHTML = '<div class="notice-banner">불러오기 실패: ' + e(r.error.message) + '</div>'; return; }
      var rows = r.data || [];
      if (rows.length) {
        schedHasDate = Object.prototype.hasOwnProperty.call(rows[0], 'event_date');
      }

      var html = '<h2>노회 일정 관리</h2>' +
        '<p>메인 화면 오른쪽 "노회 일정"에 표시됩니다. ' +
        '<strong>10.12</strong> 같은 표시와 정렬은 날짜에서 저절로 만들어집니다.</p>' +
        '<p><button class="btn" id="sc-new">일정 추가</button></p>';
      html += '<table class="tbl" style="max-width:820px"><thead><tr>' +
        '<th style="width:80px">표시</th><th style="width:130px">날짜</th>' +
        '<th>내용</th><th style="width:80px">관리</th></tr></thead><tbody>';
      if (!rows.length) {
        html += '<tr><td colspan="4" style="color:var(--gray-5)">등록된 일정이 없습니다.</td></tr>';
      }
      rows.forEach(function (s2) {
        html += '<tr><td><strong>' + e(s2.date_label) + '</strong></td>' +
          '<td>' + e(guessDate(s2) || '-') + '</td>' +
          '<td class="left">' + e(s2.title) + '</td>' +
          '<td><button class="btn sm" data-scedit="' + s2.id + '">수정</button></td></tr>';
      });
      html += '</tbody></table>';
      box.innerHTML = html;

      function openSchedEdit(s2) {
        var isNew = !s2;
        s2 = s2 || { title: '', id: null };
        var mo = mgModal(
          '<h3 style="margin:0 0 14px;color:var(--navy)">' + (isNew ? '일정 추가' : '일정 수정') + '</h3>' +
          '<div class="inline-form">' +
          '<div class="field" style="flex:0 0 180px"><label>날짜</label>' +
          '<input type="date" id="scm-date" value="' + e(isNew ? '' : guessDate(s2)) + '"></div>' +
          '<div class="field"><label>내용</label>' +
          '<input type="text" id="scm-title" value="' + e(s2.title || '') +
          '" placeholder="예: 제19회기 가을 정기노회 (○○교회)"></div>' +
          '</div>' +
          '<div style="margin-top:6px"><button class="btn" id="scm-save">저장</button> ' +
          (isNew ? '' : '<button class="btn danger" id="scm-del" style="float:right">삭제</button>') +
          '</div><div class="form-msg" id="scm-msg"></div>');

        document.getElementById('scm-save').addEventListener('click', function () {
          var msg = document.getElementById('scm-msg');
          var ymd = document.getElementById('scm-date').value;
          var title = document.getElementById('scm-title').value.trim();
          if (!ymd || !title) { toast(msg, false, '날짜와 내용을 입력해 주세요.'); return; }
          saveSched(isNew ? null : s2.id, ymd, title).then(function (res) {
            if (res && res.error) { toast(msg, false, res.error.message); return; }
            SHSCloud.log(isNew ? 'create' : 'update', isNew ? '일정 추가' : '일정 수정',
              labelOf(ymd) + ' ' + title);
            mo.close();
            loadSchedule();
          });
        });
        var del = document.getElementById('scm-del');
        if (del) del.addEventListener('click', function () {
          if (!confirm('일정 "' + s2.title + '" 을(를) 삭제하시겠습니까?')) return;
          db.from('site_schedule').delete().eq('id', s2.id).then(function (res) {
            if (res.error) { alert(res.error.message); return; }
            SHSCloud.log('delete', '일정 삭제', s2.title);
            mo.close();
            loadSchedule();
          });
        });
      }

      document.getElementById('sc-new').addEventListener('click', function () { openSchedEdit(null); });
      box.querySelectorAll('button[data-scedit]').forEach(function (b) {
        b.addEventListener('click', function () {
          var s3 = rows.filter(function (x) { return String(x.id) === b.dataset.scedit; })[0];
          if (s3) openSchedEdit(s3);
        });
      });
    });
  }

  /* ---------- 메인 화면 (히어로) ---------- */
  function loadHero() {
    db.from('site_settings').select('*').eq('key', 'hero').then(function (r) {
      var box = document.getElementById('mg-hero');
      if (r.error) { box.innerHTML = '<div class="notice-banner">불러오기 실패: ' + e(r.error.message) + '</div>'; return; }
      var hero = {};
      (r.data || []).forEach(function (row) { if (row.key === 'hero') hero = row.value || {}; });
      box.innerHTML = '<h2>메인 큰 문구 (히어로)</h2>' +
        '<div class="admin-card" style="max-width:760px;margin-bottom:24px">' +
        '<div class="field"><label>작은 윗줄</label><input type="text" id="h-kicker" value="' + e(hero.kicker || '') + '"></div>' +
        '<div class="field"><label>큰 제목 1줄</label><input type="text" id="h-line1" value="' + e(hero.line1 || '') + '"></div>' +
        '<div class="field"><label>큰 제목 2줄</label><input type="text" id="h-line2" value="' + e(hero.line2 || '') + '"></div>' +
        '<div class="field"><label>설명 문장</label><textarea id="h-desc" rows="3">' + e(hero.desc || '') + '</textarea></div>' +
        '<div class="field"><label>말씀 구절</label><input type="text" id="h-verse" value="' + e(hero.verse || '') + '"></div>' +
        '<button class="btn" id="h-save">저장</button><div class="form-msg" id="h-msg"></div></div>';

      document.getElementById('h-save').addEventListener('click', function () {
        var v = {
          kicker: document.getElementById('h-kicker').value.trim(),
          line1: document.getElementById('h-line1').value.trim(),
          line2: document.getElementById('h-line2').value.trim(),
          desc: document.getElementById('h-desc').value.trim(),
          verse: document.getElementById('h-verse').value.trim()
        };
        db.from('site_settings').upsert({ key: 'hero', value: v, updated_at: new Date().toISOString() })
          .then(function (res) {
            var msg = document.getElementById('h-msg');
            if (res.error) { toast(msg, false, res.error.message); return; }
            SHSCloud.log('update', '메인 문구 수정', v.line1);
            toast(msg, true, '저장되었습니다. 메인 화면에 반영됩니다.');
          });
      });
    });
  }

  /* ---------- 갤러리 ---------- */
  function resizeImage(file, maxW, quality) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        var w = img.width, h = img.height;
        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        cv.toBlob(function (blob) {
          if (blob) resolve(blob); else reject(new Error('이미지 변환 실패'));
        }, 'image/jpeg', quality);
      };
      img.onerror = function () { reject(new Error('이미지를 읽을 수 없습니다.')); };
      img.src = URL.createObjectURL(file);
    });
  }

  function loadGallery() {
    db.from('gallery_items').select('*').order('sort').order('id').then(function (r) {
      var box = document.getElementById('mg-gallery');
      if (r.error) { box.innerHTML = '<div class="notice-banner">불러오기 실패: ' + e(r.error.message) + '</div>'; return; }
      var html = '<h2>갤러리 관리</h2>';
      html += '<div class="admin-card" style="margin-bottom:16px">' +
        '<h3 style="margin-top:0">사진 올리기</h3>' +
        '<div class="inline-form" style="margin-bottom:8px">' +
        '<div class="field"><label>사진 파일 (여러 장 선택 가능)</label><input type="file" id="gl-file" accept="image/*" multiple></div>' +
        '<div class="field"><label>행사명</label><input type="text" id="gl-title" placeholder="예: 2026 가을 정기노회"></div>' +
        '<div class="field" style="flex:0 0 140px"><label>시기</label><input type="text" id="gl-date" placeholder="예: 2026년 10월"></div>' +
        '<button class="btn" id="gl-up">올리기</button>' +
        '</div><div class="form-msg" id="gl-msg"></div></div>';
      html += '<div class="gallery-grid">';
      (r.data || []).forEach(function (g) {
        html += '<figure><a><img src="' + e(g.thumb_url) + '" loading="lazy"></a>' +
          '<figcaption><div class="g-title">' + e(g.title) + '</div><div class="g-date">' + e(g.taken || '') + '</div>' +
          '<button class="btn danger sm" style="margin-top:8px" data-gldel="' + g.id + '" data-glt="' + e(g.title) + '" data-glf="' + e(g.image_url || '') + '" data-glth="' + e(g.thumb_url || '') + '">삭제</button>' +
          '</figcaption></figure>';
      });
      html += '</div>';
      box.innerHTML = html;
      SHS.dropZone(document.getElementById('gl-file'), { what: '사진', accept: 'image' });

      document.getElementById('gl-up').addEventListener('click', function () {
        var msg = document.getElementById('gl-msg');
        var files = document.getElementById('gl-file').files;
        var title = document.getElementById('gl-title').value.trim();
        var taken = document.getElementById('gl-date').value.trim();
        if (!files.length) { toast(msg, false, '사진 파일을 선택해 주세요.'); return; }
        if (!title) { toast(msg, false, '행사명을 입력해 주세요.'); return; }
        toast(msg, true, '올리는 중입니다... (' + files.length + '장)');

        var chain = Promise.resolve();
        Array.prototype.forEach.call(files, function (f, idx) {
          chain = chain.then(function () {
            return Promise.all([resizeImage(f, 1400, 0.8), resizeImage(f, 520, 0.72)])
              .then(function (blobs) { return SHSPhotos.putPair(blobs[0], blobs[1]); })
              .then(function (u) {
                return db.from('gallery_items').insert({
                  title: title, taken: taken, image_url: u.full, thumb_url: u.thumb, sort: 0
                });
              })
              .then(function (r3) { if (r3.error) throw r3.error; });
          });
        });
        chain.then(function () {
          SHSCloud.log('create', '갤러리 사진 등록', title + ' ' + files.length + '장');
          loadGallery();
        }).catch(function (err) {
          toast(msg, false, '올리기 실패: ' + err.message);
        });
      });

      box.querySelectorAll('button[data-gldel]').forEach(function (b) {
        b.addEventListener('click', function () {
          if (!confirm('이 사진을 삭제하시겠습니까?')) return;
          db.from('gallery_items').delete().eq('id', b.dataset.gldel).then(function (res) {
            if (res.error) { alert(res.error.message); return; }
            return Promise.all([
              SHSPhotos.remove(b.dataset.glf),
              SHSPhotos.remove(b.dataset.glth)
            ]).then(function () {
              SHSCloud.log('delete', '갤러리 사진 삭제', b.dataset.glt);
              loadGallery();
            });
          });
        });
      });
    });
  }
 });
