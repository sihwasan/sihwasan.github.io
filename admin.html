<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원 관리 - 시화산노회</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page-head">
  <div class="container">
    <h1>회원 관리</h1>
    <div class="crumb">홈 &gt; 임원방 &gt; 회원 관리</div>
  </div>
</div>

<main class="page-body container" id="main">
  <div id="admin-area"><p style="color:var(--gray-5)">불러오는 중...</p></div>
</main>

<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-auth.js"></script>
<script src="js/main.js"></script>
<script src="js/name-picker.js"></script>
<script src="js/dashboard.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
 SHS.getUser().then(function (user) {
  var area = document.getElementById('admin-area');
  var e = SHS.esc;

  if (!user || !SHSAuth.canManageMembers(user)) {
    area.innerHTML =
      '<div class="notice-banner">회원 관리는 <strong>관리자 등급</strong>이 이용할 수 있습니다.' +
      (user ? ' 현재 등급(' + SHS.displayRole(user.role, user.title) + ')으로는 이용할 수 없습니다.'
            : ' <a class="btn sm" style="margin-left:10px" href="login.html">로그인</a>') +
      '</div>';
    return;
  }

  var isSuper = SHSAuth.canAssignRoles(user);
  var canApprove = SHSAuth.canApproveMembers(user);
  /* 등급 임명 권한: 노회장(서기·간사 등)과 운영자 계정(비상시 전체) */
  var canAppoint = isSuper || user.role === 'president';

  function renderCloud() {
    SHSCloud.init().then(function (c) {
      return c.from('profiles').select('*').order('created_at');
    }).then(function (r) {
      if (r.error) {
        area.innerHTML = '<div class="notice-banner">회원 목록을 불러오지 못했습니다: ' + e(r.error.message) + '</div>';
        return;
      }
      var rows = r.data || [];
      /* 운영자 계정은 회원 목록에 표시하지 않는다 */
      var visible = rows.filter(function (p) { return p.role !== 'superadmin'; });
      var pendings = visible.filter(function (p) { return p.role === 'pending'; });

      var html = '';
      html += '<div class="notice-banner">서버에 등록된 실제 회원 목록입니다. ' +
        '승인대기 회원의 정회원 설정과 회원명단 관리 권한: <strong>관리자 (노회장, 서기, 간사)</strong></div>';

      if (pendings.length) {
        html += '<h2>승인대기 회원</h2>';
        html += '<p>가입 시 입력한 이름과 소속 교회가 노회 명단과 일치하지 않은 회원입니다. 확인 후 정회원으로 설정해 주세요.</p>';
        html += '<table class="tbl"><thead><tr><th>이메일</th><th>성명</th><th>직분</th><th>소속 교회</th><th style="width:130px">처리</th></tr></thead><tbody>';
        pendings.forEach(function (p) {
          html += '<tr><td class="left">' + e(p.email) + '</td><td>' + e(p.name || '-') + '</td>' +
            '<td>' + e(p.position || '-') + '</td><td>' + e(p.church || '-') + '</td>' +
            '<td>' + (canApprove ? '<button class="btn sm" data-capprove="' + e(p.id) + '">정회원 설정</button>' : '승인 권한 없음') + '</td></tr>';
        });
        html += '</tbody></table>';
      }

      html += '<h2>회원 목록 (' + visible.length + '명)</h2>';
      html += '<div class="notice-banner">개인정보(생년월일·연락처·주소)는 <strong>**</strong>로 가려서 표시됩니다. ' +
        '<strong>열람</strong>을 누르면 내용이 표시되며, <strong>열람 기록은 감사 기록에 남습니다.</strong></div>';
      html += '<table class="tbl"><thead><tr><th>이메일</th><th>성명</th><th>직분</th><th>소속</th>' +
        '<th style="width:150px">개인정보</th><th style="width:185px">정년 (만 70세)</th>' +
        '<th style="width:150px">남은 임기</th><th>등급</th>' +
        '<th style="width:110px">자격</th>' +
        (canAppoint ? '<th style="width:200px">등급 임명</th>' : '') + '</tr></thead><tbody>';
      visible.forEach(function (p) {
        var cur = gradeValue(p);
        var issue = SHS.membershipIssue(p);
        var expired = p.role === 'member' && issue && !p.suspended && issue.indexOf('승인대기') === -1;
        html += '<tr><td class="left">' + e(p.email) + '</td><td>' + e(p.name || '-') + '</td>' +
          '<td>' + e(p.position || '-') + '</td><td>' + e(p.church || '-') + '</td>' +
          /* 개인정보: 가려서 표시하고 열람 버튼 제공 */
          '<td><span id="pi-' + e(p.id) + '">**</span><br>' +
          '<button class="btn ghost sm" data-piview="' + e(p.id) + '" style="margin-top:4px">열람</button></td>' +
          '<td style="font-size:0.82rem">' +
          '<input type="date" data-birth="' + e(p.id) + '" value="' + e(p.birth_date || '') + '" ' +
          'style="font-size:0.82rem;padding:4px 6px">' +
          '<div style="margin-top:3px">' +
          (SHS.retireDate(p.birth_date) && SHS.retireDate(p.birth_date) <= new Date()
            ? '<span class="fail">' + e(SHS.retireLabel(p)) + '</span>'
            : e(SHS.retireLabel(p))) + '</div></td>' +
          '<td style="font-size:0.82rem">' + e(SHS.termLabel(p)) + '</td>' +
          '<td><span class="role-badge">' + SHS.displayRole(p.role, p.title) + '</span>' +
          (p.title ? '<div style="font-size:0.75rem;color:var(--gray-5);margin-top:2px">' + e(p.title) + '</div>' : '') + '</td>' +
          '<td>' +
          (p.suspended
            ? '<div style="color:var(--red);font-size:0.8rem;margin-bottom:4px">정지됨</div>' +
              '<button class="btn ghost sm" data-cresume="' + e(p.id) + '" data-cname="' + e(p.name || '') + '">해제</button>'
            : (expired
                ? '<div style="color:var(--red);font-size:0.78rem">' + e(issue) + '</div>'
                : '<button class="btn danger sm" data-csuspend="' + e(p.id) + '" data-cname="' + e(p.name || '') + '">정지</button>')) +
          '</td>';
        if (canAppoint) {
          html += '<td><select data-crole="' + e(p.id) + '">' +
            assignable().map(function (g) {
              return '<option value="' + g.v + '"' + (cur === g.v ? ' selected' : '') + '>' + g.t + '</option>';
            }).join('') +
            '</select> <button class="btn sm" data-cassign="' + e(p.id) + '">임명</button></td>';
        }
        html += '</tr>';
      });
      html += '</tbody></table>';
      html += '<p style="font-size:0.82rem;color:var(--gray-5)">' +
        '· 총회 정년은 만 70세이며, <strong>정년이 지나면 등급과 상관없이 정회원 자격이 상실</strong>됩니다. ' +
        '정회원 전용 자료도 열람할 수 없습니다.<br>' +
        '· 생년월일이 없으면 정년을 계산할 수 없습니다. ' +
        '<strong>정년 칸의 날짜를 고치시면 관리자가 대신 입력</strong>할 수 있고, 곧바로 저장됩니다. ' +
        '입력 기록은 감사 기록에 남습니다.<br>' +
        '· 장로 총대는 다음 봄 정기노회까지 자격이 유지되며, 총대로 다시 등록되지 않으면 자격이 상실됩니다. ' +
        '아래 <strong>총대 자격 기간 일괄 설정</strong>으로 만료일을 지정할 수 있습니다.<br>' +
        '· 계정 삭제는 회원 본인이 내 정보에서 탈퇴하거나, 노회 사무실에서 처리합니다.</p>';

      /* 총대 자격 기간 일괄 설정 */
      var nextSpring = SHS.nthMonday(new Date().getFullYear() + (new Date().getMonth() >= 3 ? 1 : 0), 4, 2);
      var nsStr = nextSpring.toISOString().slice(0, 10);
      html += '<div class="admin-card" style="max-width:760px"><h3 style="margin-top:0">총대 자격 기간 일괄 설정</h3>' +
        '<p style="font-size:0.86rem;color:var(--gray-7)">장로 총대의 자격 만료일을 한 번에 지정합니다. ' +
        '기본값은 다음 봄 정기노회일입니다. 만료일이 지나면 정회원 자격이 자동으로 상실됩니다.</p>' +
        '<div class="inline-form">' +
        '<div class="field" style="flex:0 0 180px"><label>만료일</label><input type="date" id="mu-date" value="' + nsStr + '"></div>' +
        '<div class="field" style="flex:0 0 160px"><label>대상 직분</label><select id="mu-pos"><option value="장로">장로</option><option value="">전체 정회원</option></select></div>' +
        '<button class="btn" id="mu-apply">일괄 적용</button>' +
        '</div><div class="form-msg" id="mu-msg"></div></div>';

      /* 노회 명단·상비부 관리 영역 */
      html += '<h2>노회 명단 관리</h2>';
      html += '<p>가입 시 등급 자동 부여의 기준이 되는 명단입니다. 성명과 소속 교회가 이 명단과 일치하면 해당 등급이 자동으로 부여됩니다.</p>';
      html += '<div id="roster-area"><p style="color:var(--gray-5)">명단을 불러오는 중...</p></div>';
      html += '<h2>장로 총대 자격</h2>';
      html += '<div id="elder-area"><p style="color:var(--gray-5)">장로 총대를 불러오는 중...</p></div>';
      html += '<h2>총회 총대</h2>';
      html += '<div id="delegate-area"><p style="color:var(--gray-5)">총대 명단을 불러오는 중...</p></div>';
      html += '<h2>이사 관리</h2>';
      html += '<div id="board-area"><p style="color:var(--gray-5)">이사 명단을 불러오는 중...</p></div>';
      html += '<h2>시찰회 관리</h2>';
      html += '<div id="sichal-area"><p style="color:var(--gray-5)">시찰 정보를 불러오는 중...</p></div>';
      html += '<h2>상비부 배정 관리</h2>';
      html += '<div id="committee-area"><p style="color:var(--gray-5)">상비부 정보를 불러오는 중...</p></div>';
      /* 상비부 대시보드는 예전에 따로 있던 화면이었으나 여기 탭으로 들어왔다.
       * 그리는 일은 js/dashboard.js 한 곳에 있으므로 상비부 대시보드 화면과
       * 늘 같은 모습이다. */
      html += '<h2>상비부 대시보드</h2>';
      html += '<div id="db-panel"><p style="color:var(--gray-5)">상비부 대시보드를 불러오는 중...</p></div>';

      area.innerHTML = html;
      SHS.sectionize(area);
      SHSDash.mount(document.getElementById('db-panel'), user);
      renderRoster();
      renderElders();
      renderDelegates();
      renderBoards();
      renderSichals();
      renderCommittees();

      function updateRole(id, grade, label) {
        var g = parseGrade(grade);
        SHSCloud.init().then(function (c) {
          return c.rpc('set_member_role', { p_id: id, p_role: g.role, p_title: g.title });
        }).then(function (res) {
          if (res.error) { alert('처리하지 못했습니다: ' + res.error.message); return; }
          SHSCloud.log('update', label, '대상 ' + id + ' → ' + gradeLabel(grade));
          alert('처리되었습니다.');
          renderCloud();
        });
      }

      area.querySelectorAll('button[data-capprove]').forEach(function (b) {
        b.addEventListener('click', function () {
          if (!confirm('이 회원을 정회원으로 설정하시겠습니까?')) return;
          SHSCloud.init().then(function (c) {
            return c.rpc('approve_member', { p_id: b.dataset.capprove });
          }).then(function (res) {
            if (res.error) { alert('처리하지 못했습니다: ' + res.error.message); return; }
            SHSCloud.log('update', '정회원 승인', '대상 ' + b.dataset.capprove);
            renderCloud();
          });
        });
      });
      area.querySelectorAll('button[data-cassign]').forEach(function (b) {
        b.addEventListener('click', function () {
          var sel = area.querySelector('select[data-crole="' + b.dataset.cassign + '"]');
          if (!confirm('등급을 ' + gradeLabel(sel.value) + '(으)로 임명하시겠습니까?')) return;
          updateRole(b.dataset.cassign, sel.value, '등급 변경');
        });
      });

      /* 개인정보 열람 (열람 기록을 감사 기록에 남긴다) */
      /* 관리자가 생년월일을 대신 입력할 수 있다. 고치면 바로 저장된다. */
      area.querySelectorAll('input[data-birth]').forEach(function (inp) {
        inp.addEventListener('change', function () {
          var id = inp.dataset.birth;
          var p = rows.filter(function (x) { return String(x.id) === id; })[0];
          var v = inp.value || null;
          SHSCloud.init().then(function (c) {
            return c.from('profiles').update({ birth_date: v }).eq('id', id);
          }).then(function (res) {
            if (res.error) { alert('저장하지 못했습니다: ' + res.error.message); return; }
            SHSCloud.log('update', '생년월일 입력', (p ? p.name : id) + ' → ' + (v || '(지움)'));
            renderCloud();
          });
        });
      });

      area.querySelectorAll('button[data-piview]').forEach(function (b) {
        b.addEventListener('click', function () {
          var id = b.dataset.piview;
          var p = rows.filter(function (x) { return String(x.id) === id; })[0];
          if (!p) return;
          if (!confirm('개인정보를 열람하시겠습니까?\n열람 기록이 감사 기록에 남습니다.')) return;
          var span = document.getElementById('pi-' + id);
          span.innerHTML =
            '<span style="font-size:0.82rem">' +
            '생년월일 ' + e(p.birth_date || '-') + '<br>' +
            '연락처 ' + e(p.phone || '-') + '<br>' +
            '주소 ' + e(p.address || '-') + '</span>';
          b.remove();
          SHSCloud.log('view', '개인정보 열람',
            (p.name || p.email) + ' — 생년월일·연락처·주소 열람');
        });
      });

      /* 정회원 자격 정지 / 해제 */
      function setSuspended(id, name, val) {
        SHSCloud.init().then(function (c) {
          return c.from('profiles').update({ suspended: val, updated_at: new Date().toISOString() }).eq('id', id);
        }).then(function (res) {
          if (res.error) { alert('처리하지 못했습니다: ' + res.error.message); return; }
          SHSCloud.log('update', val ? '정회원 자격 정지' : '정회원 자격 해제', name || id);
          renderCloud();
        });
      }
      area.querySelectorAll('button[data-csuspend]').forEach(function (b) {
        b.addEventListener('click', function () {
          if (!confirm('"' + b.dataset.cname + '" 님의 정회원 자격을 정지하시겠습니까?\n' +
                       '정지되면 정회원 전용 자료를 열람할 수 없습니다.')) return;
          setSuspended(b.dataset.csuspend, b.dataset.cname, true);
        });
      });
      area.querySelectorAll('button[data-cresume]').forEach(function (b) {
        b.addEventListener('click', function () {
          if (!confirm('"' + b.dataset.cname + '" 님의 정회원 자격 정지를 해제하시겠습니까?')) return;
          setSuspended(b.dataset.cresume, b.dataset.cname, false);
        });
      });

      /* 총대 자격 기간 일괄 설정 */
      var muBtn = document.getElementById('mu-apply');
      if (muBtn) muBtn.addEventListener('click', function () {
        var msg = document.getElementById('mu-msg');
        var until = document.getElementById('mu-date').value;
        var pos = document.getElementById('mu-pos').value;
        if (!until) { msg.className = 'form-msg err'; msg.textContent = '만료일을 선택해 주세요.'; return; }
        if (!confirm((pos ? pos + ' 직분' : '전체 정회원') + '의 자격 만료일을 ' + until + '로 설정하시겠습니까?')) return;
        SHSCloud.init().then(function (c) {
          var q = c.from('profiles').update({ member_until: until, updated_at: new Date().toISOString() })
            .eq('role', 'member');
          if (pos) q = q.eq('position', pos);
          return q;
        }).then(function (res) {
          if (res.error) { msg.className = 'form-msg err'; msg.textContent = res.error.message; return; }
          SHSCloud.log('update', '총대 자격 기간 설정', (pos || '전체 정회원') + ' → ' + until);
          msg.className = 'form-msg ok';
          msg.textContent = '설정되었습니다.';
          renderCloud();
        });
      });
    });
  }

  /* ---------- 등급·직책 체계 ----------
   * 노회 임원 직책: 회록부서기, 회록서기, 부서기, 서기, 부회계, 회계,
   *                부노회장, (장로)부노회장, 노회장  (그 외: 간사, 정회원, 승인대기)
   * 서기·노회장·간사는 홈페이지 관리 권한을 함께 갖는다. */
  var GRADES = [
    { v: 'pending', t: '승인대기', role: 'pending', title: null },
    /* 총회 정년(만 70세)이 지나면 정회원이 아니라 일반회원이 된다 */
    { v: 'general', t: '일반회원', role: 'general', title: null },
    { v: 'member', t: '정회원', role: 'member', title: null },
    { v: 'staff', t: '간사', role: 'staff', title: '간사' },
    { v: 'officer:회록부서기', t: '회록부서기', role: 'officer', title: '회록부서기' },
    { v: 'officer:회록서기', t: '회록서기', role: 'officer', title: '회록서기' },
    { v: 'officer:부서기', t: '부서기', role: 'officer', title: '부서기' },
    { v: 'clerk', t: '서기', role: 'clerk', title: '서기' },
    { v: 'officer:부회계', t: '부회계', role: 'officer', title: '부회계' },
    { v: 'officer:회계', t: '회계', role: 'officer', title: '회계' },
    { v: 'officer:부노회장', t: '부노회장', role: 'officer', title: '부노회장' },
    { v: 'officer:(장로)부노회장', t: '(장로)부노회장', role: 'officer', title: '(장로)부노회장' },
    { v: 'president', t: '노회장', role: 'president', title: '노회장' }
  ];
  function parseGrade(v) {
    for (var i = 0; i < GRADES.length; i++) if (GRADES[i].v === v) return GRADES[i];
    return { role: v, title: null };
  }
  function gradeLabel(v) {
    var g = parseGrade(v);
    return g.t || v;
  }
  function gradeValue(p) {
    if (p.role === 'officer' && p.title) return 'officer:' + p.title;
    return p.role;
  }

  /* 임명할 수 있는 등급 목록
   * · 노회장    : 서기·간사 등 관리자와 임원 직책 (노회장 등급은 권한 이양으로만)
   * · 운영자 계정 : 비상시 노회장을 포함해 전부 */
  function assignable() {
    if (isSuper) return GRADES;
    return GRADES.filter(function (g) { return g.role !== 'president' && g.role !== 'superadmin'; });
  }

  /* ---------- 노회 명단 관리 (추가·수정·삭제) ---------- */
  var ROSTER_ROLES = { member: '정회원', general: '일반회원', officer: '임원',
                       president: '노회장', clerk: '서기', staff: '간사', pending: '승인대기' };

  /* 정년(만 70세)이 지났는가 — SHS 의 판정을 그대로 쓴다 */
  function overAge(birth) {
    var rd = SHS.retireDate(birth);
    return !!(rd && rd <= new Date());
  }
  /* 명단 한 줄의 등급 고르개 값.
   * 총회 정년(만 70세)이 지난 분은 정회원·임원 대신 일반회원으로 보여 준다. */
  function rosterGrade(m) {
    var v = (m.role === 'officer' && m.officer_title) ? 'officer:' + m.officer_title
                                                      : (m.role || 'member');
    if (overAge(m.birth_date) && ['member', 'officer'].indexOf(parseGrade(v).role) !== -1) {
      return 'general';
    }
    return v;
  }
  function gradeOptions(v) {
    return assignable().map(function (g) {
      return '<option value="' + g.v + '"' + (g.v === v ? ' selected' : '') + '>' + e(g.t) + '</option>';
    }).join('');
  }

  /* 직분 — 예전의 <직분>과 <조직 분류>를 하나로 합쳤다.
   * 노회 사무실 간사는 <직원>으로 둔다. */
  var CATEGORIES = ['목사', '부목사', '원로목사', '은퇴목사', '무임목사', '장로', '직원'];

  /* 시무 교회가 없는 분류는 교회 칸을 비우면 이 말이 대신 들어간다.
   * (명단은 교회 칸을 비워 둘 수 없으므로 상태를 적어 둔다) */
  var NO_CHURCH = { '무임목사': '무임', '은퇴목사': '은퇴', '원로목사': '원로',
                    '직원': '노회 사무실' };

  /* 직원(간사)은 노회 사무실 일을 맡으므로 관리자 등급을 함께 갖는다 */
  var AUTO_GRADE = { '직원': 'staff' };
  function churchFor(church, category) {
    if (church) return church;
    return NO_CHURCH[category] || '';
  }

  var rosterFlash = '';   /* 저장 뒤 다시 그려도 남겨 둘 알림말 */

  function renderRoster() {
    var box = document.getElementById('roster-area');
    Promise.all([
      SHSCloud.init().then(function (c) { return c.from('roster').select('*').order('sort').order('id'); }),
      SHSCloud.init().then(function (c) { return c.from('sichals').select('name').order('sort'); })
    ]).then(function (rs) {
      var r = rs[0];
      if (r.error) {
        box.innerHTML = '<div class="notice-banner">명단을 불러오지 못했습니다: ' + e(r.error.message) + '</div>';
        return;
      }
      var rows = r.data || [];
      var sichalNames = ((rs[1] && rs[1].data) || []).map(function (x) { return x.name; });
      var hasOrg = rows.filter(function (m) { return m.category; }).length > 0;

      function catOptions(v) {
        return '<option value="">— 없음 —</option>' + CATEGORIES.map(function (x) {
          return '<option' + (x === v ? ' selected' : '') + '>' + e(x) + '</option>';
        }).join('');
      }
      function sichalOptions(v) {
        return '<option value="">— 없음 —</option>' + sichalNames.map(function (x) {
          return '<option' + (x === v ? ' selected' : '') + '>' + e(x) + '</option>';
        }).join('');
      }

      var html = '';
      html += '<div class="notice-banner">여기서 고친 내용은 <strong>조직 페이지의 회원명단</strong>에 바로 반영됩니다. ' +
        '<strong>직분</strong>을 정해 주셔야 조직 페이지에 나타납니다. ' +
        '시무 교회를 사임하신 분은 직분을 <strong>무임목사·은퇴목사·원로목사</strong>로 바꾸시면 ' +
        '교회 칸을 비워 두셔도 저장됩니다. 노회 사무실 간사는 <strong>직원</strong>으로 두십니다. ' +
        '<a href="organization.html" target="_blank" style="color:var(--navy);text-decoration:underline">조직 페이지 보기</a></div>';
      if (!hasOrg) {
        html += '<div class="notice-banner">아직 조직 분류가 채워지지 않았습니다. ' +
          'supabase/16_organization.sql 을 실행하시면 지금 조직 페이지에 실려 있는 명단이 그대로 채워집니다.</div>';
      }

      /* 새 회원 추가 */
      html += '<p style="font-size:0.86rem;color:var(--gray-7)">' +
        '회원을 새로 넣거나 직분을 바꾸시면 <strong>그 직위 무리의 맨 뒤로 자동으로 들어갑니다.</strong> ' +
        '예를 들어 새로 부임하신 목사는 마지막 목사 다음에 놓입니다.<br>' +
        '순서 : 목사 → 부목사 → 원로목사 → 은퇴목사 → 무임목사 → 장로 → 직원</p>';
      html += '<p><button class="btn ghost" id="ro-order">명단 순서 다시 정리</button> ' +
        '<span style="font-size:0.84rem;color:var(--gray-5);margin-left:8px">' +
        '직위 순서가 흐트러졌을 때만 누르시면 됩니다. ' +
        '같은 직위 안에서는 <strong>지금 순서를 그대로</strong> 지킵니다.</span>' +
        '<span class="form-msg" id="ro-ordmsg" style="display:inline-block;margin-left:10px"></span></p>';

      html += '<div class="admin-card" style="margin-bottom:16px"><h3 style="margin-top:0">명단에 추가</h3>' +
        '<div class="inline-form">' +
        '<div class="field" style="flex:0 0 120px"><label>성명</label><input type="text" id="ro-name"></div>' +
        '<div class="field"><label>소속 교회</label><input type="text" id="ro-church"></div>' +
        '<div class="field" style="flex:0 0 130px"><label>직분</label><select id="ro-cat">' +
        catOptions('목사') + '</select></div>' +
        '<div class="field" style="flex:0 0 150px"><label>생년월일</label>' +
        '<input type="date" id="ro-birth"></div>' +
        '<div class="field" style="flex:0 0 130px"><label>시찰</label><select id="ro-sichal">' + sichalOptions('') + '</select></div>' +
        '<div class="field" style="flex:0 0 160px"><label>부여 등급</label><select id="ro-grade">' +
        GRADES.filter(function (g) { return g.v !== 'pending'; }).map(function (g) {
          return '<option value="' + g.v + '"' + (g.v === 'member' ? ' selected' : '') + '>' + g.t + '</option>';
        }).join('') + '</select></div>' +
        '<button class="btn" id="ro-add">추가</button>' +
        '</div><div class="form-msg" id="ro-msg"></div></div>';

      /* 명단 조회 */
      html += '<div class="inline-form" style="margin-bottom:12px">' +
        '<div class="field" style="flex:1 1 240px"><label for="ro-q">명단 조회</label>' +
        '<input type="search" id="ro-q" placeholder="성명·교회·시찰로 찾기"></div>' +
        '<div class="field" style="flex:0 0 150px"><label for="ro-fcat">직분</label>' +
        '<select id="ro-fcat"><option value="">직분 전체</option>' +
        CATEGORIES.map(function (x) { return '<option>' + e(x) + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="field" style="flex:0 0 160px"><label for="ro-fgrade">부여 등급</label>' +
        '<select id="ro-fgrade"><option value="">등급 전체</option>' +
        GRADES.map(function (g) { return '<option value="' + g.v + '">' + e(g.t) + '</option>'; }).join('') +
        '</select></div>' +
        '<button class="btn ghost" id="ro-qclear">지우기</button>' +
        '</div>';

      /* 명단 표 (그 자리에서 고칠 수 있다) */
      html += '<table class="tbl" id="ro-tbl"><thead><tr><th style="width:50px">번호</th><th style="width:110px">성명</th>' +
        '<th>소속 교회</th><th style="width:130px">직분</th><th style="width:150px">생년월일</th>' +
        '<th style="width:120px">시찰</th><th style="width:120px">비고</th>' +
        '<th style="width:150px">부여 등급</th><th style="width:120px">관리</th></tr></thead><tbody>';
      rows.forEach(function (m, i) {
        var old70 = overAge(m.birth_date);
        html += '<tr data-ro="' + m.id + '" data-find="' +
          e([m.name, m.church, m.category, m.sichal, m.note].filter(Boolean).join(' ')) + '"' +
          ' data-cat="' + e(m.category || '') + '" data-grade="' + e(rosterGrade(m)) + '">' +
          '<td class="ro-no">' + (i + 1) + '</td>' +
          '<td><input type="text" data-rf="name" value="' + e(m.name) + '"></td>' +
          '<td><input type="text" data-rf="church" value="' + e(m.church) + '"></td>' +
          '<td><select data-rf="category">' + catOptions(m.category || '') + '</select></td>' +
          '<td><input type="date" data-rf="birth_date" value="' + e(m.birth_date || '') + '">' +
          (old70 ? '<div class="ro-hint">정년 경과</div>' : '') + '</td>' +
          '<td><select data-rf="sichal">' + sichalOptions(m.sichal || '') + '</select></td>' +
          '<td><input type="text" data-rf="note" value="' + e(m.note || '') + '" placeholder="추대일 등"></td>' +
          '<td><select data-rf="grade">' + gradeOptions(rosterGrade(m)) + '</select></td>' +
          '<td><button class="btn sm" data-rosave="' + m.id + '">저장</button> ' +
          '<button class="btn danger sm" data-rodel="' + m.id + '" data-roname="' + e(m.name) + '">삭제</button></td>' +
          '</tr>';
      });
      html += '</tbody></table>';
      html += '<div class="form-msg' + (rosterFlash ? ' ok' : '') + '" id="ro-rowmsg">' +
        rosterFlash + '</div>';
      rosterFlash = '';
      html += '<p style="font-size:0.82rem;color:var(--gray-5)">총 <strong>' + rows.length + '</strong>명' +
        '<span id="ro-count"></span>. ' +
        '칸을 고친 뒤 그 줄의 <strong>저장</strong>을 누르시면 됩니다. 모든 변경은 감사 기록에 남습니다.<br>' +
        '총회 정년은 만 70세입니다. <strong>생년월일을 적으시면 정년이 지난 분은 ' +
        '<em>일반회원</em>으로 저절로 바뀝니다.</strong> 직분을 <strong>직원</strong>으로 하시면 ' +
        '간사(관리자) 등급이 함께 붙습니다. 두 가지 모두 등급 칸에서 고치실 수 있습니다.</p>';
      box.innerHTML = html;

      document.getElementById('ro-order').addEventListener('click', function () {
        var msg = document.getElementById('ro-ordmsg');
        msg.className = 'form-msg'; msg.textContent = '정리 중입니다...';
        SHSCloud.init().then(function (c) { return c.rpc('reorder_roster'); })
          .then(function (res) {
            if (res.error) {
              msg.className = 'form-msg err';
              msg.textContent = res.error.message +
                ' (29 명단 순서 정리 등록이 필요할 수 있습니다)';
              return;
            }
            SHSCloud.log('update', '명단 순서 정리', (res.data || 0) + '명');
            msg.className = 'form-msg ok';
            msg.textContent = '직위 순서대로 정리했습니다.';
            renderRoster();
          });
      });

      /* 조회 — 적으신 말이 든 줄만 남긴다 */
      var qBox = document.getElementById('ro-q');
      var fCat = document.getElementById('ro-fcat');
      var fGrade = document.getElementById('ro-fgrade');
      function applyFilter() {
        var q = (qBox.value || '').trim();
        var c = fCat.value, g = fGrade.value;
        var shown = 0, n = 0;
        box.querySelectorAll('#ro-tbl tbody tr').forEach(function (tr) {
          var ok = (!q || (tr.dataset.find || '').indexOf(q) !== -1)
                && (!c || tr.dataset.cat === c)
                && (!g || tr.dataset.grade === g);
          tr.classList.toggle('hidden', !ok);
          if (ok) { shown++; tr.querySelector('.ro-no').textContent = ++n; }
        });
        var el = document.getElementById('ro-count');
        el.textContent = (q || c || g) ? ' 가운데 ' + shown + '명' : '';
      }
      [qBox, fCat, fGrade].forEach(function (el) {
        el.addEventListener('input', applyFilter);
        el.addEventListener('change', applyFilter);
      });
      document.getElementById('ro-qclear').addEventListener('click', function () {
        qBox.value = ''; fCat.value = ''; fGrade.value = '';
        applyFilter(); qBox.focus();
      });

      /* 직분·생년월일을 고치면 등급을 규정대로 맞춰 준다.
       * 정년(만 70세)이 지나면 일반회원, 직원은 간사(관리자). */
      function autoGrade(scope, catEl, birthEl, gradeEl) {
        function tune() {
          if (overAge(birthEl.value)) {
            if (['member', 'officer'].indexOf(parseGrade(gradeEl.value).role) !== -1) {
              gradeEl.value = 'general';
            }
          } else if (AUTO_GRADE[catEl.value] && gradeEl.value === 'member') {
            gradeEl.value = AUTO_GRADE[catEl.value];
          }
        }
        catEl.addEventListener('change', tune);
        birthEl.addEventListener('change', tune);
      }
      autoGrade(null,
        document.getElementById('ro-cat'),
        document.getElementById('ro-birth'),
        document.getElementById('ro-grade'));
      box.querySelectorAll('#ro-tbl tbody tr').forEach(function (tr) {
        autoGrade(tr, tr.querySelector('[data-rf="category"]'),
                  tr.querySelector('[data-rf="birth_date"]'),
                  tr.querySelector('[data-rf="grade"]'));
      });

      document.getElementById('ro-add').addEventListener('click', function () {
        var msg = document.getElementById('ro-msg');
        var g = parseGrade(document.getElementById('ro-grade').value);
        var ncat = document.getElementById('ro-cat').value || null;
        var d = {
          name: document.getElementById('ro-name').value.trim(),
          church: churchFor(document.getElementById('ro-church').value.trim(), ncat),
          /* 직분과 조직 분류는 하나다. 담아 두는 자리만 둘일 뿐이다. */
          position: ncat,
          category: ncat,
          birth_date: document.getElementById('ro-birth').value || null,
          sichal: NO_CHURCH[ncat] ? null : (document.getElementById('ro-sichal').value || null),
          role: g.role, officer_title: g.title
          /* 순서는 서버가 정한다. 직위 무리의 맨 뒤로 자동으로 들어간다. */
        };
        if (!d.name || !d.church) {
          msg.className = 'form-msg err';
          msg.textContent = '성명과 소속 교회를 입력해 주세요. ' +
            '무임·은퇴·원로목사는 교회 칸을 비워 두셔도 됩니다.';
          return;
        }
        SHSCloud.init().then(function (c) {
          return c.from('roster').insert(d);
        }).then(function (res) {
          if (res.error) {
            msg.className = 'form-msg err';
            msg.textContent = res.error.code === '23505' ? '이미 명단에 있는 회원입니다.' : res.error.message;
            return;
          }
          SHSCloud.log('create', '명단 추가', d.name + ' (' + d.church + ', ' + (d.officer_title || ROSTER_ROLES[d.role] || d.role) + ')');
          msg.className = 'form-msg ok';
          msg.textContent = d.name + ' 님을 명단에 넣었습니다.' +
            (d.category ? ' ' + d.category + ' 무리의 맨 뒤에 자동으로 놓였습니다.' : '');
          renderRoster();
        });
      });

      box.querySelectorAll('button[data-rosave]').forEach(function (b) {
        b.addEventListener('click', function () {
          var tr = b.closest('tr');
          var msg = document.getElementById('ro-rowmsg');
          function v(f) { return tr.querySelector('[data-rf="' + f + '"]').value.trim(); }
          var cat = v('category') || null;
          var g = parseGrade(v('grade'));
          var d = {
            name: v('name'), church: churchFor(v('church'), cat),
            /* 직분과 조직 분류는 하나다. 담아 두는 자리만 둘일 뿐이다. */
            position: cat,
            category: cat,
            birth_date: v('birth_date') || null,
            sichal: v('sichal') || null,
            note: v('note') || null,
            role: g.role, officer_title: g.title
          };
          if (!d.name) {
            msg.className = 'form-msg err';
            msg.textContent = '성명은 비울 수 없습니다.';
            return;
          }
          if (!d.church) {
            msg.className = 'form-msg err';
            msg.textContent = '소속 교회를 적어 주세요. ' +
              '사임하셨다면 직분을 무임목사·은퇴목사·원로목사로 바꾸시면 ' +
              '교회 칸을 비워 두셔도 됩니다.';
            return;
          }
          /* 무임이 되면 시찰 소속도 없어진다 */
          if (NO_CHURCH[cat]) d.sichal = null;
          msg.className = 'form-msg';
          msg.textContent = '저장 중입니다...';
          SHSCloud.init().then(function (c) {
            return c.from('roster').update(d).eq('id', b.dataset.rosave);
          }).then(function (res) {
            if (res.error) {
              msg.className = 'form-msg err';
              msg.textContent = res.error.code === '23505'
                ? '같은 성명과 교회가 이미 명단에 있습니다.' : res.error.message;
              return;
            }
            SHSCloud.log('update', '명단 수정', d.name + ' (' + d.church + ' · ' +
              (ROSTER_ROLES[d.role] || d.role) + ')');
            rosterFlash = e(d.name) + ' 님 정보를 저장했습니다. (' + e(d.church) +
              (d.category ? ' · ' + e(d.category) : '') + ' · ' +
              e(d.officer_title || ROSTER_ROLES[d.role] || d.role) + ') 조직 페이지에 반영되었습니다.';
            msg.className = 'form-msg ok';
            msg.innerHTML = rosterFlash;
            renderRoster();
          });
        });
      });

      box.querySelectorAll('button[data-rodel]').forEach(function (b) {
        b.addEventListener('click', function () {
          if (!confirm('"' + b.dataset.roname + '" 님을 명단에서 삭제하시겠습니까?')) return;
          SHSCloud.init().then(function (c) {
            return c.from('roster').delete().eq('id', b.dataset.rodel);
          }).then(function (res) {
            if (res.error) { alert('삭제하지 못했습니다: ' + res.error.message); return; }
            SHSCloud.log('delete', '명단 삭제', b.dataset.roname);
            renderRoster();
          });
        });
      });
    });
  }

  /* ---------- 장로 총대 관리 ----------
   * 근거: 노회규칙 제16조 2항 (노회총대는 당회장이 제출한다)
   * 정년(만 70세)과 자격 기간을 두고, 교체되지 않으면 1년씩 자동 연장된다. */
  function renderElders() {
    var box = document.getElementById('elder-area');
    if (!box) return;
    SHSCloud.init().then(function (c) {
      return c.from('roster').select('*').eq('category', '장로').order('sichal').order('sort');
    }).then(function (r) {
      if (r.error) {
        box.innerHTML = '<div class="notice-banner">장로 총대 명단을 불러오지 못했습니다: ' +
          e(r.error.message) + ' (28 장로 총대 자격 관리 등록이 필요할 수 있습니다)</div>';
        return;
      }
      var rows = r.data || [];
      if (!rows.length) {
        box.innerHTML = '<p style="color:var(--gray-5)">등록된 장로가 없습니다. ' +
          '노회 명단 관리에서 조직 분류를 <strong>장로</strong>로 지정해 주세요.</p>';
        return;
      }
      var hasTerm = Object.prototype.hasOwnProperty.call(rows[0], 'term_until');
      if (!hasTerm) {
        box.innerHTML = '<div class="notice-banner">장로 총대의 정년과 자격 기간을 관리하시려면 ' +
          '<strong>supabase/28_elder_terms.sql</strong> 을 먼저 실행해 주세요.</div>';
        return;
      }

      var live = rows.filter(function (x) { return x.active !== false; });
      var past = rows.filter(function (x) { return x.active === false; });
      var today = new Date();
      var expiring = live.filter(function (x) {
        return x.term_until && new Date(x.term_until + 'T00:00:00') <= today;
      }).length;

      function retireCell(x) {
        var rd = SHS.retireDate(x.birth_date);
        if (!rd) return '<span style="color:var(--gray-5)">생년월일 미등록</span>';
        var over = rd <= today;
        return '<span class="' + (over ? 'fail' : '') + '">' +
          rd.getFullYear() + '. ' + (rd.getMonth() + 1) + '. ' + rd.getDate() + '.' +
          (over ? ' (정년 경과)' : '') + '</span>';
      }
      function termCell(x) {
        if (!x.term_until) return '<span style="color:var(--gray-5)">기간 미정</span>';
        var left = Math.ceil((new Date(x.term_until + 'T00:00:00') - today) / 86400000);
        if (left <= 0) return '<span class="fail">만료 (연장 대상)</span>';
        return '<span style="color:var(--gray-5)">' + left + '일 남음</span>';
      }

      var h = '<div class="notice-banner">노회규칙 제16조 2항에 따라 장로 총대는 당회장이 제출합니다. ' +
        '<strong>교체되지 않은 총대는 다음 회기에 자격이 1년 자동 연장</strong>됩니다. ' +
        '정년(만 70세)이 지난 분은 연장되지 않습니다.' +
        (expiring ? ' <strong>지금 자격이 만료된 총대 ' + expiring + '명</strong>' : '') +
        '</div>';

      h += '<p><button class="btn" id="el-extend">자격 만료된 총대 1년 연장</button> ' +
        '<span style="font-size:0.84rem;color:var(--gray-5);margin-left:8px">' +
        '정기노회 뒤에 한 번 눌러 주시면 됩니다. 정년이 지난 분은 제외됩니다.</span></p>' +
        '<div class="form-msg" id="el-msg"></div>';

      h += '<table class="tbl"><thead><tr><th style="width:60px">번호</th>' +
        '<th style="width:110px">성명</th><th style="width:150px">소속 교회</th>' +
        '<th style="width:110px">시찰</th><th style="width:165px">생년월일</th>' +
        '<th style="width:150px">정년 (만 70세)</th>' +
        '<th style="width:340px">총대 자격 기간</th>' +
        '<th style="width:160px">관리</th></tr></thead><tbody>';
      live.forEach(function (x, i) {
        h += '<tr data-el="' + x.id + '">' +
          '<td>' + (i + 1) + '</td>' +
          '<td>' + e(x.name) + '</td>' +
          '<td>' + e(x.church) + '</td>' +
          '<td>' + e(x.sichal || '-') + '</td>' +
          '<td><input type="date" data-ef="birth_date" value="' + e(x.birth_date || '') + '"></td>' +
          '<td style="font-size:0.82rem">' + retireCell(x) + '</td>' +
          '<td><input type="date" data-ef="term_from" value="' + e(x.term_from || '') + '" style="width:47%">' +
          ' ~ <input type="date" data-ef="term_until" value="' + e(x.term_until || '') + '" style="width:47%">' +
          '<div style="font-size:0.8rem;margin-top:3px">' + termCell(x) +
          (String(x.note || '').indexOf('자동 연장') !== -1
            ? ' <span style="color:var(--gray-5)">· 자동 연장됨</span>' : '') + '</div></td>' +
          '<td><button class="btn sm" data-elsave="' + x.id + '">저장</button> ' +
          '<button class="btn ghost sm" data-elswap="' + x.id + '" data-eln="' + e(x.name) +
          '" data-elc="' + e(x.church) + '">교체</button></td>' +
          '</tr>';
      });
      h += '</tbody></table>';

      if (past.length) {
        h += '<h3 style="margin-top:24px">교체된 장로 총대 (' + past.length + '명)</h3>' +
          '<table class="tbl" style="max-width:760px"><thead><tr><th style="width:120px">성명</th>' +
          '<th style="width:170px">소속 교회</th><th style="width:130px">교체일</th>' +
          '<th>후임</th></tr></thead><tbody>';
        past.forEach(function (x) {
          h += '<tr><td>' + e(x.name) + '</td><td>' + e(x.church) + '</td>' +
            '<td>' + e(x.replaced_at || '-') + '</td>' +
            '<td class="left">' + e(x.replaced_by || '-') + '</td></tr>';
        });
        h += '</tbody></table>';
      }
      box.innerHTML = h;

      /* 줄 저장 */
      box.querySelectorAll('button[data-elsave]').forEach(function (b) {
        b.addEventListener('click', function () {
          var tr = b.closest('tr');
          var msg = document.getElementById('el-msg');
          function v(fl) { return tr.querySelector('[data-ef="' + fl + '"]').value || null; }
          var d = { birth_date: v('birth_date'), term_from: v('term_from'), term_until: v('term_until') };
          msg.className = 'form-msg'; msg.textContent = '저장 중입니다...';
          SHSCloud.init().then(function (c) {
            return c.from('roster').update(d).eq('id', b.dataset.elsave);
          }).then(function (res) {
            if (res.error) { msg.className = 'form-msg err'; msg.textContent = res.error.message; return; }
            SHSCloud.log('update', '장로 총대 자격 수정', tr.children[1].textContent);
            renderElders();
          });
        });
      });

      /* 교체 */
      box.querySelectorAll('button[data-elswap]').forEach(function (b) {
        b.addEventListener('click', function () {
          var nm = prompt('"' + b.dataset.eln + '" 총대를 대신할 새 장로 총대의 성명을 적어 주세요.', '');
          if (nm === null || !nm.trim()) return;
          var ch = prompt('새 총대의 소속 교회를 적어 주세요.', b.dataset.elc);
          if (ch === null) return;
          var bd = prompt('새 총대의 생년월일을 적어 주세요. (예: 1965-03-21, 모르시면 비워 두세요)', '');
          if (bd === null) return;
          var msg = document.getElementById('el-msg');
          msg.className = 'form-msg'; msg.textContent = '교체 중입니다...';
          SHSCloud.init().then(function (c) {
            return c.rpc('replace_elder', {
              p_id: Number(b.dataset.elswap), p_name: nm.trim(),
              p_church: ch.trim(), p_birth: bd.trim() || null
            });
          }).then(function (res) {
            if (res.error) { msg.className = 'form-msg err'; msg.textContent = res.error.message; return; }
            SHSCloud.log('update', '장로 총대 교체', b.dataset.eln + ' → ' + nm.trim());
            msg.className = 'form-msg ok';
            msg.textContent = b.dataset.eln + ' 총대를 ' + nm.trim() + ' 총대로 교체했습니다. ' +
              '이전 총대는 아래 교체 기록에 남습니다.';
            renderElders();
            renderRoster();
          });
        });
      });

      /* 자격 일괄 연장 */
      document.getElementById('el-extend').addEventListener('click', function () {
        if (!confirm('자격이 만료된 장로 총대의 기간을 1년 연장하시겠습니까?\n' +
                     '교체되지 않은 총대만 연장되며, 정년이 지난 분은 제외됩니다.')) return;
        var msg = document.getElementById('el-msg');
        msg.className = 'form-msg'; msg.textContent = '연장 중입니다...';
        SHSCloud.init().then(function (c) { return c.rpc('extend_elder_terms'); })
          .then(function (res) {
            if (res.error) { msg.className = 'form-msg err'; msg.textContent = res.error.message; return; }
            var n = res.data || 0;
            SHSCloud.log('update', '장로 총대 자격 자동 연장', n + '명');
            msg.className = 'form-msg ok';
            msg.textContent = n > 0 ? n + '명의 자격을 1년 연장했습니다.'
                                    : '연장할 총대가 없습니다. (모두 자격 기간이 남아 있거나 정년이 지났습니다)';
            renderElders();
          });
      });
    });
  }

  /* ---------- 총회 총대 관리 ----------
   * 근거: 노회규칙 제16조 (총대)
   * 노회장과 장로부노회장은 자동총대, 그 외는 선거관리위원회 내규에 따라 선정 */
  /* ---------- 이사 관리 ----------
   * 총회 실행위원·총신대 운영이사·GMS 이사·기독신문 이사.
   * 총대와 마찬가지로 정기노회에서 선정하므로 같은 모양으로 관리한다. */
  var BKINDS = ['총회 실행위원', '총신대 운영이사', 'GMS 이사', '기독신문 이사'];

  function renderBoards() {
    var box = document.getElementById('board-area');
    if (!box) return;
    SHSCloud.init().then(function (c) {
      return c.from('board_members').select('*').order('sort').order('id');
    }).then(function (r) {
      if (r.error) {
        box.innerHTML = '<div class="notice-banner">이사 명단을 불러오지 못했습니다: ' + e(r.error.message) +
          '<br><span style="font-size:0.85rem;color:var(--gray-5)">' +
          'Supabase에서 <strong>37_boards_and_audit_window.sql</strong>을 먼저 실행해 주세요.</span></div>';
        return;
      }
      var rows = r.data || [];
      var html = '<p>정기노회에서 선정한 이사입니다. 조직 페이지의 <strong>이사</strong> 표에 그대로 나옵니다.</p>';

      html += '<table class="tbl"><thead><tr><th style="width:170px">구분</th>' +
        '<th style="width:130px">성명</th><th style="width:100px">직분</th>' +
        '<th>소속 교회</th><th style="width:150px">자격 시작</th>' +
        '<th style="width:70px">표시</th><th style="width:130px">관리</th></tr></thead><tbody>';
      if (!rows.length) {
        html += '<tr><td colspan="7" style="color:var(--gray-5)">등록된 이사가 없습니다.</td></tr>';
      }
      rows.forEach(function (b) {
        html += '<tr' + (b.active ? '' : ' style="opacity:.5"') + ' data-brow="' + b.id + '">' +
          '<td><select data-bf="kind">' + BKINDS.map(function (k) {
            return '<option' + (b.kind === k ? ' selected' : '') + '>' + e(k) + '</option>';
          }).join('') + '</select></td>' +
          '<td><input type="text" data-names="plain" data-bf="name" value="' + e(b.name) + '"></td>' +
          '<td><select data-bf="position">' + ['목사', '장로'].map(function (k) {
            return '<option' + (b.position === k ? ' selected' : '') + '>' + k + '</option>';
          }).join('') + '</select></td>' +
          '<td><input type="text" data-bf="church" value="' + e(b.church || '') + '"></td>' +
          '<td><input type="date" data-bf="term_from" value="' + e(b.term_from || '') + '"></td>' +
          '<td><input type="checkbox" data-bf="active"' + (b.active ? ' checked' : '') + '></td>' +
          '<td><button class="btn sm" data-bsave="' + b.id + '">저장</button> ' +
          '<button class="btn danger sm" data-bdel="' + b.id + '" data-bname="' + e(b.name) + '">삭제</button></td>' +
          '</tr>';
      });
      html += '</tbody></table>';

      html += '<div class="admin-card" style="max-width:860px"><h3 style="margin-top:0">이사 추가</h3>' +
        '<div class="inline-form">' +
        '<div class="field" style="flex:0 0 170px"><label>구분</label><select id="bn-kind">' +
        BKINDS.map(function (k) { return '<option>' + e(k) + '</option>'; }).join('') + '</select></div>' +
        '<div class="field" style="flex:0 0 130px"><label>성명</label><input type="text" data-names="plain" id="bn-name"></div>' +
        '<div class="field" style="flex:0 0 110px"><label>직분</label>' +
        '<select id="bn-pos"><option>목사</option><option>장로</option></select></div>' +
        '<div class="field"><label>소속 교회</label><input type="text" id="bn-church"></div>' +
        '<div class="field" style="flex:0 0 160px"><label>자격 시작</label><input type="date" id="bn-from"></div>' +
        '<button class="btn" id="bn-add">추가</button>' +
        '</div><div class="form-msg" id="bn-msg"></div></div>';

      box.innerHTML = html;
      SHSNames.attachAll(box);

      function rowData(tr) {
        var d = {};
        tr.querySelectorAll('[data-bf]').forEach(function (el) {
          d[el.dataset.bf] = el.type === 'checkbox' ? el.checked : (el.value.trim() || null);
        });
        d.updated_at = new Date().toISOString();
        d.updated_by = user.name;
        return d;
      }

      box.querySelectorAll('button[data-bsave]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var tr = box.querySelector('tr[data-brow="' + btn.dataset.bsave + '"]');
          var d = rowData(tr);
          if (!d.name) { alert('성명을 입력해 주세요.'); return; }
          SHSCloud.init().then(function (c) {
            return c.from('board_members').update(d).eq('id', btn.dataset.bsave);
          }).then(function (res) {
            if (res.error) { alert(res.error.message); return; }
            SHSCloud.log('update', '이사 수정', d.kind + ' ' + d.name);
            renderBoards();
          });
        });
      });
      box.querySelectorAll('button[data-bdel]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (!confirm('"' + btn.dataset.bname + '" 이사를 명단에서 지우시겠습니까?')) return;
          SHSCloud.init().then(function (c) {
            return c.from('board_members').delete().eq('id', btn.dataset.bdel);
          }).then(function (res) {
            if (res.error) { alert(res.error.message); return; }
            SHSCloud.log('delete', '이사 삭제', btn.dataset.bname);
            renderBoards();
          });
        });
      });
      document.getElementById('bn-add').addEventListener('click', function () {
        var msg = document.getElementById('bn-msg');
        var d = {
          kind: document.getElementById('bn-kind').value,
          name: document.getElementById('bn-name').value.trim(),
          position: document.getElementById('bn-pos').value,
          church: document.getElementById('bn-church').value.trim() || null,
          term_from: document.getElementById('bn-from').value || null,
          sort: (rows.length + 1) * 10,
          updated_by: user.name
        };
        if (!d.name) { msg.className = 'form-msg err'; msg.textContent = '성명을 입력해 주세요.'; return; }
        msg.className = 'form-msg'; msg.textContent = '추가하는 중입니다...';
        SHSCloud.init().then(function (c) {
          return c.from('board_members').insert(d);
        }).then(function (res) {
          if (res.error) { msg.className = 'form-msg err'; msg.textContent = res.error.message; return; }
          SHSCloud.log('create', '이사 추가', d.kind + ' ' + d.name);
          renderBoards();
        });
      });
    });
  }

  var DKINDS = ['목사 정총대', '목사 부총대', '장로 정총대', '장로 부총대'];

  function renderDelegates() {
    var box = document.getElementById('delegate-area');
    if (!box) return;
    SHSCloud.init().then(function (c) {
      return c.from('delegates').select('*').order('kind').order('sort');
    }).then(function (r) {
      if (r.error) {
        box.innerHTML = '<div class="notice-banner">총대 명단을 불러오지 못했습니다: ' + e(r.error.message) +
          ' (26 총회 총대 관리 등록이 필요할 수 있습니다)</div>';
        return;
      }
      var rows = r.data || [];
      var live = rows.filter(function (x) { return x.active; });
      var past = rows.filter(function (x) { return !x.active; });

      function kindOpts(v) {
        return DKINDS.map(function (k) {
          return '<option' + (k === v ? ' selected' : '') + '>' + e(k) + '</option>';
        }).join('');
      }
      function termCell(d) {
        if (!d.term_until) return '<span style="color:var(--gray-5)">기간 미정</span>';
        var left = Math.ceil((new Date(d.term_until + 'T00:00:00') - new Date()) / 86400000);
        var txt = e(d.term_from || '?') + ' ~ ' + e(d.term_until);
        if (left <= 0) return txt + '<div class="fail" style="font-size:0.8rem">자격 만료</div>';
        return txt + '<div style="font-size:0.8rem;color:var(--gray-5)">' + left + '일 남음</div>';
      }

      var h = '<div class="notice-banner">노회규칙 제16조에 따라 4월 정기노회에서 선정합니다. ' +
        '노회장과 장로 부노회장은 자동총대입니다. ' +
        '총대가 바뀌면 <strong>교체</strong>를 눌러 새 총대를 넣어 주세요. ' +
        '이전 총대는 지워지지 않고 기록으로 남습니다.</div>';

      DKINDS.forEach(function (k) {
        var list = live.filter(function (x) { return x.kind === k; });
        h += '<h3 style="margin-top:22px">' + e(k) + ' (' + list.length + '명)</h3>';
        if (!list.length) { h += '<p style="color:var(--gray-5)">등록된 총대가 없습니다.</p>'; return; }
        h += '<table class="tbl"><thead><tr><th style="width:110px">성명</th>' +
          '<th style="width:160px">소속 교회</th><th style="width:110px">직책</th>' +
          '<th style="width:200px">자격 기간</th><th style="width:170px">비고</th>' +
          '<th style="width:170px">관리</th></tr></thead><tbody>';
        list.forEach(function (d) {
          h += '<tr data-dg="' + d.id + '">' +
            '<td><input type="text" data-df="name" value="' + e(d.name) + '"></td>' +
            '<td><input type="text" data-df="church" value="' + e(d.church || '') + '" placeholder="소속 교회"></td>' +
            '<td><input type="text" data-df="title" value="' + e(d.title || '') + '" placeholder="자동총대"></td>' +
            '<td><input type="date" data-df="term_from" value="' + e(d.term_from || '') + '">' +
            '<input type="date" data-df="term_until" value="' + e(d.term_until || '') + '" style="margin-top:4px">' +
            '<div style="font-size:0.78rem;color:var(--gray-5);margin-top:2px">' + termCell(d) + '</div></td>' +
            '<td><input type="text" data-df="note" value="' + e(d.note || '') + '"></td>' +
            '<td><button class="btn sm" data-dsave="' + d.id + '">저장</button> ' +
            '<button class="btn ghost sm" data-dswap="' + d.id + '" data-dn="' + e(d.name) + '">교체</button> ' +
            '<button class="btn danger sm" data-ddel="' + d.id + '" data-dn2="' + e(d.name) + '">삭제</button></td>' +
            '</tr>';
        });
        h += '</tbody></table>';
      });

      /* 총대 추가 */
      var nextSpring = SHS.nthMonday(new Date().getFullYear() + (new Date().getMonth() >= 3 ? 1 : 0), 4, 2);
      h += '<div class="admin-card" style="margin-top:22px"><h3 style="margin-top:0">총대 추가</h3>' +
        '<div class="inline-form">' +
        '<div class="field" style="flex:0 0 150px"><label>구분</label><select id="dg-kind">' + kindOpts('장로 정총대') + '</select></div>' +
        '<div class="field" style="flex:0 0 130px"><label>성명</label><input type="text" id="dg-name"></div>' +
        '<div class="field"><label>소속 교회</label><input type="text" id="dg-church"></div>' +
        '<div class="field" style="flex:0 0 130px"><label>직책 (선택)</label><input type="text" id="dg-title" placeholder="자동총대"></div>' +
        '<div class="field" style="flex:0 0 165px"><label>자격 시작</label><input type="date" id="dg-from" value="' +
        new Date().toISOString().slice(0, 10) + '"></div>' +
        '<div class="field" style="flex:0 0 165px"><label>자격 만료</label><input type="date" id="dg-until" value="' +
        nextSpring.toISOString().slice(0, 10) + '"></div>' +
        '<button class="btn" id="dg-add">추가</button>' +
        '</div><div class="form-msg" id="dg-msg"></div></div>';

      /* 교체 기록 */
      if (past.length) {
        h += '<h3 style="margin-top:26px">교체된 총대 (' + past.length + '명)</h3>' +
          '<table class="tbl"><thead><tr><th style="width:150px">구분</th><th style="width:110px">성명</th>' +
          '<th style="width:160px">소속 교회</th><th style="width:130px">교체일</th>' +
          '<th>후임</th></tr></thead><tbody>';
        past.forEach(function (d) {
          h += '<tr><td>' + e(d.kind) + '</td><td>' + e(d.name) + '</td>' +
            '<td>' + e(d.church || '-') + '</td><td>' + e(d.replaced_at || '-') + '</td>' +
            '<td class="left">' + e(d.replaced_by || '-') + '</td></tr>';
        });
        h += '</tbody></table>';
      }

      h += '<div class="form-msg" id="dg-rowmsg"></div>';
      box.innerHTML = h;

      /* 줄 저장 */
      box.querySelectorAll('button[data-dsave]').forEach(function (b) {
        b.addEventListener('click', function () {
          var tr = b.closest('tr');
          var msg = document.getElementById('dg-rowmsg');
          function v(fl) { return tr.querySelector('[data-df="' + fl + '"]').value.trim(); }
          var d = {
            name: v('name'), church: v('church') || null, title: v('title') || null,
            term_from: v('term_from') || null, term_until: v('term_until') || null,
            note: v('note') || null, updated_at: new Date().toISOString(), updated_by: user.name
          };
          if (!d.name) { msg.className = 'form-msg err'; msg.textContent = '성명은 비울 수 없습니다.'; return; }
          msg.className = 'form-msg'; msg.textContent = '저장 중입니다...';
          SHSCloud.init().then(function (c) {
            return c.from('delegates').update(d).eq('id', b.dataset.dsave);
          }).then(function (res) {
            if (res.error) { msg.className = 'form-msg err'; msg.textContent = res.error.message; return; }
            SHSCloud.log('update', '총대 수정', d.name + ' (' + (d.church || '') + ')');
            msg.className = 'form-msg ok';
            msg.textContent = d.name + ' 총대 정보를 저장했습니다.';
            renderDelegates();
          });
        });
      });

      /* 교체 */
      box.querySelectorAll('button[data-dswap]').forEach(function (b) {
        b.addEventListener('click', function () {
          var nm = prompt('"' + b.dataset.dn + '" 총대를 대신할 새 총대의 성명을 적어 주세요.', '');
          if (nm === null || !nm.trim()) return;
          var ch = prompt('새 총대의 소속 교회를 적어 주세요.', '');
          if (ch === null) return;
          var msg = document.getElementById('dg-rowmsg');
          msg.className = 'form-msg'; msg.textContent = '교체 중입니다...';
          SHSCloud.init().then(function (c) {
            return c.rpc('replace_delegate', {
              p_id: Number(b.dataset.dswap), p_name: nm.trim(),
              p_church: ch.trim(), p_note: b.dataset.dn + ' 총대 후임'
            });
          }).then(function (res) {
            if (res.error) { msg.className = 'form-msg err'; msg.textContent = res.error.message; return; }
            SHSCloud.log('update', '총대 교체', b.dataset.dn + ' → ' + nm.trim());
            msg.className = 'form-msg ok';
            msg.textContent = b.dataset.dn + ' 총대를 ' + nm.trim() + ' 총대로 교체했습니다. ' +
              '이전 총대는 아래 교체 기록에 남습니다.';
            renderDelegates();
          });
        });
      });

      /* 삭제 */
      box.querySelectorAll('button[data-ddel]').forEach(function (b) {
        b.addEventListener('click', function () {
          if (!confirm('"' + b.dataset.dn2 + '" 총대를 명단에서 삭제하시겠습니까?\n교체가 아니라 기록까지 지웁니다.')) return;
          SHSCloud.init().then(function (c) {
            return c.from('delegates').delete().eq('id', b.dataset.ddel);
          }).then(function (res) {
            if (res.error) { alert(res.error.message); return; }
            SHSCloud.log('delete', '총대 삭제', b.dataset.dn2);
            renderDelegates();
          });
        });
      });

      /* 추가 */
      document.getElementById('dg-add').addEventListener('click', function () {
        var msg = document.getElementById('dg-msg');
        var d = {
          kind: document.getElementById('dg-kind').value,
          name: document.getElementById('dg-name').value.trim(),
          church: document.getElementById('dg-church').value.trim() || null,
          title: document.getElementById('dg-title').value.trim() || null,
          term_from: document.getElementById('dg-from').value || null,
          term_until: document.getElementById('dg-until').value || null,
          sort: (live.length + 1) * 10,
          updated_at: new Date().toISOString(), updated_by: user.name
        };
        if (!d.name) { msg.className = 'form-msg err'; msg.textContent = '성명을 입력해 주세요.'; return; }
        msg.className = 'form-msg'; msg.textContent = '추가 중입니다...';
        SHSCloud.init().then(function (c) { return c.from('delegates').insert(d); })
          .then(function (res) {
            if (res.error) { msg.className = 'form-msg err'; msg.textContent = res.error.message; return; }
            SHSCloud.log('create', '총대 추가', d.kind + ' ' + d.name);
            renderDelegates();
          });
      });
    });
  }

  /* ---------- 시찰회 관리 ---------- */

          '<div class="field"><label>관할 지역</label><input type="text" data-sf="area" value="' + e(s.area || '') + '"></div>' +

          '<div class="inline-form" style="margin-bottom:6px">' +
          '<div class="field"><label>시찰장</label><input type="text" data-names data-sf="head" value="' + e(s.head || '') + '"></div>' +
          '<div class="field"><label>서기</label><input type="text" data-names data-sf="clerk" value="' + e(s.clerk || '') + '"></div>' +
          '<div class="field"><label>회계</label><input type="text" data-names data-sf="treasurer" value="' + e(s.treasurer || '') + '"></div>' +
          '</div>' +

              .filter(function (x) { return x; }).join('\n'),
            updated_at: new Date().toISOString(), updated_by: user.name
          };
          if (!d.name) { msg.className = 'form-msg err'; msg.textContent = '시찰 이름을 입력해 주세요.'; return; }
          msg.className = 'form-msg'; msg.textContent = '저장 중입니다...';
          SHSCloud.init().then(function (c) {

          return c.from('sichals').insert({
            name: nm, churches: '',

            updated_at: new Date().toISOString(), updated_by: user.name

  /* ---------- 상비부 배정 관리 ---------- */

  /* 년조 한 칸에 여러 이름을 쉼표로 몰아 적으면 누가 빠졌는지 알아보기
   * 어렵다. 한 사람에 한 칸씩 두고, 칸을 더하거나 지울 수 있게 한다.
   * 저장할 때는 예전처럼 쉼표로 이어 한 칸(y1·y2·y3)에 넣는다. */
  function nameRow(v) {
    return '<div class="mm-row">' +
      '<input type="text" data-names="plain" value="' + SHS.esc(v || '') + '">' +
      '<button type="button" class="mm-del" data-ydel aria-label="이 사람 지우기" ' +
      'title="이 사람 지우기">&times;</button></div>';
  }
  function splitNames(v) {
    return String(v || '').split(',')
      .map(function (x) { return x.trim(); })
      .filter(function (x) { return x; });
  }
  function yearBox(label, key, value) {
    var list = splitNames(value);
    if (!list.length) list = [''];        /* 비어 있어도 적을 칸 하나는 둔다 */
    return '<div class="field"><label>' + label + '</label>' +
      '<div class="mm-list" data-y="' + key + '">' +
      list.map(nameRow).join('') + '</div>' +
      '<button type="button" class="btn ghost sm mm-add" data-yadd="' + key + '">+ 이름 추가</button>' +
      '</div>';
  }

  /* 한 카드 안의 이름 칸에 명부 찾기를 붙이고, 더하기·지우기를 잇는다 */
  function bindNameRows(card) {
    SHSNames.attachAll(card);

    card.querySelectorAll('button[data-yadd]').forEach(function (b) {
      if (b.dataset.ready) return;
      b.dataset.ready = '1';
      b.addEventListener('click', function () {
        var list = card.querySelector('.mm-list[data-y="' + b.dataset.yadd + '"]');
        var tmp = document.createElement('div');
        tmp.innerHTML = nameRow('');
        var row = tmp.firstChild;
        list.appendChild(row);
        bindNameRows(card);
        row.querySelector('input').focus();
      });
    });

    card.querySelectorAll('button[data-ydel]').forEach(function (b) {
      if (b.dataset.ready) return;
      b.dataset.ready = '1';
      b.addEventListener('click', function () {
        var row = b.parentNode;
        var list = row.parentNode;
        row.parentNode.removeChild(row);
        /* 마지막 한 칸까지 없어지면 적을 곳이 사라지므로 빈 칸을 하나 둔다 */
        if (!list.querySelector('.mm-row')) {
          list.innerHTML = nameRow('');
          bindNameRows(card);
        }
      });
    });
  }

  /* 년조 칸에 적힌 이름을 모아 쉼표로 잇는다 */
  function yearValue(card, key) {
    var list = card.querySelector('.mm-list[data-y="' + key + '"]');
    if (!list) return '';
    return Array.prototype.slice.call(list.querySelectorAll('input'))
      .map(function (i) { return i.value.trim(); })
      .filter(function (x) { return x; })
      .join(', ');
  }

  function renderCommittees() {
    var box = document.getElementById('committee-area');
    SHSCloud.init().then(function (c) {
      return c.from('committees').select('*').order('sort');
    }).then(function (r) {
      if (r.error || !(r.data && r.data.length)) {
        box.innerHTML = '<div class="notice-banner">상비부 정보가 아직 서버에 등록되지 않았습니다. ' +
          '노회 사무실에 문의하여 상비부 등록(03_committees.sql)을 진행해 주세요.</div>';
        return;
      }
      var html = '';
      r.data.forEach(function (cm) {
        html += '<div class="admin-card" style="margin-bottom:16px" data-cmt="' + e(cm.name) + '">' +
          '<h3 style="margin-top:0">' + e(cm.name) + '</h3>' +
          '<div class="inline-form" style="margin-bottom:8px">' +
          '<div class="field"><label>' + SHS.headTitle(cm.name) + '</label><input type="text" data-names data-f="head" value="' + e(cm.head || '') + '"></div>' +
          '<div class="field"><label>서기</label><input type="text" data-names data-f="clerk" value="' + e(cm.clerk || '') + '"></div>' +
          '<div class="field"><label>회계</label><input type="text" data-names data-f="treasurer" value="' + e(cm.treasurer || '') + '"></div>' +
          '</div>' +
          /* 위원회는 년조로 나누지 않고 위원 명단만 둔다 */
          (SHS.isBoard(cm.name)
            ? yearBox('위원', 'members', cm.members)
            : yearBox('1년조', 'y1', cm.y1) +
              yearBox('2년조', 'y2', cm.y2) +
              yearBox('3년조', 'y3', cm.y3)) +
          '<button class="btn sm" data-cmsave="' + e(cm.name) + '">저장</button>' +
          '<span class="form-msg" data-cmmsg="' + e(cm.name) + '" style="margin-left:10px"></span>' +
          '</div>';
      });
      box.innerHTML = html;
      box.querySelectorAll('div[data-cmt]').forEach(bindNameRows);

      box.querySelectorAll('button[data-cmsave]').forEach(function (b) {
        b.addEventListener('click', function () {
          var name = b.dataset.cmsave;
          var card = box.querySelector('div[data-cmt="' + name + '"]');
          var upd = { updated_at: new Date().toISOString() };
          /* 적힌 이름을 회원 명부와 맞춰 늘 같은 모양으로 저장한다.
           * 명부에 없는 이름은 그대로 저장하되 누구인지 알려 준다. */
          var miss = [];
          function note(u) {
            u.forEach(function (x) { if (miss.indexOf(x) === -1) miss.push(x); });
          }
          /* 부장·서기·회계 — 한 사람씩 (이름 직분) */
          card.querySelectorAll('input[data-f]').forEach(function (inp) {
            var r = SHSNames.fix(inp.value, { style: 'withPos' });
            inp.value = r.value;
            upd[inp.dataset.f] = r.value;
            note(r.unknown);
          });
          /* 상비부는 1·2·3년조, 위원회는 위원 — 칸마다 한 사람,
           * 저장은 예전처럼 쉼표로 이어서 한 칸에 넣는다 */
          (SHS.isBoard(name) ? ['members'] : ['y1', 'y2', 'y3']).forEach(function (k) {
            var r = SHSNames.fix(yearValue(card, k), { multi: true, style: 'plain' });
            upd[k] = r.value;
            note(r.unknown);
          });
          var msg = box.querySelector('span[data-cmmsg="' + name + '"]');
          SHSCloud.init().then(function (c) {
            return c.from('committees').update(upd).eq('name', name).select();
          }).then(function (res) {
            var w = SHS.wrote(res);
            if (!w.ok) {
              msg.className = 'form-msg err';
              msg.textContent = w.why;
              return;
            }
            SHSCloud.log('update', '상비부 배정 수정', name);
            msg.className = miss.length ? 'form-msg err' : 'form-msg ok';
            msg.textContent = miss.length
              ? '저장했습니다. 다만 회원 명부에 없는 이름이 있습니다 — ' + miss.join(', ')
              : '저장되었습니다. (회원 명부와 모두 맞습니다)';
          });
        });
      });
    });
  }

      html += '<table class="tbl"><thead><tr><th>이메일(아이디)</th><th>성명</th><th>직분</th><th>소속 교회</th><th style="width:120px">처리</th></tr></thead><tbody>';

    /* 계정 목록 (운영자 계정은 회원 목록에 표시하지 않는다) */
    var visible = accounts.filter(function (a) {

    });
    html += '<h2>홈페이지 회원 목록</h2>';
    html += '<table class="tbl"><thead><tr><th>이메일(아이디)</th><th>성명</th><th>직분</th><th>소속</th><th>연락처</th><th>등급</th>' +
      (isSuper ? '<th style="width:210px">등급 변경</th>' : '') +
      '<th style="width:80px">관리</th></tr></thead><tbody>';
    visible.forEach(function (a) {
      html += '<tr><td class="left">' + e(a.id) + '</td><td>' + e(a.name) + '</td><td>' + e(a.position) + '</td>' +
        '<td>' + e(a.church) + '</td><td>' + e(a.phone || '-') + '</td>' +
        '<td><span class="role-badge">' + SHSAuth.roleName(a.role) + '</span>' +
        (a.title ? '<div style="font-size:0.75rem;color:var(--gray-5);margin-top:2px">' + e(a.title) + '</div>' : '') + '</td>';
      if (isSuper) {
        html += '<td><select data-role-for="' + e(a.id) + '">' +
          ['pending', 'member', 'officer', 'staff', 'clerk', 'president'].map(function (r) {
            return '<option value="' + r + '"' + (a.role === r ? ' selected' : '') + '>' + SHSAuth.roleName(r) + '</option>';
          }).join('') +
          '</select> <button class="btn sm" data-assign="' + e(a.id) + '">적용</button></td>';
      }
      html += '<td><button class="btn danger sm" data-remove="' + e(a.id) + '">삭제</button></td></tr>';
    });
    html += '</tbody></table>';

    /* 회원 추가 */
    html += '<h2>회원 추가</h2>';
    html += '<div class="admin-card" style="max-width:760px"><div class="inline-form">' +
      '<div class="field"><label>이메일(아이디)</label><input type="email" id="na-id" placeholder="hong@naver.com"></div>' +
      '<div class="field"><label>초기 비밀번호</label><input type="text" id="na-pw"></div>' +
      '<div class="field"><label>성명</label><input type="text" id="na-name"></div>' +
      '<div class="field"><label>직분</label><select id="na-pos"><option>목사</option><option>장로</option><option>간사</option></select></div>' +
      '<div class="field"><label>소속 교회</label><input type="text" id="na-church"></div>' +
      '<button class="btn" id="btn-add">추가</button>' +
      '</div><div class="form-msg" id="add-msg"></div>' +
      '<p style="font-size:0.82rem;color:var(--gray-5);margin-top:10px">' +
      '성명과 소속 교회가 노회 임원·회원 명단과 일치하면 해당 등급이 자동 부여되고, ' +
      '일치하지 않으면 승인대기 상태로 생성됩니다. ' +
      (isSuper ? '등급은 위 목록에서 직접 변경할 수 있습니다.' : '직책 지정은 노회 사무실을 통해 처리됩니다.') +
      '</p></div>';

    area.innerHTML = html;
    SHS.sectionize(area);
    bind();
  }

  function bind() {
    area.querySelectorAll('button[data-approve]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.dataset.approve;
        if (!confirm('회원 "' + id + '" 님을 정회원으로 설정하시겠습니까?')) return;
        var r = SHSAuth.approveMember(user, id);
        if (!r.ok) alert(r.msg);
        render();
      });
    });
    area.querySelectorAll('button[data-remove]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.dataset.remove;
        if (!confirm('회원 "' + id + '" 계정을 삭제하시겠습니까?')) return;
        var r = SHSAuth.removeAccount(user, id);
        if (!r.ok) alert(r.msg);
        render();
      });
    });
    area.querySelectorAll('button[data-assign]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.dataset.assign;
        var sel = area.querySelector('select[data-role-for="' + id + '"]');
        var r = SHSAuth.assignRole(user, id, sel.value);
        if (!r.ok) { alert(r.msg); return; }
        alert('등급이 변경되었습니다: ' + id + ' → ' + SHSAuth.roleName(sel.value));
        render();
      });
    });
    document.getElementById('btn-add').addEventListener('click', function () {
      var msg = document.getElementById('add-msg');
      var data = {
        id: document.getElementById('na-id').value.trim().toLowerCase(),
        pw: document.getElementById('na-pw').value,
        name: document.getElementById('na-name').value.trim(),
        position: document.getElementById('na-pos').value,
        church: document.getElementById('na-church').value.trim()
      };
      if (!data.id || !data.pw || !data.name || !data.church) {
        msg.className = 'form-msg err';
        msg.textContent = '이메일, 비밀번호, 성명, 소속 교회는 필수 항목입니다.';
        return;
      }
      var r = SHSAuth.addAccount(user, data);
      if (!r.ok) {
        msg.className = 'form-msg err';
        msg.textContent = r.msg;
        return;
      }
      render();
    });
  }

  /* ---------- 화면 그리기 ----------
   * 등급 목록(GRADES) 등이 모두 정의된 뒤에 그려야 하므로 맨 마지막에 부른다. */
  if (user.cloud) {
    renderCloud();
  } else {
    render();
  }
 });
});
</script>
</body>
</html>
