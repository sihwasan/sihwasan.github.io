      /* ----- 수정 팝업 ----- */
      function openDelegateEdit(d0) {
        var mo = adminModal(
          '<h3 style="margin:0 0 14px;color:var(--navy)">' + e(d0.kind) + ' ' + e(d0.name) + ' — 총대 수정</h3>' +
          '<div class="inline-form">' +
          '<div class="field" style="flex:0 0 140px"><label>성명</label>' +
          '<input type="text" id="dm-name" value="' + e(d0.name) + '"></div>' +
          '<div class="field"><label>소속 교회</label>' +
          '<input type="text" id="dm-church" value="' + e(d0.church || '') + '"></div>' +
          '<div class="field" style="flex:0 0 140px"><label>직책</label>' +
          '<input type="text" id="dm-title" value="' + e(d0.title || '') + '" placeholder="자동총대"></div>' +
          '</div>' +
          '<div class="inline-form">' +
          '<div class="field" style="flex:0 0 165px"><label>자격 시작</label>' +
          '<input type="date" id="dm-from" value="' + e(d0.term_from || '') + '"></div>' +
          '<div class="field" style="flex:0 0 165px"><label>자격 만료</label>' +
          '<input type="date" id="dm-until" value="' + e(d0.term_until || '') + '"></div>' +
          '<div class="field"><label>비고</label>' +
          '<input type="text" id="dm-note" value="' + e(d0.note || '') + '"></div>' +
          '</div>' +
          '<div style="margin-top:6px"><button class="btn" id="dm-save">저장</button> ' +
          '<button class="btn ghost" id="dm-swap">교체</button> ' +
          '<button class="btn danger" id="dm-del" style="float:right">삭제</button></div>' +
          '<p style="font-size:0.8rem;color:var(--gray-5);margin:8px 0 0">교체를 누르면 새 총대를 넣고 ' +
          '이전 총대는 교체 기록으로 남습니다. 삭제는 기록까지 지웁니다.</p>' +
          '<div class="form-msg" id="dm-msg"></div>');
        document.getElementById('dm-save').addEventListener('click', function () {
          var msg = document.getElementById('dm-msg');
          var d = {
            name: document.getElementById('dm-name').value.trim(),
            church: document.getElementById('dm-church').value.trim() || null,
            title: document.getElementById('dm-title').value.trim() || null,
            term_from: document.getElementById('dm-from').value || null,
            term_until: document.getElementById('dm-until').value || null,
            note: document.getElementById('dm-note').value.trim() || null,
            updated_at: new Date().toISOString(), updated_by: user.name
          };
          if (!d.name) { msg.className = 'form-msg err'; msg.textContent = '성명은 비울 수 없습니다.'; return; }
          SHSCloud.init().then(function (c) {
            return c.from('delegates').update(d).eq('id', d0.id);
          }).then(function (res) {
            if (res.error) { msg.className = 'form-msg err'; msg.textContent = res.error.message; return; }
            SHSCloud.log('update', '총대 수정', d.name + ' (' + (d.church || '') + ')');
            mo.close();
            renderDelegates();
          });
        });
        document.getElementById('dm-swap').addEventListener('click', function () {
          var nm = prompt('"' + d0.name + '" 총대를 대신할 새 총대의 성명을 적어 주세요.', '');
          if (nm === null || !nm.trim()) return;
          var ch = prompt('새 총대의 소속 교회를 적어 주세요.', '');
          if (ch === null) return;
          SHSCloud.init().then(function (c) {
            return c.rpc('replace_delegate', {
              p_id: Number(d0.id), p_name: nm.trim(),
              p_church: ch.trim(), p_note: d0.name + ' 총대 후임'
            });
          }).then(function (res) {
            if (res.error) { alert(res.error.message); return; }
            SHSCloud.log('update', '총대 교체', d0.name + ' → ' + nm.trim());
            mo.close();
            renderDelegates();
          });
        });
        document.getElementById('dm-del').addEventListener('click', function () {
          if (!confirm('"' + d0.name + '" 총대를 명단에서 삭제하시겠습니까? 교체가 아니라 기록까지 지웁니다.')) return;
          SHSCloud.init().then(function (c) {
            return c.from('delegates').delete().eq('id', d0.id);
          }).then(function (res) {
            if (res.error) { alert(res.error.message); return; }
            SHSCloud.log('delete', '총대 삭제', d0.name);
            mo.close();
            renderDelegates();
          });
        });
      }
      box.querySelectorAll('button[data-dedit]').forEach(function (b) {
        b.addEventListener('click', function () {
          var d0 = live.filter(function (x) { return String(x.id) === b.dataset.dedit; })[0];
          if (d0) openDelegateEdit(d0);
        });
      });

      /* 추가 */
      document.getElementById('dg-add').addEventListener('click', function () {
        var msg = document.getElementById('dg-msg');
        var d = {
          kind: document.getElementById('dg-kind').value,
          name: document.getElementById('dg-name').value.trim(),
          church: document.getElementById('dg-church').value.trim() || null,
          title: document.getElementById('dg-title').value.trim() || null,
          term_from: document.getElementById('dg-from').value || null,
          term_until: document.getElementById('dg-until').value || null,
          sort: (live.length + 1) * 10,
          updated_at: new Date().toISOString(), updated_by: user.name
        };
        if (!d.name) { msg.className = 'form-msg err'; msg.textContent = '성명을 입력해 주세요.'; return; }
        msg.className = 'form-msg'; msg.textContent = '추가 중입니다...';
        SHSCloud.init().then(function (c) { return c.from('delegates').insert(d); })
          .then(function (res) {
            if (res.error) { msg.className = 'form-msg err'; msg.textContent = res.error.message; return; }
            SHSCloud.log('create', '총대 추가', d.kind + ' ' + d.name);
            renderDelegates();
          });
      });
    });
  }

  /* ---------- 시찰회 관리 ---------- */
  function renderSichals() {
    var box = document.getElementById('sichal-area');
    if (!box) return;
    SHSCloud.init().then(function (c) {
      return c.from('sichals').select('*').order('sort');
    }).then(function (r) {
      if (r.error) {
        box.innerHTML = '<div class="notice-banner">시찰 정보를 불러오지 못했습니다: ' +
          e(r.error.message) + '</div>';
        return;
      }
      var rows = r.data || [];
      function churchCount(x) {
        return String(x.churches || '').split('\n')
          .filter(function (t) { return t.trim(); }).length;
      }

      var html = '<div class="notice-banner">시찰 구성은 조직 페이지와 <strong>회원가입 화면의 교회 목록</strong>에 함께 쓰입니다. ' +
        '관내 교회의 교역자·장로 명부는 <strong>교회 관리</strong>에서 다룹니다.</div>';
      html += '<table class="tbl"><thead><tr><th style="width:120px">시찰</th>' +
        '<th style="width:120px">시찰장</th><th style="width:110px">서기</th>' +
        '<th style="width:110px">회계</th><th style="width:90px">관내 교회</th>' +
        '<th>관할 지역</th><th style="width:80px">관리</th></tr></thead><tbody>';
      if (!rows.length) {
        html += '<tr><td colspan="7" style="color:var(--gray-5)">등록된 시찰이 없습니다.</td></tr>';
      }
      rows.forEach(function (x) {
        html += '<tr><td><strong>' + e(x.name) + '</strong></td>' +
          '<td>' + e(x.head || '-') + '</td>' +
          '<td>' + e(x.clerk || '-') + '</td>' +
          '<td>' + e(x.treasurer || '-') + '</td>' +
          '<td>' + churchCount(x) + '곳</td>' +
          '<td class="left" style="font-size:0.86rem">' + e(x.area || '-') + '</td>' +
          '<td><button class="btn sm" data-siedit="' + x.id + '">수정</button></td></tr>';
      });
      html += '</tbody></table>';
      html += '<p style="margin-top:12px"><button class="btn ghost sm" id="si-new">시찰 추가</button> ' +
        '<span class="form-msg" id="si-newmsg" style="margin:0"></span></p>';
      box.innerHTML = html;

      function openSichalEdit(x) {
        var isNew = !x;
        x = x || { name: '', area: '', head: '', clerk: '', treasurer: '', churches: '' };
        var mo = adminModal(
          '<div id="si-card">' +
          '<h3 style="margin:0 0 14px;color:var(--navy)">' +
          (isNew ? '시찰 추가' : e(x.name) + ' — 시찰 정보 수정') + '</h3>' +
          '<div class="inline-form">' +
          '<div class="field" style="flex:0 0 160px"><label>시찰 이름</label>' +
          '<input type="text" id="sim-name" value="' + e(x.name) + '"></div>' +
          '<div class="field"><label>관할 지역</label>' +
          '<input type="text" id="sim-area" value="' + e(x.area || '') + '"></div>' +
          '</div>' +
          '<div class="inline-form">' +
          '<div class="field"><label>시찰장</label>' +
          '<input type="text" data-names id="sim-head" value="' + e(x.head || '') + '"></div>' +
          '<div class="field"><label>서기</label>' +
          '<input type="text" data-names id="sim-clerk" value="' + e(x.clerk || '') + '"></div>' +
          '<div class="field"><label>회계</label>' +
          '<input type="text" data-names id="sim-treasurer" value="' + e(x.treasurer || '') + '"></div>' +
          '</div>' +
          '<div class="field"><label>소속 교회 (한 줄에 한 교회씩)</label>' +
          '<textarea id="sim-churches" rows="10">' + e(x.churches || '') + '</textarea></div>' +
          '<div style="margin-top:6px"><button class="btn" id="sim-save">저장</button> ' +
          (isNew ? '' : '<button class="btn danger" id="sim-del" style="float:right">시찰 삭제</button>') +
          '</div><div class="form-msg" id="sim-msg"></div></div>', 720);
        SHSNames.attachAll(mo.ov);

        document.getElementById('sim-save').addEventListener('click', function () {
          var msg = document.getElementById('sim-msg');
          var lines = document.getElementById('sim-churches').value.split('\n')
            .map(function (t) { return t.trim(); }).filter(function (t) { return t; });
          var d = {
            name: document.getElementById('sim-name').value.trim(),
            area: document.getElementById('sim-area').value.trim() || null,
            head: document.getElementById('sim-head').value.trim() || null,
            clerk: document.getElementById('sim-clerk').value.trim() || null,
            treasurer: document.getElementById('sim-treasurer').value.trim() || null,
            churches: lines.join('\n') || null,
            updated_at: new Date().toISOString(), updated_by: user.name
          };
          if (!d.name) { msg.className = 'form-msg err'; msg.textContent = '시찰 이름을 적어 주세요.'; return; }
          if (isNew) d.sort = (rows.length + 1) * 10;
          msg.className = 'form-msg'; msg.textContent = '저장 중입니다...';
          SHSCloud.init().then(function (c) {
            return isNew ? c.from('sichals').insert(d).select()
                         : c.from('sichals').update(d).eq('id', x.id).select();
          }).then(function (res) {
            var w = SHS.wrote(res);
            if (!w.ok) { msg.className = 'form-msg err'; msg.textContent = w.why; return; }
            SHSCloud.log(isNew ? 'create' : 'update', isNew ? '시찰 추가' : '시찰 정보 수정', d.name);
            mo.close();
            renderSichals();
          });
        });

        var del = document.getElementById('sim-del');
        if (del) del.addEventListener('click', function () {
          if (!confirm('"' + x.name + '" 시찰을 지우시겠습니까? 되돌릴 수 없습니다.')) return;
          SHSCloud.init().then(function (c) {
            return c.from('sichals').delete().eq('id', x.id);
          }).then(function (res) {
            if (res.error) { alert(res.error.message); return; }
            SHSCloud.log('delete', '시찰 삭제', x.name);
            mo.close();
            renderSichals();
          });
        });
      }

      box.querySelectorAll('button[data-siedit]').forEach(function (b) {
        b.addEventListener('click', function () {
          var x = rows.filter(function (y) { return String(y.id) === b.dataset.siedit; })[0];
          if (x) openSichalEdit(x);
        });
      });
      document.getElementById('si-new').addEventListener('click', function () { openSichalEdit(null); });
    });
  }

  /* ---------- 상비부 배정 관리 ---------- */

  /* 년조 한 칸에 여러 이름을 쉼표로 몰아 적으면 누가 빠졌는지 알아보기
   * 어렵다. 한 사람에 한 칸씩 두고, 칸을 더하거나 지울 수 있게 한다.
   * 저장할 때는 예전처럼 쉼표로 이어 한 칸(y1·y2·y3)에 넣는다. */
  function nameRow(v) {
    return '<div class="mm-row">' +
      '<input type="text" data-names="plain" value="' + SHS.esc(v || '') + '">' +
      '<button type="button" class="mm-del" data-ydel aria-label="이 사람 지우기" ' +
      'title="이 사람 지우기">&times;</button></div>';
  }
  function splitNames(v) {
    return String(v || '').split(',')
      .map(function (x) { return x.trim(); })
      .filter(function (x) { return x; });
  }
  function yearBox(label, key, value) {
    var list = splitNames(value);
    if (!list.length) list = [''];        /* 비어 있어도 적을 칸 하나는 둔다 */
    return '<div class="field"><label>' + label + '</label>' +
      '<div class="mm-list" data-y="' + key + '">' +
      list.map(nameRow).join('') + '</div>' +
      '<button type="button" class="btn ghost sm mm-add" data-yadd="' + key + '">+ 이름 추가</button>' +
      '</div>';
  }

  /* 한 카드 안의 이름 칸에 명부 찾기를 붙이고, 더하기·지우기를 잇는다 */
  function bindNameRows(card) {
    SHSNames.attachAll(card);

    card.querySelectorAll('button[data-yadd]').forEach(function (b) {
      if (b.dataset.ready) return;
      b.dataset.ready = '1';
      b.addEventListener('click', function () {
        var list = card.querySelector('.mm-list[data-y="' + b.dataset.yadd + '"]');
        var tmp = document.createElement('div');
        tmp.innerHTML = nameRow('');
        var row = tmp.firstChild;
        list.appendChild(row);
        bindNameRows(card);
        row.querySelector('input').focus();
      });
    });

    card.querySelectorAll('button[data-ydel]').forEach(function (b) {
      if (b.dataset.ready) return;
      b.dataset.ready = '1';
      b.addEventListener('click', function () {
        var row = b.parentNode;
        var list = row.parentNode;
        row.parentNode.removeChild(row);
        /* 마지막 한 칸까지 없어지면 적을 곳이 사라지므로 빈 칸을 하나 둔다 */
        if (!list.querySelector('.mm-row')) {
          list.innerHTML = nameRow('');
          bindNameRows(card);
        }
      });
    });
  }

  /* 년조 칸에 적힌 이름을 모아 쉼표로 잇는다 */
  function yearValue(card, key) {
    var list = card.querySelector('.mm-list[data-y="' + key + '"]');
    if (!list) return '';
    return Array.prototype.slice.call(list.querySelectorAll('input'))
      .map(function (i) { return i.value.trim(); })
      .filter(function (x) { return x; })
      .join(', ');
  }

  function renderCommittees() {
    var box = document.getElementById('committee-area');
    SHSCloud.init().then(function (c) {
      return c.from('committees').select('*').order('sort');
    }).then(function (r) {
      if (r.error || !(r.data && r.data.length)) {
        box.innerHTML = '<div class="notice-banner">상비부 정보가 아직 서버에 등록되지 않았습니다. ' +
          '노회 사무실에 문의하여 상비부 등록(03_committees.sql)을 진행해 주세요.</div>';
        return;
      }
      var coms = r.data;
      function nameCount(cm) {
        var keys = SHS.isBoard(cm.name) ? ['members'] : ['y1', 'y2', 'y3'];
        var n = 0;
        keys.forEach(function (k) {
          n += String(cm[k] || '').split(',').filter(function (x) { return x.trim(); }).length;
        });
        return n;
      }
      var html = '<table class="tbl"><thead><tr><th style="width:170px">상비부·위원회</th>' +
        '<th style="width:150px">부장·위원장</th><th style="width:130px">서기</th>' +
        '<th style="width:130px">회계</th><th style="width:110px">배정 인원</th>' +
        '<th style="width:80px">관리</th></tr></thead><tbody>' +
        coms.map(function (cm) {
          return '<tr><td class="left"><strong>' + e(cm.name) + '</strong></td>' +
            '<td>' + e(cm.head || '-') + '</td>' +
            '<td>' + e(cm.clerk || '-') + '</td>' +
            '<td>' + e(cm.treasurer || '-') + '</td>' +
            '<td>' + nameCount(cm) + '명</td>' +
            '<td><button class="btn sm" data-cmedit="' + e(cm.name) + '">수정</button></td></tr>';
        }).join('') + '</tbody></table>';
      box.innerHTML = html;

      function openComEdit(cm) {
        var inner = '<div data-cmt="' + e(cm.name) + '">' +
          '<h3 style="margin:0 0 14px;color:var(--navy)">' + e(cm.name) + ' — 배정 수정</h3>' +
          '<div class="inline-form" style="margin-bottom:8px">' +
          '<div class="field"><label>' + SHS.headTitle(cm.name) + '</label><input type="text" data-names data-f="head" value="' + e(cm.head || '') + '"></div>' +
          '<div class="field"><label>서기</label><input type="text" data-names data-f="clerk" value="' + e(cm.clerk || '') + '"></div>' +
          '<div class="field"><label>회계</label><input type="text" data-names data-f="treasurer" value="' + e(cm.treasurer || '') + '"></div>' +
          '</div>' +
          (SHS.isBoard(cm.name)
            ? '<div class="com-years one">' + yearBox('위원', 'members', cm.members) + '</div>'
            : '<div class="com-years">' +
              yearBox('1년조', 'y1', cm.y1) +
              yearBox('2년조', 'y2', cm.y2) +
              yearBox('3년조', 'y3', cm.y3) + '</div>') +
          '<button class="btn sm" data-cmsave="' + e(cm.name) + '">저장</button>' +
          '<span class="form-msg" data-cmmsg="' + e(cm.name) + '" style="margin-left:10px"></span>' +
          '</div>';
        var mo = adminModal(inner, 940);
        var card0 = mo.ov.querySelector('div[data-cmt]');
        bindNameRows(card0);
        mo.ov.querySelector('button[data-cmsave]').addEventListener('click', function () {
          saveCom(cm.name, card0, mo);
        });
      }
      box.querySelectorAll('button[data-cmedit]').forEach(function (b) {
        b.addEventListener('click', function () {
          var cm = coms.filter(function (x) { return x.name === b.dataset.cmedit; })[0];
          if (cm) openComEdit(cm);
        });
      });

      function saveCom(name, card, mo) {
        {
          var upd = { updated_at: new Date().toISOString() };
          /* 적힌 이름을 회원 명부와 맞춰 늘 같은 모양으로 저장한다.
           * 명부에 없는 이름은 그대로 저장하되 누구인지 알려 준다. */
          var miss = [];
          function note(u) {
            u.forEach(function (x) { if (miss.indexOf(x) === -1) miss.push(x); });
          }
          /* 부장·서기·회계 — 한 사람씩 (이름 직분) */
          card.querySelectorAll('input[data-f]').forEach(function (inp) {
            var r = SHSNames.fix(inp.value, { style: 'withPos' });
            inp.value = r.value;
            upd[inp.dataset.f] = r.value;
            note(r.unknown);
          });
          /* 상비부는 1·2·3년조, 위원회는 위원 — 칸마다 한 사람,
           * 저장은 예전처럼 쉼표로 이어서 한 칸에 넣는다 */
          (SHS.isBoard(name) ? ['members'] : ['y1', 'y2', 'y3']).forEach(function (k) {
            var r = SHSNames.fix(yearValue(card, k), { multi: true, style: 'plain' });
            upd[k] = r.value;
            note(r.unknown);
          });
          var msg = card.querySelector('span[data-cmmsg="' + name + '"]');
          SHSCloud.init().then(function (c) {
            return c.from('committees').update(upd).eq('name', name).select();
          }).then(function (res) {
            var w = SHS.wrote(res);
            if (!w.ok) {
              msg.className = 'form-msg err';
              msg.textContent = w.why;
              return;
            }
            SHSCloud.log('update', '상비부 배정 수정', name);
            if (miss.length) {
              msg.className = 'form-msg err';
              msg.textContent = '저장했습니다. 다만 회원 명부에 없는 이름이 있습니다 — ' + miss.join(', ');
            } else {
              mo.close();
              renderCommittees();
            }
          });
        }
      }
    });
  }

  function render() {
    var accounts = SHSAuth.listAccounts();
    var html = '';
    html += '<div class="notice-banner">회원명단 추가·삭제 권한: <strong>관리자 (노회장, 서기, 간사)</strong></div>';

    /* 승인대기 회원 */
    var pendings = accounts.filter(function (a) { return a.role === 'pending'; });
    if (pendings.length) {
      html += '<h2>승인대기 회원</h2>';
      html += '<p>가입 시 입력한 이름과 소속 교회가 회원명단과 일치하지 않은 회원입니다. 확인 후 정회원으로 설정해 주세요.</p>';
      html += '<table class="tbl"><thead><tr><th>이메일(아이디)</th><th>성명</th><th>직분</th><th>소속 교회</th><th style="width:120px">처리</th></tr></thead><tbody>';
      pendings.forEach(function (a) {
        html += '<tr><td class="left">' + e(a.id) + '</td><td>' + e(a.name) + '</td><td>' + e(a.position) + '</td><td>' + e(a.church) + '</td>' +
          '<td>' + (canApprove ? '<button class="btn sm" data-approve="' + e(a.id) + '">정회원 설정</button>' : '승인 권한 없음') + '</td></tr>';
      });
      html += '</tbody></table>';
    }

    /* 계정 목록 (운영자 계정은 회원 목록에 표시하지 않는다) */
    var visible = accounts.filter(function (a) {
      return a.role !== 'superadmin';
    });
    html += '<h2>홈페이지 회원 목록</h2>';
    html += '<table class="tbl"><thead><tr><th>이메일(아이디)</th><th>성명</th><th>직분</th><th>소속</th><th>연락처</th><th>등급</th>' +
      (isSuper ? '<th style="width:210px">등급 변경</th>' : '') +
      '<th style="width:80px">관리</th></tr></thead><tbody>';
    visible.forEach(function (a) {
      html += '<tr><td class="left">' + e(a.id) + '</td><td>' + e(a.name) + '</td><td>' + e(a.position) + '</td>' +
        '<td>' + e(a.church) + '</td><td>' + e(a.phone || '-') + '</td>' +
        '<td><span class="role-badge">' + SHSAuth.roleName(a.role) + '</span>' +
        (a.title ? '<div style="font-size:0.75rem;color:var(--gray-5);margin-top:2px">' + e(a.title) + '</div>' : '') + '</td>';
      if (isSuper) {
        html += '<td><select data-role-for="' + e(a.id) + '">' +
          ['pending', 'member', 'officer', 'staff', 'clerk', 'president'].map(function (r) {
            return '<option value="' + r + '"' + (a.role === r ? ' selected' : '') + '>' + SHSAuth.roleName(r) + '</option>';
          }).join('') +
          '</select> <button class="btn sm" data-assign="' + e(a.id) + '">적용</button></td>';
      }
      html += '<td><button class="btn danger sm" data-remove="' + e(a.id) + '">삭제</button></td></tr>';
    });
    html += '</tbody></table>';

    /* 회원 추가 */
    html += '<h2>회원 추가</h2>';
    html += '<div class="admin-card" style="max-width:760px"><div class="inline-form">' +
      '<div class="field"><label>이메일(아이디)</label><input type="email" id="na-id" placeholder="hong@naver.com"></div>' +
      '<div class="field"><label>초기 비밀번호</label><input type="text" id="na-pw"></div>' +
      '<div class="field"><label>성명</label><input type="text" id="na-name"></div>' +
      '<div class="field"><label>직분</label><select id="na-pos"><option>목사</option><option>장로</option><option>간사</option></select></div>' +
      '<div class="field"><label>소속 교회</label><input type="text" id="na-church"></div>' +
      '<button class="btn" id="btn-add">추가</button>' +
      '</div><div class="form-msg" id="add-msg"></div>' +
      '<p style="font-size:0.82rem;color:var(--gray-5);margin-top:10px">' +
      '성명과 소속 교회가 노회 임원·회원 명단과 일치하면 해당 등급이 자동 부여되고, ' +
      '일치하지 않으면 승인대기 상태로 생성됩니다. ' +
      (isSuper ? '등급은 위 목록에서 직접 변경할 수 있습니다.' : '직책 지정은 노회 사무실을 통해 처리됩니다.') +
      '</p></div>';

    area.innerHTML = html;
    SHS.sectionize(area);
    bind();
  }

  function bind() {
    area.querySelectorAll('button[data-approve]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.dataset.approve;
        if (!confirm('회원 "' + id + '" 님을 정회원으로 설정하시겠습니까?')) return;
        var r = SHSAuth.approveMember(user, id);
        if (!r.ok) alert(r.msg);
        render();
      });
    });
    area.querySelectorAll('button[data-remove]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.dataset.remove;
        if (!confirm('회원 "' + id + '" 계정을 삭제하시겠습니까?')) return;
        var r = SHSAuth.removeAccount(user, id);
        if (!r.ok) alert(r.msg);
        render();
      });
    });
    area.querySelectorAll('button[data-assign]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.dataset.assign;
        var sel = area.querySelector('select[data-role-for="' + id + '"]');
        var r = SHSAuth.assignRole(user, id, sel.value);
        if (!r.ok) { alert(r.msg); return; }
        alert('등급이 변경되었습니다: ' + id + ' → ' + SHSAuth.roleName(sel.value));
        render();
      });
    });
    document.getElementById('btn-add').addEventListener('click', function () {
      var msg = document.getElementById('add-msg');
      var data = {
        id: document.getElementById('na-id').value.trim().toLowerCase(),
        pw: document.getElementById('na-pw').value,
        name: document.getElementById('na-name').value.trim(),
        position: document.getElementById('na-pos').value,
        church: document.getElementById('na-church').value.trim()
      };
      if (!data.id || !data.pw || !data.name || !data.church) {
        msg.className = 'form-msg err';
        msg.textContent = '이메일, 비밀번호, 성명, 소속 교회는 필수 항목입니다.';
        return;
      }
      var r = SHSAuth.addAccount(user, data);
      if (!r.ok) {
        msg.className = 'form-msg err';
        msg.textContent = r.msg;
        return;
      }
      render();
    });
  }

  /* ---------- 화면 그리기 ----------
   * 등급 목록(GRADES) 등이 모두 정의된 뒤에 그려야 하므로 맨 마지막에 부른다. */
  if (user.cloud) {
    renderCloud();
  } else {
    render();
  }
 });
});
</script>
</body>
</html>
