<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원 관리 - 시화산노회</title>
<link rel="stylesheet" href="css/style.css?v=20260831zi">
</head>
<body>

<div class="page-head">
  <div class="container">
    <h1>회원 관리</h1>
    <div class="crumb">홈 &gt; 임원방 &gt; 회원 관리</div>
  </div>
</div>

<main class="page-body container" id="main">
  <div id="admin-area"><p style="color:var(--gray-5)">불러오는 중...</p></div>
</main>

<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-auth.js"></script>
<script src="js/main.js?v=20260830d"></script>
<script src="js/name-picker.js"></script>
<script src="js/addr-search.js?v=20260830a"></script>
<script src="js/dashboard.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
 SHS.getUser().then(function (user) {
  var area = document.getElementById('admin-area');
  var e = SHS.esc;

  if (!user || !SHSAuth.canManageMembers(user)) {
    area.innerHTML =
      '<div class="notice-banner">회원 관리는 <strong>관리자 등급</strong>이 이용할 수 있습니다.' +
      (user ? ' 현재 등급(' + SHS.displayRole(user.role, user.title) + ')으로는 이용할 수 없습니다.'
            : ' <a class="btn sm" style="margin-left:10px" href="login.html">로그인</a>') +
      '</div>';
    return;
  }

  var isSuper = SHSAuth.canAssignRoles(user);
  var canApprove = SHSAuth.canApproveMembers(user);
  /* 등급 임명 권한: 노회장(서기·간사 등)과 운영자 계정(비상시 전체) */
  var canAppoint = isSuper || user.role === 'president';

  function renderCloud() {
    SHSCloud.init().then(function (c) {
      return c.from('profiles').select('*').order('created_at');
    }).then(function (r) {
      if (r.error) {
        area.innerHTML = '<div class="notice-banner">회원 목록을 불러오지 못했습니다: ' + e(r.error.message) + '</div>';
        return;
      }
      var rows = r.data || [];
      /* 운영자 계정은 회원 목록에 표시하지 않는다 */
      var visible = rows.filter(function (p) { return p.role !== 'superadmin'; });
      var pendings = visible.filter(function (p) { return p.role === 'pending'; });

      var html = '';
      html += '<div class="notice-banner">서버에 등록된 실제 회원 목록입니다. ' +
        '승인대기 회원의 정회원 설정과 회원명단 관리 권한: <strong>관리자 (노회장, 서기, 간사)</strong></div>';

      if (pendings.length) {
        html += '<h2>승인대기 회원</h2>';
        html += '<p>가입 시 입력한 이름과 소속 교회가 노회 명단과 일치하지 않은 회원입니다. 확인 후 정회원으로 설정해 주세요.</p>';
        html += '<table class="tbl"><thead><tr><th>이메일</th><th>성명</th><th>직분</th><th>소속 교회</th><th style="width:130px">처리</th></tr></thead><tbody>';
        pendings.forEach(function (p) {
          html += '<tr><td class="left">' + e(p.email) + '</td><td>' + e(p.name || '-') + '</td>' +
            '<td>' + e(p.position || '-') + '</td><td>' + e(p.church || '-') + '</td>' +
            '<td>' + (canApprove ? '<button class="btn sm" data-capprove="' + e(p.id) + '">정회원 설정</button>' : '승인 권한 없음') + '</td></tr>';
        });
        html += '</tbody></table>';
      }

      html += '<h2>회원 목록 (' + visible.length + '명)</h2>';
      html += '<div class="notice-banner">개인정보(생년월일·연락처·주소)는 <strong>**</strong>로 가려서 표시됩니다. ' +
        '<strong>열람</strong>을 누르면 내용이 표시되며, <strong>열람 기록은 감사 기록에 남습니다.</strong></div>';
      html += '<table class="tbl"><thead><tr><th>이메일</th><th>성명</th><th>직분</th><th>소속</th>' +
        '<th style="width:150px">개인정보</th><th style="width:185px">정년 (만 70세)</th>' +
        '<th style="width:150px">남은 임기</th><th>등급</th>' +
        '<th style="width:110px">자격</th>' +
        (canAppoint ? '<th style="width:200px">등급 임명</th>' : '') + '</tr></thead><tbody>';
      visible.forEach(function (p) {
        var cur = gradeValue(p);
        var issue = SHS.membershipIssue(p);
        var expired = p.role === 'member' && issue && !p.suspended && issue.indexOf('승인대기') === -1;
        html += '<tr><td class="left">' + e(p.email) + '</td><td>' + e(p.name || '-') + '</td>' +
          '<td>' + e(p.position || '-') + '</td><td>' + e(p.church || '-') + '</td>' +
          /* 개인정보: 가려서 표시하고 열람 버튼 제공 */
          '<td><span id="pi-' + e(p.id) + '">**</span><br>' +
          '<button class="btn ghost sm" data-piview="' + e(p.id) + '" style="margin-top:4px">열람</button></td>' +
          '<td style="font-size:0.82rem">' +
          '<input type="date" data-birth="' + e(p.id) + '" value="' + e(p.birth_date || '') + '" ' +
          'style="font-size:0.82rem;padding:4px 6px">' +
          '<div style="margin-top:3px">' +
          (SHS.retireDate(p.birth_date) && SHS.retireDate(p.birth_date) <= new Date()
            ? '<span class="fail">' + e(SHS.retireLabel(p)) + '</span>'
            : e(SHS.retireLabel(p))) + '</div></td>' +
          '<td style="font-size:0.82rem">' + e(SHS.termLabel(p)) + '</td>' +
          '<td><span class="role-badge">' + SHS.displayRole(p.role, p.title) + '</span>' +
          (p.title ? '<div style="font-size:0.75rem;color:var(--gray-5);margin-top:2px">' + e(p.title) + '</div>' : '') + '</td>' +
          '<td>' +
          (p.suspended
            ? '<div style="color:var(--red);font-size:0.8rem;margin-bottom:4px">정지됨</div>' +
              '<button class="btn ghost sm" data-cresume="' + e(p.id) + '" data-cname="' + e(p.name || '') + '">해제</button>'
            : (expired
                ? '<div style="color:var(--red);font-size:0.78rem">' + e(issue) + '</div>'
                : '<button class="btn danger sm" data-csuspend="' + e(p.id) + '" data-cname="' + e(p.name || '') + '">정지</button>')) +
          '</td>';
        if (canAppoint) {
          html += '<td><select data-crole="' + e(p.id) + '">' +
            assignable().map(function (g) {
              return '<option value="' + g.v + '"' + (cur === g.v ? ' selected' : '') + '>' + g.t + '</option>';
            }).join('') +
            '</select> <button class="btn sm" data-cassign="' + e(p.id) + '">임명</button></td>';
        }
        html += '</tr>';
      });
      html += '</tbody></table>';
      html += '<p style="font-size:0.82rem;color:var(--gray-5)">' +
        '· 총회 정년은 만 70세이며, <strong>정년이 지나면 등급과 상관없이 정회원 자격이 상실</strong>됩니다. ' +
        '정회원 전용 자료도 열람할 수 없습니다.<br>' +
        '· 생년월일이 없으면 정년을 계산할 수 없습니다. ' +
        '<strong>정년 칸의 날짜를 고치시면 관리자가 대신 입력</strong>할 수 있고, 곧바로 저장됩니다. ' +
        '입력 기록은 감사 기록에 남습니다.<br>' +
        '· 장로 총대는 다음 봄 정기노회까지 자격이 유지되며, 총대로 다시 등록되지 않으면 자격이 상실됩니다. ' +
        '아래 <strong>총대 자격 기간 일괄 설정</strong>으로 만료일을 지정할 수 있습니다.<br>' +
        '· 계정 삭제는 회원 본인이 내 정보에서 탈퇴하거나, 노회 사무실에서 처리합니다.</p>';

      /* 총대 자격 기간 일괄 설정 */
      var nextSpring = SHS.nthMonday(new Date().getFullYear() + (new Date().getMonth() >= 3 ? 1 : 0), 4, 2);
      var nsStr = nextSpring.toISOString().slice(0, 10);
      html += '<div class="admin-card" style="max-width:760px"><h3 style="margin-top:0">총대 자격 기간 일괄 설정</h3>' +
        '<p style="font-size:0.86rem;color:var(--gray-7)">장로 총대의 자격 만료일을 한 번에 지정합니다. ' +
        '기본값은 다음 봄 정기노회일입니다. 만료일이 지나면 정회원 자격이 자동으로 상실됩니다.</p>' +
        '<div class="inline-form">' +
        '<div class="field" style="flex:0 0 180px"><label>만료일</label><input type="date" id="mu-date" value="' + nsStr + '"></div>' +
        '<div class="field" style="flex:0 0 160px"><label>대상 직분</label><select id="mu-pos"><option value="장로">장로</option><option value="">전체 정회원</option></select></div>' +
        '<button class="btn" id="mu-apply">일괄 적용</button>' +
        '</div><div class="form-msg" id="mu-msg"></div></div>';

      /* 노회 명단·상비부 관리 영역 */
      html += '<h2>노회 명단 관리</h2>';
      html += '<p>가입 시 등급 자동 부여의 기준이 되는 명단입니다. 성명과 소속 교회가 이 명단과 일치하면 해당 등급이 자동으로 부여됩니다.</p>';
      html += '<div id="roster-area"><p style="color:var(--gray-5)">명단을 불러오는 중...</p></div>';
      html += '<h2>교회 관리</h2>';
      html += '<div id="church-area"><p style="color:var(--gray-5)">교회 명부를 불러오는 중...</p></div>';
      html += '<h2>장로 총대 자격</h2>';
      html += '<div id="elder-area"><p style="color:var(--gray-5)">장로 총대를 불러오는 중...</p></div>';
      html += '<h2>총회 총대</h2>';
      html += '<div id="delegate-area"><p style="color:var(--gray-5)">총대 명단을 불러오는 중...</p></div>';
      html += '<h2>이사 관리</h2>';
      html += '<div id="board-area"><p style="color:var(--gray-5)">이사 명단을 불러오는 중...</p></div>';
      html += '<h2>시찰회 관리</h2>';
      html += '<div id="sichal-area"><p style="color:var(--gray-5)">시찰 정보를 불러오는 중...</p></div>';
      html += '<h2>상비부 배정 관리</h2>';
      html += '<div id="committee-area"><p style="color:var(--gray-5)">상비부 정보를 불러오는 중...</p></div>';
      /* 상비부 대시보드는 예전에 따로 있던 화면이었으나 여기 탭으로 들어왔다.
       * 그리는 일은 js/dashboard.js 한 곳에 있으므로 상비부 대시보드 화면과
       * 늘 같은 모습이다. */
      html += '<h2>상비부 대시보드</h2>';
      html += '<div id="db-panel"><p style="color:var(--gray-5)">상비부 대시보드를 불러오는 중...</p></div>';

      area.innerHTML = html;
      SHS.sectionize(area);
      SHSDash.mount(document.getElementById('db-panel'), user);
      renderRoster();
      renderChurches();
      renderElders();
      renderDelegates();
      renderBoards();
      renderSichals();
      renderCommittees();

      function updateRole(id, grade, label) {
        var g = parseGrade(grade);
        SHSCloud.init().then(function (c) {
          return c.rpc('set_member_role', { p_id: id, p_role: g.role, p_title: g.title });
        }).then(function (res) {
          if (res.error) { alert('처리하지 못했습니다: ' + res.error.message); return; }
          SHSCloud.log('update', label, '대상 ' + id + ' → ' + gradeLabel(grade));
          alert('처리되었습니다.');
          renderCloud();
        });
      }

      area.querySelectorAll('button[data-capprove]').forEach(function (b) {
        b.addEventListener('click', function () {
          if (!confirm('이 회원을 정회원으로 설정하시겠습니까?')) return;
          SHSCloud.init().then(function (c) {
            return c.rpc('approve_member', { p_id: b.dataset.capprove });
          }).then(function (res) {
            if (res.error) { alert('처리하지 못했습니다: ' + res.error.message); return; }
            SHSCloud.log('update', '정회원 승인', '대상 ' + b.dataset.capprove);
            renderCloud();
          });
        });
      });
      area.querySelectorAll('button[data-cassign]').forEach(function (b) {
        b.addEventListener('click', function () {
          var sel = area.querySelector('select[data-crole="' + b.dataset.cassign + '"]');
          if (!confirm('등급을 ' + gradeLabel(sel.value) + '(으)로 임명하시겠습니까?')) return;
          updateRole(b.dataset.cassign, sel.value, '등급 변경');
        });
      });

      /* 개인정보 열람 (열람 기록을 감사 기록에 남긴다) */
      /* 관리자가 생년월일을 대신 입력할 수 있다. 고치면 바로 저장된다. */
      area.querySelectorAll('input[data-birth]').forEach(function (inp) {
        inp.addEventListener('change', function () {
          var id = inp.dataset.birth;
          var p = rows.filter(function (x) { return String(x.id) === id; })[0];
          var v = inp.value || null;
          SHSCloud.init().then(function (c) {
            return c.from('profiles').update({ birth_date: v }).eq('id', id);
          }).then(function (res) {
            if (res.error) { alert('저장하지 못했습니다: ' + res.error.message); return; }
            SHSCloud.log('update', '생년월일 입력', (p ? p.name : id) + ' → ' + (v || '(지움)'));
            renderCloud();
          });
        });
      });

      area.querySelectorAll('button[data-piview]').forEach(function (b) {
        b.addEventListener('click', function () {
          var id = b.dataset.piview;
          var p = rows.filter(function (x) { return String(x.id) === id; })[0];
          if (!p) return;
          if (!confirm('개인정보를 열람하시겠습니까?\n열람 기록이 감사 기록에 남습니다.')) return;
          var span = document.getElementById('pi-' + id);
          span.innerHTML =
            '<span style="font-size:0.82rem">' +
            '생년월일 ' + e(p.birth_date || '-') + '<br>' +
            '연락처 ' + e(p.phone || '-') + '<br>' +
            '주소 ' + e(p.address || '-') + '</span>';
          b.remove();
          SHSCloud.log('view', '개인정보 열람',
            (p.name || p.email) + ' — 생년월일·연락처·주소 열람');
        });
      });

      /* 정회원 자격 정지 / 해제 */
      function setSuspended(id, name, val) {
        SHSCloud.init().then(function (c) {
          return c.from('profiles').update({ suspended: val, updated_at: new Date().toISOString() }).eq('id', id);
        }).then(function (res) {
          if (res.error) { alert('처리하지 못했습니다: ' + res.error.message); return; }
          SHSCloud.log('update', val ? '정회원 자격 정지' : '정회원 자격 해제', name || id);
          renderCloud();
        });
      }
      area.querySelectorAll('button[data-csuspend]').forEach(function (b) {
        b.addEventListener('click', function () {
          if (!confirm('"' + b.dataset.cname + '" 님의 정회원 자격을 정지하시겠습니까?\n' +
                       '정지되면 정회원 전용 자료를 열람할 수 없습니다.')) return;
          setSuspended(b.dataset.csuspend, b.dataset.cname, true);
        });
      });
      area.querySelectorAll('button[data-cresume]').forEach(function (b) {
        b.addEventListener('click', function () {
          if (!confirm('"' + b.dataset.cname + '" 님의 정회원 자격 정지를 해제하시겠습니까?')) return;
          setSuspended(b.dataset.cresume, b.dataset.cname, false);
        });
      });

      /* 총대 자격 기간 일괄 설정 */
      var muBtn = document.getElementById('mu-apply');
      if (muBtn) muBtn.addEventListener('click', function () {
        var msg = document.getElementById('mu-msg');
        var until = document.getElementById('mu-date').value;
        var pos = document.getElementById('mu-pos').value;
        if (!until) { msg.className = 'form-msg err'; msg.textContent = '만료일을 선택해 주세요.'; return; }
        if (!confirm((pos ? pos + ' 직분' : '전체 정회원') + '의 자격 만료일을 ' + until + '로 설정하시겠습니까?')) return;
        SHSCloud.init().then(function (c) {
          var q = c.from('profiles').update({ member_until: until, updated_at: new Date().toISOString() })
            .eq('role', 'member');
          if (pos) q = q.eq('position', pos);
          return q;
        }).then(function (res) {
          if (res.error) { msg.className = 'form-msg err'; msg.textContent = res.error.message; return; }
          SHSCloud.log('update', '총대 자격 기간 설정', (pos || '전체 정회원') + ' → ' + until);
          msg.className = 'form-msg ok';
          msg.textContent = '설정되었습니다.';
          renderCloud();
        });
      });
    });
  }

  /* ---------- 등급·직책 체계 ----------
   * 노회 임원 직책: 회록부서기, 회록서기, 부서기, 서기, 부회계, 회계,
   *                부노회장, (장로)부노회장, 노회장  (그 외: 간사, 정회원, 승인대기)
   * 서기·노회장·간사는 홈페이지 관리 권한을 함께 갖는다. */
  var GRADES = [
    { v: 'pending', t: '승인대기', role: 'pending', title: null },
    /* 총회 정년(만 70세)이 지나면 정회원이 아니라 일반회원이 된다 */
    { v: 'general', t: '일반회원', role: 'general', title: null },
    { v: 'member', t: '정회원', role: 'member', title: null },
    { v: 'staff', t: '간사', role: 'staff', title: '간사' },
    { v: 'officer:회록부서기', t: '회록부서기', role: 'officer', title: '회록부서기' },
    { v: 'officer:회록서기', t: '회록서기', role: 'officer', title: '회록서기' },
    { v: 'officer:부서기', t: '부서기', role: 'officer', title: '부서기' },
    { v: 'clerk', t: '서기', role: 'clerk', title: '서기' },
    { v: 'officer:부회계', t: '부회계', role: 'officer', title: '부회계' },
    { v: 'officer:회계', t: '회계', role: 'officer', title: '회계' },
    { v: 'officer:부노회장', t: '부노회장', role: 'officer', title: '부노회장' },
    { v: 'officer:(장로)부노회장', t: '(장로)부노회장', role: 'officer', title: '(장로)부노회장' },
    { v: 'president', t: '노회장', role: 'president', title: '노회장' }
  ];
  function parseGrade(v) {
    for (var i = 0; i < GRADES.length; i++) if (GRADES[i].v === v) return GRADES[i];
    return { role: v, title: null };
  }
  function gradeLabel(v) {
    var g = parseGrade(v);
    return g.t || v;
  }
  function gradeValue(p) {
    if (p.role === 'officer' && p.title) return 'officer:' + p.title;
    return p.role;
  }

  /* 임명할 수 있는 등급 목록
   * · 노회장    : 서기·간사 등 관리자와 임원 직책 (노회장 등급은 권한 이양으로만)
   * · 운영자 계정 : 비상시 노회장을 포함해 전부 */
  function assignable() {
    if (isSuper) return GRADES;
    return GRADES.filter(function (g) { return g.role !== 'president' && g.role !== 'superadmin'; });
  }

  /* ---------- 노회 명단 관리 (추가·수정·삭제) ---------- */
  var ROSTER_ROLES = { member: '정회원', general: '일반회원', officer: '임원',
                       president: '노회장', clerk: '서기', staff: '간사', pending: '승인대기' };

  /* 정년(만 70세)이 지났는가 — SHS 의 판정을 그대로 쓴다 */
  function overAge(birth) {
    var rd = SHS.retireDate(birth);
    return !!(rd && rd <= new Date());
  }
  /* 명단 한 줄의 등급 고르개 값.
   * 총회 정년(만 70세)이 지난 분은 정회원·임원 대신 일반회원으로 보여 준다. */
  function rosterGrade(m) {
    var v = (m.role === 'officer' && m.officer_title) ? 'officer:' + m.officer_title
                                                      : (m.role || 'member');
    if (overAge(m.birth_date) && ['member', 'officer'].indexOf(parseGrade(v).role) !== -1) {
      return 'general';
    }
    return v;
  }
  function gradeOptions(v) {
    return assignable().map(function (g) {
      return '<option value="' + g.v + '"' + (g.v === v ? ' selected' : '') + '>' + e(g.t) + '</option>';
    }).join('');
  }

  /* 직분 — 예전의 <직분>과 <조직 분류>를 하나로 합쳤다.
   * 노회 사무실 간사는 <직원>으로 둔다. */
  var CATEGORIES = ['목사', '부목사', '강도사', '전도사', '원로목사', '은퇴목사', '무임목사', '장로', '직원'];

  /* 시무 교회가 없는 분류는 교회 칸을 비우면 이 말이 대신 들어간다.
   * (명단은 교회 칸을 비워 둘 수 없으므로 상태를 적어 둔다) */
  var NO_CHURCH = { '무임목사': '무임', '은퇴목사': '은퇴', '원로목사': '원로',
                    '직원': '노회 사무실' };

  /* 직원(간사)은 노회 사무실 일을 맡으므로 관리자 등급을 함께 갖는다 */
  var AUTO_GRADE = { '직원': 'staff' };
  function churchFor(church, category) {
    if (church) return church;
    return NO_CHURCH[category] || '';
  }

  var rosterFlash = '';   /* 저장 뒤 다시 그려도 남겨 둘 알림말 */


  /* ================= 교회 관리 =================
   * 회원교회의 기준 데이터베이스다. 여기 내용이 조직>회원교회와
   * 시찰 페이지의 교회 정보에 그대로 연동된다.
   * 교회마다 목사·원로목사·부목사·장로(시무·원로·은퇴·협동)를 관리하고,
   * 시무장로가 있는 교회의 담임목사는 저절로 위임목사로 표기된다.
   * 총대장로 표시는 노회 명단의 장로와 짝을 이룬다. */
  var chStaff = [], chChurches = [], chRoster = [], chSel = '';
  var chModalOpen = false;
  var chFilter = { sichal: '', org: '', q: '' };   /* 목록 필터 (시찰·당회·이름) */
  var CH_ROLES = ['목사', '원로목사', '부목사', '시무장로', '원로장로', '은퇴장로', '협동장로'];

  function chKey(t) {
    return String(t || '').replace(/\s/g, '').replace(/교회$/, '');
  }

  function renderChurches() {
    var box = document.getElementById('church-area');
    if (!box) return;
    SHSCloud.init().then(function (c) {
      return Promise.all([
        c.from('sichal_churches').select('*').order('sichal').order('sort').order('id'),
        c.from('church_staff').select('*').order('sort').order('id'),
        c.from('roster').select('id,name,church,category,position,birth_date,phone,served_from,address,postcode')
      ]);
    }).then(function (rs) {
      if (rs[1].error) throw rs[1].error;
      chChurches = (rs[0].data) || [];
      chStaff = (rs[1].data) || [];
      chRoster = (rs[2].data) || [];
      /* 명부에만 있는 교회도 목록에 넣는다 */
      var seen = {};
      chChurches.forEach(function (x) { seen[chKey(x.name)] = 1; });
      chStaff.forEach(function (x) {
        if (!seen[chKey(x.church)]) {
          seen[chKey(x.church)] = 1;
          chChurches.push({ id: null, sichal: '기타', name: x.church });
        }
      });
      drawChurches();
    }).catch(function (x) {
      box.innerHTML = '<div class="notice-banner">교회 명부를 불러오지 못했습니다: ' +
        e((x && x.message) || x) + '</div>';
    });
  }

  function chRosterOf(name) {
    return chRoster.filter(function (r) { return r.name === name; })[0] || null;
  }
  function chStaffOf(church) {
    return chStaff.filter(function (x) { return chKey(x.church) === chKey(church); });
  }
  function chPastorOf(church) {
    return chRoster.filter(function (r) {
      return r.category === '목사' && chKey(r.church) === chKey(church);
    })[0] || null;
  }
  function chOrganized(church) {
    return chStaffOf(church).some(function (x) { return x.role === '시무장로'; });
  }
  function chSichalNames() {
    var out = [];
    chChurches.forEach(function (x) {
      if (x.sichal && out.indexOf(x.sichal) === -1) out.push(x.sichal);
    });
    ['북부시찰', '상록시찰', '남부시찰'].forEach(function (n) {
      if (out.indexOf(n) === -1) out.push(n);
    });
    return out;
  }

  function drawChurches() {
    var box = document.getElementById('church-area');
    var orgCnt = chChurches.filter(function (x) { return chOrganized(x.name); }).length;

    var h = '<div class="notice-banner">여기가 회원교회의 <strong>기준 데이터베이스</strong>입니다. ' +
      '이 내용이 조직의 회원교회 목록과 시찰 페이지의 교회 정보에 그대로 연동됩니다. ' +
      '<strong>시무장로가 있는 교회(조직교회)의 담임목사는 명단에 위임목사로 저절로 표기</strong>되고, ' +
      '<strong>총대장로</strong> 표시는 노회 명단의 장로와 짝을 이룹니다.</div>';

    /* ----- 전체 교회 목록 (시찰·당회·이름으로 거른다) ----- */
    var shown = chChurches.filter(function (x) {
      if (chFilter.sichal && (x.sichal || '기타') !== chFilter.sichal) return false;
      if (chFilter.org === '조직' && !chOrganized(x.name)) return false;
      if (chFilter.org === '미조직' && chOrganized(x.name)) return false;
      if (chFilter.q && String(x.name || '').indexOf(chFilter.q) === -1) return false;
      return true;
    });

    h += '<div class="inline-form" style="margin-bottom:4px">' +
      '<div class="field" style="flex:0 0 150px"><label>시찰</label><select id="chf-sichal">' +
      '<option value="">시찰 전체</option>' +
      chSichalNames().concat(['기타']).filter(function (n, i, a) { return a.indexOf(n) === i; })
        .map(function (n) {
          return '<option' + (chFilter.sichal === n ? ' selected' : '') + '>' + e(n) + '</option>';
        }).join('') + '</select></div>' +
      '<div class="field" style="flex:0 0 150px"><label>당회</label><select id="chf-org">' +
      ['', '조직', '미조직'].map(function (v) {
        return '<option value="' + v + '"' + (chFilter.org === v ? ' selected' : '') + '>' +
          (v || '당회 전체') + '</option>';
      }).join('') + '</select></div>' +
      '<div class="field" style="flex:0 0 220px"><label>교회 이름</label>' +
      '<input type="search" id="chf-q" value="' + e(chFilter.q) + '" placeholder="교회 이름으로 찾기"></div>' +
      '<button class="btn ghost sm" id="chf-clear" style="align-self:flex-end">지우기</button>' +
      '</div>';

    h += '<p style="font-size:0.9rem;color:var(--gray-7)">전체 <strong>' + chChurches.length +
      '곳</strong> · 당회가 있는 교회(조직교회) <strong>' + orgCnt + '곳</strong>' +
      (shown.length !== chChurches.length ? ' · 지금 <strong>' + shown.length + '곳</strong> 표시' : '') + '</p>';
    h += '<table class="tbl"><thead><tr><th style="width:90px">시찰</th><th style="width:170px">교회</th>' +
      '<th style="width:150px">담임</th><th style="width:80px">당회</th>' +
      '<th style="width:110px">교역자·장로</th><th>홈페이지</th><th style="width:70px">관리</th></tr></thead><tbody>';
    if (!shown.length) {
      h += '<tr><td colspan="7" style="color:var(--gray-5)">조건에 맞는 교회가 없습니다.</td></tr>';
    }
    shown.forEach(function (x) {
      var pr = chPastorOf(x.name);
      var cnt = chStaffOf(x.name).length;
      h += '<tr>' +
        '<td>' + e(x.sichal || '기타') + '</td>' +
        '<td class="left"><strong>' + e(x.name) + '</strong></td>' +
        '<td>' + (pr ? e(pr.name) + (pr.position === '위임목사' || pr.position === '시무목사'
          ? ' <span style="color:var(--gray-5);font-size:0.8rem">(' + e(pr.position) + ')</span>' : '')
          : '<span style="color:var(--gray-5)">-</span>') + '</td>' +
        '<td>' + (chOrganized(x.name) ? '조직' : '<span style="color:var(--gray-5)">미조직</span>') + '</td>' +
        '<td>' + cnt + '명</td>' +
        '<td class="left" style="font-size:0.82rem">' + (x.url ? e(x.url) : '<span style="color:var(--gray-5)">-</span>') + '</td>' +
        '<td><button class="btn ghost sm" data-chsel="' + e(x.name) + '">수정</button></td></tr>';
    });
    h += '</tbody></table>';

    /* ----- 새 교회 추가 ----- */
    h += '<div class="inline-form" style="margin:10px 0 22px">' +
      '<div class="field" style="flex:0 0 200px"><label>새 교회 이름</label><input type="text" id="chn-name" placeholder="예: 반월교회"></div>' +
      '<div class="field" style="flex:0 0 140px"><label>시찰</label><select id="chn-sichal">' +
      chSichalNames().map(function (n) { return '<option>' + e(n) + '</option>'; }).join('') + '</select></div>' +
      '<button class="btn sm" id="chn-add" style="align-self:flex-end">교회 추가</button>' +
      '<span class="form-msg" id="chn-msg" style="margin:0;align-self:flex-end"></span></div>';

    box.innerHTML = h;

    box.querySelectorAll('button[data-chsel]').forEach(function (b) {
      b.addEventListener('click', function () {
        chSel = b.dataset.chsel;
        chModalOpen = true;
        openChurchModal();
      });
    });

    /* 필터 */
    document.getElementById('chf-sichal').addEventListener('change', function () {
      chFilter.sichal = this.value; drawChurches();
    });
    document.getElementById('chf-org').addEventListener('change', function () {
      chFilter.org = this.value; drawChurches();
    });
    var chfQ = document.getElementById('chf-q');
    chfQ.addEventListener('input', function () {
      chFilter.q = this.value.trim();
      drawChurches();
      var q2 = document.getElementById('chf-q');
      q2.focus();
      q2.setSelectionRange(q2.value.length, q2.value.length);
    });
    document.getElementById('chf-clear').addEventListener('click', function () {
      chFilter = { sichal: '', org: '', q: '' };
      drawChurches();
    });

    document.getElementById('chn-add').addEventListener('click', function () {
      var msg = document.getElementById('chn-msg');
      var name = document.getElementById('chn-name').value.trim();
      if (!name) { msg.className = 'form-msg err'; msg.textContent = '교회 이름을 적어 주세요.'; return; }
      SHSCloud.init().then(function (c) {
        return c.from('sichal_churches').insert({
          name: name, sichal: document.getElementById('chn-sichal').value,
          sort: (chChurches.length + 1) * 10, updated_by: user.name
        }).select();
      }).then(function (r) {
        var w = SHS.wrote(r);
        if (!w.ok) { msg.className = 'form-msg err'; msg.textContent = w.why; return; }
        SHSCloud.log('create', '교회 추가', name);
        chSel = name;
        renderChurches();
      });
    });

    /* 명부를 고친 뒤 다시 그릴 때 팝업이 열려 있었다면 새 내용으로 다시 연다 */
    if (chModalOpen && chSel) openChurchModal();
  }

  /* ----- 수정 팝업 ----- */
  function openChurchModal() {
    var old = document.getElementById('ch-modal');
    if (old) old.remove();
    var ov = document.createElement('div');
    ov.id = 'ch-modal';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(15,25,45,.55);z-index:300;' +
      'display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;overflow:auto';
    ov.innerHTML = '<div style="background:#fff;border-radius:8px;max-width:1040px;width:100%;' +
      'box-shadow:0 10px 40px rgba(0,0,0,.25);padding:24px 28px 24px;position:relative;overflow:hidden">' +
      '<button id="ch-modal-x" aria-label="닫기" style="position:absolute;top:10px;right:14px;' +
      'border:none;background:none;font-size:1.4rem;color:var(--gray-5);cursor:pointer">&times;</button>' +
      churchEditor() + '</div>';
    document.body.appendChild(ov);
    function close() {
      chModalOpen = false;
      ov.remove();
    }
    ov.addEventListener('click', function (ev) { if (ev.target === ov) close(); });
    document.getElementById('ch-modal-x').addEventListener('click', close);
    bindChurchEditor();
  }

  /* ----- 고른 교회: 교회 정보 + 직원 명부 ----- */
  function churchEditor() {
    var row = chChurches.filter(function (x) { return chKey(x.name) === chKey(chSel); })[0] || {};
    var staff = chStaffOf(chSel);
    var organized = chOrganized(chSel);

    var h = '<div id="chv-card">' +
      '<h3 style="margin:0 0 4px;color:var(--navy)">' + e(chSel) + '</h3>' +
      '<p style="font-size:0.85rem;color:var(--gray-7);margin:0 0 12px">' +
      (organized
        ? '조직교회 (시무장로 있음 · 담임은 위임목사로 표기 — 위임식 전이면 명단 관리에서 직분을 <strong>시무목사</strong>로 바꾸면 그대로 유지됩니다)'
        : '미조직교회 (시무장로 없음)') + '</p>';

    /* 교회 정보 */
    h += '<h4 class="mn-sub">교회 정보</h4>' +
      '<div class="inline-form">' +
      '<div class="field" style="flex:0 0 190px"><label>교회 이름</label>' +
      '<input type="text" id="chv-name" value="' + e(row.name || chSel) + '"></div>' +
      '<div class="field" style="flex:0 0 140px"><label>시찰</label><select id="chv-sichal">' +
      chSichalNames().map(function (n) {
        return '<option' + (n === row.sichal ? ' selected' : '') + '>' + e(n) + '</option>';
      }).join('') + '</select></div>' +
      '<div class="field"><label>홈페이지 주소</label><input type="text" id="chv-url" value="' + e(row.url || '') + '"></div>' +
      '</div>' +
      '<div class="inline-form">' +
      '<div class="field" style="flex:1 1 300px"><label>교회 주소</label>' +
      '<input type="text" id="chv-addr" value="' + e((chPastorOf(chSel) || {}).address || '') + '"' +
      (chPastorOf(chSel) ? '' : ' disabled placeholder="담임목사를 먼저 지정하면 적을 수 있습니다"') + '></div>' +
      '<div class="field" style="flex:0 0 120px"><label>우편번호</label>' +
      '<input type="text" id="chv-post" value="' + e((chPastorOf(chSel) || {}).postcode || '') + '"' +
      (chPastorOf(chSel) ? '' : ' disabled') + '></div>' +
      (chPastorOf(chSel)
        ? '<button class="btn ghost sm" data-addrsearch="chv-addr,chv-post" ' +
          'style="align-self:flex-end;margin-bottom:2px">주소 검색</button>' : '') +
      '</div>' +
      '<div class="field"><label>비고</label><input type="text" id="chv-note" value="' + e(row.note || '') + '"></div>' +
      '<p style="font-size:0.8rem;color:var(--gray-5)">교회 이름을 바꾸면 교회 명부와 노회 명단의 소속 교회 이름도 함께 바뀝니다. ' +
      '주소는 담임목사의 회원 명단 주소와 하나로 연동됩니다 — 여기서 고치면 명단과 증명서에도 그대로 쓰입니다.</p>' +
      '<button class="btn sm" id="chv-save"' + (row.id ? '' : ' disabled title="관내 교회 목록에 없는 교회입니다"') + '>교회 정보 저장</button> ' +
      (row.id ? '<button class="btn danger sm" id="chv-del">교회 삭제</button>' : '') +
      '<span class="form-msg" id="chv-msg" style="margin-left:10px"></span>';

    /* 직원 명부 */
    h += '<h4 class="mn-sub" style="margin-top:20px">교역자·장로 명부</h4>';
    if (!staff.length) {
      h += '<p style="color:var(--gray-5)">등록된 교역자·장로가 없습니다. 아래에서 추가해 주세요.</p>';
    } else {
      h += '<div style="overflow-x:auto">' +
        '<table class="tbl" style="min-width:860px"><thead><tr>' +
        '<th style="width:80px">구분</th><th style="width:120px">성명</th>' +
        '<th style="width:130px">생년월일</th><th style="width:130px">장립일</th>' +
        '<th style="width:140px">연락처</th><th style="width:64px">총대</th>' +
        '<th style="width:120px">명단 연동</th><th style="width:110px">관리</th></tr></thead><tbody>';
      CH_ROLES.forEach(function (role) {
        staff.filter(function (x) { return x.role === role; }).forEach(function (x) {
          var ro = x.roster_id

            : chRosterOf(x.name);

            '<td><input type="text" data-cf="phone" value="' + e(x.phone || (ro && ro.phone) || '') +
            '" placeholder="010-0000-0000" style="width:100%;min-width:0;box-sizing:border-box"></td>' +
            '<td>' + (isElder
              ? '<input type="checkbox" data-cf="is_chongdae"' + (x.is_chongdae ? ' checked' : '') + ' style="width:auto">'
              : '-') + '</td>' +
            '<td style="font-size:0.78rem;color:var(--gray-5)">' +
            (ro ? '노회 회원' + (ro.position ? '<br>(' + e(ro.position) + ')' : '') : '명단에 없음') +
            (isElder && x.is_chongdae && !(ro && ro.category === '장로')
              ? '<br><span class="fail">명단에 장로로 없음</span>' : '') +
            '</td>' +
            '<td style="white-space:nowrap"><button class="btn sm" data-cssave="' + x.id + '">저장</button> ' +
            '<button class="btn danger sm" data-csdel="' + x.id + '" data-csn="' + e(x.name) + '">삭제</button>' +
            (role === '목사' && !ro
              ? '<div style="margin-top:4px"><button class="btn ghost sm" data-cshead="' + x.id +
                '" data-csn2="' + e(x.name) + '">담임 지정</button></div>' : '') + '</td>' +
            '</tr>';
        });
      });
      h += '</tbody></table></div>';
    }

    h += '<div class="inline-form" style="margin-top:14px;align-items:flex-end">' +
      '<div class="field" style="flex:0 0 120px"><label>구분</label><select id="cs-role">' +
      CH_ROLES.map(function (r) { return '<option>' + r + '</option>'; }).join('') + '</select></div>' +
      '<div class="field" style="flex:0 0 130px"><label>성명</label><input type="text" id="cs-name"></div>' +
      '<div class="field" style="flex:0 0 150px"><label>생년월일</label><input type="date" id="cs-birth"></div>' +
      '<div class="field" style="flex:0 0 150px"><label>장립일 (장로)</label><input type="date" id="cs-ordained"></div>' +
      '<div class="field" style="flex:0 0 160px"><label>연락처</label><input type="text" id="cs-phone" placeholder="010-0000-0000"></div>' +
      '<div class="field" style="flex:0 0 100px"><label>총대장로</label><input type="checkbox" id="cs-chongdae" style="width:auto;margin-top:10px"></div>' +
      '<button class="btn" id="cs-add" style="align-self:flex-end">추가</button>' +
      '</div>' +
      '<p style="font-size:0.8rem;color:var(--gray-5)">성명이 노회 명단과 같으면 자동으로 연동되어 ' +
      '생년월일·연락처를 명단에서 가져옵니다.</p>' +
      '<div class="form-msg" id="cs-msg"></div></div>';
    return h;
  }

  function bindChurchEditor() {
    var box = document.getElementById('ch-modal') || document.getElementById('church-area');
    var row = chChurches.filter(function (x) { return chKey(x.name) === chKey(chSel); })[0] || {};

    /* ----- 교회 정보 저장 (이름을 바꾸면 명부·명단도 함께) ----- */
    var sv = document.getElementById('chv-save');
    if (sv) sv.addEventListener('click', function () {
      var msg = document.getElementById('chv-msg');
      var newName = document.getElementById('chv-name').value.trim();
      if (!newName) { msg.className = 'form-msg err'; msg.textContent = '교회 이름은 비울 수 없습니다.'; return; }
      var d = {
        name: newName,
        sichal: document.getElementById('chv-sichal').value,
        url: document.getElementById('chv-url').value.trim() || null,
        note: document.getElementById('chv-note').value.trim() || null,
        updated_at: new Date().toISOString(), updated_by: user.name
      };
      var renamed = newName !== row.name;
      /* 주소는 담임목사의 명단 주소가 원본 — 바뀌었으면 함께 고친다 */
      var head = chPastorOf(chSel);
      var addrEl = document.getElementById('chv-addr');
      var postEl = document.getElementById('chv-post');
      var addrChanged = head && addrEl && !addrEl.disabled &&
        (addrEl.value.trim() !== (head.address || '') ||
         postEl.value.trim() !== (head.postcode || ''));
      msg.className = 'form-msg'; msg.textContent = '저장 중입니다...';
      SHSCloud.init().then(function (c) {
        var first = addrChanged
          ? c.from('roster').update({
              address: addrEl.value.trim() || null,
              postcode: postEl.value.trim() || null
            }).eq('id', head.id).then(function (r0) {
              if (r0.error) throw r0.error;
              SHSCloud.log('update', '교회 주소 수정',
                chSel + ' → ' + (addrEl.value.trim() || '(지움)') + ' (담임 ' + head.name + ' 명단 연동)');
            })
          : Promise.resolve();
        return first.then(function () {
          return c.from('sichal_churches').update(d).eq('id', row.id).select();
        }).then(function (r1) {
          if (r1.error) throw r1.error;
          if (!renamed) return r1;
          /* 이름이 바뀌면 교회 명부와 노회 명단의 소속 교회도 따라간다 */
          return c.from('church_staff').update({ church: newName }).eq('church', row.name)
            .then(function () {
              return c.from('roster').update({ church: newName }).eq('church', row.name);
            }).then(function () { return r1; });
        });
      }).then(function () {
        SHSCloud.log('update', '교회 정보 수정', row.name + (renamed ? ' → ' + newName : ''));
        chSel = newName;
        renderChurches();
        renderRoster();
      }).catch(function (x) {
        msg.className = 'form-msg err';
        msg.textContent = '저장 실패: ' + ((x && x.message) || x);
      });
    });

    var del = document.getElementById('chv-del');
    if (del) del.addEventListener('click', function () {
      if (!confirm('"' + chSel + '"을(를) 회원교회 목록에서 지우시겠습니까?' +
        ' 교회 명부(교역자·장로)도 함께 지워집니다. 되돌릴 수 없습니다.')) return;
      SHSCloud.init().then(function (c) {
        return c.from('church_staff').delete().eq('church', row.name).then(function () {
          return c.from('sichal_churches').delete().eq('id', row.id);
        });
      }).then(function (r) {
        if (r.error) { alert(r.error.message); return; }
        SHSCloud.log('delete', '교회 삭제', chSel);
        chSel = '';
        chModalOpen = false;
        var mo = document.getElementById('ch-modal');
        if (mo) mo.remove();
        renderChurches();
      });
    });

    /* ----- 직원 명부 ----- */
    function csv(tr, f) {
      var el2 = tr.querySelector('[data-cf="' + f + '"]');
      if (!el2) return null;
      if (el2.type === 'checkbox') return el2.checked;
      return el2.value.trim() || null;
    }

    box.querySelectorAll('button[data-cssave]').forEach(function (b) {
      b.addEventListener('click', function () {
        var tr = b.closest('tr');
        var x = chStaff.filter(function (y) { return String(y.id) === b.dataset.cssave; })[0];
        if (!x) return;
        var d = {
          name: csv(tr, 'name'),
          birth_date: csv(tr, 'birth_date'),
          ordained_on: csv(tr, 'ordained_on'),
          phone: csv(tr, 'phone'),
          is_chongdae: !!csv(tr, 'is_chongdae'),
          updated_at: new Date().toISOString(), updated_by: user.name
        };
        if (!d.name) { alert('성명은 비울 수 없습니다.'); return; }
        var ro = chRosterOf(d.name);
        d.roster_id = ro ? ro.id : null;
        SHSCloud.init().then(function (c) {
          return c.from('church_staff').update(d).eq('id', x.id).select();
        }).then(function (r) {
          var w = SHS.wrote(r);
          if (!w.ok) { alert(w.why); return; }
          SHSCloud.log('update', '교회 명부 수정', chSel + ' ' + x.role + ' ' + d.name);
          renderChurches();
          renderRoster();
        });
      });
    });

    /* 담임 지정: 명단에 없는 목사를 회원 명단에 올려 담임으로 연동한다 */
    box.querySelectorAll('button[data-cshead]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (!confirm(b.dataset.csn2 + ' 목사님을 ' + chSel + ' 담임으로 지정할까요? ' +
          '회원 명단에 목사 회원으로 올라가고, 교회 정보의 담임 칸에 표시됩니다.')) return;
        SHSCloud.init().then(function (c) {
          return c.rpc('set_head_pastor', { p_staff_id: parseInt(b.dataset.cshead, 10) });
        }).then(function (r) {
          if (r.error) { alert(r.error.message); return; }
          SHSCloud.log('update', '담임목사 지정', chSel + ' 담임 ' + b.dataset.csn2);
          renderChurches();
          renderRoster();
        });
      });
    });

    box.querySelectorAll('button[data-csdel]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (!confirm(b.dataset.csn + ' 님을 이 교회 명부에서 지우시겠습니까?')) return;
        SHSCloud.init().then(function (c) {
          return c.from('church_staff').delete().eq('id', parseInt(b.dataset.csdel, 10));
        }).then(function (r) {
          if (r.error) { alert(r.error.message); return; }
          SHSCloud.log('delete', '교회 명부 삭제', chSel + ' ' + b.dataset.csn);
          renderChurches();
          renderRoster();
        });
      });
    });

    var addBtn = document.getElementById('cs-add');
    if (addBtn) addBtn.addEventListener('click', function () {
      var msg = document.getElementById('cs-msg');
      var role = document.getElementById('cs-role').value;
      var name = document.getElementById('cs-name').value.trim();
      if (!name) { msg.className = 'form-msg err'; msg.textContent = '성명을 적어 주세요.'; return; }
      var ro = chRosterOf(name);
      var d = {
        church: chSel, role: role, name: name,
        birth_date: document.getElementById('cs-birth').value || (ro && ro.birth_date) || null,
        ordained_on: document.getElementById('cs-ordained').value || null,
        phone: document.getElementById('cs-phone').value.trim() || (ro && ro.phone) || null,
        is_chongdae: document.getElementById('cs-chongdae').checked,
        roster_id: ro ? ro.id : null,
        sort: (chStaff.length + 1) * 10,
        updated_by: user.name
      };
      msg.className = 'form-msg'; msg.textContent = '추가 중입니다...';
      SHSCloud.init().then(function (c) {
        return c.from('church_staff').insert(d).select();
      }).then(function (r) {
        var w = SHS.wrote(r);
        if (!w.ok) { msg.className = 'form-msg err'; msg.textContent = w.why; return; }
        SHSCloud.log('create', '교회 명부 추가', chSel + ' ' + role + ' ' + name +
          (d.is_chongdae ? ' (총대장로)' : ''));
        renderChurches();
        renderRoster();
      });
    });
  }

  function renderRoster() {
    var box = document.getElementById('roster-area');
    Promise.all([
      SHSCloud.init().then(function (c) { return c.from('roster').select('*').order('sort').order('id'); }),
      SHSCloud.init().then(function (c) { return c.from('sichals').select('name').order('sort'); })
    ]).then(function (rs) {
      var r = rs[0];
      if (r.error) {
        box.innerHTML = '<div class="notice-banner">명단을 불러오지 못했습니다: ' + e(r.error.message) + '</div>';
        return;
      }
      var rows = r.data || [];
      var sichalNames = ((rs[1] && rs[1].data) || []).map(function (x) { return x.name; });
      var hasOrg = rows.filter(function (m) { return m.category; }).length > 0;

      function catOptions(v) {
        /* 위임목사·시무목사는 목사 무리 안의 직분이다. 시무장로가 있는 교회의
         * 담임은 저절로 위임목사로 표기되지만, 아직 위임식을 하지 않았다면
         * 여기서 시무목사로 고르면 그대로 유지된다. */
        var list = CATEGORIES.slice();
        list.splice(1, 0, '위임목사', '시무목사');
        return '<option value="">— 없음 —</option>' + list.map(function (x) {
          return '<option' + (x === v ? ' selected' : '') + '>' + e(x) + '</option>';
        }).join('');
      }
      function sichalOptions(v) {
        return '<option value="">— 없음 —</option>' + sichalNames.map(function (x) {
          return '<option' + (x === v ? ' selected' : '') + '>' + e(x) + '</option>';
        }).join('');
      }

      var html = '';
      html += '<div class="notice-banner">여기서 고친 내용은 <strong>조직 페이지의 회원명단</strong>에 바로 반영됩니다. ' +
        '<strong>직분</strong>을 정해 주셔야 조직 페이지에 나타납니다. ' +
        '시무 교회를 사임하신 분은 직분을 <strong>무임목사·은퇴목사·원로목사</strong>로 바꾸시면 ' +
        '교회 칸을 비워 두셔도 저장됩니다. 노회 사무실 간사는 <strong>직원</strong>으로 두십니다. ' +
        '<a href="organization.html" target="_blank" style="color:var(--navy);text-decoration:underline">조직 페이지 보기</a></div>';
      if (!hasOrg) {
        html += '<div class="notice-banner">아직 조직 분류가 채워지지 않았습니다. ' +
          'supabase/16_organization.sql 을 실행하시면 지금 조직 페이지에 실려 있는 명단이 그대로 채워집니다.</div>';
      }

      /* 새 회원 추가 */
      html += '<p style="font-size:0.86rem;color:var(--gray-7)">' +
        '회원을 새로 넣거나 직분을 바꾸시면 <strong>그 직위 무리의 맨 뒤로 자동으로 들어갑니다.</strong> ' +
        '예를 들어 새로 부임하신 목사는 마지막 목사 다음에 놓입니다.<br>' +
        '순서 : 목사 → 부목사 → 원로목사 → 은퇴목사 → 무임목사 → 장로 → 직원</p>';
      html += '<p><button class="btn ghost" id="ro-order">명단 순서 다시 정리</button> ' +
        '<span style="font-size:0.84rem;color:var(--gray-5);margin-left:8px">' +
        '직위 순서가 흐트러졌을 때만 누르시면 됩니다. ' +
        '같은 직위 안에서는 <strong>지금 순서를 그대로</strong> 지킵니다.</span>' +
        '<span class="form-msg" id="ro-ordmsg" style="display:inline-block;margin-left:10px"></span></p>';

      html += '<div class="admin-card" style="margin-bottom:16px"><h3 style="margin-top:0">명단에 추가</h3>' +
        '<div class="inline-form">' +
        '<div class="field" style="flex:0 0 120px"><label>성명</label><input type="text" id="ro-name"></div>' +
        '<div class="field"><label>소속 교회</label><input type="text" id="ro-church"></div>' +
        '<div class="field" style="flex:0 0 130px"><label>직분</label><select id="ro-cat">' +
        catOptions('목사') + '</select></div>' +
        '<div class="field" style="flex:0 0 150px"><label>생년월일</label>' +
        '<input type="date" id="ro-birth"></div>' +
        '<div class="field" style="flex:0 0 130px"><label>시찰</label><select id="ro-sichal">' + sichalOptions('') + '</select></div>' +
        '<div class="field" style="flex:0 0 160px"><label>부여 등급</label><select id="ro-grade">' +
        GRADES.filter(function (g) { return g.v !== 'pending'; }).map(function (g) {
          return '<option value="' + g.v + '"' + (g.v === 'member' ? ' selected' : '') + '>' + g.t + '</option>';
        }).join('') + '</select></div>' +
        '<button class="btn" id="ro-add">추가</button>' +
        '</div><div class="form-msg" id="ro-msg"></div></div>';

      /* 명단 조회 */
      html += '<div class="inline-form" style="margin-bottom:12px">' +
        '<div class="field" style="flex:1 1 240px"><label for="ro-q">명단 조회</label>' +
        '<input type="search" id="ro-q" placeholder="성명·교회·시찰로 찾기"></div>' +
        '<div class="field" style="flex:0 0 150px"><label for="ro-fcat">직분</label>' +
        '<select id="ro-fcat"><option value="">직분 전체</option>' +
        CATEGORIES.map(function (x) { return '<option>' + e(x) + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="field" style="flex:0 0 160px"><label for="ro-fgrade">부여 등급</label>' +
        '<select id="ro-fgrade"><option value="">등급 전체</option>' +
        GRADES.map(function (g) { return '<option value="' + g.v + '">' + e(g.t) + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="field" style="flex:0 0 175px"><label for="ro-fview">보기 방식</label>' +
        '<select id="ro-fview">' +
        '<option value="">기본 (명부 순)</option>' +
        '<option value="term">남은 임기 짧은 순</option>' +
        '<option value="wiim">위임목사 먼저</option>' +
        '<option value="member">정회원 먼저</option>' +
        '<option value="officers">임원만 보기</option>' +
        '</select></div>' +
        '<button class="btn ghost" id="ro-qclear">지우기</button>' +
        '</div>';

      /* 부여 등급을 읽기 좋은 말로 */
      function gradeName(v) {
        var t = String(v || '');
        if (t.indexOf('officer:') === 0) return t.slice(8);   /* 목록에 없는 직책도 이름만 */
        var g = parseGrade(t);
        return g.title || ROSTER_ROLES[g.role] || g.role || '정회원';
      }
      /* 남은 임기: 장로 총대는 자격 기간, 그 외는 정년(만 70세)까지 */
      function remainLabel(m) {
        var today = new Date();
        if (m.category === '장로' && m.term_until) {
          var left = Math.ceil((new Date(m.term_until + 'T00:00:00') - today) / 86400000);
          if (left <= 0) return '<span class="fail">총대 만료</span>';
          if (left < 365) return '총대 ' + left + '일';
          return '총대 ' + (Math.round(left / 36.5) / 10) + '년';
        }
        var rd = SHS.retireDate(m.birth_date);
        if (!rd) return '<span style="color:var(--gray-5)">-</span>';
        if (rd <= today) return '<span class="fail">정년 경과</span>';
        var months = (rd.getFullYear() - today.getFullYear()) * 12 + (rd.getMonth() - today.getMonth());
        var y = Math.floor(months / 12), mo = months % 12;
        return (y ? y + '년 ' : '') + (mo ? mo + '개월' : (y ? '' : '한 달 미만'));
      }

      /* 명단 표 — 읽기 전용. [수정]을 누르면 팝업에서 고친다. */
      html += '<table class="tbl" id="ro-tbl"><thead><tr><th style="width:50px">번호</th>' +
        '<th style="width:110px">성명</th><th style="width:110px">직분</th>' +
        '<th>소속 교회</th><th style="width:110px">시찰</th>' +
        '<th style="width:130px">남은 임기</th><th style="width:130px">부여 등급</th>' +
        '<th style="width:80px">관리</th></tr></thead><tbody>';
      rows.forEach(function (m, i) {
        /* 보기 방식 정렬에 쓸 값: 남은 날수(장로 총대는 자격 기간, 그 외는 정년) */
        var days = 999999;
        if (m.category === '장로' && m.term_until) {
          days = Math.ceil((new Date(m.term_until + 'T00:00:00') - new Date()) / 86400000);
        } else {
          var rd0 = SHS.retireDate(m.birth_date);
          if (rd0) days = Math.ceil((rd0 - new Date()) / 86400000);
        }
        html += '<tr data-ro="' + m.id + '" data-find="' +
          e([m.name, m.church, m.category, m.sichal, m.note].filter(Boolean).join(' ')) + '"' +
          ' data-cat="' + e(m.category || '') + '" data-grade="' + e(rosterGrade(m)) + '"' +
          ' data-days="' + days + '" data-pos="' + e(m.position || m.category || '') + '"' +
          ' data-idx="' + i + '">' +
          '<td class="ro-no">' + (i + 1) + '</td>' +
          '<td><a data-roview="' + m.id + '" title="정보 보기" ' +
          'style="font-weight:700;color:var(--navy);cursor:pointer;text-decoration:underline;' +
          'text-decoration-style:dotted;text-underline-offset:3px">' + e(m.name) + '</a></td>' +
          '<td>' + e(m.position || m.category || '-') + '</td>' +
          '<td class="left">' + e(m.church || '-') + '</td>' +
          '<td>' + e(m.sichal || '-') + '</td>' +
          '<td>' + remainLabel(m) + '</td>' +
          '<td>' + e(gradeName(rosterGrade(m))) + '</td>' +
          '<td><button class="btn sm" data-roedit="' + m.id + '">수정</button></td>' +
          '</tr>';
      });
      html += '</tbody></table>';

        '<em>일반회원</em>으로 저절로 바뀝니다.</strong> 직분을 <strong>직원</strong>으로 하시면 ' +
        '간사(관리자) 등급이 함께 붙습니다. 두 가지 모두 등급 칸에서 고치실 수 있습니다.</p>';

      /* 조회 — 적으신 말이 든 줄만 남긴다 */
      var qBox = document.getElementById('ro-q');

      var fGrade = document.getElementById('ro-fgrade');
      var fView = document.getElementById('ro-fview');
      function isOfficerGrade(g2) {
        return g2 === 'president' || g2 === 'clerk' || String(g2).indexOf('officer:') === 0;
      }
      function applyFilter() {
        var q = (qBox.value || '').trim();
        var c = fCat.value, g = fGrade.value, view = fView.value;

        /* 보기 방식에 따라 줄 순서를 바꾼다 (기본은 명부 순) */
        var tbody = box.querySelector('#ro-tbl tbody');
        var trs = Array.prototype.slice.call(tbody.querySelectorAll('tr[data-ro]'));
        trs.sort(function (a, b) {
          var tie = (+a.dataset.idx) - (+b.dataset.idx);
          if (view === 'term') return ((+a.dataset.days) - (+b.dataset.days)) || tie;
          if (view === 'wiim') {
            return ((b.dataset.pos === '위임목사' ? 1 : 0) - (a.dataset.pos === '위임목사' ? 1 : 0)) || tie;
          }
          if (view === 'member') {
            return ((b.dataset.grade === 'member' ? 1 : 0) - (a.dataset.grade === 'member' ? 1 : 0)) || tie;
          }
          return tie;
        });
        trs.forEach(function (tr) {
          tbody.appendChild(tr);
          var sub2 = tbody.querySelector('tr[data-rosub="' + tr.dataset.ro + '"]');
          if (sub2) tbody.appendChild(sub2);
        });

        var shown = 0, n = 0;
        box.querySelectorAll('#ro-tbl tbody tr[data-ro]').forEach(function (tr) {
          var ok = (!q || (tr.dataset.find || '').indexOf(q) !== -1)
                && (!c || tr.dataset.cat === c)
                && (!g || tr.dataset.grade === g)
                && (view !== 'officers' || isOfficerGrade(tr.dataset.grade));
          tr.classList.toggle('hidden', !ok);
          /* 주소가 담긴 아랫줄도 같이 숨기거나 보인다 */
          var sub = box.querySelector('#ro-tbl tr[data-rosub="' + tr.dataset.ro + '"]');
          if (sub) sub.classList.toggle('hidden', !ok);
          if (ok) { shown++; tr.querySelector('.ro-no').textContent = ++n; }
        });
        var el = document.getElementById('ro-count');
        el.textContent = (q || c || g || fView.value === 'officers') ? ' 가운데 ' + shown + '명' : '';

        el.addEventListener('input', applyFilter);

      function autoGrade(scope, catEl, birthEl, gradeEl) {

          } else if (AUTO_GRADE[catEl.value] && gradeEl.value === 'member') {

        catEl.addEventListener('change', tune);

  /* ---------- 장로 총대 관리 ----------
   * 근거: 노회규칙 제16조 2항 (노회총대는 당회장이 제출한다)
   * 정년(만 70세)과 자격 기간을 두고, 교체되지 않으면 1년씩 자동 연장된다. */
  /* ---------- 회기(會期) ----------
   * 노회는 정기회마다 회기가 바뀐다. 총대 자격 기간은 날짜가 아니라
   * 회기로 정하는 것이 노회 실무에 맞으므로, 화면에서는 회기로 고르고
   * 저장은 그 회기의 시작·끝 날짜로 한다. (자동 연장 기능과 호환) */
  var SESSIONS = { current: 19, list: [] };

  function sesList() { return SESSIONS.list || []; }
  function sesFind(no) {
    return sesList().filter(function (x) { return Number(x.no) === Number(no); })[0] || null;
  }
  /* 날짜가 어느 회기에 드는지 */
  function sesOfDate(ymd) {
    if (!ymd) return null;
    var hit = sesList().filter(function (x) {
      return String(ymd) >= String(x.from) && String(ymd) <= String(x.to);
    })[0];
    return hit ? Number(hit.no) : null;
  }
  /* 끝 날짜로 끝 회기를 찾는다 (끝 날짜는 그 회기의 마지막 날) */
  function sesOfEnd(ymd) {
    if (!ymd) return null;
    var exact = sesList().filter(function (x) { return String(x.to) === String(ymd); })[0];
    if (exact) return Number(exact.no);
    return sesOfDate(ymd);
  }
  function sesLabel(from, until) {
    var a = sesOfDate(from), b = sesOfEnd(until);
    if (!a && !b) return null;
    if (a && b && a !== b) return '제' + a + '~' + b + '회기';
    return '제' + (a || b) + '회기';
  }
  function sesOptions(sel) {
    return sesList().map(function (x) {
      return '<option value="' + x.no + '"' + (Number(sel) === Number(x.no) ? ' selected' : '') + '>' +
        '제' + x.no + '회기 (' + x.from + ' ~ ' + x.to + ')</option>';
    }).join('');
  }

  /* ---------- 장로 총대 자격 ----------
   * 근거: 노회규칙 제16조 2항 (노회총대는 당회장이 제출한다)
   * 정년(만 70세)과 자격 회기를 두고, 교체되지 않으면 자동 연장된다. */
  function renderElders() {
    var box = document.getElementById('elder-area');
    if (!box) return;
    SHSCloud.init().then(function (c) {
      return Promise.all([
        c.from('roster').select('*').eq('category', '장로').order('sichal').order('sort'),
        c.from('site_settings').select('value').eq('key', 'sessions')
          .then(function (x) { return x; }, function () { return { data: [] }; })
      ]);
    }).then(function (rs) {
      var r = rs[0];
      if (r.error) {
        box.innerHTML = '<div class="notice-banner">장로 총대 명단을 불러오지 못했습니다: ' +
          e(r.error.message) + '</div>';
        return;
      }
      var ses = ((rs[1] && rs[1].data) || [])[0];
      if (ses && ses.value) SESSIONS = ses.value;

      var rows = r.data || [];
      if (!rows.length) {
        box.innerHTML = '<p style="color:var(--gray-5)">등록된 장로가 없습니다. ' +
          '노회 명단 관리에서 직분을 <strong>장로</strong>로 지정해 주세요.</p>';
        return;
      }

      var live = rows.filter(function (x) { return x.active !== false; });
      var past = rows.filter(function (x) { return x.active === false; });
      var today = new Date();
      var expiring = live.filter(function (x) {
        return x.term_until && new Date(x.term_until + 'T00:00:00') <= today;
      }).length;

      function retireText(x) {
        var rd = SHS.retireDate(x.birth_date);
        if (!rd) return '<span style="color:var(--gray-5)">생년월일 미등록</span>';
        var over = rd <= today;
        return '<span class="' + (over ? 'fail' : '') + '">' +
          rd.getFullYear() + '. ' + (rd.getMonth() + 1) + '.' + (over ? ' (경과)' : '') + '</span>';
      }
      function termText(x) {
        var lab = sesLabel(x.term_from, x.term_until);
        if (!lab) return '<span style="color:var(--gray-5)">미정</span>';
        var left = x.term_until
          ? Math.ceil((new Date(x.term_until + 'T00:00:00') - today) / 86400000) : null;
        return '<strong>' + lab + '</strong>' +
          (left != null
            ? '<div style="font-size:0.78rem;color:' + (left <= 0 ? 'var(--red)' : 'var(--gray-5)') + '">' +
              (left <= 0 ? '만료 (연장 대상)' : left + '일 남음') + '</div>'
            : '');
      }

      var h = '<div class="notice-banner">노회규칙 제16조 2항에 따라 장로 총대는 당회장이 제출합니다. ' +
        '자격은 <strong>회기</strong>로 정하며, 지금은 <strong>제' + SESSIONS.current + '회기</strong>입니다. ' +
        '교체되지 않은 총대는 다음 회기에 자격이 자동 연장되고, 정년(만 70세)이 지난 분은 연장되지 않습니다.' +
        (expiring ? ' <strong>지금 자격이 만료된 총대 ' + expiring + '명</strong>' : '') +
        '</div>';

      h += '<p><button class="btn" id="el-extend">자격 만료된 총대 1년 연장</button> ' +
        '<span style="font-size:0.84rem;color:var(--gray-5);margin-left:8px">' +
        '정기노회 뒤에 한 번 눌러 주시면 됩니다. 정년이 지난 분은 제외됩니다.</span></p>' +
        '<div class="form-msg" id="el-msg"></div>';

      h += '<table class="tbl"><thead><tr><th style="width:50px">번호</th>' +
        '<th style="width:110px">성명</th><th style="width:160px">소속 교회</th>' +
        '<th style="width:110px">시찰</th><th style="width:120px">생년월일</th>' +
        '<th style="width:120px">정년</th><th style="width:170px">총대 자격</th>' +
        '<th style="width:80px">관리</th></tr></thead><tbody>';
      live.forEach(function (x, i) {
        h += '<tr>' +
          '<td>' + (i + 1) + '</td>' +
          '<td><strong>' + e(x.name) + '</strong></td>' +
          '<td class="left">' + e(x.church) + '</td>' +
          '<td>' + e(x.sichal || '-') + '</td>' +
          '<td>' + e(x.birth_date || '<span style="color:var(--gray-5)">-</span>') + '</td>' +
          '<td style="font-size:0.84rem">' + retireText(x) + '</td>' +
          '<td>' + termText(x) + '</td>' +
          '<td><button class="btn sm" data-eledit="' + x.id + '">수정</button></td>' +
          '</tr>';
      });
      h += '</tbody></table>';

      if (past.length) {
        h += '<h3 style="margin-top:24px">교체된 장로 총대 (' + past.length + '명)</h3>' +
          '<table class="tbl" style="max-width:760px"><thead><tr><th style="width:120px">성명</th>' +
          '<th style="width:170px">소속 교회</th><th style="width:130px">교체일</th>' +
          '<th>후임</th></tr></thead><tbody>';
        past.forEach(function (x) {
          h += '<tr><td>' + e(x.name) + '</td><td>' + e(x.church) + '</td>' +
            '<td>' + e(x.replaced_at || '-') + '</td>' +
            '<td class="left">' + e(x.replaced_by || '-') + '</td></tr>';
        });
        h += '</tbody></table>';
      }
      box.innerHTML = h;

      /* ----- 수정 팝업 ----- */
      function openElderEdit(x) {
        var fromNo = sesOfDate(x.term_from) || SESSIONS.current;
        var untilNo = sesOfEnd(x.term_until) || (Number(SESSIONS.current) + 1);
        var mo = adminModal(
          '<h3 style="margin:0 0 4px;color:var(--navy)">' + e(x.name) + ' — 장로 총대 자격</h3>' +
          '<p style="font-size:0.86rem;color:var(--gray-6);margin:0 0 14px">' +
          e(x.church) + (x.sichal ? ' · ' + e(x.sichal) : '') + '</p>' +
          '<div class="inline-form">' +
          '<div class="field" style="flex:0 0 170px"><label>생년월일</label>' +
          '<input type="date" id="elm-birth" value="' + e(x.birth_date || '') + '"></div>' +
          '<div class="field" style="flex:0 0 150px"><label>연락처</label>' +
          '<input type="text" id="elm-phone" value="' + e(x.phone || '') + '" placeholder="010-0000-0000"></div>' +
          '</div>' +
          '<div class="inline-form">' +
          '<div class="field"><label>자격 시작 회기</label><select id="elm-from">' +
          sesOptions(fromNo) + '</select></div>' +
          '<div class="field"><label>자격 끝 회기</label><select id="elm-until">' +
          sesOptions(untilNo) + '</select></div>' +
          '</div>' +
          '<p style="font-size:0.8rem;color:var(--gray-5);margin-top:-4px">' +
          '회기를 고르면 그 회기의 시작일과 마지막 날로 저장됩니다. ' +
          '회기 기간은 <a href="manage.html#mg-ops" style="text-decoration:underline">사이트 관리 → 노회 운영</a>에서 정합니다.</p>' +
          '<div style="margin-top:6px"><button class="btn" id="elm-save">저장</button> ' +
          '<button class="btn ghost" id="elm-swap">총대 교체</button></div>' +
          '<div class="form-msg" id="elm-msg"></div>');

        document.getElementById('elm-save').addEventListener('click', function () {
          var msg = document.getElementById('elm-msg');
          var a = sesFind(document.getElementById('elm-from').value);
          var b = sesFind(document.getElementById('elm-until').value);
          if (!a || !b) { msg.className = 'form-msg err'; msg.textContent = '회기를 고르지 못했습니다.'; return; }
          if (Number(b.no) < Number(a.no)) {
            msg.className = 'form-msg err';
            msg.textContent = '끝 회기는 시작 회기보다 앞설 수 없습니다.';
            return;
          }
          var d = {
            birth_date: document.getElementById('elm-birth').value || null,
            phone: document.getElementById('elm-phone').value.trim() || null,
            term_from: a.from, term_until: b.to
          };
          msg.className = 'form-msg'; msg.textContent = '저장 중입니다...';
          SHSCloud.init().then(function (c) {
            return c.from('roster').update(d).eq('id', x.id);
          }).then(function (res) {
            if (res.error) { msg.className = 'form-msg err'; msg.textContent = res.error.message; return; }
            SHSCloud.log('update', '장로 총대 자격 수정',
              x.name + ' 제' + a.no + '~' + b.no + '회기');
            mo.close();
            renderElders();
          });
        });

        document.getElementById('elm-swap').addEventListener('click', function () {
          var nm = prompt('"' + x.name + '" 총대를 대신할 새 장로 총대의 성명을 적어 주세요.', '');
          if (nm === null || !nm.trim()) return;
          var ch = prompt('새 총대의 소속 교회를 적어 주세요.', x.church || '');
          if (ch === null) return;
          var bd = prompt('새 총대의 생년월일을 적어 주세요. (예: 1965-03-21, 모르시면 비워 두세요)', '');
          if (bd === null) return;
          SHSCloud.init().then(function (c) {
            return c.rpc('replace_elder', {
              p_id: Number(x.id), p_name: nm.trim(),
              p_church: ch.trim(), p_birth: bd.trim() || null
            });
          }).then(function (res) {
            if (res.error) { alert(res.error.message); return; }
            SHSCloud.log('update', '장로 총대 교체', x.name + ' → ' + nm.trim());
            mo.close();
            renderElders();
            renderRoster();
          });
        });
      }

      box.querySelectorAll('button[data-eledit]').forEach(function (b) {
        b.addEventListener('click', function () {
          var x = live.filter(function (y) { return String(y.id) === b.dataset.eledit; })[0];
          if (x) openElderEdit(x);
        });
      });

      /* 자격 일괄 연장 */
      document.getElementById('el-extend').addEventListener('click', function () {
        if (!confirm('자격이 만료된 장로 총대의 기간을 1년 연장하시겠습니까? ' +
                     '교체되지 않은 총대만 연장되며, 정년이 지난 분은 제외됩니다.')) return;
        var msg = document.getElementById('el-msg');
        msg.className = 'form-msg'; msg.textContent = '연장 중입니다...';
        SHSCloud.init().then(function (c) { return c.rpc('extend_elder_terms'); })
          .then(function (res) {
            if (res.error) { msg.className = 'form-msg err'; msg.textContent = res.error.message; return; }
            var n = res.data || 0;
            SHSCloud.log('update', '장로 총대 자격 자동 연장', n + '명');
            msg.className = 'form-msg ok';
            msg.textContent = n > 0 ? n + '명의 자격을 1년 연장했습니다.'
                                    : '연장할 총대가 없습니다. (모두 자격 기간이 남아 있거나 정년이 지났습니다)';
            renderElders();
          });
      });
    });
  }

  /* ---------- 총회 총대 관리 ----------
   * 근거: 노회규칙 제16조 (총대)
   * 노회장과 장로부노회장은 자동총대, 그 외는 선거관리위원회 내규에 따라 선정 */
  /* ---------- 이사 관리 ----------
   * 총회 실행위원·총신대 운영이사·GMS 이사·기독신문 이사.
   * 총대와 마찬가지로 정기노회에서 선정하므로 같은 모양으로 관리한다. */
  var BKINDS = ['총회 실행위원', '총신대 운영이사', 'GMS 이사', '기독신문 이사'];

  /* 관리 화면 공용 수정 팝업 */
  function adminModal(inner, maxWidth) {
    var old = document.getElementById('adm-modal');
    if (old) old.remove();
    var ov = document.createElement('div');
    ov.id = 'adm-modal';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(15,25,45,.55);z-index:300;' +
      'display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;overflow:auto';
    ov.innerHTML = '<div style="background:#fff;border-radius:8px;max-width:' + (maxWidth || 640) +
      'px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25);padding:24px 26px;position:relative">' +
      '<button class="adm-modal-x" aria-label="닫기" style="position:absolute;top:10px;right:14px;' +
      'border:none;background:none;font-size:1.4rem;color:var(--gray-5);cursor:pointer">&times;</button>' +
      inner + '</div>';
    document.body.appendChild(ov);
    function close() { ov.remove(); }
    ov.addEventListener('click', function (ev) { if (ev.target === ov) close(); });
    ov.querySelector('.adm-modal-x').addEventListener('click', close);
    return { ov: ov, close: close };
  }

  function renderBoards() {
    var box = document.getElementById('board-area');
    if (!box) return;
    SHSCloud.init().then(function (c) {
      return c.from('board_members').select('*').order('sort').order('id');
    }).then(function (r) {
      if (r.error) {
        box.innerHTML = '<div class="notice-banner">이사 명단을 불러오지 못했습니다: ' + e(r.error.message) +
          '<br><span style="font-size:0.85rem;color:var(--gray-5)">' +
          'Supabase에서 <strong>37_boards_and_audit_window.sql</strong>을 먼저 실행해 주세요.</span></div>';
        return;
      }
      var rows = r.data || [];
      var html = '<p>정기노회에서 선정한 이사입니다. 조직 페이지의 <strong>이사</strong> 표에 그대로 나옵니다.</p>';

      html += '<table class="tbl"><thead><tr><th style="width:170px">구분</th>' +
        '<th style="width:130px">성명</th><th style="width:100px">직분</th>' +
        '<th>소속 교회</th><th style="width:150px">자격 시작</th>' +
        '<th style="width:70px">표시</th><th style="width:130px">관리</th></tr></thead><tbody>';
      if (!rows.length) {
        html += '<tr><td colspan="7" style="color:var(--gray-5)">등록된 이사가 없습니다.</td></tr>';
      }
      rows.forEach(function (b) {
        html += '<tr' + (b.active ? '' : ' style="opacity:.5"') + '>' +
          '<td>' + e(b.kind) + '</td>' +
          '<td><strong>' + e(b.name) + '</strong></td>' +
          '<td>' + e(b.position || '-') + '</td>' +
          '<td class="left">' + e(b.church || '-') + '</td>' +
          '<td>' + e(b.term_from || '-') + '</td>' +
          '<td>' + (b.active ? '표시' : '<span style="color:var(--gray-5)">숨김</span>') + '</td>' +
          '<td><button class="btn sm" data-bedit="' + b.id + '">수정</button></td>' +
          '</tr>';
      });
      html += '</tbody></table>';

      html += '<div class="admin-card" style="max-width:860px"><h3 style="margin-top:0">이사 추가</h3>' +
        '<div class="inline-form">' +
        '<div class="field" style="flex:0 0 170px"><label>구분</label><select id="bn-kind">' +
        BKINDS.map(function (k) { return '<option>' + e(k) + '</option>'; }).join('') + '</select></div>' +
        '<div class="field" style="flex:0 0 130px"><label>성명</label><input type="text" data-names="plain" id="bn-name"></div>' +
        '<div class="field" style="flex:0 0 110px"><label>직분</label>' +
        '<select id="bn-pos"><option>목사</option><option>장로</option></select></div>' +
        '<div class="field"><label>소속 교회</label><input type="text" id="bn-church"></div>' +
        '<div class="field" style="flex:0 0 160px"><label>자격 시작</label><input type="date" id="bn-from"></div>' +
        '<button class="btn" id="bn-add">추가</button>' +
        '</div><div class="form-msg" id="bn-msg"></div></div>';

      box.innerHTML = html;
      SHSNames.attachAll(box);

      function openBoardEdit(b) {
        var mo = adminModal(
          '<h3 style="margin:0 0 14px;color:var(--navy)">' + e(b.name) + ' — 이사 정보 수정</h3>' +
          '<div class="inline-form">' +
          '<div class="field" style="flex:0 0 180px"><label>구분</label><select id="bm-kind">' +
          BKINDS.map(function (k) {
            return '<option' + (b.kind === k ? ' selected' : '') + '>' + e(k) + '</option>';
          }).join('') + '</select></div>' +
          '<div class="field" style="flex:0 0 140px"><label>성명</label>' +
          '<input type="text" data-names="plain" id="bm-name" value="' + e(b.name) + '"></div>' +
          '<div class="field" style="flex:0 0 110px"><label>직분</label><select id="bm-pos">' +
          ['목사', '장로'].map(function (k) {
            return '<option' + (b.position === k ? ' selected' : '') + '>' + k + '</option>';
          }).join('') + '</select></div>' +
          '</div>' +
          '<div class="inline-form">' +
          '<div class="field"><label>소속 교회</label>' +
          '<input type="text" id="bm-church" value="' + e(b.church || '') + '"></div>' +
          '<div class="field" style="flex:0 0 165px"><label>자격 시작</label>' +
          '<input type="date" id="bm-from" value="' + e(b.term_from || '') + '"></div>' +
          '<div class="field" style="flex:0 0 110px"><label>조직 페이지 표시</label>' +
          '<input type="checkbox" id="bm-active"' + (b.active ? ' checked' : '') + ' style="width:auto;margin-top:10px"></div>' +
          '</div>' +
          '<div style="margin-top:6px"><button class="btn" id="bm-save">저장</button> ' +
          '<button class="btn danger" id="bm-del" style="float:right">명단에서 삭제</button></div>' +
          '<div class="form-msg" id="bm-msg"></div>');
        SHSNames.attachAll(mo.ov);
        document.getElementById('bm-save').addEventListener('click', function () {
          var msg = document.getElementById('bm-msg');
          var d = {
            kind: document.getElementById('bm-kind').value,
            name: document.getElementById('bm-name').value.trim(),
            position: document.getElementById('bm-pos').value,
            church: document.getElementById('bm-church').value.trim() || null,
            term_from: document.getElementById('bm-from').value || null,
            active: document.getElementById('bm-active').checked,
            updated_at: new Date().toISOString(), updated_by: user.name
          };
          if (!d.name) { msg.className = 'form-msg err'; msg.textContent = '성명을 입력해 주세요.'; return; }
          SHSCloud.init().then(function (c) {
            return c.from('board_members').update(d).eq('id', b.id);
          }).then(function (res) {
            if (res.error) { msg.className = 'form-msg err'; msg.textContent = res.error.message; return; }
            SHSCloud.log('update', '이사 수정', d.kind + ' ' + d.name);
            mo.close();
            renderBoards();
          });
        });
        document.getElementById('bm-del').addEventListener('click', function () {
          if (!confirm('"' + b.name + '" 이사를 명단에서 지우시겠습니까?')) return;
          SHSCloud.init().then(function (c) {
            return c.from('board_members').delete().eq('id', b.id);
          }).then(function (res) {
            if (res.error) { alert(res.error.message); return; }
            SHSCloud.log('delete', '이사 삭제', b.name);
            mo.close();
            renderBoards();
          });
        });
      }
      box.querySelectorAll('button[data-bedit]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var b = rows.filter(function (x) { return String(x.id) === btn.dataset.bedit; })[0];
          if (b) openBoardEdit(b);
        });
      });
      document.getElementById('bn-add').addEventListener('click', function () {
        var msg = document.getElementById('bn-msg');
        var d = {
          kind: document.getElementById('bn-kind').value,
          name: document.getElementById('bn-name').value.trim(),
          position: document.getElementById('bn-pos').value,
          church: document.getElementById('bn-church').value.trim() || null,
          term_from: document.getElementById('bn-from').value || null,
          sort: (rows.length + 1) * 10,
          updated_by: user.name
        };
        if (!d.name) { msg.className = 'form-msg err'; msg.textContent = '성명을 입력해 주세요.'; return; }
        msg.className = 'form-msg'; msg.textContent = '추가하는 중입니다...';
        SHSCloud.init().then(function (c) {
          return c.from('board_members').insert(d);
        }).then(function (res) {
          if (res.error) { msg.className = 'form-msg err'; msg.textContent = res.error.message; return; }
          SHSCloud.log('create', '이사 추가', d.kind + ' ' + d.name);
          renderBoards();
        });
      });
    });
  }

  var DKINDS = ['목사 정총대', '목사 부총대', '장로 정총대', '장로 부총대'];

  function renderDelegates() {
    var box = document.getElementById('delegate-area');
    if (!box) return;
    SHSCloud.init().then(function (c) {
      return c.from('delegates').select('*').order('kind').order('sort');
    }).then(function (r) {
      if (r.error) {
        box.innerHTML = '<div class="notice-banner">총대 명단을 불러오지 못했습니다: ' + e(r.error.message) +
          ' (26 총회 총대 관리 등록이 필요할 수 있습니다)</div>';
        return;
      }
      var rows = r.data || [];
      var live = rows.filter(function (x) { return x.active; });
      var past = rows.filter(function (x) { return !x.active; });

      function kindOpts(v) {
        return DKINDS.map(function (k) {
          return '<option' + (k === v ? ' selected' : '') + '>' + e(k) + '</option>';
        }).join('');
      }
      function termCell(d) {
        if (!d.term_until) return '<span style="color:var(--gray-5)">기간 미정</span>';
        var left = Math.ceil((new Date(d.term_until + 'T00:00:00') - new Date()) / 86400000);
        var txt = e(d.term_from || '?') + ' ~ ' + e(d.term_until);
        if (left <= 0) return txt + '<div class="fail" style="font-size:0.8rem">자격 만료</div>';
        return txt + '<div style="font-size:0.8rem;color:var(--gray-5)">' + left + '일 남음</div>';
      }

      var h = '<div class="notice-banner">노회규칙 제16조에 따라 4월 정기노회에서 선정합니다. ' +
        '노회장과 장로 부노회장은 자동총대입니다. ' +
        '총대가 바뀌면 <strong>교체</strong>를 눌러 새 총대를 넣어 주세요. ' +
        '이전 총대는 지워지지 않고 기록으로 남습니다.</div>';

        var list = live.filter(function (x) { return x.kind === k; });
        h += '<h3 style="margin-top:22px">' + e(k) + ' (' + list.length + '명)</h3>';

            '<td>' + e(d.church || '-') + '</td>' +
            '<td>' + e(d.title || '-') + '</td>' +
            '<td style="font-size:0.85rem">' + termCell(d) + '</td>' +
            '<td class="left" style="font-size:0.85rem">' + e(d.note || '-') + '</td>' +
            '<td><button class="btn sm" data-dedit="' + d.id + '">수정</button></td>' +
            '</tr>';
        });
        h += '</tbody></table>';
      });

      /* 총대 추가 */
      var nextSpring = SHS.nthMonday(new Date().getFullYear() + (new Date().getMonth() >= 3 ? 1 : 0), 4, 2);
      h += '<div class="admin-card" style="margin-top:22px"><h3 style="margin-top:0">총대 추가</h3>' +
        '<div class="inline-form">' +
        '<div class="field" style="flex:0 0 150px"><label>구분</label><select id="dg-kind">' + kindOpts('장로 정총대') + '</select></div>' +
        '<div class="field" style="flex:0 0 130px"><label>성명</label><input type="text" id="dg-name"></div>' +
        '<div class="field"><label>소속 교회</label><input type="text" id="dg-church"></div>' +
        '<div class="field" style="flex:0 0 130px"><label>직책 (선택)</label><input type="text" id="dg-title" placeholder="자동총대"></div>' +
        '<div class="field" style="flex:0 0 165px"><label>자격 시작</label><input type="date" id="dg-from" value="' +
        new Date().toISOString().slice(0, 10) + '"></div>' +
        '<div class="field" style="flex:0 0 165px"><label>자격 만료</label><input type="date" id="dg-until" value="' +
        nextSpring.toISOString().slice(0, 10) + '"></div>' +
        '<button class="btn" id="dg-add">추가</button>' +
        '</div><div class="form-msg" id="dg-msg"></div></div>';

      /* 교체 기록 */
      if (past.length) {
        h += '<h3 style="margin-top:26px">교체된 총대 (' + past.length + '명)</h3>' +
          '<table class="tbl"><thead><tr><th style="width:150px">구분</th><th style="width:110px">성명</th>' +
          '<th style="width:160px">소속 교회</th><th style="width:130px">교체일</th>' +
          '<th>후임</th></tr></thead><tbody>';
        past.forEach(function (d) {
          h += '<tr><td>' + e(d.kind) + '</td><td>' + e(d.name) + '</td>' +
            '<td>' + e(d.church || '-') + '</td><td>' + e(d.replaced_at || '-') + '</td>' +
            '<td class="left">' + e(d.replaced_by || '-') + '</td></tr>';

      h += '<div class="form-msg" id="dg-rowmsg"></div>';
