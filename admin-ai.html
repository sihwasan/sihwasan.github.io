<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 검색 · API 설정 - 시화산노회</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/style.css?v=20261020fb">
</head>
<body>

<div class="page-head">
  <div class="container">
    <h1>AI 검색 · API 설정</h1>
    <div class="crumb">홈 &gt; 관리자 &gt; AI 검색 · API 설정</div>
  </div>
</div>

<main class="page-body container" id="main">
  <div id="ai-area"><p style="color:var(--gray-5)">권한을 확인하는 중...</p></div>
</main>

<script src="js/auth.js?v=20260921j"></script>
<script src="js/data.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-auth.js?v=20261020za"></script>
<script src="js/main.js?v=20261020y"></script>
<script src="js/ai-chat.js?v=20261020fb"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
 SHS.getUser().then(function (user) {
  var area = document.getElementById('ai-area');
  var e = SHS.esc;
  var WORKER = SHSAI.url;

  if (!user || !SHSAuth.canManageMembers(user)) {
    area.innerHTML =
      '<div class="notice-banner">AI 검색 설정은 <strong>관리자 등급</strong>이 이용할 수 있습니다.' +
      (user ? ' 현재 등급(' + SHS.displayRole(user.role, user.title) + ')으로는 이용할 수 없습니다.'
            : ' <a class="btn sm" style="margin-left:10px" href="login.html">로그인</a>') + '</div>';
    return;
  }
  if (!user.cloud) {
    area.innerHTML = '<div class="notice-banner">서버 로그인(구글 또는 이메일) 후 이용할 수 있습니다. ' +
      '<a class="btn sm" style="margin-left:10px" href="login.html">로그인 화면으로</a></div>';
    return;
  }

  var ROLE_OPTS = [
    { v: 'member', t: '정회원' }, { v: 'officer', t: '임원' }, { v: 'associate', t: '준회원' },
    { v: 'advisory', t: '언권회원' }, { v: 'general', t: '일반회원' }
  ];
  var WON = 1400;   /* 1달러를 원으로 어림 */
  var S = null;     /* 창구에서 받은 설정 */

  /* 탭: 설정 / 못 찾은 질문 / 확인된 답 (127 sql) — 주소 끝 #miss · #ver 로 바로 연다 */
  var TABS = [['set', '설정'], ['miss', '못 찾은 질문'], ['ver', '확인된 답']];
  area.innerHTML = '<div class="tabs" id="ai-tabs" role="tablist">' + TABS.map(function (t) {
      return '<button type="button" role="tab" data-tab="' + t[0] + '" id="ai-tb-' + t[0] + '" aria-controls="ai-tab-' + t[0] + '">' + t[1] +
        (t[0] === 'miss' ? '<span class="ai-tab-n" id="ai-miss-n"></span>' : '') + '</button>';
    }).join('') + '</div>' +
    TABS.map(function (t) { return '<div class="tab-panel" role="tabpanel" id="ai-tab-' + t[0] + '"></div>'; }).join('');
  var setBox = document.getElementById('ai-tab-set');

  function token() {
    return SHSCloud.init().then(function (c) {
      return c.auth.getSession().then(function (r) { return r && r.data && r.data.session ? r.data.session.access_token : null; });
    });
  }
  function call(path, method, body) {
    return token().then(function (tk) {
      return fetch(WORKER + path, {
        method: method || 'GET',
        headers: { Authorization: 'Bearer ' + tk, 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined
      });
    }).then(function (r) {
      return r.json().catch(function () { return { error: '창구 응답을 읽지 못했습니다 (HTTP ' + r.status + ')' }; })
        .then(function (j) { if (!r.ok && !j.error) j.error = 'HTTP ' + r.status; return j; });
    }).catch(function (x) {
      return { error: '창구(' + WORKER + ')에 연결하지 못했습니다. 아직 배포 전이거나 인터넷이 끊겼을 수 있습니다. (' + (x && x.message) + ')' };
    });
  }
  function msg(id, ok, text) {
    var el = document.getElementById(id);
    if (!el) return;
    el.className = 'form-msg ' + (ok ? 'ok' : 'err');
    el.textContent = text;
  }
  /* 질문 한 번에 드는 돈 어림: 자료 2만 토큰 읽고 1천 토큰 답할 때 */
  function perAsk(m) {
    var usd = 20000 / 1e6 * m.input + 1000 / 1e6 * m.output;
    var won = Math.round(usd * WON);
    return won < 10 ? '약 ' + won + '원' : '약 ' + Math.round(won / 10) * 10 + '원';
  }

  function draw() {
    var s = S;
    var u = s.usage || { total: 0, me: 0 };
    setBox.innerHTML =
      '<div class="notice-banner">첫 화면의 <strong>AI 검색</strong>이 쓰는 Claude API 열쇠·모델·하루 한도를 여기서 정합니다. ' +
      '열쇠는 Cloudflare 창구에 보관되며 이 화면에는 끝 네 자리만 보입니다. ' +
      '이 열쇠는 노회의 모든 AI 기능이 함께 씁니다 — AI 검색과 회계 장부(노회·시찰·상비부)의 영수증 자동 읽기.</div>' +

      '<div class="admin-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:22px">' +
      card('상태', s.enabled ? (s.has_key ? '<span style="color:#1a6d3a;font-weight:700">켜짐 · 열쇠 등록됨</span>' : '<span style="color:var(--red);font-weight:700">열쇠 없음</span>')
                               : '<span style="color:var(--gray-5);font-weight:700">꺼짐</span>',
           s.has_key ? '열쇠 끝자리 ····' + e(s.key_tail) : '열쇠를 넣어야 검색이 됩니다') +
      card('모델', '<strong>' + e(modelName(s.model)) + '</strong>', '답변 깊이: ' + effortName(s.effort)) +
      card('오늘 사용량', '<strong>' + u.total + '</strong> / ' + s.daily_total + '회 (노회 전체)', '나: ' + u.me + ' / ' + s.daily_user + '회 · ' + e(u.date || '')) +
      card('마지막 수정', s.updated_at ? e(String(s.updated_at).replace('T', ' ').slice(0, 16)) : '-', s.updated_by ? e(s.updated_by) : '') +
      '</div>' +

      '<h2>1. API 열쇠</h2>' +
      '<div class="admin-card" style="max-width:760px;margin-bottom:26px">' +
      '<p style="margin:0 0 10px">Anthropic 콘솔(console.anthropic.com → API Keys)에서 만든 열쇠를 붙여 넣고 저장하세요. ' +
      '열쇠는 <code>sk-ant-</code>로 시작합니다. 열쇠를 바꾸면 영수증 자동 읽기도 함께 새 열쇠로 바뀝니다.</p>' +
      '<div class="inline-form"><div class="field"><label>새 열쇠</label>' +
      '<input type="password" id="k-key" autocomplete="off" placeholder="sk-ant-…"></div>' +
      '<div class="field" style="flex:0 0 auto;align-self:flex-end"><button class="btn" id="k-save">열쇠 저장</button> ' +
      '<button class="btn ghost" id="k-test">연결 시험</button>' +
      (s.has_key ? ' <button class="btn danger" id="k-clear">지우기</button>' : '') + '</div></div>' +
      '<div class="form-msg" id="k-msg"></div>' +
      '<div id="k-models" style="font-size:0.82rem;color:var(--gray-5);margin-top:6px"></div></div>' +

      '<h2>2. 모델과 답변 깊이</h2>' +
      '<div class="admin-card" style="max-width:760px;margin-bottom:26px">' +
      '<div class="ai-models">' + (s.models || []).map(function (m) {
        return '<label class="ai-model' + (m.id === s.model ? ' on' : '') + '"><input type="radio" name="m-model" value="' + e(m.id) + '"' + (m.id === s.model ? ' checked' : '') + '>' +
          '<span class="ai-model-n">' + e(m.name) + '</span><span class="ai-model-d">' + e(m.note) + '</span>' +
          '<span class="ai-model-p">질문 1건 ' + perAsk(m) + ' <small>(입력 $' + m.input + ' · 출력 $' + m.output + ' /100만 토큰)</small></span></label>';
      }).join('') + '</div>' +
      '<div class="field" style="margin-top:14px"><label>답변 깊이</label><select id="m-effort" style="max-width:260px">' +
      [['low', '빠르게 (간단한 질문에 알맞음)'], ['medium', '보통 (권장)'], ['high', '꼼꼼하게 (느리고 비용이 조금 더 듦)']].map(function (o) {
        return '<option value="' + o[0] + '"' + (s.effort === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
      }).join('') + '</select></div>' +
      '<p style="font-size:0.82rem;color:var(--gray-5);margin:6px 0 0">값은 어림입니다. 실제 비용은 Anthropic 콘솔의 Usage 에서 확인하세요.</p>' +
      '<div style="margin-top:14px"><button class="btn" id="m-save">모델·답변 깊이 저장</button></div>' +
      '<div class="form-msg" id="m-msg"></div></div>' +

      '<h2>3. 누가 얼마나</h2>' +
      '<div class="admin-card" style="max-width:760px;margin-bottom:26px">' +
      '<div class="inline-form">' +
      '<div class="field" style="flex:0 0 180px"><label>하루 1인 한도 (회)</label><input type="number" id="l-user" min="1" max="500" value="' + s.daily_user + '"></div>' +
      '<div class="field" style="flex:0 0 180px"><label>하루 전체 한도 (회)</label><input type="number" id="l-total" min="1" max="5000" value="' + s.daily_total + '"></div></div>' +
      '<div class="field"><label>이용할 수 있는 등급 (관리자는 늘 포함)</label><div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:4px">' +
      ROLE_OPTS.map(function (o) {
        return '<label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" name="r-role" value="' + o.v + '"' +
          ((s.roles || []).indexOf(o.v) !== -1 ? ' checked' : '') + '> ' + o.t + '</label>';
      }).join('') + '</div></div>' +
      '<label style="display:flex;gap:8px;align-items:center;margin-top:10px;cursor:pointer"><input type="checkbox" id="s-enabled"' + (s.enabled ? ' checked' : '') + '> ' +
      '<strong>AI 검색 켜기</strong> <span style="font-size:0.84rem;color:var(--gray-5)">끄면 검색창이 "지금은 꺼져 있습니다"라고 알립니다</span></label>' +
      '<div style="margin-top:14px"><button class="btn" id="s-save">설정 저장</button> ' +
      '<button class="btn ghost" id="s-try">검색 시험 (짧은 인사)</button></div>' +
      '<div class="form-msg" id="s-msg"></div></div>' +

      '<h2>4. 최근 질문 기록</h2>' +
      '<div id="ai-logs"><p style="color:var(--gray-5)">불러오는 중...</p></div>' +

      '<h2>5. 창구 정보</h2>' +
      '<div class="admin-card" style="max-width:760px">' +
      '<p style="font-size:0.9rem;line-height:1.8;margin:0">창구 주소: <code>' + e(WORKER) + '</code><br>' +
      '총회 자료 색인: <span id="w-index">' + (s.index ? '조각 ' + s.index.chunks + '개 · 기준일 ' + e(s.index.built) : '확인 중…') + '</span><br>' +
      '자료는 질문한 분의 로그인 권한으로 읽으므로, 홈페이지에서 볼 수 없는 자료는 AI 도 보지 못합니다. ' +
      '회의록·임원 자료실은 임원만, 생년월일·정년은 관리자만 답에 쓰입니다.</p></div>';

    bind();
    loadLogs();
    call('/health').then(function (h) {
      var el = document.getElementById('w-index');
      if (el && h && h.index) el.textContent = '조각 ' + h.index.chunks + '개 · 기준일 ' + h.index.built + (h.colo ? ' · 접속 지점 ' + h.colo : '');
      else if (el) el.textContent = h && h.error ? h.error : '색인을 아직 받지 못했습니다';
    });
  }
  function card(t, big, small) {
    return '<div class="admin-card" style="padding:14px 16px"><div style="font-size:0.76rem;letter-spacing:2px;color:var(--gray-5)">' + t + '</div>' +
      '<div style="font-size:1.05rem;margin:6px 0 2px">' + big + '</div><div style="font-size:0.82rem;color:var(--gray-5)">' + small + '</div></div>';
  }
  function modelName(id) { var m = (S.models || []).filter(function (x) { return x.id === id; })[0]; return m ? m.name : id; }
  function effortName(v) { return { low: '빠르게', medium: '보통', high: '꼼꼼하게' }[v] || v; }

  function bind() {
    document.getElementById('k-save').addEventListener('click', function () {
      var k = document.getElementById('k-key').value.trim();
      if (!k) { msg('k-msg', false, '열쇠를 붙여 넣어 주세요.'); return; }
      if (k.indexOf('sk-ant-') !== 0) { msg('k-msg', false, '열쇠는 sk-ant- 로 시작합니다. 다시 확인해 주세요.'); return; }
      msg('k-msg', true, '저장하는 중…');
      call('/settings', 'POST', { api_key: k }).then(function (r) {
        if (r.error) { msg('k-msg', false, r.error); return; }
        S = r; document.getElementById('k-key').value = '';
        SHSCloud.log('update', 'AI 검색 열쇠 등록', '끝자리 ' + r.key_tail);
        draw(); msg('k-msg', true, '열쇠를 저장했습니다. 「연결 시험」으로 확인해 보세요.');
      });
    });
    document.getElementById('k-test').addEventListener('click', function () {
      var k = document.getElementById('k-key').value.trim();
      msg('k-msg', true, '열쇠로 모델 목록을 받아 보는 중…');
      call('/settings/test', 'POST', k ? { api_key: k } : {}).then(function (r) {
        if (r.error || !r.ok) { msg('k-msg', false, r.error || '시험에 실패했습니다.'); return; }
        msg('k-msg', true, '연결되었습니다. 쓸 수 있는 모델 ' + (r.models || []).length + '개.');
        document.getElementById('k-models').textContent = (r.models || []).join(', ');
      });
    });
    var clr = document.getElementById('k-clear');
    if (clr) clr.addEventListener('click', function () {
      if (!confirm('등록된 열쇠를 지우시겠습니까? 지우면 AI 검색과 영수증 자동 읽기가 함께 멈춥니다.')) return;
      call('/settings', 'POST', { clear_key: true }).then(function (r) {
        if (r.error) { alert(r.error); return; }
        S = r; SHSCloud.log('update', 'AI 검색 열쇠 삭제', ''); draw();
      });
    });
    document.querySelectorAll('input[name="m-model"]').forEach(function (i) {
      i.addEventListener('change', function () {
        document.querySelectorAll('.ai-model').forEach(function (l) { l.classList.toggle('on', l.querySelector('input').checked); });
      });
    });
    /* 모델·답변 깊이·한도·등급·켜기를 한꺼번에 저장한다 (2번 칸과 3번 칸의 단추가 같이 쓴다) */
    function saveAll(msgId) {
      var body = {
        model: (document.querySelector('input[name="m-model"]:checked') || {}).value,
        effort: document.getElementById('m-effort').value,
        daily_user: parseInt(document.getElementById('l-user').value, 10),
        daily_total: parseInt(document.getElementById('l-total').value, 10),
        roles: [].map.call(document.querySelectorAll('input[name="r-role"]:checked'), function (c) { return c.value; }),
        enabled: document.getElementById('s-enabled').checked
      };
      msg(msgId, true, '저장하는 중…');
      call('/settings', 'POST', body).then(function (r) {
        if (r.error) { msg(msgId, false, r.error); return; }
        S = r;
        SHSCloud.log('update', 'AI 검색 설정', body.model + ' / ' + body.effort + ' / 1인 ' + body.daily_user + ' 전체 ' + body.daily_total + (body.enabled ? '' : ' / 끔'));
        draw();
        msg(msgId, true, '저장했습니다. 모델: ' + modelName(r.model) + ' · 답변 깊이: ' + effortName(r.effort));
        var el = document.getElementById(msgId); if (el) el.scrollIntoView({ block: 'center' });
      });
    }
    document.getElementById('m-save').addEventListener('click', function () { saveAll('m-msg'); });
    document.getElementById('s-save').addEventListener('click', function () { saveAll('s-msg'); });
    document.getElementById('s-try').addEventListener('click', function () {
      msg('s-msg', true, '고른 모델로 짧은 인사를 시켜 보는 중… (토큰을 조금 씁니다)');
      call('/settings/test', 'POST', { full: true, model: (document.querySelector('input[name="m-model"]:checked') || {}).value }).then(function (r) {
        if (r.error || !r.ok) { msg('s-msg', false, r.error || '시험에 실패했습니다.'); return; }
        msg('s-msg', true, '응답(' + (r.model || '') + '): ' + (r.reply || '(빈 답)'));
      });
    });
  }

  function loadLogs() {
    var box = document.getElementById('ai-logs');
    SHSCloud.init().then(function (c) {
      return c.from('ai_logs').select('created_at,user_name,role,question,answer_chars,model,input_tokens,output_tokens,ms')
        .order('created_at', { ascending: false }).limit(40);
    }).then(function (r) {
      if (r.error) {
        box.innerHTML = '<div class="notice-banner">질문 기록 표(ai_logs)가 아직 없습니다. <code>supabase/114_ai_search.sql</code> 을 SQL Editor 에서 실행하면 여기에 기록이 쌓입니다.' +
          '<br><small style="color:var(--gray-5)">' + e(r.error.message) + '</small></div>';
        return;
      }
      var rows = r.data || [];
      if (!rows.length) { box.innerHTML = '<p style="color:var(--gray-5)">아직 질문 기록이 없습니다. (최고관리자의 질문은 기록하지 않습니다)</p>'; return; }
      var tot = rows.reduce(function (a, x) { return a + (x.input_tokens || 0) * 0 + 1; }, 0);
      var h = '<table class="tbl"><thead><tr><th style="width:130px">때</th><th style="width:120px">누가</th><th>질문</th>' +
        '<th style="width:90px">토큰</th><th style="width:60px">초</th></tr></thead><tbody>';
      rows.forEach(function (x) {
        h += '<tr><td>' + e(when(x.created_at).slice(5)) + '</td>' +
          '<td>' + e(x.user_name || '') + '<br><small style="color:var(--gray-5)">' + e(SHS.displayRole(x.role)) + '</small></td>' +
          '<td class="left">' + e(x.question) + '</td>' +
          '<td><small>' + (x.input_tokens || 0).toLocaleString() + ' / ' + (x.output_tokens || 0).toLocaleString() + '</small></td>' +
          '<td>' + (x.ms ? Math.round(x.ms / 100) / 10 : '-') + '</td></tr>';
      });
      box.innerHTML = '<p style="font-size:0.84rem;color:var(--gray-5)">최근 ' + tot + '건 · 토큰은 입력 / 출력 · 최고관리자의 질문은 기록하지 않습니다</p>' + h + '</tbody></table>';
    });
  }

  /* =====================================================================
   *  쓰면 쓸수록 나아지는 구조 (127 sql)
   *  못 찾은 질문: ai_logs 가운데 「자료에서 못 찾음」이거나 「아니에요」 평가를 받은 것 (최근 순).
   *    질문한 분의 이름은 보이지 않고(등급만), 질문 속 이름·전화번호는 가린다.
   *  확인된 답: ai_verified — 관리자가 승인한 답. AI 가 다음 질문부터 우선 근거로 쓴다 (원문으로 다시 확인).
   * ===================================================================== */
  var LEVELS = [['member', '정회원 이상'], ['officer', '임원 이상'], ['admin', '관리자만']];
  var OFFICER_KINDS = ['노회 회의록', '임원 자료실', '상회비 관리 (임원방)', '세례의무금 관리 (임원방)'];
  var NEED_SQL = '<div class="notice-banner">이 기능은 <code>supabase/127_ai_learning.sql</code> 을 Supabase SQL Editor 에서 실행해야 쓸 수 있습니다.';
  var ED = null;      /* 열려 있는 편집 칸 { host, dirty, busy } — 한 번에 하나 */
  var NAMES = null;   /* 가릴 이름 (회원 명단) */
  var loaded = {};
  function lvName(v) { var x = LEVELS.filter(function (l) { return l[0] === v; })[0]; return x ? x[1] : v; }
  /* 서버 시각(UTC)을 이 컴퓨터 시각(한국)으로 — 2026-10-20 14:03 */
  function when(iso) {
    var d = new Date(iso);
    if (!iso || isNaN(d)) return '';
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function db() { return SHSCloud.init(); }
  function needSql(err) { return /column|relation|does not exist|schema cache|PGRST20/.test((err && (err.message || err.code)) || ''); }

  /* ---------- 가리기: 전화번호, 명단의 이름, 「○○○ 목사」 꼴의 이름 ---------- */
  var NOT_NAME = /^(위임|시무|담임|원로|은퇴|무임|협동|전임|임시|교육|선교|동사|노회장|부노회장|총회장|부총회장|서기|부서기|회계|부회계|회록서기|시찰장|위원장|이사장|증경|정회원|언권|해당|여러|모든|어느|신임|후임|청빙|장립|안수|정년|총대|정총대|부총대|소속|교회|노회|총회|당회장|임원|시무장로|은퇴장로|원로장로|피택|휴무|안수집사|파송|기관|각교회|우리|저희|다른|담당|정치부|전도부|교육부|선교부|재정부|고시부|부회장|임원회|은퇴한|전임자|후임자|신임자|이번|지난|다음|현직|전직|임시로)$/;
  var SURNAMES = '김이박최정강조윤장임한오서신권황안송류유전홍고문양손배백허남심노하곽성차주우구민진나지엄채원천방공현함변염여추도소석선설마길연위표명기반왕금옥육인맹제모탁국어은편용예봉경사부';
  function maskPhone(s) {
    return String(s || '').replace(/(\+?82[-.\s]?)?0\d{1,2}[-.\s)]*\d{3,4}[-.\s]*\d{4}/g, '○○○-○○○○-○○○○');
  }
  function hide(n) { return n.charAt(0) + new Array(n.length).join('○'); }
  function mask(s) {
    s = maskPhone(s);
    (NAMES || []).forEach(function (n) { if (s.indexOf(n) !== -1) s = s.split(n).join(hide(n)); });
    /* 명단에 없는 이름: 성으로 시작하는 세 글자 낱말 + 직분 (「교회에서 목사」 같은 말은 건드리지 않는다) */
    return s.replace(/(^|[^가-힣])([가-힣]{3})(\s?)(목사님|목사|장로님|장로|전도사님|전도사|강도사|집사님|집사|권사님|권사|사모님|사모|선교사)/g,
      function (m, pre, n, sp, t) { return NOT_NAME.test(n) || SURNAMES.indexOf(n.charAt(0)) === -1 ? m : pre + hide(n) + sp + t; });
  }
  function loadNames() {
    if (NAMES) return Promise.resolve(NAMES);
    return db().then(function (c) { return c.from('roster').select('name'); }).then(function (r) {
      var seen = {};
      NAMES = ((r && r.data) || []).map(function (x) { return String(x.name || '').trim(); })
        .filter(function (n) { if (n.length < 3 || seen[n]) return false; seen[n] = 1; return true; })
        .sort(function (a, b) { return b.length - a.length; });
      return NAMES;
    }, function () { NAMES = []; return NAMES; });
  }

  /* ---------- 답 글 ---------- */
  function plainAns(t) {
    return String(t || '').replace(/\r/g, '').replace(/\[(R\d+)\]\{\{[^{}]*\}\}/g, '[$1]').replace(/\{\{[^{}]*\}\}/g, '')
      .replace(/\[R(\d+)\]/g, '[$1]').replace(/\*\*([^*]+)\*\*/g, '$1').trim();
  }
  /* 확인된 답으로 넣을 글: 근거 번호를 원문 이름으로 바꾼다 — 「… 행한다 (근거: 권징조례 제35조).」 */
  function toVerifiedText(t, sources) {
    var by = {};
    (sources || []).forEach(function (s) { if (s && s.ref) by[s.ref] = s; });
    t = String(t || '').replace(/\r/g, '').replace(/(?:\s*\[R\d+\](?:\{\{[^{}]*\}\})?)+/g, function (m) {
      var refs = (m.match(/R\d+/g) || []).filter(function (r, i, a) { return a.indexOf(r) === i; });
      var titles = refs.map(function (r) { return by[r] && by[r].title; }).filter(Boolean);
      return titles.length ? ' (근거: ' + titles.join(', ') + ')' : '';
    });
    return maskPhone(t.replace(/\{\{[^{}]*\}\}/g, '').replace(/\*\*([^*]+)\*\*/g, '$1')).trim();
  }
  function srcLink(s) {
    var t = e(s.title || '') + (s.kind ? ' <small>(' + e(s.kind) + ')</small>' : '');
    return s.url ? '<a href="' + e(s.url) + '" target="_blank" rel="noopener">' + t + '</a>' : t;
  }

  /* ---------- 편집 칸 (승인·고치기 같이 씀) ---------- */
  function edDirty() { return !!(ED && ED.dirty); }
  function closeEditor(force) {
    if (!ED) return true;
    if (!force && ED.dirty && !confirm('쓰던 확인된 답이 저장되지 않았습니다. 버리고 닫을까요?')) return false;
    var back = ED.back;
    ED.host.innerHTML = '';
    ED = null;
    if (back) try { back.focus(); } catch (x) {}
    return true;
  }
  window.addEventListener('beforeunload', function (ev) { if (edDirty()) { ev.preventDefault(); ev.returnValue = ''; } });

  /* init: { id?, from_log?, question, keywords, answer, sources:[{title,url,kind,on}], level } */
  function openEditor(host, init, back, onDone) {
    if (ED && ED.host === host) return;
    if (!closeEditor(false)) return;
    ED = { host: host, dirty: false, busy: false, back: back };
    var isNew = !init.id;
    host.innerHTML =
      '<form class="aiv-ed" autocomplete="off">' +
      '<div class="field"><label for="ed-q">질문 <small>(다듬어 주세요 — 회원들이 물을 법한 말로)</small></label>' +
      '<input type="text" id="ed-q" maxlength="500" value="' + e(init.question || '') + '"></div>' +
      '<div class="field"><label for="ed-k">함께 찾을 말 <small>(선택 · 쉼표로 — 예: 해벌, 복직, 시벌 해제)</small></label>' +
      '<input type="text" id="ed-k" maxlength="300" value="' + e(init.keywords || '') + '"></div>' +
      '<div class="field"><label for="ed-a">확인된 답 <small>(원문과 맞는지 확인하고 고쳐 주세요. 근거 번호는 원문 이름으로 바꿔 넣었습니다)</small></label>' +
      '<textarea id="ed-a" maxlength="8000">' + e(init.answer || '') + '</textarea></div>' +
      '<div class="field"><label>원문 근거 <small>(AI 가 이 원문을 다시 찾아 확인합니다)</small></label>' +
      ((init.sources || []).length ? '<div class="aiv-ed-src">' + init.sources.map(function (s, i) {
        return '<label><input type="checkbox" class="ed-src" data-i="' + i + '"' + (s.on ? ' checked' : '') + '> <span>' + e(s.title) +
          (s.kind ? ' <small>(' + e(s.kind) + ')</small>' : '') + '</span></label>';
      }).join('') + '</div>' : '<p class="aiv-note" style="margin:0">근거 목록이 없습니다. 답 안에 조문 이름(예: 권징조례 제35조)을 적어 주시면 AI 가 그것으로 찾습니다.</p>') + '</div>' +
      '<div class="field" style="max-width:280px"><label for="ed-lv">누가 볼 수 있나</label><select id="ed-lv">' +
      LEVELS.map(function (l) { return '<option value="' + l[0] + '"' + (init.level === l[0] ? ' selected' : '') + '>' + l[1] + '</option>'; }).join('') +
      '</select></div>' +
      '<p class="aiv-hint">사람·날짜처럼 바뀌는 내용(임원 명단, 일정, 상회비 현황)은 승인하지 않는 편이 좋습니다. 그런 것은 AI 가 그때그때 명단·일정에서 찾습니다. ' +
      '임원만 볼 자료(회의록·임원 자료실·상회비)에서 나온 답은 「임원 이상」으로 두세요.</p>' +
      '<div class="aiv-acts"><button type="submit" class="btn" id="ed-save">' + (isNew ? '확인된 답으로 승인' : '고친 내용 저장') + '</button>' +
      '<button type="button" class="btn ghost" id="ed-cancel">취소</button></div>' +
      '<div class="form-msg" id="ed-msg" role="status"></div></form>';
    var form = host.querySelector('form');
    form.addEventListener('input', function () { if (ED) ED.dirty = true; });
    form.addEventListener('change', function () { if (ED) ED.dirty = true; });
    form.querySelector('#ed-cancel').addEventListener('click', function () { closeEditor(false); });
    form.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') { ev.preventDefault(); closeEditor(false); } });
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      if (!ED || ED.busy) return;   /* 연타해도 한 번만 */
      var q = form.querySelector('#ed-q').value.trim();
      var a = form.querySelector('#ed-a').value.trim();
      if (q.length < 2) { msg('ed-msg', false, '질문을 적어 주세요.'); form.querySelector('#ed-q').focus(); return; }
      if (a.length < 2) { msg('ed-msg', false, '답을 적어 주세요.'); form.querySelector('#ed-a').focus(); return; }
      var payload = {
        question: q, answer: a,
        keywords: form.querySelector('#ed-k').value.trim() || null,
        level: form.querySelector('#ed-lv').value,
        sources: [].filter.call(form.querySelectorAll('.ed-src'), function (c) { return c.checked; }).map(function (c) {
          var s = init.sources[parseInt(c.dataset.i, 10)];
          return { title: s.title, url: s.url || '', kind: s.kind || '' };
        })
      };
      if (isNew && init.from_log) payload.from_log = init.from_log;
      var btn = form.querySelector('#ed-save');
      ED.busy = true; btn.disabled = true; btn.textContent = '저장하는 중…';
      msg('ed-msg', true, '저장하는 중…');
      db().then(function (c) {
        var t = c.from('ai_verified');
        return (isNew ? t.insert(payload) : t.update(payload).eq('id', init.id)).select('id');
      }).then(function (r) {
        if (r.error || !r.data || !r.data.length) {
          ED.busy = false; btn.disabled = false; btn.textContent = isNew ? '확인된 답으로 승인' : '고친 내용 저장';
          msg('ed-msg', false, r.error ? (needSql(r.error) ? '127 sql 을 먼저 실행해 주세요. ' : '') + r.error.message
            : '저장하지 못했습니다. 관리자 2단계 인증(OTP)을 마쳤는지 확인해 주세요.');
          return;
        }
        SHSCloud.log(isNew ? 'create' : 'update', isNew ? 'AI 확인된 답 승인' : 'AI 확인된 답 수정', q.slice(0, 80) + ' [' + lvName(payload.level) + ']');
        closeEditor(true);
        if (onDone) onDone(r.data[0].id);
      });
    });
    var first = form.querySelector('#ed-q');
    if (first) { first.focus(); try { host.scrollIntoView({ block: 'nearest' }); } catch (x) {} }
  }

  /* ---------- 못 찾은 질문 ---------- */
  var MISS = { filter: 'todo', rows: [], more: false, busy: false };
  var MISS_FILTERS = [['todo', '못 찾음 · 낮은 평가'], ['good', '도움이 됐어요'], ['done', '처리한 것'], ['all', '모든 기록']];
  function missCount() {
    db().then(function (c) {
      return c.from('ai_logs').select('id', { count: 'exact', head: true }).or('no_answer.eq.true,fb_helpful.eq.false').is('review', null);
    }).then(function (r) {
      var el = document.getElementById('ai-miss-n');
      if (el) el.textContent = r && !r.error && r.count ? (r.count > 99 ? '99+' : String(r.count)) : '';
    });
  }
  function loadMiss(append) {
    var box = document.getElementById('ai-tab-miss');
    if (MISS.busy) return;
    MISS.busy = true;
    if (!append) { MISS.rows = []; box.innerHTML = '<p style="color:var(--gray-5)">불러오는 중...</p>'; }
    Promise.all([db(), loadNames()]).then(function (x) {
      var q = x[0].from('ai_logs')
        .select('id,created_at,role,question,answer,sources,no_answer,fb_helpful,fb_reason,review,reviewed_by,reviewed_at,verified_id')
        .order('created_at', { ascending: false }).limit(30);
      if (MISS.filter === 'todo') q = q.or('no_answer.eq.true,fb_helpful.eq.false').is('review', null);
      else if (MISS.filter === 'good') q = q.eq('fb_helpful', true).is('review', null);
      else if (MISS.filter === 'done') q = q.not('review', 'is', null);
      if (append && MISS.rows.length) q = q.lt('created_at', MISS.rows[MISS.rows.length - 1].created_at);
      return q;
    }).then(function (r) {
      MISS.busy = false;
      if (r.error) {
        loaded.miss = false;   /* 탭을 다시 누르면 다시 불러온다 */
        box.innerHTML = needSql(r.error) ? NEED_SQL + '<br><small style="color:var(--gray-5)">' + e(r.error.message) + '</small></div>'
          : '<div class="notice-banner">기록을 불러오지 못했습니다: ' + e(r.error.message) + '</div>';
        return;
      }
      MISS.rows = MISS.rows.concat(r.data || []);
      MISS.more = (r.data || []).length === 30;
      drawMiss();
    }, function (err) { MISS.busy = false; loaded.miss = false; box.innerHTML = '<div class="notice-banner">' + e(err && err.message) + '</div>'; });
  }
  function drawMiss() {
    var box = document.getElementById('ai-tab-miss');
    var h = '<p class="aiv-note">AI 가 자료에서 답을 찾지 못했거나 회원이 「아니에요」라고 평가한 질문입니다(최근 순). ' +
      '원문을 확인해 바른 답을 「확인된 답」으로 승인하면, 다음부터 비슷한 질문에 AI 가 그 답을 먼저 근거로 씁니다. ' +
      '질문한 분의 이름은 보이지 않으며 질문 속 이름·전화번호는 가려서 보입니다.</p>' +
      '<div class="aiv-bar"><div class="tabs sub-tabs" id="miss-f">' + MISS_FILTERS.map(function (f) {
        return '<button type="button" data-f="' + f[0] + '"' + (MISS.filter === f[0] ? ' class="active"' : '') + '>' + f[1] + '</button>';
      }).join('') + '</div></div>';
    if (!MISS.rows.length) {
      h += '<p class="aiv-empty">' + (MISS.filter === 'todo' ? '살펴볼 질문이 없습니다. 회원이 「아니에요」를 누르거나 AI 가 자료를 못 찾으면 여기에 올라옵니다.' : '해당하는 기록이 없습니다.') + '</p>';
    }
    MISS.rows.forEach(function (x) {
      var srcs = Array.isArray(x.sources) ? x.sources : [];
      var cited = srcs.filter(function (s) { return s && s.cited; });
      h += '<div class="aiv-item" data-id="' + x.id + '">' +
        '<div class="aiv-meta"><span>' + e(when(x.created_at)) + '</span><span>' + e(SHS.displayRole(x.role)) + '</span>' +
        (x.no_answer ? '<span class="aiv-badge miss">자료에서 못 찾음</span>' : '') +
        (x.fb_helpful === false ? '<span class="aiv-badge down">아니에요</span>' : x.fb_helpful === true ? '<span class="aiv-badge up">도움이 됐어요</span>' : '') +
        (x.review === 'verified' ? '<span class="aiv-badge ok">승인함' + (x.reviewed_by ? ' · ' + e(x.reviewed_by) : '') + '</span>' : '') +
        (x.review === 'skip' ? '<span class="aiv-badge">넘김' + (x.reviewed_by ? ' · ' + e(x.reviewed_by) : '') + '</span>' : '') +
        '</div>' +
        '<div class="aiv-q">' + e(mask(x.question)) + '</div>' +
        (x.fb_reason ? '<div class="aiv-reason">이유: ' + e(mask(x.fb_reason)) + '</div>' : '') +
        (x.answer ? '<details><summary>AI 답 보기' + (cited.length ? ' · 근거 ' + cited.length + '건' : ' · 근거 없음') + '</summary>' +
          '<div class="aiv-ans">' + e(maskPhone(plainAns(x.answer))) + '</div>' +
          (cited.length ? '<div class="aiv-srcs">' + cited.map(function (s) { return '[' + e(String(s.ref || '').slice(1)) + '] ' + srcLink(s); }).join('<br>') + '</div>' : '') +
          '</details>' : '<p class="aiv-note" style="margin:6px 0">답 본문이 남아 있지 않습니다 (127 sql 실행 전 기록이거나 오류로 끝난 질문).</p>') +
        '<div class="aiv-acts">' +
        (x.review === 'verified' ? '<button type="button" class="btn ghost sm" data-act="see">확인된 답 보기</button>'
          : '<button type="button" class="btn sm" data-act="approve">확인된 답으로 승인</button>' +
            (x.review === 'skip' ? '<button type="button" class="btn ghost sm" data-act="unskip">처리 전으로 되돌리기</button>'
              : '<button type="button" class="btn ghost sm" data-act="skip">넘기기</button>')) +
        '<span class="form-msg" role="status"></span></div>' +
        '<div class="aiv-ed-host"></div></div>';
    });
    if (MISS.more) h += '<div style="text-align:center;margin:10px 0 4px"><button type="button" class="btn ghost" id="miss-more">더 보기</button></div>';
    box.innerHTML = h;
  }
  function onMissClick(ev) {
    var f = ev.target.closest('#miss-f button');
    if (f) {
      if (f.dataset.f === MISS.filter || !closeEditor(false)) return;
      MISS.filter = f.dataset.f; loadMiss(false); return;
    }
    if (ev.target.closest('#miss-more')) { var mb = ev.target.closest('#miss-more'); mb.disabled = true; mb.textContent = '불러오는 중…'; loadMiss(true); return; }
    var b = ev.target.closest('button[data-act]');
    if (!b) return;
    var item = b.closest('.aiv-item');
    var x = MISS.rows.filter(function (r) { return String(r.id) === item.dataset.id; })[0];
    if (!x) return;
    var act = b.dataset.act;
    if (act === 'approve') {
      var srcs = (Array.isArray(x.sources) ? x.sources : []).filter(function (s) { return s && s.title && !/^확인된 답/.test(s.kind || ''); });
      var officer = srcs.some(function (s) { return s.cited && OFFICER_KINDS.indexOf(s.kind) !== -1; });
      openEditor(item.querySelector('.aiv-ed-host'), {
        from_log: x.id, question: mask(x.question), keywords: '',
        answer: x.answer ? toVerifiedText(x.answer, x.sources) : '',
        sources: srcs.map(function (s) { return { title: s.title, url: s.url, kind: s.kind, on: !!s.cited }; }),
        level: officer ? 'officer' : 'member'
      }, b, function () { loadMiss(false); missCount(); loaded.ver = false; });
      return;
    }
    if (act === 'see') { showTab('ver', x.verified_id); return; }
    if (act === 'skip' || act === 'unskip') {
      if (b.disabled) return;
      b.disabled = true;
      var out = item.querySelector('.aiv-acts .form-msg');
      db().then(function (c) {
        return c.from('ai_logs').update(act === 'skip' ? { review: 'skip', reviewed_at: new Date().toISOString(), reviewed_by: user.name || '' }
          : { review: null, reviewed_at: null, reviewed_by: null }).eq('id', x.id).select('id');
      }).then(function (r) {
        if (r.error || !r.data || !r.data.length) {
          b.disabled = false;
          if (out) { out.className = 'form-msg err'; out.textContent = r.error ? r.error.message : '바꾸지 못했습니다 (2단계 인증 확인).'; }
          return;
        }
        if (ED && item.contains(ED.host)) closeEditor(true);
        loadMiss(false); missCount();
      });
    }
  }

  /* ---------- 확인된 답 ---------- */
  var VER = { rows: [], find: '', focus: null };
  function loadVer() {
    var box = document.getElementById('ai-tab-ver');
    box.innerHTML = '<p style="color:var(--gray-5)">불러오는 중...</p>';
    db().then(function (c) {
      return c.from('ai_verified').select('id,question,keywords,answer,sources,level,active,from_log,created_name,updated_name,created_at,updated_at')
        .order('updated_at', { ascending: false }).limit(500);
    }).then(function (r) {
      if (r.error) {
        box.innerHTML = needSql(r.error) ? NEED_SQL + '<br><small style="color:var(--gray-5)">' + e(r.error.message) + '</small></div>'
          : '<div class="notice-banner">확인된 답을 불러오지 못했습니다: ' + e(r.error.message) + '</div>';
        return;
      }
      VER.rows = r.data || [];
      loaded.ver = true;
      drawVer();
    });
  }
  function drawVer() {
    var box = document.getElementById('ai-tab-ver');
    var on = VER.rows.filter(function (v) { return v.active; }).length;
    box.innerHTML = '<p class="aiv-note">관리자가 승인한 답 ' + VER.rows.length + '건 (쓰는 중 ' + on + '건). AI 는 질문한 분의 등급에 맞는 답만 읽어 ' +
      '총회 자료보다 먼저 근거로 쓰고, 그 답이 든 원문 조문으로 다시 확인합니다. 숨기면 AI 가 쓰지 않습니다.</p>' +
      '<div class="aiv-bar"><input type="search" id="ver-find" placeholder="질문·답에서 찾기" value="' + e(VER.find) + '">' +
      '<button type="button" class="btn" id="ver-new">새 확인된 답 쓰기</button></div>' +
      '<div class="aiv-ed-host" id="ver-new-host"></div><div id="ver-list"></div>';
    drawVerList();
  }
  function drawVerList() {
    var list = document.getElementById('ver-list');
    if (!list) return;
    var f = VER.find.trim().toLowerCase();
    var rows = VER.rows.filter(function (v) { return !f || (v.question + ' ' + (v.keywords || '') + ' ' + v.answer).toLowerCase().indexOf(f) !== -1; });
    if (!rows.length) {
      list.innerHTML = '<p class="aiv-empty">' + (VER.rows.length ? '찾는 말과 맞는 답이 없습니다.' : '아직 확인된 답이 없습니다. 「못 찾은 질문」에서 승인하거나 「새 확인된 답 쓰기」로 시작하세요.') + '</p>';
      return;
    }
    list.innerHTML = rows.map(function (v) {
      var srcs = Array.isArray(v.sources) ? v.sources : [];
      return '<div class="aiv-item' + (v.active ? '' : ' off') + '" data-id="' + v.id + '" id="ver-' + v.id + '">' +
        '<div class="aiv-meta"><span class="aiv-badge lv">' + e(lvName(v.level)) + '</span>' +
        (v.active ? '<span class="aiv-badge up">쓰는 중</span>' : '<span class="aiv-badge">숨김</span>') +
        '<span>승인 ' + e(v.created_name || '') + ' ' + e(when(v.created_at).slice(0, 10)) + '</span>' +
        (v.updated_at && v.updated_at !== v.created_at ? '<span>· 고침 ' + e(v.updated_name || '') + ' ' + e(when(v.updated_at)) + '</span>' : '') +
        (v.from_log ? '<span>· 질문 기록 #' + v.from_log + '</span>' : '') + '</div>' +
        '<div class="aiv-q">' + e(v.question) + '</div>' +
        (v.keywords ? '<div class="aiv-srcs">함께 찾을 말: ' + e(v.keywords) + '</div>' : '') +
        '<div class="aiv-ans">' + e(v.answer) + '</div>' +
        (srcs.length ? '<div class="aiv-srcs">원문 근거: ' + srcs.map(srcLink).join(' · ') + '</div>' : '') +
        '<div class="aiv-acts"><button type="button" class="btn sm" data-act="edit">고치기</button>' +
        '<button type="button" class="btn ghost sm" data-act="toggle">' + (v.active ? '숨기기' : '다시 쓰기') + '</button>' +
        '<span class="aiv-del"><button type="button" class="btn ghost sm" data-act="del">삭제</button></span>' +
        '<span class="form-msg" role="status"></span></div>' +
        '<div class="aiv-ed-host"></div></div>';
    }).join('');
    if (VER.focus) {
      var el = document.getElementById('ver-' + VER.focus);
      VER.focus = null;
      if (el) { el.style.borderColor = '#1a6d3a'; try { el.scrollIntoView({ block: 'center' }); } catch (x) {} }
    }
  }
  function verSources(v) {
    return (Array.isArray(v.sources) ? v.sources : []).map(function (s) { return { title: s.title, url: s.url, kind: s.kind, on: true }; });
  }
  function onVerClick(ev) {
    if (ev.target.closest('#ver-new')) {
      openEditor(document.getElementById('ver-new-host'), { question: '', keywords: '', answer: '', sources: [], level: 'member' },
        ev.target.closest('#ver-new'), function () { loadVer(); });
      return;
    }
    var b = ev.target.closest('button[data-act]');
    if (!b) return;
    var item = b.closest('.aiv-item');
    var v = VER.rows.filter(function (r) { return String(r.id) === item.dataset.id; })[0];
    if (!v) return;
    var out = item.querySelector('.aiv-acts .form-msg');
    function fail(t) { b.disabled = false; if (out) { out.className = 'form-msg err'; out.textContent = t; } }
    var act = b.dataset.act;
    if (act === 'edit') {
      openEditor(item.querySelector('.aiv-ed-host'), { id: v.id, question: v.question, keywords: v.keywords || '', answer: v.answer,
        sources: verSources(v), level: v.level }, b, function () { loadVer(); });
      return;
    }
    if (act === 'del') {
      /* 지우기 전에 그 자리에서 한 번 더 묻는다 */
      item.querySelector('.aiv-del').innerHTML = '<span class="aiv-confirm">이 확인된 답을 지울까요? ' +
        '<button type="button" class="btn danger sm" data-act="del-yes">지우기</button>' +
        '<button type="button" class="btn ghost sm" data-act="del-no">취소</button></span>';
      item.querySelector('[data-act="del-no"]').focus();
      return;
    }
    if (act === 'del-no') { item.querySelector('.aiv-del').innerHTML = '<button type="button" class="btn ghost sm" data-act="del">삭제</button>'; item.querySelector('[data-act="del"]').focus(); return; }
    if (b.disabled) return;
    b.disabled = true;
    db().then(function (c) {
      var t = c.from('ai_verified');
      return (act === 'del-yes' ? t.delete().eq('id', v.id) : t.update({ active: !v.active }).eq('id', v.id)).select('id');
    }).then(function (r) {
      if (r.error || !r.data || !r.data.length) { fail(r.error ? r.error.message : '바꾸지 못했습니다 (2단계 인증 확인).'); return; }
      SHSCloud.log(act === 'del-yes' ? 'delete' : 'update', act === 'del-yes' ? 'AI 확인된 답 삭제' : (v.active ? 'AI 확인된 답 숨김' : 'AI 확인된 답 다시 씀'), v.question.slice(0, 80));
      if (ED && item.contains(ED.host)) closeEditor(true);
      if (act === 'del-yes' && v.from_log) { missCount(); loaded.miss = false; }
      loadVer();
    });
  }

  /* ---------- 탭 ---------- */
  function showTab(name, focusId) {
    if (TABS.every(function (t) { return t[0] !== name; })) name = 'set';
    var cur = document.querySelector('#ai-tabs button.active');
    if (cur && cur.dataset.tab !== name && !closeEditor(false)) return;
    TABS.forEach(function (t) {
      var on = t[0] === name;
      document.getElementById('ai-tb-' + t[0]).classList.toggle('active', on);
      document.getElementById('ai-tb-' + t[0]).setAttribute('aria-selected', on ? 'true' : 'false');
      document.getElementById('ai-tab-' + t[0]).classList.toggle('active', on);
    });
    try { history.replaceState(null, '', name === 'set' ? location.pathname + location.search : '#' + name); } catch (x) {}
    if (name === 'miss' && !loaded.miss) { loaded.miss = true; loadMiss(false); }
    if (name === 'ver') { if (focusId) VER.focus = focusId; if (!loaded.ver || focusId) loadVer(); }
  }
  document.getElementById('ai-tabs').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-tab]');
    if (b) showTab(b.dataset.tab);
  });
  document.getElementById('ai-tab-miss').addEventListener('click', onMissClick);
  document.getElementById('ai-tab-ver').addEventListener('click', onVerClick);
  document.getElementById('ai-tab-ver').addEventListener('input', function (ev) {
    if (ev.target.id === 'ver-find') { VER.find = ev.target.value; drawVerList(); }
  });
  showTab((location.hash || '').replace('#', ''));
  missCount();

  setBox.innerHTML = '<p style="color:var(--gray-5)">창구에서 설정을 불러오는 중...</p>';
  call('/settings').then(function (r) {
    if (r.error) {
      setBox.innerHTML = '<div class="notice-banner"><strong>창구에 연결하지 못했습니다.</strong><br>' + e(r.error) +
        '<br><small style="color:var(--gray-5)">창구 주소: ' + e(WORKER) + ' — cloudflare/ai 를 배포한 뒤 다시 열어 주세요.</small></div>';
      return;
    }
    S = r;
    draw();
  });
 });
});
</script>
</body>
</html>
