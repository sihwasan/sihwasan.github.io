<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>갤러리 - 시화산노회</title>
<meta name="description" content="시화산노회 갤러리 — 노회 행사 사진입니다.">
<link rel="canonical" href="https://sihwasan.org/gallery.html">
<meta property="og:type" content="website">
<meta property="og:title" content="갤러리 - 시화산노회">
<meta property="og:description" content="시화산노회 갤러리 — 노회 행사 사진입니다.">
<meta property="og:url" content="https://sihwasan.org/gallery.html">
<link rel="stylesheet" href="css/style.css?v=20260831x">
</head>
<body>

<div class="page-head">
  <div class="container">
    <h1>갤러리</h1>
    <div class="crumb">홈 &gt; 갤러리</div>
  </div>
</div>

<main class="page-body container" id="main">
  <div class="news-head">
    <div class="news-eyebrow">ALBUM &amp; NEWS</div>
    <h2>시화산 갤러리</h2>
    <p>사진과 짧은 글로 전하는 노회의 일상.</p>
  </div>

  <div class="news-stage">
    <div class="news-slide" id="nw-slide">
      <p style="padding:40px;text-align:center;color:var(--gray-5)">불러오는 중...</p>
    </div>
    <button class="news-nav prev" id="nw-prev" aria-label="이전">&#8249;</button>
    <button class="news-nav next" id="nw-next" aria-label="다음">&#8250;</button>
  </div>
  <div class="news-dots" id="nw-dots"></div>

  <div class="news-actions">
    <button class="btn-round" id="nw-more">소식 더 보기</button>
    <button class="btn-round solid" id="nw-add">+ 사진 올리기</button>
  </div>

  <!-- 회기별 앨범 -->
  <section class="alb-sec" id="albums">
    <h2>회기별 앨범</h2>
    <div class="tabs alb-tabs" id="alb-filter"></div>
    <div class="alb-grid" id="alb-grid">
      <p class="alb-empty">불러오는 중...</p>
    </div>
  </section>
</main>

<!-- 앨범 한 권 -->
<div class="mdl" id="alb-mdl">
  <div class="mdl-box wide">
    <button class="mdl-close" id="alb-close">&times;</button>
    <div class="alb-head">
      <h2 id="alb-title"></h2>
      <div class="d" id="alb-sub"></div>
    </div>
    <div class="alb-photos" id="alb-photos"></div>
  </div>
</div>

<!-- 소식 피드 -->
<div class="mdl" id="feed-mdl">
  <div class="mdl-box">
    <button class="mdl-close" id="feed-close">&times;</button>
    <h2>시화산 갤러리</h2>
    <div id="feed-list"></div>
  </div>
</div>

<!-- 사진 올리기 -->
<div class="mdl" id="up-mdl">
  <div class="mdl-box">
    <button class="mdl-close" id="up-close">&times;</button>
    <h2>사진 올리기</h2>

    <div class="drop" id="up-drop">
      <div>여기로 사진을 끌어다 놓거나</div>
      <div style="margin-top:12px">
        <button class="btn-round solid" id="up-pick">사진 선택</button>
      </div>
      <div style="margin-top:8px">
        <button class="btn-round" id="up-cam">카메라로 찍기</button>
      </div>
      <div class="hint">여러 장을 한 번에 올릴 수 있어요</div>
      <div class="drop-preview" id="up-preview"></div>
      <input type="file" id="up-file" accept="image/*" multiple class="hidden">
      <input type="file" id="up-camera" accept="image/*" capture="environment" class="hidden">
    </div>

    <div class="mdl-divider">또는</div>

    <div class="field">
      <label>인스타그램·유튜브 링크로 올리기 (선택)</label>
      <input type="url" id="up-link" placeholder="https://www.instagram.com/… 또는 https://youtu.be/…">
    </div>
    <div class="field">
      <label>어느 앨범에 넣을까요?</label>
      <select id="up-album"></select>
      <div class="field-hint" id="up-album-hint"></div>
    </div>

    <!-- 새 앨범을 만들 때만 쓴다 -->
    <div id="up-new">
      <div class="field">
        <label>새 앨범 이름</label>
        <input type="text" id="up-title" placeholder="예: 제20회 정기노회">
      </div>
      <div class="inline-form" style="margin-bottom:16px">
        <div class="field"><label>날짜</label><input type="date" id="up-date"></div>
        <div class="field"><label>카테고리</label>
          <input type="text" id="up-cat" list="up-cat-list" placeholder="고르거나 직접 입력" autocomplete="off" maxlength="30">
          <datalist id="up-cat-list"></datalist>
        </div>
      </div>
    </div>
    <div class="field">
      <label>한 줄 소식 (선택)</label>
      <textarea id="up-caption" rows="2" placeholder="어떤 순간인가요?"></textarea>
    </div>
    <button class="btn-round solid" id="up-send" style="width:100%">올리기</button>
    <div class="form-msg" id="up-msg"></div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lb-close" aria-label="닫기">&times;</button>
  <button class="lb-nav prev" id="lb-prev" aria-label="이전 사진">&#8249;</button>
  <img id="lb-img" src="" alt="">
  <button class="lb-nav next" id="lb-next" aria-label="다음 사진">&#8250;</button>
  <div class="lb-cap" id="lb-cap"></div>
  <div class="lb-tools hidden" id="lb-tools">
    <button id="lb-rot" title="시계 방향으로 90도 돌리기">&#10227; 회전</button>
    <button id="lb-rotsave" class="hidden">회전 저장</button>
    <button id="lb-del" class="danger">삭제</button>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-auth.js"></script>
<script src="js/photos-config.js"></script>
<script src="js/photos.js"></script>
<script src="js/main.js?v=20260830d"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
 SHS.getUser().then(function (user) {
  var e = SHS.esc;
  var items = [];
  var idx = 0;
  var canPost = SHS.isActiveMember(user) && user && user.cloud;
  var canManage = user && SHSAuth.canManageMembers(user);
  var likeSet = {};      /* 내가 누른 좋아요 */
  var likeCount = {};
  var comments = {};
  var albums = [];       /* 회기별 앨범 */
  var albCat = '전체';
  var feedShown = 30;    /* 소식 피드는 나눠서 보여 준다 */

  /* 2018-04-01 처럼 적어 둔 날짜를 우리말로 바꾼다.
   * 오래된 회기는 날짜가 남아 있지 않아 1일로 적어 두었으므로 월까지만 보여 준다. */
  function dateText(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
    if (!m) return s || '';
    var y = m[1], mo = +m[2], d = +m[3];
    return d === 1 ? y + '년 ' + mo + '월' : y + '년 ' + mo + '월 ' + d + '일';
  }

  /* ---------- 슬라이드 ---------- */
  function renderSlide() {
    var slide = document.getElementById('nw-slide');
    var dots = document.getElementById('nw-dots');
    if (!items.length) {
      slide.innerHTML = '<p style="padding:40px;text-align:center;color:var(--gray-5)">등록된 사진이 없습니다.</p>';
      dots.innerHTML = '';
      return;
    }
    if (idx >= items.length) idx = 0;
    if (idx < 0) idx = items.length - 1;
    var it = items[idx];
    slide.innerHTML =
      '<img src="' + e(it.image_url) + '" alt="' + e(it.title || '') + '">' +
      '<div class="news-cap"><div class="t">' + e(it.title || '노회 소식') + '</div>' +
      '<div class="d">' + e(dateText(it.taken)) + (it.category ? ' · ' + e(it.category) : '') + '</div></div>';
    slide.querySelector('img').addEventListener('click', function () {
      openLb(items, idx);
    });
    dots.innerHTML = items.slice(0, 12).map(function (x, i) {
      return '<span class="' + (i === idx ? 'on' : '') + '" data-dot="' + i + '"></span>';
    }).join('');
    dots.querySelectorAll('span[data-dot]').forEach(function (s) {
      s.addEventListener('click', function () { idx = +s.dataset.dot; renderSlide(); });
    });
  }
  document.getElementById('nw-prev').addEventListener('click', function () { idx--; renderSlide(); });
  document.getElementById('nw-next').addEventListener('click', function () { idx++; renderSlide(); });

  /* ---------- 회기별 앨범 ---------- */
  /* 제목이 같은 사진을 한 권으로 묶는다 (예: 제19회 정기노회) */
  function buildAlbums() {
    var by = {};
    items.forEach(function (it) {
      var k = it.title || '노회 소식';
      if (!by[k]) by[k] = { title: k, taken: it.taken || '', category: it.category || '', photos: [] };
      by[k].photos.push(it);
      if ((it.taken || '') > by[k].taken) by[k].taken = it.taken;
    });
    albums = Object.keys(by).map(function (k) { return by[k]; });
    albums.forEach(function (a) {
      a.photos.sort(function (x, y) { return (x.sort || 0) - (y.sort || 0) || (x.id > y.id ? 1 : -1); });
    });
    albums.sort(function (a, b) { return a.taken < b.taken ? 1 : a.taken > b.taken ? -1 : 0; });
  }

  function renderAlbums() {
    var box = document.getElementById('alb-grid');
    var bar = document.getElementById('alb-filter');
    /* 사진이 많은 분류부터 보여 준다 */
    var n = {};
    albums.forEach(function (a) {
      if (a.category) n[a.category] = (n[a.category] || 0) + a.photos.length;
    });
    var cats = ['전체'].concat(Object.keys(n).sort(function (x, y) { return n[y] - n[x]; }));
    if (cats.indexOf(albCat) === -1) albCat = '전체';
    bar.innerHTML = cats.map(function (c) {
      return '<button data-cat="' + e(c) + '"' + (c === albCat ? ' class="active"' : '') + '>' +
        e(c) + (c === '전체' ? '' : ' <span class="tab-n">' + n[c] + '</span>') + '</button>';
    }).join('');
    bar.querySelectorAll('button[data-cat]').forEach(function (b) {
      b.addEventListener('click', function () { albCat = b.dataset.cat; renderAlbums(); });
    });

    var list = albums.filter(function (a) { return albCat === '전체' || a.category === albCat; });
    if (!list.length) {
      box.innerHTML = '<p class="alb-empty">아직 앨범이 없습니다.</p>';
      return;
    }
    box.innerHTML = list.map(function (a) {
      var cand = a.photos.slice(0, 4).map(function (p) { return p.thumb_url || p.image_url; });
      return '<button class="alb-card" data-alb="' + e(a.title) + '">' +
        '<img loading="lazy" src="' + e(cand[0]) + '" alt="" data-cand="' + e(cand.join('|')) + '">' +
        '<span class="alb-cap"><span class="t">' + e(a.title) + '</span>' +
        '<span class="d">' + e(dateText(a.taken)) + ' · 사진 ' + a.photos.length + '장</span></span>' +
        '</button>';
    }).join('');
    box.querySelectorAll('button[data-alb]').forEach(function (b) {
      b.addEventListener('click', function () { openAlbum(b.dataset.alb); });
    });
    /* 앨범 겉그림은 가로로 넓은 사진이 보기 좋다.
     * 첫 장이 세로이거나 모양을 오려 낸 사진이면 다음 장으로 바꾼다. */
    box.querySelectorAll('img[data-cand]').forEach(function (im) {
      var list2 = im.dataset.cand.split('|');
      var at = 0;
      im.addEventListener('load', function () {
        if (!im.naturalWidth) return;
        if (im.naturalWidth / im.naturalHeight >= 1.15) return;
        at++;
        if (at < list2.length) im.src = list2[at];
      });
    });
  }

  function openAlbum(title) {
    var a = albums.filter(function (x) { return x.title === title; })[0];
    if (!a) return;
    document.getElementById('alb-title').textContent = a.title;
    document.getElementById('alb-sub').textContent =
      dateText(a.taken) + (a.category ? ' · ' + a.category : '') + ' · 사진 ' + a.photos.length + '장';
    var box = document.getElementById('alb-photos');
    box.innerHTML = a.photos.map(function (p, i) {
      return '<img loading="lazy" data-i="' + i + '" src="' + e(p.thumb_url || p.image_url) + '" alt="">';
    }).join('');
    box.querySelectorAll('img[data-i]').forEach(function (im) {
      im.addEventListener('click', function () { openLb(a.photos, +im.dataset.i); });
    });
    openM('alb-mdl');
  }

  /* ---------- 큰 사진 보기 ---------- */
  var lbList = [], lbIdx = 0, lbRot = 0;

  /* 이 사진을 고칠 수 있는 사람: 올린 본인과 관리자 (서버 정책도 같게 막는다) */
  function canFix(p) {
    if (!p || !user || !user.cloud) return false;
    if (typeof p.id !== 'number') return false;      /* 옛 내장 사진은 제외 */
    return canManage || (p.author_id && p.author_id === user.id);
  }

  function showLb() {
    if (!lbList.length) return;
    if (lbIdx < 0) lbIdx = lbList.length - 1;
    if (lbIdx >= lbList.length) lbIdx = 0;
    var p = lbList[lbIdx];
    lbRot = 0;
    var im = document.getElementById('lb-img');
    im.style.transform = '';
    im.src = p.image_url;
    document.getElementById('lb-cap').textContent =
      (p.title || '') + ' · ' + (lbIdx + 1) + ' / ' + lbList.length;
    document.getElementById('lb-tools').classList.toggle('hidden', !canFix(p));
    document.getElementById('lb-rotsave').classList.add('hidden');
  }

  /* 돌려 보기: 화면에서만 돌아가고, '회전 저장'을 눌러야 사진이 바뀐다 */
  function lbApplyRot() {
    var im = document.getElementById('lb-img');
    var fit = (lbRot % 180)
      ? ' scale(' + Math.min(1, (window.innerHeight * 0.88) / im.clientWidth || 1) + ')' : '';
    im.style.transform = 'rotate(' + lbRot + 'deg)' + fit;
    document.getElementById('lb-rotsave').classList.toggle('hidden', lbRot === 0);
  }

  /* 돌려서 저장: 새 파일로 올리고 목록을 바꾼 뒤 옛 파일을 지운다 */
  function lbRotSave() {
    var p = lbList[lbIdx];
    if (!p || !lbRot) return;
    var btn = document.getElementById('lb-rotsave');
    btn.disabled = true; btn.textContent = '저장 중...';
    function done() { btn.disabled = false; btn.textContent = '회전 저장'; }
    Promise.all([
      resize(p.image_url, 1400, 0.8, lbRot),
      resize(p.image_url, 640, 0.72, lbRot)
    ]).then(function (bs) {
      return SHSPhotos.putPair(bs[0], bs[1]);
    }).then(function (u) {
      return SHSCloud.init().then(function (c) {
        return c.from('gallery_items')
          .update({ image_url: u.full, thumb_url: u.thumb })
          .eq('id', p.id)
          .then(function (r) {
            if (r.error) throw r.error;
            /* 옛 파일은 우리 보관소 것일 때만 지워진다 */
            return Promise.all([SHSPhotos.remove(p.image_url), SHSPhotos.remove(p.thumb_url)])
              .then(function () { return u; });
          });
      });
    }).then(function (u) {
      SHSCloud.log('update', '갤러리 사진 회전', (p.title || '') + ' ' + lbRot + '도');
      p.image_url = u.full; p.thumb_url = u.thumb;
      done();
      showLb();
      load(true);
    }).catch(function (err) { done(); alert('저장하지 못했습니다: ' + (err.message || err)); });
  }

  /* 큰 화면에서 바로 삭제 */
  function lbDelete() {
    var p = lbList[lbIdx];
    if (!p) return;
    if (!confirm('이 사진을 삭제하시겠습니까? 되돌릴 수 없습니다.')) return;
    SHSCloud.init().then(function (c) {
      return c.from('gallery_items').delete().eq('id', p.id);
    }).then(function (r) {
      if (r.error) { alert(r.error.message); return; }
      return Promise.all([SHSPhotos.remove(p.image_url), SHSPhotos.remove(p.thumb_url)])
        .then(function () {
          SHSCloud.log('delete', '갤러리 사진 삭제', p.title || String(p.id));
          lbList.splice(lbIdx, 1);
          if (!lbList.length) document.getElementById('lightbox').classList.remove('open');
          else showLb();
          load(true);
        });
    });
  }
  function openLb(list, i) {
    lbList = list || []; lbIdx = i || 0;
    showLb();
    document.getElementById('lightbox').classList.add('open');
  }

  /* ---------- 피드 ---------- */
  function feedCard(it) {
    var initial = (it.author_name || '노회').charAt(0);
    var mine = user && it.author_id === user.id;
    var liked = !!likeSet[it.id];
    var cs = comments[it.id] || [];
    return '<div class="feed-card" data-fid="' + it.id + '">' +
      '<div class="feed-top"><div class="feed-av">' + e(initial) + '</div>' +
      '<div class="feed-who">' + e(it.author_name || '노회') +
      '<div class="d">' + e(dateText(it.taken) || String(it.created_at || '').slice(0, 10)) +
      (it.category ? ' · ' + e(it.category) : '') + '</div></div>' +
      ((mine || canManage) ? '<button class="feed-del" data-fdel="' + it.id + '" data-ffull="' + e(it.image_url || '') + '" data-fthumb="' + e(it.thumb_url || '') + '">삭제</button>' : '') +
      '</div>' +
      '<img class="feed-img" src="' + e(it.image_url) + '" alt="">' +
      '<div class="feed-bar">' +
      '<button data-flike="' + it.id + '" class="' + (liked ? 'liked' : '') + '">' + (liked ? '좋아요 취소' : '좋아요') + '</button>' +
      '<button data-fcmt="' + it.id + '">댓글</button>' +
      '</div>' +
      '<div class="feed-meta"><span class="likes">좋아요 ' + (likeCount[it.id] || 0) + '개</span>' +
      (it.title ? '<div style="margin-top:4px">' + e(it.title) + '</div>' : '') +
      (it.caption ? '<div style="color:var(--gray-7)">' + e(it.caption) + '</div>' : '') +
      (it.link_url ? '<div style="margin-top:4px"><a href="' + e(it.link_url) + '" target="_blank" rel="noopener" style="color:var(--navy);text-decoration:underline">링크 보기</a></div>' : '') +
      '</div>' +
      (cs.length ? '<div class="feed-cmt">' + cs.map(function (c) {
        return '<div class="row"><span class="n">' + e(c.author_name || '회원') + '</span>' +
          '<span>' + e(c.body) + '</span>' +
          ((user && (c.user_id === user.id || canManage)) ? '<button data-cdel="' + c.id + '">삭제</button>' : '') +
          '</div>';
      }).join('') + '</div>' : '') +
      (canPost ? '<div class="feed-in"><input type="text" data-cin="' + it.id + '" placeholder="따뜻한 댓글 달기…">' +
        '<button data-csend="' + it.id + '">게시</button></div>' : '') +
      '</div>';
  }

  function renderFeed() {
    var box = document.getElementById('feed-list');
    if (!items.length) { box.innerHTML = '<p style="color:var(--gray-5)">등록된 소식이 없습니다.</p>'; return; }
    var shown = items.slice(0, feedShown);
    box.innerHTML = shown.map(feedCard).join('') +
      (items.length > shown.length
        ? '<div style="text-align:center;margin:6px 0 10px">' +
          '<button class="btn-round" id="feed-more">더 보기 (' +
          (items.length - shown.length) + '장 남음)</button></div>'
        : '');
    var more = document.getElementById('feed-more');
    if (more) more.addEventListener('click', function () { feedShown += 30; renderFeed(); });
    bindFeed();
  }

  function bindFeed() {
    var box = document.getElementById('feed-list');
    box.querySelectorAll('button[data-flike]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (!canPost) { alert('좋아요는 정회원만 누를 수 있습니다.'); return; }
        var id = +b.dataset.flike;
        SHSCloud.init().then(function (c) {
          return likeSet[id]
            ? c.from('gallery_likes').delete().eq('item_id', id).eq('user_id', user.id)
            : c.from('gallery_likes').insert({ item_id: id, user_id: user.id });
        }).then(function () {
          if (likeSet[id]) { delete likeSet[id]; likeCount[id] = Math.max(0, (likeCount[id] || 1) - 1); }
          else { likeSet[id] = 1; likeCount[id] = (likeCount[id] || 0) + 1; }
          renderFeed();
        });
      });
    });
    box.querySelectorAll('button[data-fcmt]').forEach(function (b) {
      b.addEventListener('click', function () {
        var inp = box.querySelector('input[data-cin="' + b.dataset.fcmt + '"]');
        if (inp) inp.focus();
      });
    });
    box.querySelectorAll('button[data-csend]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = +b.dataset.csend;
        var inp = box.querySelector('input[data-cin="' + id + '"]');
        var body = inp.value.trim();
        if (!body) return;
        SHSCloud.init().then(function (c) {
          return c.from('gallery_comments').insert({
            item_id: id, user_id: user.id, author_name: user.name, body: body
          });
        }).then(function (r) {
          if (r.error) { alert(r.error.message); return; }
          SHSCloud.log('create', '갤러리 댓글 등록', body.slice(0, 30));
          load(true);
        });
      });
    });
    box.querySelectorAll('button[data-cdel]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (!confirm('댓글을 삭제하시겠습니까?')) return;
        SHSCloud.init().then(function (c) {
          return c.from('gallery_comments').delete().eq('id', b.dataset.cdel);
        }).then(function () { SHSCloud.log('delete', '갤러리 댓글 삭제', b.dataset.cdel); load(true); });
      });
    });
    box.querySelectorAll('button[data-fdel]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (!confirm('이 사진을 삭제하시겠습니까? 되돌릴 수 없습니다.')) return;
        SHSCloud.init().then(function (c) {
          return c.from('gallery_items').delete().eq('id', b.dataset.fdel);
        }).then(function (r) {
          if (r.error) { alert(r.error.message); return; }
          /* 목록에서 지운 뒤 보관소의 사진 파일도 함께 지운다 */
          return Promise.all([
            SHSPhotos.remove(b.dataset.ffull),
            SHSPhotos.remove(b.dataset.fthumb)
          ]).then(function () {
            SHSCloud.log('delete', '갤러리 사진 삭제', b.dataset.fdel);
            load(true);
          });
        });
      });
    });
  }

  /* ---------- 모달 ---------- */
  function openM(id) { document.getElementById(id).classList.add('open'); }
  function closeM(id) { document.getElementById(id).classList.remove('open'); }
  document.getElementById('nw-more').addEventListener('click', function () { feedShown = 30; renderFeed(); openM('feed-mdl'); });
  document.getElementById('feed-close').addEventListener('click', function () { closeM('feed-mdl'); });
  document.getElementById('up-close').addEventListener('click', function () { closeM('up-mdl'); });
  document.getElementById('alb-close').addEventListener('click', function () { closeM('alb-mdl'); });
  ['feed-mdl', 'up-mdl', 'alb-mdl'].forEach(function (id) {
    document.getElementById(id).addEventListener('click', function (ev) {
      if (ev.target.id === id) closeM(id);
    });
  });
  document.getElementById('nw-add').addEventListener('click', function () {
    if (!SHS.isActiveMember(user)) {
      alert('사진 올리기는 정회원만 이용할 수 있습니다.' +
        (user ? '\n' + (SHS.membershipIssue(user) || '') : ''));
      if (!user) location.href = 'login.html';
      return;
    }
    if (!user.cloud) { alert('사진 올리기는 서버 로그인(구글 또는 이메일) 후 이용할 수 있습니다.'); return; }
    document.getElementById('up-date').value = new Date().toISOString().slice(0, 10);
    fillAlbumPicker();
    openM('up-mdl');
  });

  /* ---------- 어느 앨범에 넣을지 고르기 ----------
   * 이미 있는 앨범을 고르면 그 회기 사진 뒤에 이어 붙는다.
   * 앨범은 제목으로 묶이므로 이름·날짜·분류를 그 앨범 것으로 그대로 쓴다. */
  function fillAlbumPicker() {
    var sel = document.getElementById('up-album');
    var keep = sel.value;
    sel.innerHTML = '<option value="">+ 새 앨범 만들기</option>' +
      albums.map(function (a) {
        return '<option value="' + e(a.title) + '">' + e(a.title) +
          ' (' + a.photos.length + '장)</option>';
      }).join('');
    if (keep && albums.some(function (a) { return a.title === keep; })) sel.value = keep;
    syncAlbumPicker();
  }

  function syncAlbumPicker() {
    var sel = document.getElementById('up-album');
    var box = document.getElementById('up-new');
    var hint = document.getElementById('up-album-hint');
    var a = albums.filter(function (x) { return x.title === sel.value; })[0];
    box.style.display = a ? 'none' : '';
    hint.textContent = a
      ? dateText(a.taken) + (a.category ? ' · ' + a.category : '') +
        ' — 이 앨범의 사진 ' + a.photos.length + '장 뒤에 이어 붙습니다.'
      : '새 앨범은 아래에 적은 이름으로 만들어집니다.';
  }
  document.getElementById('up-album').addEventListener('change', syncAlbumPicker);

  var lb = document.getElementById('lightbox');
  document.getElementById('lb-close').addEventListener('click', function () { lb.classList.remove('open'); });
  document.getElementById('lb-prev').addEventListener('click', function () { lbIdx--; showLb(); });
  document.getElementById('lb-next').addEventListener('click', function () { lbIdx++; showLb(); });
  document.getElementById('lb-rot').addEventListener('click', function () {
    lbRot = (lbRot + 90) % 360; lbApplyRot();
  });
  document.getElementById('lb-rotsave').addEventListener('click', lbRotSave);
  document.getElementById('lb-del').addEventListener('click', lbDelete);
  lb.addEventListener('click', function (ev) { if (ev.target === lb) lb.classList.remove('open'); });

  /* 손가락으로 옆으로 쓸어 넘기기 (모바일).
   * 가로로 40px 넘게, 세로 움직임보다 크게 쓸면 앞·뒤 사진으로 넘어간다.
   * 두 손가락(확대·축소)일 때는 넘기지 않는다. */
  (function () {
    var x0 = null, y0 = null;
    lb.addEventListener('touchstart', function (ev) {
      if (ev.touches.length !== 1) { x0 = null; return; }
      x0 = ev.touches[0].clientX;
      y0 = ev.touches[0].clientY;
    }, { passive: true });
    lb.addEventListener('touchend', function (ev) {
      if (x0 == null || ev.changedTouches.length !== 1) { x0 = null; return; }
      var dx = ev.changedTouches[0].clientX - x0;
      var dy = ev.changedTouches[0].clientY - y0;
      x0 = null;
      if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;
      if (dx < 0) lbIdx++; else lbIdx--;
      showLb();
    }, { passive: true });
  })();

  document.addEventListener('keydown', function (ev) {
    if (!lb.classList.contains('open')) return;
    if (ev.key === 'Escape') lb.classList.remove('open');
    if (ev.key === 'ArrowLeft') { lbIdx--; showLb(); }
    if (ev.key === 'ArrowRight') { lbIdx++; showLb(); }
  });

  /* ---------- 업로드 ---------- */
  var picked = [];      /* { file, rot } — rot 은 시계 방향 돌림각 */
  function showPreview() {
    var box = document.getElementById('up-preview');
    box.innerHTML = picked.map(function (pk, i) {
      return '<span class="up-thumb"><img src="' + URL.createObjectURL(pk.file) +
        '" style="transform:rotate(' + pk.rot + 'deg)">' +
        '<button type="button" class="up-rot" data-ri="' + i + '" title="90도 돌리기">&#10227;</button></span>';
    }).join('');
    box.querySelectorAll('.up-rot').forEach(function (b) {
      b.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var pk = picked[+b.dataset.ri];
        pk.rot = (pk.rot + 90) % 360;
        showPreview();
      });
    });
  }
  function addFiles(list) {
    Array.prototype.forEach.call(list, function (f) {
      if (f.type.indexOf('image/') === 0) picked.push({ file: f, rot: 0 });
    });
    showPreview();
  }
  document.getElementById('up-pick').addEventListener('click', function () { document.getElementById('up-file').click(); });
  document.getElementById('up-cam').addEventListener('click', function () { document.getElementById('up-camera').click(); });
  document.getElementById('up-file').addEventListener('change', function () { addFiles(this.files); });
  document.getElementById('up-camera').addEventListener('change', function () { addFiles(this.files); });

  var drop = document.getElementById('up-drop');
  ['dragenter', 'dragover'].forEach(function (t) {
    drop.addEventListener(t, function (ev) { ev.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (t) {
    drop.addEventListener(t, function (ev) { ev.preventDefault(); drop.classList.remove('over'); });
  });
  drop.addEventListener('drop', function (ev) {
    if (ev.dataTransfer && ev.dataTransfer.files) addFiles(ev.dataTransfer.files);
  });

  /* 웹 사이즈로 축소 (원본 그대로 올리지 않는다). rot 을 주면 그만큼 돌려서 담는다. */
  function resize(file, maxW, quality, rot) {
    rot = ((rot || 0) % 360 + 360) % 360;
    return new Promise(function (resolve, reject) {
      var img = new Image();
      if (typeof file === 'string') img.crossOrigin = 'anonymous';
      img.onload = function () {
        var sw = img.naturalWidth || img.width, sh = img.naturalHeight || img.height;
        /* 돌린 뒤의 가로세로 */
        var rw = (rot % 180) ? sh : sw, rh = (rot % 180) ? sw : sh;
        if (rw > maxW) { rh = Math.round(rh * maxW / rw); rw = maxW; }
        var cv = document.createElement('canvas');
        cv.width = rw; cv.height = rh;
        var cx = cv.getContext('2d');
        cx.translate(rw / 2, rh / 2);
        cx.rotate(rot * Math.PI / 180);
        var dw = (rot % 180) ? rh : rw, dh = (rot % 180) ? rw : rh;
        cx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
        cv.toBlob(function (b) { b ? resolve(b) : reject(new Error('변환 실패')); }, 'image/jpeg', quality);
      };
      img.onerror = function () { reject(new Error('이미지를 읽을 수 없습니다.')); };
      img.src = typeof file === 'string' ? file : URL.createObjectURL(file);
    });
  }

  document.getElementById('up-send').addEventListener('click', function () {
    var msg = document.getElementById('up-msg');
    var into = albums.filter(function (x) {
      return x.title === document.getElementById('up-album').value;
    })[0];
    var title = document.getElementById('up-title').value.trim();
    var taken = document.getElementById('up-date').value;
    var cat = (document.getElementById('up-cat').value || '').trim().replace(/\s+/g, ' ');
    if (!cat) cat = '기타';
    if (cat.length > 30) cat = cat.slice(0, 30);
    /* 이미 있는 앨범을 골랐으면 이름·날짜·분류를 그 앨범 것으로 맞춘다 */
    var sort = 0;
    if (into) {
      title = into.title;
      taken = into.taken;
      cat = into.category;
      into.photos.forEach(function (p) { if ((p.sort || 0) > sort) sort = p.sort || 0; });
    }
    var caption = document.getElementById('up-caption').value.trim();
    var link = document.getElementById('up-link').value.trim();

    if (!picked.length && !link) {
      msg.className = 'form-msg err';
      msg.textContent = '사진을 선택하거나 링크를 입력해 주세요.';
      return;
    }
    if (!into && !title) {
      msg.className = 'form-msg err';
      msg.textContent = '새 앨범 이름을 적거나, 넣을 앨범을 골라 주세요.';
      return;
    }
    msg.className = 'form-msg';
    msg.textContent = '올리는 중입니다...';

    var chain = Promise.resolve();
    if (picked.length) {
      picked.forEach(function (pk, i) {
        chain = chain.then(function () {
          return Promise.all([
            resize(pk.file, 1400, 0.8, pk.rot),
            resize(pk.file, 640, 0.72, pk.rot)
          ]).then(function (bs) {
            return SHSPhotos.putPair(bs[0], bs[1]);
          }).then(function (u) {
            return SHSCloud.init().then(function (c) {
              return c.from('gallery_items').insert({
                title: title || '노회 소식', taken: taken, category: cat, caption: caption,
                link_url: link || null,
                image_url: u.full, thumb_url: u.thumb,
                author_id: user.id, author_name: user.name, sort: sort + i + 1
              });
            });
          }).then(function (r3) { if (r3.error) throw r3.error; });
        });
      });
    } else {
      chain = chain.then(function () {
        return SHSCloud.init().then(function (c) {
          return c.from('gallery_items').insert({
            title: title || '노회 소식', taken: taken, category: cat, caption: caption,
            link_url: link, image_url: link, thumb_url: link,
            author_id: user.id, author_name: user.name, sort: sort + 1
          });
        }).then(function (r) { if (r.error) throw r.error; });
      });
    }

    chain.then(function () {
      SHSCloud.log('create', '갤러리 사진 등록', (title || '소식') + ' ' + (picked.length || 1) + '건');
      picked = [];
      showPreview();
      ['up-title', 'up-caption', 'up-link'].forEach(function (id) { document.getElementById(id).value = ''; });
      msg.className = 'form-msg ok';
      msg.textContent = '올렸습니다.';
      closeM('up-mdl');
      load(true);
    }).catch(function (err) {
      msg.className = 'form-msg err';
      msg.textContent = '올리기 실패: ' + err.message;
    });
  });

  /* ---------- 카테고리 ---------- */
  /* 고를 수도 있고 직접 적을 수도 있다.
   * 고를 거리는 미리 정해 둔 목록 + 지금까지 실제로 쓰인 값을 합쳐서 만든다.
   * 새로 적은 값은 사진과 함께 저장되므로 다음부터 목록에 저절로 나타난다. */
  function loadCats() {
    var inp = document.getElementById('up-cat');
    var dl = document.getElementById('up-cat-list');
    var fallback = ['정기노회', '노회 행사', '임원회', '수련회', '교회 소식', '기타'];
    function fill(list) {
      var seen = {}, out = [];
      list.forEach(function (n) {
        n = (n || '').trim();
        if (!n || seen[n]) return;
        seen[n] = 1; out.push(n);
      });
      dl.innerHTML = out.map(function (n) { return '<option value="' + e(n) + '"></option>'; }).join('');
    }
    fill(fallback);
    if (!inp.value) inp.value = '기타';
    if (!(window.SHSCloud && SHSCloud.enabled())) return;
    SHSCloud.init().then(function (c) {
      return Promise.all([
        c.from('gallery_categories').select('name').order('sort'),
        c.from('gallery_items').select('category').limit(1000)
      ]);
    }).then(function (rs) {
      var names = [];
      if (rs[0] && rs[0].data) names = names.concat(rs[0].data.map(function (x) { return x.name; }));
      if (rs[1] && rs[1].data) names = names.concat(rs[1].data.map(function (x) { return x.category; }));
      if (names.length) fill(names);
    }).catch(function () {});
  }

  /* ---------- 불러오기 ---------- */
  function load(keepFeed) {
    if (!(window.SHSCloud && SHSCloud.enabled())) {
      items = SHSData.gallery.map(function (g, i) {
        return { id: 'local' + i, title: g.title, taken: g.date, image_url: g.img, thumb_url: g.thumb };
      });
      buildAlbums();
      renderSlide();
      renderAlbums();
      return;
    }
    SHSCloud.init().then(function (c) {
      return Promise.all([
        c.from('gallery_items').select('*').order('taken', { ascending: false }).order('id', { ascending: false }),
        c.from('gallery_likes').select('*'),
        c.from('gallery_comments').select('*').order('id')
      ]);
    }).then(function (rs) {
      var rows = (rs[0] && rs[0].data) || [];
      if (!rows.length) {
        items = SHSData.gallery.map(function (g, i) {
          return { id: 'local' + i, title: g.title, taken: g.date, image_url: g.img, thumb_url: g.thumb };
        });
      } else {
        items = rows;
      }
      likeSet = {}; likeCount = {}; comments = {};
      ((rs[1] && rs[1].data) || []).forEach(function (l) {
        likeCount[l.item_id] = (likeCount[l.item_id] || 0) + 1;
        if (user && l.user_id === user.id) likeSet[l.item_id] = 1;
      });
      ((rs[2] && rs[2].data) || []).forEach(function (c2) {
        (comments[c2.item_id] = comments[c2.item_id] || []).push(c2);
      });
      buildAlbums();
      renderSlide();
      renderAlbums();
      openLinkedPhoto();
      if (keepFeed && document.getElementById('feed-mdl').classList.contains('open')) renderFeed();
    }).catch(function () {
      items = SHSData.gallery.map(function (g, i) {
        return { id: 'local' + i, title: g.title, taken: g.date, image_url: g.img, thumb_url: g.thumb };
      });
      buildAlbums();
      renderSlide();
      renderAlbums();
    });
  }

  /* 첫 화면 등에서 ?photo=번호 로 들어오면 그 사진을 바로 크게 보여 준다 */
  var linkedShown = false;
  function openLinkedPhoto() {
    if (linkedShown) return;
    var m = location.search.match(/[?&]photo=([^&]+)/);
    if (!m) return;
    var pid = decodeURIComponent(m[1]);
    var idx = -1;
    items.forEach(function (p, i) { if (String(p.id) === pid && idx === -1) idx = i; });
    if (idx === -1) return;
    linkedShown = true;
    openLb(items, idx);
  }

  loadCats();
  load();
 });
});
</script>
