<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>청원서 - 시화산노회</title>
<meta name="description" content="시화산노회 청원서 작성 — 청빙·고시·이명·연기 등 각종 청원 서식을 채워 바로 인쇄합니다.">
<link rel="canonical" href="https://sihwasan.org/petition.html">
<meta property="og:type" content="website">
<meta property="og:title" content="청원서 - 시화산노회">
<meta property="og:description" content="각종 청원 서식을 홈페이지에서 채워 바로 인쇄합니다.">
<meta property="og:url" content="https://sihwasan.org/petition.html">
<link rel="stylesheet" href="css/style.css?v=20260902b">
<style>
/* ----- 청원서 종류 메뉴 (마우스를 올리면 하위 서식이 열린다) ----- */
.pt-menu {
  display: flex; flex-wrap: wrap; background: var(--navy);
  border-radius: 10px; padding: 0 6px; margin: 14px 0 22px;
}
.pt-menu .ptm { position: relative; }
.pt-menu .ptm > button {
  background: none; border: none; color: #fff; padding: 13px 18px;
  font-size: 0.94rem; font-weight: 600; cursor: pointer; border-radius: 10px 10px 0 0;
}
.pt-menu .ptm:hover > button, .pt-menu .ptm > button.on { background: var(--navy-dark); }
.pt-menu .ptm ul {
  display: none; position: absolute; left: 0; top: 100%; z-index: 80;
  min-width: 250px; margin: 0; padding: 6px 0; list-style: none;
  background: var(--white); border: 1px solid var(--gray-2); border-radius: 0 0 10px 10px;
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.16);
}
.pt-menu .ptm:hover ul, .pt-menu .ptm.open ul { display: block; }
.pt-menu .ptm ul button {
  display: block; width: 100%; text-align: left; background: none; border: none;
  padding: 10px 16px; font-size: 0.9rem; color: var(--ink); cursor: pointer;
}
.pt-menu .ptm ul button:hover { background: var(--gray-1); }
.pt-menu .ptm ul button.active { color: var(--navy); font-weight: 700; background: var(--gray-1); }

/* ----- 입력 박스 ----- */
.pt-card {
  border: 1px solid var(--gray-2); border-radius: 12px; background: var(--white);
  padding: 20px 22px; max-width: 940px; margin-bottom: 26px;
}
.pt-card h3 { margin: 0 0 14px; }
.pt-card h3 small { font-weight: 400; font-size: 0.8rem; color: var(--gray-5); margin-left: 8px; }
.pt-form { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
.pt-form .field { flex: 1 1 200px; }
.pt-form .field.wide { flex: 1 1 100%; }
.pt-form label { display: block; font-size: 0.82rem; color: var(--gray-7); margin-bottom: 4px; }
.pt-form input, .pt-form select, .pt-form textarea {
  width: 100%; border: 1px solid var(--gray-2); border-radius: 8px;
  padding: 8px 10px; font-size: 0.92rem; font-family: inherit; background: var(--white);
}
.pt-form textarea { min-height: 70px; resize: vertical; }
.pt-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pt-mine-tbl td .btn { margin-right: 4px; }

/* 서명란에 찍히는 도장 — (인) 글자 위에 정확히 겹쳐 찍는다.
 * 예전에는 음수 여백으로 붙였는데, 이름 칸이 비어 줄이 길어지면
 * 도장이 다음 줄로 밀려 엉뚱한 자리에 찍혔다. */
#pt-paper .inwrap { position: relative; display: inline-block; white-space: nowrap; }
#pt-paper .pt-seal {
  height: 46px; width: auto; max-width: none; opacity: 0.92;
  position: absolute; left: -8px; top: 50%; margin-top: -23px;
  mix-blend-mode: multiply;   /* 흰 자국·잡티가 종이에 자연스럽게 스며든다 */
}

/* 도장 등록·시찰 선택 작은 창 */
.pt-modal {
  position: fixed; inset: 0; z-index: 1300; background: rgba(24, 22, 18, 0.45);
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.pt-modal .box {
  background: var(--white); border-radius: 14px; padding: 26px 28px;
  width: 560px; max-width: 100%; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
  max-height: 86vh; overflow: auto;
}
.pt-modal h3 { margin: 0 0 10px; }
.pt-modal p { font-size: 0.88rem; color: var(--gray-7); }
.pt-modal .row { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
.pt-modal select, .pt-modal input[type="file"] {
  width: 100%; border: 1px solid var(--gray-2); border-radius: 8px; padding: 9px 10px; font-size: 0.92rem;
}
.pt-modal .seal-prev { min-height: 60px; margin-top: 10px; text-align: center; }
.pt-modal .seal-prev img { height: 60px; }

/* ----- 미리보기 (A4 느낌) ----- */
#pt-paper {
  background: #fff; color: #111; max-width: 760px; margin: 0 auto;
  padding: 60px 56px; border: 1px solid var(--gray-2); box-shadow: 0 4px 18px rgba(0,0,0,0.08);
  font-family: 'Noto Sans KR', sans-serif; font-size: 15px; line-height: 1.9;
}
#pt-paper h1.pt-title {
  text-align: center; font-size: 26px; letter-spacing: 6px; margin: 0 0 8px;
  font-weight: 700; color: #111;
}
#pt-paper .pt-sub { text-align: center; font-size: 14px; margin: 0 0 26px; }
#pt-paper .pt-date { margin: 20px 0 6px; }
#pt-paper table.sbox {
  border-collapse: collapse; margin: 14px 0 14px auto; font-size: 15px;
}
#pt-paper table.sbox td { border: 1px solid #333; padding: 10px 18px; }
#pt-paper table.sbox td:first-child { letter-spacing: 8px; width: 150px; text-align: center; }
#pt-paper table.sbox td:last-child { width: 120px; text-align: right; color: #555; font-size: 13px; }
#pt-paper .signrow {
  display: flex; justify-content: space-between; align-items: baseline;
  margin: 26px 0; font-size: 18px; font-weight: 700; flex-wrap: wrap; gap: 10px;
  /* 도장이 (인) 오른쪽으로 삐져나와도 종이(인쇄 영역) 안에 들도록 오른쪽을 비워 둔다.
   * 서명란이 오른쪽 끝에 붙으면 도장이 @page 여백 밖으로 나가 잘렸다. */
  padding-right: 64px;
}
#pt-paper .signrow.r { justify-content: flex-end; }
#pt-paper .addr { font-size: 21px; font-weight: 700; margin: 34px 0 24px; letter-spacing: 2px; }
#pt-paper .body { text-indent: 2em; margin: 10px 0; }
#pt-paper .arae { text-align: center; letter-spacing: 12px; margin: 22px 0 14px; }
#pt-paper ol.items { list-style: none; padding-left: 40px; margin: 0; }
#pt-paper ol.items li { margin: 10px 0; }
#pt-paper .pv {
  display: inline-block; border-bottom: 1px solid #333; min-width: 90px;
  text-align: center; padding: 0 8px; font-weight: 700;
}
#pt-paper .pv.s { min-width: 50px; }
#pt-paper .pv.l { min-width: 160px; }
/* 제목에는 밑줄을 긋지 않는다 (제목 속 빈칸 포함) */
#pt-paper h1.pt-title .pv { border-bottom: none; }
#pt-paper .dash { border: none; border-top: 2px dashed #666; margin: 34px 0; }
#pt-paper .sec2 h1.pt-title { margin-top: 6px; }
#pt-paper table.roster { border-collapse: collapse; width: 100%; margin: 10px 0; }
#pt-paper table.roster th, #pt-paper table.roster td { border: 1px solid #333; padding: 7px 4px; text-align: center; font-size: 13px; height: 26px; }
#pt-paper .pre { white-space: pre-wrap; }
/* 여러 청원서 일괄 열람(?subs=1,2,3): 화면에서는 사이를 띄우고, 인쇄에서는 한 장씩 나눠 찍는다 */
#pt-paper .pt-page + .pt-page { margin-top: 44px; padding-top: 44px; border-top: 2px dashed #bbb; }

/* ----- 끼워 넣기(embed) 모드: 구비서류 안내 박스 안에서 서식만 보여 준다 ----- */
body.pt-embed > *:not(main) { display: none !important; }
/* PDF 도구(html2pdf·html2canvas)가 종이를 베껴 그리려고 body 바로 아래에 붙이는
 * 작업 칸은 감추면 안 된다 — 감추면 빈(백지) PDF 가 나온다. */
body.pt-embed > .html2pdf__overlay, body.pt-embed > .html2canvas-container { display: block !important; }
/* PDF 로 뜨는 동안: 캔버스가 그리지 못하는 혼합 모드는 잠시 끈다 */
#pt-paper.pt-capturing .pt-seal { mix-blend-mode: normal; opacity: 1; }
body.pt-embed .page-head { display: none !important; }
/* 끼워 넣기(embed)에서는 서식 입력과 미리보기만 남긴다:
 * 탭(청원서류·나의 서류), 도우미 버튼 줄, 종류 메뉴, 내 서류·받은 서류 목록은 감춘다 */
body.pt-embed #pt-menu, body.pt-embed #pt-mine, body.pt-embed #pt-sent, body.pt-embed #pt-inbox,
body.pt-embed main > .tabs, body.pt-embed main > p { display: none !important; }
body.pt-embed { background: var(--paper, #fcfbf9); }
body.pt-embed main { padding-top: 10px; }

/* ----- 열람(view) 모드: 제출된 청원서를 원본 서식 그대로 보여 준다 -----
 * 시찰 서기의 <서류 진단>에서 이 화면을 그대로 불러 씁니다.
 * 입력칸·메뉴·목록은 감추고 종이(미리보기)만 남깁니다. */
body.pt-view .pt-card, body.pt-view #pt-menu, body.pt-view #pt-mine,
body.pt-view #pt-sent, body.pt-view #pt-inbox,
body.pt-view main > .tabs, body.pt-view main > p, body.pt-view main > h2 { display: none !important; }
body.pt-view #pt-viewbar { display: flex !important; }
body.pt-view.pt-embed #pt-viewbar { display: none !important; }
body.pt-view.pt-embed { background: var(--paper, #fcfbf9); }
#pt-viewbar {
  display: none; gap: 10px; align-items: center; flex-wrap: wrap;
  margin: 4px 0 18px; padding: 12px 14px;
  border: 1px solid var(--gray-2); border-radius: 10px; background: var(--white);
}
#pt-viewbar .info { font-size: 0.88rem; color: var(--gray-7); flex: 1 1 260px; }

/* ----- 인쇄: 종이만 나온다 ----- */
@media print {
  body * { visibility: hidden; }
  #pt-paper, #pt-paper * { visibility: visible; }
  /* 조상 어디에도 넘친 부분을 자르는 곳이 없게 한다 (도장이 잘리지 않도록) */
  html, body, main, #pt-print-wrap, #pt-paper, #pt-paper .signrow, #pt-paper .inwrap { overflow: visible !important; }
  #pt-paper {
    position: absolute; left: 0; top: 0; width: 100%;
    border: none; box-shadow: none; padding: 0; margin: 0; max-width: none;
  }
  /* 인쇄에서는 종이 안쪽 여백이 0 이 되어 서명 행이 곧 인쇄 영역 끝이다.
   * 도장(높이 46px, 너비는 그림에 따라 더 넓을 수 있다)이 (인) 오른쪽으로
   * 나가도 잘리지 않게 오른쪽을 화면과 같이 비워 둔다. */
  #pt-paper .signrow { padding-right: 64px; }
  #pt-paper .pt-seal { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #pt-paper .pt-page + .pt-page {
    margin-top: 0; padding-top: 0; border-top: none;
    page-break-before: always; break-before: page;
  }
  @page { size: A4 portrait; margin: 18mm 16mm; }
}
</style>
</head>
<body>

<div class="page-head">
  <div class="container">
    <h1>청원서</h1>
    <div class="crumb">홈 &gt; 자료실 &gt; 청원서</div>
  </div>
</div>

<main class="page-body container" id="main">
  <div class="tabs" style="margin:4px 0 6px">
    <button type="button" class="active" id="pt-tab-forms">청원서류</button>
    <button type="button" id="pt-tab-mine">나의 서류</button>
  </div>
  <p style="margin:10px 0 18px">
    <button type="button" class="btn" id="pt-wizard"
      style="background:linear-gradient(135deg,#c0392b,#e74c3c);border-color:#c0392b;font-size:1.05rem;padding:14px 28px;font-weight:700">
      청원서류 작성 도우미</button>
    <span style="font-size:0.88rem;color:var(--gray-5);margin-left:10px">
    몇 가지 질문에 답하시면 알맞은 청원 서류가 만들어집니다.</span></p>

  <nav class="pt-menu" id="pt-menu" aria-label="청원서 종류"></nav>

  <div class="pt-card">
    <h3 id="pt-title"></h3>
    <div class="pt-form" id="pt-form"></div>
    <div class="pt-actions">
      <label id="pt-sealwrap" style="display:flex;align-items:center;gap:6px;font-size:0.88rem;cursor:pointer">
        <input type="checkbox" id="pt-sealon" checked style="width:auto"> 당회장 도장 찍기</label>
      <button class="btn" id="pt-print">인쇄</button>
      <button class="btn" id="pt-pdf">PDF 저장</button>
      <button class="btn" id="pt-save">저장하기</button>
      <button class="btn" id="pt-send">시찰 서기에게 전달하기</button>
      <button class="btn ghost" id="pt-clear">입력 지우기</button>
      <span class="form-msg" id="pt-msg" style="margin:0"></span>
    </div>
  </div>

  <div id="pt-mine"></div>
  <div id="pt-sent"></div>
  <div id="pt-inbox"></div>

  <div id="pt-viewbar">
    <span class="info" id="pt-viewinfo"></span>
    <button class="btn sm" type="button" id="pt-vprint">인쇄</button>
    <button class="btn sm" type="button" id="pt-vpdf">PDF 저장</button>
  </div>

  <h2 style="margin-top:8px">미리보기</h2>
  <div id="pt-print-wrap"><div id="pt-paper"></div></div>
</main>

<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-auth.js"></script>
<script src="js/main.js?v=20260903a"></script>
<script>
(function () {
  'use strict';
  function e(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  /* 밑줄 빈칸: 값이 있으면 채우고 없으면 빈 밑줄 */
  function u(v, cls) { return '<span class="pv' + (cls ? ' ' + cls : '') + '">' + e(v) + '</span>'; }
  function juhu(d) {
    if (d && /^\d{4}-\d{2}-\d{2}$/.test(d)) {
      var p = d.split('-');
      return '주후 ' + Number(p[0]) + '년 ' + Number(p[1]) + '월 ' + Number(p[2]) + '일';
    }
    return '주후     년   월   일';
  }
  function sbox(label) {
    return '<table class="sbox"><tr><td>' + (label || '시 찰 장') + '</td><td>(인)</td></tr></table>';
  }
  /* (인) 자리: 도장이 등록되어 있으면 함께 찍어 보여 준다 */
  function inMark() {
    /* 보고서 서식(시찰·부)에는 당회장 도장을 찍지 않는다 */
    var s = (sealOn && !(cur && cur.cat === '보고서')) ? (viewSeal || sealImg) : null;
    return '<span class="inwrap">(인)' + (s
      ? '<img class="pt-seal" src="' + s + '" alt="도장" title="끌어서 위치를 옮길 수 있습니다" ' +
        'style="left:' + (-8 + sealPos.dx) + 'px;margin-top:' + (-23 + sealPos.dy) + 'px">'
      : '') + '</span>';
  }
  /* ___교회   당회장___(인) 서명줄 */
  function signChurch(church, role, name) {
    return '<div class="signrow"><span>' + u(church, 'l') + '교회</span>' +
      '<span>' + (role || '당회장') + u(name, 'l') + inMark() + '</span></div>';
  }
  function signOnly(role, name) {
    return '<div class="signrow r"><span>' + role + u(name, 'l') + inMark() + '</span></div>';
  }
  function addr(t) { return '<div class="addr">' + (t || '시화산노회장 귀하') + '</div>'; }
  function arae() { return '<div class="arae">- 아     래 -</div>'; }
  function items(arr) {
    return '<ol class="items">' + arr.map(function (x, i) {
      return '<li>' + (i + 1) + '. ' + x + '</li>';
    }).join('') + '</ol>';
  }

  /* ================= 서식 정의 =================
   * 노회 종이 서식(스캔본)을 그대로 옮겼다. render(d)는 인쇄용 HTML을 돌려준다. */
  var FORMS = [

  /* ---------- 청빙 ---------- */
  { id: 'call', cat: '청빙', title: '청빙청원서',
    fields: [
      { k: 'kind', label: '청빙 구분', type: 'select',
        opt: ['목사위임', '시무목사', '부목사', '부목사계속', '교육목사', '전도목사', '강도사', '전도사'] },
      { k: 'name', label: '청빙 대상자 성명' },
      { k: 'church', label: '교회명' },
      { k: 'dang', label: '당회장 성명' },
      { k: 'date', label: '작성일', type: 'date' }
    ],
    render: function (d) {
      /* 청빙 구분마다 문법에 맞는 문구를 만든다 */
      var phrase;
      switch (d.kind) {
        case '목사위임':   phrase = u(d.name) + ' 목사를 위임목사로 청빙하고저'; break;
        case '시무목사':   phrase = u(d.name) + ' 목사를 시무목사로 청빙하고저'; break;
        case '부목사':     phrase = u(d.name) + ' 목사를 부목사로 청빙하고저'; break;
        case '부목사계속': phrase = u(d.name) + ' 목사를 부목사로 계속 청빙하고저'; break;
        case '교육목사':   phrase = u(d.name) + ' 목사를 교육목사로 청빙하고저'; break;
        case '전도목사':   phrase = u(d.name) + ' 목사를 전도목사로 청빙하고저'; break;
        case '강도사':     phrase = u(d.name) + ' 강도사를 청빙하고저'; break;
        case '전도사':     phrase = u(d.name) + ' 전도사를 청빙하고저'; break;
        default:           phrase = d.kind
                             ? u(d.name) + ' 목사(강도사·전도사)를 ' + e(d.kind) + '로 청빙하고저'
                             : u(d.name) + ' 목사(위임, 시무, 부목사, 부목사계속, 교육목사, ' +
                               '전도목사, 강도사, 전도사)로 청빙하고저';
      }
      return '<h1 class="pt-title">' + u(d.kind) + ' 청빙청원서</h1>' +
        '<p class="pt-sub">(목사위임. 시무. 부목사. 부목사계속. 교육목사. 전도목사. 강도사. 전도사)</p>' +
        '<div class="pt-date">' + juhu(d.date) + '</div>' + sbox() +
        signChurch(d.church, '당회장', d.dang) + addr() +
        '<p class="body">금번 ' + u(d.church) + '교회에서 ' + phrase +
        ' 별지 첨부하여 청원하오니 허락하여 주시기를 바랍니다.</p>';
    } },

  { id: 'callletter', cat: '청빙', title: '청빙서 (교인 연서)',
    fields: [
      { k: 'si', label: '주소 (시)' }, { k: 'dong', label: '주소 (동)' },
      { k: 'church', label: '교회명' },

  var data = {};
  var editingId = null;   /* 저장한 청원서를 다시 열어 고치는 중이면 그 id */
  var user = null;
  var sealImg = null;     /* 내 도장 PNG (내 정보의 교회 직인·도장) */
  var viewSeal = null;    /* 받은 청원서를 열람할 때 제출자의 도장 */
  var sealOn = true;      /* 당회장 도장을 찍을지 (선택사항) */
  var sealPos = { dx: 0, dy: 0 };   /* 미리보기에서 끌어 옮긴 도장 위치 */
  /* ?sub=번호 — 제출된 청원서를 원본 그대로 열람하는 모드 (시찰 서류 진단) */
  var viewSubId = (location.search.match(/[?&]sub=(\d+)/) || [])[1] || null;
  /* ?subs=1,2,3 — 여러 청원서를 이어 붙여 한 번에 인쇄 (시찰 자료실 통과 청원서) */
  var viewSubIds = ((location.search.match(/[?&]subs=([\d,]+)/) || [])[1] || '')
    .split(',').map(function (x) { return parseInt(x, 10); }).filter(Boolean);

  function cloudOn() {
    return user && user.cloud && window.SHSCloud && SHSCloud.enabled();
  }
  function msg(t, err) {
    var m = document.getElementById('pt-msg');
    m.className = 'form-msg' + (err ? ' err' : '');
    m.textContent = t || '';
  }

  /* 헤더 메뉴: 청원서 종류를 나열하고, 마우스를 올리면 하위 서식이 나온다 */
  function renderMenu() {
    var box = document.getElementById('pt-menu');
    var cats = [];
    /* 보고서 서식은 자료실 → 보고서 화면으로 옮겼다. 여기 메뉴에는 청원만 남긴다 */
    FORMS.forEach(function (f) {
      if (f.cat === '보고서') return;
      if (cats.indexOf(f.cat) === -1) cats.push(f.cat);
    });
    box.innerHTML = cats.map(function (c) {
      var on = cur.cat === c;
      return '<div class="ptm"><button type="button" class="' + (on ? 'on' : '') + '">' + e(c) + '</button><ul>' +
        FORMS.filter(function (f) { return f.cat === c; }).map(function (f) {
          return '<li><button type="button" data-pt="' + f.id + '"' +
            (cur.id === f.id ? ' class="active"' : '') + '>' + e(f.title) + '</button></li>';
        }).join('') + '</ul></div>';
    }).join('');   /* 나의 서류는 위쪽 탭으로 옮겼다 */
    /* 휴대폰처럼 마우스가 없는 화면에서는 눌러서 연다 */
    box.querySelectorAll('.ptm > button').forEach(function (b) {
      b.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var wrap = b.parentElement;
        box.querySelectorAll('.ptm').forEach(function (x) { if (x !== wrap) x.classList.remove('open'); });
        wrap.classList.toggle('open');
      });
    });
    /* 다른 메뉴에 마우스를 올리거나 메뉴 밖을 누르면, 눌러서 연 메뉴를 닫는다 */
    box.querySelectorAll('.ptm').forEach(function (m) {
      m.addEventListener('mouseenter', function () {
        box.querySelectorAll('.ptm.open').forEach(function (x) { if (x !== m) x.classList.remove('open'); });
      });
      m.addEventListener('mouseleave', function () { m.classList.remove('open'); });
    });
    box.querySelectorAll('ul button').forEach(function (b) {
      b.addEventListener('click', function () {
        cur = FORMS.filter(function (f) { return f.id === b.dataset.pt; })[0];
        data = {}; editingId = null; viewSeal = null; msg('');
        renderMenu(); renderForm(); renderPaper();
      });
    });
  }

  function renderForm() {
    document.getElementById('pt-title').innerHTML = e(cur.title) +
      '<small>' + e(cur.cat) + (editingId ? ' · 저장한 청원서를 고치는 중' : '') + '</small>';
    var box = document.getElementById('pt-form');
    var h = '';
    cur.fields.forEach(function (f) {
      h += '<div class="field' + (f.cls === 'wide' || f.type === 'textarea' ? ' wide' : '') + '">' +
        '<label for="ptf-' + f.k + '">' + e(f.label) + '</label>';
      var v = e(data[f.k] || '');
      if (f.type === 'select') {
        h += '<select id="ptf-' + f.k + '" data-ptf="' + f.k + '"><option value=""></option>' +
          f.opt.map(function (o) {
            return '<option' + (o === data[f.k] ? ' selected' : '') + '>' + e(o) + '</option>';
          }).join('') + '</select>';
      } else if (f.type === 'textarea') {
        h += '<textarea id="ptf-' + f.k + '" data-ptf="' + f.k + '">' + v + '</textarea>';
      } else {
        h += '<input type="' + (f.type || 'text') + '" id="ptf-' + f.k + '" data-ptf="' + f.k + '" value="' + v + '">';
      }
      h += '</div>';
    });
    box.innerHTML = h;
    box.querySelectorAll('[data-ptf]').forEach(function (el) {
      /* 교회명 칸은 "…교회"라고 적어도 서식에서 교회가 겹치지 않게
       * 끝의 "교회"를 떼어 담는다 (서식이 뒤에 교회를 붙여 준다) */
      function put() {
        var v2 = el.value;
        if (['church', 'fromch', 'toch'].indexOf(el.dataset.ptf) !== -1) {
          v2 = v2.replace(/\s*교회\s*$/, '');
        }
        data[el.dataset.ptf] = v2;
        renderPaper();
      }
      el.addEventListener('input', put);
      el.addEventListener('change', put);
    });
    /* 작성일은 오늘로 미리 채운다 */
    var dEl = box.querySelector('#ptf-date');
    if (dEl && !dEl.value) {
      var t = new Date();
      dEl.value = t.getFullYear() + '-' + ('0' + (t.getMonth() + 1)).slice(-2) + '-' + ('0' + t.getDate()).slice(-2);
      data.date = dEl.value;
    }
    /* 시찰보고서는 노회 시스템과 연동한다 */
    var extra = document.getElementById('pt-extra');
    if (extra) extra.remove();
    /* 열람 모드에서는 제출된 내용을 그대로 두어야 하므로 자동 채움을 하지 않는다 */
    if (cur.id === 'sichalreport' && !viewSubId) enhanceSichalReport();
    /* 보고서 서식(시찰·부)은 당회장 도장이 들어가지 않는다.
     * 시찰보고서는 시찰 서기가 직접 노회에 내는 것이므로 '시찰 서기에게 전달' 도 뺀다. */
    var isReport = cur.cat === '보고서';
    var sw0 = document.getElementById('pt-sealwrap');
    if (sw0) sw0.style.display = isReport ? 'none' : '';
    var sd0 = document.getElementById('pt-send');
    if (sd0) sd0.style.display = isReport ? 'none' : '';
  }

  /* ================= 시찰보고서 연동 =================
   * · 회기: 노회 시스템의 현재 회기(site_settings.sessions)를 자동으로 채운다
   * · 시찰: 고르면 시찰 명부의 시찰장·서기가 자동으로 채워진다
   * · 교세: 그 시찰 교회들의 올해 교회상황 보고서를 합산해 채우고,
   *         교회마다 보고서 제출 여부를 목록으로 보여 준다 */
  function firstWord(s) { return String(s || '').trim().split(/[\s(]/)[0]; }
  function enhanceSichalReport() {
    if (!cloudOn()) return;
    var box = document.getElementById('pt-form');
    SHSCloud.init().then(function (c) {
      return Promise.all([
        c.from('sichals').select('name,head,clerk').order('sort'),
        c.from('site_settings').select('value').eq('key', 'sessions')
      ]);
    }).then(function (rs) {
      var sichals = (rs[0].data) || [];
      var ses = (rs[1].data && rs[1].data[0] && rs[1].data[0].value) || null;

      /* 현재 회기 자동 입력 */
      var sEl = box.querySelector('#ptf-session');
      if (sEl && !sEl.value && ses && ses.current) {
        sEl.value = ses.current;
        data.session = String(ses.current);
        renderPaper();
      }

      /* 시찰명 입력칸을 명부 기반 선택으로 바꾼다 */
      var inp = box.querySelector('#ptf-sichal');
      if (!inp || !sichals.length) return;
      var sel = document.createElement('select');
      sel.id = 'ptf-sichal'; sel.dataset.ptf = 'sichal';
      sel.innerHTML = '<option value=""></option>' + sichals.map(function (s) {
        return '<option' + (s.name === data.sichal ? ' selected' : '') + '>' + e(s.name) + '</option>';
      }).join('');
      inp.parentElement.querySelector('label').textContent = '시찰 (고르면 시찰장·서기·교세가 자동 입력)';
      inp.replaceWith(sel);
      function fillOfficers(name) {
        var s = sichals.filter(function (x) { return x.name === name; })[0];
        if (!s) return;
        data.sichaljang = firstWord(s.head);
        data.clerk = firstWord(s.clerk);
        var a = box.querySelector('#ptf-sichaljang'), b = box.querySelector('#ptf-clerk');
        if (a) a.value = data.sichaljang;
        if (b) b.value = data.clerk;
      }
      sel.addEventListener('change', function () {
        data.sichal = sel.value;
        fillOfficers(sel.value);
        renderPaper();
        if (sel.value) loadSichalStats(sel.value);
      });
      if (data.sichal) {
        /* 시찰 화면에서 미리 채워 들어온 경우 — 시찰장·서기도 함께 채운다 */
        if (!data.sichaljang && !data.clerk) { fillOfficers(data.sichal); renderPaper(); }
        loadSichalStats(data.sichal);
      }
    }).catch(function () {});
  }

  function loadSichalStats(sichal) {
    /* 시찰 화면에서 ?year=연도 로 들어오면 그 해 보고서를 합산한다 */
    var year = parseInt((location.search.match(/[?&]year=(\d{4})/) || [])[1], 10) ||
               new Date().getFullYear();
    SHSCloud.init().then(function (c) {
      return Promise.all([
        c.from('church_reports').select('church,pastor,members_total,data,updated_at')
          .eq('sichal', sichal).eq('year', year),
        c.from('dues_rates').select('church,pastor').eq('year', year).eq('sichal', sichal).order('sort')
      ]);
    }).then(function (rs) {
      var reports = (rs[0].data) || [];
      var churches = (rs[1].data) || [];
      /* 교회 명부가 없으면 보고서에 있는 교회라도 쓴다 */
      if (!churches.length) {
        churches = reports.map(function (r) { return { church: r.church, pastor: r.pastor }; });
      }
      function n(v) { return Number(v || 0) || 0; }
      function pick(obj, keys) {
        var s = 0; keys.forEach(function (k) { s += n(obj && obj[k]); }); return s;
      }
      var sum = { p1: 0, p2: 0, p3: 0, p4: 0, p5: 0, p6: 0, p7: 0, p8: 0 };
      reports.forEach(function (r) {
        var d = r.data || {};
        var cg = d.clergy || {}, jj = d.jejik || {};
        sum.p1 += pick(cg, ['damim', 'wonro', 'bumok', 'hyup', 'gita']);   /* 목사 */
        sum.p2 += n(jj.jr_simu);                                            /* 시무장로 */
        sum.p3 += n(cg.gangdosa);                                           /* 강도사 */
        sum.p4 += pick(cg, ['jd_m', 'jd_f']);                               /* 전도사 */
        sum.p5 += pick(jj, ['jr_wonro', 'jr_euntoe', 'jr_hyup', 'jr_gita']); /* 무임장로 */
        sum.p6 += pick(jj, ['ks_simu', 'ks_gita']);                         /* 권사 */
        sum.p7 += pick(jj, ['as_simu', 'as_gita', 'ss_m', 'ss_f']);         /* 집사 */
        sum.p8 += n(r.members_total);                                       /* 교인 */
      });
      /* 보고서가 있을 때만 교세를 자동으로 채운다 (직접 고칠 수 있다) */
      if (reports.length) {
        Object.keys(sum).forEach(function (k) {
          data[k] = String(sum[k]);
          var el = document.getElementById('ptf-' + k);
          if (el) el.value = sum[k];
        });
        renderPaper();
      }

      /* 교회별 보고서 제출 여부 목록 */
      var done = {};
      reports.forEach(function (r) { done[String(r.church || '').replace(/\s|교회$/g, '')] = r; });
      var h = '<h4 style="margin:18px 0 8px">' + e(sichal) + ' 교회상황 보고서 제출 현황 (' + year + '년)</h4>' +
        '<p style="font-size:0.82rem;color:var(--gray-5);margin:0 0 8px">교세는 제출된 보고서 ' +
        reports.length + '건을 자동 합산한 값입니다. 미제출 교회 몫은 직접 더해 주세요.</p>' +
        '<div style="overflow-x:auto"><table class="tbl" style="max-width:640px"><thead><tr>' +
        '<th>교회</th><th style="width:110px">교역자</th><th style="width:130px">보고서</th></tr></thead><tbody>';
      churches.forEach(function (ch) {
        var r = done[String(ch.church || '').replace(/\s|교회$/g, '')];
        h += '<tr><td class="left">' + e(ch.church) + '</td>' +
          '<td>' + e(ch.pastor || '') + '</td>' +
          '<td>' + (r ? '<span class="pass">제출</span>' : '<span class="fail">미제출</span>') + '</td></tr>';
      });
      h += '</tbody></table></div>';
      var old = document.getElementById('pt-extra');
      if (old) old.remove();
      var div = document.createElement('div');
      div.id = 'pt-extra';
      div.innerHTML = h;
      document.getElementById('pt-form').after(div);
    }).catch(function () {});
  }

  function renderPaper() {
    /* 저장된 청원서에는 도장 사용 여부·위치도 함께 담겨 있다 */
    if (data._seal) {
      sealOn = data._seal.on !== false;
      sealPos = { dx: Number(data._seal.dx) || 0, dy: Number(data._seal.dy) || 0 };
    }
    var chk = document.getElementById('pt-sealon');
    if (chk) chk.checked = sealOn;
    document.getElementById('pt-paper').innerHTML = cur.render(data);
    bindSealDrag();
  }

  /* 미리보기의 도장을 끌어서 원하는 자리에 찍는다.
   * 위치는 data._seal 에 저장되어 인쇄·PDF·저장본에 그대로 적용된다. */
  /* 도장을 종이 안쪽(여백을 뺀 글 영역)에 가둔다.
   * 인쇄에서는 종이의 안쪽 여백이 0 이 되어 글 영역이 곧 인쇄 영역이므로,
   * 화면에서 글 영역 안에 있으면 인쇄에서도 잘리지 않는다. */
  function placeSeal(img) {
    img.style.left = (-8 + sealPos.dx) + 'px';
    img.style.marginTop = (-23 + sealPos.dy) + 'px';
  }
  function clampSeal(img) {
    var paper = document.getElementById('pt-paper');
    if (!paper || !img.naturalWidth) return;
    var cs = getComputedStyle(paper);
    var pr = paper.getBoundingClientRect();
    var left = pr.left + (parseFloat(cs.paddingLeft) || 0);
    var right = pr.right - (parseFloat(cs.paddingRight) || 0);
    var top = pr.top + (parseFloat(cs.paddingTop) || 0);
    var bottom = pr.bottom - (parseFloat(cs.paddingBottom) || 0);
    var ir = img.getBoundingClientRect();
    if (!ir.width) return;
    var mx = 0, my = 0;
    if (ir.left < left) mx = left - ir.left;
    else if (ir.right > right) mx = right - ir.right;
    if (ir.top < top) my = top - ir.top;
    else if (ir.bottom > bottom) my = bottom - ir.bottom;
    if (!mx && !my) return false;
    sealPos.dx += mx; sealPos.dy += my;
    placeSeal(img);
    return true;
  }

  function bindSealDrag() {
    document.querySelectorAll('#pt-paper .pt-seal').forEach(function (img) {
      img.style.cursor = 'move';
      img.style.touchAction = 'none';
      /* 예전에 종이 밖까지 끌어 둔 위치가 저장되어 있어도 안쪽으로 되돌린다 */
      function settle() {
        if (clampSeal(img) && data._seal) data._seal = { on: sealOn, dx: sealPos.dx, dy: sealPos.dy };
      }
      if (img.complete && img.naturalWidth) settle();
      else img.addEventListener('load', settle);
      img.addEventListener('pointerdown', function (ev) {
        ev.preventDefault();
        var sx = ev.clientX, sy = ev.clientY;
        var base = { dx: sealPos.dx, dy: sealPos.dy };
        function onMove(e2) {
          sealPos.dx = base.dx + (e2.clientX - sx);
          sealPos.dy = base.dy + (e2.clientY - sy);
          placeSeal(img);
          clampSeal(img);
        }
        function onUp() {
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
          data._seal = { on: sealOn, dx: sealPos.dx, dy: sealPos.dy };
        }
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
      });
    });
  }

  /* ----- PDF 저장 ----- */
  var pdfLoading = null;
  function loadPdfTool() {
    if (window.html2pdf) return Promise.resolve(window.html2pdf);
    if (pdfLoading) return pdfLoading;
    pdfLoading = new Promise(function (resolve, reject) {
      var sc = document.createElement('script');
      sc.src = 'https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js';
      sc.onload = function () { resolve(window.html2pdf); };
      sc.onerror = function () { pdfLoading = null; reject(new Error('PDF 도구를 불러오지 못했습니다.')); };
      document.head.appendChild(sc);
    });
    return pdfLoading;
  }
  /* 종이 안의 바깥 주소(http) 그림을 data URL 로 바꿔 넣는다.
   * 바깥 그림이 그대로 있으면 캔버스가 오염되어 PDF 를 못 만든다.
   * 되돌릴 수 있게 원래 주소를 restore 에 적어 둔다. */
  function inlineImages(paper, restore) {
    var imgs = Array.prototype.filter.call(paper.querySelectorAll('img'), function (im) {
      return im.src && !/^data:/i.test(im.src);
    });
    return Promise.all(imgs.map(function (im) {
      return fetch(im.src, { mode: 'cors' }).then(function (res) {
        if (!res.ok) throw new Error(res.status);
        return res.blob();
      }).then(function (blob) {
        return new Promise(function (resolve, reject) {
          var fr = new FileReader();
          fr.onload = function () { resolve(fr.result); };
          fr.onerror = function () { reject(fr.error); };
          fr.readAsDataURL(blob);
        });
      }).then(function (dataUrl) {
        restore.push({ img: im, src: im.getAttribute('src') });
        im.src = dataUrl;
        return im.decode ? im.decode().catch(function () {}) : null;
      }).catch(function () { /* 못 바꾸면 useCORS 에 맡긴다 */ });
    }));
  }

  /* 뜬 캔버스가 쓸 만한지 — 크기가 0 이거나 온통 흰색이면 빈 종이다.
   * 조용히 백지 PDF 를 내놓지 않고 오류로 알린다. */
  function checkCanvas(cv) {
    if (!cv || !cv.width || !cv.height) {
      throw new Error('뜬 그림의 크기가 0 입니다.');
    }
    var W = 96, H = Math.max(1, Math.round(cv.height / cv.width * W));
    var t = document.createElement('canvas');
    t.width = W; t.height = H;
    var cx = t.getContext('2d');
    cx.fillStyle = '#fff'; cx.fillRect(0, 0, W, H);
    cx.drawImage(cv, 0, 0, W, H);
    var d = cx.getImageData(0, 0, W, H).data;
    for (var i = 0; i < d.length; i += 4) {
      if (d[i] < 240 || d[i + 1] < 240 || d[i + 2] < 240) return;   /* 무엇인가 그려져 있다 */
    }
    throw new Error('뜬 그림이 온통 흰색(빈 종이)입니다.');
  }

  /* PDF 단추: 눌린 단추를 받거나, 지금 보이는 것(열람 모드는 #pt-vpdf)을 찾는다 */
  function pdfButton(btn) {
    if (btn && btn.currentTarget) btn = btn.currentTarget;
    if (btn && btn.nodeType === 1) return btn;
    var v = document.getElementById('pt-vpdf');
    if (v && v.offsetParent) return v;
    return document.getElementById('pt-pdf');
  }

  /* PDF 저장 — 화면의 미리보기(#pt-paper)를 html2pdf(html2canvas)로 떠서 내려받는다.
   * 서류 진단의 iframe 안에서도 쓰이므로(window.SHSPetitionPdf) 약속(Promise)을 돌려준다. */
  function savePdf(btn) {
    btn = pdfButton(btn);
    var label = btn ? btn.textContent : 'PDF 저장';
    function busy(t) { if (btn) { btn.disabled = true; btn.textContent = t; } }
    function done() { if (btn) { btn.disabled = false; btn.textContent = label; } }
    busy('만드는 중...');
    var paper = document.getElementById('pt-paper');
    /* 스크롤 위치에 따라 위가 잘려 나오는 일이 있어,
     * 찍는 동안 맨 위로 올렸다가 끝나면 제자리로 돌려 놓는다 */
    var keepY = window.scrollY;
    window.scrollTo(0, 0);
    var restore = [];
    function cleanup() {
      paper.classList.remove('pt-capturing');
      restore.forEach(function (r) { r.img.src = r.src; });
      window.scrollTo(0, keepY);
      done();
    }
    return loadPdfTool().then(function (html2pdf) {
      /* 1) 글꼴·도장 그림이 다 내려온 뒤에 뜬다 (그 전에 뜨면 빈 결과가 나온다) */
      return paperReady().then(function () {
        /* 3) 바깥 주소 그림은 data URL 로 바꿔 캔버스 오염을 막는다 */
        return inlineImages(paper, restore);
      }).then(function () {
        /* 4) 캔버스가 못 그리는 mix-blend-mode 는 뜨는 동안만 끈다 */
        paper.classList.add('pt-capturing');
        var w = paper.scrollWidth, h = paper.scrollHeight;
        return html2pdf().set({
          margin: 10,
          filename: (cur && cur.title ? cur.title : '청원서') + '.pdf',
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: {
            scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false,
            scrollX: 0, scrollY: 0,
            /* 2) iframe 의 화면 크기에 기대지 않고 종이 크기를 그대로 준다 */
            width: w, height: h, windowWidth: w, windowHeight: h
          },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
          pagebreak: { mode: ['css', 'legacy'] }
        }).from(paper).toContainer().then(function () {
          /* 베껴 붙인 종이는 A4 안쪽 폭에 맞춰지므로, 그 실제 크기로 뜬다 */
          var c = this.prop.container;
          if (c && c.scrollWidth && c.scrollHeight) {
            this.opt.html2canvas.width = c.scrollWidth;
            this.opt.html2canvas.height = c.scrollHeight;
            this.opt.html2canvas.windowWidth = c.scrollWidth;
            this.opt.html2canvas.windowHeight = c.scrollHeight;
          }
        }).toCanvas().get('canvas', checkCanvas).save();   /* 6) 빈 캔버스는 오류 */
      });
    }).then(function () { cleanup(); }, function (err) {
      cleanup();
      console.error('[청원서 PDF]', err);
      alert('PDF 를 만들지 못했습니다: ' + ((err && err.message) || err) +
        '\n\n인쇄 단추를 눌러 인쇄 대화상자에서 "PDF로 저장"을 고르셔도 됩니다.');
      throw err;
    });
  }

   * 올리게 한다. jpg 등 어떤 그림이든 흰 바탕을 지운 PNG로 바꿔 저장한다. */
  function loadSeal() {

  /* 어떤 그림이든 420px 이하 + 흰 바탕 투명 PNG로 (내 정보와 같은 방식) */
  function toSealPng(f) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var url = URL.createObjectURL(f);
      img.onload = function () {
        var MAX = 420;
        var sc = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
        var w = Math.max(1, Math.round(img.naturalWidth * sc));
        var hh = Math.max(1, Math.round(img.naturalHeight * sc));
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = hh;
        var cx = cv.getContext('2d');
        cx.drawImage(img, 0, 0, w, hh);
        URL.revokeObjectURL(url);
        try {
          var d = cx.getImageData(0, 0, w, hh);
          var a = d.data;
          for (var i = 0; i < a.length; i += 4) {
            var mn = Math.min(a[i], a[i + 1], a[i + 2]);
            if (mn > 235) a[i + 3] = 0;
            else if (mn > 170) a[i + 3] = Math.round(a[i + 3] * (235 - mn) / 65);
          }
          cx.putImageData(d, 0, 0);
        } catch (x) { /* 못 지워도 그대로 저장한다 */ }
        resolve(cv.toDataURL('image/png'));
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('그림 파일을 읽지 못했습니다.'));
      };
      img.src = url;
    });
  }

  function modal(inner) {
    var old = document.getElementById('pt-modal');
    if (old) old.remove();
    var wrap = document.createElement('div');
    wrap.id = 'pt-modal'; wrap.className = 'pt-modal';
    wrap.innerHTML = '<div class="box">' + inner + '</div>';
    document.body.appendChild(wrap);
    wrap.addEventListener('click', function (ev) { if (ev.target === wrap) wrap.remove(); });
    return wrap;
  }

  /* 도장이 없으면 여기서 바로 올리게 한다 → member_seals(PNG)에 저장 */
  function askSeal() {
    return new Promise(function (resolve) {
      var wrap = modal(
        '<h3>도장 이미지를 올려 주세요</h3>' +
        '<p>시찰로 전달하는 청원서에는 목사님(작성자)의 도장이 찍혀야 합니다. ' +
        '도장을 찍어 사진으로 찍거나 스캔한 파일(jpg도 됩니다)을 올리시면 ' +
        '흰 바탕을 지운 <strong>PNG</strong>로 바꿔 <strong>내 정보의 교회 직인·도장</strong>란에 저장합니다.</p>' +
        '<input type="file" id="ptm-file" accept="image/*">' +
        '<div class="seal-prev" id="ptm-prev"></div>' +
        '<div class="form-msg" id="ptm-msg"></div>' +
        '<div class="row"><button class="btn ghost sm" id="ptm-cancel">취소</button>' +
        '<button class="btn sm" id="ptm-ok" disabled>도장 저장하고 계속</button></div>');
      var pending = null;
      wrap.querySelector('#ptm-file').addEventListener('change', function () {
        var f = this.files && this.files[0];
        if (!f) return;
        if (!/^image\//.test(f.type)) {
          wrap.querySelector('#ptm-msg').textContent = '그림 파일만 올릴 수 있습니다.';
          return;
        }
        toSealPng(f).then(function (dataUrl) {
          pending = dataUrl;
          wrap.querySelector('#ptm-prev').innerHTML = '<img src="' + dataUrl + '" alt="도장 미리보기">';
          wrap.querySelector('#ptm-ok').disabled = false;
        }).catch(function (err) {
          wrap.querySelector('#ptm-msg').textContent = err.message || String(err);
        });
      });
      wrap.querySelector('#ptm-cancel').addEventListener('click', function () { wrap.remove(); resolve(null); });
      wrap.querySelector('#ptm-ok').addEventListener('click', function () {
        if (!pending) return;
        wrap.querySelector('#ptm-msg').textContent = '저장하는 중...';
        SHSCloud.init().then(function (c) {
          return c.from('member_seals').upsert({
            user_id: user.id, kind: 'pastor', image: pending, updated_at: new Date().toISOString()
          }, { onConflict: 'user_id,kind' });
        }).then(function (r) {
          if (r.error) throw r.error;
          sealImg = pending;
          renderPaper();
          wrap.remove();
          resolve(pending);
        }).catch(function (err) {
          wrap.querySelector('#ptm-msg').textContent = '저장하지 못했습니다: ' + (err.message || err);
        });
      });
    });
  }

  function sendToSichal() {
    if (!cloudOn()) { msg('전달하시려면 구글 또는 이메일 계정으로 로그인해 주세요.', true); return; }

  /* ----- 받은 청원서 -----
   * 열람과 진단(적합·보완요청·반려)은 시찰 화면의 <서류 진단> 탭에서 합니다.
   * 여기서는 우리 시찰에 몇 건이 와 있는지만 알리고 그리로 안내합니다. */
  function loadInbox() {
    var box = document.getElementById('pt-inbox');
    box.innerHTML = '';
    if (!cloudOn()) return;
    SHSCloud.init().then(function (c) {
      return Promise.all([
        c.from('petition_submissions').select('id,sichal,status')
          .neq('user_id', user.id),
        c.rpc('my_sichals').then(function (x) { return x; }, function () { return { data: [] }; })
      ]);
    }).then(function (rs) {
      var rows = (rs[0] && rs[0].data) || [];
      if (!rows.length) return;
      var mine = ((rs[1] && rs[1].data) || []).map(function (m) { return m.sichal; });
      /* 시찰별로 몇 건이 와 있는지 (내가 볼 수 있는 것만 데이터베이스가 내려 준다) */
      var by = {};
      rows.forEach(function (p) {
        by[p.sichal] = by[p.sichal] || { all: 0, wait: 0 };
        by[p.sichal].all += 1;
        if (p.status === '제출됨') by[p.sichal].wait += 1;
      });
      var names = Object.keys(by).sort(function (a, b) {
        return (mine.indexOf(b) - mine.indexOf(a)) || a.localeCompare(b, 'ko');
      });
      box.innerHTML = '<h2>받은 청원서</h2>' +
        '<div class="notice-banner">우리 시찰로 제출된 청원서는 ' +
        '<strong>시찰 화면 → 서류 진단</strong>에서 원본 서식 그대로 열람하고 ' +
        '적합·보완요청·반려로 진단하실 수 있습니다.<div style="margin-top:10px">' +
        names.map(function (n) {
          return '<a class="btn sm" style="margin:0 6px 6px 0" href="sichal.html?s=' +
            encodeURIComponent(n) + '#review">' + e(n) + ' 서류 진단 (' + by[n].all + '건' +
            (by[n].wait ? ' · 미처리 ' + by[n].wait + '건' : '') + ')</a>';
        }).join('') + '</div></div>';
    }).catch(function () {});
  }

  /* ----- 제출된 청원서 열람 (?sub=번호) -----
   * 시찰 서기의 <서류 진단>이 이 화면을 그대로 불러(iframe 또는 새 창) 씁니다.

  /* 종이가 찍을 준비가 되었는지 — 글꼴과 도장 그림이 모두 내려온 뒤에 푼다.
   * 인쇄·PDF 저장을 그 전에 시작하면 도장이 빠지거나 빈 종이가 나온다. */
  function paperReady() {
    var paper = document.getElementById('pt-paper');
    var waits = Array.prototype.map.call(paper.querySelectorAll('img'), function (im) {
      if (im.complete && im.naturalWidth) return Promise.resolve();
      return new Promise(function (resolve) {
        var p = im.decode ? im.decode() : Promise.reject();
        p.then(resolve, resolve);
        im.addEventListener('load', resolve); im.addEventListener('error', resolve);
        setTimeout(resolve, 4000);   /* 그림 하나가 영영 안 오더라도 멈추지 않는다 */
      });
    });
    if (document.fonts && document.fonts.ready) {
      waits.push(document.fonts.ready.then(function () {}, function () {}));
    }
    return Promise.all(waits);
  }

  /* ----- 여러 청원서 일괄 열람·인쇄 (?subs=1,2,3&print=1) -----
   * 시찰 자료실의 <통과 청원서>에서 여러 건을 골라 한 번의 인쇄로 모두 찍는다.
   * 한 건씩 서식대로 그려 이어 붙이고, 인쇄에서는 한 장씩 나뉜다. */
  function openSubmissions(ids) {
    document.body.classList.add('pt-view');
    if (!cloudOn()) {
      document.getElementById('pt-paper').innerHTML =
        '<p style="color:#666">청원서를 보시려면 로그인이 필요합니다.</p>';
      return;
    }
    SHSCloud.init().then(function (c) {
      return c.from('petition_submissions').select('*').in('id', ids);
    }).then(function (r) {
      if (r.error) throw r.error;
      /* 고른 순서(접수 순)를 그대로 지킨다 */
      var rows = (r.data || []).slice().sort(function (a, b) {
        return ids.indexOf(Number(a.id)) - ids.indexOf(Number(b.id));
      });
      if (!rows.length) throw new Error('청원서를 찾지 못했습니다.');
      var html = '';
      rows.forEach(function (p) {
        var f = FORMS.filter(function (x) { return x.id === p.form_id; })[0];
        if (!f) return;
        cur = f; data = p.data || {}; editingId = null; viewSeal = p.seal || null;
        /* 도장 사용 여부·위치는 청원서마다 따로 저장되어 있다 */
        sealOn = !(data._seal && data._seal.on === false);
        sealPos = data._seal
          ? { dx: Number(data._seal.dx) || 0, dy: Number(data._seal.dy) || 0 }
          : { dx: 0, dy: 0 };
        html += '<div class="pt-page">' + cur.render(data) + '</div>';
      });
      document.getElementById('pt-paper').innerHTML = html;
      document.title = '통과 청원서 ' + rows.length + '건 - 시화산노회';
      var info = document.getElementById('pt-viewinfo');
      if (info) {
        info.innerHTML = '<strong>' + e(rows[0].sichal) + ' 통과 청원서 ' + rows.length + '건</strong><br>' +
          rows.map(function (p) { return e(p.title); }).join(' · ');
      }
      if (/[?&]print=1/.test(location.search)) {
        paperReady().then(function () { setTimeout(function () { window.print(); }, 300); });
      }
    }).catch(function (err) {
      document.getElementById('pt-paper').innerHTML =
        '<p style="color:#a33">' + e(err.message || err) + '</p>';
    });
  }

  /* 바깥 화면(서류 진단)에서 이 종이를 인쇄·PDF 저장하도록 열어 둔다 */
  window.SHSPetitionPrint = function () { window.focus(); window.print(); };
  window.SHSPetitionPdf = savePdf;

  /* ================= 청빙서류 작성 도우미 =================
   * 질문에 답하면 알맞은 청빙 서식을 골라 내용을 채워 준다. */
  /* ================= 청원서류 작성 도우미 =================
   * 질문에 답하면 알맞은 청원 서식을 골라 내용을 채워 준다.
   * 청빙은 대상자·형태를 따로 묻고, 그 밖의 청원은 종류를 고른 뒤
   * 그 서식의 입력칸을 그대로 문답으로 채운다. */
  function petWizard() {
    var CALL_WIZ = {
      '목사': [
        { t: '위임목사로 청빙', f: 'call', kind: '목사위임',
          tip: '위임목사 청빙은 공동의회 결의가 필요하며, 교인 연서 <청빙서>도 함께 제출합니다.' },
        { t: '시무목사로 청빙', f: 'call', kind: '시무목사' },
        { t: '부목사로 청빙 (새로 모심)', f: 'callassoc' },
        { t: '부목사 계속 청빙 (연임)', f: 'call', kind: '부목사계속' },
        { t: '교육목사로 청빙', f: 'call', kind: '교육목사' },
        { t: '전도목사로 청빙', f: 'call', kind: '전도목사' },
        { t: '강도사 인허 후 부목사로 청빙', f: 'callassoclic' },
        { t: '다른 형태로 청빙 (직접 입력)', f: 'call', custom: true }
      ],
      '강도사': [
        { t: '강도사로 청빙', f: 'call', kind: '강도사' },
        { t: '목사안수 후 부목사로 청빙', f: 'callassocord' },
        { t: '다른 형태로 청빙 (직접 입력)', f: 'call', custom: true }
      ],
      '전도사': [
        { t: '전도사로 청빙', f: 'call', kind: '전도사' },
        { t: '강도사 인허 후 부목사로 청빙', f: 'callassoclic' },
        { t: '다른 형태로 청빙 (직접 입력)', f: 'call', custom: true }
      ]
    };
    var pick = { cat: null, who: null, choice: null };

    function stepBtns(list) {
      return list.map(function (t, i) {
        return '<button class="btn ghost" data-wz="' + i + '" ' +
          'style="display:block;width:100%;text-align:left;margin-top:8px">' + e(t) + '</button>';
      }).join('');
    }
    function backRow() {
      return '<div class="row"><button class="btn ghost" data-wzback>&#8592; 이전</button></div>';
    }

    /* 1단계: 청원 종류(분류) */
    function step1() {
      var cats = [];
      FORMS.forEach(function (f) {
        if (f.cat === '보고서') return;   /* 보고서는 자료실 → 보고서에서 작성한다 */
        if (cats.indexOf(f.cat) === -1) cats.push(f.cat);
      });
      var mo = modal('<h3>청원서류 작성 도우미</h3>' +
        '<p>1단계 — 어떤 종류의 청원입니까?</p>' + stepBtns(cats));
      mo.querySelectorAll('[data-wz]').forEach(function (b, i) {
        b.addEventListener('click', function () {
          pick.cat = cats[i];
          mo.remove();
          if (pick.cat === '청빙') stepWho(); else stepForm();
        });
      });
    }

    /* 청빙: 대상자 → 형태 */
    function stepWho() {
      var mo = modal('<h3>청원서류 작성 도우미</h3>' +
        '<p>2단계 — <strong>청빙 대상자</strong>는 어떤 분이십니까?</p>' +
        stepBtns(['목사', '강도사', '전도사']) + backRow());
      mo.querySelectorAll('[data-wz]').forEach(function (b, i) {
        b.addEventListener('click', function () {
          pick.who = ['목사', '강도사', '전도사'][i];
          mo.remove(); stepCallKind();
        });
      });
      mo.querySelector('[data-wzback]').addEventListener('click', function () { mo.remove(); step1(); });
    }
    function stepCallKind() {
      var opts = CALL_WIZ[pick.who];
      var mo = modal('<h3>청원서류 작성 도우미</h3>' +
        '<p>3단계 — <strong>' + e(pick.who) + '</strong>를 어떤 형태로 청빙하십니까?</p>' +
        stepBtns(opts.map(function (o) { return o.t; })) + backRow());
      mo.querySelectorAll('[data-wz]').forEach(function (b, i) {
        b.addEventListener('click', function () {
          pick.choice = opts[i];
          mo.remove(); stepFields(pick.choice);
        });
      });
      mo.querySelector('[data-wzback]').addEventListener('click', function () { mo.remove(); stepWho(); });
    }

    /* 그 밖의 청원: 서식 고르기 */
    function stepForm() {
      var list = FORMS.filter(function (f) { return f.cat === pick.cat; });
      var mo = modal('<h3>청원서류 작성 도우미</h3>' +
        '<p>2단계 — <strong>' + e(pick.cat) + '</strong> 가운데 어떤 청원을 하시겠습니까?</p>' +
        stepBtns(list.map(function (f) { return f.title; })) + backRow());
      mo.querySelectorAll('[data-wz]').forEach(function (b, i) {
        b.addEventListener('click', function () {
          pick.choice = { f: list[i].id };
          mo.remove(); stepFields(pick.choice);
        });
      });
      mo.querySelector('[data-wzback]').addEventListener('click', function () { mo.remove(); step1(); });
    }

    /* 마지막: 고른 서식의 입력칸을 문답으로 채운다 */
    function stepFields(c) {
      var frm = FORMS.filter(function (x) { return x.id === c.f; })[0];
      var today = new Date();
      var todayS = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') +
        '-' + String(today.getDate()).padStart(2, '0');
      var inputStyle = 'width:100%;border:1px solid var(--gray-2);border-radius:8px;padding:9px 10px;font-family:inherit';
      var fh = '';
      if (c.custom) {
        fh += '<label style="display:block;margin-top:10px;font-size:0.84rem">청빙 직위 (예: 협동목사)' +
          '<input type="text" data-wf="__kind" style="' + inputStyle + '"></label>';
      }
      frm.fields.forEach(function (f) {
        if (c.kind !== undefined && f.k === 'kind') return;   /* 이미 골랐다 */
        if (f.type === 'select') {
          fh += '<label style="display:block;margin-top:10px;font-size:0.84rem">' + e(f.label) +
            '<select data-wf="' + f.k + '" style="' + inputStyle + '">' +
            (f.opt || []).map(function (o) { return '<option>' + e(o) + '</option>'; }).join('') +
            '</select></label>';
        } else if (f.type === 'textarea') {
          fh += '<label style="display:block;margin-top:10px;font-size:0.84rem">' + e(f.label) +
            '<textarea data-wf="' + f.k + '" rows="3" style="' + inputStyle + '"></textarea></label>';
        } else if (f.type === 'date') {
          fh += '<label style="display:block;margin-top:10px;font-size:0.84rem">' + e(f.label) +
            '<input type="date" data-wf="' + f.k + '" value="' + (f.k === 'date' ? todayS : '') +
            '" style="' + inputStyle + '"></label>';
        } else {
          fh += '<label style="display:block;margin-top:10px;font-size:0.84rem">' + e(f.label) +
            '<input type="text" data-wf="' + f.k + '" style="' + inputStyle + '"></label>';
        }
      });
      var mo = modal('<h3>청원서류 작성 도우미</h3>' +
        '<p>마지막 — <strong>' + e(frm.title) + '</strong>에 들어갈 내용을 적어 주세요. ' +
        '빈 칸은 나중에 채우셔도 됩니다.</p>' + fh +
        '<div class="row"><button class="btn ghost" data-wzback>&#8592; 이전</button>' +
        '<button class="btn" id="wz-make">청원서 만들기</button></div>' +
        '<div class="form-msg" id="wz-msg"></div>');
      mo.querySelector('[data-wzback]').addEventListener('click', function () {
        mo.remove();
        if (pick.cat === '청빙') stepCallKind(); else stepForm();
      });
      mo.querySelector('#wz-make').addEventListener('click', function () {
        var wm = mo.querySelector('#wz-msg');
        var d = {};
        mo.querySelectorAll('[data-wf]').forEach(function (el2) {
          var v2 = el2.value.trim();
          if (['church', 'fromch', 'toch'].indexOf(el2.dataset.wf) !== -1) {
            v2 = v2.replace(/\s*교회\s*$/, '');
          }
          d[el2.dataset.wf] = v2;
        });
        if (c.custom) {
          if (!d.__kind) { wm.className = 'form-msg err'; wm.textContent = '청빙 직위를 적어 주세요.'; return; }
          d.kind = d.__kind; delete d.__kind;
        } else if (c.kind !== undefined) {
          d.kind = c.kind;
        }
        cur = frm; data = d; editingId = null;
        sealOn = true; sealPos = { dx: 0, dy: 0 };
        mo.remove();
        renderMenu(); renderForm(); renderPaper();
        msg('도우미로 <' + cur.title + '>를 만들었습니다. 아래 미리보기를 확인하시고 ' +
          '인쇄·PDF 저장 또는 시찰 서기에게 전달하세요.' + (c.tip ? ' ' + c.tip : ''));
        var paper = document.getElementById('pt-paper');
        if (paper) paper.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }
    step1();
  }
  document.getElementById('pt-wizard').addEventListener('click', petWizard);
  document.getElementById('pt-tab-mine').addEventListener('click', function () {
    location.href = 'mydocs.html';
  });
  document.getElementById('pt-tab-forms').addEventListener('click', function () {
    var m0 = document.getElementById('pt-menu');
    if (m0) m0.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  document.getElementById('pt-print').addEventListener('click', function () { window.print(); });
  document.getElementById('pt-pdf').addEventListener('click', savePdf);
  document.getElementById('pt-save').addEventListener('click', saveMine);
  document.getElementById('pt-send').addEventListener('click', sendToSichal);
  document.getElementById('pt-clear').addEventListener('click', function () {
    data = {}; editingId = null; viewSeal = null; msg('');
    sealOn = true; sealPos = { dx: 0, dy: 0 };
    renderForm(); renderPaper();
  });

  /* 당회장 도장 찍기 켜고 끄기 */
  document.getElementById('pt-sealon').addEventListener('change', function () {
    sealOn = this.checked;
    data._seal = { on: sealOn, dx: sealPos.dx, dy: sealPos.dy };
    renderPaper();
  });

  /* 열람 모드 단추 (새 창으로 열었을 때 쓰는 인쇄·PDF) */
  document.getElementById('pt-vprint').addEventListener('click', function () { window.print(); });
  document.getElementById('pt-vpdf').addEventListener('click', savePdf);

  /* 구비서류 안내 박스 안에 끼워 넣어 보여 줄 때 */
  if (/[?&]embed=1/.test(location.search)) document.body.classList.add('pt-embed');
  /* 제출된 청원서 열람 모드는 입력칸 없이 종이만 보여 준다 */
  if (viewSubId || viewSubIds.length) document.body.classList.add('pt-view');

  /* 구비서류 안내에서 ?form=아이디 로 들어오면 그 서식을 바로 연다 */
  var fm = location.search.match(/[?&]form=([a-z]+)/);
  if (fm) {
    var f0 = FORMS.filter(function (x) { return x.id === fm[1]; })[0];
    if (f0) cur = f0;
  }

  /* 시찰 화면에서 ?sichal=이름 으로 들어오면 시찰보고서에 그 시찰을 미리 채운다 */
  var sm0 = location.search.match(/[?&]sichal=([^&]*)/);
  if (sm0) data.sichal = decodeURIComponent(sm0[1]).replace(/\+/g, ' ');

  renderMenu(); renderForm(); renderPaper();
  if (window.SHS && SHS.getUser) {
    SHS.getUser().then(function (u) {
      user = u;
      /* 언권회원은 청원서를 작성·제출할 수 없다 */
      if (u && u.role === 'advisory') {
        document.getElementById('main').innerHTML =
          '<div style="padding:20px 0">' + SHS.fullMemberGate(u, '청원서 작성') + '</div>';
        return;
      }
      if (viewSubId) { openSubmission(viewSubId); return; }
      if (viewSubIds.length) { openSubmissions(viewSubIds); return; }
      loadMine(); loadSeal(); loadInbox(); openFromUrl();
      /* 시찰보고서 연동(회기·시찰장·교세 자동 입력)은 로그인 확인 후에야
       * 돌 수 있으므로, 처음부터 시찰보고서로 들어왔다면 다시 그린다 */
      if (cur.id === 'sichalreport' && !editingId) { renderForm(); renderPaper(); }
    });
  } else {
    loadMine();
  }
})();
</script>
</body>
</html>
