<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>알림 - 시화산노회</title>
<link rel="stylesheet" href="css/style.css?v=20260901a">
</head>
<body>

<div class="page-head">
  <div class="container">
    <h1>알림</h1>
    <div class="crumb">홈 &gt; 알림</div>
  </div>
</div>

<main class="page-body container" style="max-width:820px" id="main">
  <div id="nt-area"><p style="color:var(--gray-5)">불러오는 중...</p></div>
</main>

<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-auth.js"></script>
<script src="js/main.js?v=20260902e"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
 SHS.getUser().then(function (user) {
  var area = document.getElementById('nt-area');
  var e = SHS.esc;

  if (!user) {
    area.innerHTML = '<div class="notice-banner">알림은 로그인 후 확인하실 수 있습니다. ' +
      '<a class="btn sm" style="margin-left:10px" href="login.html">로그인</a></div>';
    return;
  }
  if (!user.cloud) {
    area.innerHTML = '<div class="notice-banner">알림은 서버 로그인 후 확인하실 수 있습니다.</div>';
    return;
  }

  /* ---------- 전 회원에게 알림 보내기 (관리자만) ----------
   * 보낸이는 서버가 로그인한 관리자에게서 직접 적는다.
   * 이 화면에서는 보여 주기만 할 뿐 고칠 수 없다. */
  var flash = '';        /* 보낸 뒤 알림함을 다시 그려도 남겨 둘 알림말 */

  function sendBox() {
    if (!SHSAuth.canManageMembers(user)) return '';
    var who = (user.name || '') + ' ' + (user.title || user.position || '');
    return '<div class="admin-card" id="nt-send" style="margin-bottom:20px">' +
      '<h3>전 회원에게 알림 보내기</h3>' +
      '<p style="color:var(--gray-5);font-size:0.9rem;margin-bottom:16px">' +
      '승인이 끝난 회원 <strong id="nt-cnt">…</strong>분의 알림함으로 한 번에 갑니다. ' +
      '(승인대기·정지된 계정은 빠집니다)</p>' +
      '<div class="inline-form" style="margin-bottom:8px">' +
      '<div class="field" style="flex:0 0 220px"><label>보낸이</label>' +
      '<input type="text" value="' + e(who.trim()) + '" disabled></div>' +
      '<div class="field" style="flex:0 0 120px"><label for="nt-kind">종류</label>' +
      '<select id="nt-kind"><option>공지</option><option>안내</option>' +
      '<option>긴급</option><option>회의</option></select></div>' +
      '<div class="field"><label for="nt-title">제목</label>' +
      '<input type="text" id="nt-title" maxlength="120"></div>' +
      '</div>' +
      '<p style="font-size:0.84rem;color:var(--gray-5);margin:0 0 14px">' +
      '보낸이는 로그인하신 분으로 정해지며 고칠 수 없습니다.</p>' +
      '<div class="field"><label for="nt-body">내용</label>' +
      '<textarea id="nt-body" rows="5"></textarea></div>' +
      '<p style="margin:0"><button class="btn" id="nt-send-go">전 회원에게 보내기</button>' +
      '<span id="nt-msg" style="margin-left:12px">' + flash + '</span></p>' +
      '</div>';
  }

  function bindSend() {
    var go = document.getElementById('nt-send-go');
    if (!go) return;
    var msg = document.getElementById('nt-msg');

    SHSCloud.init().then(function (c) { return c.rpc('notice_target_count'); })
      .then(function (r) {
        var el = document.getElementById('nt-cnt');
        if (el) el.textContent = (r && !r.error && r.data != null) ? r.data : '전체';
      }, function () {});

    go.addEventListener('click', function () {
      var title = document.getElementById('nt-title').value.trim();
      var body  = document.getElementById('nt-body').value.trim();
      var kind  = document.getElementById('nt-kind').value;
      flash = '';
      if (!title) { msg.innerHTML = '<span style="color:var(--red)">제목을 적어 주세요.</span>'; return; }
      var cnt = (document.getElementById('nt-cnt') || {}).textContent || '전체';
      if (!confirm('회원 ' + cnt + '분께 다음 알림을 보냅니다.\n\n[' + kind + '] ' + title +
                   '\n\n보내시겠습니까?')) return;

      go.disabled = true;
      msg.textContent = '보내는 중...';
      SHSCloud.init().then(function (c) {
        return c.rpc('send_notice_to_all', { p_kind: kind, p_title: title, p_body: body });
      }).then(function (r) {
        go.disabled = false;
        if (r && r.error) {
          msg.innerHTML = '<span style="color:var(--red)">보내지 못했습니다: ' + e(r.error.message) +
            '</span>';
          return;
        }
        var n = (r && r.data) || 0;
        if (!n) {
          msg.innerHTML = '<span style="color:var(--gray-5)">방금 같은 제목으로 보내셨습니다. ' +
            '다시 보내시려면 잠시 뒤에 눌러 주세요.</span>';
          return;
        }
        SHS.logAction('add', '전 회원 알림 발송', title + ' (' + n + '명)');
        /* 알림함을 다시 그리면 이 자리가 새로 만들어지므로 알림말을 넘겨 준다 */
        flash = '<span style="color:var(--navy)">' + n + '분께 보냈습니다.</span>';
        msg.innerHTML = flash;
        load();
      }, function (x) {
        go.disabled = false;
        msg.innerHTML = '<span style="color:var(--red)">보내지 못했습니다: ' + e(String(x)) + '</span>';
      });
    });
  }

  function load() {
    SHSCloud.init().then(function (c) {
      return c.from('notifications').select('*').order('created_at', { ascending: false }).limit(100);
    }).then(function (r) {
      if (r.error) {
        area.innerHTML = '<div class="notice-banner">알림을 불러오지 못했습니다: ' + e(r.error.message) +
          ' (11 알림함 등록이 필요할 수 있습니다)</div>';
        return;
      }
      var rows = r.data || [];
      var unread = rows.filter(function (n) { return !n.read_at; });

      var html = sendBox();
      var readCnt = rows.length - unread.length;
      if (rows.length) {
        html += '<div class="board-controls"><span style="align-self:center;color:var(--gray-7)">' +
          (unread.length ? '읽지 않은 알림 <strong>' + unread.length + '</strong>건' : '모두 읽었습니다') +
          '</span>' +
          (unread.length ? '<button class="btn ghost" id="nt-allread">모두 읽음으로 표시</button>' : '') +
          (readCnt ? '<button class="btn ghost" id="nt-delread">읽은 알림 모두 삭제 (' + readCnt + ')</button>' : '') +
          '</div>';
      }
      if (!rows.length) {
        html += '<p style="color:var(--gray-5)">받은 알림이 없습니다.</p>';
      } else {
        rows.forEach(function (n) {
          html += '<div class="noti-item' + (n.read_at ? '' : ' unread') + '">' +
            '<div class="n-head"><span class="n-kind">' + e(n.kind) + '</span>' +
            '<span class="n-title">' + e(n.title) + '</span>' +
            '<span class="n-date">' + e(String(n.created_at).replace('T', ' ').slice(0, 16)) + '</span></div>' +
            (n.sent_by_name
              ? '<div class="n-from">보낸이 ' + e(n.sent_by_name) + '</div>' : '') +
            '<div class="n-body">' + e(n.body || '') + '</div>' +
            '<p style="margin:10px 0 0">' +
            (SHS.notiLinkOf && (n.kind === '문의' || n.kind === '서류')
              ? '<a class="btn sm" href="' + e(SHS.notiLinkOf(n, user)) + '" style="margin-right:6px">' +
                (n.kind === '문의' ? '답장하기' : '바로 가기') + '</a>' : '') +
            (n.read_at ? '' : '<button class="btn ghost sm" data-ntread="' + n.id + '" style="margin-right:6px">읽음</button>') +
            '<button class="btn danger sm" data-ntdel="' + n.id + '">삭제</button>' +
            '</p>' +
            '</div>';
        });
      }
      area.innerHTML = html;
      bindSend();

      function markRead(ids) {
        SHSCloud.init().then(function (c) {
          return c.from('notifications').update({ read_at: new Date().toISOString() }).in('id', ids);
        }).then(function () { load(); });
      }
      area.querySelectorAll('button[data-ntread]').forEach(function (b) {
        b.addEventListener('click', function () { markRead([b.dataset.ntread]); });
      });
      var all = document.getElementById('nt-allread');
      if (all) all.addEventListener('click', function () {
        markRead(unread.map(function (n) { return n.id; }));
      });

      function removeNoti(ids) {
        SHSCloud.init().then(function (c) {
          return c.from('notifications').delete().in('id', ids);
        }).then(function (r2) {
          if (r2 && r2.error) { alert(r2.error.message); return; }
          load();
        });
      }
      area.querySelectorAll('button[data-ntdel]').forEach(function (b) {
        b.addEventListener('click', function () {
          if (!confirm('이 알림을 삭제하시겠습니까? 되돌릴 수 없습니다.')) return;
          removeNoti([b.dataset.ntdel]);
        });
      });
      var delRead = document.getElementById('nt-delread');
      if (delRead) delRead.addEventListener('click', function () {
        var ids = rows.filter(function (n) { return n.read_at; }).map(function (n) { return n.id; });
        if (!ids.length) return;
        if (!confirm('읽은 알림 ' + ids.length + '건을 모두 삭제하시겠습니까? 되돌릴 수 없습니다.')) return;
        removeNoti(ids);
      });
    });
  }
  load();
 });
});
</script>
</body>
</html>
