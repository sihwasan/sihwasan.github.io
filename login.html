<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 - 시화산노회</title>
<link rel="stylesheet" href="css/style.css?v=20260831g">
</head>
<body>

<div class="page-head">
  <div class="container">
    <h1>로그인</h1>
    <div class="crumb">홈 &gt; 로그인</div>
  </div>
</div>

<main class="page-body container" id="main">

  <div class="form-card">
    <h2>회원 로그인</h2>

    <div id="social-login" class="hidden">
      <button class="btn-google" id="btn-google">
        <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
          <path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h11.8c-.5 2.7-2 5-4.4 6.6v5.5h7.1c4.1-3.8 6.6-9.4 6.6-16.1z"/>
          <path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.4l-7.1-5.5c-2 1.3-4.5 2.1-7.4 2.1-5.7 0-10.6-3.9-12.3-9.1H4.3v5.7C7.9 41 15.3 46 24 46z"/>
          <path fill="#FBBC05" d="M11.7 28.1c-.4-1.3-.7-2.7-.7-4.1s.3-2.8.7-4.1v-5.7H4.3C2.8 17.2 2 20.5 2 24s.8 6.8 2.3 9.8l7.4-5.7z"/>
          <path fill="#EA4335" d="M24 10.8c3.2 0 6.1 1.1 8.4 3.3l6.3-6.3C34.9 4.1 29.9 2 24 2 15.3 2 7.9 7 4.3 14.2l7.4 5.7c1.7-5.2 6.6-9.1 12.3-9.1z"/>
        </svg>
        <span>구글 계정으로 로그인</span>
      </button>
      <div class="login-divider"><span>또는 이메일로 로그인</span></div>
    </div>

    <!-- 브라우저가 아이디·비밀번호 저장을 제안하려면 form 안에 있어야 한다 -->
    <form id="login-form" method="post" action="#" autocomplete="on">
      <div class="field">
        <label for="login-id">이메일</label>
        <input type="email" id="login-id" name="username" autocomplete="username" placeholder="hong@naver.com">
      </div>
      <div class="field">
        <label for="login-pw">비밀번호</label>
        <input type="password" id="login-pw" name="password" autocomplete="current-password">
      </div>
      <div class="field login-opts">
        <label><input type="checkbox" id="login-save" style="width:auto;margin-right:6px">아이디 저장</label>
        <label><input type="checkbox" id="login-keep" style="width:auto;margin-right:6px">로그인 상태 유지</label>
      </div>
      <button class="btn" id="btn-login" type="submit" style="width:100%">로그인</button>
    </form>
    <div class="form-msg" id="login-msg"></div>
    <p class="login-pw-tip">
      비밀번호 저장은 브라우저에 맡깁니다. 로그인하시면 브라우저가
      <strong>“비밀번호를 저장하시겠습니까?”</strong>라고 물어봅니다. 저장을 누르시면
      다음부터 자동으로 채워집니다. (홈페이지에는 비밀번호를 보관하지 않습니다.)
    </p>
    <div class="find-links">
      <a href="#" id="link-find-id">이메일 찾기</a>
      <span class="sep">|</span>
      <a href="#" id="link-find-pw">비밀번호 재설정</a>
    </div>
    <div class="find-links" style="margin-top:6px">
      <span style="color:var(--gray-5)">계정이 없으신가요?</span>
      <a href="signup.html"><strong>회원가입</strong></a>
    </div>
  </div>

  <!-- 이메일 찾기 -->
  <div class="form-card hidden" id="find-id-card" style="margin-top:20px">
    <h2>이메일 찾기</h2>
    <p style="font-size:0.85rem;color:var(--gray-5);text-align:center;margin-bottom:20px">
      가입 시 등록한 성명과 소속 교회를 입력해 주세요.
    </p>
    <div class="field">
      <label for="fi-name">성명</label>
      <input type="text" id="fi-name">
    </div>
    <div class="field">
      <label for="fi-church">소속 교회</label>
      <input type="text" id="fi-church" placeholder="소속 교회명">
    </div>
    <button class="btn" id="btn-find-id" style="width:100%">이메일 찾기</button>
    <button class="btn ghost" id="btn-fi-cancel" style="width:100%;margin-top:8px">닫기</button>
    <div class="form-msg" id="fi-msg"></div>
    <div id="fi-result" class="hidden" style="margin-top:14px;border:1px solid var(--gray-2);background:var(--gray-1);padding:14px;font-size:0.9rem"></div>
  </div>

  <!-- 비밀번호 재설정 -->
  <div class="form-card hidden" id="find-pw-card" style="margin-top:20px">
    <h2>비밀번호 재설정</h2>
    <p style="font-size:0.85rem;color:var(--gray-5);text-align:center;margin-bottom:20px">
      가입하신 이메일로 재설정 링크를 보내드립니다.<br>
      메일함에서 링크를 누르시면 새 비밀번호를 정하실 수 있습니다.
    </p>
    <div class="field">
      <label for="fp-id">가입하신 이메일</label>
      <input type="email" id="fp-id" autocomplete="off" placeholder="hong@naver.com">
    </div>
    <button class="btn" id="btn-find-pw" style="width:100%">재설정 메일 보내기</button>
    <button class="btn ghost" id="btn-fp-cancel" style="width:100%;margin-top:8px">닫기</button>
    <div class="form-msg" id="fp-msg"></div>
  </div>



</main>

<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-auth.js"></script>
<script src="js/main.js?v=20260830d"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  /* 구글 로그인은 서버 설정이 완료된 경우에만 표시한다. */
  if (SHSCloud.enabled()) {
    document.getElementById('social-login').classList.remove('hidden');
    document.getElementById('btn-google').addEventListener('click', function () {
      SHSCloud.signInWithGoogle();
    });
  }

  function localLogin(id, pw, keep, msg) {
    var r = SHSAuth.login(id, pw, keep);
    if (r.ok) {
      msg.className = 'form-msg ok';
      msg.textContent = r.user.name + ' 님, 환영합니다.';
      setTimeout(function () { location.href = 'index.html'; }, 400);
    } else {
      msg.className = 'form-msg err';
      msg.textContent = r.msg;
    }
  }

  /* ---- 아이디 저장 ----
   * 저장에 동의하신 경우에만 이메일을 이 컴퓨터에 남긴다.
   * 비밀번호는 홈페이지가 보관하지 않고 브라우저 비밀번호 관리자에 맡긴다. */
  var SAVE_KEY = 'shs_saved_id_v1';
  var idInput = document.getElementById('login-id');
  var saveBox = document.getElementById('login-save');
  try {
    var savedId = localStorage.getItem(SAVE_KEY);
    if (savedId) {
      idInput.value = savedId;
      saveBox.checked = true;
      document.getElementById('login-pw').focus();
    }
  } catch (x) {}

  saveBox.addEventListener('change', function () {
    try {
      if (saveBox.checked) {
        if (idInput.value.trim()) localStorage.setItem(SAVE_KEY, idInput.value.trim().toLowerCase());
      } else {
        localStorage.removeItem(SAVE_KEY);
      }
    } catch (x) {}
  });

  function rememberId(id) {
    try {
      if (saveBox.checked) localStorage.setItem(SAVE_KEY, id);
      else localStorage.removeItem(SAVE_KEY);
    } catch (x) {}
  }

  function doLogin() {
    var id = document.getElementById('login-id').value.trim().toLowerCase();
    var pw = document.getElementById('login-pw').value;
    var keep = document.getElementById('login-keep').checked;
    var msg = document.getElementById('login-msg');
    if (!id || !pw) {
      msg.className = 'form-msg err';
      msg.textContent = '이메일과 비밀번호를 입력해 주세요.';
      return;
    }
    rememberId(id);
    /* 로그인은 항상 서버 인증으로 처리한다.
     * (예전의 이 컴퓨터 전용 로그인은 서버 자료를 읽지 못해 혼란을 주므로 사용하지 않는다.) */
    if (window.SHSCloud && SHSCloud.enabled()) {
      msg.className = 'form-msg';
      msg.textContent = '확인 중입니다...';
      SHSCloud.init().then(function (c) {
        if (!c) {
          msg.className = 'form-msg err';
          msg.textContent = '로그인 서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.';
          return;
        }
        c.auth.signInWithPassword({ email: id, password: pw }).then(function (r) {
          if (r.error) {
            msg.className = 'form-msg err';
            msg.textContent = (r.error.message || '').indexOf('Invalid') !== -1
              ? '이메일 또는 비밀번호가 올바르지 않습니다.'
              : r.error.message;
            return;
          }
          msg.className = 'form-msg ok';
          msg.textContent = '환영합니다.';
          SHSCloud.log('auth', '이메일 로그인', id);
          setTimeout(function () { location.href = 'index.html'; }, 400);
        });
      });
      return;
    }
    localLogin(id, pw, keep, msg);
  }
  /* 폼 제출로 처리해야 브라우저가 비밀번호 저장을 제안한다 */
  document.getElementById('login-form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    doLogin();
  });

  /* ---- 아이디 찾기 / 비밀번호 재설정 ---- */
  var fiCard = document.getElementById('find-id-card');
  var fpCard = document.getElementById('find-pw-card');

  function openCard(card) {
    fiCard.classList.add('hidden');
    fpCard.classList.add('hidden');
    card.classList.remove('hidden');
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  document.getElementById('link-find-id').addEventListener('click', function (ev) {
    ev.preventDefault();
    openCard(fiCard);
  });
  document.getElementById('link-find-pw').addEventListener('click', function (ev) {
    ev.preventDefault();
    openCard(fpCard);
  });
  document.getElementById('btn-fi-cancel').addEventListener('click', function () {
    fiCard.classList.add('hidden');
  });
  document.getElementById('btn-fp-cancel').addEventListener('click', function () {
    fpCard.classList.add('hidden');
  });

  document.getElementById('btn-find-id').addEventListener('click', function () {
    var msg = document.getElementById('fi-msg');
    var box = document.getElementById('fi-result');
    var r = SHSAuth.findIds(
      document.getElementById('fi-name').value.trim(),
      document.getElementById('fi-church').value.trim()
    );
    if (!r.ok) {
      box.classList.add('hidden');
      msg.className = 'form-msg err';
      msg.textContent = r.msg;
      return;
    }
    msg.className = 'form-msg ok';
    msg.textContent = '일치하는 계정을 찾았습니다.';
    box.classList.remove('hidden');
    box.innerHTML = '<strong>회원님의 이메일</strong><div style="margin-top:6px">' +
      r.ids.map(function (i) { return '<div>' + i + '</div>'; }).join('') + '</div>' +
      '<div style="margin-top:10px;color:var(--gray-5);font-size:0.82rem">' +
      '개인정보 보호를 위해 이메일 일부를 가려 표시합니다. 전체 주소가 필요하시면 노회 사무실(031-486-9993)로 문의해 주세요.</div>';
  });

  document.getElementById('btn-find-pw').addEventListener('click', function () {
    var msg = document.getElementById('fp-msg');
    var email = document.getElementById('fp-id').value.trim().toLowerCase();
    if (!email) {
      msg.className = 'form-msg err';
      msg.textContent = '가입하신 이메일을 입력해 주세요.';
      return;
    }
    if (!(window.SHSCloud && SHSCloud.enabled())) {
      msg.className = 'form-msg err';
      msg.textContent = '서버에 연결할 수 없습니다. 노회 사무실(031-486-9993)로 문의해 주세요.';
      return;
    }
    msg.className = 'form-msg';
    msg.textContent = '메일을 보내는 중입니다...';
    SHSCloud.init().then(function (c) {
      return c.auth.resetPasswordForEmail(email, {
        redirectTo: location.origin + location.pathname.replace(/[^/]*$/, '') + 'reset-password.html'
      });
    }).then(function (r) {
      if (r.error) {
        var em = r.error.message || '';
        msg.className = 'form-msg err';
        msg.textContent = em.indexOf('rate limit') !== -1
          ? '메일 발송 한도를 넘었습니다. 한 시간쯤 뒤에 다시 시도하시거나, 노회 사무실(031-486-9993)로 문의해 주세요.'
          : em;
        return;
      }
      msg.className = 'form-msg ok';
      msg.textContent = email + ' 으로 재설정 메일을 보냈습니다. 메일함에서 링크를 눌러 새 비밀번호를 정해 주세요.';
      document.getElementById('fp-id').value = '';
    });
  });

});
</script>
</body>
</html>
