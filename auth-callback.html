<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 처리 중 - 시화산노회</title>
<link rel="stylesheet" href="css/style.css?v=20260831zl">
</head>
<body>

<div class="page-head">
  <div class="container">
    <h1>회원 정보 등록</h1>
    <div class="crumb">홈 &gt; 로그인 &gt; 회원 정보 등록</div>
  </div>
</div>

<main class="page-body container" id="main">
  <div id="cb-area">
    <p style="text-align:center;color:var(--gray-5)">로그인 정보를 확인하는 중입니다...</p>
  </div>
</main>

<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-auth.js"></script>
<script src="js/main.js?v=20260901g"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var area = document.getElementById('cb-area');
  var e = SHS.esc;

  if (!SHSCloud.enabled()) {
    area.innerHTML = '<div class="notice-banner">로그인 서버 설정이 완료되지 않았습니다. ' +
      '노회 사무실(031-486-9993)로 문의해 주세요.</div>';
    return;
  }

  /* 회원가입 화면에서 입력한 성명·소속 교회를 넘겨받는다. */
  var pend = null;
  try {
    var raw = sessionStorage.getItem('shs_signup_v1');
    if (raw) pend = JSON.parse(raw);
    sessionStorage.removeItem('shs_signup_v1');
  } catch (err) { pend = null; }

  SHSCloud.loadProfile().then(function (p) {
    if (!p) {
      area.innerHTML = '<div class="notice-banner">로그인이 확인되지 않았습니다. ' +
        '다시 시도해 주세요. <a class="btn sm" style="margin-left:10px" href="login.html">로그인</a></div>';
      return;
    }

    /* 이미 등급을 받은 회원 */
    if (p.role !== 'pending' && p.church) {
      SHSCloud.log('auth', '구글 로그인', p.email);
      if (pend) {
        /* 가입하려고 눌렀는데 그 구글 계정이 이미 가입되어 있는 경우 */
        area.innerHTML =
          '<div class="notice-banner">이 구글 계정(<strong>' + e(p.email) + '</strong>)은 ' +
          '이미 <strong>' + e(p.name || '') + '</strong> 님으로 가입되어 있어 그대로 로그인되었습니다. ' +
          '입력하신 가입 정보는 등록하지 않았습니다.<br><br>' +
          '다른 분의 계정을 새로 만드시려면 아래 <strong>로그아웃</strong>을 누른 뒤, ' +
          '구글 화면에서 <strong>그분의 구글 계정</strong>을 선택해 다시 가입해 주세요.</div>' +
          '<p style="text-align:center">' +
          '<a class="btn" href="index.html">홈으로</a> ' +
          '<button class="btn ghost" id="cb-signout">로그아웃하고 다시 가입</button></p>';
        document.getElementById('cb-signout').addEventListener('click', function () {
          SHSCloud.signOut().then(function () { location.href = 'signup.html'; });
        });
        return;
      }
      area.innerHTML = '<div class="notice-banner"><strong>' + e(p.name || p.email) + '</strong> 님, 환영합니다. ' +
        '현재 등급은 <strong>' + SHS.displayRole(p.role, p.title) + '</strong>' +
        (p.title ? ' (' + e(p.title) + ')' : '') + '입니다.</div>' +
        '<p style="text-align:center"><a class="btn" href="index.html">홈으로</a></p>';
      setTimeout(function () { location.href = 'index.html'; }, 1200);
      return;
    }

    /* 처음 로그인한 회원 : 성명·소속 교회를 등록받아 명단과 대조 */
    var churches = [];
    SHSData.sichals.forEach(function (s) { churches = churches.concat(s.churches); });
    churches.sort();
    /* 교회 명부(sichal_churches)가 원본이다. 있으면 그 목록으로 바꿔 준다 */
    SHSCloud.init().then(function (c) {
      return c.from('sichal_churches').select('name').order('name');
    }).then(function (r) {
      var list = ((r && r.data) || []).map(function (x) { return x.name; }).filter(Boolean);
      if (!list.length) return;
      var sel = document.getElementById('cb-church');
      if (!sel) return;
      var keep = sel.value;
      sel.innerHTML = '<option value="">— 선택하세요 —</option>' +
        list.map(function (x) { return '<option>' + e(x) + '</option>'; }).join('') +
        '<option value="__etc">목록에 없음 (직접 입력)</option>';
      sel.value = keep;
    }).catch(function () {});

    area.innerHTML =
      '<div class="notice-banner">구글 로그인이 완료되었습니다. ' +
      '노회 명단과 대조하기 위해 <strong>성명과 소속 교회</strong>를 확인해 주세요. ' +
      '명단과 일치하면 회원 등급이 자동으로 부여됩니다.</div>' +
      '<div class="form-card">' +
      '<h2>회원 정보 등록</h2>' +
      '<div class="field"><label>이메일</label><input type="email" value="' + e(p.email) + '" disabled></div>' +
      '<div class="field"><label>성명</label><input type="text" id="cb-name" value="' +
      e((pend && pend.name) || p.name || '') + '"></div>' +
      '<div class="field"><label>직분</label><select id="cb-pos">' +
      ['목사', '위임목사', '부목사', '강도사', '전도사', '장로', '간사'].map(function (x) { return '<option>' + x + '</option>'; }).join('') +
      '</select></div>' +
      '<div class="field"><label>소속 교회</label>' +
      '<select id="cb-church"><option value="">— 선택하세요 —</option>' +
      churches.map(function (c) { return '<option>' + e(c) + '</option>'; }).join('') +
      '<option value="__etc">목록에 없음 (직접 입력)</option></select></div>' +
      '<div class="field hidden" id="cb-etc-wrap"><label>교회명 직접 입력</label>' +
      '<input type="text" id="cb-etc" placeholder="소속 교회명"></div>' +
      '<div class="field"><label>생년월일</label><input type="date" id="cb-birth">' +
      '<span style="display:block;font-size:0.82rem;color:var(--gray-5);margin-top:5px">' +
      '총회 정년이 <strong>만 70세</strong>이므로, 정회원 자격 확인을 위해 생년월일이 필요합니다. ' +
      '적지 않으시면 승인대기 상태가 됩니다.</span></div>' +
      '<div class="field"><label>연락처 (선택)</label><input type="tel" id="cb-phone" placeholder="010-0000-0000"></div>' +
      '<button class="btn" id="cb-submit" style="width:100%">등록</button>' +
      '<div class="form-msg" id="cb-msg"></div>' +
      '</div>';

    document.getElementById('cb-church').addEventListener('change', function () {
      document.getElementById('cb-etc-wrap').classList.toggle('hidden', this.value !== '__etc');
    });

    /* 회원가입 화면에서 이미 입력하신 정보는 그대로 채워 넣는다. */
    if (pend) {
      var posEl = document.getElementById('cb-pos');
      for (var i = 0; i < posEl.options.length; i++) {
        if (posEl.options[i].value === pend.position) { posEl.selectedIndex = i; break; }
      }
      var chEl = document.getElementById('cb-church');
      var found = false;
      for (var j = 0; j < chEl.options.length; j++) {
        if (chEl.options[j].value === pend.church) { chEl.selectedIndex = j; found = true; break; }
      }
      if (!found) {
        chEl.value = '__etc';
        document.getElementById('cb-etc-wrap').classList.remove('hidden');
        document.getElementById('cb-etc').value = pend.church;
      }
      document.getElementById('cb-phone').value = pend.phone || '';
      if (pend.birth) document.getElementById('cb-birth').value = pend.birth;
    }

    document.getElementById('cb-submit').addEventListener('click', function () {
      var msg = document.getElementById('cb-msg');
      var name = document.getElementById('cb-name').value.trim();
      var sel = document.getElementById('cb-church').value;
      var church = sel === '__etc' ? document.getElementById('cb-etc').value.trim() : sel;
      var birth = document.getElementById('cb-birth').value;
      if (!name || !church) {
        msg.className = 'form-msg err';
        msg.textContent = '성명과 소속 교회를 입력해 주세요.';
        return;
      }
      if (!birth) {
        msg.className = 'form-msg err';
        msg.textContent = '생년월일을 입력해 주세요. 총회 정년(만 70세) 확인에 필요합니다.';
        document.getElementById('cb-birth').focus();
        return;
      }
      var adj = SHS.adjustPosition(name, church, document.getElementById('cb-pos').value);
      if (adj.blocked) {
        msg.className = 'form-msg err';
        msg.textContent = adj.msg;
        return;
      }
      if (adj.note) alert(adj.note);
      msg.className = 'form-msg';
      msg.textContent = '확인 중입니다...';
      SHSCloud.claimMembership(name, church,
        adj.position,
        document.getElementById('cb-phone').value.trim(),
        birth
      ).then(function (r) {
        if (!r.ok) {
          msg.className = 'form-msg err';
          msg.textContent = r.msg;
          return;
        }
        msg.className = 'form-msg ok';
        if (r.role === 'pending') {
          msg.textContent = '등록되었습니다. 노회 명단과 일치하지 않아 승인대기 상태입니다. ' +
            '서기·간사 확인 후 정회원으로 전환됩니다.';
        } else {
          msg.textContent = '등록되었습니다. 노회 명단과 일치하여 ' +
            (r.title ? r.title + '(' + r.roleName + ')' : r.roleName) + ' 등급이 부여되었습니다.';
          setTimeout(function () { location.href = 'index.html'; }, 1600);
        }
      });
    });

    /* 회원가입 화면에서 정보를 다 입력하고 오셨으면 곧바로 등록을 마친다. */
    if (pend) document.getElementById('cb-submit').click();
  });
});
</script>
</body>
</html>
