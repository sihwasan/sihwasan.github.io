<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>목사·장로 고시 모의고사 - 시화산노회</title>
<link rel="stylesheet" href="css/style.css?v=20260830k">
</head>
<body>

<div class="page-head">
  <div class="container">
    <h1>목사·장로 고시 모의고사</h1>
    <div class="crumb">홈 &gt; 자료실 &gt; 모의고사</div>
  </div>
</div>

<main class="page-body container" style="max-width:900px" id="main">
  <div id="ex-area"><p style="color:var(--gray-5)">확인하는 중...</p></div>
</main>

<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-auth.js"></script>
<script src="js/main.js?v=20260830d"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
 SHS.getUser().then(function (user) {
  var area = document.getElementById('ex-area');
  var e = SHS.esc;

  /* 고시 과목 (노회규칙 제7장 22~23조 / 고시부 가이드북) */
  var TRACKS = [
    { v: '목사',       subs: '목회학 · 권징조례 · 신조 · 예배모범' },
    { v: '장로',       subs: '정치 · 권징조례 · 신조 · 상식 · 소요리' },
    { v: '전도사',     subs: '상식 · 영어' },
    { v: '목사후보생', subs: '상식 · 영어' }
  ];

  function subjectTable() {
    return '<h2>구분별 고시 과목</h2>' +
      '<table class="tbl" style="max-width:720px"><thead><tr><th style="width:130px">구분</th>' +
      '<th>필기 과목</th></tr></thead><tbody>' +
      TRACKS.map(function (t) {
        return '<tr><td>' + e(t.v) + '</td><td class="left">' + e(t.subs) + '</td></tr>';
      }).join('') + '</tbody></table>' +
      '<p style="font-size:0.84rem;color:var(--gray-5)">' +
      '· 면접은 모든 응시자 공통이며 필기가 아니므로 모의고사에서 제외됩니다.<br>' +
      '· 성경 과목은 성경통신 신구약 수료증으로 대체되므로 모의고사에 포함되지 않습니다.<br>' +
      '· 실제 고시 합격 기준은 전 과목 평균 60점 이상입니다.</p>';
  }

  /* 로그인만 하시면 누구나 응시하실 수 있습니다. */
  if (!user || !user.cloud) {
    area.innerHTML =
      '<div class="notice-banner">모의고사는 <strong>로그인</strong>하시면 누구나 보실 수 있습니다. ' +
      '구글 또는 이메일로 로그인해 주세요. ' +
      '<a class="btn sm" style="margin-left:10px" href="login.html">로그인</a> ' +
      '<a class="btn ghost sm" href="signup.html">회원가입</a></div>' +
      subjectTable();
    return;
  }

  var attempts = [], counts = {};
  function db() { return SHSCloud.init(); }

  /* 시험 화면·채점 결과에서 뒤로 가기를 누르면 이전 단계로 돌아간다 */
  var go = SHS.stepNav({
    home: function () { load(); }
  });

  function load() {
    db().then(function (c) {
      return Promise.all([
        c.from('exam_attempts').select('*').order('started_at', { ascending: false }),
        c.rpc('exam_question_counts')
      ]);
    }).then(function (rs) {
      if (rs[0].error) {
        area.innerHTML = '<div class="notice-banner">모의고사 정보를 불러오지 못했습니다: ' +
          e(rs[0].error.message) + ' (19 고시 모의고사 등록이 필요할 수 있습니다)</div>';
        return;
      }
      attempts = rs[0].data || [];
      counts = {};
      ((rs[1] && rs[1].data) || []).forEach(function (x) { counts[x.subject] = x.n; });
      drawHome();
    });
  }

  /* 이 구분으로 실제 출제 가능한 문항 수를 미리 계산한다 */
  function planFor(track, per) {
    var t = TRACKS.filter(function (x) { return x.v === track; })[0];
    if (!t) return { total: 0, rows: [] };
    var subs = t.subs.split(' · ');
    var rows = subs.map(function (name) {
      var have = counts[name] || 0;
      return { name: name, have: have, take: Math.min(have, per) };
    });
    return { total: rows.reduce(function (a, b) { return a + b.take; }, 0), rows: rows };
  }

  /* ---------- 첫 화면 ---------- */
  function drawHome() {
    var done = attempts.filter(function (a) { return a.submitted_at; });

    var h = '<div class="notice-banner">' +
      '「시화산노회 고시부 목사장로 고시가이드」의 과목별 예상 문제로 실제 고시처럼 풀어 보고 ' +
      '바로 채점받으실 수 있습니다. <strong>횟수 제한 없이</strong> 몇 번이든 보실 수 있습니다.</div>';

    h += '<h2>시험 보기</h2>' +
      '<div class="admin-card" style="max-width:680px">' +
      '<p style="font-size:0.88rem;color:var(--gray-7)">응시하실 구분을 고르시면 ' +
      '과목마다 문제를 무작위로 뽑아 출제합니다. ' +
      '도중에 나가셨다가 다시 들어오시면 보던 시험을 이어서 보실 수 있습니다.</p>' +
      '<div class="inline-form">' +
      '<div class="field"><label>구분</label><select id="ex-track">' +
      TRACKS.map(function (t) {
        return '<option value="' + e(t.v) + '">' + e(t.v) + ' — ' + e(t.subs) + '</option>';
      }).join('') + '</select></div>' +
      '<div class="field" style="flex:0 0 190px"><label>과목당 문항 수</label>' +
      '<select id="ex-count">' +
      [5, 10, 15, 20, 25, 30].map(function (n) {
        return '<option value="' + n + '"' + (n === 10 ? ' selected' : '') + '>' + n + '문항</option>';
      }).join('') + '</select></div>' +
      '<button class="btn" id="ex-start">시험 시작</button>' +
      '</div>' +
      '<div id="ex-plan" style="margin-top:12px"></div>' +
      '<div class="form-msg" id="ex-smsg"></div></div>';

    h += subjectTable();

    if (done.length) {
      h += '<h2>지난 응시 결과 (' + done.length + '회)</h2><table class="tbl"><thead><tr>' +
        '<th style="width:110px">구분</th><th style="width:170px">응시일</th>' +
        '<th style="width:120px">점수</th><th>백분율</th></tr></thead><tbody>';
      done.slice(0, 20).forEach(function (a) {
        var pct = a.total ? Math.round(a.score * 100 / a.total) : 0;
        h += '<tr><td>' + e(a.track) + '</td>' +
          '<td>' + e(String(a.submitted_at).replace('T', ' ').slice(0, 16)) + '</td>' +
          '<td>' + a.score + ' / ' + a.total + '</td>' +
          '<td class="left"><span class="' + (pct >= 60 ? 'pass' : 'fail') + '">' + pct + '점' +
          (pct >= 60 ? ' (합격 기준 이상)' : ' (합격 기준 미만)') + '</span></td></tr>';
      });
      h += '</tbody></table>';
    }

    area.innerHTML = h;

    /* 고른 구분·문항 수로 실제 몇 문항이 나오는지 미리 보여준다 */
    function showPlan() {
      var box = document.getElementById('ex-plan');
      var track = document.getElementById('ex-track').value;
      var per = parseInt(document.getElementById('ex-count').value, 10) || 10;
      var plan = planFor(track, per);
      var short = plan.rows.filter(function (r) { return r.take < per; });

      var t = '<table class="tbl" style="margin:0"><thead><tr>' +
        '<th style="width:130px">과목</th><th style="width:130px">등록된 문제</th>' +
        '<th>이번에 출제</th></tr></thead><tbody>' +
        plan.rows.map(function (r) {
          return '<tr><td>' + e(r.name) + '</td>' +
            '<td>' + r.have + '문항</td>' +
            '<td class="left">' + (r.take ? r.take + '문항' :
              '<span class="fail">문제가 없어 출제되지 않습니다</span>') + '</td></tr>';
        }).join('') +
        '<tr><th>합계</th><th></th><th class="left">' + plan.total + '문항</th></tr>' +
        '</tbody></table>';

      if (short.length) {
        t += '<p style="font-size:0.84rem;color:var(--red)">' +
          '문제가 부족한 과목이 있어 고르신 수보다 적게 출제됩니다. ' +
          '고시부에서 <strong>supabase/exam-questions/</strong> 폴더의 과목 파일을 모두 등록하시면 ' +
          '전 과목이 정상 출제됩니다.</p>';
      }
      box.innerHTML = t;
      document.getElementById('ex-start').disabled = plan.total === 0;
    }

    document.getElementById('ex-track').addEventListener('change', showPlan);
    document.getElementById('ex-count').addEventListener('change', showPlan);
    showPlan();

    document.getElementById('ex-start').addEventListener('click', function () {
      var msg = document.getElementById('ex-smsg');
      var track = document.getElementById('ex-track').value;
      msg.className = 'form-msg'; msg.textContent = '문제를 준비하는 중입니다...';
      db().then(function (c) {
        return c.rpc('start_exam', {
          p_track: track,
          p_per_subject: parseInt(document.getElementById('ex-count').value, 10) || 10
        });
      }).then(function (r) {
        if (r.error) { msg.className = 'form-msg err'; msg.textContent = r.error.message; return; }
        if (!r.data || !r.data.length) {
          msg.className = 'form-msg err';
          msg.textContent = '출제할 문제가 없습니다. 고시부에 문의해 주세요.';
          return;
        }
        SHS.logAction('create', '모의고사 응시 시작', track);
        go('exam', function () { runExam(r.data); });
      });
    });
  }

  /* ---------- 시험 진행 ---------- */
  function runExam(rows) {
    var attemptId = rows[0].attempt_id;
    var picked = new Array(rows.length);

    var h = '<div class="notice-banner"><strong>' + e(SHS.honorific(user)) + '</strong>, 모의고사를 시작합니다. ' +
      '전체 <strong>' + rows.length + '문항</strong>입니다. 답을 고르신 뒤 맨 아래 <strong>제출하고 채점받기</strong>를 눌러 주세요.</div>' +
      '<div class="exam-progress"><span id="ex-prog">0 / ' + rows.length + ' 문항 선택</span></div>';

    var lastSubject = null;
    rows.forEach(function (q, i) {
      if (q.subject !== lastSubject) {
        lastSubject = q.subject;
        h += '<h2 class="exam-subject">' + e(q.subject) + '</h2>';
      }
      h += '<div class="exam-q" id="q' + i + '">' +
        '<div class="q-text"><span class="q-no">' + (i + 1) + '</span>' + e(q.question) + '</div>' +
        '<div class="q-opts">' +
        (q.options || []).map(function (o, k) {
          return '<label><input type="radio" name="q' + i + '" value="' + k + '">' +
            '<span>' + (k + 1) + '. ' + e(o) + '</span></label>';
        }).join('') + '</div></div>';
    });
    h += '<div class="exam-submit">' +
      '<button class="btn" id="ex-send">제출하고 채점받기</button>' +
      '<div class="form-msg" id="ex-emsg"></div></div>';

    area.innerHTML = h;
    window.scrollTo(0, 0);

    area.querySelectorAll('input[type="radio"]').forEach(function (r) {
      r.addEventListener('change', function () {
        picked[+r.name.slice(1)] = +r.value;
        var n = picked.filter(function (x) { return x !== undefined; }).length;
        document.getElementById('ex-prog').textContent = n + ' / ' + rows.length + ' 문항 선택';
        var card = r.closest('.exam-q');
        if (card) card.classList.add('answered');
      });
    });

    document.getElementById('ex-send').addEventListener('click', function () {
      var msg = document.getElementById('ex-emsg');
      var blank = [];
      for (var i = 0; i < rows.length; i++) if (picked[i] === undefined) blank.push(i + 1);
      if (blank.length) {
        if (!confirm(blank.length + '문항이 비어 있습니다. (' + blank.slice(0, 8).join(', ') +
                     (blank.length > 8 ? ' 외' : '') + '번)\n비운 문항은 오답으로 처리됩니다. 제출하시겠습니까?')) {
          var first = document.getElementById('q' + (blank[0] - 1));
          if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
          return;
        }
      }
      var ans = [];
      for (var k = 0; k < rows.length; k++) ans.push(picked[k] === undefined ? -1 : picked[k]);

      msg.className = 'form-msg'; msg.textContent = '채점하는 중입니다...';
      db().then(function (c) {
        return c.rpc('submit_exam', { p_attempt: attemptId, p_answers: ans });
      }).then(function (r) {
        if (r.error) { msg.className = 'form-msg err'; msg.textContent = r.error.message; return; }
        SHS.logAction('create', '모의고사 제출', '응시 ' + attemptId);
        go('result', function () { showResult(r.data || []); });
      });
    });
  }

  /* ---------- 채점 결과 ---------- */
  function showResult(rows) {
    if (!rows.length) { load(); return; }
    var score = rows[0].score, total = rows[0].total || rows.length;
    var pct = total ? Math.round(score * 100 / total) : 0;

    var bySub = {};
    rows.forEach(function (r) {
      var s = bySub[r.subject] || (bySub[r.subject] = { n: 0, ok: 0 });
      s.n++;
      if (r.chosen === r.correct) s.ok++;
    });

    var h = '<div class="exam-score ' + (pct >= 60 ? 'pass' : 'fail') + '">' +
      '<div class="s-num">' + pct + '<span>점</span></div>' +
      '<div class="s-detail">' + total + '문항 중 <strong>' + score + '문항</strong> 정답' +
      '<div class="s-note">' + (pct >= 60 ? '실제 고시 합격 기준(평균 60점)을 넘었습니다.'
                                          : '실제 고시 합격 기준은 평균 60점입니다. 조금 더 준비해 보십시오.') +
      '</div></div></div>';

    h += '<h2>과목별 결과</h2><table class="tbl" style="max-width:640px"><thead><tr>' +
      '<th style="width:150px">과목</th><th style="width:120px">정답</th><th>점수</th></tr></thead><tbody>';
    Object.keys(bySub).forEach(function (k) {
      var s = bySub[k];
      var p = Math.round(s.ok * 100 / s.n);
      h += '<tr><td>' + e(k) + '</td><td>' + s.ok + ' / ' + s.n + '</td>' +
        '<td class="left"><span class="' + (p >= 60 ? 'pass' : 'fail') + '">' + p + '점</span></td></tr>';
    });
    h += '</tbody></table>';

    var wrong = rows.filter(function (r) { return r.chosen !== r.correct; });
    h += '<h2>틀린 문항 다시 보기 (' + wrong.length + '문항)</h2>';
    if (!wrong.length) {
      h += '<p style="color:var(--gray-5)">틀린 문항이 없습니다.</p>';
    } else {
      wrong.forEach(function (r, i) {
        h += '<div class="exam-q review">' +
          '<div class="q-text"><span class="q-no">' + (i + 1) + '</span>' +
          '<span class="q-sub">' + e(r.subject) + '</span>' + e(r.question) + '</div>' +
          '<div class="q-opts">' +
          (r.options || []).map(function (o, k) {
            var cls = k === r.correct ? ' right' : (k === r.chosen ? ' mine' : '');
            var tag = k === r.correct ? ' <em>정답</em>' : (k === r.chosen ? ' <em>내 답</em>' : '');
            return '<div class="q-opt' + cls + '">' + (k + 1) + '. ' + e(o) + tag + '</div>';
          }).join('') +
          (r.chosen === -1 ? '<div class="q-opt mine">답을 고르지 않았습니다.</div>' : '') +
          '</div></div>';
      });
    }
    h += '<p style="margin-top:24px"><button class="btn" id="ex-again">모의고사 첫 화면으로</button></p>';

    area.innerHTML = h;
    window.scrollTo(0, 0);
    document.getElementById('ex-again').addEventListener('click', function () {
      go('home', function () { load(); });
    });
  }

  /* 시험 화면에서 나가려 할 때 실수로 잃지 않도록 확인한다 */
  window.addEventListener('beforeunload', function (ev) {
    if (document.getElementById('ex-send')) {
      ev.preventDefault();
      ev.returnValue = '';
    }
  });

  load();
 });
});
</script>
</body>
</html>
