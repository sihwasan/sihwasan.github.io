<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회의록 작성 매니저 - 시화산노회</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/style.css?v=20260901b">
<style>
/* 단계 안내 */
.mw-steps { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 16px; }
.mw-steps button { border:1px solid var(--gray-3,#d8dbe2); background:#fff; border-radius:20px;
  padding:7px 16px; font-size:0.86rem; color:var(--gray-6); cursor:pointer; font-family:inherit; }
.mw-steps button.on { background:var(--navy,#4b3f33); border-color:var(--navy,#4b3f33); color:#fff; }
/* 회의록 미리보기 · 인쇄 — 총회 표준 회의록 작성 및 보존 규정 제6조
 *   용지 A4 · 여백 좌우 각 30mm, 위아래 각 20mm, 머리말·꼬리말(쪽번호) 10mm
 *   글체 신명조 12호 · 자간 -4 · 줄간격 160% · 쪽번호 삽입
 *   제목은 굵게, 큰제목으로 갈수록 크게 (별지1 서식) */
.mw-paper { background:#fff; border:1px solid var(--gray-2,#e8eaef); border-radius:8px;
  padding:20mm 30mm; margin:0; color:#000;
  font-family:'HY신명조', 'HYSinMyeongJo-Medium', '신명조', '휴먼명조', 'Batang', '바탕',
    'Noto Serif KR', serif;
  font-size:12pt; line-height:1.6; letter-spacing:-0.02em; word-break:keep-all; }
.mw-paper p { margin:0; }
/* 표지 — 본 노회 관행 (제15~18회 회의록) */
.mw-cover { display:flex; flex-direction:column; align-items:center; text-align:center;
  min-height:170mm; margin-bottom:12mm; border-bottom:1px solid var(--gray-2,#e8eaef);
  padding-bottom:8mm; }
.mw-cover .cv-org { font-size:25pt; font-weight:700; letter-spacing:2px; margin-top:6mm; }
.mw-cover .cv-title { font-size:23pt; font-weight:700; letter-spacing:4px; margin:14mm 0 20mm; }
.mw-cover .cv-meta p { font-size:12pt; font-weight:700; line-height:2; }
.mw-cover .cv-bottom { margin-top:auto; font-size:27pt; letter-spacing:3px; padding-top:16mm; }
/* 상단 중앙 회의명 · 제N일 (별지1) */
.mw-inner { text-align:center; margin:0 0 8mm; }
.mw-inner .in-org { font-size:20pt; font-weight:700; letter-spacing:2px; }
.mw-inner .in-title { font-size:15pt; font-weight:700; margin-top:2mm; }
.mw-inner .in-day { font-size:13pt; margin-top:6mm; }
/* 본문 */
.mw-paper h3 { font-size:14pt; font-weight:700; margin:8mm 0 3mm; font-family:inherit; }
.mw-paper .mw-num { font-size:13pt; font-weight:700; margin-top:5mm; }
.mw-paper .mw-ind { padding-left:12pt; }
.mw-paper .mw-quote { padding-left:12pt; }
/* 서명 — 날짜 가운데, 이름 오른쪽 (별지1) */
.mw-paper .mw-sign { margin-top:12mm; line-height:2.2; }
.mw-paper .mw-sign .d, .mw-paper .mw-sign .o { text-align:center; }
.mw-paper .mw-sign .d { margin-bottom:4mm; }
.mw-paper .mw-sign .nm { text-align:right; padding-right:10mm; }
@media print {
  @page {
    size:A4 portrait;
    margin:20mm 30mm;             /* 좌우 30mm · 위아래 20mm */
    @bottom-center { content: counter(page); font-size:10pt; }   /* 쪽번호 (꼬리말 10mm 자리) */
  }
  body > *:not(#mw-print) { display:none !important; }
  #mw-print { display:block !important; }
  #mw-print .mw-paper { border:none; border-radius:0; padding:0; }
  #mw-print .mw-cover { border-bottom:none; min-height:240mm; margin:0; padding:0;
    page-break-after:always; }
  #mw-print .mw-num, #mw-print h3 { page-break-after:avoid; }
  #mw-print .mw-sign { page-break-inside:avoid; }
}
#mw-print { display:none; }
</style>
</head>
<body>

<div class="page-head">
  <div class="container">
    <h1>회의록 작성 매니저</h1>
    <div class="crumb">홈 &gt; 임원방 &gt; 회의록 작성</div>
  </div>
</div>

<main class="page-body container" id="main">
  <div id="mw-area"><p style="color:var(--gray-5)">권한을 확인하는 중...</p></div>
</main>
<div id="mw-print"></div>

<script src="js/data.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-auth.js"></script>

<script src="js/minutes-doc.js?v=20260902b"></script>
<script src="js/minutes-write.js?v=20260902c"></script>
</body>
</html>
