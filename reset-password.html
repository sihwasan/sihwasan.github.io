<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 재설정 - 시화산노회</title>
<link rel="stylesheet" href="css/style.css?v=20260831j">
</head>
<body>

<div class="page-head">
  <div class="container">
    <h1>비밀번호 재설정</h1>
    <div class="crumb">홈 &gt; 비밀번호 재설정</div>
  </div>
</div>

<main class="page-body container" id="main">
  <div id="rp-area">
    <p style="text-align:center;color:var(--gray-5)">확인 중입니다...</p>
  </div>
</main>

<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-auth.js"></script>
<script src="js/main.js?v=20260830d"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var area = document.getElementById('rp-area');
  var e = SHS.esc;

  if (!SHSCloud.enabled()) {
    area.innerHTML = '<div class="notice-banner">로그인 서버 설정이 완료되지 않았습니다.</div>';
    return;
  }

  function showForm(email) {
    area.innerHTML =
      '<div class="form-card">' +
      '<h2>새 비밀번호 설정</h2>' +
      (email ? '<p style="text-align:center;color:var(--gray-5);font-size:0.88rem;margin-bottom:18px">' +
               e(email) + '</p>' : '') +
      '<div class="field"><label>새 비밀번호 (6자 이상)</label>' +
      '<input type="password" id="rp-pw" autocomplete="new-password"></div>' +
      '<div class="field"><label>새 비밀번호 확인</label>' +
      '<input type="password" id="rp-pw2" autocomplete="new-password"></div>' +
      '<button class="btn" id="rp-go" style="width:100%">비밀번호 변경</button>' +
      '<div class="form-msg" id="rp-msg"></div>' +
      '</div>';

    function submit() {
      var msg = document.getElementById('rp-msg');
      var p1 = document.getElementById('rp-pw').value;
      var p2 = document.getElementById('rp-pw2').value;
      if (p1.length < 6) {
        msg.className = 'form-msg err';
        msg.textContent = '비밀번호는 6자 이상으로 입력해 주세요.';
        return;
      }
      if (p1 !== p2) {
        msg.className = 'form-msg err';
        msg.textContent = '새 비밀번호가 서로 일치하지 않습니다.';
        return;
      }
      msg.className = 'form-msg';
      msg.textContent = '변경 중입니다...';
      SHSCloud.init().then(function (c) {
        return c.auth.updateUser({ password: p1 });
      }).then(function (r) {
        if (r.error) {
          msg.className = 'form-msg err';
          msg.textContent = r.error.message;
          return;
        }
        SHSCloud.log('update', '비밀번호 재설정', email || '');
        alert('비밀번호가 변경되었습니다. 새 비밀번호로 이용해 주세요.');
        location.href = 'index.html';
      });
    }
    document.getElementById('rp-go').addEventListener('click', submit);
    document.getElementById('rp-pw2').addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') submit();
    });
  }

  /* 메일의 재설정 링크로 들어오면 임시 세션이 만들어진다.
   * 그 세션이 확인되면 새 비밀번호를 입력받는다. */
  SHSCloud.init().then(function (c) {
    if (!c) {
      area.innerHTML = '<div class="notice-banner">서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.</div>';
      return;
    }
    /* 주소에 남은 인증 정보를 정리한다 */
    function clean() {
      if (location.hash) history.replaceState(null, '', location.pathname);
    }
    return c.auth.getUser().then(function (r) {
      var u = r && r.data && r.data.user;
      clean();
      if (u) { showForm(u.email); return; }
      /* 세션이 아직 준비되지 않았을 수 있으므로 한 번 더 기다린다 */
      setTimeout(function () {
        c.auth.getUser().then(function (r2) {
          var u2 = r2 && r2.data && r2.data.user;
          if (u2) { showForm(u2.email); return; }
          area.innerHTML =
            '<div class="notice-banner">비밀번호 재설정 링크가 확인되지 않았습니다. ' +
            '링크는 발송 후 일정 시간이 지나면 만료됩니다.<br><br>' +
            '아래에서 재설정 메일을 다시 받으실 수 있습니다.</div>' +
            '<div class="form-card"><h2>재설정 메일 다시 받기</h2>' +
            '<div class="field"><label>가입하신 이메일</label>' +
            '<input type="email" id="rp-email" placeholder="hong@naver.com"></div>' +
            '<button class="btn" id="rp-send" style="width:100%">재설정 메일 보내기</button>' +
            '<div class="form-msg" id="rp-smsg"></div></div>';
          document.getElementById('rp-send').addEventListener('click', function () {
            var m = document.getElementById('rp-smsg');
            var em = document.getElementById('rp-email').value.trim().toLowerCase();
            if (!em) { m.className = 'form-msg err'; m.textContent = '이메일을 입력해 주세요.'; return; }
            m.className = 'form-msg';
            m.textContent = '보내는 중입니다...';
            c.auth.resetPasswordForEmail(em, {
              redirectTo: location.origin + location.pathname.replace(/[^/]*$/, '') + 'reset-password.html'
            }).then(function (rr) {
              if (rr.error) {
                var em2 = rr.error.message || '';
                m.className = 'form-msg err';
                m.textContent = em2.indexOf('rate limit') !== -1
                  ? '메일 발송 한도를 넘었습니다. 한 시간쯤 뒤에 다시 시도하시거나, 노회 사무실(031-486-9993)로 문의해 주세요.'
                  : em2;
                return;
              }
              m.className = 'form-msg ok';
              m.textContent = '재설정 메일을 보냈습니다. 메일함에서 링크를 눌러 주세요.';
            });
          });
        });
      }, 1200);
    });
  });
});
</script>
</body>
</html>
