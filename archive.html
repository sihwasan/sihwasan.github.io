<meta property="og:description" content="시화산노회 자료실 — 노회 회의결의, 구비서류 안내, 각종 자료를 제공합니다.">

<body>

<div class="page-head">
  <div class="container">
    <h1>자료실</h1>
    <div class="crumb">홈 &gt; 자료실</div>
  </div>
</div>

<main class="page-body container" id="main">
  <div id="ar-area"><p style="color:var(--gray-5)">자료를 불러오는 중...</p></div>
</main>

<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/forms-guide.js"></script>
<script src="private/resolutions.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-auth.js"></script>
<script src="js/photos-config.js"></script>
<script src="js/photos.js"></script>
<script src="js/main.js?v=20260831c"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
 SHS.getUser().then(function (user) {
  var area = document.getElementById('ar-area');
  var e = SHS.esc;

  var isMember = SHS.isActiveMember(user);
  var isOfficer = SHSAuth.isOfficer(user);
  var canManage = user && SHSAuth.canManageMembers(user);

  /* 분류. 순서대로 위쪽 띠에 나타난다. */
  var SECTIONS = [
    { key: '서식', label: '청원서 작성',
      desc: '노회에 올리는 각종 청원 서식을 홈페이지에서 바로 작성해 인쇄·저장할 수 있습니다.' },
    { key: '고시',     desc: '목사·장로·전도사·목사후보생 고시 모의고사입니다.' },
    { key: '회의자료', desc: '정기노회 회의순서(노회 책자)와 각 부 보고서 등 회의에 쓰인 자료입니다.' },
    { key: '결의사항', desc: '정기노회와 임원회에서 결의한 내용입니다.' },
    { key: '규칙',     desc: '노회규칙 전문입니다.' },
    { key: '내규',     desc: '각 위원회와 부서의 내규입니다.' },
    { key: '회의록',   desc: '역대 정기노회·임시노회의 회의록입니다. 결의서는 결의사항에 있습니다.' },
    { key: '임원회의록', desc: '임원회 회의록입니다.' },
    { key: '발송 공문', desc: '노회와 각 부서가 보낸 공문입니다.' },
    { key: '접수 공문', desc: '노회가 받은 공문입니다. 시찰회·연합회·총회에서 온 문서를 여기에 모읍니다.' },
    { key: '회계',     desc: '노회 예산·결산·상회비·감사 자료와 지출결의서입니다.' },
    { key: '증명서 발급대장', desc: '발급한 증명서 원본과 발급 대장입니다. 개인정보가 들어 있어 관리자만 볼 수 있습니다.' },
    { key: '대외비 문서', desc: '노회 밖으로 내보내지 않는 문서입니다. 관리자만 볼 수 있습니다.' }
  ];

  /* 열람 등급 이름과 엄한 정도 (숫자가 클수록 좁다) */
  var LEVEL_NAME = {
    member: '정회원(노회 소속 목사·총대 장로)',
    officer: '노회 임원',
    admin: '노회 관리자(노회장·서기·간사)'
  };
  var LEVEL_RANK = { public: 0, member: 1, officer: 2, admin: 3 };

  /* 이 분류의 자료를 누가 볼 수 있는지 한 줄로 알려 준다.
   * 자료마다 등급이 다르면 가장 좁은 등급을 기준으로 적는다. */
  function levelNote(list) {
    if (!list.length) return '';
    var top = null, all = true;
    list.forEach(function (a) {
      var lv = a.access || 'public';
      if (lv === 'public') { all = false; return; }
      if (!top || LEVEL_RANK[lv] > LEVEL_RANK[top]) top = lv;
    });
    if (!top) return '';
    list.forEach(function (a) { if ((a.access || 'public') !== top) all = false; });
    return '<p class="sec-level">' +
      (all ? '이 분류의 자료는 <strong>' + LEVEL_NAME[top] + '</strong>만 열람할 수 있습니다.'
           : '이 분류에는 <strong>' + LEVEL_NAME[top] + '</strong>만 열람할 수 있는 자료가 있습니다.') +
      '</p>';
  }

  function accessLabel(a) {
    if (a === 'admin') return '관리자';
    if (a === 'officer') return '임원';
    if (a === 'member') return '정회원';
    return '';
  }
  function canOpen(a) {
    if (a === 'admin') return canManage;
    if (a === 'officer') return isOfficer;
    if (a === 'member') return isMember;
    return true;
  }

  function itemRows(list, key) {
    if (!list.length) return '<p style="color:var(--gray-5)">등록된 자료가 없습니다.</p>';
    var h = '';
    if (list.length > 12 && key) {
      h += '<div class="board-controls" style="margin-bottom:12px">' +
        '<span style="color:var(--gray-7);font-size:0.88rem">전체 ' + list.length + '건</span>' +
        '<input type="text" data-arq="' + e(key) + '" placeholder="제목 검색"></div>';
    }
    h += '<table class="tbl" data-artable="' + e(key || '') + '">' +
      '<thead><tr><th style="width:70px">번호</th><th>제목</th>' +
      '<th style="width:110px">등록일</th><th style="width:110px">열람</th></tr></thead><tbody>';
    list.forEach(function (a, i) {
      var ok = canOpen(a.access);
      var badge = accessLabel(a.access)
        ? ' <span class="badge-locked">' + accessLabel(a.access) + '</span>' : '';
      var title = (ok && a.link_url)
        ? '<a href="' + e(a.link_url) + '" style="color:var(--navy);text-decoration:underline">' + e(a.title) + '</a>'
        : e(a.title);
      var status;
      if (ok) {
        if (a.file_path) status = '<button class="btn ghost sm" data-arfile="' + a.id + '">내려받기</button>';
        else if (a.link_url) status = '<a href="' + e(a.link_url) + '" style="color:var(--navy);text-decoration:underline">바로가기</a>';
        else status = accessLabel(a.access) ? '열람 가능' : '공개';
      } else {
        status = user ? '권한 없음'
                      : '<a href="login.html" style="color:var(--navy);text-decoration:underline">로그인</a>';
      }
      var note = ok ? e(a.description || '')
                    : (a.access === 'admin' ? '노회 서기·간사 등 관리자만 열람할 수 있습니다.'
                    : (a.access === 'officer' ? '노회 임원만 열람할 수 있습니다.'
                                              : '정회원 로그인 후 열람할 수 있습니다.'));
      h += '<tr data-arname="' + e((a.title || '') + ' ' + (a.description || '')) + '"><td>' + (list.length - i) + '</td>' +
        '<td class="left">' + title + badge +
        '<div style="font-size:0.82rem;color:var(--gray-5);margin-top:2px">' + note + '</div></td>' +
        '<td>' + e(a.doc_date || '') + '</td><td>' + status + '</td></tr>';
    });
    return h + '</tbody></table>';
  }

  /* ---------- 구비서류 안내 (말풍선 설명) ---------- */
  function formsHtml() {
    var h = '<h2 id="sec-구비서류-안내">구비서류 안내</h2>' +
      '<p>노회에 청원할 때에는 노회규칙 제36조에 따라 규정된 서식대로 <strong>당회장이 시찰회에 제출하여 진단받은 후</strong> ' +
      '노회 서기에게 접수하여야 합니다.</p>' +
      '<p style="font-size:0.86rem;color:var(--gray-5)">청원 이름을 <strong>누르시면</strong> ' +
      '그 청원이 무엇인지, 어떤 서류를 준비하고 어떤 서식을 작성하면 되는지 안내가 펼쳐집니다.</p>' +
      '<table class="tbl"><thead><tr><th style="width:230px">청원 구분</th><th>구비서류</th></tr></thead><tbody>';
    SHSForms.list.forEach(function (f, i) {
      h += '<tr class="fx-row" data-fx="' + i + '" style="cursor:pointer"><td class="left">' +
        '<span class="hint-word" data-form="' + i + '" tabindex="0">' + e(f.name) + '</span>' +
        '</td><td class="left">' + e(f.papers) + '</td></tr>';
      /* 눌렀을 때 펼쳐지는 작성 안내 */
      var papers = String(f.papers || '').split(/, ?/).filter(Boolean);
      h += '<tr class="fx-detail" data-fxd="' + i + '" hidden><td colspan="2" class="left" ' +
        'style="background:var(--gray-1);padding:16px 20px">' +
        '<p style="margin:0 0 6px"><strong>무엇인가</strong> — ' + f.what + '</p>' +
        '<p style="margin:0 0 12px"><strong>언제 하나</strong> — ' + f.when + '</p>' +
        '<p style="margin:0 0 6px"><strong>준비할 서류</strong></p>' +
        '<ul style="list-style:none;margin:0 0 14px;padding:0">' +
        papers.map(function (x) {
          return '<li style="margin:3px 0">&#10003; ' + e(x) + '</li>';
        }).join('') + '</ul>' +
        (f.forms && f.forms.length
          ? '<p style="margin:0 0 8px"><strong>서식 작성·출력</strong> — 버튼을 누르면 이 자리에서 ' +
            '바로 서식이 열립니다. 내용을 채워 인쇄하거나 PDF로 저장하세요.</p>' +
            f.forms.map(function (x) {
              return '<button type="button" class="btn sm" style="margin:0 6px 6px 0" data-fxopen="' +
                e(x.f) + '">' + e(x.t) + '</button>';
            }).join('') +
            ' <a href="petition.html?form=' + encodeURIComponent(f.forms[0].f) + '" ' +
            'style="font-size:0.82rem;color:var(--gray-5);text-decoration:underline">새 창으로 크게 보기</a>' +
            '<div class="fx-embed" style="margin-top:12px"></div>'
          : '') +
        '</td></tr>';
    });
    return h + '</tbody></table><div id="ar-tip" class="hint-bubble" hidden></div>';
  }

  function bindForms() {
    var tip = document.getElementById('ar-tip');
    if (!tip) return;

    function show(el) {
      var f = SHSForms.list[+el.dataset.form];
      if (!f) return;
      tip.innerHTML = '<strong>' + e(f.name) + '</strong>' +
        '<p><span class="hint-tag">무엇인가</span>' + f.what + '</p>' +
        '<p><span class="hint-tag">언제 하나</span>' + f.when + '</p>';
      tip.hidden = false;
      var r = el.getBoundingClientRect();
      var top = r.bottom + window.scrollY + 6;
      var left = r.left + window.scrollX;
      tip.style.top = top + 'px';
      /* 화면 밖으로 넘어가지 않도록 왼쪽으로 당긴다 */
      tip.style.left = Math.max(8, Math.min(left, window.innerWidth - tip.offsetWidth - 16)) + 'px';
    }
    function hide() { tip.hidden = true; }

    area.querySelectorAll('.hint-word').forEach(function (el) {
      el.addEventListener('mouseenter', function () { show(el); });
      el.addEventListener('mouseleave', hide);
      el.addEventListener('focus', function () { show(el); });
      el.addEventListener('blur', hide);
    });
    window.addEventListener('scroll', hide, { passive: true });

    /* 청원 줄을 누르면 작성 안내가 펼쳐진다 */
    area.querySelectorAll('.fx-row').forEach(function (tr) {
      tr.addEventListener('click', function () {
        hide();
        var d = area.querySelector('.fx-detail[data-fxd="' + tr.dataset.fx + '"]');
        if (!d) return;
        var open = d.hidden;
        area.querySelectorAll('.fx-detail').forEach(function (x) { x.hidden = true; });
        d.hidden = !open;
      });
    });

    /* 서식 버튼을 누르면 그 자리 박스 안에 청원서 작성 화면이 열린다 */
    area.querySelectorAll('button[data-fxopen]').forEach(function (b) {
      b.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var slot = b.closest('td').querySelector('.fx-embed');
        if (!slot) return;
        var url = 'petition.html?embed=1&form=' + encodeURIComponent(b.dataset.fxopen);
        var cur = slot.querySelector('iframe');
        if (cur && cur.dataset.form === b.dataset.fxopen) {
          slot.innerHTML = '';                       /* 같은 버튼을 다시 누르면 닫는다 */
          return;
        }
        slot.innerHTML = '<iframe src="' + url + '" data-form="' + e(b.dataset.fxopen) + '" ' +
          'style="width:100%;height:1600px;border:1px solid var(--gray-2);border-radius:10px;background:#fff" ' +
          'title="청원서 작성"></iframe>';
        slot.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    });
  }

  /* ---------- 고시 모의고사 안내 ---------- */
  function examHtml() {
    return '<div class="admin-card" style="max-width:720px;margin-top:16px">' +
      '<h3 style="margin-top:0">고시 모의고사</h3>' +
      '<p style="font-size:0.9rem;color:var(--gray-7)">고시집의 과목별 예상 문제로 실제 고시처럼 풀어 보고 ' +
      '바로 채점받으실 수 있습니다. 로그인만 하시면 <strong>횟수 제한 없이</strong> 자유롭게 보실 수 있습니다.</p>' +
      '<table class="tbl" style="max-width:640px"><thead><tr><th style="width:130px">구분</th><th>필기 과목</th></tr></thead><tbody>' +
      '<tr><td>목사</td><td class="left">목회학 · 권징조례 · 신조 · 예배모범</td></tr>' +
      '<tr><td>장로</td><td class="left">성경 · 정치 · 권징조례 · 신조 · 상식 · 소요리</td></tr>' +
      '<tr><td>전도사</td><td class="left">성경 · 상식 · 영어</td></tr>' +
      '<tr><td>목사후보생</td><td class="left">성경 · 상식 · 영어</td></tr>' +
      '</tbody></table>' +
      '<p style="font-size:0.84rem;color:var(--gray-5)">노회규칙 제7장 22~23조에 따른 배정입니다. ' +
      '면접은 필기가 아니므로 모의고사에서 제외했으며, 성경은 성경통신 신구약 수료증으로 대체할 수 있습니다. ' +
      '(모의고사에서 성경을 빼고 볼 수도 있습니다)</p>' +
      '<a class="btn" href="exam.html">모의고사 보러 가기</a></div>';
  }

  /* ---------- 노회 회의결의 ---------- */
  function resolutionsHtml(rows) {
    if (!isMember) {
      return '<h2>결의사항</h2>' +
        '<div class="notice-banner">노회 회의결의는 <strong>정회원 전용</strong> 자료입니다. ' +
        (user ? '현재 승인대기 상태입니다. 서기·간사의 확인 후 열람할 수 있습니다.'
              : '노회 소속 목사와 총대 장로께서는 로그인 후 열람하시기 바랍니다. ' +
                '<a class="btn sm" style="margin-left:10px" href="login.html">로그인</a>') +
        '</div>';
    }
    var h = '<h2>결의사항</h2>' +
      '<p style="color:var(--gray-5);font-size:0.88rem">회기를 누르시면 그 회기의 결의 내용이 펼쳐집니다.</p>' +
      '<div class="board-controls" style="margin-bottom:14px">' +
      '<span style="color:var(--gray-7);font-size:0.88rem">전체 ' + rows.length + '건</span>' +
      '<input type="text" id="rs-q" placeholder="회기·내용 검색"></div>' +
      '<div id="rs-list"></div>';
    return h;
  }

  function drawResolutions(rows) {
    var box = document.getElementById('rs-list');
    if (!box) return;
    var q = (document.getElementById('rs-q').value || '').trim();
    var list = rows.filter(function (r) {
      if (!q) return true;
      return ((r.session || '') + (r.president || '') + (r.place || '') + (r.items || '')).indexOf(q) !== -1;
    });
    if (!list.length) {
      box.innerHTML = '<p style="color:var(--gray-5)">해당하는 결의가 없습니다.</p>';
      return;
    }
    box.innerHTML = list.map(function (r, i) {
      var items = String(r.items || '').split('\n')
        .map(function (x) { return x.trim(); }).filter(function (x) { return x; });
      return '<div class="res-row">' +
        '<button class="res-head" data-res="' + i + '">' +
        '<span class="res-title">' + e(r.session) + '</span>' +
        '<span class="res-meta">' +
        (r.year ? '<span><strong>연도</strong> ' + e(r.year) + '</span>' : '') +
        (r.president ? '<span><strong>노회장</strong> ' + e(r.president) + '</span>' : '') +
        (r.place ? '<span><strong>장소</strong> ' + e(r.place) + '</span>' : '') +
        '</span></button>' +
        '<div class="res-body" hidden><ol style="list-style:none">' +
        items.map(function (it, k) { return '<li>' + (k + 1) + '. ' + e(it) + '</li>'; }).join('') +
        '</ol></div></div>';
    }).join('');

    box.querySelectorAll('.res-head').forEach(function (b) {
      b.addEventListener('click', function () {
        var body = b.nextElementSibling;
        body.hidden = !body.hidden;
        b.classList.toggle('open', !body.hidden);
      });
    });
  }

  /* ---------- 화면 그리기 ---------- */
  function draw(items, resolutions) {
    var html = '<div class="notice-banner">자료실의 일부 자료는 <strong>정회원(노회 소속 목사·총대 장로)</strong> ' +
      '로그인 후 열람할 수 있습니다. 회의록·결의서·공문·회계 등 <strong>임원 전용 자료</strong>는 ' +
      '<a href="officer.html"><strong>임원방 → 임원 자료실</strong></a>에 있습니다.' +
      (canManage ? ' <a class="btn sm" style="margin-left:10px" href="archive-edit.html">자료 관리</a>' : '') +
      '</div>';

    /* 구비서류 안내를 맨 앞에 둔다 */
    html += formsHtml();

    SECTIONS.forEach(function (s) {
      var list = items.filter(function (a) { return a.section === s.key; });
      if (s.key === '결의사항') {
        html += resolutionsHtml(resolutions);
        if (list.length) {
          html += '<h3 style="margin-top:22px">관련 자료</h3>' + levelNote(list) + itemRows(list, s.key);
        }
        return;
      }
      if (!list.length && s.key !== '고시' && s.key !== '서식') return;
      /* 한 건도 열어 볼 수 없는 분류는 제목도 내지 않는다.
       * 임원회의록·회의록·공문·회계는 임원만, 증명서 발급대장과 대외비 문서는
       * 관리자만 볼 수 있으므로, 그 아래 사람에게는 목록 자체를 보이지 않는다. */
      if (list.length && !list.some(function (a) { return canOpen(a.access); })) return;
      html += '<h2>' + e(s.label || s.key) + '</h2>' +
        '<p style="color:var(--gray-5);font-size:0.88rem">' + e(s.desc) + '</p>';
      /* 청원서 작성: 작성 도구가 바로 보이고, 기존 서식 파일은 접어 둔다 */
      if (s.key === '서식') {
        html += '<div class="admin-card" style="max-width:720px">' +
          '<h3 style="margin-top:0">청원서 온라인 작성</h3>' +
          '<p style="font-size:0.9rem;color:var(--gray-7)">청빙·고시·이명·연기·보고서 등 22종 청원 서식을 ' +
          '골라 내용을 입력하면 완성된 청원서를 <strong>인쇄</strong>하거나 <strong>PDF로 저장</strong>할 수 있고, ' +
          '로그인하시면 작성한 청원서를 저장해 두었다가 다시 고쳐 쓸 수 있습니다.</p>' +
          '<a class="btn" href="petition.html">청원서 작성하러 가기</a></div>';
        if (list.length) {
          html += '<details style="margin:14px 0 0;max-width:900px">' +
            '<summary style="cursor:pointer;color:var(--gray-7);font-size:0.9rem">기존 서식 파일 보기 (' +
            list.length + '건)</summary>' + levelNote(list) + itemRows(list, s.key) + '</details>';
        }
        return;
      }
      html += levelNote(list);
      /* 고시 분류는 올려 둔 자료가 없으면 목록을 비우고 모의고사 안내만 보인다 */
      if (s.key !== '고시' || list.length) html += itemRows(list, s.key);
      if (s.key === '고시') html += examHtml();
    });

    area.innerHTML = html;
    SHS.sectionize(area);
    bindForms();

    /* 분류별 제목 검색 */
    area.querySelectorAll('input[data-arq]').forEach(function (inp) {
      inp.addEventListener('input', function () {
        var q = inp.value.trim();
        var tb = area.querySelector('table[data-artable="' + inp.dataset.arq + '"]');
        if (!tb) return;
        tb.querySelectorAll('tbody tr').forEach(function (tr) {
          tr.hidden = !!q && (tr.dataset.arname || '').indexOf(q) === -1;
        });
      });
    });

    if (isMember) {
      drawResolutions(resolutions);
      var q = document.getElementById('rs-q');
      if (q) q.addEventListener('input', function () { drawResolutions(resolutions); });
    }

    /* 첨부파일 내려받기
     * 자료는 두 곳에 나뉘어 있다.
     *   - 노회 자료 보관소(Cloudflare) : file_path 가 주소(https://…)로 되어 있다.
     *     보관소가 로그인 증표를 보고 등급을 확인한 뒤 내어 준다.
     *   - 예전 방식(Supabase)          : file_path 가 파일 이름으로 되어 있다. */
    function saveBlob(blob, name) {
      var u = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = u; a.download = name || '자료';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(u); }, 30000);
    }

    function fromStore(a, btn) {
      var was = btn.textContent;
      btn.textContent = '받는 중...'; btn.disabled = true;
      function done() { btn.textContent = was; btn.disabled = false; }
      SHSCloud.init().then(function (c) {
        return c.auth.getSession();
      }).then(function (r) {
        var t = r && r.data && r.data.session && r.data.session.access_token;
        return fetch(a.file_path, t ? { headers: { Authorization: 'Bearer ' + t } } : {});
      }).then(function (res) {
        if (!res.ok) {
          return res.json().catch(function () { return {}; }).then(function (j) {
            throw new Error(j.error || ('내려받지 못했습니다. (' + res.status + ')'));
          });
        }
        return res.blob();
      }).then(function (blob) {
        saveBlob(blob, a.file_name || a.title);
        SHS.logAction('view', '자료 내려받기', '[' + a.section + '] ' + a.title);
        done();
      }).catch(function (err) { alert(err.message); done(); });
    }

    area.querySelectorAll('button[data-arfile]').forEach(function (b) {
      b.addEventListener('click', function () {
        var a = items.filter(function (x) { return String(x.id) === b.dataset.arfile; })[0];
        if (!a) return;
        if (/^https?:/.test(a.file_path || '')) { fromStore(a, b); return; }
        SHSCloud.init().then(function (c) {
          return c.storage.from('archive-files').createSignedUrl(a.file_path, 60);
        }).then(function (r) {
          if (r.error) { alert('내려받지 못했습니다: ' + r.error.message); return; }
          SHS.logAction('view', '자료 내려받기', '[' + a.section + '] ' + a.title);
          window.open(r.data.signedUrl, '_blank');
        });
      });
    });

    SHS.logAction('view', '자료실 열람', '자료 목록 열람');
  }

  /* ---------- 자료 불러오기 ---------- */
  function fallbackItems() {
    return (SHSData.archives || []).map(function (a, i) {
      return {
        id: 'local' + i, section: a.type || '회의자료', title: a.title,
        description: a.desc, doc_date: a.date, link_url: a.href || null,
        access: a.officerOnly ? 'officer' : (a.memberOnly ? 'member' : 'public'),
        sort: i
      };
    });
  }
  function fallbackResolutions() {
    return (SHSData.resolutions || []).map(function (r, i) {
      return { id: 'l' + i, session: r.session, items: (r.items || []).join('\n') };
    });
  }

  if (!(window.SHSCloud && SHSCloud.enabled())) {
    draw(fallbackItems(), fallbackResolutions());
    return;
  }

  SHSCloud.init().then(function (c) {
    return Promise.all([
      c.from('archive_items').select('*').order('sort', { ascending: false }).order('id', { ascending: false }),
      isMember ? c.from('resolutions').select('*').order('sort', { ascending: false }).order('id', { ascending: false })
               : Promise.resolve({ data: [] })
    ]);
  }).then(function (rs) {
    var items = (rs[0] && rs[0].data && rs[0].data.length) ? rs[0].data : fallbackItems();
    /* 임원·관리자 전용 자료는 임원방의 임원 자료실에서 본다.
     * 자료를 두 곳에 나누어 두지 않고, 보여 주는 자리만 나눈다. */
    items = items.filter(function (a) {
      return a.access !== 'officer' && a.access !== 'admin';
    });
    var res = (rs[1] && rs[1].data && rs[1].data.length) ? rs[1].data : fallbackResolutions();
    draw(items, res);
  }).catch(function () {
    draw(fallbackItems(), fallbackResolutions());
  });
 });
});
</script>
</body>
</html>
