<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>노회 진행 매니저 - 시화산노회</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/style.css?v=20261020w">
</head>
<body>

<div class="page-head">
  <div class="container">
    <h1>노회 진행 매니저</h1>
    <div class="crumb">홈 &gt; 임원방 &gt; 노회 진행 매니저</div>
  </div>
</div>

<main class="page-body container" id="main">
  <div id="pc-area"><p style="color:var(--gray-5)">권한을 확인하는 중...</p></div>
</main>

<script src="js/auth.js?v=20260921j"></script>
<script src="js/data.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-auth.js"></script>
<script src="js/main.js?v=20261020v"></script>
<script src="js/proceed-panel.js?v=20261013a"></script>
<script>
/* 노회 진행 매니저 — 순서지 진행 판은 js/proceed-panel.js (오늘의 노회 · 회의관리와 함께 쓴다) */
document.addEventListener('DOMContentLoaded', function () {
  SHS.getUser().then(function (user) {
    var area = document.getElementById('pc-area');
    if (!user || !SHSAuth.canManageMembers(user)) {
      area.innerHTML =
        '<div class="notice-banner">노회 진행 매니저는 <strong>노회장·서기·간사</strong>가 이용할 수 있습니다.' +
        (user ? '' : ' <a class="btn sm" style="margin-left:10px" href="login.html">로그인</a>') + '</div>';
      return;
    }
    if (!user.cloud || !window.SHSCloud || !SHSCloud.enabled()) {
      area.innerHTML =
        '<div class="notice-banner">회의 진행 기록이 서버에 저장되므로 서버 로그인이 필요합니다. ' +
        '<a class="btn sm" style="margin-left:10px" href="login.html">로그인 화면으로</a></div>';
      return;
    }
    area.innerHTML = '<div class="notice-banner" style="margin-bottom:14px">회의 당일에는 <a href="today.html#qr"><strong>오늘의 노회</strong></a> 화면에서 ' +
      '출석 · 전자투표와 함께 진행할 수 있습니다. 회기별 기록은 <a href="meeting-admin.html"><strong>노회 회의관리</strong></a>에서 봅니다.</div><div id="pc-panel"></div>';
    SHSProceed.mount(document.getElementById('pc-panel'), user, {});
  });
});
</script>
</body>
</html>
