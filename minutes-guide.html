    <h1>회의록 작성 안내</h1>
    <div class="crumb">홈 &gt; 임원방 &gt; 회의록 작성 안내</div>
  </div>
</div>

<main class="page-body container" id="main">
  <div id="mg-area"><p style="color:var(--gray-5)">권한을 확인하는 중...</p></div>

  <template id="mg-body">
  <div class="mg-sec">

    <div class="notice-banner">
      노회 회의록은 <strong>총회 표준 회의록 작성 및 보존 규정</strong>(2014. 9. 26. 제정, 2016. 8. 9. 개정)에
      따라 작성합니다. 노회는 강도사·전도사 인허, 목사의 임직·이명·별세, 후보생 명부, 교회 설립·분립·합병과
      각 교회 정황, 처리한 일반 사건을 일일이 기록하여 <strong>매년 상회(총회)에 보고</strong>하고
      (총회 헌법 정치 제10장 제7조), 노회록 검사부의 <strong>검사</strong>를 받습니다.
    </div>

    <div class="mg-dl" id="mg-dl">
      <h3 style="margin:0 0 6px">회의록 샘플 (Word)</h3>
      <p style="margin:0 0 12px;font-size:0.9rem">총회 규격(A4 · 여백 · 신명조 12호 · 줄간격 160%)을 그대로 맞춘
        정기노회 회의록 워드 파일입니다. 내려받아 ○○ 자리만 채우면 규정대로 작성됩니다.</p>
      <p style="margin:0" id="mg-dl-btn"><a class="btn" href="data/minutes-sample.docx"
        download="노회 회의록 샘플.docx"
        style="background:#b03a3a;border-color:#b03a3a;color:#fff">&#11015;&#65039; 회의록 샘플 내려받기 (.docx)</a></p>
    </div>

    <h2>1. 누가 작성하고 서명하나</h2>
    <ul>
      <li>회의록 작성은 <strong>서기</strong>가 담당합니다. <strong>회록서기가 있는 경우 회록서기가 기록</strong>하고,
        서명한 후 서기에게 인계합니다. (규정 제3조)</li>
      <li>회의록이 채택되면 <strong>그 즉시</strong> 의장(노회장)과 회록서기가 출력된 문서에
        <strong>친필로 서명하고 사인(또는 인장 날인)</strong>을 합니다.</li>
      <li>폐회 후 서기는 서명된 회의록을 노회 주소지 사무소 담당자에게 인계하여 보존 조치를 합니다. (제8조)</li>
    </ul>

    <h2>2. 회의록 규격</h2>
    <h3>전산(워드) 작성 — 우리 노회의 기본 방식</h3>
    <ul>
      <li>용지는 <strong>A4</strong>, 여백은 왼쪽·오른쪽 각 <strong>30mm</strong>, 위·아래 각 <strong>20mm</strong>,
        머리말·꼬리말(쪽번호용) <strong>10mm</strong></li>
      <li>글체 <strong>신명조 12호</strong>, 장평 <strong>90%</strong>, 글자간격 <strong>−4</strong>,
        줄 간격 <strong>160%</strong>, <strong>쪽번호 삽입</strong></li>
      <li>제목은 <strong>굵은 글씨</strong>로 하고, 큰제목으로 올라가면서 적절히 크기를 키웁니다</li>
      <li>문장 오른쪽 끝에서 <strong>엔터로 줄을 끊지 않고</strong>, 문단 모양(들여쓰기)으로 왼쪽 시작선을 맞춥니다</li>
      <li>책자로 제본할 때는 <strong>가로 18.8cm × 세로 25.8cm</strong>, 양면 출력</li>
    </ul>
    <h3>수기 장부로 작성하는 경우</h3>
    <ul>
      <li>가로 20cm × 세로 29cm, 두께 400면 공책에 횡선을 긋고 좌우측 상단에 일련 번호를 매겨 사용</li>
      <li>기록은 <strong>한글 정자</strong>가 원칙이며, 한자나 영문은 괄호 안에 한글을 병기</li>
      <li>책자의 일련번호는 임의로 변경하거나 훼손할 수 없습니다</li>
    </ul>
    <p class="mg-note">※ 위·변조 방지를 위하여 회의록 장과 장 사이에 <strong>간인(또는 직인)</strong>을 날인합니다. (제6조 마항)</p>

    <h2>3. 문장은 이렇게 적습니다</h2>
    <p class="mg-note">별지 1 표준 서식의 문장 틀입니다. ○○ 자리에 실제 내용을 넣으면 됩니다.</p>

    <div class="mg-ex"><span class="t">개회예배</span>
      대한예수교장로회 시화산노회 제○○회 정기노회가 주후 ○○○○년 ○월 ○일 오전 ○시에
      경기도 ○○시 ○○동 ○○번지 ○○교회당에서 노회장 ○○○ 목사의 인도로 회집하여 아래와 같이
      개회예배와 성찬식을 드리고 예배를 마치니 동일 오전 ○시 ○분이었다.
    </div>
    <div class="mg-ex"><span class="t">회원점명 (성수 보고)</span>
      서기 ○○○ 목사가 회원을 호명하니 목사회원 ○○명 중 ○○명, 장로회원 ○○명 중 ○○명이 출석하여
      총 재적 ○○○명 중 출석 ○○○명으로 성수가 됨을 보고하다.
    </div>
    <div class="mg-ex"><span class="t">개회선언</span>
      노회장 ○○○ 목사가 대한예수교장로회 시화산노회 제○○회 정기노회가 개회됨을 선언하다.
    </div>
    <div class="mg-ex"><span class="t">절차채택</span>
      서기 ○○○ 목사가 제○○회 노회 회순(안)을 별지(1)와 같이 보고하니 (임시) 채택하다.
    </div>
    <div class="mg-ex"><span class="t">정회 · 속회</span>
      동일 ○○시까지 정회하기로 결의하고 ○○○ 목사의 기도로 정회하니 동일 ○○시 ○○분이었다.<br>
      본회가 같은 날 오후 ○○시 ○○분 같은 장소에서 노회장 ○○○ 목사의 사회로 모여 찬송가 ○○장을
      제창하고 사회자가 성경 ○○○○을 봉독한 후 ○○○ 목사(장로)가 기도함으로 속회하여 회무처리를 시작하다.
    </div>
    <div class="mg-ex"><span class="t">안건 처리 (예)</span>
      ○○부 서기 ○○○ 목사가 ○○○ 안건을 보고하니 유인물대로 받기로 가결하다.
    </div>
    <div class="mg-ex"><span class="t">폐회 결의 · 폐회예배</span>
      미진안건 처리는 임원회에 맡기기로 하고 폐회하기로 하다.<br>
      노회장 ○○○ 목사의 사회로 찬송 ○○장을 제창하고 인도자가 성경 ○○을 봉독하고 기도한 후
      축도함으로 폐회예배를 마치다.
    </div>
    <div class="mg-ex"><span class="t">폐회 선언</span>
      노회장 ○○○ 목사가 다음과 같이 폐회를 선언함으로 폐회하니 같은 날 오후 ○○시 ○○분이었다.<br><br>
      &ldquo;교회가 나에게 허락한 권으로 지금 대한예수교장로회 시화산노회 제○○차 정기노회가 폐회됨과
      이 노회와 같이 조직된 노회가 다시 정한 날 정한 장소에서 회집할 것을 선언합니다.&rdquo;
    </div>

    <h2>4. 채택된 회의록의 수정</h2>
    <ul>
      <li>채택된 회의록은 <strong>채택한 회의의 결의 없이는 수정할 수 없습니다</strong>.</li>
      <li>수정할 때는 해당란에 <strong>붉은 줄</strong>을 긋고 수정한 후, 여백에 몇 자를 수정했음을 기재하고
        <strong>의장과 서기가 날인</strong>합니다.</li>
      <li>컴퓨터에 입력된 회의록도 함께 수정하되, 맨 하단에 <strong>언제, 어떤 경위(수정을 결의한 회의)로
        어느 부분을 수정했는지</strong>를 명기합니다.</li>
    </ul>

    <h2>5. 검사와 보존</h2>
    <ul>
      <li>각 노회는 <strong>매년 8월 첫째 주까지</strong> 총회로 회의록을 제출하여 검사를 받습니다.
        (총회규칙 제3장 3항 13목, 규정 제7조)</li>
      <li>노회록 검사부는 모든 결정이 교회법규대로 되었는지, 지혜롭고 공정하게 처리되었는지를 검사하여
        총회에 보고합니다. 불응 노회는 행정제재를 받을 수 있습니다. (제101회 총회 결의)</li>
      <li>제출은 직접 또는 등기우편으로 하며, 문의는 총회 노회록검사부 (02-559-5626, 서울 강남구 영동대로 330 총회회관 3층)</li>
    </ul>


  </div>
