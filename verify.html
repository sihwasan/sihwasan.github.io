<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>증명서 진위 확인 - 시화산노회</title>
<meta name="description" content="시화산노회가 발급한 증명서의 진위를 확인합니다.">
<link rel="canonical" href="https://sihwasan.org/verify.html">
<link rel="stylesheet" href="css/style.css?v=20260831g">
</head>
<body>

<div class="page-head">
  <div class="container">
    <h1>증명서 진위 확인</h1>
    <div class="crumb">홈 &gt; 증명서 진위 확인</div>
  </div>
</div>

<main class="page-body container" id="main">
  <p>시화산노회가 발급한 증명서에는 왼쪽 아래에 <strong>진위 확인 QR</strong>과
     <strong>확인번호</strong>가 있습니다. QR을 카메라로 찍으면 이 화면이 열리고,
     노회의 발급 대장과 대조한 결과를 보여 드립니다.</p>

  <div class="form-card" style="max-width:520px;margin:26px 0">
    <div class="field">
      <label for="v-code">확인번호</label>
      <input type="text" id="v-code" placeholder="증명서에 적힌 확인번호 (예: 3f2a…)"
             autocomplete="off" spellcheck="false" maxlength="40">
    </div>
    <button class="btn" id="v-check" style="width:100%">진위 확인</button>
  </div>

  <div id="v-result"></div>

  <p style="font-size:0.85rem;color:var(--gray-5);margin-top:26px">
    확인 결과가 실제 서류의 내용(발급번호·이름·교회·발급일)과 다르거나,
    QR이 없는 서류의 진위가 궁금하시면 노회 사무실(031-486-9993)로 문의해 주시기 바랍니다.
    개인정보 보호를 위해 성명은 일부를 가려서 보여 드립니다.</p>
</main>

<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-auth.js"></script>
<script src="js/main.js?v=20260830d"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var e = SHS.esc;
  var box = document.getElementById('v-result');
  var inp = document.getElementById('v-code');

  function dateKo(d) {
    var m = String(d || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? m[1] + '년 ' + (+m[2]) + '월 ' + (+m[3]) + '일' : String(d || '');
  }

  function card(kind, title, body) {
    return '<div class="v-card v-' + kind + '"><div class="v-badge">' +
      (kind === 'ok' ? '✓' : (kind === 'void' ? '!' : '✕')) + '</div>' +
      '<div class="v-title">' + title + '</div>' + (body || '') + '</div>';
  }

  /* 확인은 로그인 없이 누구나 할 수 있다.
   * 서버 함수는 코드가 정확히 맞을 때만, 이름을 가린 채로 답한다. */
  function check(code) {
    code = String(code || '').trim();
    if (!code) {
      box.innerHTML = card('no', '확인번호를 입력해 주세요.');
      return;
    }
    box.innerHTML = '<p style="color:var(--gray-5)">발급 대장과 대조하는 중입니다...</p>';
    fetch(SHS_SUPABASE.url + '/rest/v1/rpc/verify_document', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SHS_SUPABASE.anonKey,
        'Authorization': 'Bearer ' + SHS_SUPABASE.anonKey
      },
      body: JSON.stringify({ p_code: code })
    }).then(function (r) { return r.json(); }).then(function (rows) {
      var d = rows && rows[0];
      if (!d) {
        box.innerHTML = card('no', '발급 기록이 없습니다.',
          '<p>이 확인번호로 발급된 증명서를 노회 발급 대장에서 찾지 못했습니다.<br>' +
          '번호를 다시 확인하시고, 계속 확인되지 않으면 위조를 의심해 보시기 바랍니다.</p>');
        return;
      }
      var rowsHtml =
        '<table class="tbl" style="max-width:460px;margin-top:14px"><tbody>' +
        '<tr><td style="width:110px">발급번호</td><td class="left">' + e(d.out_doc_no || '') + '</td></tr>' +
        '<tr><td>서류 종류</td><td class="left">' + e(d.out_doc_type || '') + '</td></tr>' +
        '<tr><td>성명</td><td class="left">' + e(d.out_name || '') +
          (d.out_position ? ' <span style="color:var(--gray-5)">' + e(d.out_position) + '</span>' : '') + '</td></tr>' +
        '<tr><td>소속 교회</td><td class="left">' + e(d.out_church || '') + '</td></tr>' +
        '<tr><td>발급일</td><td class="left">' + e(dateKo(d.out_issued_on)) + '</td></tr>' +
        '</tbody></table>';
      /* 직인증명서는 발급 대장에 기록된 직인 그림을 함께 보여 대조하게 한다 */
      if (d.out_church_seal && String(d.out_church_seal).indexOf('data:image/') === 0) {
        rowsHtml += '<div style="margin-top:14px">' +
          '<div style="font-size:0.88rem;color:var(--gray-6);margin-bottom:6px">' +
          '발급 대장에 기록된 교회 직인입니다. <strong>서류에 찍힌 직인과 같은지</strong> 대조해 주세요.</div>' +
          '<img src="' + d.out_church_seal + '" alt="발급 대장에 기록된 교회 직인" ' +
          'style="height:120px;border:1px solid #ddd;background:#fff;padding:6px;border-radius:4px"></div>';
      }
      if (d.out_void) {
        box.innerHTML = card('void', '발급되었으나 <strong>무효 처리</strong>된 증명서입니다.',
          rowsHtml + (d.out_void_reason
            ? '<p style="margin-top:10px">무효 사유: ' + e(d.out_void_reason) + '</p>' : ''));
      } else {
        box.innerHTML = card('ok', '시화산노회가 발급한 증명서입니다.',
          '<p>아래 내용이 실제 서류와 같은지 확인해 주세요.</p>' + rowsHtml);
      }
    }).catch(function () {
      box.innerHTML = card('no', '확인하지 못했습니다.',
        '<p>잠시 후 다시 시도해 주세요. 계속 안 되면 노회 사무실로 문의해 주시기 바랍니다.</p>');
    });
  }

  document.getElementById('v-check').addEventListener('click', function () { check(inp.value); });
  inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') check(inp.value); });

  /* QR로 들어오면 주소의 코드로 바로 확인한다 */
  var c = new URLSearchParams(location.search).get('c');
  if (c) { inp.value = c; check(c); }
});
</script>
</body>
</html>
