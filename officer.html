<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>임원방 - 시화산노회</title>
<link rel="stylesheet" href="css/style.css?v=20260829p">
</head>
<body>

<div class="page-head">
  <div class="container">
    <h1>임원방</h1>
    <div class="crumb">홈 &gt; 임원방</div>
  </div>
</div>

<main class="page-body container" id="main">
  <div id="officer-area"></div>
</main>

<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="private/resolutions.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-auth.js"></script>
<script src="js/main.js?v=20260829p"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
 SHS.getUser().then(function (user) {
  var area = document.getElementById('officer-area');
  var e = SHS.esc;

  /* 임원방 접근: 노회 임원 전원
   * (노회장·부노회장·서기·부서기·회록서기·부회록서기·회계·부회계)과 간사 */
  var hasAccess = SHSAuth.isOfficer(user);

  if (!user) {
    area.innerHTML =
      '<div class="notice-banner">임원방은 노회 임원만 이용할 수 있습니다. ' +
      '로그인 후 이용해 주시기 바랍니다. <a class="btn sm" style="margin-left:10px" href="login.html">로그인</a></div>';
    return;
  }
  if (!hasAccess) {
    area.innerHTML =
      '<div class="notice-banner">임원방은 <strong>노회 임원</strong>이 이용할 수 있는 공간입니다. ' +
      '현재 등급(' + SHS.displayRole(user.role, user.title) + ')으로는 열람할 수 없습니다. ' +
      '임원이신데 들어오지 못하시면 노회 사무실로 알려 주시기 바랍니다.</div>';
    return;
  }

  var html = '';
  html += '<div class="notice-banner"><strong>' + e(SHS.honorific(user)) + '</strong>, 임원방에 오신 것을 환영합니다.</div>';

  /* 자료 아카이브 자리 (임원방에 들어오면 가장 먼저 보이는 영역) */
  html += '<h2>임원 자료실</h2>';
  html += '<div id="oa-area"><p style="color:var(--gray-5)">불러오는 중...</p></div>';

  /* 임원회 결의사항 전체 (공개 저장소 미포함 자료) */
  html += '<h2>임원회 결의사항</h2>';
  if (SHSData.resolutions && SHSData.resolutions.length) {
    SHSData.resolutions.forEach(function (r) {
      var items = '';
      r.items.forEach(function (it, i) { items += '<li>' + (i + 1) + '. ' + e(it) + '</li>'; });
      html += '<div class="side-box" style="margin-bottom:18px"><div class="box-head">' + e(r.session) + '</div>' +
        '<div class="box-body"><ol style="list-style:none">' + items + '</ol></div></div>';
    });
  } else {
    html += '<div class="notice-banner">결의사항 자료는 보안을 위해 인터넷 홈페이지에 게시하지 않습니다. ' +
      '서버 인증 연동 후 온라인으로 제공될 예정이며, 현재는 노회 사무실에서 열람하실 수 있습니다.</div>';
  }

  /* 서류 발급 대장 */
  html += '<h2>서류 발급 대장</h2>';
  html += '<p>홈페이지에서 발급한 서류의 기록입니다. 발급 업무는 <a href="documents.html" style="text-decoration:underline;color:var(--navy)">서류 발급</a> 페이지에서 처리합니다.</p>';
  var log = [];
  try { log = JSON.parse(localStorage.getItem('shs_doclog_v1')) || []; } catch (x) {}
  if (!log.length) {
    html += '<p style="color:var(--gray-5)">발급 기록이 없습니다.</p>';
  } else {
    html += '<table class="tbl"><thead><tr><th>발급번호</th><th>발급일</th><th>서류명</th><th>대상자</th><th>교회</th><th>용도</th><th>발급자</th></tr></thead><tbody>';
    log.slice().reverse().forEach(function (d) {
      html += '<tr><td>' + e(d.no) + '</td><td>' + e(d.date) + '</td><td>' + e(d.doc) + '</td><td>' + e(d.name) + '</td><td>' + e(d.church) + '</td><td>' + e(d.purpose) + '</td><td>' + e(d.issuer) + '</td></tr>';
    });
    html += '</tbody></table>';
  }

  /* 상회비 관리 */
  html += '<h2>상회비 관리</h2>';
  html += '<div id="dues-area"><p style="color:var(--gray-5)">불러오는 중...</p></div>';

  /* 교회상황 보고서 (연도별) — 각 교회가 시찰 화면에서 올린 것을 임원이 모아 본다 */
  html += '<h2>교회상황 보고서</h2>';
  html += '<p>각 교회가 시찰회 화면에서 올린 해마다의 교회상황 보고서입니다. ' +
    '연도를 고르면 그 해에 낸 교회와 아직 내지 않은 교회를 함께 보실 수 있습니다.</p>';
  html += '<div id="cr-area"><p style="color:var(--gray-5)">불러오는 중...</p></div>';

  /* 예전에는 여기에 관리 화면으로 가는 카드가 늘어서 있었으나, 같은 곳을
   * 상단 '관리자' 메뉴가 이미 가리키고 있어 길이 두 갈래가 되어 있었다.
   * 이제 관리 화면은 상단 메뉴 한 곳으로만 들어간다. */
  html += '<h2>임원 업무</h2>';
  html += '<p>노회 회의록은 상단 <strong>임원방</strong> 메뉴에서 여실 수 있습니다.' +
    (SHSAuth.canManageMembers(user)
      ? ' 사이트 관리·회원 관리·서류 발급·자료·회칙 관리·직인·도장·시스템 운영은 ' +
        '상단 <strong>관리자</strong> 메뉴에 모아 두었습니다.'
      : '') +
    '</p>';

  area.innerHTML = html;
  SHS.sectionize(area);
  loadChurchReports();

  /* ================= 교회상황 보고서 (연도별) =================
   * 각 교회는 시찰회 화면에서 올리고, 임원은 여기서 모아 봅니다.
   * 누가 볼 수 있는지는 데이터베이스가 정하므로(임원·그 시찰 임원·그 교회),
   * 여기서는 돌아온 것을 그대로 보여 주기만 합니다. */
  var crRows = [], crChurches = [], crYear = new Date().getFullYear();

  function loadChurchReports() {
    var box = document.getElementById('cr-area');
    if (!box) return;
    if (!(user.cloud && window.SHSCloud && SHSCloud.enabled())) {
      box.innerHTML = '<p style="color:var(--gray-5)">서버 로그인 후 교회상황 보고서를 보실 수 있습니다.</p>';
      return;
    }
    SHSCloud.init().then(function (c) {
      return Promise.all([
        c.from('church_reports').select('*').order('year', { ascending: false }).order('church'),
        c.from('sichal_churches').select('sichal,name,pastor,sort').order('sichal').order('sort')
      ]);
    }).then(function (rs) {
      if (rs[0].error) {
        box.innerHTML = '<p style="color:var(--gray-5)">교회상황 보고서를 불러오지 못했습니다: ' +
          e(rs[0].error.message) +
          '<br>Supabase에서 <strong>35_sichal.sql</strong>을 아직 실행하지 않으셨다면 먼저 실행해 주세요.</p>';
        return;
      }
      crRows = rs[0].data || [];
      crChurches = (rs[1] && rs[1].data) || [];
      drawChurchReports();
    }).catch(function (x) {
      box.innerHTML = '<p style="color:var(--gray-5)">교회상황 보고서를 불러오지 못했습니다: ' +
        e((x && x.message) || '') + '</p>';
    });
  }

  function drawChurchReports() {
    var box = document.getElementById('cr-area');
    var years = {};
    crRows.forEach(function (r) { years[r.year] = 1; });
    years[crYear] = 1;
    var yearList = Object.keys(years).map(Number).sort(function (a, b) { return b - a; });

    var mine = crRows.filter(function (r) { return r.year === crYear; });
    var byChurch = {};
    mine.forEach(function (r) { byChurch[r.church] = r; });

    var h = '<div class="inline-form" style="margin-bottom:10px">' +
      '<div class="field" style="flex:0 0 180px"><label>연도</label><select id="cr-year">' +
      yearList.map(function (y) {
        return '<option value="' + y + '"' + (y === crYear ? ' selected' : '') + '>' + y + '년</option>';
      }).join('') + '</select></div>' +
      '<div class="field" style="flex:0 0 200px"><label>&nbsp;</label>' +
      '<div style="padding-top:8px;color:var(--gray-7);font-size:0.9rem">제출 ' + mine.length + '곳' +
      (crChurches.length ? ' / 관내 ' + crChurches.length + '곳' : '') + '</div></div>' +
      '</div>';

    /* 관내 교회 목록이 있으면 그것을 기준으로, 없으면 제출된 것만 늘어놓는다 */
    var list = crChurches.length
      ? crChurches.map(function (c) { return { sichal: c.sichal, church: c.name, pastor: c.pastor, r: byChurch[c.name] }; })
      : mine.map(function (r) { return { sichal: r.sichal, church: r.church, pastor: r.pastor, r: r }; });

    if (!list.length) {
      box.innerHTML = h + '<p style="color:var(--gray-5)">등록된 교회상황 보고서가 없습니다.</p>';
      bindCrYear();
      return;
    }

    h += '<table class="tbl"><thead><tr><th style="width:110px">시찰</th><th style="width:160px">교회</th>' +
      '<th style="width:100px">담임</th><th style="width:90px">전체 교인</th>' +
      '<th style="width:90px">세례교인</th><th style="width:100px">평균 출석</th>' +
      '<th style="width:90px">제출</th><th style="width:150px">보기</th></tr></thead><tbody>';
    list.forEach(function (x) {
      var r = x.r;
      h += '<tr' + (r ? '' : ' style="opacity:.55"') + '>' +
        '<td>' + e(x.sichal || '-') + '</td><td>' + e(x.church) + '</td>' +
        '<td>' + e((r && r.pastor) || x.pastor || '-') + '</td>' +
        '<td>' + (r && r.members_total != null ? r.members_total : '-') + '</td>' +
        '<td>' + (r && r.members_baptized != null ? r.members_baptized : '-') + '</td>' +
        '<td>' + (r && r.worship_avg != null ? r.worship_avg : '-') + '</td>' +
        '<td>' + (r ? '<span class="role-badge">제출</span>' : '<span style="color:var(--gray-5)">미제출</span>') + '</td>' +
        '<td>' +
        (r ? '<button class="btn sm" data-crview="' + r.id + '">내용</button> ' : '') +
        (r && r.file_path ? '<button class="btn ghost sm" data-crfile="' + r.id + '">첨부</button>' : '') +
        (!r ? '<span style="color:var(--gray-5)">-</span>' : '') +
        '</td></tr>';
    });
    h += '</tbody></table><div id="cr-view"></div>';
    box.innerHTML = h;
    bindCrYear();

    box.querySelectorAll('button[data-crview]').forEach(function (b) {
      b.addEventListener('click', function () {
        var r = crRows.filter(function (x) { return String(x.id) === b.dataset.crview; })[0];
        if (!r) return;
        document.getElementById('cr-view').innerHTML = crReportView(r);
        SHS.logAction('view', '교회상황 보고서 열람', r.year + '년 ' + r.church);
        document.getElementById('cr-view').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    });
    box.querySelectorAll('button[data-crfile]').forEach(function (b) {
      b.addEventListener('click', function () {
        var r = crRows.filter(function (x) { return String(x.id) === b.dataset.crfile; })[0];
        if (!r) return;
        SHSCloud.init().then(function (c) {
          return c.storage.from('church-reports').createSignedUrl(r.file_path, 60);
        }).then(function (rr) {
          if (rr.error) { alert('내려받지 못했습니다: ' + rr.error.message); return; }
          SHSCloud.log('view', '교회상황 보고서 첨부 내려받기', r.year + '년 ' + r.church);
          window.open(rr.data.signedUrl, '_blank', 'noopener');
        });
      });
    });
  }

  function bindCrYear() {
    var sel = document.getElementById('cr-year');
    if (sel) sel.addEventListener('change', function () {
      crYear = parseInt(this.value, 10);
      drawChurchReports();
    });
  }

  var CR_FIELDS = [
    { g: '교인 현황', k: 'members_total',    t: '전체 교인' },
    { g: '교인 현황', k: 'members_baptized', t: '세례교인' },
    { g: '교인 현황', k: 'members_new',      t: '새가족 등록' },
    { g: '직원 현황', k: 'staff_pastors',    t: '교역자' },
    { g: '직원 현황', k: 'staff_elders',     t: '장로' },
    { g: '직원 현황', k: 'staff_deacons',    t: '안수집사' },
    { g: '직원 현황', k: 'staff_kwonsa',     t: '권사' },
    { g: '예배·교육', k: 'worship_avg',      t: '주일 낮 평균 출석' },
    { g: '예배·교육', k: 'school_total',     t: '교회학교 학생' },
    { g: '재정(원)',  k: 'budget_year',      t: '당해 예산' },
    { g: '재정(원)',  k: 'offering_year',    t: '연간 헌금' }
  ];

  function crReportView(r) {
    var h = '<div class="admin-card" style="margin-top:14px"><h3 style="margin-top:0">' +
      r.year + '년 ' + e(r.church) + ' 교회상황 보고서</h3>' +
      '<p style="color:var(--gray-5);font-size:0.85rem">' + e(r.sichal || '') +
      ' · 담임 ' + e(r.pastor || '-') + ' · 제출 ' + e(r.submitted_by || '-') +
      ' · ' + e(String(r.updated_at || r.created_at || '').slice(0, 10)) + '</p>';
    var groups = {};
    CR_FIELDS.forEach(function (f) { (groups[f.g] = groups[f.g] || []).push(f); });
    Object.keys(groups).forEach(function (g) {
      h += '<h4 style="margin:14px 0 6px;color:var(--navy)">' + e(g) + '</h4>' +
        '<table class="tbl" style="margin-bottom:0"><tbody><tr>' +
        groups[g].map(function (f) { return '<th>' + e(f.t) + '</th>'; }).join('') + '</tr><tr>' +
        groups[g].map(function (f) {
          var v = r[f.k];
          return '<td>' + (v == null ? '-' : Number(v).toLocaleString('ko-KR')) + '</td>';
        }).join('') + '</tr></tbody></table>';
    });
    if (r.dues_paid) h += '<p style="margin-top:12px"><strong>상회비</strong> ' + e(r.dues_paid) + '</p>';
    if (r.note) h += '<p><strong>특기사항</strong><br><span style="white-space:pre-wrap">' + e(r.note) + '</span></p>';
    if (r.file_name) h += '<p style="color:var(--gray-5);font-size:0.85rem">첨부 : ' + e(r.file_name) + '</p>';
    return h + '</div>';
  }

  /* ================= 자료 아카이브 ================= */
  /* ---------- 임원 자료실: 분류 탭 하나로 통합 ---------- */
  function renderArchiveShell() {
    var box = document.getElementById('oa-area');
    box.innerHTML =
      '<div class="notice-banner">임원만 볼 수 있는 노회 문서입니다. ' +
      '분류를 눌러 페이지를 오가며 보십시오.' +
      (SHSAuth.canManageMembers(user)
        ? ' 관리자는 각 분류에서 바로 등록·수정·삭제할 수 있습니다.' : '') +
      ' 모든 열람·등록·수정·삭제는 감사 기록에 남습니다.</div>' +
      '<div id="oa-docs"><p style="color:var(--gray-5)">불러오는 중...</p></div>';
    loadOfficerDocs();
  }

  /* ---------- 노회 문서 (자료실의 임원·관리자 전용 자료) ---------- */
  var OD_SECTIONS = [
    { k: '회의록',   a: 'officer' },
    { k: '결의사항', a: 'officer' },
    { k: '임원회의록', a: 'officer' },
    { k: '발송 공문', a: 'officer' },
    { k: '접수 공문', a: 'officer' },
    { k: '회계',     a: 'officer' },
    { k: '증명서 발급대장', a: 'admin' },
    { k: '대외비 문서',     a: 'admin' }
  ];
  var OD_SLUG = {
    '회의록': 'hoeuirok', '결의사항': 'gyeorui', '임원회의록': 'imwon-hoeuirok',
    '발송 공문': 'gongmun', '접수 공문': 'gongmun-in', '회계': 'hoegye',
    '증명서 발급대장': 'jeungmyeongseo', '대외비 문서': 'daeoebi'
  };
  var OD_LEVEL = { officer: '노회 임원', admin: '노회 관리자(노회장·서기·간사)' };
  var STORE = 'https://sihwasan-docs.sihwasan.workers.dev';
  var odRows = [];
  var odSec = '회의록';
  var odFile = null;
  var canManageDocs = SHSAuth.canManageMembers(user);

  /* 관리자 전용 분류(증명서 발급대장·대외비)는 관리자에게만 보인다 */
  function odVisible() {
    return OD_SECTIONS.filter(function (x) {
      return x.a === 'admin' ? canManageDocs : true;
    });
  }
  function odCur() {
    return OD_SECTIONS.filter(function (x) { return x.k === odSec; })[0];
  }

  /* ----- 보관소(R2) 심부름: 로그인 증표로 등급을 확인받는다 ----- */
  function odToken() {
    return SHSCloud.init().then(function (c) {
      return c.auth.getSession().then(function (r) {
        return (r && r.data && r.data.session && r.data.session.access_token) || null;
      });
    });
  }
  function odKey(access, section, name) {
    var ext = (String(name).match(/\.[A-Za-z0-9]{1,8}$/) || ['.dat'])[0].toLowerCase();
    var stamp = new Date().toISOString().replace(/[-:T.]/g, '').slice(0, 14);
    return access + '/' + (OD_SLUG[section] || 'gita') + '/' +
      stamp + '-' + Math.floor(Math.random() * 1e6) + ext;
  }
  function odPut(file, access, section) {
    var key = odKey(access, section, file.name);
    return odToken().then(function (t) {
      if (!t) throw new Error('로그인이 확인되지 않았습니다.');
      return fetch(STORE + '/f/' + key, {
        method: 'PUT',
        headers: { Authorization: 'Bearer ' + t, 'Content-Type': file.type || 'application/octet-stream' },
        body: file
      });
    }).then(function (r) {
      if (r.ok) return STORE + '/f/' + key;
      return r.json().catch(function () { return {}; }).then(function (j) {
        throw new Error(j.error || ('자료를 올리지 못했습니다. (' + r.status + ')'));
      });
    });
  }
  function odRemove(fp) {
    if (!fp || String(fp).indexOf(STORE + '/f/') !== 0) return Promise.resolve(false);
    return odToken().then(function (t) {
      if (!t) return false;
      return fetch(fp, { method: 'DELETE', headers: { Authorization: 'Bearer ' + t } })
        .then(function (r) { return r.ok; });
    }).catch(function () { return false; });
  }

  function saveBlob(blob, name) {
    var u = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = u; a.download = name || '자료';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(u); }, 30000);
  }
  function fetchDoc(d, btn) {
    var was = btn.textContent;
    btn.textContent = '받는 중...'; btn.disabled = true;
    function done() { btn.textContent = was; btn.disabled = false; }
    odToken().then(function (t) {
      return fetch(d.file_path, t ? { headers: { Authorization: 'Bearer ' + t } } : {});
    }).then(function (res) {
      if (!res.ok) {
        return res.json().catch(function () { return {}; }).then(function (j) {
          throw new Error(j.error || ('내려받지 못했습니다. (' + res.status + ')'));
        });
      }
      return res.blob();
    }).then(function (blob) {
      saveBlob(blob, d.file_name || d.title);
      SHS.logAction('view', '임원 자료 내려받기', '[' + d.section + '] ' + d.title);
      done();
    }).catch(function (err) { alert(err.message); done(); });
  }

  /* ---------- 전자 발급 대장 ----------
   * 홈페이지에서 발급한 증명서(doc_issues)가 자동으로 기록된다.
   * 기간을 정해 조회하고, 목록을 엑셀(CSV)로 내려받을 수 있다. */
  var dlRows = [];

  function docLedgerHtml() {

  function dlFiltered() {

    }

      '<div style="overflow-x:auto"><table class="tbl"><thead><tr>' +
      '<th>발급번호</th><th>발급일</th><th>종류</th><th>성명</th><th>소속 교회</th>' +
      '<th>용도</th><th>발급자</th><th>상태</th><th style="width:80px">열람</th>' +
      '</tr></thead><tbody>' +
      rows.map(function (r) {

  function loadDocLedger() {
    var from = document.getElementById('dl-from').value;
    var to = document.getElementById('dl-to').value;
    SHSCloud.init().then(function (c) {
      var q = c.from('doc_issues').select('*').order('id', { ascending: false }).limit(1000);
      if (from) q = q.gte('issued_on', from);
      if (to) q = q.lte('issued_on', to);
      return q;
    }).then(function (r) {
      if (r.error) throw r.error;
      dlRows = r.data || [];
      drawDocLedger();
    }).catch(function (err) {
      var box = document.getElementById('dl-list');
      if (box) box.innerHTML = '<p style="color:var(--gray-5)">발급 대장을 불러오지 못했습니다: ' +
        e(err.message || err) + '</p>';
    });
  }

  function ledgerCsv() {
    var rows = dlFiltered();
    if (!rows.length) { alert('내려받을 내용이 없습니다. 먼저 조회해 주세요.'); return; }
    var NL = String.fromCharCode(13) + String.fromCharCode(10);
    function cell(v) {
      var t = String(v == null ? '' : v);
      return t.indexOf('"') !== -1 || t.indexOf(',') !== -1 || t.indexOf(NL) !== -1
        ? '"' + t.split('"').join('""') + '"' : t;
    }
    var head = ['발급번호', '발급일', '종류', '성명', '직위', '소속 교회', '용도', '부수',
      '발급자', '노회장', '서기', '상태', '확인번호'];
    var lines = [head.join(',')].concat(rows.map(function (r) {
      return [r.doc_no, String(r.issued_on || r.created_at || '').slice(0, 10), r.doc_type,
        r.name, r.position, r.church, r.purpose, r.copies,
        r.issuer_name, r.president, r.clerk,
        r.void_yn ? '무효' : '유효', r.verify_code].map(cell).join(',');
    }));
    /* 엑셀이 한글을 바로 읽도록 BOM(U+FEFF)을 붙인다 */
    var blob = new Blob([String.fromCharCode(0xFEFF) + lines.join(NL)],
      { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '증명서 발급대장 ' + document.getElementById('dl-from').value +
      '~' + document.getElementById('dl-to').value + '.csv';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
    SHSCloud.log('view', '증명서 발급대장 엑셀 내려받기',
      document.getElementById('dl-from').value + '~' + document.getElementById('dl-to').value +
      ' ' + rows.length + '건');
  }

  function bindDocLedger() {
    document.getElementById('dl-go').addEventListener('click', loadDocLedger);
    document.getElementById('dl-csv').addEventListener('click', ledgerCsv);
    document.getElementById('dl-q').addEventListener('input', drawDocLedger);
    loadDocLedger();
  }

                : '열람 가능')) +

    /* 검색 */

        tr.hidden = !!v && (tr.dataset.odname || '').indexOf(v) === -1;
      });

    /* 내려받기 */
    body.querySelectorAll('button[data-odfile]').forEach(function (b) {
      b.addEventListener('click', function () {
        var d = list.filter(function (x) { return String(x.id) === b.dataset.odfile; })[0];
        if (d) fetchDoc(d, b);
      });
    });

    if (!canManageDocs) return;

    /* ----- 등록·수정 ----- */
    odFile = null;
    SHS.dropZone(document.getElementById('od-file'), { what: '첨부파일' });
    document.getElementById('od-file').addEventListener('change', function () {
      odFile = this.files[0] || null;
    });

    function resetForm() {
      ['od-id', 'od-title', 'od-date', 'od-desc'].forEach(function (id) {
        document.getElementById(id).value = '';
      });
      odFile = null;
      document.getElementById('od-ftitle').textContent = odSec + ' 자료 등록';
      document.getElementById('od-filenote').textContent = '';
      document.getElementById('od-cancel').classList.add('hidden');

    document.getElementById('od-cancel').addEventListener('click', function () {
      resetForm();
    });

    body.querySelectorAll('button[data-odedit]').forEach(function (b) {
      b.addEventListener('click', function () {
        var d = list.filter(function (x) { return String(x.id) === b.dataset.odedit; })[0];
        if (!d) return;
        document.getElementById('od-id').value = d.id;
        document.getElementById('od-title').value = d.title || '';
        document.getElementById('od-date').value = d.doc_date || '';
        document.getElementById('od-desc').value = d.description || '';
        document.getElementById('od-ftitle').textContent = '자료 수정: ' + d.title;
        document.getElementById('od-filenote').textContent = d.file_name
          ? '지금 첨부: ' + d.file_name + ' — 새 파일을 끌어다 놓으면 바뀝니다.'
          : '새 파일을 끌어다 놓으면 첨부됩니다.';
        document.getElementById('od-cancel').classList.remove('hidden');
        document.getElementById('od-title').focus();
        document.getElementById('od-ftitle').scrollIntoView({ behavior: 'smooth', block: 'center' });
      });

    document.getElementById('od-save').addEventListener('click', function () {
      var msg = document.getElementById('od-msg');
      var id = document.getElementById('od-id').value;
      var cur = id ? list.filter(function (x) { return String(x.id) === id; })[0] : null;
      var d = {
        section: odSec,
        access: sec.a,
        title: document.getElementById('od-title').value.trim(),
        doc_date: document.getElementById('od-date').value || null,
        description: document.getElementById('od-desc').value.trim() || null,
        updated_at: new Date().toISOString(), updated_by: user.name
      };

        list.forEach(function (x) { if (Number(x.sort || 0) > top) top = Number(x.sort || 0); });
        d.sort = top + 10;
      }
      msg.className = 'form-msg'; msg.textContent = '저장 중입니다...';

      SHSCloud.init().then(function (c) {
        var pre = Promise.resolve();
        if (odFile) {
          pre = odPut(odFile, d.access, d.section).then(function (url) {
            d.file_path = url;
            d.file_name = odFile.name;
            return odRemove(cur && cur.file_path);   /* 바꾸기: 옛 파일은 지운다 */
          });
        }
        return pre.then(function () {
          return id ? c.from('archive_items').update(d).eq('id', id)
                    : c.from('archive_items').insert(d);
        });

        if (res.error) { msg.className = 'form-msg err'; msg.textContent = res.error.message; return; }
        SHSCloud.log(id ? 'update' : 'create',
          '노회 문서 ' + (id ? '수정' : '등록'), '[' + odSec + '] ' + d.title);
        loadOfficerDocs(true);
      }).catch(function (err) {
        msg.className = 'form-msg err';

  var duesYear = new Date().getFullYear();
  var duesRates = [], duesPays = [];

    (user.role === 'officer' && user.title && user.title.indexOf('회계') !== -1);

        c.from('dues_rates').select('*').eq('year', duesYear).order('sort'),

        c.from('dues_closings').select('*').eq('year', duesYear)

    }).then(function (rs) {
      if (rs[0].error) throw rs[0].error;
      duesRates = rs[0].data || [];

      renderDues();
    }).catch(function (err) {

      '</div>' +
      '<div class="tabs dues-tabs">' +
      '<button' + (duesView === 'status' ? ' class="active"' : '') + ' data-duv="status">납부 현황</button>' +
      '<button' + (duesView === 'rates' ? ' class="active"' : '') + ' data-duv="rates">상회비 설정</button>' +
      '</div>' +
      (canDues && duesRates.length
        ? '<button class="btn ghost sm" id="du-print">인쇄</button>' +
          '<button class="btn ghost sm" id="du-pdf">PDF 저장</button>' : '') +
      (duesClosed
        ? '<span class="dues-closed-chip">마감됨</span>'
        : (canDues && duesRates.length
            ? '<button class="btn ghost sm" id="du-close">회계연도 마감</button>' : '')) +
      '</div>';
    if (duesClosed) {
      h += '<div class="notice-banner">' + duesYear + '년 상회비는 <strong>' +
        e(String(duesClosed.closed_on || '')) + '</strong>에 <strong>' +
        e(duesClosed.closed_by || '') + '</strong> 님이 마감했습니다. ' +
        '더는 고칠 수 없으며, 납입현황 PDF는 임원 자료실 <strong>회계</strong> 분류에 있습니다.' +
        (SHSAuth.canManageMembers(user)
          ? ' <button class="btn danger sm" id="du-reopen" style="margin-left:10px">마감 해제</button>' : '') +
        '</div>';
    }

    if (!duesRates.length) {
      h += '<div class="notice-banner">' + duesYear + '년 상회비 설정이 아직 없습니다.' +
        (canDues ? ' <button class="btn sm" id="du-copy" style="margin-left:10px">지난해 설정 불러오기</button>' : '') +
        '</div>';
      if (canDues && duesView === 'rates') h += ratesHtml();
      box.innerHTML = h;
      bindDuesHead();
      if (duesView === 'rates') bindRates();
      return;
    }

    if (duesView === 'rates') {
      h += ratesHtml();
      box.innerHTML = h;
      bindDuesHead(); bindRates();
      return;
    }

    /* ----- 대시보드 ----- */
    var totalMonthly = 0;
    duesRates.forEach(function (r) { totalMonthly += Number(r.monthly_amount || 0); });
    var paidSum = 0;
    duesPays.forEach(function (p2) {
      var r = duesRates.filter(function (x) { return x.church === p2.church; })[0];
      paidSum += p2.amount != null ? Number(p2.amount) : Number((r && r.monthly_amount) || 0);
    });
    var yearPlan = totalMonthly * 12;
    var rate = yearPlan ? Math.round(paidSum / yearPlan * 100) : 0;
    var curPaid = curMonth ? duesRates.filter(function (r) { return payOf(r.church, curMonth); }).length : 0;

    h += '<div class="dues-stats">' +
      '<div class="ds"><div class="n">' + duesRates.length + '곳</div><div class="l">교회 수</div></div>' +
      '<div class="ds"><div class="n">' + manwon(totalMonthly) + '</div><div class="l">월 부과액</div></div>' +
      '<div class="ds"><div class="n">' + manwon(paidSum) + '</div><div class="l">올해 납부액</div></div>' +
      '<div class="ds"><div class="n">' + rate + '%</div><div class="l">연간 납부율 (예정 ' + manwon(yearPlan) + ')</div></div>' +
      (curMonth ? '<div class="ds"><div class="n">' + curPaid + '/' + duesRates.length + '</div><div class="l">' + curMonth + '월 납부 교회</div></div>' : '') +
      '</div>';

    /* ----- 그래프: 달마다 납부한 교회 수 ----- */
    h += '<div class="dues-chart">';
    for (var m = 1; m <= 12; m++) {
      var cnt = 0, amt = 0;
      duesRates.forEach(function (r) {
        var p2 = payOf(r.church, m);
        if (p2) { cnt++; amt += paidAmount(r, p2); }
      });
      var pct = duesRates.length ? Math.round(cnt / duesRates.length * 100) : 0;
      h += '<div class="dc-col' + (m === curMonth ? ' cur' : '') + '" ' +
        'title="' + m + '월: ' + cnt + '/' + duesRates.length + '교회, ' + manwon(amt) + '원">' +
        '<div class="dc-v">' + (cnt || '') + '</div>' +
        '<div class="dc-track"><div class="dc-bar" style="height:' + pct + '%"></div></div>' +
        '<div class="dc-l">' + m + '월</div></div>';
    }
    h += '</div>';
    h += '<p style="font-size:0.82rem;color:var(--gray-5)">막대는 그 달에 상회비를 낸 교회 수입니다. ' +
      '막대에 마우스를 올리면 납부 교회 수와 금액이 보입니다.</p>';

    /* ----- 교회별 × 월별 납부표 ----- */
    h += '<div style="overflow-x:auto"><table class="tbl dues-tbl"><thead><tr>' +
      '<th style="min-width:110px">교회</th><th style="width:64px">월액</th>';
    for (m = 1; m <= 12; m++) h += '<th class="' + (m === curMonth ? 'cur' : '') + '">' + m + '</th>';
    h += '<th style="width:90px">납부 합계</th></tr></thead><tbody>';

    DUES_SICHALS.forEach(function (sc) {
      var rows = duesRates.filter(function (r) { return (r.sichal || '기타') === sc; });
      if (!rows.length) return;
      h += '<tr class="dues-sc"><td colspan="15">' + e(sc) + '</td></tr>';
      rows.forEach(function (r) {
        var sum = 0, months = 0;
        h += '<tr><td class="left">' + e(r.church) +
          (r.pastor ? ' <span class="dues-pastor">' + e(r.pastor) + '</span>' : '') + '</td>' +
          '<td>' + manwon(r.monthly_amount) + '</td>';
        for (m = 1; m <= 12; m++) {
          var p2 = payOf(r.church, m);
          if (p2) { sum += paidAmount(r, p2); months++; }
          h += '<td class="dues-cell' + (p2 ? ' paid' : '') + (m === curMonth ? ' cur' : '') + '"' +
            (canDues && !duesClosed ? ' data-duch="' + e(r.church) + '" data-dum="' + m + '"' : '') +
            (p2 ? ' title="' + e(String(p2.paid_on || '')) + ' 납부 ' + manwon(paidAmount(r, p2)) + '원"' : '') +
            '>' + (p2 ? '●' : '·') + '</td>';
        }
        h += '<td>' + months + '개월 · ' + manwon(sum) + '</td></tr>';
      });
    });
    h += '</tbody></table></div>';
    h += duesClosed
      ? ''
      : (canDues
        ? '<p style="font-size:0.82rem;color:var(--gray-5)">칸을 누르면 그 달을 납부로 표시하고, 다시 누르면 되돌립니다. ' +
          '금액은 설정된 월액으로 적히며, 월액이 0원인 교회는 누를 때 금액을 물어봅니다.</p>'
        : '<p style="font-size:0.82rem;color:var(--gray-5)">납부 입력은 회계·부회계와 관리자가 할 수 있습니다.</p>');

    box.innerHTML = h;
    bindDuesHead();
    bindDuesCells();
  }

  function bindDuesHead() {
    var box = duesBox();
    box.querySelector('#du-prev').addEventListener('click', function () { duesYear--; loadDues(); });
    box.querySelector('#du-next').addEventListener('click', function () { duesYear++; loadDues(); });
    box.querySelectorAll('.dues-tabs button').forEach(function (b) {
      b.addEventListener('click', function () { duesView = b.dataset.duv; renderDues(); });
    });
    var cl = box.querySelector('#du-close');
    if (cl) cl.addEventListener('click', closeDuesYear);
    var pr = box.querySelector('#du-print');
    if (pr) pr.addEventListener('click', printDues);
    var pf = box.querySelector('#du-pdf');
    if (pf) pf.addEventListener('click', saveDuesPdf);
    var ro = box.querySelector('#du-reopen');
    if (ro) ro.addEventListener('click', function () {
      if (!confirm(duesYear + '년 상회비 마감을 해제할까요?\n' +
        '임원 자료실 회계 분류의 마감 PDF는 그대로 남습니다.')) return;
      SHSCloud.init().then(function (c) {
        return c.from('dues_closings').delete().eq('year', duesYear);
      }).then(function (res) {
        if (res.error) { alert(res.error.message); return; }
        SHSCloud.log('update', '상회비 마감 해제', duesYear + '년');
        loadDues();
      });
    });

    var cp = box.querySelector('#du-copy');
    if (cp) cp.addEventListener('click', function () {
      SHSCloud.init().then(function (c) {
        return c.from('dues_rates').select('*').eq('year', duesYear - 1).order('sort');
      }).then(function (r) {
        var rows = r.data || [];
        if (!rows.length) { alert((duesYear - 1) + '년 설정이 없습니다.'); return; }
        if (!confirm((duesYear - 1) + '년 교회 ' + rows.length + '곳의 설정을 ' + duesYear + '년으로 불러올까요?')) return;
        return SHSCloud.init().then(function (c) {
          return c.from('dues_rates').insert(rows.map(function (x) {
            return { year: duesYear, sichal: x.sichal, church: x.church,
                     pastor: x.pastor || null,
                     monthly_amount: x.monthly_amount, sort: x.sort };
          }));
        }).then(function (res) {
          if (res.error) { alert(res.error.message); return; }
          SHSCloud.log('create', '상회비 설정 복사', (duesYear - 1) + '년 → ' + duesYear + '년 ' + rows.length + '곳');
          loadDues();
        });
      });
    });
  }

  function bindDuesCells() {
    if (!canDues) return;
    duesBox().querySelectorAll('td[data-duch]').forEach(function (td) {
      td.addEventListener('click', function () {
        var church = td.dataset.duch, m = +td.dataset.dum;
        var r = duesRates.filter(function (x) { return x.church === church; })[0];
        var p2 = payOf(church, m);
        SHSCloud.init().then(function (c) {
          if (p2) {
            if (!confirm(church + ' ' + m + '월 납부 표시를 지울까요?')) return null;
            return c.from('dues_payments').delete().eq('id', p2.id).then(function (res) {
              if (res.error) throw res.error;
              SHSCloud.log('delete', '상회비 납부 취소', duesYear + '년 ' + m + '월 ' + church);
            });
          }
          var amt = Number(r.monthly_amount || 0);
          if (!amt) {
            var v = prompt(church + ' ' + m + '월 납부액(만원)을 적어 주세요.', '0');
            if (v === null) return null;
            amt = Math.max(0, Math.round(Number(v) || 0));
          }
          return c.from('dues_payments').insert({
            year: duesYear, church: church, month: m,
            amount: amt === Number(r.monthly_amount || 0) ? null : amt,
            entered_by: user.name
          }).then(function (res) {
            if (res.error) throw res.error;
            SHSCloud.log('create', '상회비 납부 입력', duesYear + '년 ' + m + '월 ' + church + ' ' + amt + '만원');
          });
        }).then(function (done) {
          if (done !== null) loadDues();
        }).catch(function (err) { alert(err.message || err); });
      });
    });
  }

  /* ----- 납부 현황 인쇄·PDF 저장 (관리자·회계) ----- */
  function printDues() {
    var old = document.getElementById('dues-print');
    if (old) old.remove();
    if (!document.getElementById('dues-print-style')) {
      var st = document.createElement('style');
      st.id = 'dues-print-style';
      st.textContent = '#dues-print{display:none}' +
        '@media print{body>*:not(#dues-print){display:none!important}' +
        '#dues-print{display:block!important}@page{size:A4 portrait;margin:8mm}}';
      document.head.appendChild(st);
    }
    var wrap = document.createElement('div');
    wrap.id = 'dues-print';
    wrap.innerHTML = duesReportHtml();
    document.body.appendChild(wrap);
    window.addEventListener('afterprint', function once() {
      window.removeEventListener('afterprint', once);
      wrap.remove();
    });
    SHSCloud.log('view', '상회비 납입현황 인쇄', duesYear + '년');
    window.print();
  }

  function saveDuesPdf() {
    var btn = document.getElementById('du-pdf');
    if (btn) { btn.disabled = true; btn.textContent = '만드는 중...'; }
    function done() { if (btn) { btn.disabled = false; btn.textContent = 'PDF 저장'; } }
    var stage = document.createElement('div');
    stage.style.cssText = 'position:fixed;left:-11000px;top:0;width:800px;background:#fff';
    stage.innerHTML = duesReportHtml();
    document.body.appendChild(stage);
    loadPdfTool().then(function (html2pdf) {
      return html2pdf().set({
        margin: 6,
        filename: duesYear + '년 상회비 납입현황.pdf',
        pagebreak: { mode: ['css', 'legacy'] },
        html2canvas: { scale: 2, backgroundColor: '#ffffff' },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      }).from(stage.firstChild).save();
    }).then(function () {
      stage.remove(); done();
      SHSCloud.log('view', '상회비 납입현황 PDF 저장', duesYear + '년');
    }).catch(function (err) {
      stage.remove(); done();
      alert('PDF를 만들지 못했습니다: ' + (err.message || err));
    });
  }

  /* ----- 회계연도 마감 -----
   * 납입현황을 PDF 한 장으로 떠서 임원 자료실 회계 분류에 넣고, 그 해를 잠근다. */
  var duesPdfLoading = null;
  function loadPdfTool() {
    if (window.html2pdf) return Promise.resolve(window.html2pdf);
    if (duesPdfLoading) return duesPdfLoading;
    duesPdfLoading = new Promise(function (resolve, reject) {
      var sc = document.createElement('script');
      sc.src = 'https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js';
      sc.onload = function () { resolve(window.html2pdf); };
      sc.onerror = function () { duesPdfLoading = null; reject(new Error('PDF 도구를 불러오지 못했습니다.')); };
      document.head.appendChild(sc);
    });
    return duesPdfLoading;
  }

  /* 마감 보고서 (A4 가로) — 쪽 단위로 미리 나눠 만든다.
   * 한 장짜리 그림을 픽셀로 자르면 줄이 반으로 잘리므로,
   * 쪽마다 표 머리를 다시 붙인 완결된 표를 만들어 페이지를 넘긴다. */
  function duesReportHtml(dateLabel) {
    var totalMonthly = 0;
    duesRates.forEach(function (r) { totalMonthly += Number(r.monthly_amount || 0); });
    var paidSum = 0;
    duesPays.forEach(function (p2) {
      var r = duesRates.filter(function (x) { return x.church === p2.church; })[0];
      paidSum += p2.amount != null ? Number(p2.amount) : Number((r && r.monthly_amount) || 0);
    });

    /* PDF 도구가 판을 748px 폭으로 그리므로 그 폭에 맞춰 칸을 짠다 */
    var td = 'border:1px solid #999;padding:2px 3px;white-space:nowrap;';
    function headRow() {
      var o = '<tr style="background:#eef1f6">' +
        '<th style="' + td + 'width:48px">시찰</th>' +
        '<th style="' + td + '">교회</th>' +
        '<th style="' + td + 'width:54px">교역자</th>' +
        '<th style="' + td + 'width:34px">월액</th>';
      for (var m = 1; m <= 12; m++) o += '<th style="' + td + 'width:22px">' + m + '</th>';
      return o + '<th style="' + td + 'width:52px">합계</th></tr>';
    }

    /* 줄을 시찰 순서대로 편다 (rowspan 은 쪽 넘김에서 깨지므로 쓰지 않는다) */
    var flat = [];
    DUES_SICHALS.forEach(function (sc) {
      duesRates.filter(function (r) { return (r.sichal || '기타') === sc; })
        .forEach(function (r) { flat.push({ r: r, sc: sc }); });
    });

    function rowHtml(x, showSc) {
      var r = x.r, sum = 0;
      var o = '<tr>' +
        '<td style="' + td + 'text-align:center">' + (showSc ? e(x.sc) : '') + '</td>' +
        '<td style="' + td + '">' + e(r.church) + '</td>' +
        '<td style="' + td + '">' + e(r.pastor || '') + '</td>' +
        '<td style="' + td + 'text-align:right">' + Number(r.monthly_amount || 0) + '</td>';
      for (var m2 = 1; m2 <= 12; m2++) {
        var p2 = payOf(r.church, m2);
        if (p2) sum += paidAmount(r, p2);
        o += '<td style="' + td + 'text-align:center">' + (p2 ? '●' : '') + '</td>';
      }
      return o + '<td style="' + td + 'text-align:right">' + sum + '</td></tr>';
    }

    var FIRST = 40, REST = 45;      /* 쪽마다 담을 줄 수 (A4 세로, 여유 있게) */
    var pages = [], idx = 0, pageNo = 0;
    while (idx < flat.length || pageNo === 0) {
      var chunk = flat.slice(idx, idx + (pageNo === 0 ? FIRST : REST));
      idx += chunk.length;
      var last = idx >= flat.length;
      var pg = '<div class="dues-pg" style="background:#fff;color:#222;' +
        "font-family:'Noto Sans KR',sans-serif;" +
        (last ? '' : 'page-break-after:always;') + '">';
      if (pageNo === 0) {
        pg += '<h1 style="font-size:20px;text-align:center;margin:0 0 4px">' + duesYear +
          '년 시화산노회 상회비 납입현황</h1>' +
          '<p style="text-align:center;font-size:11px;color:#666;margin:0 0 10px">' +
          '교회 ' + duesRates.length + '곳 · 월 부과액 ' + manwon(totalMonthly) + '원 · ' +
          '연간 납부액 ' + manwon(paidSum) + '원 · ' + (dateLabel || '출력일') + ' ' +
          new Date().toISOString().slice(0, 10) + '</p>';
      } else {
        pg += '<p style="font-size:11px;color:#666;margin:0 0 6px">' + duesYear +
          '년 시화산노회 상회비 납입현황 — 계속 (' + (pageNo + 1) + '쪽)</p>';
      }
      var lastSc = null;
      pg += '<table style="width:100%;border-collapse:collapse;font-size:10px;table-layout:fixed">' +
        '<thead>' + headRow() + '</thead><tbody>' +
        chunk.map(function (x) {
          var show = x.sc !== lastSc;
          lastSc = x.sc;
          return rowHtml(x, show);
        }).join('') + '</tbody></table>';
      if (last) {
        pg += '<p style="font-size:10px;color:#666;margin-top:8px">' +
          '단위: 만원 · ● = 납부 · 시화산노회 홈페이지 상회비 관리에서 생성</p>';
      }
      pages.push(pg + '</div>');
      pageNo++;
      if (pageNo > 40) break;
    }
    return '<div style="padding:8px 6px">' + pages.join('') + '</div>';
  }

  function closeDuesYear() {
    if (!confirm(duesYear + '년 상회비를 마감할까요?\n\n' +
      '· 마감하면 설정과 납부 기록을 더 고칠 수 없습니다.\n' +
      '· 납입현황이 PDF로 만들어져 임원 자료실 회계 분류에 저장됩니다.\n' +
      '· 마감 해제는 관리자(노회장·서기·간사)만 할 수 있습니다.')) return;

    var stage = document.createElement('div');
    stage.style.cssText = 'position:fixed;left:-11000px;top:0;width:800px;background:#fff';
    stage.innerHTML = duesReportHtml('마감일');
    document.body.appendChild(stage);

    loadPdfTool().then(function (html2pdf) {
      return html2pdf().set({
        margin: 6,
        pagebreak: { mode: ['css', 'legacy'] },
        html2canvas: { scale: 2, backgroundColor: '#ffffff' },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      }).from(stage.firstChild).outputPdf('blob');
    }).then(function (blob) {
      stage.remove();
      var file = new File([blob], duesYear + '년 상회비 납입현황(마감).pdf', { type: 'application/pdf' });
      /* 자료 보관소의 회계 칸에 올린다 */
      return odPut(file, 'officer', '회계').then(function (url) {
        return SHSCloud.init().then(function (c) {
          return c.from('archive_items').insert({
            section: '회계', access: 'officer',
            title: duesYear + '년 상회비 납입현황 (마감)',
            description: '상회비 관리에서 회계연도를 마감하며 자동 저장된 납입현황입니다.',
            doc_date: new Date().toISOString().slice(0, 10),
            sort: duesYear * 100 + 99,
            file_path: url, file_name: file.name,
            updated_by: user.name
          }).select('id').single().then(function (res) {
            if (res.error) throw res.error;
            return c.from('dues_closings').insert({
              year: duesYear, closed_by: user.name, archive_id: res.data.id
            });
          });
        });
      });
    }).then(function (res) {
      if (res && res.error) throw res.error;
      SHSCloud.log('update', '상회비 회계연도 마감',
        duesYear + '년 마감, 납입현황 PDF를 회계 분류에 저장');
      alert(duesYear + '년 상회비를 마감했습니다.\n납입현황 PDF가 임원 자료실 회계 분류에 저장되었습니다.');
      loadDues();
      loadOfficerDocs(true);
    }).catch(function (err) {
      stage.remove();
      alert('마감하지 못했습니다: ' + (err.message || err));
    });
  }

  /* ----- 상회비 설정 ----- */
  function ratesHtml() {
    var canEditRates = canDues && !duesClosed;
    var h = '<p style="color:var(--gray-5);font-size:0.88rem">교회마다 매달 내는 상회비입니다. 단위는 만원입니다.' +
      (duesClosed ? ' 이 해는 마감되어 고칠 수 없습니다.'
        : (canDues ? ' 고치고 저장을 누르면 바로 반영됩니다.' : ' 설정 변경은 회계·부회계와 관리자가 합니다.')) + '</p>';
    h += '<div style="overflow-x:auto"><table class="tbl" style="max-width:760px"><thead><tr>' +
      '<th style="width:120px">시찰</th><th>교회</th><th style="width:120px">담임목사</th>' +
      '<th style="width:110px">월액(만원)</th>' +
      (canEditRates ? '<th style="width:130px">관리</th>' : '') + '</tr></thead><tbody>';
    duesRates.forEach(function (r) {
      h += '<tr data-durate="' + r.id + '">' +
        (canEditRates
          ? '<td><select data-df="sichal">' + DUES_SICHALS.map(function (x) {
              return '<option' + ((r.sichal || '기타') === x ? ' selected' : '') + '>' + x + '</option>';
            }).join('') + '</select></td>' +
            '<td><input type="text" data-df="church" value="' + e(r.church) + '"></td>' +
            '<td><input type="text" data-df="pastor" value="' + e(r.pastor || '') + '"></td>' +
            '<td><input type="number" data-df="amount" min="0" value="' + Number(r.monthly_amount || 0) + '"></td>' +
            '<td><button class="btn sm" data-dusave="' + r.id + '">저장</button> ' +
            '<button class="btn danger sm" data-dudel="' + r.id + '" data-dun="' + e(r.church) + '">삭제</button></td>'
          : '<td>' + e(r.sichal || '기타') + '</td><td class="left">' + e(r.church) + '</td>' +
            '<td>' + e(r.pastor || '') + '</td>' +
            '<td>' + manwon(r.monthly_amount) + '</td>') +
        '</tr>';
    });
    h += '</tbody></table></div>';
    if (canEditRates) {
      h += '<div class="admin-card" style="max-width:640px;margin-top:14px"><h4 style="margin:0 0 10px">교회 추가</h4>' +
        '<div class="inline-form">' +
        '<div class="field" style="flex:0 0 140px"><label>시찰</label><select id="du-nsc">' +
        DUES_SICHALS.map(function (x) { return '<option>' + x + '</option>'; }).join('') + '</select></div>' +
        '<div class="field"><label>교회</label><input type="text" id="du-nch" placeholder="예: 반월"></div>' +
        '<div class="field" style="flex:0 0 130px"><label>담임목사</label><input type="text" id="du-npt"></div>' +
        '<div class="field" style="flex:0 0 120px"><label>월액(만원)</label><input type="number" id="du-namt" min="0" value="0"></div>' +
        '<button class="btn" id="du-nadd">추가</button></div>' +
        '<div class="form-msg" id="du-nmsg"></div></div>';
    }
    return h;
  }

  function bindRates() {
    if (!canDues || duesClosed) return;
    var box = duesBox();
    box.querySelectorAll('button[data-dusave]').forEach(function (b) {
      b.addEventListener('click', function () {
        var tr = b.closest('tr');
        function v(f) { return tr.querySelector('[data-df="' + f + '"]').value.trim(); }
        var d = { sichal: v('sichal'), church: v('church'),
                  pastor: v('pastor') || null,
                  monthly_amount: Math.max(0, Math.round(Number(v('amount')) || 0)) };
        if (!d.church) { alert('교회 이름은 비울 수 없습니다.'); return; }
        SHSCloud.init().then(function (c) {
          return c.from('dues_rates').update(d).eq('id', b.dataset.dusave);
        }).then(function (res) {
          if (res.error) { alert(res.error.message); return; }
          SHSCloud.log('update', '상회비 설정 수정', duesYear + '년 ' + d.church + ' ' + d.monthly_amount + '만원');
          loadDues();
        });
      });
    });
    box.querySelectorAll('button[data-dudel]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (!confirm('"' + b.dataset.dun + '" 설정을 지울까요? (이미 입력한 납부 기록은 남습니다)')) return;
        SHSCloud.init().then(function (c) {
          return c.from('dues_rates').delete().eq('id', b.dataset.dudel);
        }).then(function (res) {
          if (res.error) { alert(res.error.message); return; }
          SHSCloud.log('delete', '상회비 설정 삭제', duesYear + '년 ' + b.dataset.dun);
          loadDues();
        });
      });
    });
    var add = box.querySelector('#du-nadd');
    if (add) add.addEventListener('click', function () {
      var msg = box.querySelector('#du-nmsg');
      var d = {
        year: duesYear,
        sichal: box.querySelector('#du-nsc').value,
        church: box.querySelector('#du-nch').value.trim(),
        pastor: box.querySelector('#du-npt').value.trim() || null,
        monthly_amount: Math.max(0, Math.round(Number(box.querySelector('#du-namt').value) || 0)),
        sort: (duesRates.length ? Math.max.apply(null, duesRates.map(function (x) { return Number(x.sort || 0); })) : 0) + 1
      };
      if (!d.church) { msg.className = 'form-msg err'; msg.textContent = '교회 이름을 적어 주세요.'; return; }
      SHSCloud.init().then(function (c) {
        return c.from('dues_rates').insert(d);
      }).then(function (res) {
        if (res.error) {
          msg.className = 'form-msg err';
          msg.textContent = res.error.code === '23505' ? '같은 교회가 이미 있습니다.' : res.error.message;
          return;
        }
        SHSCloud.log('create', '상회비 설정 추가', duesYear + '년 ' + d.church + ' ' + d.monthly_amount + '만원');
        loadDues();
      });
    });
  }

  loadDues();
 });
});
</script>
</body>
</html>
