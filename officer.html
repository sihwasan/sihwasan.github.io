<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>임원방 - 시화산노회</title>
<link rel="stylesheet" href="css/style.css?v=20260828">
</head>
<body>

<div class="page-head">
  <div class="container">
    <h1>임원방</h1>
    <div class="crumb">홈 &gt; 임원방</div>
  </div>
</div>

<main class="page-body container" id="main">
  <div id="officer-area"></div>
</main>

<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="private/resolutions.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-auth.js"></script>
<script src="js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
 SHS.getUser().then(function (user) {
  var area = document.getElementById('officer-area');
  var e = SHS.esc;

  /* 임원방 접근: 노회 임원 전원
   * (노회장·부노회장·서기·부서기·회록서기·부회록서기·회계·부회계)과 간사 */
  var hasAccess = SHSAuth.isOfficer(user);

  if (!user) {
    area.innerHTML =
      '<div class="notice-banner">임원방은 노회 임원만 이용할 수 있습니다. ' +
      '로그인 후 이용해 주시기 바랍니다. <a class="btn sm" style="margin-left:10px" href="login.html">로그인</a></div>';
    return;
  }
  if (!hasAccess) {
    area.innerHTML =
      '<div class="notice-banner">임원방은 <strong>노회 임원</strong>이 이용할 수 있는 공간입니다. ' +
      '현재 등급(' + SHS.displayRole(user.role, user.title) + ')으로는 열람할 수 없습니다. ' +
      '임원이신데 들어오지 못하시면 노회 사무실로 알려 주시기 바랍니다.</div>';
    return;
  }

  var html = '';
  html += '<div class="notice-banner"><strong>' + e(SHS.honorific(user)) + '</strong>, 임원방에 오신 것을 환영합니다.</div>';

  /* 자료 아카이브 자리 (임원방에 들어오면 가장 먼저 보이는 영역) */
  html += '<h2>임원 자료실</h2>';
  html += '<div id="oa-area"><p style="color:var(--gray-5)">불러오는 중...</p></div>';

  /* 임원회 결의사항 전체 (공개 저장소 미포함 자료) */
  html += '<h2>임원회 결의사항</h2>';
  if (SHSData.resolutions && SHSData.resolutions.length) {
    SHSData.resolutions.forEach(function (r) {
      var items = '';
      r.items.forEach(function (it, i) { items += '<li>' + (i + 1) + '. ' + e(it) + '</li>'; });
      html += '<div class="side-box" style="margin-bottom:18px"><div class="box-head">' + e(r.session) + '</div>' +
        '<div class="box-body"><ol style="list-style:none">' + items + '</ol></div></div>';
    });
  } else {
    html += '<div class="notice-banner">결의사항 자료는 보안을 위해 인터넷 홈페이지에 게시하지 않습니다. ' +
      '서버 인증 연동 후 온라인으로 제공될 예정이며, 현재는 노회 사무실에서 열람하실 수 있습니다.</div>';
  }

  /* 서류 발급 대장 */
  html += '<h2>서류 발급 대장</h2>';
  html += '<p>홈페이지에서 발급한 서류의 기록입니다. 발급 업무는 <a href="documents.html" style="text-decoration:underline;color:var(--navy)">서류 발급</a> 페이지에서 처리합니다.</p>';
  var log = [];
  try { log = JSON.parse(localStorage.getItem('shs_doclog_v1')) || []; } catch (x) {}
  if (!log.length) {
    html += '<p style="color:var(--gray-5)">발급 기록이 없습니다.</p>';
  } else {
    html += '<table class="tbl"><thead><tr><th>발급번호</th><th>발급일</th><th>서류명</th><th>대상자</th><th>교회</th><th>용도</th><th>발급자</th></tr></thead><tbody>';
    log.slice().reverse().forEach(function (d) {
      html += '<tr><td>' + e(d.no) + '</td><td>' + e(d.date) + '</td><td>' + e(d.doc) + '</td><td>' + e(d.name) + '</td><td>' + e(d.church) + '</td><td>' + e(d.purpose) + '</td><td>' + e(d.issuer) + '</td></tr>';
    });
    html += '</tbody></table>';
  }

  /* 교회상황 보고서 (연도별) — 각 교회가 시찰 화면에서 올린 것을 임원이 모아 본다 */
  html += '<h2>교회상황 보고서</h2>';
  html += '<p>각 교회가 시찰회 화면에서 올린 해마다의 교회상황 보고서입니다. ' +
    '연도를 고르면 그 해에 낸 교회와 아직 내지 않은 교회를 함께 보실 수 있습니다.</p>';
  html += '<div id="cr-area"><p style="color:var(--gray-5)">불러오는 중...</p></div>';

  /* 예전에는 여기에 관리 화면으로 가는 카드가 늘어서 있었으나, 같은 곳을
   * 상단 '관리자' 메뉴가 이미 가리키고 있어 길이 두 갈래가 되어 있었다.
   * 이제 관리 화면은 상단 메뉴 한 곳으로만 들어간다. */
  html += '<h2>임원 업무</h2>';
  html += '<p>노회 회의록은 상단 <strong>임원방</strong> 메뉴에서 여실 수 있습니다.' +
    (SHSAuth.canManageMembers(user)
      ? ' 사이트 관리·회원 관리·서류 발급·자료·회칙 관리·직인·도장·시스템 운영은 ' +
        '상단 <strong>관리자</strong> 메뉴에 모아 두었습니다.'
      : '') +
    '</p>';

  area.innerHTML = html;
  SHS.sectionize(area);
  loadChurchReports();

  /* ================= 교회상황 보고서 (연도별) =================
   * 각 교회는 시찰회 화면에서 올리고, 임원은 여기서 모아 봅니다.
   * 누가 볼 수 있는지는 데이터베이스가 정하므로(임원·그 시찰 임원·그 교회),
   * 여기서는 돌아온 것을 그대로 보여 주기만 합니다. */
  var crRows = [], crChurches = [], crYear = new Date().getFullYear();

  function loadChurchReports() {
    var box = document.getElementById('cr-area');
    if (!box) return;
    if (!(user.cloud && window.SHSCloud && SHSCloud.enabled())) {
      box.innerHTML = '<p style="color:var(--gray-5)">서버 로그인 후 교회상황 보고서를 보실 수 있습니다.</p>';
      return;
    }
    SHSCloud.init().then(function (c) {
      return Promise.all([
        c.from('church_reports').select('*').order('year', { ascending: false }).order('church'),
        c.from('sichal_churches').select('sichal,name,pastor,sort').order('sichal').order('sort')
      ]);
    }).then(function (rs) {
      if (rs[0].error) {
        box.innerHTML = '<p style="color:var(--gray-5)">교회상황 보고서를 불러오지 못했습니다: ' +
          e(rs[0].error.message) +
          '<br>Supabase에서 <strong>35_sichal.sql</strong>을 아직 실행하지 않으셨다면 먼저 실행해 주세요.</p>';
        return;
      }
      crRows = rs[0].data || [];
      crChurches = (rs[1] && rs[1].data) || [];
      drawChurchReports();
    }).catch(function (x) {
      box.innerHTML = '<p style="color:var(--gray-5)">교회상황 보고서를 불러오지 못했습니다: ' +
        e((x && x.message) || '') + '</p>';
    });
  }

  function drawChurchReports() {
    var box = document.getElementById('cr-area');
    var years = {};
    crRows.forEach(function (r) { years[r.year] = 1; });
    years[crYear] = 1;
    var yearList = Object.keys(years).map(Number).sort(function (a, b) { return b - a; });

    var mine = crRows.filter(function (r) { return r.year === crYear; });
    var byChurch = {};
    mine.forEach(function (r) { byChurch[r.church] = r; });

    var h = '<div class="inline-form" style="margin-bottom:10px">' +
      '<div class="field" style="flex:0 0 180px"><label>연도</label><select id="cr-year">' +
      yearList.map(function (y) {
        return '<option value="' + y + '"' + (y === crYear ? ' selected' : '') + '>' + y + '년</option>';
      }).join('') + '</select></div>' +
      '<div class="field" style="flex:0 0 200px"><label>&nbsp;</label>' +
      '<div style="padding-top:8px;color:var(--gray-7);font-size:0.9rem">제출 ' + mine.length + '곳' +
      (crChurches.length ? ' / 관내 ' + crChurches.length + '곳' : '') + '</div></div>' +
      '</div>';

    /* 관내 교회 목록이 있으면 그것을 기준으로, 없으면 제출된 것만 늘어놓는다 */
    var list = crChurches.length
      ? crChurches.map(function (c) { return { sichal: c.sichal, church: c.name, pastor: c.pastor, r: byChurch[c.name] }; })
      : mine.map(function (r) { return { sichal: r.sichal, church: r.church, pastor: r.pastor, r: r }; });

    if (!list.length) {
      box.innerHTML = h + '<p style="color:var(--gray-5)">등록된 교회상황 보고서가 없습니다.</p>';
      bindCrYear();
      return;
    }

    h += '<table class="tbl"><thead><tr><th style="width:110px">시찰</th><th style="width:160px">교회</th>' +
      '<th style="width:100px">담임</th><th style="width:90px">전체 교인</th>' +
      '<th style="width:90px">세례교인</th><th style="width:100px">평균 출석</th>' +
      '<th style="width:90px">제출</th><th style="width:150px">보기</th></tr></thead><tbody>';
    list.forEach(function (x) {
      var r = x.r;
      h += '<tr' + (r ? '' : ' style="opacity:.55"') + '>' +
        '<td>' + e(x.sichal || '-') + '</td><td>' + e(x.church) + '</td>' +
        '<td>' + e((r && r.pastor) || x.pastor || '-') + '</td>' +
        '<td>' + (r && r.members_total != null ? r.members_total : '-') + '</td>' +
        '<td>' + (r && r.members_baptized != null ? r.members_baptized : '-') + '</td>' +
        '<td>' + (r && r.worship_avg != null ? r.worship_avg : '-') + '</td>' +
        '<td>' + (r ? '<span class="role-badge">제출</span>' : '<span style="color:var(--gray-5)">미제출</span>') + '</td>' +
        '<td>' +
        (r ? '<button class="btn sm" data-crview="' + r.id + '">내용</button> ' : '') +
        (r && r.file_path ? '<button class="btn ghost sm" data-crfile="' + r.id + '">첨부</button>' : '') +
        (!r ? '<span style="color:var(--gray-5)">-</span>' : '') +
        '</td></tr>';
    });
    h += '</tbody></table><div id="cr-view"></div>';
    box.innerHTML = h;
    bindCrYear();

    box.querySelectorAll('button[data-crview]').forEach(function (b) {
      b.addEventListener('click', function () {
        var r = crRows.filter(function (x) { return String(x.id) === b.dataset.crview; })[0];
        if (!r) return;
        document.getElementById('cr-view').innerHTML = crReportView(r);
        SHS.logAction('view', '교회상황 보고서 열람', r.year + '년 ' + r.church);
        document.getElementById('cr-view').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    });
    box.querySelectorAll('button[data-crfile]').forEach(function (b) {
      b.addEventListener('click', function () {
        var r = crRows.filter(function (x) { return String(x.id) === b.dataset.crfile; })[0];
        if (!r) return;
        SHSCloud.init().then(function (c) {
          return c.storage.from('church-reports').createSignedUrl(r.file_path, 60);
        }).then(function (rr) {
          if (rr.error) { alert('내려받지 못했습니다: ' + rr.error.message); return; }
          SHSCloud.log('view', '교회상황 보고서 첨부 내려받기', r.year + '년 ' + r.church);
          window.open(rr.data.signedUrl, '_blank', 'noopener');
        });
      });
    });
  }

  function bindCrYear() {
    var sel = document.getElementById('cr-year');
    if (sel) sel.addEventListener('change', function () {
      crYear = parseInt(this.value, 10);
      drawChurchReports();
    });
  }

  var CR_FIELDS = [
    { g: '교인 현황', k: 'members_total',    t: '전체 교인' },
    { g: '교인 현황', k: 'members_baptized', t: '세례교인' },
    { g: '교인 현황', k: 'members_new',      t: '새가족 등록' },
    { g: '직원 현황', k: 'staff_pastors',    t: '교역자' },
    { g: '직원 현황', k: 'staff_elders',     t: '장로' },
    { g: '직원 현황', k: 'staff_deacons',    t: '안수집사' },
    { g: '직원 현황', k: 'staff_kwonsa',     t: '권사' },
    { g: '예배·교육', k: 'worship_avg',      t: '주일 낮 평균 출석' },
    { g: '예배·교육', k: 'school_total',     t: '교회학교 학생' },
    { g: '재정(원)',  k: 'budget_year',      t: '당해 예산' },
    { g: '재정(원)',  k: 'offering_year',    t: '연간 헌금' }
  ];

  function crReportView(r) {
    var h = '<div class="admin-card" style="margin-top:14px"><h3 style="margin-top:0">' +
      r.year + '년 ' + e(r.church) + ' 교회상황 보고서</h3>' +
      '<p style="color:var(--gray-5);font-size:0.85rem">' + e(r.sichal || '') +
      ' · 담임 ' + e(r.pastor || '-') + ' · 제출 ' + e(r.submitted_by || '-') +
      ' · ' + e(String(r.updated_at || r.created_at || '').slice(0, 10)) + '</p>';
    var groups = {};
    CR_FIELDS.forEach(function (f) { (groups[f.g] = groups[f.g] || []).push(f); });
    Object.keys(groups).forEach(function (g) {
      h += '<h4 style="margin:14px 0 6px;color:var(--navy)">' + e(g) + '</h4>' +
        '<table class="tbl" style="margin-bottom:0"><tbody><tr>' +
        groups[g].map(function (f) { return '<th>' + e(f.t) + '</th>'; }).join('') + '</tr><tr>' +
        groups[g].map(function (f) {
          var v = r[f.k];
          return '<td>' + (v == null ? '-' : Number(v).toLocaleString('ko-KR')) + '</td>';
        }).join('') + '</tr></tbody></table>';
    });
    if (r.dues_paid) h += '<p style="margin-top:12px"><strong>상회비</strong> ' + e(r.dues_paid) + '</p>';
    if (r.note) h += '<p><strong>특기사항</strong><br><span style="white-space:pre-wrap">' + e(r.note) + '</span></p>';
    if (r.file_name) h += '<p style="color:var(--gray-5);font-size:0.85rem">첨부 : ' + e(r.file_name) + '</p>';
    return h + '</div>';
  }

  /* ================= 자료 아카이브 ================= */
  var LEVELS = [
    { v: '일반', d: '임원이 함께 보는 일반 문서입니다.' },
    { v: '대외비', d: '노회 밖으로 나가서는 안 되는 문서입니다. 임원만 열람합니다.' },
    { v: '기밀', d: '노회장·부노회장·서기·간사만 열람합니다. 재판·징계·개인 신상 등 민감한 문서를 보관합니다.' }
  ];
  var PREFIX = { '일반': 'general', '대외비': 'confidential', '기밀': 'secret' };
  var curLevel = '일반';
  var oaFile = null;

  function oaBox() { return document.getElementById('oa-area'); }

  function renderArchiveShell() {
    var visible = LEVELS.filter(function (L) { return SHSAuth.canViewLevel(user, L.v); });
    var html2 = '<div class="notice-banner">보안 등급에 따라 열람 범위가 다릅니다. ' +
      '모든 열람·등록·수정·삭제는 감사 기록에 남습니다.</div>';
    html2 += '<div class="tabs" id="oa-tabs">' +
      visible.map(function (L, i) {
        return '<button class="' + (i === 0 ? 'active' : '') + '" data-lv="' + e(L.v) + '">' + e(L.v) + '자료</button>';
      }).join('') + '</div>';
    html2 += '<p id="oa-desc" style="color:var(--gray-5);font-size:0.88rem"></p>';
    html2 += '<div id="oa-form"></div>';
    html2 += '<div id="oa-list"></div>';
    oaBox().innerHTML = html2;

    if (!visible.length) {
      oaBox().innerHTML = '<div class="notice-banner">열람 가능한 자료 등급이 없습니다.</div>';
      return;
    }
    curLevel = visible[0].v;
    oaBox().querySelectorAll('#oa-tabs button').forEach(function (b) {
      b.addEventListener('click', function () {
        oaBox().querySelectorAll('#oa-tabs button').forEach(function (x) { x.classList.remove('active'); });
        b.classList.add('active');
        curLevel = b.dataset.lv;
        loadArchive();
      });
    });
    loadArchive();
  }

  function renderForm() {
    var box = document.getElementById('oa-form');
    if (!SHSAuth.canEditLevel(user, curLevel)) { box.innerHTML = ''; return; }
    box.innerHTML =
      '<div class="admin-card" style="margin-bottom:16px">' +
      '<h3 style="margin-top:0" id="oa-ftitle">' + e(curLevel) + '자료 등록</h3>' +
      '<input type="hidden" id="oa-id">' +
      '<div class="inline-form" style="margin-bottom:8px">' +
      '<div class="field"><label>제목</label><input type="text" id="oa-title"></div>' +
      '<div class="field" style="flex:0 0 150px"><label>분류</label><input type="text" id="oa-cat" placeholder="예: 공문"></div>' +
      '<div class="field" style="flex:0 0 165px"><label>문서 날짜</label><input type="date" id="oa-date"></div>' +
      '</div>' +
      '<div class="field"><label>내용</label><textarea id="oa-body" rows="5"></textarea></div>' +
      '<div class="field"><label>첨부파일 (선택)</label><input type="file" id="oa-file">' +
      '<span style="font-size:0.8rem;color:var(--gray-5)">첨부파일은 비공개 저장소에 보관되며, 열람 권한이 있는 분만 내려받을 수 있습니다.</span></div>' +
      '<button class="btn" id="oa-save">저장</button> ' +
      '<button class="btn ghost hidden" id="oa-cancel">새 자료로 전환</button>' +
      '<div class="form-msg" id="oa-msg"></div></div>';

    SHS.dropZone(document.getElementById('oa-file'), { what: '첨부파일' });
    document.getElementById('oa-file').addEventListener('change', function () {
      oaFile = this.files[0] || null;
    });
    document.getElementById('oa-cancel').addEventListener('click', function () {
      ['oa-id', 'oa-title', 'oa-cat', 'oa-body'].forEach(function (id) { document.getElementById(id).value = ''; });
      document.getElementById('oa-ftitle').textContent = curLevel + '자료 등록';
      this.classList.add('hidden');
    });
    document.getElementById('oa-save').addEventListener('click', saveDoc);
  }

  function saveDoc() {
    var msg = document.getElementById('oa-msg');
    var id = document.getElementById('oa-id').value;
    var d = {
      level: curLevel,
      title: document.getElementById('oa-title').value.trim(),
      category: document.getElementById('oa-cat').value.trim(),
      doc_date: document.getElementById('oa-date').value || null,
      body: document.getElementById('oa-body').value.trim(),
      updated_at: new Date().toISOString()
    };
    if (!d.title) { msg.className = 'form-msg err'; msg.textContent = '제목을 입력해 주세요.'; return; }
    if (!user.cloud) { msg.className = 'form-msg err'; msg.textContent = '서버 로그인 후 이용할 수 있습니다.'; return; }
    msg.className = 'form-msg'; msg.textContent = '저장 중입니다...';

    SHSCloud.init().then(function (c) {
      var pre = Promise.resolve(null);
      if (oaFile) {
        var path = PREFIX[curLevel] + '/' + Date.now() + '-' + oaFile.name.replace(/[^\w.\-가-힣]/g, '_');
        pre = c.storage.from('officer-docs').upload(path, oaFile).then(function (r) {
          if (r.error) throw r.error;
          return { file_path: path, file_name: oaFile.name };
        });
      }
      return pre.then(function (f) {
        if (f) { d.file_path = f.file_path; d.file_name = f.file_name; }
        if (!id) { d.author_id = user.id; d.author_name = user.name; }
        return id ? c.from('officer_docs').update(d).eq('id', id)
                  : c.from('officer_docs').insert(d);
      });
    }).then(function (res) {
      if (res.error) { msg.className = 'form-msg err'; msg.textContent = res.error.message; return; }
      SHSCloud.log(id ? 'update' : 'create', '임원 자료 ' + (id ? '수정' : '등록'),
        '[' + curLevel + '] ' + d.title);
      oaFile = null;
      loadArchive();
    }).catch(function (err) {
      msg.className = 'form-msg err';
      msg.textContent = '저장 실패: ' + (err.message || err);
    });
  }

  function loadArchive() {
    var descEl = document.getElementById('oa-desc');
    var lv = LEVELS.filter(function (L) { return L.v === curLevel; })[0];
    if (descEl && lv) descEl.textContent = lv.d;
    renderForm();

    var list = document.getElementById('oa-list');
    if (!user.cloud) {
      list.innerHTML = '<div class="notice-banner">자료 아카이브는 서버에 보관되어 있습니다. ' +
        '서버 계정(구글 또는 이메일)으로 로그인해 주세요.</div>';
      return;
    }
    list.innerHTML = '<p style="color:var(--gray-5)">불러오는 중...</p>';
    SHSCloud.init().then(function (c) {
      return c.from('officer_docs').select('*').eq('level', curLevel)
        .order('doc_date', { ascending: false }).order('id', { ascending: false });
    }).then(function (r) {
      if (r.error) {
        list.innerHTML = '<div class="notice-banner">불러오지 못했습니다: ' + e(r.error.message) +
          ' (09 임원 자료실 등록이 필요할 수 있습니다)</div>';
        return;
      }
      var rows = r.data || [];
      SHS.logAction('view', '임원 자료실 열람', '[' + curLevel + '] 목록 ' + rows.length + '건');
      if (!rows.length) { list.innerHTML = '<p style="color:var(--gray-5)">등록된 자료가 없습니다.</p>'; return; }
      var canEd = SHSAuth.canEditLevel(user, curLevel);
      var h = '<table class="tbl"><thead><tr><th style="width:70px">번호</th><th style="width:100px">분류</th>' +
        '<th>제목</th><th style="width:110px">문서 날짜</th><th style="width:90px">첨부</th>' +
        (canEd ? '<th style="width:130px">관리</th>' : '') + '</tr></thead><tbody>';
      rows.forEach(function (d, i) {
        h += '<tr><td>' + (rows.length - i) + '</td><td>' + e(d.category || '-') + '</td>' +
          '<td class="left"><a href="#" data-oaview="' + i + '" style="color:var(--navy);text-decoration:underline">' + e(d.title) + '</a>' +
          (d.author_name ? '<div style="font-size:0.75rem;color:var(--gray-5)">' + e(d.author_name) + '</div>' : '') + '</td>' +
          '<td>' + e(d.doc_date || '-') + '</td>' +
          '<td>' + (d.file_path ? '<button class="btn ghost sm" data-oafile="' + i + '">내려받기</button>' : '-') + '</td>' +
          (canEd ? '<td><button class="btn ghost sm" data-oaedit="' + i + '">수정</button> ' +
                   '<button class="btn danger sm" data-oadel="' + i + '">삭제</button></td>' : '') +
          '</tr>';
      });
      h += '</tbody></table><div id="oa-view"></div>';
      list.innerHTML = h;

      list.querySelectorAll('a[data-oaview]').forEach(function (a) {
        a.addEventListener('click', function (ev) {
          ev.preventDefault();
          var d = rows[+a.dataset.oaview];
          document.getElementById('oa-view').innerHTML =
            '<div class="side-box" style="margin-top:16px"><div class="box-head">' +
            '[' + e(d.level) + '] ' + e(d.title) + '</div><div class="box-body">' +
            '<p style="font-size:0.82rem;color:var(--gray-5)">' +
            e(d.category || '') + (d.doc_date ? ' · ' + e(d.doc_date) : '') +
            (d.author_name ? ' · ' + e(d.author_name) : '') + '</p>' +
            String(d.body || '').split('\n').map(function (l) {
              return l.trim() ? '<p style="margin-bottom:6px">' + e(l) + '</p>' : '';
            }).join('') +
            '</div></div>';
          SHS.logAction('view', '임원 자료 열람', '[' + d.level + '] ' + d.title);
          document.getElementById('oa-view').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });
      });

      list.querySelectorAll('button[data-oafile]').forEach(function (b) {
        b.addEventListener('click', function () {
          var d = rows[+b.dataset.oafile];
          SHSCloud.init().then(function (c) {
            return c.storage.from('officer-docs').createSignedUrl(d.file_path, 60);
          }).then(function (r) {
            if (r.error) { alert('내려받지 못했습니다: ' + r.error.message); return; }
            SHSCloud.log('view', '임원 자료 첨부 내려받기', '[' + d.level + '] ' + d.title);
            window.open(r.data.signedUrl, '_blank');
          });
        });
      });

      if (!canEd) return;
      list.querySelectorAll('button[data-oaedit]').forEach(function (b) {
        b.addEventListener('click', function () {
          var d = rows[+b.dataset.oaedit];
          document.getElementById('oa-id').value = d.id;
          document.getElementById('oa-title').value = d.title;
          document.getElementById('oa-cat').value = d.category || '';
          document.getElementById('oa-date').value = d.doc_date || '';
          document.getElementById('oa-body').value = d.body || '';
          document.getElementById('oa-ftitle').textContent = curLevel + '자료 수정';
          document.getElementById('oa-cancel').classList.remove('hidden');
          document.getElementById('oa-ftitle').scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
      });
      list.querySelectorAll('button[data-oadel]').forEach(function (b) {
        b.addEventListener('click', function () {
          var d = rows[+b.dataset.oadel];
          if (!confirm('"' + d.title + '" 자료를 삭제하시겠습니까? 되돌릴 수 없습니다.')) return;
          SHSCloud.init().then(function (c) {
            var pre = d.file_path
              ? c.storage.from('officer-docs').remove([d.file_path]).catch(function () {})
              : Promise.resolve();
            return pre.then(function () { return c.from('officer_docs').delete().eq('id', d.id); });
          }).then(function (res) {
            if (res.error) { alert(res.error.message); return; }
            SHSCloud.log('delete', '임원 자료 삭제', '[' + d.level + '] ' + d.title);
            loadArchive();
          });
        });
      });
    });
  }

  renderArchiveShell();
 });
});
</script>
</body>
</html>
