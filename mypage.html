<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 정보 - 시화산노회</title>
<link rel="stylesheet" href="css/style.css?v=20260831k">
</head>
<body>

<div class="page-head">
  <div class="container">
    <h1>내 정보</h1>
    <div class="crumb">홈 &gt; 내 정보</div>
  </div>
</div>

<main class="page-body container" id="main">
  <div id="my-area"></div>
</main>

<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-auth.js"></script>
<script src="js/main.js?v=20260830d"></script>
<script src="js/addr-search.js?v=20260830a"></script>
<script src="js/my-duties.js"></script>
<script src="js/date-pick.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var user = SHSAuth.currentUser();
  var area = document.getElementById('my-area');
  var e = SHS.esc;

  /* 구글 로그인(서버) 회원이면 서버 정보로 화면을 구성한다. */
  if (!user && window.SHSCloud && SHSCloud.enabled()) {
    SHSCloud.loadProfile().then(function (p) {
      if (!p) {
        area.innerHTML =
          '<div class="notice-banner">로그인 후 이용할 수 있습니다. ' +
          '<a class="btn sm" style="margin-left:10px" href="login.html">로그인</a></div>';
        return;
      }
      /* 회원에 관한 내용은 노회 명단이 원본이다. 명단 기록을 먼저 얹는다. */
      return SHSCloud.init().then(function (c) {
        return c.rpc('my_member');
      }).then(function (r) {
        var m = r && r.data && r.data[0];
        if (m) {
          p.roster_id   = m.out_id;
          p.name        = m.out_name || p.name;
          p.church      = m.out_church || p.church;
          p.position    = m.out_position || p.position;
          p.phone       = m.out_phone || p.phone;
          p.birth_date  = m.out_birth_date || p.birth_date;
          p.address     = m.out_address || p.address;
          p.postcode    = m.out_postcode || p.postcode;
          p.church_addr = m.out_church_addr || p.church_addr;
          p.photo_path  = m.out_photo_path || p.photo_path;
          p.served_from = m.out_served_from || null;
        }
        renderCloud(p);
      }).catch(function () { renderCloud(p); });
    });
    return;
  }

  if (!user) {
    area.innerHTML =
      '<div class="notice-banner">로그인 후 이용할 수 있습니다. ' +
      '<a class="btn sm" style="margin-left:10px" href="login.html">로그인</a></div>';
    return;
  }

  /* 2001-04-01 → '2001년 4월 1일', 그리고 오늘까지 몇 년 몇 개월째인지 */
  function sinceText(d) {
    var t = d ? new Date(String(d).slice(0, 10) + 'T00:00:00') : null;
    if (!t || isNaN(t)) return null;
    var now = new Date();
    var months = (now.getFullYear() - t.getFullYear()) * 12 + (now.getMonth() - t.getMonth());
    if (now.getDate() < t.getDate()) months--;
    if (months < 0) months = 0;
    var y = Math.floor(months / 12), m = months % 12;
    var span = y ? y + '년' + (m ? ' ' + m + '개월' : '') : m + '개월';
    return {
      date: t.getFullYear() + '년 ' + (t.getMonth() + 1) + '월 ' + t.getDate() + '일',
      span: span + '째'
    };
  }

  /* ---------- 구글 로그인 회원용 화면 ---------- */
  function renderCloud(p) {
    var churches = [];
    SHSData.sichals.forEach(function (s) { churches = churches.concat(s.churches); });
    churches.sort();
    if (p.church && churches.indexOf(p.church) === -1) churches.unshift(p.church);

    var html = '';
    html += '<div class="notice-banner"><strong>' + e(p.name || p.email) + '</strong> 님의 현재 등급은 ' +
      '<strong>' + SHS.displayRole(p.role, p.title) + '</strong>' + (p.title ? ' (' + e(p.title) + ')' : '') + '입니다. ';
    html += p.role === 'pending'
      ? '성명과 소속 교회가 노회 명단과 일치하지 않아 승인대기 상태입니다. 아래에서 정확히 수정하시면 등급이 자동으로 부여됩니다.'
      : '성명 또는 소속 교회를 수정하면 노회 명단과 다시 대조하여 등급이 갱신됩니다.';
    html += '</div>';

    html += '<h2>회원 정보</h2>';
    html += '<div class="form-card" style="max-width:520px;margin:0">' +
      '<div class="field"><label>이메일 (구글 계정)</label><input type="email" value="' + e(p.email) + '" disabled></div>' +
      '<div class="field"><label>성명</label><input type="text" id="q-name" value="' + e(p.name || '') + '"></div>' +
      '<div class="field"><label>직분</label><select id="q-pos">' +
      ['목사', '위임목사', '부목사', '강도사', '전도사', '장로', '간사'].map(function (x) {
        return '<option' + (p.position === x ? ' selected' : '') + '>' + x + '</option>';
      }).join('') + '</select></div>' +
      '<div class="field"><label>소속 교회</label><select id="q-church">' +
      '<option value="">— 선택하세요 —</option>' +
      churches.map(function (c) {
        return '<option' + (p.church === c ? ' selected' : '') + '>' + e(c) + '</option>';
      }).join('') + '</select></div>' +
      '<div class="field"><label>연락처</label><input type="tel" id="q-phone" value="' + e(p.phone || '') + '" placeholder="010-0000-0000"></div>' +
      '<div class="field"><label>생년월일</label>' +
      '<input type="date" id="q-birth" data-birth value="' + e(p.birth_date || '') + '">' +
      '<span style="font-size:0.8rem;color:var(--gray-5)">총회 정년(만 70세) 확인과 회원명단 카드의 남은 임기 표시에 사용됩니다.</span></div>' +
      (function () {
        var sv = sinceText(p.served_from);
        return '<div class="field"><label>부임(위임)일</label>' +
          '<input type="text" value="' +
          (sv ? sv.date + ' — 위임 ' + sv.span : '아직 등록되지 않았습니다') + '" disabled>' +
          '<span style="font-size:0.8rem;color:var(--gray-5)">부임(위임)일은 재직증명서의 재직 기간에 쓰입니다. ' +
          '수정이 필요하시면 노회 서기에게 문의해 주세요.</span></div>';
      })() +
      '<div class="inline-form" style="margin-bottom:16px">' +
      '<div class="field" style="flex:0 0 130px"><label>우편번호</label>' +
      '<input type="text" id="q-post" value="' + e(p.postcode || '') + '" placeholder="00000" maxlength="7"></div>' +
      '<div class="field"><label>주소</label>' +
      '<input type="text" id="q-addr" value="' + e(p.address || '') + '" placeholder="예: 경기도 화성시 ○○로 12"></div>' +
      '<button class="btn ghost sm" data-addrsearch="q-addr,q-post" ' +
      'style="align-self:flex-end;margin-bottom:2px">주소 검색</button>' +
      '</div>' +
      '<p style="font-size:0.8rem;color:var(--gray-5);margin-top:-8px">주소는 한 칸입니다. 증명서·보고서 등 모든 문서에 이 주소가 쓰입니다.</p>' +
      '<p style="font-size:0.82rem;color:var(--gray-5)">여기 적으신 내용은 <strong>노회 명단</strong>에 그대로 저장되어, ' +
      '회원명단 카드와 주소록에 함께 반영됩니다. 성명·교회·직분을 고치면 명단과 다시 대조하여 등급이 갱신됩니다.</p>' +
      '<button class="btn" id="q-save" style="width:100%">저장</button>' +
      '<div class="form-msg" id="q-msg"></div>' +
      '</div>';

    /* 내가 노회에서 맡은 일 — 시찰과 상비부, 그 안에서의 직책 */
    html += '<h2>노회에서 맡은 일</h2>';
    html += '<div id="duty-area" style="max-width:620px"></div>';

    /* 내 사진: 회원명단 카드에 보여진다 */
    html += '<h2>내 사진</h2>';
    html += '<div class="form-card" style="max-width:520px;margin:0">' +
      '<div class="ph-wrap">' +
      '<div class="ph-preview" id="ph-preview">사진 없음</div>' +
      '<div class="ph-drop" id="ph-drop">여기에 사진을 끌어다 놓거나<br><span>눌러서 선택</span>하세요' +
      '<small>어떤 크기의 사진이든 자동으로 웹 크기로 줄여 저장합니다</small></div>' +
      '</div>' +
      '<input type="file" id="ph-file" accept="image/*" class="hidden">' +
      '<button class="btn ghost hidden" id="ph-del" style="width:100%;margin-top:12px">사진 지우기</button>' +
      '<div class="form-msg" id="ph-msg"></div>' +
      '<p style="font-size:0.82rem;color:var(--gray-5);margin-top:8px">사진은 비공개 보관소에 저장되며, ' +
      '정회원에게만 회원명단 카드에서 보여집니다.</p>' +
      '</div>';

    /* 교회 직인·도장: 교회상황 보고서 등 문서 하단에 찍힌다 */
    html += '<h2>교회 직인·도장</h2>';
    html += '<div class="form-card" style="max-width:520px;margin:0">' +
      '<div class="ph-wrap">' +
      '<div class="ph-preview seal-preview" id="sl-preview">직인 없음</div>' +
      '<div class="ph-drop" id="sl-drop">직인이나 도장을 찍은 사진·그림 파일을<br>' +
      '끌어다 놓거나 <span>눌러서 선택</span>하세요' +
      '<small>흰 바탕은 자동으로 투명하게 지워져, 문서 위에 자연스럽게 찍힙니다</small></div>' +
      '</div>' +
      '<input type="file" id="sl-file" accept="image/*" class="hidden">' +
      '<button class="btn ghost hidden" id="sl-del" style="width:100%;margin-top:12px">직인 지우기</button>' +
      '<div class="form-msg" id="sl-msg"></div>' +
      '<p style="font-size:0.82rem;color:var(--gray-5);margin-top:8px">본인만 보고 쓸 수 있으며, ' +
      '<strong>교회상황 보고서</strong>를 제출하거나 인쇄할 때 문서 하단 (직인) 자리에 찍힙니다.</p>' +
      '</div>';

    /* 노회장 전용: 차기 노회장에게 권한 이양 */
    if (p.role === 'president') {
      html += '<h2>차기 노회장에게 관리자 권한 넘기기</h2>';
      html += '<div class="form-card" style="max-width:520px;margin:0;border-color:var(--red)">' +
        '<p style="font-size:0.9rem;color:var(--gray-7);margin-bottom:14px">' +
        '임기를 마치시고 차기 노회장께 홈페이지 관리 권한을 넘기실 때 사용합니다.<br><br>' +
        '<strong style="color:var(--red)">넘기시는 즉시 회원님의 등급은 정회원으로 바뀌고, ' +
        '관리자 기능을 더 이상 사용하실 수 없습니다. 되돌릴 수 없습니다.</strong><br><br>' +
        '차기 노회장께는 취임 축하와 권한 안내가 알림으로 전달됩니다.</p>' +
        '<div class="field"><label>차기 노회장</label><select id="t-target"><option value="">— 불러오는 중 —</option></select></div>' +
        '<div class="field"><label>확인을 위해 차기 노회장의 성명을 그대로 입력하세요</label>' +
        '<input type="text" id="t-name" placeholder="위에서 선택한 분의 성명"></div>' +
        '<button class="btn danger" id="t-go" style="width:100%">권한 넘기기</button>' +
        '<div class="form-msg" id="t-msg"></div>' +
        '</div>';
    }

    html += '<h2>비밀번호 변경</h2>';
    html += '<div class="form-card" style="max-width:520px;margin:0">' +
      '<p style="font-size:0.88rem;color:var(--gray-7);margin-bottom:16px">' +
      '이메일로 가입하신 경우 여기서 비밀번호를 바꾸실 수 있습니다.<br>' +
      '구글 계정으로 로그인하신 경우에는 구글에서 관리하므로 바꾸실 필요가 없습니다.</p>' +
      '<div class="field"><label>새 비밀번호 (6자 이상)</label><input type="password" id="q-pw1" autocomplete="new-password"></div>' +
      '<div class="field"><label>새 비밀번호 확인</label><input type="password" id="q-pw2" autocomplete="new-password"></div>' +
      '<button class="btn" id="q-pwsave" style="width:100%">비밀번호 변경</button>' +
      '<div class="form-msg" id="q-pwmsg"></div>' +
      '</div>';

    html += '<h2>로그아웃</h2>';
    html += '<div class="form-card" style="max-width:520px;margin:0">' +
      '<button class="btn ghost" id="q-out" style="width:100%">로그아웃</button>' +
      '</div>';

    html += '<h2>회원 탈퇴</h2>';
    html += '<div class="form-card" style="max-width:520px;margin:0">' +
      '<p style="font-size:0.88rem;color:var(--gray-7);margin-bottom:16px">' +
      '탈퇴하시면 회원 정보가 삭제되며 되돌릴 수 없습니다. 탈퇴 기록은 감사 기록으로 보존됩니다.</p>' +
      '<button class="btn danger" id="q-del" style="width:100%">회원 탈퇴</button>' +
      '<div class="form-msg" id="q-dmsg"></div>' +
      '</div>';

    area.innerHTML = html;
    SHSDate.attachAll(area);   /* 생년월일 — 손으로 적거나 굴려서 고른다 */
    setupPhoto();
    setupSeal();
    SHSMyDuties.mount(document.getElementById('duty-area'), p);

    /* ---------- 교회 직인·도장 올리기 ----------
     * 흰 바탕을 투명하게 지우고 420px 이하 PNG로 줄여
     * member_seals 표(본인 전용)에 저장한다. */
    function setupSeal() {
      var drop = document.getElementById('sl-drop');
      var fileIn = document.getElementById('sl-file');
      var preview = document.getElementById('sl-preview');
      var delBtn = document.getElementById('sl-del');
      var msg = document.getElementById('sl-msg');
      if (!drop) return;

      function setMsg(t, err) {
        msg.className = 'form-msg' + (err ? ' err' : ' ok');
        msg.textContent = t || '';
      }
      function show(dataUrl) {
        if (dataUrl) {
          preview.innerHTML = '<img src="' + dataUrl + '" alt="교회 직인">';
          delBtn.classList.remove('hidden');
        } else {
          preview.textContent = '직인 없음';
          delBtn.classList.add('hidden');
        }
      }

      SHSCloud.init().then(function (c) {
        return c.from('member_seals').select('image').eq('user_id', p.id);
      }).then(function (r) {
        var row = r.data && r.data[0];
        if (row) show(row.image);
      }).catch(function () {});

      /* 420px 이하로 줄이고, 흰 바탕(밝은 회색까지)을 투명하게 지운다 */
      function toSeal(f) {
        return new Promise(function (resolve, reject) {
          var img = new Image();
          var url = URL.createObjectURL(f);
          img.onload = function () {
            var MAX = 420;
            var sc = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
            var w = Math.max(1, Math.round(img.naturalWidth * sc));
            var hh = Math.max(1, Math.round(img.naturalHeight * sc));
            var cv = document.createElement('canvas');
            cv.width = w; cv.height = hh;
            var cx = cv.getContext('2d');
            cx.drawImage(img, 0, 0, w, hh);
            URL.revokeObjectURL(url);
            try {
              var d = cx.getImageData(0, 0, w, hh);
              var a = d.data;
              for (var i = 0; i < a.length; i += 4) {
                var mn = Math.min(a[i], a[i + 1], a[i + 2]);
                if (mn > 235) a[i + 3] = 0;                       /* 흰 바탕 */
                else if (mn > 200) a[i + 3] = Math.round(a[i + 3] * (235 - mn) / 35);
              }
              cx.putImageData(d, 0, 0);
            } catch (x) { /* 못 지워도 그대로 저장한다 */ }
            resolve(cv.toDataURL('image/png'));
          };
          img.onerror = function () {
            URL.revokeObjectURL(url);
            reject(new Error('그림 파일을 읽지 못했습니다.'));
          };
          img.src = url;
        });
      }

      function upload(f) {
        if (!f) return;
        if (!/^image\//.test(f.type)) { setMsg('그림 파일만 올릴 수 있습니다.', true); return; }
        setMsg('직인을 다듬어 저장하는 중입니다…');
        toSeal(f).then(function (dataUrl) {
          if (dataUrl.length > 900000) throw new Error('그림이 너무 큽니다. 더 작은 파일로 올려 주세요.');
          return SHSCloud.init().then(function (c) {
            return c.from('member_seals').upsert({
              user_id: p.id, image: dataUrl, updated_at: new Date().toISOString()
            });
          }).then(function (r) {
            if (r.error) throw r.error;
            SHSCloud.log('update', '교회 직인 등록', p.email);
            setMsg('직인이 저장되었습니다. 이제 보고서에 찍을 수 있습니다.');
            show(dataUrl);
          });
        }).catch(function (err) {
          setMsg((err && err.message) || '직인을 올리지 못했습니다.', true);
        });
      }

      drop.addEventListener('click', function () { fileIn.click(); });
      fileIn.addEventListener('change', function () {
        upload(fileIn.files && fileIn.files[0]);
        fileIn.value = '';
      });
      ['dragenter', 'dragover'].forEach(function (ev) {
        drop.addEventListener(ev, function (x) {
          x.preventDefault(); x.stopPropagation();
          drop.classList.add('over');
        });
      });
      ['dragleave', 'drop'].forEach(function (ev) {
        drop.addEventListener(ev, function (x) {
          x.preventDefault(); x.stopPropagation();
          drop.classList.remove('over');
        });
      });
      drop.addEventListener('drop', function (x) {
        upload(x.dataTransfer && x.dataTransfer.files && x.dataTransfer.files[0]);
      });
      delBtn.addEventListener('click', function () {
        if (!confirm('등록된 직인을 지우시겠습니까?')) return;
        SHSCloud.init().then(function (c) {
          return c.from('member_seals').delete().eq('user_id', p.id);
        }).then(function (r) {
          if (r.error) throw r.error;
          SHSCloud.log('update', '교회 직인 삭제', p.email);
          setMsg('직인을 지웠습니다.');
          show(null);
        }).catch(function () { setMsg('직인을 지우지 못했습니다.', true); });
      });
    }

    /* ---------- 내 사진 올리기 ----------
     * 끌어다 놓거나 눌러서 선택하면 캔버스로 웹 크기(긴 변 480px, JPEG)로
     * 줄인 뒤 비공개 보관소의 내 폴더(내 uid)에 저장한다. */
    function setupPhoto() {
      var drop = document.getElementById('ph-drop');
      var fileIn = document.getElementById('ph-file');
      var preview = document.getElementById('ph-preview');
      var delBtn = document.getElementById('ph-del');
      var msg = document.getElementById('ph-msg');
      if (!drop) return;

      function setMsg(t, err) {
        msg.className = 'form-msg' + (err ? ' err' : ' ok');
        msg.textContent = t || '';
      }

      function refresh() {
        if (!p.photo_path) {
          preview.textContent = '사진 없음';
          delBtn.classList.add('hidden');
          return;
        }
        delBtn.classList.remove('hidden');
        SHSCloud.init().then(function (c) {
          return c.storage.from('member-photos').createSignedUrl(p.photo_path, 300);
        }).then(function (r) {
          if (r.data && r.data.signedUrl) {
            preview.innerHTML = '<img src="' + e(r.data.signedUrl) + '" alt="내 사진">';
          }
        }).catch(function () {});
      }

      /* 긴 변 480px, JPEG 85%로 줄인다 */
      function shrink(f) {
        return new Promise(function (resolve, reject) {
          var img = new Image();
          var url = URL.createObjectURL(f);
          img.onload = function () {
            var MAX = 480;
            var sc = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
            var cw = Math.max(1, Math.round(img.naturalWidth * sc));
            var ch = Math.max(1, Math.round(img.naturalHeight * sc));
            var cv = document.createElement('canvas');
            cv.width = cw; cv.height = ch;
            cv.getContext('2d').drawImage(img, 0, 0, cw, ch);
            URL.revokeObjectURL(url);
            cv.toBlob(function (b) {
              if (b) resolve(b);
              else reject(new Error('사진을 변환하지 못했습니다.'));
            }, 'image/jpeg', 0.85);
          };
          img.onerror = function () {
            URL.revokeObjectURL(url);
            reject(new Error('사진 파일을 읽지 못했습니다.'));
          };
          img.src = url;
        });
      }

      function uploadPhoto(f) {
        if (!f) return;
        if (!/^image\//.test(f.type)) {
          setMsg('이미지 파일만 올릴 수 있습니다.', true);
          return;
        }
        setMsg('사진을 웹 크기로 줄여서 올리는 중입니다…');
        shrink(f).then(function (blob) {
          return SHSCloud.init().then(function (c) {
            var path = p.id + '/photo.jpg';
            return c.storage.from('member-photos')
              .upload(path, blob, { upsert: true, contentType: 'image/jpeg' })
              .then(function (r) {
                if (r.error) throw r.error;
                return c.from('profiles').update({
                  photo_path: path,
                  updated_at: new Date().toISOString()
                }).eq('id', p.id).then(function (r0) {
                  /* 사진도 명단에 함께 남겨 회원명단 카드에서 보이게 한다 */
                  return c.rpc('update_my_member', {
                    p_phone: null, p_address: null, p_postcode: null,
                    p_church_addr: null, p_birth_date: null, p_photo_path: path
                  }).then(function () { return r0; });
                });
              }).then(function (r2) {
                if (r2.error) throw r2.error;
                p.photo_path = path;
                SHSCloud.log('update', '내 사진 등록', p.email);
                setMsg('사진이 저장되었습니다.');
                refresh();
              });
          });
        }).catch(function (err) {
          setMsg((err && err.message) || '사진을 올리지 못했습니다.', true);
        });
      }

      drop.addEventListener('click', function () { fileIn.click(); });
      fileIn.addEventListener('change', function () {
        uploadPhoto(fileIn.files && fileIn.files[0]);
        fileIn.value = '';
      });
      ['dragenter', 'dragover'].forEach(function (ev) {
        drop.addEventListener(ev, function (x) {
          x.preventDefault(); x.stopPropagation();
          drop.classList.add('over');
        });
      });
      ['dragleave', 'drop'].forEach(function (ev) {
        drop.addEventListener(ev, function (x) {
          x.preventDefault(); x.stopPropagation();
          drop.classList.remove('over');
        });
      });
      drop.addEventListener('drop', function (x) {
        uploadPhoto(x.dataTransfer && x.dataTransfer.files && x.dataTransfer.files[0]);
      });

      delBtn.addEventListener('click', function () {
        if (!p.photo_path) return;
        if (!confirm('등록된 사진을 지우시겠습니까?')) return;
        SHSCloud.init().then(function (c) {
          return c.storage.from('member-photos').remove([p.photo_path])
            .then(function () {
              return c.from('profiles').update({
                photo_path: null,
                updated_at: new Date().toISOString()
              }).eq('id', p.id);
            });
        }).then(function () {
          p.photo_path = null;
          SHSCloud.log('update', '내 사진 삭제', p.email);
          setMsg('사진을 지웠습니다.');
          refresh();
        }).catch(function () {
          setMsg('사진을 지우지 못했습니다.', true);
        });
      });

      refresh();
    }

    document.getElementById('q-save').addEventListener('click', function () {
      var msg = document.getElementById('q-msg');
      var name = document.getElementById('q-name').value.trim();
      var church = document.getElementById('q-church').value;
      if (!name || !church) {
        msg.className = 'form-msg err';
        msg.textContent = '성명과 소속 교회를 입력해 주세요.';
        return;
      }
      /* 위임목사 직분 확인: 조직교회 담임만 가능 */
      var adj = SHS.adjustPosition(name, church, document.getElementById('q-pos').value);
      if (adj.blocked) {
        msg.className = 'form-msg err';
        msg.textContent = adj.msg;
        return;
      }
      if (adj.note) alert(adj.note);
      msg.className = 'form-msg';
      msg.textContent = '저장 중입니다...';
      SHSCloud.claimMembership(name, church, adj.position,
        document.getElementById('q-phone').value.trim()).then(function (r) {
        if (!r.ok) {
          msg.className = 'form-msg err';
          msg.textContent = r.msg;
          return;
        }
        /* 연락처·주소·생년월일은 노회 명단에 저장한다 (명단이 원본이다) */
        return SHSCloud.init().then(function (c) {
          return c.rpc('update_my_member', {
            p_phone:       document.getElementById('q-phone').value.trim(),
            p_address:     document.getElementById('q-addr').value.trim(),
            p_postcode:    document.getElementById('q-post').value.trim(),
            p_church_addr: null,
            p_birth_date:  SHSDate.get(document.getElementById('q-birth')) || null,
            p_photo_path:  null
          });
        }).then(function (r2) {
          if (r2 && r2.data && r2.data[0] && !r2.data[0].out_ok) {
            alert(r2.data[0].out_msg);
          }
          alert('저장되었습니다. 현재 등급: ' + r.roleName + (r.title ? ' (' + r.title + ')' : ''));
          location.reload();
        });
      });
    });

    document.getElementById('q-pwsave').addEventListener('click', function () {
      var msg = document.getElementById('q-pwmsg');
      var a = document.getElementById('q-pw1').value;
      var b = document.getElementById('q-pw2').value;
      if (a.length < 6) {
        msg.className = 'form-msg err';
        msg.textContent = '비밀번호는 6자 이상으로 입력해 주세요.';
        return;
      }
      if (a !== b) {
        msg.className = 'form-msg err';
        msg.textContent = '새 비밀번호가 서로 일치하지 않습니다.';
        return;
      }
      msg.className = 'form-msg';
      msg.textContent = '변경 중입니다...';
      SHSCloud.init().then(function (c) {
        return c.auth.updateUser({ password: a });
      }).then(function (r) {
        if (r.error) {
          msg.className = 'form-msg err';
          msg.textContent = r.error.message;
          return;
        }
        SHSCloud.log('update', '비밀번호 변경', p.email);
        msg.className = 'form-msg ok';
        msg.textContent = '비밀번호가 변경되었습니다.';
        document.getElementById('q-pw1').value = '';
        document.getElementById('q-pw2').value = '';
      });
    });

    document.getElementById('q-out').addEventListener('click', function () {
      SHSCloud.signOut().then(function () { location.href = 'index.html'; });
    });

    /* ---------- 노회장 권한 이양 ---------- */
    if (p.role === 'president') {
      var sel = document.getElementById('t-target');
      SHSCloud.init().then(function (c) {
        return c.from('profiles').select('id,name,church,role,position')
          .in('role', ['member', 'officer', 'clerk', 'staff']).order('name');
      }).then(function (r) {
        var list = (r.data || []).filter(function (x) { return x.id !== p.id; });
        sel.innerHTML = '<option value="">— 선택하세요 —</option>' +
          list.map(function (x) {
            return '<option value="' + e(x.id) + '">' + e(x.name || '(이름 없음)') +
              ' · ' + e(x.church || '') + ' (' + SHS.displayRole(x.role) + ')</option>';
          }).join('');
      });

      document.getElementById('t-go').addEventListener('click', function () {
        var msg = document.getElementById('t-msg');
        var targetId = sel.value;
        var typed = document.getElementById('t-name').value.trim();
        if (!targetId) { msg.className = 'form-msg err'; msg.textContent = '차기 노회장을 선택해 주세요.'; return; }
        if (!typed) { msg.className = 'form-msg err'; msg.textContent = '확인을 위해 성명을 입력해 주세요.'; return; }

        var label = sel.options[sel.selectedIndex].textContent;
        if (!confirm('정말 노회장 권한을 넘기시겠습니까?\n\n대상: ' + label +
                     '\n\n넘기시는 즉시 회원님은 정회원이 되고 관리자 기능을 사용하실 수 없습니다.\n되돌릴 수 없습니다.')) return;
        if (!confirm('다시 한 번 확인합니다.\n\n"' + typed + '" 님에게 노회장 권한을 넘깁니다.\n\n진행하시겠습니까?')) return;

        msg.className = 'form-msg';
        msg.textContent = '처리 중입니다...';
        SHSCloud.init().then(function (c) {
          return c.rpc('transfer_presidency', { p_target_id: targetId, p_confirm_name: typed });
        }).then(function (r) {
          if (r.error) {
            msg.className = 'form-msg err';
            msg.textContent = r.error.message;
            return;
          }
          alert('권한 이양이 완료되었습니다.\n\n' + r.data + ' 님이 새 노회장이 되셨습니다.\n' +
                '회원님의 등급은 정회원으로 바뀌었습니다.\n\n그동안 노회를 섬겨 주셔서 감사합니다.');
          location.href = 'index.html';
        });
      });
    }

    document.getElementById('q-del').addEventListener('click', function () {
      if (!confirm('정말 탈퇴하시겠습니까? 회원 정보가 삭제되며 되돌릴 수 없습니다.')) return;
      SHSCloud.init().then(function (c) {
        return c.from('profiles').delete().eq('id', p.id).then(function (r) {
          if (r.error) {
            var msg = document.getElementById('q-dmsg');
            msg.className = 'form-msg err';
            msg.textContent = r.error.message;
            return;
          }
          return SHSCloud.signOut().then(function () {
            alert('탈퇴가 완료되었습니다. 그동안 이용해 주셔서 감사합니다.');
            location.href = 'index.html';
          });
        });
      });
    });
  }

  function render() {
    var u = SHSAuth.currentUser();
    var html = '';

    /* 현재 등급 안내 */
    html += '<div class="notice-banner"><strong>' + e(u.name) + '</strong> 님의 현재 등급은 ' +
      '<strong>' + SHSAuth.roleName(u.role) + '</strong>' +
      (u.title ? ' (' + e(u.title) + ')' : '') + '입니다. ';
    if (u.role === 'pending') {
      html += '성명과 소속 교회가 노회 명단과 일치하지 않아 승인대기 상태입니다. ' +
        '아래에서 정보를 정확히 수정하시면 등급이 자동으로 부여됩니다.';
    } else {
      html += '성명 또는 소속 교회를 수정하면 노회 명단과 다시 대조하여 등급이 갱신됩니다.';
    }
    html += '</div>';

    /* 회원 정보 수정 */
    html += '<h2>회원 정보</h2>';
    html += '<div class="form-card" style="max-width:520px;margin:0">' +
      '<div class="field"><label>이메일 (로그인 아이디)</label><input type="email" id="p-email" value="' + e(u.id) + '"></div>' +
      '<div class="field"><label>성명</label><input type="text" id="p-name" value="' + e(u.name) + '"></div>' +
      '<div class="field"><label>직분</label><select id="p-pos">' +
      ['목사', '장로', '간사', '관리자'].map(function (x) {
        return '<option' + (u.position === x ? ' selected' : '') + '>' + x + '</option>';
      }).join('') +
      '</select></div>' +
      '<div class="field"><label>소속 교회</label><input type="text" id="p-church" value="' + e(u.church || '') + '"></div>' +
      '<div class="field"><label>연락처 (선택)</label><input type="tel" id="p-phone" value="' + e(u.phone || '') + '" placeholder="010-0000-0000"></div>' +
      '<button class="btn" id="btn-save" style="width:100%">저장</button>' +
      '<div class="form-msg" id="p-msg"></div>' +
      '</div>';

    /* 비밀번호 변경 */
    html += '<h2>비밀번호 변경</h2>';
    html += '<div class="form-card" style="max-width:520px;margin:0">' +
      '<div class="field"><label>현재 비밀번호</label><input type="password" id="c-now" autocomplete="current-password"></div>' +
      '<div class="field"><label>새 비밀번호 (4자 이상)</label><input type="password" id="c-new" autocomplete="new-password"></div>' +
      '<div class="field"><label>새 비밀번호 확인</label><input type="password" id="c-new2" autocomplete="new-password"></div>' +
      '<button class="btn" id="btn-pw" style="width:100%">비밀번호 변경</button>' +
      '<div class="form-msg" id="c-msg"></div>' +
      '</div>';

    /* 회원 탈퇴 */
    html += '<h2>회원 탈퇴</h2>';
    html += '<div class="form-card" style="max-width:520px;margin:0">' +
      '<p style="font-size:0.88rem;color:var(--gray-7);margin-bottom:16px">' +
      '탈퇴하시면 회원 정보가 삭제되며 되돌릴 수 없습니다. ' +
      '작성하신 게시글은 남아 있으므로 필요하시면 탈퇴 전에 삭제해 주세요. ' +
      '탈퇴 기록은 감사 기록으로 보존됩니다.</p>' +
      '<div class="field"><label>확인을 위해 비밀번호를 입력하세요</label><input type="password" id="w-pw" autocomplete="current-password"></div>' +
      '<button class="btn danger" id="btn-withdraw" style="width:100%">회원 탈퇴</button>' +
      '<div class="form-msg" id="w-msg2"></div>' +
      '</div>';

    area.innerHTML = html;
    bind();
  }

  function bind() {
    document.getElementById('btn-save').addEventListener('click', function () {
      var msg = document.getElementById('p-msg');
      var u = SHSAuth.currentUser();
      var r = SHSAuth.updateProfile(u.id, {
        email: document.getElementById('p-email').value.trim(),
        name: document.getElementById('p-name').value.trim(),
        position: document.getElementById('p-pos').value,
        church: document.getElementById('p-church').value.trim(),
        phone: document.getElementById('p-phone').value.trim()
      });
      if (!r.ok) {
        msg.className = 'form-msg err';
        msg.textContent = r.msg;
        return;
      }
      if (!r.changed.length) {
        msg.className = 'form-msg';
        msg.textContent = '변경된 내용이 없습니다.';
        return;
      }
      /* 이메일(아이디)이 바뀌면 세션도 새 아이디로 다시 연결 */
      if (r.newId !== u.id) {
        SHSAuth.logout();
        alert('이메일이 변경되었습니다. 새 이메일로 다시 로그인해 주세요.');
        location.href = 'login.html';
        return;
      }
      alert(r.changed.join(', ') + ' 정보가 저장되었습니다.' +
        (r.reassigned ? '\n노회 명단과 일치하여 등급이 ' + r.reassigned + '(으)로 갱신되었습니다.' : ''));
      location.reload();
    });

    document.getElementById('btn-pw').addEventListener('click', function () {
      var msg = document.getElementById('c-msg');
      var n1 = document.getElementById('c-new').value;
      var n2 = document.getElementById('c-new2').value;
      if (n1 !== n2) {
        msg.className = 'form-msg err';
        msg.textContent = '새 비밀번호가 서로 일치하지 않습니다.';
        return;
      }
      var r = SHSAuth.changePassword(SHSAuth.currentUser().id, document.getElementById('c-now').value, n1);
      if (!r.ok) {
        msg.className = 'form-msg err';
        msg.textContent = r.msg;
        return;
      }
      msg.className = 'form-msg ok';
      msg.textContent = '비밀번호가 변경되었습니다.';
      ['c-now', 'c-new', 'c-new2'].forEach(function (id) { document.getElementById(id).value = ''; });
    });

    document.getElementById('btn-withdraw').addEventListener('click', function () {
      var msg = document.getElementById('w-msg2');
      if (!confirm('정말 탈퇴하시겠습니까? 회원 정보가 삭제되며 되돌릴 수 없습니다.')) return;
      var r = SHSAuth.withdraw(SHSAuth.currentUser().id, document.getElementById('w-pw').value);
      if (!r.ok) {
        msg.className = 'form-msg err';
        msg.textContent = r.msg;
        return;
      }
      alert('탈퇴가 완료되었습니다. 그동안 이용해 주셔서 감사합니다.');
      location.href = 'index.html';
    });
  }

  render();
});
</script>
</body>
</html>
